schema_version = "llm-pricing.v1"

# provider：LLM Adapter Base URL 的小写 host；从供应商官方 API 接入文档查看。
# model：发给供应商的精确模型 ID；从供应商官方模型/价格页查看。
# currency 和所有 per_million 单价：从 source_url 指向的官方价格页查看。
# input_cached_per_million 与 input_uncached_per_million 表示缓存命中输入和普通输入价格。
# input_cached/input_uncached 与 input_per_million 二选一；不要同时配置。
# 系统按本条规范化内容自动生成价格快照 SHA-256，不配置人工版本或生效时间。

[[models]]
provider = "api.deepseek.com"
model = "deepseek-v4-pro"
currency = "CNY"
input_cached_per_million = "0.025"
input_uncached_per_million = "3"
output_per_million = "6"
source_url = "https://api-docs.deepseek.com/zh-cn/quick_start/pricing/"
