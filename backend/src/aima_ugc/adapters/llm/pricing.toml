schema_version = "llm-pricing.v1"

# provider：LLM Adapter Base URL 的小写 host；从供应商官方 API 接入文档查看。
# model：发给供应商的精确模型 ID；从供应商官方模型/价格页查看。
# currency 和所有 per_million_tokens 单价：从 source_url 指向的官方价格页查看。
# input_per_million 与完整的 cache_hit/cache_miss 两项二选一；不要同时配置。
# effective_date：本条价格在 AIMA 价格目录中的生效日期，格式固定为 YYYY-MM-DD。
# 系统按币种、单价和来源等规范化价格内容生成快照 SHA-256，不配置人工版本号。

[[models]]
provider = "api.deepseek.com"
model = "deepseek-v4-pro"
currency = "CNY"
input_cache_hit_per_million_tokens = "0.025"
input_cache_miss_per_million_tokens = "3"
output_per_million_tokens = "6"
source_url = "https://api-docs.deepseek.com/zh-cn/quick_start/pricing/"
effective_date = "2026-08-20"
