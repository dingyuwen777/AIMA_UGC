schema_version = "tikhub-pricing.v1"
provider = "tikhub"
currency = "USD"
pricing_version = "2026-08-16.1"
verified_at = "2026-08-16"
official_pricing_url = "https://docs.tikhub.io/4592751m0"
official_endpoint_info_path = "/api/v1/tikhub/user/get_endpoint_info"

# TikHub 官网当前说明“多数服务”为 0.001 USD/请求，但并非全部 endpoint。
# 该值只用于记录官方全局说明，绝不能作为未知 endpoint 的 Dispatch fallback。
default_base_price = "0.001000"
default_price_dispatch_fallback = false

# 官方阶梯折扣规则快照。当前 Stage 1—7 Pricing 只用于 endpoint 费用事实、
# Provider Attempt 成本快照与审计；系统没有请求/金额 Budget、Reservation 或发送预算门禁。
# 发送前仍按 endpoint 已核验 base_price fail-closed；未来折扣或 Budget 策略需新的 L3 Change。
[[tiers]]
min_requests_per_day = 0
max_requests_per_day = 1000
discount_percent = "0"

[[tiers]]
min_requests_per_day = 1000
max_requests_per_day = 5000
discount_percent = "10"

[[tiers]]
min_requests_per_day = 5000
max_requests_per_day = 10000
discount_percent = "20"

[[tiers]]
min_requests_per_day = 10000
max_requests_per_day = 20000
discount_percent = "30"

[[tiers]]
min_requests_per_day = 20000
max_requests_per_day = 30000
discount_percent = "40"

[[tiers]]
min_requests_per_day = 30000
max_requests_per_day = 2147483647
discount_percent = "50"

# 2026-08-15 使用 https://api.tikhub.io 的官方 get_endpoint_info 逐个核验首轮 21 个业务
# endpoint；21/21 返回 HTTP 200，并直接返回 data.endpoint_cost。连续 calculate_price 查询会触发
# HTTP 429，因此 endpoint_cost 是逐 endpoint 基价事实源。
# 2026-08-16 快手 Web/App 同样本评论 A/B 前再次通过 get_endpoint_info 核验 App 一级/二级评论，
# 两者 endpoint_cost 均为 0.001 USD；本版本据此把已批准的 App 主评论链纳入正式 Pricing。

[[endpoints]]
path = "/api/v1/xiaohongshu/app_v2/search_notes"
verification_status = "verified"
base_price = "0.010000"
verified_at = "2026-08-15"
verified_via = "get_endpoint_info"

