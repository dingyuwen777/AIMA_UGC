name: Temporary Issue Profile Green

on:
  push:
    branches:
      - chore/issue-acceptance-closure-profile

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/issue-acceptance-closure-profile
          fetch-depth: 0
      - name: Harden AIMA project Issue Profile checker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/quality/check_agent_governance.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '    "id: invariants",\n    "id: upstream_sources",\n)',
              '    "id: invariants",\n    "id: upstream_sources",\n    "id: validation_requirements",\n)',
              1,
          )
          text = text.replace(
              '    "id: acceptance_criteria",\n    "id: upstream_sources",\n)\nTECHNICAL_CHANGE_FORM_FIELDS',
              '    "id: acceptance_criteria",\n    "id: upstream_sources",\n    "id: validation_requirements",\n)\nTECHNICAL_CHANGE_FORM_FIELDS',
              1,
          )
          text = text.replace(
              '    "id: acceptance_criteria",\n    "id: validation_plan",\n    "id: upstream_sources",\n)',
              '    "id: acceptance_criteria",\n    "id: validation_requirements",\n    "id: upstream_sources",\n)',
              1,
          )

          anchor = '''TECHNICAL_CHANGE_FORM_FIELDS = (\n    "id: motivation",\n    "id: current_state",\n    "id: target_state",\n    "id: scope",\n    "id: non_goals",\n    "id: compatibility_migration",\n    "id: risks_rollback",\n    "id: acceptance_criteria",\n    "id: validation_requirements",\n    "id: upstream_sources",\n)\n'''
          addition = anchor + '''ISSUE_FORM_PROFILES = {\n    "01-requirement.yml": ("需求", "[需求] "),\n    "02-bug.yml": ("缺陷", "[缺陷] "),\n    "03-technical-change.yml": ("技术变更", "[技术变更] "),\n}\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'profile constant anchor count={text.count(anchor)}')
          text = text.replace(anchor, addition, 1)

          old = '''def _check_issue_form(path: Path, required_fields: tuple[str, ...]) -> list[str]:\n    """检查项目 Issue Form 存在且保留最小需求字段。"""\n    if not path.is_file():\n        return [f"GOV012 {path.as_posix()}: 多人协作所需 Issue Form 不存在"]\n\n    text = _read_text(path)\n    errors: list[str] = []\n    for field in required_fields:\n        if field not in text:\n            errors.append(f"GOV012 {path.as_posix()}: 缺少必需需求字段 {field}")\n    if text.count("required: true") < len(required_fields):\n        errors.append(f"GOV012 {path.as_posix()}: 必需需求字段未保持 required 约束")\n    return errors\n'''
          new = '''def _issue_field_block(text: str, field_id: str) -> str | None:\n    """提取 Issue Form 字段块，避免用其他字段的 label/placeholder 误满足公共 Contract。"""\n    marker = f"id: {field_id}"\n    if marker not in text:\n        return None\n    tail = text.split(marker, 1)[1]\n    next_field = tail.find("\\n  - type:")\n    return tail if next_field < 0 else tail[:next_field]\n\n\ndef _check_issue_form(path: Path, required_fields: tuple[str, ...]) -> list[str]:\n    """检查项目 Issue Form 的专项字段与统一公共 Profile。"""\n    if not path.is_file():\n        return [f"GOV012 {path.as_posix()}: 多人协作所需 Issue Form 不存在"]\n\n    text = _read_text(path)\n    errors: list[str] = []\n    for field in required_fields:\n        if field not in text:\n            errors.append(f"GOV012 {path.as_posix()}: 缺少必需需求字段 {field}")\n    if text.count("required: true") < len(required_fields):\n        errors.append(f"GOV012 {path.as_posix()}: 必需需求字段未保持 required 约束")\n\n    profile = ISSUE_FORM_PROFILES.get(path.name)\n    if profile is not None:\n        chooser_name, title_prefix = profile\n        first_lines = text.splitlines()[:4]\n        if f"name: {chooser_name}" not in first_lines:\n            errors.append(\n                f"GOV017 {path.as_posix()}: chooser 名称必须精确为 {chooser_name}"\n            )\n        if f'title: "{title_prefix}"' not in first_lines:\n            errors.append(\n                f"GOV017 {path.as_posix()}: title prefix 必须精确为 {title_prefix!r}"\n            )\n\n    acceptance = _issue_field_block(text, "acceptance_criteria")\n    if acceptance is not None and (\n        "label: 验收标准" not in acceptance or "- [ ] AC1：" not in acceptance\n    ):\n        errors.append(\n            f"GOV017 {path.as_posix()}: acceptance_criteria 必须使用统一验收标准与 AC1 task list"\n        )\n\n    validation = _issue_field_block(text, "validation_requirements")\n    if validation is not None and "label: 验证要求" not in validation:\n        errors.append(\n            f"GOV017 {path.as_posix()}: validation_requirements 必须使用统一验证要求语义"\n        )\n    return errors\n'''
          if text.count(old) != 1:
              raise SystemExit(f'_check_issue_form anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old_pr = '''        if "#123" not in pr_text or "仓库内真实存在" not in pr_text:\n            errors.append(\n                f"GOV014 {PR_TEMPLATE.as_posix()}: 必须公开机器可验证的 Issue / 仓库路径来源格式"\n            )\n'''
          new_pr = old_pr + '''        post_merge_markers = (\n            "需要 post-merge evidence",\n            "不得使用 `Closes` / `Fixes` / `Resolves`",\n            "Closure Audit",\n        )\n        if any(marker not in pr_text for marker in post_merge_markers):\n            errors.append(\n                f"GOV014 {PR_TEMPLATE.as_posix()}: 必须保留 post-merge Evidence 与 Closure Audit 时序"\n            )\n'''
          if text.count(old_pr) != 1:
              raise SystemExit(f'PR checker anchor count={text.count(old_pr)}')
          text = text.replace(old_pr, new_pr, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/unit/test_issue_acceptance_profile.py')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              '''    assert any(\n        error.startswith("GOV014") and "post-merge" in error\n        for error in errors\n    )\n''',
              '''    assert any(error.startswith("GOV014") and "post-merge" in error for error in errors)\n''',
          )
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Verify targeted project governance
        shell: bash
        run: |
          python -m pytest tests/unit/test_issue_acceptance_profile.py tests/unit/test_agent_governance.py -q
          python scripts/quality/check_agent_governance.py

      - name: Commit Green profile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/quality/check_agent_governance.py tests/unit/test_issue_acceptance_profile.py
          git commit -m '强化 AIMA Issue Profile 项目治理门禁'
          git push origin HEAD:chore/issue-acceptance-closure-profile
