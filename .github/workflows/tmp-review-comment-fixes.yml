name: Temporary review comment fixes

on:
  push:
    branches: [fix/310-frontend-fullstack-audit]

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/310-frontend-fullstack-audit
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'frontend/src/features/identity/store.ts',
              '  async function markRead(itemIds: string[]): Promise<void> {',
              '  /** 标记当前 Principal 的通知已读，并以服务端全量未读计数作为最终事实。 */\n  async function markRead(itemIds: string[]): Promise<void> {',
          )
          replace_once(
              'frontend/src/features/import-batches/store.ts',
              '  async function loadCreationOptions(selectedBatchId?: string | null): Promise<void> {',
              '  /** 加载新建补采所需能力、全部合法历史批次和完整启用词包目录。 */\n  async function loadCreationOptions(selectedBatchId?: string | null): Promise<void> {',
          )

          voice = 'frontend/src/features/voice-plaza/store.ts'
          replace_once(
              voice,
              """  const hasActiveAnalysisRuns = computed(() =>
          analysisRuns.value.some((item) =>
            item.status === 'queued' || item.status === 'running' || item.status === 'cancelling'),
        )
        const hasActiveExportJobs = computed(() =>
          exports.value.some((item) => item.job.status === 'queued' || item.job.status === 'running'),
        )
        const hasActiveJobs = computed(() => hasActiveAnalysisRuns.value || hasActiveExportJobs.value)""",
              """  const hasActiveAnalysisRuns = computed(() =>
            analysisRuns.value.some((item) =>
              item.status === 'queued' || item.status === 'running' || item.status === 'cancelling'),
          )
          const hasActiveExportJobs = computed(() =>
            exports.value.some((item) => item.job.status === 'queued' || item.job.status === 'running'),
          )
          const hasActiveJobs = computed(() => hasActiveAnalysisRuns.value || hasActiveExportJobs.value)""",
          )
          replace_once(
              voice,
              """  /** 重新读取当前已加载的 Cursor 窗口，刷新内容状态但不把列表折叠回第一页。 */
        async function refreshLoadedWindow(): Promise<void> {
          const targetCount = Math.max(items.value.length, 20)
          listError.value = null
          error.value = null
          try {
            const refreshed: ContentListItemResponse[] = []
            const seenIds = new Set<string>()
            const seenCursors = new Set<string>()
            let cursor: string | undefined
            let pageHasMore = false
            let pageNext: string | null = null
            while (true) {
              const page = await fetchContents(listParams(cursor))
              for (const item of page.items) {
                if (seenIds.has(item.id)) continue
                seenIds.add(item.id)
                refreshed.push(item)
              }
              pageHasMore = page.has_more
              pageNext = page.next_cursor ?? null
              if (!pageHasMore || !pageNext || refreshed.length >= targetCount || seenCursors.has(pageNext)) break
              seenCursors.add(pageNext)
              cursor = pageNext
            }
            items.value = refreshed
            nextCursor.value = pageNext
            hasMore.value = pageHasMore
            selectedIds.value = selectedIds.value.filter((id) => seenIds.has(id))
            if (detail.value) detail.value = await fetchContentDetail(detail.value.id)
          } catch (reason) {
            const message = errorMessage(reason)
            listError.value = message
            error.value = message
          }
        }

        async function refreshAnalysisCapabilities(): Promise<void> {""",
              """  /** 重新读取当前已加载的 Cursor 窗口，刷新内容状态但不把列表折叠回第一页。 */
          async function refreshLoadedWindow(): Promise<void> {
            const targetCount = Math.max(items.value.length, 20)
            listError.value = null
            error.value = null
            try {
              const refreshed: ContentListItemResponse[] = []
              const seenIds = new Set<string>()
              const seenCursors = new Set<string>()
              let cursor: string | undefined
              let pageHasMore = false
              let pageNext: string | null = null
              while (true) {
                const page = await fetchContents(listParams(cursor))
                for (const item of page.items) {
                  if (seenIds.has(item.id)) continue
                  seenIds.add(item.id)
                  refreshed.push(item)
                }
                pageHasMore = page.has_more
                pageNext = page.next_cursor ?? null
                if (!pageHasMore || !pageNext || refreshed.length >= targetCount || seenCursors.has(pageNext)) break
                seenCursors.add(pageNext)
                cursor = pageNext
              }
              items.value = refreshed
              nextCursor.value = pageNext
              hasMore.value = pageHasMore
              selectedIds.value = selectedIds.value.filter((id) => seenIds.has(id))
              if (detail.value) detail.value = await fetchContentDetail(detail.value.id)
            } catch (reason) {
              const message = errorMessage(reason)
              listError.value = message
              error.value = message
            }
          }

          async function refreshAnalysisCapabilities(): Promise<void> {""",
          )
          replace_once(
              voice,
              '  async function reviewRelevance(\n',
              '  /** 提交相关性人工复核，并刷新当前已加载窗口而不折叠分页。 */\n  async function reviewRelevance(\n',
          )
          replace_once(
              voice,
              '  async function reviewDetailVehicles(\n',
              '  /** 保存详情页车型人工结论，并保持当前列表分页窗口。 */\n  async function reviewDetailVehicles(\n',
          )
          replace_once(
              voice,
              '  async function reviewDetailAnalysis(\n',
              '  /** 保存详情页分析人工纠正，并保持当前列表分页窗口。 */\n  async function reviewDetailAnalysis(\n',
          )
          replace_once(
              voice,
              """  /** 刷新后台 Job 状态；仅分析任务需要同步内容窗口，纯导出任务不重载列表。 */
        async function poll(): Promise<void> {
          if (document.visibilityState === 'hidden' || !hasActiveJobs.value) return
          try {
            const tasks: Promise<unknown>[] = [refreshExports(), refreshAnalysisRuns()]
            if (hasActiveAnalysisRuns.value) tasks.push(refreshLoadedWindow())
            await Promise.all(tasks)
          } catch (reason) {
            error.value = errorMessage(reason)
          }
        }""",
              """  /** 刷新后台 Job 状态；仅分析任务需要同步内容窗口，纯导出任务不重载列表。 */
          async function poll(): Promise<void> {
            if (document.visibilityState === 'hidden' || !hasActiveJobs.value) return
            try {
              const tasks: Promise<unknown>[] = [refreshExports(), refreshAnalysisRuns()]
              if (hasActiveAnalysisRuns.value) tasks.push(refreshLoadedWindow())
              await Promise.all(tasks)
            } catch (reason) {
              error.value = errorMessage(reason)
            }
          }""",
          )
          PY

      - name: Verify review fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = "frontend/src/features/identity/store.ts frontend/src/features/import-batches/store.ts frontend/src/features/voice-plaza/store.ts "

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Review-fix Green
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix frontend
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run test -- --run

      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/identity/store.ts frontend/src/features/import-batches/store.ts frontend/src/features/voice-plaza/store.ts
          git commit -m "fix: 补齐审计修复函数说明并整理排版" -m "Requirement-Source: #310"
          git push origin HEAD:fix/310-frontend-fullstack-audit
