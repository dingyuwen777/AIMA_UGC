name: DEV Fix Stale User Voice Integration

on:
  push:
    branches:
      - feature/remove-derived-user-voice-final2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/remove-derived-user-voice-final2
          fetch-depth: 0

      - name: Remove stale integration assertion from actual file
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/integration/content/test_stage8d_voice_plaza_runtime.py')
          text = path.read_text(encoding='utf-8')
          stale = '        assert audited.analysis.is_user_voice is False\n'
          count = text.count(stale)
          if count != 1:
              raise SystemExit(f'expected exactly one stale integration assertion, found {count}')
          text = text.replace(stale, '', 1)
          if '.is_user_voice' in text:
              raise SystemExit('another stale .is_user_voice integration assertion remains')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check -- tests/integration/content/test_stage8d_voice_plaza_runtime.py

      - name: Commit fix and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/dev-fix-stale-user-voice-integration.yml
          git add -- tests/integration/content/test_stage8d_voice_plaza_runtime.py
          git diff --cached --check
          git commit -m "同步删除过期用户发声集成断言"
          git push origin HEAD:feature/remove-derived-user-voice-final2
