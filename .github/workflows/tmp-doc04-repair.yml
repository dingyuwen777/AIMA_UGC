name: Temporary Doc04 Repair

on:
  push:
    branches:
      - chore/agent-skills-project-governance

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: chore/agent-skills-project-governance
          fetch-depth: 0

      - name: Restore full migrated document and remove obsolete skill entry
        shell: bash
        run: |
          set -euo pipefail
          git checkout 903adeb21ad62ce750a3783d80a10d95ce3fb99a -- 'docs/04_测试与调试说明.md'
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/04_测试与调试说明.md')
          text = path.read_text(encoding='utf-8')
          obsolete = '- [`.agents/skills/reliable-vibe-coding/SKILL.md`](../.agents/skills/reliable-vibe-coding/SKILL.md)\n'
          if obsolete not in text:
              raise SystemExit('obsolete skill entry not found in restored baseline')
          path.write_text(text.replace(obsolete, '', 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'docs/04_测试与调试说明.md'
          git commit -m "恢复测试文档完整内容并移除失效入口"
          git push origin HEAD:chore/agent-skills-project-governance
