name: Stage2 Review Fixes

on:
  push:
    branches:
      - feature/stage2-brand-vehicle-management-resolver

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/stage2-review/data
      AIMA_LOG_DIR: .runtime/stage2-review/logs
      AIMA_SECRET_DIR: .runtime/stage2-review/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frozen environments
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
          npm ci --prefix frontend
      - name: Apply independent review fixes
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/dev/stage2_review_fixes.py
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/src/aima_ugc/bootstrap/administration_http.py")
          text = path.read_text(encoding="utf-8")
          old = "previous = repository.get_model(vehicle_model_id)"
          new = "previous = repository.get_model(vehicle_model_id, for_update=True)"
          if old not in text:
              raise SystemExit("expected update audit lock patch target not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Format and static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format backend/src tests/unit/test_brand_vehicle_resolver.py \
            tests/api/test_brand_vehicle_stage2_contract.py \
            tests/integration/database/test_brand_vehicle_stage2_repository.py
          uv run ruff check backend/src tests/unit/test_brand_vehicle_resolver.py \
            tests/api/test_brand_vehicle_stage2_contract.py \
            tests/integration/database/test_brand_vehicle_stage2_repository.py
          uv run mypy backend/src
      - name: Resolver and API contract regression
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/test_brand_vehicle_resolver.py -q
          uv run pytest tests/api/test_brand_vehicle_stage2_contract.py -q
      - name: PostgreSQL regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'ci-postgres' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"
          uv run alembic upgrade head
          uv run alembic check
          uv run pytest tests/integration/database/test_brand_vehicle_stage2_repository.py -q
          uv run pytest tests/integration/database/test_u1_u5_administration.py -q
      - name: Regenerate public artifacts
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
      - name: Remove one-shot helpers and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/stage2-review-fixes.yml scripts/dev/stage2_review_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend tests docs contracts frontend/src/generated/api
          git diff --cached --check
          git commit -m "修复：消除 Stage 2 Alias 歧义与并发归属窗口"
          git push origin HEAD:${GITHUB_REF_NAME}
