name: Stage 7 Green Endpoint Ledger Dynamic Key

on:
  push:
    branches:
      - feature/stage7-completion
    paths:
      - ".github/workflows/stage7-green-endpoint-ledger-dynamic-key.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage7-completion
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Apply dynamic mapping-key sanitizer
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin feature/stage7-completion
          python -c 'from pathlib import Path; p=Path("scripts/dev/probe_tikhub_endpoint_ledger.py"); t=p.read_text(encoding="utf-8"); old="def sanitize_response(\n"; helper="def _sanitize_mapping_key(key: object, pseudonyms: Pseudonymizer) -> str:\n    text = str(key)\n    if _LONG_NUMERIC_IDENTIFIER.search(text):\n        return str(pseudonyms.identifier(text))\n    return text\n\n\n"; assert t.count(old)==1, "sanitize_response anchor missing or ambiguous"; t=t.replace(old,helper+old); old2="            str(child_key): sanitize_response(\n"; new2="            _sanitize_mapping_key(child_key, pseudonyms): sanitize_response(\n"; assert t.count(old2)==1, "mapping key anchor missing or ambiguous"; p.write_text(t.replace(old2,new2), encoding="utf-8")'
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
          uv run ruff format scripts/dev/probe_tikhub_endpoint_ledger.py tests/unit/collection/test_tikhub_endpoint_ledger_sanitizer.py
          uv run ruff check --fix scripts/dev/probe_tikhub_endpoint_ledger.py tests/unit/collection/test_tikhub_endpoint_ledger_sanitizer.py
          uv run ruff format --check scripts/dev/probe_tikhub_endpoint_ledger.py tests/unit/collection/test_tikhub_endpoint_ledger_sanitizer.py
          uv run ruff check scripts/dev/probe_tikhub_endpoint_ledger.py tests/unit/collection/test_tikhub_endpoint_ledger_sanitizer.py
          uv run pytest tests/unit/collection/test_tikhub_endpoint_ledger_sanitizer.py -q
          git diff --check
      - name: Commit verified Green
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/stage7-green-endpoint-ledger-dynamic-key.yml
          git add scripts/dev/probe_tikhub_endpoint_ledger.py tests/unit/collection/test_tikhub_endpoint_ledger_sanitizer.py
          git diff --cached --check
          git config user.name "AIMA Stage 7 Runner"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "修复 Endpoint Ledger 动态数字键去标识化"
          git push origin HEAD:feature/stage7-completion
