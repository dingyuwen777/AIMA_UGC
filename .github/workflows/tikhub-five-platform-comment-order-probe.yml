name: TikHub Bilibili Time Order Probe

on:
  push:
    branches: [agent/tikhub-test-debug]
    paths: [".github/workflows/tikhub-five-platform-comment-order-probe.yml"]

permissions:
  contents: read
  pull-requests: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/tikhub-test-debug
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Generate one-time RSA handoff key
        shell: bash
        run: |
          set -euo pipefail
          secure_dir="${RUNNER_TEMP}/tikhub-bilibili-secret"
          mkdir -p "${secure_dir}"
          chmod 700 "${secure_dir}"
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "${secure_dir}/private.pem"
          chmod 600 "${secure_dir}/private.pem"
          openssl pkey -in "${secure_dir}/private.pem" -pubout -out "${secure_dir}/public.pem"
      - name: Upload one-time public key
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tikhub-bilibili-public-key-${{ github.run_id }}
          path: ${{ runner.temp }}/tikhub-bilibili-secret/public.pem
          retention-days: 1
          compression-level: 9
      - name: Receive encrypted TikHub credential
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          secure_dir="${RUNNER_TEMP}/tikhub-bilibili-secret"
          marker="<!-- tikhub-bilibili-ciphertext:${GITHUB_RUN_ID} -->"
          ciphertext=""
          for _ in $(seq 1 120); do
            body="$(curl --fail --silent --show-error --header "Authorization: Bearer ${GH_TOKEN}" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/63" | jq -r '.body // ""')"
            ciphertext="$(printf '%s' "${body}" | jq -Rrs --arg marker "${marker}" 'split($marker) | if length > 1 then .[1] | split("\n") | map(select(length > 0))[0] // "" else "" end')"
            if [ -n "${ciphertext}" ]; then break; fi
            sleep 5
          done
          test -n "${ciphertext}"
          printf '%s' "${ciphertext}" | base64 --decode > "${secure_dir}/cipher.bin"
          openssl pkeyutl -decrypt -inkey "${secure_dir}/private.pem" -in "${secure_dir}/cipher.bin" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 -out "${secure_dir}/token"
          token="$(cat "${secure_dir}/token")"
          test "${#token}" -ge 16
          echo "::add-mask::${token}"
          rm -f "${secure_dir}/cipher.bin"
      - name: Probe Bilibili current time-sort first page
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "${RUNNER_TEMP}/tikhub-bilibili-secret/token")"
          echo "::add-mask::${token}"
          export AIMA_TIKHUB_TOKEN="${token}"
          uv run python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import UTC, datetime
          from uuid import uuid4

          from pydantic import SecretStr

          from aima_ugc.adapters.providers.tikhub import runtime
          from aima_ugc.adapters.providers.tikhub.transport import TikHubHttpTransport

          credential = SecretStr(os.environ["AIMA_TIKHUB_TOKEN"])

          def send(transport, call):
              response = transport.send(call.transport_request(credential))
              if response.status_code is not None and response.status_code >= 400:
                  raise RuntimeError(f"{call.operation}: HTTP {response.status_code}")
              if not isinstance(response.body, dict):
                  raise RuntimeError(f"{call.operation}: non-object response")
              return response.body

          def ctx(operation, content_id=None):
              return runtime.mapping_context(
                  provider_request_id=str(uuid4()),
                  provider_attempt_id=str(uuid4()),
                  raw_artifact_id=uuid4(),
                  operation=operation,
                  source_type="keyword_search",
                  source_value="爱玛",
                  observed_at=datetime.now(UTC),
                  external_content_id=content_id,
              )

          out = {"keyword": "爱玛", "status": "started"}
          try:
              with TikHubHttpTransport(base_url="https://api.tikhub.io", timeout_seconds=30) as transport:
                  search_call = runtime.build_search_call(
                      platform="bilibili",
                      keyword="爱玛",
                      config={"sort_mode": "play_count", "content_type": "video"},
                      state=None,
                  )
                  search_body = send(transport, search_call)
                  candidates = []
                  for index, raw in enumerate(runtime.extract_search_items("bilibili", search_body)[:5]):
                      search_content = runtime.map_content(
                          platform="bilibili",
                          raw=raw,
                          context=ctx(search_call.operation),
                          item_locator=f"search.items[{index}]",
                      )
                      detail_call = runtime.build_detail_call("bilibili", search_content)
                      detail_body = send(transport, detail_call)
                      for item_index, detail_raw in enumerate(runtime.extract_detail_items("bilibili", detail_body)):
                          detail = runtime.map_content(
                              platform="bilibili",
                              raw=detail_raw,
                              context=ctx(detail_call.operation, search_content.external_content_id),
                              item_locator=f"detail.items[{item_index}]",
                          )
                          if detail.external_content_id == search_content.external_content_id:
                              candidates.append(detail)
                              break
                  if not candidates:
                      raise RuntimeError("no mapped Bilibili detail candidate")
                  selected = max(
                      candidates,
                      key=lambda item: item.metrics.comment_count if item.metrics.comment_count is not None else -1,
                  )
                  comments_call = runtime.build_comments_call(
                      platform="bilibili",
                      external_content_id=selected.external_content_id,
                      state=None,
                  )
                  comments_body = send(transport, comments_call)
                  items = runtime.extract_comment_items("bilibili", comments_body)
                  comment_ids = []
                  times = []
                  for index, raw in enumerate(items):
                      mapped = runtime.map_comment(
                          platform="bilibili",
                          raw=raw,
                          context=ctx(comments_call.operation, selected.external_content_id),
                          item_locator=f"comments.items[{index}]",
                          is_root=True,
                      )
                      comment_ids.append(mapped.external_comment_id)
                      if mapped.published_at is not None:
                          times.append(mapped.published_at)
                  out = {
                      "keyword": "爱玛",
                      "status": "completed",
                      "selected_reported_comment_count": selected.metrics.comment_count,
                      "request_mode": comments_call.params.get("mode"),
                      "request_next_offset": comments_call.params.get("next_offset"),
                      "comment_count": len(items),
                      "unique_comment_id_count": len(set(comment_ids)),
                      "time_count": len(times),
                      "time_nonincreasing": len(times) >= 2 and all(a >= b for a, b in zip(times, times[1:])),
                  }
          except Exception as exc:
              out = {
                  "keyword": "爱玛",
                  "status": "failed",
                  "error_type": type(exc).__name__,
                  "error_summary": str(exc)[:200],
              }
          print(json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True))
          PY
          unset AIMA_TIKHUB_TOKEN
      - name: Remove ephemeral credential material
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/tikhub-bilibili-secret"
