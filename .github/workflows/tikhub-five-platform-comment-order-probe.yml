name: TikHub Focused Identity Probe

on:
  push:
    branches:
      - agent/tikhub-test-debug
    paths:
      - ".github/workflows/tikhub-five-platform-comment-order-probe.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/tikhub-test-debug
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Generate one-time RSA handoff key
        shell: bash
        run: |
          set -euo pipefail
          secure_dir="${RUNNER_TEMP}/tikhub-secret"
          mkdir -p "${secure_dir}"
          chmod 700 "${secure_dir}"
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "${secure_dir}/private.pem"
          chmod 600 "${secure_dir}/private.pem"
          openssl pkey -in "${secure_dir}/private.pem" -pubout -out "${secure_dir}/public.pem"
      - name: Upload one-time public key
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tikhub-focused-public-key-${{ github.run_id }}
          path: ${{ runner.temp }}/tikhub-secret/public.pem
          retention-days: 1
          compression-level: 9
      - name: Receive encrypted credential
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          secure_dir="${RUNNER_TEMP}/tikhub-secret"
          marker="<!-- tikhub-focused-ciphertext:${GITHUB_RUN_ID} -->"
          ciphertext=""
          for _ in $(seq 1 120); do
            body="$(curl --fail --silent --show-error --header "Authorization: Bearer ${GH_TOKEN}" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/63" | jq -r '.body // ""')"
            ciphertext="$(printf '%s' "${body}" | jq -Rrs --arg marker "${marker}" 'split($marker) | if length > 1 then .[1] | split("\n") | map(select(length > 0))[0] // "" else "" end')"
            if [ -n "${ciphertext}" ]; then break; fi
            sleep 5
          done
          test -n "${ciphertext}"
          printf '%s' "${ciphertext}" | base64 --decode > "${secure_dir}/cipher.bin"
          openssl pkeyutl -decrypt -inkey "${secure_dir}/private.pem" -in "${secure_dir}/cipher.bin" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 -out "${secure_dir}/token"
          token="$(cat "${secure_dir}/token")"
          test "${#token}" -ge 16
          echo "::add-mask::${token}"
      - name: Run focused real probe
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "${RUNNER_TEMP}/tikhub-secret/token")"
          echo "::add-mask::${token}"
          export AIMA_TIKHUB_TOKEN="${token}"
          uv run python - <<'PY'
          from __future__ import annotations
          import json, os
          from datetime import UTC, datetime
          from uuid import uuid4
          from pydantic import SecretStr
          from aima_ugc.adapters.providers.tikhub import runtime
          from aima_ugc.adapters.providers.tikhub.operations import bilibili, weibo
          from aima_ugc.adapters.providers.tikhub.transport import TikHubHttpTransport

          credential = SecretStr(os.environ["AIMA_TIKHUB_TOKEN"])
          def send(t, req):
              call = runtime.TikHubOperationCall("bilibili" if "bilibili" in req.path else "weibo", "probe", "probe", req.method, req.path, req.params, body=req.body)
              response = t.send(call.transport_request(credential))
              if response.status_code is not None and response.status_code >= 400: raise RuntimeError(f"HTTP {response.status_code}")
              if not isinstance(response.body, dict): raise RuntimeError("non-object")
              return response.body
          def ctx(operation, content_id=None):
              return runtime.mapping_context(provider_request_id=str(uuid4()), provider_attempt_id=str(uuid4()), raw_artifact_id=uuid4(), operation=operation, source_type="keyword_search", source_value="爱玛", observed_at=datetime.now(UTC), external_content_id=content_id)

          out = {"weibo": {}, "bilibili": {}}
          with TikHubHttpTransport(base_url="https://api.tikhub.io", timeout_seconds=30) as t:
              # Weibo: filter only mblog cards with stable IDs before probing comments.
              try:
                  search = weibo.build_search_request(keyword="爱玛", page=1, search_mode="hot", time_scope="week")
                  body = send(t, search)
                  outer = body.get("data") if isinstance(body.get("data"), dict) else {}
                  provider = outer.get("data") if isinstance(outer, dict) and isinstance(outer.get("data"), dict) else outer
                  cards = provider.get("cards") if isinstance(provider, dict) else []
                  rows = []
                  if isinstance(cards, list):
                      for card in cards:
                          if not isinstance(card, dict) or not isinstance(card.get("mblog"), dict): continue
                          mblog = card["mblog"]
                          stable = next((mblog.get(k) for k in ("idstr","mid","id") if mblog.get(k) not in (None,"")), None)
                          count = mblog.get("comments_count")
                          rows.append((stable, count if isinstance(count, int) and not isinstance(count, bool) else -1))
                  valid = [(sid, count) for sid, count in rows if sid is not None]
                  selected_id, selected_count = max(valid, key=lambda item: item[1])
                  comments = weibo.build_status_comments_request(status_id=str(selected_id), sort_mode="latest")
                  comment_body = send(t, comments)
                  items = weibo.extract_comment_items(comment_body)
                  data = comment_body.get("data") if isinstance(comment_body.get("data"), dict) else {}
                  more = data.get("moreInfo") if isinstance(data, dict) else None
                  cursor = None
                  if isinstance(more, dict) and isinstance(more.get("params"), dict): cursor = more["params"].get("max_id")
                  times = []
                  for i, raw in enumerate(items):
                      mapped = runtime.map_comment(platform="weibo", raw=raw, context=ctx("fetch_status_comments", str(selected_id)), item_locator=f"comments[{i}]", is_root=True)
                      if mapped.published_at is not None: times.append(mapped.published_at)
                  out["weibo"] = {
                      "mblog_card_count": len(rows), "stable_id_card_count": len(valid),
                      "selected_reported_comment_count": selected_count,
                      "first_page_count": len(items), "more_info_present": isinstance(more, dict),
                      "cursor_present": cursor not in (None,0,"0",""),
                      "time_count": len(times), "time_nonincreasing": len(times) >= 2 and all(a >= b for a,b in zip(times,times[1:])),
                      "data_keys": sorted(str(k) for k in data.keys()) if isinstance(data, dict) else [],
                  }
              except Exception as exc:
                  out["weibo"] = {"error_type": type(exc).__name__, "error_summary": str(exc)[:200]}

              # Bilibili: compare search param identity with detail aid/bvid and comments by each canonical identity.
              try:
                  search = bilibili.build_search_request(keyword="爱玛", sort_mode="play_count", search_type="video")
                  search_body = send(t, search)
                  raw_items = runtime.extract_search_items("bilibili", search_body)
                  candidates = []
                  for raw in raw_items[:10]:
                      param = raw.get("param") if isinstance(raw, dict) else None
                      if not isinstance(param, str) or not param: continue
                      if param.startswith("BV"):
                          detail_req = bilibili.build_video_detail_request(bv_id=param)
                          kind = "bv"
                      else:
                          normalized = param[2:] if param.lower().startswith("av") else param
                          detail_req = bilibili.build_video_detail_request(av_id=normalized)
                          kind = "av_prefixed" if param.lower().startswith("av") else "numeric"
                      detail_body = send(t, detail_req)
                      detail_items = runtime.extract_detail_items("bilibili", detail_body)
                      if not detail_items: continue
                      detail = detail_items[0]
                      aid = detail.get("aid")
                      bvid = detail.get("bvid")
                      stat = detail.get("stat") if isinstance(detail.get("stat"), dict) else {}
                      reply_count = stat.get("reply") if isinstance(stat, dict) else None
                      candidates.append((reply_count if isinstance(reply_count,int) and not isinstance(reply_count,bool) else -1, kind, param, aid, bvid))
                  selected_count, kind, param, aid, bvid = max(candidates, key=lambda item: item[0])
                  aid_body = send(t, bilibili.build_video_comments_request(av_id=str(aid), sort_mode="latest")) if aid not in (None,"") else {}
                  bv_body = send(t, bilibili.build_video_comments_request(bv_id=str(bvid), sort_mode="latest")) if bvid not in (None,"") else {}
                  aid_items = bilibili.extract_comment_items(aid_body) if aid_body else ()
                  bv_items = bilibili.extract_comment_items(bv_body) if bv_body else ()
                  out["bilibili"] = {
                      "search_param_kind": kind,
                      "search_param_matches_detail_aid": str(param).removeprefix("av") == str(aid),
                      "search_param_matches_detail_bvid": str(param) == str(bvid),
                      "detail_reported_comment_count": selected_count,
                      "comments_by_aid_count": len(aid_items),
                      "comments_by_bvid_count": len(bv_items),
                      "mode": bilibili.build_video_comments_request(av_id="1", sort_mode="latest").params.get("mode"),
                  }
              except Exception as exc:
                  out["bilibili"] = {"error_type": type(exc).__name__, "error_summary": str(exc)[:200]}
          print(json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True))
          PY
          unset AIMA_TIKHUB_TOKEN
      - name: Remove ephemeral credential material
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/tikhub-secret"
