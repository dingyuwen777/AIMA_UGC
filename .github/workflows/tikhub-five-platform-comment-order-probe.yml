name: TikHub Five Platform Comment Order Probe

on:
  push:
    branches:
      - agent/tikhub-test-debug
    paths:
      - ".github/workflows/tikhub-five-platform-comment-order-probe.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/tikhub-test-debug

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Verify api.tikhub.io connectivity
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 https://api.tikhub.io/openapi.json)"
          test "${status}" = "200"

      - name: Generate one-time RSA handoff key
        shell: bash
        run: |
          set -euo pipefail
          secure_dir="${RUNNER_TEMP}/tikhub-five-platform-secret"
          mkdir -p "${secure_dir}"
          chmod 700 "${secure_dir}"
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "${secure_dir}/private.pem"
          chmod 600 "${secure_dir}/private.pem"
          openssl pkey -in "${secure_dir}/private.pem" -pubout \
            -out "${secure_dir}/public.pem"

      - name: Upload one-time public key
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tikhub-five-platform-public-key-${{ github.run_id }}
          path: ${{ runner.temp }}/tikhub-five-platform-secret/public.pem
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Receive encrypted TikHub credential
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          secure_dir="${RUNNER_TEMP}/tikhub-five-platform-secret"
          marker="<!-- tikhub-five-platform-ciphertext:${GITHUB_RUN_ID} -->"
          ciphertext=""
          for _ in $(seq 1 120); do
            pr_body="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/63" | jq -r '.body // ""')"
            ciphertext="$(printf '%s' "${pr_body}" | jq -Rrs --arg marker "${marker}" \
              'split($marker) | if length > 1 then .[1] | split("\n") | map(select(length > 0))[0] // "" else "" end')"
            if [ -n "${ciphertext}" ]; then
              break
            fi
            sleep 5
          done
          test -n "${ciphertext}"
          printf '%s' "${ciphertext}" | base64 --decode > "${secure_dir}/ciphertext.bin"
          openssl pkeyutl -decrypt \
            -inkey "${secure_dir}/private.pem" \
            -in "${secure_dir}/ciphertext.bin" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out "${secure_dir}/token"
          chmod 600 "${secure_dir}/token"
          token="$(cat "${secure_dir}/token")"
          test "${#token}" -ge 16
          echo "::add-mask::${token}"
          rm -f "${secure_dir}/ciphertext.bin"

      - name: Run five-platform real comment probe
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "${RUNNER_TEMP}/tikhub-five-platform-secret/token")"
          echo "::add-mask::${token}"
          env_file="backend/src/aima_ugc/adapters/providers/tikhub_test/.env"
          umask 077
          printf 'TIKHUB_BASE_URL=https://api.tikhub.io\nTIKHUB_API_KEY=%s\nTIKHUB_TIMEOUT_SECONDS=30\n' "${token}" > "${env_file}"
          export AIMA_TIKHUB_REAL_OUTPUT="${RUNNER_TEMP}/tikhub-five-platform"

          uv run python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from collections import Counter
          from datetime import datetime
          from pathlib import Path

          from aima_ugc.adapters.providers.tikhub.runtime import build_comments_call
          from aima_ugc.adapters.providers.tikhub_test.bilibili import run_bilibili
          from aima_ugc.adapters.providers.tikhub_test.douyin import run_douyin
          from aima_ugc.adapters.providers.tikhub_test.kuaishou import run_kuaishou
          from aima_ugc.adapters.providers.tikhub_test.weibo import run_weibo
          from aima_ugc.adapters.providers.tikhub_test.xiaohongshu import run_xiaohongshu

          root = Path(os.environ["AIMA_TIKHUB_REAL_OUTPUT"])
          root.mkdir(parents=True, exist_ok=True)
          env_file = Path("backend/src/aima_ugc/adapters/providers/tikhub_test/.env")

          runs = (
              ("xhs", run_xiaohongshu, {"sort_mode": "latest", "published_within": "1d", "content_type": "all"}),
              ("douyin", run_douyin, {"sort_mode": "latest", "published_within": "1d", "duration": "all", "content_type": "all"}),
              ("weibo", run_weibo, {"sort_mode": "latest", "published_within": "day"}),
              ("bilibili", run_bilibili, {"sort_mode": "latest", "content_type": "video"}),
              ("kuaishou", run_kuaishou, {}),
          )

          def read_jsonl(path: Path) -> list[dict[str, object]]:
              if not path.exists():
                  return []
              rows = []
              for line in path.read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      value = json.loads(line)
                      if isinstance(value, dict):
                          rows.append(value)
              return rows

          def parse_time(value: object) -> datetime | None:
              if not isinstance(value, str) or not value:
                  return None
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  return None

          summary: dict[str, object] = {"keyword": "爱玛", "platforms": {}}
          platforms = summary["platforms"]
          assert isinstance(platforms, dict)

          for platform, function, kwargs in runs:
              try:
                  result = function(
                      keyword="爱玛",
                      env_file=env_file,
                      output_root=root,
                      run_id=f"real-order-{platform}",
                      max_search_pages=2,
                      max_contents=5,
                      max_comments_per_content=40,
                      max_comment_pages_per_content=2,
                      max_replies_per_root=3,
                      max_reply_pages_per_root=1,
                      include_comments=True,
                      include_replies=False,
                      force_refresh=True,
                      **kwargs,
                  )
                  manifest = json.loads(result.manifest_path.read_text(encoding="utf-8"))
                  comments = read_jsonl(result.run_dir / "canonical" / "comments.jsonl")
                  roots = [
                      row
                      for row in comments
                      if row.get("parent_comment_id") is None
                      and row.get("root_comment_id") == row.get("external_comment_id")
                  ]
                  ids = [str(row.get("external_comment_id")) for row in roots]
                  times = [parse_time(row.get("published_at")) for row in roots]
                  known_times = [item for item in times if item is not None]
                  nonincreasing = all(
                      current >= following
                      for current, following in zip(known_times, known_times[1:])
                  )
                  requests = manifest.get("requests", [])
                  operations = Counter(
                      str(item.get("operation"))
                      for item in requests
                      if isinstance(item, dict)
                  )
                  comment_call = build_comments_call(
                      platform=platform,
                      external_content_id="probe-content-id",
                  )
                  platforms[platform] = {
                      "status": "completed",
                      "content_count": result.content_count,
                      "root_comment_count": result.root_comment_count,
                      "reply_count": result.reply_count,
                      "request_count": result.request_count,
                      "root_comment_ids_unique": len(ids) == len(set(ids)),
                      "root_comments_with_time": len(known_times),
                      "root_comment_time_nonincreasing": nonincreasing if len(known_times) >= 2 else None,
                      "operations": dict(operations),
                      "comment_request_params": {
                          key: value
                          for key, value in comment_call.params.items()
                          if key not in {"aweme_id", "status_id", "av_id", "bv_id", "photo_id", "note_id"}
                      },
                  }
              except Exception as exc:
                  platforms[platform] = {
                      "status": "failed",
                      "error_type": type(exc).__name__,
                      "error_summary": str(exc)[:500],
                  }

          summary_path = root / "summary.json"
          summary_path.write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(summary_path.read_text(encoding="utf-8"))
          PY

          rm -f "${env_file}"
          rm -rf "${RUNNER_TEMP}/tikhub-five-platform"/xhs/runs \
                 "${RUNNER_TEMP}/tikhub-five-platform"/douyin/runs \
                 "${RUNNER_TEMP}/tikhub-five-platform"/weibo/runs \
                 "${RUNNER_TEMP}/tikhub-five-platform"/bilibili/runs \
                 "${RUNNER_TEMP}/tikhub-five-platform"/kuaishou/runs

      - name: Upload sanitized summary only
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tikhub-five-platform-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/tikhub-five-platform/summary.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Remove ephemeral credential material
        if: always()
        shell: bash
        run: |
          rm -f backend/src/aima_ugc/adapters/providers/tikhub_test/.env
          rm -rf "${RUNNER_TEMP}/tikhub-five-platform-secret"
