name: TikHub Five Platform Comment Order Probe

on:
  push:
    branches:
      - agent/tikhub-test-debug
    paths:
      - ".github/workflows/tikhub-five-platform-comment-order-probe.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/tikhub-test-debug
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Verify api.tikhub.io connectivity
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 https://api.tikhub.io/openapi.json)"
          test "${status}" = "200"
      - name: Generate one-time RSA handoff key
        shell: bash
        run: |
          set -euo pipefail
          secure_dir="${RUNNER_TEMP}/tikhub-five-platform-secret"
          mkdir -p "${secure_dir}"
          chmod 700 "${secure_dir}"
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "${secure_dir}/private.pem"
          chmod 600 "${secure_dir}/private.pem"
          openssl pkey -in "${secure_dir}/private.pem" -pubout -out "${secure_dir}/public.pem"
      - name: Upload one-time public key
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tikhub-five-platform-public-key-${{ github.run_id }}
          path: ${{ runner.temp }}/tikhub-five-platform-secret/public.pem
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
      - name: Receive encrypted TikHub credential
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          secure_dir="${RUNNER_TEMP}/tikhub-five-platform-secret"
          marker="<!-- tikhub-five-platform-ciphertext:${GITHUB_RUN_ID} -->"
          ciphertext=""
          for _ in $(seq 1 120); do
            pr_body="$(curl --fail --silent --show-error --header "Authorization: Bearer ${GH_TOKEN}" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/63" | jq -r '.body // ""')"
            ciphertext="$(printf '%s' "${pr_body}" | jq -Rrs --arg marker "${marker}" 'split($marker) | if length > 1 then .[1] | split("\n") | map(select(length > 0))[0] // "" else "" end')"
            if [ -n "${ciphertext}" ]; then break; fi
            sleep 5
          done
          test -n "${ciphertext}"
          printf '%s' "${ciphertext}" | base64 --decode > "${secure_dir}/ciphertext.bin"
          openssl pkeyutl -decrypt -inkey "${secure_dir}/private.pem" -in "${secure_dir}/ciphertext.bin" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 -out "${secure_dir}/token"
          chmod 600 "${secure_dir}/token"
          token="$(cat "${secure_dir}/token")"
          test "${#token}" -ge 16
          echo "::add-mask::${token}"
          rm -f "${secure_dir}/ciphertext.bin"
      - name: Run targeted live probe
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "${RUNNER_TEMP}/tikhub-five-platform-secret/token")"
          echo "::add-mask::${token}"
          export AIMA_TIKHUB_REAL_TOKEN="${token}"
          export AIMA_TIKHUB_REAL_OUTPUT="${RUNNER_TEMP}/tikhub-five-platform"
          uv run python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          from typing import Any
          from uuid import uuid4

          from pydantic import SecretStr
          from aima_ugc.adapters.providers.tikhub import runtime
          from aima_ugc.adapters.providers.tikhub.transport import TikHubHttpTransport

          root = Path(os.environ["AIMA_TIKHUB_REAL_OUTPUT"])
          root.mkdir(parents=True, exist_ok=True)
          credential = SecretStr(os.environ["AIMA_TIKHUB_REAL_TOKEN"])

          def send(transport: TikHubHttpTransport, call: runtime.TikHubOperationCall) -> dict[str, Any]:
              response = transport.send(call.transport_request(credential))
              if response.status_code is not None and response.status_code >= 400:
                  raise RuntimeError(f"{call.operation}: HTTP {response.status_code}")
              if not isinstance(response.body, dict):
                  raise RuntimeError(f"{call.operation}: non-object response")
              return response.body

          def ctx(operation: str, *, content_id: str | None = None):
              return runtime.mapping_context(
                  provider_request_id=str(uuid4()),
                  provider_attempt_id=str(uuid4()),
                  raw_artifact_id=uuid4(),
                  operation=operation,
                  source_type="keyword_search",
                  source_value="爱玛",
                  observed_at=datetime.now(UTC),
                  external_content_id=content_id,
              )

          summary: dict[str, object] = {"keyword": "爱玛", "douyin": {}, "weibo": {}, "bilibili": {}}
          with TikHubHttpTransport(base_url="https://api.tikhub.io", timeout_seconds=30) as transport:
              # Douyin: enumerate every returned card only by type/shape, never IDs or text.
              try:
                  call = runtime.build_search_call(
                      platform="douyin",
                      keyword="爱玛",
                      config={"sort_mode": "latest", "published_within": "1d", "duration": "all", "content_type": "all"},
                      state=None,
                  )
                  body = send(transport, call)
                  items = runtime.extract_search_items("douyin", body)
                  shapes = []
                  for item in items:
                      data = item.get("data") if isinstance(item, dict) else None
                      aweme = data.get("aweme_info") if isinstance(data, dict) else None
                      shapes.append({
                          "card_type": item.get("type") if isinstance(item, dict) and isinstance(item.get("type"), (int, str)) else None,
                          "data_type": type(data).__name__,
                          "has_aweme_info": isinstance(aweme, dict),
                          "has_aweme_id": isinstance(aweme, dict) and isinstance(aweme.get("aweme_id"), (str, int)),
                          "top_keys": sorted(str(key) for key in item.keys()) if isinstance(item, dict) else [],
                      })
                  summary["douyin"] = {
                      "status": "completed",
                      "search_item_count": len(items),
                      "mappable_count": sum(1 for item in shapes if item["has_aweme_id"]),
                      "shapes": shapes,
                  }
              except Exception as exc:
                  summary["douyin"] = {"status": "failed", "error_type": type(exc).__name__, "error_summary": str(exc)[:300]}

              # Weibo: choose the highest observed comment_count candidate and test real latest pagination.
              try:
                  search_call = runtime.build_search_call(
                      platform="weibo", keyword="爱玛", config={"sort_mode": "hot", "published_within": "week"}, state=None
                  )
                  search_body = send(transport, search_call)
                  candidates = []
                  for index, raw in enumerate(runtime.extract_search_items("weibo", search_body)[:20]):
                      mapped = runtime.map_content(platform="weibo", raw=raw, context=ctx(search_call.operation), item_locator=f"search.items[{index}]")
                      candidates.append(mapped)
                  selected = max(candidates, key=lambda item: item.metrics.comment_count if item.metrics.comment_count is not None else -1)
                  first_call = runtime.build_comments_call(platform="weibo", external_content_id=selected.external_content_id, state=None)
                  first_body = send(transport, first_call)
                  first_items = runtime.extract_comment_items("weibo", first_body)
                  first_times = []
                  for index, raw in enumerate(first_items):
                      mapped = runtime.map_comment(platform="weibo", raw=raw, context=ctx(first_call.operation, content_id=selected.external_content_id), item_locator=f"comments.items[{index}]", is_root=True)
                      if mapped.published_at is not None: first_times.append(mapped.published_at)
                  data = first_body.get("data") if isinstance(first_body.get("data"), dict) else {}
                  more_info = data.get("moreInfo") if isinstance(data, dict) else None
                  next_max_id = None
                  if isinstance(more_info, dict):
                      params = more_info.get("params")
                      if isinstance(params, dict) and params.get("max_id") not in {None, 0, "0", ""}:
                          next_max_id = str(params["max_id"])
                  second_count = 0
                  overlap_count = None
                  cross_nonincreasing = None
                  if next_max_id is not None:
                      second_call = runtime.build_comments_call(platform="weibo", external_content_id=selected.external_content_id, state={"max_id": next_max_id})
                      second_body = send(transport, second_call)
                      second_items = runtime.extract_comment_items("weibo", second_body)
                      second_count = len(second_items)
                      first_ids = {str(item.get("idstr") or item.get("id")) for item in first_items}
                      second_ids = {str(item.get("idstr") or item.get("id")) for item in second_items}
                      overlap_count = len(first_ids & second_ids)
                      second_times = []
                      for index, raw in enumerate(second_items):
                          mapped = runtime.map_comment(platform="weibo", raw=raw, context=ctx(second_call.operation, content_id=selected.external_content_id), item_locator=f"comments2.items[{index}]", is_root=True)
                          if mapped.published_at is not None: second_times.append(mapped.published_at)
                      times = first_times + second_times
                      cross_nonincreasing = len(times) >= 2 and all(a >= b for a, b in zip(times, times[1:]))
                  item_max_ids = [item.get("max_id") for item in first_items if isinstance(item, dict)]
                  summary["weibo"] = {
                      "status": "completed",
                      "selected_reported_comment_count": selected.metrics.comment_count,
                      "request_sort_type": first_call.params.get("sort_type"),
                      "first_page_count": len(first_items),
                      "first_page_time_nonincreasing": len(first_times) >= 2 and all(a >= b for a, b in zip(first_times, first_times[1:])),
                      "more_info_present": isinstance(more_info, dict),
                      "next_cursor_present": next_max_id is not None,
                      "item_max_id_nonzero_count": sum(1 for value in item_max_ids if value not in {None, 0, "0", ""}),
                      "second_page_count": second_count,
                      "second_page_overlap_count": overlap_count,
                      "cross_page_time_nonincreasing": cross_nonincreasing,
                      "data_top_keys": sorted(str(key) for key in data.keys()) if isinstance(data, dict) else [],
                  }
              except Exception as exc:
                  summary["weibo"] = {"status": "failed", "error_type": type(exc).__name__, "error_summary": str(exc)[:300]}

              # Bilibili: select a popular video by detail comment_count, then test mode=2 across up to two pages.
              try:
                  search_call = runtime.build_search_call(
                      platform="bilibili", keyword="爱玛", config={"sort_mode": "play_count", "content_type": "video"}, state=None
                  )
                  search_body = send(transport, search_call)
                  search_items = runtime.extract_search_items("bilibili", search_body)
                  detailed = []
                  for index, raw in enumerate(search_items[:10]):
                      search_content = runtime.map_content(platform="bilibili", raw=raw, context=ctx(search_call.operation), item_locator=f"search.items[{index}]")
                      detail_call = runtime.build_detail_call("bilibili", search_content)
                      detail_body = send(transport, detail_call)
                      detail_items = runtime.extract_detail_items("bilibili", detail_body)
                      for item_index, detail_raw in enumerate(detail_items):
                          detail = runtime.map_content(platform="bilibili", raw=detail_raw, context=ctx(detail_call.operation, content_id=search_content.external_content_id), item_locator=f"detail.items[{item_index}]")
                          if detail.external_content_id == search_content.external_content_id:
                              detailed.append(detail)
                              break
                  selected = max(detailed, key=lambda item: item.metrics.comment_count if item.metrics.comment_count is not None else -1)
                  state: dict[str, object] | None = None
                  times = []
                  page_counts = []
                  overlap_counts = []
                  previous_ids: set[str] | None = None
                  pages = 0
                  for page_no in range(1, 3):
                      call = runtime.build_comments_call(platform="bilibili", external_content_id=selected.external_content_id, state=state)
                      body = send(transport, call)
                      pages += 1
                      items = runtime.extract_comment_items("bilibili", body)
                      page_counts.append(len(items))
                      current_ids = set()
                      for item_index, raw in enumerate(items):
                          mapped = runtime.map_comment(platform="bilibili", raw=raw, context=ctx(call.operation, content_id=selected.external_content_id), item_locator=f"comments.page[{page_no}].items[{item_index}]", is_root=True)
                          current_ids.add(mapped.external_comment_id)
                          if mapped.published_at is not None: times.append(mapped.published_at)
                      if previous_ids is not None: overlap_counts.append(len(previous_ids & current_ids))
                      previous_ids = current_ids
                      advance = runtime.advance_comments(platform="bilibili", state=state, body=body)
                      if not advance.should_continue: break
                      state = dict(advance.next_state or {})
                  probe_call = runtime.build_comments_call(platform="bilibili", external_content_id="probe-content-id", state=None)
                  summary["bilibili"] = {
                      "status": "completed",
                      "selected_reported_comment_count": selected.metrics.comment_count,
                      "request_mode": probe_call.params.get("mode"),
                      "pages": pages,
                      "page_counts": page_counts,
                      "overlap_counts": overlap_counts,
                      "time_count": len(times),
                      "cross_page_time_nonincreasing": len(times) >= 2 and all(a >= b for a, b in zip(times, times[1:])),
                  }
              except Exception as exc:
                  summary["bilibili"] = {"status": "failed", "error_type": type(exc).__name__, "error_summary": str(exc)[:300]}

          path = root / "summary.json"
          path.write_text(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY
          unset AIMA_TIKHUB_REAL_TOKEN
      - name: Upload sanitized summary only
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tikhub-five-platform-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/tikhub-five-platform/summary.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
      - name: Remove ephemeral credential material
        if: always()
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/tikhub-five-platform-secret"
