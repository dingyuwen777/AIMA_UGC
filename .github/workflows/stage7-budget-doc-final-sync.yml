name: Stage 7 Budget Doc Final Sync

on:
  push:
    branches:
      - feature/stage7-completion
    paths:
      - .github/workflows/stage7-budget-doc-final-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage7-completion
          fetch-depth: 0

      - name: Synchronize remaining current facts
        shell: python
        run: |
          from pathlib import Path
          import re

          def joined(*parts: str) -> str:
              return "\n".join(parts)

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text and old not in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one old anchor, found {count}: {old[:140]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def regex_once(path: str, pattern: str, new: str, marker: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if marker in text:
                  return
              updated, count = re.subn(pattern, new, text, count=1, flags=re.S | re.M)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex anchor, found {count}: {pattern}")
              p.write_text(updated, encoding="utf-8")

          def remove_once(path: str, old: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one removable anchor, found {count}: {old[:140]!r}")
              p.write_text(text.replace(old, "", 1), encoding="utf-8")

          p2 = "docs/blueprint/02-采集系统与数据标准化.md"
          replace_once(
              p2,
              "Stage 7 的五平台业务 Decision Pipeline、Provider Capability、首版 TikHub Operation Matrix、自适应评论、Deep Collection、费用预测和最终预算语义统一见 [08-采集策略与平台能力.md](08-采集策略与平台能力.md)；面向开发/调试的具体平台抓取逻辑见 [`../collection/README.md`](../collection/README.md)。本文保留 Provider/Raw/Mapper/Canonical/来源链等采集基础，不维护第二份平台 endpoint 表。",
              "Stage 7 的五平台业务 Decision Pipeline、Provider Capability、首版 TikHub Operation Matrix、自适应评论、Deep Collection、Provider Billing/成本审计以及未来 Budget/Cost Guard 扩展方向统一见 [08-采集策略与平台能力.md](08-采集策略与平台能力.md)；面向开发/调试的具体平台抓取逻辑见 [`../collection/README.md`](../collection/README.md)。本文保留 Provider/Raw/Mapper/Canonical/来源链等采集基础，不维护第二份平台 endpoint 表。",
          )
          remove_once(p2, "- 请求和费用预算；\n")
          replace_once(
              p2,
              "Run 是某次人工或定时触发的完整执行记录。创建 Run 时必须冻结已经解析的 Provider Config 身份、Provider 类型、平台业务策略、最终关键词和预算，后续修改 Provider Config 或 Plan 不能改变已经创建的 Run。",
              "Run 是某次人工或定时触发的完整执行记录。创建 Run 时必须冻结已经解析的 Provider Config 身份、Provider 类型、平台业务策略和最终关键词，后续修改 Provider Config 或 Plan 不能改变已经创建的 Run。当前版本不把请求/金额预算写入 Run Snapshot。",
