name: Diagnostic logging lint fix helper

on:
  push:
    branches:
      - fix/diagnostic-logging

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/diagnostic-logging
      - name: Remove stale API logging import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/aima_ugc/bootstrap/api.py')
          text = path.read_text(encoding='utf-8')
          old = 'from aima_ugc.platform.logging import log_event\n'
          if old not in text:
              print('stale import already absent')
          else:
              path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
      - name: Commit fix when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/aima_ugc/bootstrap/api.py
          git commit -m "清理 API 未使用日志依赖"
          git push origin HEAD:fix/diagnostic-logging
