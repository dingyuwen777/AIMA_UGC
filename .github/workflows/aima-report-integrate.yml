name: AIMA Report Integration

on:
  push:
    branches:
      - feature/report-landscape-word-visuals
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/report-landscape-word-visuals
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Materialize reviewed source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/aima-report-fragments/docx.* > backend/src/aima_ugc/platform/reporting/docx_package.py
          cat .github/aima-report-fragments/markdown.* > backend/src/aima_ugc/platform/reporting/markdown_word.py
          cat .github/aima-report-fragments/patch.* > "${RUNNER_TEMP}/apply_report_visual_patch.py"
          python "${RUNNER_TEMP}/apply_report_visual_patch.py"
          python -m py_compile \
            backend/src/aima_ugc/platform/reporting/chart_spec.py \
            backend/src/aima_ugc/platform/reporting/docx_package.py \
            backend/src/aima_ugc/platform/reporting/markdown_word.py \
            backend/src/aima_ugc/platform/reporting/visuals/theme.py \
            backend/src/aima_ugc/platform/reporting/visuals/wordcloud.py \
            tests/unit/platform/test_reporting_visuals.py

      - name: Install report validation CJK font
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc

      - name: Install exact uv
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          test "$(uv --version | awk '{print $2}')" = "${UV_VERSION}"

      - name: Lock and sync
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          uv lock --check
          uv sync --locked

      - name: Format task Python scope
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            backend/src/aima_ugc/platform/reporting \
            tests/unit/platform/test_docx_package_structure.py \
            tests/unit/platform/test_reporting_visuals.py

      - name: Target report tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest \
            tests/unit/platform/test_docx_package_structure.py \
            tests/unit/platform/test_reporting_visuals.py \
            tests/unit/platform/test_offline_reporting.py \
            tests/unit/platform/test_reporting_default_template.py -q

      - name: Imports report wiring regression
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest \
            tests/unit/platform/test_imports_test_reporting.py \
            tests/unit/collection/test_p1g_imports_run_all.py -q

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check backend tests scripts
          uv run ruff check backend tests scripts
          uv run mypy backend/src

      - name: Generate validation report sample
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path
          from openpyxl import Workbook
          from aima_ugc.platform.reporting import generate_excel_report

          root = Path('.runtime/report-visual-sample')
          root.mkdir(parents=True, exist_ok=True)
          source = root / 'labeled_data.xlsx'
          workbook = Workbook()
          content = workbook.active
          assert content is not None
          content.title = '内容'
          content.append(('平台', '发布时间', '命中关键词', '情感标签', '一级标签', '二级标签'))
          rows = (
              ('douyin', '2026-08-18 08:00:00', '爱玛；新品', '正面', '品牌评价', '口碑与信任'),
              ('douyin', '2026-08-18 11:00:00', '爱玛；价格', '中性', '价格与价值', '价格水平'),
              ('xiaohongshu', '2026-08-19 09:00:00', '爱玛；颜值', '正面', '外观设计', '整体造型与颜值'),
              ('weibo', '2026-08-19 12:00:00', '爱玛；售后', '负面', '售后服务', '客服与服务态度'),
              ('bilibili', '2026-08-20 10:00:00', '爱玛；续航', '混合', '电池、续航与充电', '续航表现'),
              ('kuaishou', '2026-08-20 16:00:00', '爱玛；骑行', '中性', '骑行性能', '操控与稳定性'),
          )
          for row in rows:
              content.append(row)
          labels = workbook.create_sheet('标签明细')
          labels.append(('平台', '情感标签', '一级标签', '二级标签'))
          for platform, _published, _keywords, sentiment, primary, secondary in rows:
              labels.append((platform, sentiment, primary, secondary))
          comments = workbook.create_sheet('评论')
          comments.append(('平台',))
          comments.append(('douyin',))
          comments.append(('weibo',))
          workbook.save(source)
          workbook.close()
          summary = generate_excel_report(input_path=source, output_dir=root / 'reports')
          print(summary.word_path)
          print(summary.markdown_path)
          PY

      - name: Upload validation report sample
        uses: actions/upload-artifact@v4.6.2
        with:
          name: report-visual-sample
          path: .runtime/report-visual-sample/reports/
          if-no-files-found: error
          retention-days: 3

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          # Actions token 没有 workflows 权限；workflow 变更由当前 GitHub 连接另行原子提交。
          git checkout -- .github/workflows/ci.yml
          git rm -r -- .github/aima-report-fragments
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            pyproject.toml uv.lock \
            backend/src/aima_ugc/platform/reporting/README.md \
            backend/src/aima_ugc/platform/reporting/chart_spec.py \
            backend/src/aima_ugc/platform/reporting/docx_package.py \
            backend/src/aima_ugc/platform/reporting/excel_report.py \
            backend/src/aima_ugc/platform/reporting/markdown_word.py \
            backend/src/aima_ugc/platform/reporting/report_template.md \
            backend/src/aima_ugc/platform/reporting/visuals/__init__.py \
            backend/src/aima_ugc/platform/reporting/visuals/theme.py \
            backend/src/aima_ugc/platform/reporting/visuals/wordcloud.py \
            docs/blueprint/13-统一数据Excel导出与调试复用.md \
            tests/unit/platform/test_docx_package_structure.py \
            tests/unit/platform/test_reporting_visuals.py
          git diff --cached --check
          git commit -m "实现横向A4舆情报告视觉重构"
          git push origin HEAD:feature/report-landscape-word-visuals
