name: Temporary Apply Voice Type Tables

on:
  push:
    branches:
      - feature/voice-type-classification-tables
    paths:
      - .github/workflows/_tmp_apply_voice_type_tables.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/voice-type-classification-tables
          fetch-depth: 0
      - name: Apply refactor
        run: python .tmp_apply_voice_type_tables.py
      - name: Commit refactor and remove temporary files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_apply_voice_type_tables.yml .tmp_apply_voice_type_tables.py
          git add backend tests docs
          git commit -m "重构：统一中文发声类型与判断标准表格"
          git push origin HEAD:feature/voice-type-classification-tables
