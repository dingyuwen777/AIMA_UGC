name: Dev Generated Contracts Artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Install locked environments
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm --version)" = "11.17.0"
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
          npm ci --prefix frontend

      - name: Generate contracts and client
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api

      - name: Upload exact generator output
        uses: actions/upload-artifact@v4.6.2
        with:
          name: generated-contracts-${{ github.event.pull_request.head.sha }}
          path: |
            contracts/openapi/openapi.json
            frontend/src/generated/api/client.ts
          if-no-files-found: error
          retention-days: 1
