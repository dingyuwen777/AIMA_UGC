name: Temporary Logging Isolation Patch

on:
  push:
    branches:
      - fix/stage1-stage7-audit-final-closure
    paths:
      - .github/workflows/patch-logging-isolation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/stage1-stage7-audit-final-closure
          fetch-depth: 0
      - name: Apply exact isolation fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/src/aima_ugc/modules/collection/collection_run_executor.py")
          text = path.read_text(encoding="utf-8")
          old = '''                    requested_count=_stat_int(scope.stats, "requested_count"),
                    succeeded_count=_stat_int(scope.stats, "succeeded_count"),
                    failed_count=_stat_int(scope.stats, "failed_count"),
                    content_count=_stat_int(scope.stats, "content_count"),
                    comment_count=_stat_int(scope.stats, "comment_count"),'''
          new = '''                    requested_count=_safe_log_stat_int(scope.stats, "requested_count"),
                    succeeded_count=_safe_log_stat_int(scope.stats, "succeeded_count"),
                    failed_count=_safe_log_stat_int(scope.stats, "failed_count"),
                    content_count=_safe_log_stat_int(scope.stats, "content_count"),
                    comment_count=_safe_log_stat_int(scope.stats, "comment_count"),'''
          if text.count(old) != 1:
              raise SystemExit(f"unexpected exception logging block count: {text.count(old)}")
          text = text.replace(old, new, 1)

          marker = '''\ndef _stat_int(stats: dict[str, object], name: str) -> int:\n'''
          helper = '''\ndef _safe_log_stat_int(stats: dict[str, object], name: str) -> int:\n    \"\"\"日志不得因损坏的 durable stats 再次破坏 Scope 故障隔离。\"\"\"\n    value = stats.get(name, 0)\n    if isinstance(value, bool) or not isinstance(value, int) or value < 0:\n        return 0\n    return value\n\n\ndef _stat_int(stats: dict[str, object], name: str) -> int:\n'''
          if text.count(marker) != 1:
              raise SystemExit(f"unexpected _stat_int marker count: {text.count(marker)}")
          path.write_text(text.replace(marker, helper, 1), encoding="utf-8")
          PY
          git diff --check
          git diff -- backend/src/aima_ugc/modules/collection/collection_run_executor.py
      - name: Commit exact fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "yuwen.ding"
          git config user.email "dingyuwen777@gmail.com"
          git add backend/src/aima_ugc/modules/collection/collection_run_executor.py
          git commit -m "修复日志路径破坏 Scope 故障隔离"
          git push origin HEAD:fix/stage1-stage7-audit-final-closure
