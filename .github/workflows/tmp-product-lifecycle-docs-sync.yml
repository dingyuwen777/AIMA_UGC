name: Temporary Product Lifecycle Docs Sync

on:
  push:
    branches:
      - feature/product-resource-lifecycle
    paths:
      - .github/workflows/tmp-product-lifecycle-docs-sync.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Apply targeted docs patch
        run: python .github/tmp_product_lifecycle_docs_patch.py

      - name: Docs gates
        run: |
          set -euo pipefail
          python3 scripts/quality/check_docs.py
          python3 scripts/quality/check_docs_facts.py

      - name: Commit docs and remove temporary files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" != "success" ]]; then
            git reset --hard HEAD
          fi
          git rm .github/workflows/tmp-product-lifecycle-docs-sync.yml .github/tmp_product_lifecycle_docs_patch.py
          git add \
            docs/product/02_当前产品能力与用户流程.md \
            docs/blueprint/03_数据库与文件存储.md \
            docs/blueprint/04_后端任务API与前端.md \
            docs/blueprint/08_采集策略与平台能力.md \
            docs/collection/README.md \
            docs/appendix/11_业务资源生命周期与数据撤销实现.md \
            backend/src/aima_ugc/modules/ingestion/README.md \
            backend/src/aima_ugc/modules/content/README.md \
            backend/src/aima_ugc/modules/analysis/README.md
          git config user.name "AIMA Temporary Validator"
          git config user.email "aima-validator@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "同步产品资源生命周期文档 [skip ci]"
          git push origin HEAD:feature/product-resource-lifecycle
