name: Stage 7 Keyword Packs Doc Sync

on:
  push:
    branches:
      - docs/stage7-keyword-packs-close
    paths:
      - ".github/workflows/stage7-keyword-doc-sync.yml"
      - "scripts/dev/stage7_keyword_doc_sync.py"

permissions:
  contents: write

jobs:
  sync:
    name: Stage 7 Keyword Packs Doc Sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: docs/stage7-keyword-packs-close
      - name: Apply exact documented-state replacements
        run: python scripts/dev/stage7_keyword_doc_sync.py
      - name: Verify only intended Blueprint files changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          expected=$'docs/blueprint/03-数据库与文件存储.md\ndocs/blueprint/README.md'
          test "$changed" = "$expected"
          git diff --check
      - name: Commit synced Blueprint state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/blueprint/03-数据库与文件存储.md docs/blueprint/README.md
          git commit -m "同步 Stage 7 关键词词包 Blueprint"
          git push origin HEAD:docs/stage7-keyword-packs-close
