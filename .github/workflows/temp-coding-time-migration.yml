name: Temporary Coding Time Migration

on:
  push:
    branches:
      - refactor/coding-skill-beijing-time
    paths:
      - scripts/dev/migrate_system_time_to_beijing.py
      - .github/workflows/temp-coding-time-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: refactor/coding-skill-beijing-time
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.2

      - name: Migrate system-owned current time
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dev/migrate_system_time_to_beijing.py
          mapfile -t changed < <(git diff --name-only -- 'backend/src/aima_ugc/**/*.py')
          if (( ${#changed[@]} > 0 )); then
            ruff check --fix "${changed[@]}"
            ruff format "${changed[@]}"
          fi
          git diff --check

      - name: Commit migration result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/src/aima_ugc; then
            echo "没有待提交的时间迁移。"
            exit 0
          fi
          git config user.name "AIMA Coding Migration"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/aima_ugc
          git commit -m "统一系统自产时间为北京时间"
          git push origin HEAD:refactor/coding-skill-beijing-time
