name: Temporary Multi Pack Test Migration

on:
  push:
    branches:
      - feature/multi-keyword-pack-entrypoints
    paths:
      - .tmp/multi-pack-test-migration-trigger

permissions:
  contents: write

jobs:
  migrate-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/multi-keyword-pack-entrypoints
      - name: Tighten migrated integration tests
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/integration/collection/test_stage8e_collection_http_runtime.py")
          text = path.read_text(encoding="utf-8")
          keep_pack_id = {
              "test_discovery_run_creation_freezes_inputs_and_commits_job_run_scopes_atomically",
              "test_collection_run_rejects_disabled_provider_config",
              "test_unified_runtime_list_cursor_filters_and_summary_aggregate_both_owners",
          }
          lines = text.splitlines(keepends=True)
          current_function = ""
          output: list[str] = []
          for line in lines:
              stripped = line.lstrip()
              if stripped.startswith("def "):
                  current_function = stripped[4:].split("(", 1)[0]
              if "provider_config_id, pack_id = _seed_config_and_relevance(runtime)" in line:
                  if current_function not in keep_pack_id:
                      line = line.replace("provider_config_id, pack_id", "provider_config_id, _")
              output.append(line)
          text = "".join(output)
          old = '    assert filtered.items[0].keywords == ("爱玛",)\n'
          new = '    assert filtered.items[0].keywords == ("爱玛", "Q7")\n'
          if old not in text:
              raise SystemExit("runtime keyword assertion not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Format and validate migrated tests
        run: |
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
          uv run ruff format tests/integration/collection/test_stage8e_collection_http_runtime.py tests/integration/content/test_stage8d_voice_plaza_runtime.py
          uv run ruff check tests/integration/collection/test_stage8e_collection_http_runtime.py tests/integration/content/test_stage8d_voice_plaza_runtime.py
      - name: Commit migrated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/collection/test_stage8e_collection_http_runtime.py tests/integration/content/test_stage8d_voice_plaza_runtime.py
          git diff --cached --check
          git commit -m "收紧多词包旧测试迁移"
          git push origin HEAD:feature/multi-keyword-pack-entrypoints
