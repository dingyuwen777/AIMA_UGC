name: Temporary Multi Pack Test Migration

on:
  push:
    branches:
      - feature/multi-keyword-pack-entrypoints
    paths:
      - .tmp/multi-pack-test-migration-trigger

permissions:
  contents: write

jobs:
  migrate-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/multi-keyword-pack-entrypoints
      - name: Migrate stale integration tests to keyword_pack_ids
        shell: python
        run: |
          from pathlib import Path

          collection_path = Path("tests/integration/collection/test_stage8e_collection_http_runtime.py")
          text = collection_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "def _seed_config_and_relevance(runtime) -> UUID:  # type: ignore[no-untyped-def]",
                  "def _seed_config_and_relevance(runtime) -> tuple[UUID, UUID]:  # type: ignore[no-untyped-def]",
              ),
              ("    keyword_id = uuid4()\n    now = datetime.now(UTC)", "    keyword_id = uuid4()\n    q7_keyword_id = uuid4()\n    now = datetime.now(UTC)"),
              (
                  "        connection.execute(\n            insert(global_relevance_config_table).values(",
                  "        connection.execute(\n            insert(keywords_table).values(\n                id=q7_keyword_id,\n                text=\"Q7\",\n                normalized_text=f\"stage8e-q7-{uuid4()}\",\n                enabled=True,\n                created_at=now,\n                updated_at=now,\n            )\n        )\n        connection.execute(\n            insert(keyword_pack_items_table).values(\n                pack_id=pack_id,\n                keyword_id=q7_keyword_id,\n                platform_scope=\"all\",\n                priority=10,\n                enabled=True,\n                note=\"stage8e\",\n            )\n        )\n        connection.execute(\n            insert(global_relevance_config_table).values(",
              ),
              ("    return provider_config_id\n", "    return provider_config_id, pack_id\n"),
              ("    provider_config_id = _seed_config_and_relevance(runtime)\n", "    provider_config_id, pack_id = _seed_config_and_relevance(runtime)\n"),
              ("            keywords=(\"爱玛\", \"Q7\"),\n", "            keyword_pack_ids=(pack_id,),\n"),
              ("                keywords=(\"爱玛\",),\n", "                keyword_pack_ids=(pack_id,),\n"),
              ("            keywords=(\"爱玛\",),\n", "            keyword_pack_ids=(pack_id,),\n"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"collection replacement not found: {old!r}")
              text = text.replace(old, new)
          collection_path.write_text(text, encoding="utf-8")

          content_path = Path("tests/integration/content/test_stage8d_voice_plaza_runtime.py")
          text = content_path.read_text(encoding="utf-8")
          old = '''    uploaded = client.post(\n        "/api/v1/import-batches",\n        files={\n            "file": (\n                "stage8d.xlsx",\n                _xlsx(text_suffix=text_suffix),\n                "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",\n            )\n        },\n    )\n'''
          new = '''    uploaded = client.post(\n        "/api/v1/import-batches",\n        files=[\n            (\n                "file",\n                (\n                    "stage8d.xlsx",\n                    _xlsx(text_suffix=text_suffix),\n                    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",\n                ),\n            ),\n            ("keyword_pack_ids", (None, pack.json()["id"])),\n        ],\n    )\n'''
          if old not in text:
              raise SystemExit("voice plaza upload block not found")
          content_path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Format and validate migrated tests
        run: |
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
          uv run ruff format tests/integration/collection/test_stage8e_collection_http_runtime.py tests/integration/content/test_stage8d_voice_plaza_runtime.py
          uv run ruff check tests/integration/collection/test_stage8e_collection_http_runtime.py tests/integration/content/test_stage8d_voice_plaza_runtime.py
      - name: Commit migrated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/collection/test_stage8e_collection_http_runtime.py tests/integration/content/test_stage8d_voice_plaza_runtime.py
          git diff --cached --check
          git commit -m "迁移旧集成测试到多词包接口"
          git push origin HEAD:feature/multi-keyword-pack-entrypoints
