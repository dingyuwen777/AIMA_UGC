name: Bootstrap Stage 3A cleanup

on:
  push:
    branches:
      - migration/stage3a-database-foundation

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Remove one-time Stage 3A tooling
        run: |
          set -euo pipefail
          git rm .github/workflows/bootstrap-stage3a-docs.yml scripts/dev/patch_stage3a_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "移除 Stage 3A 一次性文档工具"
          git push origin "HEAD:${GITHUB_REF_NAME}"
