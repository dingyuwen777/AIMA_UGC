name: Bootstrap Stage 3A docs

on:
  push:
    branches:
      - migration/stage3a-database-foundation

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Patch final Stage 3A documentation facts
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("docs/blueprint/07-技术决策与实施门禁.md"): [
                  (
                      "| Artifact 基础 | `platform/storage` 定义 Service/Port，`adapters/storage/local` 提供 Local Store；PostgreSQL Metadata Repository 留到阶段 3 |",
                      "| Artifact 基础 | `platform/storage` 定义 Service/Port，`adapters/storage/local` 提供 Local Store；Stage 3A 已由 `adapters/persistence/postgres/artifact_metadata.py` 实现 PostgreSQL Metadata Repository |",
                  ),
              ],
              Path("README.md"): [
                  (
                      "唯一初始化版本快照、Stage 1 工具链和 Stage 2 Platform 已验证决策见",
                      "唯一初始化版本快照、Stage 1 工具链、Stage 2 Platform 和 Stage 3A 已验证决策见",
                  ),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f"{path}: expected one match, found {text.count(old)}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit docs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/blueprint/07-技术决策与实施门禁.md
          git commit -m "收口 Stage 3A 文档事实"
          git push origin "HEAD:${GITHUB_REF_NAME}"
