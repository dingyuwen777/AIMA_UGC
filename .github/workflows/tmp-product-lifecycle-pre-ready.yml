name: Temporary Product Lifecycle Pre-Ready Validation

on:
  push:
    branches:
      - feature/product-resource-lifecycle
    paths:
      - .github/workflows/tmp-product-lifecycle-pre-ready.yml

permissions:
  contents: write

jobs:
  core:
    name: Core Contract Backend Frontend Browser Mock
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked environments
        shell: bash
        run: |
          set -euo pipefail
          test "$(python --version)" = "Python 3.14.7"
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          test "$(uv --version | awk '{print $2}')" = "${UV_VERSION}"
          uv lock --check
          uv sync --locked
          uv run python -c "import aima_ugc"
          npm ci --prefix frontend

      - name: Secret and docs gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/scan_secrets.py
          python3 scripts/quality/check_docs.py
          python3 scripts/quality/check_docs_facts.py

      - name: Verify generated contracts and client
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          git diff --exit-code -- contracts frontend/src/generated/api
          UNTRACKED="$(git ls-files --others --exclude-standard -- contracts frontend/src/generated/api)"
          if [[ -n "${UNTRACKED}" ]]; then echo "CONTRACT_UNTRACKED: ${UNTRACKED}"; exit 1; fi
          test -f contracts/export/unified-data-excel.v1.schema.json
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py

      - name: Python static gates
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check backend tests scripts \
            migrations/versions/20260814_0005_stage5d_provider_dispatch.py \
            migrations/versions/20260815_0013_stage7_plan_occurrence_run_snapshot.py \
            migrations/versions/20260815_0014_stage7_latest_only_scheduler_policy.py \
            migrations/versions/20260907_0041_import_campaign_revocation.py \
            migrations/versions/20260907_0042_product_resource_lifecycle.py
          uv run ruff check backend tests scripts \
            migrations/versions/20260814_0005_stage5d_provider_dispatch.py \
            migrations/versions/20260815_0013_stage7_plan_occurrence_run_snapshot.py \
            migrations/versions/20260815_0014_stage7_latest_only_scheduler_policy.py \
            migrations/versions/20260907_0041_import_campaign_revocation.py \
            migrations/versions/20260907_0042_product_resource_lifecycle.py
          uv run mypy backend/src

      - name: Unit Contract API Architecture
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit -q
          uv run pytest tests/contracts -q
          uv run pytest tests/api -q
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py

      - name: Build and verify Wheel
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -c "import aima_ugc; print(aima_ugc.__version__)"

      - name: Frontend unit build and Browser Mock Acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend audit --audit-level=high
          npm --prefix frontend run lint
          npm --prefix frontend run test -- --run
          npm --prefix frontend run build
          npm --prefix frontend exec -- playwright --version
          npm --prefix frontend run test:e2e

  postgres:
    name: PostgreSQL Full Integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/pre-ready-postgres/data
      AIMA_LOG_DIR: .runtime/pre-ready-postgres/logs
      AIMA_SECRET_DIR: .runtime/pre-ready-postgres/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked backend and migrate
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'ci-postgres' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
          uv run python tests/integration/database/verify_migration_compatibility.py
      - name: Run full PostgreSQL integration suite
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration -q

  fullstack:
    name: Permanent Full-stack Golden Paths
    uses: ./.github/workflows/fullstack.yml
    with:
      specs: all

  cleanup:
    name: Clean temporary validation carrier
    if: always()
    needs: [core, postgres, fullstack]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout exact validation revision
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/product-resource-lifecycle
          fetch-depth: 0
      - name: Remove temporary workflow without hiding result
        shell: bash
        env:
          CORE_RESULT: ${{ needs.core.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          FULLSTACK_RESULT: ${{ needs.fullstack.result }}
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feature/product-resource-lifecycle | cut -f1)"
          test "${REMOTE_HEAD}" = "${GITHUB_SHA}"
          git rm .github/workflows/tmp-product-lifecycle-pre-ready.yml
          git config user.name "AIMA Temporary Validator"
          git config user.email "aima-validator@users.noreply.github.com"
          git commit -m "清理产品生命周期预 Ready 临时验收载体"
          git push origin HEAD:feature/product-resource-lifecycle
          printf 'core=%s\npostgres=%s\nfullstack=%s\n' "${CORE_RESULT}" "${POSTGRES_RESULT}" "${FULLSTACK_RESULT}"
          [[ "${CORE_RESULT}" == "success" ]]
          [[ "${POSTGRES_RESULT}" == "success" ]]
          [[ "${FULLSTACK_RESULT}" == "success" ]]
