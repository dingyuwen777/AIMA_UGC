name: Stage 3 Temporary Backend Refactor

on:
  push:
    branches:
      - feature/stage3-excel-brand-vehicle-filter

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage3-excel-brand-vehicle-filter
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - name: Inline Stage 3 overlays into canonical modules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          import shutil
          from pathlib import Path

          ROOT = Path('.')
          BOOT = ROOT / 'backend/src/aima_ugc/bootstrap'

          pairs = {
              'api.py': '_api_base.py',
              'import_http.py': '_import_http_base.py',
              'import_worker.py': '_import_worker_base.py',
              'manual_ingestion.py': '_manual_ingestion_base.py',
              'historical_import_http.py': '_historical_import_http_base.py',
              'historical_import_worker.py': '_historical_import_worker_base.py',
          }
          overlays = {name: (BOOT / name).read_text(encoding='utf-8') for name in pairs}
          for public, base in pairs.items():
              shutil.copyfile(BOOT / base, BOOT / public)

          def lines(text: str) -> list[str]:
              return text.splitlines(keepends=True)

          def node_span(node: ast.AST) -> tuple[int, int]:
              starts = [getattr(node, 'lineno')]
              starts.extend(getattr(item, 'lineno') for item in getattr(node, 'decorator_list', []))
              return min(starts) - 1, getattr(node, 'end_lineno')

          def class_node(text: str, name: str) -> ast.ClassDef:
              tree = ast.parse(text)
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and node.name == name:
                      return node
              raise AssertionError(f'class not found: {name}')

          def top_node(text: str, name: str) -> ast.AST:
              tree = ast.parse(text)
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and node.name == name:
                      return node
              raise AssertionError(f'top node not found: {name}')

          def any_function_node(text: str, name: str) -> ast.AST:
              tree = ast.parse(text)
              matches = [
                  node for node in ast.walk(tree)
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == name
              ]
              if len(matches) != 1:
                  raise AssertionError(f'function {name}: expected 1, got {len(matches)}')
              return matches[0]

          def class_method_node(text: str, class_name: str, method_name: str) -> ast.AST:
              cls = class_node(text, class_name)
              matches = [
                  node for node in cls.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == method_name
              ]
              if len(matches) != 1:
                  raise AssertionError(
                      f'{class_name}.{method_name}: expected 1, got {len(matches)}'
                  )
              return matches[0]

          def source_for(text: str, node: ast.AST) -> str:
              start, end = node_span(node)
              return ''.join(lines(text)[start:end])

          def replace_span(text: str, node: ast.AST, replacement: str) -> str:
              data = lines(text)
              start, end = node_span(node)
              data[start:end] = [replacement.rstrip() + '\n']
              return ''.join(data)

          def replace_class_method(
              text: str, class_name: str, method_name: str, replacement: str
          ) -> str:
              return replace_span(
                  text,
                  class_method_node(text, class_name, method_name),
                  replacement,
              )

          def replace_any_function(text: str, name: str, replacement: str) -> str:
              return replace_span(text, any_function_node(text, name), replacement)

          def insert_before_method(
              text: str, class_name: str, method_name: str, addition: str
          ) -> str:
              node = class_method_node(text, class_name, method_name)
              data = lines(text)
              start, _ = node_span(node)
              data[start:start] = [addition.rstrip() + '\n\n']
              return ''.join(data)

          def insert_after_top(text: str, name: str, addition: str) -> str:
              node = top_node(text, name)
              data = lines(text)
              _, end = node_span(node)
              data[end:end] = ['\n' + addition.rstrip() + '\n']
              return ''.join(data)

          def insert_before_top(text: str, name: str, addition: str) -> str:
              node = top_node(text, name)
              data = lines(text)
              start, _ = node_span(node)
              data[start:start] = [addition.rstrip() + '\n\n']
              return ''.join(data)

          def direct(src: str) -> str:
              return src.replace('_base.', '')

          def add_import_before(text: str, marker: str, addition: str) -> str:
              if addition.strip() in text:
                  return text
              assert marker in text, marker
              return text.replace(marker, addition.rstrip() + '\n' + marker, 1)

          def add_names_to_import_block(text: str, module: str, names: list[str]) -> str:
              pattern = re.compile(
                  rf'from {re.escape(module)} import \(\n(?P<body>.*?)\n\)', re.S
              )
              match = pattern.search(text)
              if match is None:
                  raise AssertionError(f'import block not found: {module}')
              body = match.group('body')
              existing = {
                  line.strip().rstrip(',') for line in body.splitlines() if line.strip()
              }
              extra = [name for name in names if name not in existing]
              if not extra:
                  return text
              new_body = body + ''.join(f'\n    {name},' for name in extra)
              return text[:match.start('body')] + new_body + text[match.end('body'):]

          # import_http.py: keep legacy selection reader, but new creates are v2 Brand scope.
          path = BOOT / 'import_http.py'
          text = path.read_text(encoding='utf-8')
          text = add_import_before(
              text,
              'from aima_ugc.adapters.persistence.postgres.import_batch_queries import (',
              'from aima_ugc.adapters.persistence.postgres.brand_vehicle import PostgresBrandVehicleRepository',
          )
          text = add_import_before(
              text,
              'from aima_ugc.modules.ingestion import ProcessingImportBatchRecord',
              'from aima_ugc.modules.ingestion.brand_vehicle_filter import BrandVehicleFilterSnapshot',
          )
          text = add_names_to_import_block(
              text,
              'aima_ugc.modules.ingestion.import_job',
              [
                  'BRAND_VEHICLE_IMPORT_JOB_PAYLOAD_VERSION',
                  'BRAND_VEHICLE_IMPORT_JOB_TYPE',
                  'LEGACY_IMPORT_JOB_TYPE',
                  'BrandVehicleImportJobPayload',
              ],
          )
          overlay = overlays['import_http.py']
          for name in ('create_import', 'get_job'):
              src = direct(source_for(overlay, class_method_node(overlay, 'PostgresImportHttpService', name)))
              text = replace_class_method(text, 'PostgresImportHttpService', name, src)
          helper = direct(
              source_for(
                  overlay,
                  class_method_node(
                      overlay, 'PostgresImportHttpService', '_read_brand_vehicle_filter_snapshot'
                  ),
              )
          )
          text = insert_before_method(
              text, 'PostgresImportHttpService', '_read_import_keyword_selection', helper
          )
          path.write_text(text, encoding='utf-8')

          # manual_ingestion.py: extend the existing transaction owner with Stage 3 evidence.
          path = BOOT / 'manual_ingestion.py'
          text = path.read_text(encoding='utf-8')
          text = add_import_before(
              text,
              'from aima_ugc.adapters.persistence.postgres.content_complete import (',
              'from aima_ugc.adapters.persistence.postgres.brand_vehicle import PostgresBrandVehicleRepository',
          )
          text = add_import_before(
              text,
              'from aima_ugc.modules.vehicles.models import ContentVehicleEvidence, normalize_vehicle_text',
              'from aima_ugc.modules.ingestion.brand_vehicle_filter import (\n'
              '    BrandVehicleFilterSnapshot,\n'
              '    resolve_canonical_brand_vehicle,\n'
              ')',
          )
          overlay = overlays['manual_ingestion.py']
          function = direct(source_for(overlay, top_node(overlay, 'ingest_unified_content_batch')))
          text = replace_span(text, top_node(text, 'ingest_unified_content_batch'), function)
          path.write_text(text, encoding='utf-8')

          # import_worker.py: rename exact v1 execution and add explicit v2 path in the same class.
          path = BOOT / 'import_worker.py'
          text = path.read_text(encoding='utf-8')
          text = add_import_before(
              text,
              'from aima_ugc.modules.ingestion import ProcessingImportBatchRecord',
              'from aima_ugc.modules.ingestion.brand_vehicle_filter import (\n'
              '    BrandVehicleFilterSnapshot,\n'
              '    filter_canonical_content_by_brand_vehicle_jsonl,\n'
              ')',
          )
          text = add_names_to_import_block(
              text,
              'aima_ugc.modules.ingestion.import_job',
              ['AnyImportJobPayload', 'BrandVehicleImportJobPayload'],
          )
          overlay = overlays['import_worker.py']
          stage3_exec = direct(source_for(overlay, top_node(overlay, '_Stage3ImportExecution')))
          text = insert_after_top(text, '_ImportExecution', stage3_exec)
          legacy = source_for(text, class_method_node(text, 'PostgresImportJobExecutor', 'execute'))
          legacy = legacy.replace('    def execute(', '    def _execute_v1(', 1)
          text = replace_class_method(text, 'PostgresImportJobExecutor', 'execute', legacy)
          new_methods = []
          for name in ('execute', '_execute_v2', '_load_v2', '_ingest_v2'):
              src = direct(source_for(overlay, class_method_node(overlay, 'PostgresImportJobExecutor', name)))
              src = src.replace('return super().execute(', 'return self._execute_v1(')
              new_methods.append(src.rstrip())
          text = insert_before_method(
              text,
              'PostgresImportJobExecutor',
              '_load',
              '\n\n'.join(new_methods),
          )
          path.write_text(text, encoding='utf-8')

          # historical_import_http.py: only creation semantics change; all lifecycle methods stay original.
          path = BOOT / 'historical_import_http.py'
          text = path.read_text(encoding='utf-8')
          text = add_import_before(
              text,
              'from aima_ugc.adapters.persistence.postgres.historical_cancellation import (',
              'from aima_ugc.adapters.persistence.postgres.brand_vehicle import PostgresBrandVehicleRepository',
          )
          text = add_import_before(
              text,
              'from aima_ugc.modules.ingestion.historical_directory import (',
              'from aima_ugc.contracts.stage3_import import (\n'
              '    HistoricalCampaignCreateRequest as Stage3HistoricalCampaignCreateRequest,\n'
              '    LocalDataImportCampaignCreateRequest as Stage3LocalDataImportCampaignCreateRequest,\n'
              ')\n'
              'from aima_ugc.modules.ingestion.brand_vehicle_filter import BrandVehicleFilterSnapshot',
          )
          text = text.replace('from .import_http import read_import_keyword_selection\n', '')
          overlay = overlays['historical_import_http.py']
          for name in ('create_campaign', 'create_local_campaign'):
              src = direct(
                  source_for(overlay, class_method_node(overlay, 'PostgresHistoricalImportHttpService', name))
              )
              text = replace_class_method(text, 'PostgresHistoricalImportHttpService', name, src)
          helper = direct(
              source_for(
                  overlay,
                  class_method_node(
                      overlay,
                      'PostgresHistoricalImportHttpService',
                      '_read_brand_vehicle_filter_snapshot',
                  ),
              )
          )
          text = insert_before_method(
              text, 'PostgresHistoricalImportHttpService', 'upload_local_file', helper
          )
          path.write_text(text, encoding='utf-8')

          # historical_import_worker.py: keep v1 implementations as private legacy paths and add v2.
          path = BOOT / 'historical_import_worker.py'
          text = path.read_text(encoding='utf-8')
          text = add_import_before(
              text,
              'from aima_ugc.adapters.persistence.postgres.historical_cancellation import (',
              'from aima_ugc.adapters.persistence.postgres.brand_vehicle import PostgresBrandVehicleRepository',
          )
          text = add_import_before(
              text,
              'from aima_ugc.modules.ingestion.historical_chunk import (',
              'from aima_ugc.modules.ingestion.brand_vehicle_filter import (\n'
              '    BrandVehicleFilterSnapshot,\n'
              '    resolve_canonical_brand_vehicle,\n'
              ')',
          )
          text = add_names_to_import_block(
              text,
              'aima_ugc.modules.ingestion.historical_chunk',
              ['HISTORICAL_CHUNK_SCHEMA_VERSION'],
          )
          overlay = overlays['historical_import_worker.py']
          for old_name, new_name in (('snapshot', '_snapshot_legacy'), ('import_chunk', '_import_chunk_legacy')):
              legacy = source_for(
                  text,
                  class_method_node(text, 'PostgresHistoricalImportJobExecutor', old_name),
              )
              legacy = legacy.replace(f'    def {old_name}(', f'    def {new_name}(', 1)
              text = replace_class_method(
                  text, 'PostgresHistoricalImportJobExecutor', old_name, legacy
              )
          new_methods = []
          for name in ('snapshot', 'import_chunk', '_campaign_filter_payload'):
              src = direct(
                  source_for(
                      overlay,
                      class_method_node(overlay, 'PostgresHistoricalImportJobExecutor', name),
                  )
              )
              src = src.replace('return super().snapshot(', 'return self._snapshot_legacy(')
              src = src.replace('return super().import_chunk(', 'return self._import_chunk_legacy(')
              new_methods.append(src.rstrip())
          text = insert_before_method(
              text,
              'PostgresHistoricalImportJobExecutor',
              '_load_campaign',
              '\n\n'.join(new_methods),
          )
          evidence_helper = direct(
              source_for(overlay, top_node(overlay, '_append_historical_brand_vehicle_evidence'))
          )
          text = insert_before_top(
              text, '_append_historical_vehicle_evidence', evidence_helper
          )
          path.write_text(text, encoding='utf-8')

          # api.py: keep the original app/runtime/exception wiring; replace only three create handlers.
          path = BOOT / 'api.py'
          text = path.read_text(encoding='utf-8')
          text = add_import_before(
              text,
              'from aima_ugc.contracts.product import (',
              'from aima_ugc.contracts.stage3_import import (\n'
              '    HistoricalCampaignCreateRequest as Stage3HistoricalCampaignCreateRequest,\n'
              '    LocalDataImportCampaignCreateRequest as Stage3LocalDataImportCampaignCreateRequest,\n'
              ')',
          )
          overlay = overlays['api.py']
          for name in (
              'create_import_batch',
              'create_historical_import_campaign',
              'create_local_data_import_campaign',
          ):
              src = direct(source_for(overlay, any_function_node(overlay, name)))
              text = replace_any_function(text, name, src)
          path.write_text(text, encoding='utf-8')

          # Temporary migration mirrors are no longer needed after inlining.
          for base in pairs.values():
              (BOOT / base).unlink()
          Path('.github/workflows/stage3-backend-refactor-temp.yml').unlink()
          PY
      - name: Verify static gates and unchanged generated API
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv==$(tr -d '\r\n' < .uv-version)"
          uv sync --locked
          uv run ruff format backend/src/aima_ugc/bootstrap backend/src/aima_ugc/modules/ingestion backend/src/aima_ugc/contracts/stage3_import.py
          uv run ruff check backend/src tests/contracts/test_stage3_excel_brand_vehicle_filter_contract.py
          uv run mypy backend/src
          cp contracts/openapi/openapi.json /tmp/openapi.before.json
          uv run python scripts/contracts/generate.py
          diff -u /tmp/openapi.before.json contracts/openapi/openapi.json
          uv run pytest -q tests/contracts/test_stage3_excel_brand_vehicle_filter_contract.py
      - name: Commit verified refactor
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "重构：内联 Stage 3 导入兼容实现"
          git push origin HEAD:feature/stage3-excel-brand-vehicle-filter
