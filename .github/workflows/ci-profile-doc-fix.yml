name: CI Profile Documentation Fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'ci/370-test-impact-optimization'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact documentation correction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/fix_ci_profile_doc_once.py
          git diff --check
          if git diff --quiet -- docs/blueprint/06_开发约束与分阶段实施.md; then
            exit 0
          fi
          git config user.name "AIMA CI Documentation Fix"
          git config user.email "aima-ci-doc-fix@users.noreply.github.com"
          git add docs/blueprint/06_开发约束与分阶段实施.md
          git commit -m "校准 repository-quality 白名单说明"
          git push origin HEAD:${GITHUB_HEAD_REF}
