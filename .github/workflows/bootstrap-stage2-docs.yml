name: Bootstrap Stage 2 docs

on:
  push:
    branches:
      - feature/stage2-platform-foundation

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Patch validated Stage 2 facts
        run: python scripts/dev/patch_stage2_docs.py

      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs; then
            echo "No documentation changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "同步 Stage 2 Platform 技术事实"
          git push origin "HEAD:${GITHUB_REF_NAME}"
