name: Bootstrap Stage 2 docs

on:
  push:
    branches:
      - feature/stage2-platform-foundation

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Patch validated Stage 2 facts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          env_doc = "docs/环境运行与部署.md"
          replace_once(
              env_doc,
              """当前状态：

- **Windows x64 一键开发环境初始化：Go**；
- **本地前后端开发启动：Go**；
- **Linux/macOS 手工准备运行时 + 锁定依赖安装：Go**；
- **当前源码直接作为生产系统部署：No-Go**。

生产 No-Go 的原因是 PostgreSQL 业务 Schema、Worker、Scheduler、Migration、Docker Compose 和生产 Release 等能力尚未完整落地和验收。""",
              """当前状态：

- **Windows x64 一键开发环境初始化：Go**；
- **本地前后端开发启动：Go**；
- **Stage 2 Platform 本地配置、PostgreSQL 连接与 `/health/ready`：Go**；
- **Linux/macOS 手工准备运行时 + 锁定依赖安装：Go**；
- **当前源码直接作为生产系统部署：No-Go**。

生产 No-Go 的原因是业务 Schema/Alembic、认证授权、Job Runtime、正式 Scheduler、Docker Compose 和生产 Release 等后续能力尚未完整落地和验收。Stage 2 的 Config、Secret、日志、数据库连接、readiness 与 Local Artifact 基础已经可用于开发和 CI，但不等于生产部署已完成。""",
          )
          replace_once(
              env_doc,
              """当前预期：

```text
0.1.0
```

## 5. 本地启动""",
              """当前预期：

```text
0.1.0
```

### 4.3 Stage 2 Platform 本地配置

`env.local.example` 是非敏感配置示例，**当前代码不会自动读取该文件，也不会自动加载 `.env`**。运行 API/Worker/Scheduler/Migration 前，需要把实际 `AIMA_*` 值注入对应进程环境。

默认开发目录：

```text
AIMA_DATA_DIR=.runtime/data
AIMA_LOG_DIR=.runtime/logs
AIMA_SECRET_DIR=.runtime/secrets
```

`.runtime/` 已被 Git 忽略。PostgreSQL 默认连接参数见 `env.local.example`；密码不允许放进环境变量，固定从：

```text
<AIMA_SECRET_DIR>/postgres_password
```

读取。开发者应在本机创建该文件并确保不会提交到 Git。当前仓库还没有提供本地 PostgreSQL Compose，所以需要开发者提供一个可访问的 PostgreSQL 18 实例；CI 使用隔离 PostgreSQL 18.4 验证连接，但这不代表生产镜像 variant 已冻结。

健康检查语义：

```text
GET /health/live
→ 只表示 API 进程存活，不依赖 PostgreSQL

GET /health/ready
→ PostgreSQL + Artifact 根目录 + 日志目录全部可用时 200
→ 任一依赖不可用时 503
```

`/health/ready` 只返回各组件 `ok/error`，不会返回密码、连接串、Secret 内容或原始异常。

Platform 本地运行目录和 Secret 准备完成后，再按第 5 节启动 API；如果 PostgreSQL 尚未准备好，`/health/live` 仍可用于确认进程已启动，而 `/health/ready` 应保持 503。

## 5. 本地启动""",
          )
          replace_once(
              env_doc,
              """- API/Worker/Scheduler/Migration 四进程完整实现；
- PostgreSQL 业务 Schema 与 Alembic Revision；
- `/health/ready`；
- Config、Secret、统一日志、Artifact 生命周期；
- 生产 Env/Secret 模板；""",
              """- API/Worker/Scheduler/Migration 四进程的后续业务运行逻辑；
- PostgreSQL 业务 Schema、Artifact 元数据 Repository/Table 与 Alembic Revision；
- Session/RBAC、Job Runtime 和正式 Scheduler；
- 生产 Env/Secret 模板；""",
          )

          stage_doc = "docs/blueprint/06-开发约束与分阶段实施.md"
          replace_once(
              stage_doc,
              """### 阶段 2：Platform 基础

→ 修改范围：配置、Secret、日志、健康检查、数据库连接、ArtifactService/ArtifactStore  
→ 预期结果：四个进程入口、`.log`、轮转、健康、Artifact 生命周期和 Local Store  
→ 验证：日志轮转/脱敏、路径安全、Compose 健康""",
              """### 阶段 2：Platform 基础

→ 修改范围：配置、Secret、日志、健康检查、数据库连接、ArtifactService/ArtifactStore  
→ 预期结果：四个进程入口、`.log`、轮转、健康、Artifact 生命周期和 Local Store  
→ 验证：日志轮转/脱敏、Secret 边界、Local Store 路径/符号链接安全、隔离 PostgreSQL 18 真实连接、`/health/ready` HTTP smoke；生产 Compose 健康属于阶段 11 Release 验收，不作为阶段 2 前置条件""",
          )

          decision_doc = "docs/blueprint/07-技术决策与实施门禁.md"
          replace_once(decision_doc, "> 蓝图版本：1.5  ", "> 蓝图版本：1.6  ")
          replace_once(
              decision_doc,
              "| 数据库 | PostgreSQL | 18.4 | 当前受支持 18.x 小版本；阶段 3 再做实际 DB 验证 |",
              "| 数据库 | PostgreSQL | 18.4 | Stage 2 已验证真实连接与 readiness；阶段 3 再验证 Schema/Migration |",
          )
          replace_once(
              decision_doc,
              "| 后端 | SQLAlchemy | 2.0.52 | `uv.lock` 已锁定；阶段 3 再做数据库集成验证 |",
              "| 后端 | SQLAlchemy | 2.0.52 | `uv.lock` 已锁定；Stage 2 同步 Engine/Session/真实 PostgreSQL 连接已验证 |",
          )
          replace_once(
              decision_doc,
              "| 后端 | psycopg | 3.3.4 | `uv.lock` 已锁定；阶段 2/3 再连接 PostgreSQL |",
              "| 后端 | psycopg | 3.3.4 | `uv.lock` 已锁定；Stage 2 PostgreSQL 18.4 真实连接已验证 |",
          )
          marker = """GitHub Actions 的 `Windows bootstrap` 使用 Windows PowerShell 5.1 验证脚本可解析、版本事实读取、目标 Python 与 Scripts 路径发现、国内源精确 URL、`.cmd` 入口、无境外运行时源残留，以及 `Win32_Product` / 永久 ExecutionPolicy 禁用门禁。CI **不真实卸载或安装 Runner 上的系统软件，也不自动操作 GUI**；因此不能把该门禁描述为“完整安装过程已经无人值守实机验证”。实际 GUI 安装和卸载仍由开发者本机交互完成。CI 自身使用的 GitHub Actions 下载属于测试基础设施，不属于开发机一键脚本的供应链路径。

## 3. 版本选择与冻结政策"""
          stage2_section = """GitHub Actions 的 `Windows bootstrap` 使用 Windows PowerShell 5.1 验证脚本可解析、版本事实读取、目标 Python 与 Scripts 路径发现、国内源精确 URL、`.cmd` 入口、无境外运行时源残留，以及 `Win32_Product` / 永久 ExecutionPolicy 禁用门禁。CI **不真实卸载或安装 Runner 上的系统软件，也不自动操作 GUI**；因此不能把该门禁描述为“完整安装过程已经无人值守实机验证”。实际 GUI 安装和卸载仍由开发者本机交互完成。CI 自身使用的 GitHub Actions 下载属于测试基础设施，不属于开发机一键脚本的供应链路径。

### 2.7 Stage 2 Platform 基础

Stage 2 已用独立 Platform 单元测试、隔离 PostgreSQL 18.4 集成测试和真实 HTTP readiness smoke 固化以下边界：

- Config 继续复用 Pydantic，只读取代码显式声明的 `AIMA_*` 环境变量；当前不自动加载 `.env` 或 `env.local.example`，避免引入第二套隐式配置优先级；
- PostgreSQL 密码不进入普通环境变量，固定从 `<AIMA_SECRET_DIR>/postgres_password` 只读文件读取；Secret Reader 限制文件类型/大小/UTF-8/NUL/空值，并且异常不回显 Secret 内容；
- 数据库采用已批准的同步 SQLAlchemy 2 + psycopg 3 路线，提供惰性 Engine、`SELECT 1` readiness、同步 Session Factory 与 `dispose()`；Stage 2 不自动建表、不自动运行 Alembic；
- `GET /health/live` 保持原 Contract，只表示进程存活；新增稳定 `operation_id=healthReady` 的 `GET /health/ready`，检查 PostgreSQL、Artifact 根目录和日志目录，全部就绪返回 200，任一失败返回 503；响应只包含组件 `ok/error`，禁止回传连接串、Secret 或原始异常；
- 应用日志使用 Python 标准库 `logging + RotatingFileHandler`，按 Blueprint 05 输出北京时间毫秒、一行稳定事件、最终层脱敏和 `20 MiB × 10` gzip 轮转；API/Worker/Scheduler 分文件，Docker/stdout 继续只是辅助；
- `ArtifactStore` 只按 `storage_key` 存取字节；Local 实现禁止绝对路径、`..`、反斜杠与符号链接逃逸，同 key 不静默覆盖，并采用同目录临时文件 + fsync + 原子替换；
- `ArtifactService` 负责 Artifact ID、元数据 Port 和 `pending → stored → linked` 编排；Stage 2 只用 Fake Metadata Port 证明边界，PostgreSQL `artifacts` Table/Repository 与 Alembic Revision 留到 Stage 3；
- Artifact 删除/保留动作继续不实现，直到阶段 0 的访问、保留与删除规则得到批准；
- API、Worker、Scheduler、Migration 已建立共用 Platform bootstrap/entrypoint，但本阶段不伪造 Worker Job 循环、Scheduler 计划逻辑或 Migration Revision；这些仍分别受后续阶段门禁约束；
- Stage 2 CI 使用 `postgres:18.4` 做隔离集成验证。CI 拉取到的具体镜像 digest 只是该次测试证据，不是生产 Release digest；生产基础镜像 variant/digest 仍由阶段 0/11 决定。

## 3. 版本选择与冻结政策"""
          replace_once(decision_doc, marker, stage2_section)
          replace_once(
              decision_doc,
              "| Windows 开发环境引导 | `scripts/setup_dev_environment.cmd/.ps1` 读取 `.python-version`、`.node-version`、`.uv-version`、`frontend/package.json`；国内源与安全边界由脚本和 Windows CI 维护 |",
              "| Windows 开发环境引导 | `scripts/setup_dev_environment.cmd/.ps1` 读取 `.python-version`、`.node-version`、`.uv-version`、`frontend/package.json`；国内源与安全边界由脚本和 Windows CI 维护 |\n| Stage 2 非敏感配置 | `backend/src/aima_ugc/platform/config/` 明确声明 `AIMA_*`；`env.local.example` 仅作示例，不自动加载 |\n| Stage 2 Secret | `<AIMA_SECRET_DIR>/postgres_password` 文件；读取和错误边界由 `platform/security` 与测试维护 |\n| Stage 2 DB/readiness | `platform/database`、`bootstrap/api.py`、固定 OpenAPI 与 `Stage 2 Platform` CI 共同维护 |\n| Artifact 基础 | `platform/storage` 定义 Service/Port，`adapters/storage/local` 提供 Local Store；PostgreSQL Metadata Repository 留到阶段 3 |",
          )
          replace_once(
              decision_doc,
              "Stage 1 原有的 OpenAPI SDK、前端 Lint/TypeScript/Vue 组合、根 Python build backend、package discovery、本地双服务启动和 Windows x64 开发环境引导门禁已经通过自动化验证解决，不再列为未决项。阶段 0 上述业务/运维输入未完成时，仍不得批量实现五平台、宣称搜索质量/单机容量达标或宣称生产恢复已验收。",
              "Stage 1 的工具链/本地开发门禁和 Stage 2 的 Config、Secret、Logging、PostgreSQL 连接、readiness、Artifact/Local Store 与四进程 Platform bootstrap 已通过自动化验证，不再列为未决项。阶段 0 上述业务/运维输入未完成时，仍不得批量实现五平台、替用户决定 Artifact 保留/删除规则、宣称搜索质量/单机容量达标或宣称生产恢复已验收。",
          )
          replace_once(
              decision_doc,
              "| 2 Platform | 目录/日志/Secret/Artifact 生命周期已定；可基于 Stage 1 工程基线开始 | Store 通过 Artifact UUID 反查数据库 |",
              "| 2 Platform | **已完成**：显式 Config、Secret 文件、统一日志、同步 PostgreSQL Runtime、`/health/ready`、ArtifactService/ArtifactStore + Local Store、四进程最小 bootstrap，以及隔离 PostgreSQL 18.4 CI 均已验证；后续保持边界不漂移 | Store 通过 Artifact UUID 反查数据库、自动建表/跑 Migration、提前实现 Artifact 删除策略、用 readiness 回传 Secret/连接串 |",
          )
          PY

      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs; then
            echo "No documentation changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "同步 Stage 2 Platform 技术事实"
          git push origin "HEAD:${GITHUB_REF_NAME}"
