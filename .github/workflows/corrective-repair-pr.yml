name: Corrective PR Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: corrective-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/corrective/data
      AIMA_LOG_DIR: .runtime/corrective/logs
      AIMA_SECRET_DIR: .runtime/corrective/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: "5432"
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: "3"

    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v7.0.1
        with:
          ref: fix/stage1-stage7-comprehensive-corrective
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: .python-version

      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'corrective-ci' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"

      - name: Apply verified corrective patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          migration = Path("migrations/versions/20260818_0018_stage1_stage7_comprehensive_corrective.py")
          text = migration.read_text(encoding="utf-8")
          replacements = {
              "ck_collection_plan_decision_policies_policy_object": "policy_object",
              "ck_collection_content_actions_external_content_id_nonempty": "external_content_id_nonempty",
              "ck_collection_content_actions_previous_count_nonneg": "previous_count_nonneg",
              "ck_collection_content_actions_detail_action_allowed": "detail_action_allowed",
              "ck_collection_content_actions_comment_action_allowed": "comment_action_allowed",
              "ck_collection_content_actions_comment_target_positive": "comment_target_positive",
              "ck_collection_content_actions_reply_target_positive": "reply_target_positive",
              "ck_collection_content_actions_resolved_count_nonneg": "resolved_count_nonneg",
              "ck_collection_content_actions_completion_order": "completion_order",
              "ck_content_external_ids_id_type_nonempty": "id_type_nonempty",
              "ck_content_external_ids_external_id_nonempty": "external_id_nonempty",
              "ck_content_topics_position_nonnegative": "position_nonnegative",
              "ck_content_topics_name_nonempty": "name_nonempty",
              "ck_comment_thread_coverage_observations_root_id_nonempty": "root_id_nonempty",
              "ck_comment_thread_coverage_observations_coverage_allowed": "coverage_allowed",
              "ck_comment_thread_coverage_observations_captured_nonneg": "captured_nonneg",
              "ck_comment_thread_coverage_observations_reported_nonneg": "reported_nonneg",
              "ck_comment_thread_coverage_observations_target_nonneg": "target_nonneg",
          }
          for old, new in replacements.items():
              needle = f'name="{old}"'
              if text.count(needle) != 1:
                  raise SystemExit(f"expected exactly one migration constraint name: {old}")
              text = text.replace(needle, f'name="{new}"')
          for suffix in (
              "position_nonnegative",
              "media_type_allowed",
              "alternate_ids_object",
              "location_type_allowed",
              "latitude_range",
              "longitude_range",
          ):
              text = text.replace(f'name=f"ck_{{table_name}}_{suffix}"', f'name="{suffix}"')
          migration.write_text(text, encoding="utf-8")

          scope = Path("backend/src/aima_ugc/bootstrap/collection_scope.py")
          text = scope.read_text(encoding="utf-8")
          old = '''        if action.decision.detail_action == "fetch" and not context.cancel_requested():\n            comment_source = self._fetch_detail(\n                run=run,\n                scope=scope,\n                content=content,\n                content_id=content_id,\n                provider_config=provider_config,\n                context=context,\n                stats=stats,\n            )\n            if not action.detail_completed:\n                post_detail = self._decision_service.decide(\n'''
          new = '''        if (\n            action.decision.detail_action == "fetch"\n            and not action.detail_completed\n            and not context.cancel_requested()\n        ):\n            comment_source = self._fetch_detail(\n                run=run,\n                scope=scope,\n                content=content,\n                content_id=content_id,\n                provider_config=provider_config,\n                context=context,\n                stats=stats,\n            )\n            post_detail = self._decision_service.decide(\n'''
          if text.count(old) != 1:
              raise SystemExit("expected detail recovery block exactly once")
          text = text.replace(old, new)
          old_tail = '''                action = self._content_actions.complete_detail(\n                    action_id=action.id,\n                    decision=post_detail,\n                    resolved_comment_count=_observed_comment_count(comment_source),\n                    fence=context.fence,\n                )\n            decision = action.decision\n'''
          new_tail = '''            action = self._content_actions.complete_detail(\n                action_id=action.id,\n                decision=post_detail,\n                resolved_comment_count=_observed_comment_count(comment_source),\n                fence=context.fence,\n            )\n            decision = action.decision\n'''
          if text.count(old_tail) != 1:
              raise SystemExit("expected detail completion tail exactly once")
          scope.write_text(text.replace(old_tail, new_tail), encoding="utf-8")

          writer = Path("backend/src/aima_ugc/adapters/persistence/postgres/collection_content.py")
          text = writer.read_text(encoding="utf-8")
          old = "from sqlalchemy import insert, select\n"
          new = "from sqlalchemy import select\nfrom sqlalchemy.dialects.postgresql import insert as pg_insert\n"
          if text.count(old) != 1:
              raise SystemExit("expected SQLAlchemy insert import exactly once")
          text = text.replace(old, new)
          old = '''    def _session_insert_thread_coverage(\n        session: Session,\n        **values: object,\n    ) -> None:\n        session.execute(insert(comment_thread_coverage_observations_table).values(**values))\n'''
          new = '''    def _session_insert_thread_coverage(\n        session: Session,\n        **values: object,\n    ) -> None:\n        statement = pg_insert(comment_thread_coverage_observations_table).values(**values)\n        session.execute(\n            statement.on_conflict_do_update(\n                constraint="uq_comment_thread_coverage_source",\n                set_={\n                    "coverage": statement.excluded.coverage,\n                    "reported_total": statement.excluded.reported_total,\n                    "captured_count": statement.excluded.captured_count,\n                    "target_count": statement.excluded.target_count,\n                    "stop_reason": statement.excluded.stop_reason,\n                    "observed_at": statement.excluded.observed_at,\n                },\n            )\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit("expected thread coverage insert block exactly once")
          writer.write_text(text.replace(old, new), encoding="utf-8")
          PY

          uv run ruff format backend tests scripts
          uv run ruff format migrations/versions/20260818_0018_stage1_stage7_comprehensive_corrective.py
          uv run ruff format --check backend tests scripts
          uv run ruff check backend tests scripts migrations/versions/20260818_0018_stage1_stage7_comprehensive_corrective.py

      - name: Verify migration and targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run mypy backend/src
          uv run pytest tests/unit/database tests/unit/collection tests/unit/platform tests/contracts -q
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
          uv run pytest \
            tests/integration/collection/test_comprehensive_corrective_runtime.py \
            tests/integration/collection/test_collection_worker_retry_runtime.py \
            -q
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py
          uv run python scripts/quality/scan_secrets.py
          git diff --check

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend tests scripts migrations/versions/20260818_0018_stage1_stage7_comprehensive_corrective.py
          git commit -m "fix(corrective): close recovery and migration drift"
          git push origin HEAD:fix/stage1-stage7-comprehensive-corrective
