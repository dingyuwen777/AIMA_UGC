name: Stage 3 Temporary Content Seed Migration

on:
  push:
    branches:
      - feature/stage3-excel-brand-vehicle-filter
    paths:
      - .github/workflows/stage3-content-seed-migration-temp.yml

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/stage3-content-seed/data
      AIMA_LOG_DIR: .runtime/stage3-content-seed/logs
      AIMA_SECRET_DIR: .runtime/stage3-content-seed/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage3-excel-brand-vehicle-filter
          fetch-depth: 0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Prepare isolated PostgreSQL runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'ci-postgres' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check

      - name: Migrate stale Content integration import seeds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          targets = {
              "tests/integration/content/test_analysis_provider_concurrency.py": {
                  "fixture": "def _xlsx(",
                  "alias": "爱玛",
                  "helper": "_seed_contents",
                  "has_runtime": True,
                  "keep_pack": False,
              },
              "tests/integration/content/test_bidirectional_relevance_review.py": {
                  "fixture": "def _xlsx(",
                  "alias": "爱玛",
                  "helper": "_seed_import",
                  "has_runtime": False,
                  "keep_pack": False,
              },
              "tests/integration/content/test_chg314_review_regressions.py": {
                  "fixture": "def _xlsx(",
                  "alias": "CHG314",
                  "helper": "_seed_contents",
                  "has_runtime": True,
                  "keep_pack": False,
              },
              "tests/integration/content/test_excel_follower_count_voice_plaza.py": {
                  "fixture": "def _follower_workbook(",
                  "alias": "爱玛",
                  "helper": "_import_workbook",
                  "has_runtime": False,
                  "keep_pack": False,
              },
              "tests/integration/content/test_manual_relevance_review.py": {
                  "fixture": "def _xlsx(",
                  "alias": "爱玛",
                  "helper": "_seed_import",
                  "has_runtime": False,
                  "keep_pack": False,
              },
              "tests/integration/content/test_stage12_analysis_runs.py": {
                  "fixture": "def _xlsx(",
                  "alias": "爱玛",
                  "helper": "_seed_contents",
                  "has_runtime": False,
                  "keep_pack": False,
              },
              "tests/integration/content/test_stage8d_voice_plaza_runtime.py": {
                  "fixture": "def _xlsx(",
                  "alias": "爱玛",
                  "helper": "_seed_import",
                  "has_runtime": False,
                  "keep_pack": True,
              },
          }

          brand_helper = '''def _stage3_filter_brand_id(runtime, *, alias: str = "爱玛") -> str:  # type: ignore[no-untyped-def]
              """建立或复用当前测试 Runtime 的 Stage 3 品牌过滤事实。"""

              service = PostgresBrandVehicleHttpService(runtime)
              active = service.list_brands(
                  search=None,
                  status_value="active",
                  role=None,
                  offset=0,
                  limit=200,
              )
              for brand in active.items:
                  if brand.display_name == alias or any(item.text == alias for item in brand.aliases):
                      return str(brand.id)
              brand = service.create_brand(
                  BrandCreateRequest(
                      code=f"STAGE3-CONTENT-{uuid4()}",
                      display_name=f"Stage3 {alias}",
                      role="owned",
                      aliases=(alias,),
                  ),
                  principal=Principal(
                      principal_id="stage3-content-integration",
                      display_name="Stage3 Content 集成测试管理员",
                      role="administrator",
                      source="development",
                  ),
                  request_id=f"stage3-content-brand-{uuid4()}",
              )
              return str(brand.id)


          '''

          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one exact match, got {count}")
              return text.replace(old, new, 1)

          for name, config in targets.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")

              text = replace_once(
                  text,
                  "from aima_ugc.bootstrap.api import create_app\n",
                  "from aima_ugc.bootstrap.api import create_app\n"
                  "from aima_ugc.bootstrap.brand_vehicle_http import PostgresBrandVehicleHttpService\n"
                  "from aima_ugc.contracts.brand_vehicle import BrandCreateRequest\n"
                  "from aima_ugc.modules.identity import Principal\n",
                  label=f"{name}: Stage 3 test imports",
              )
              fixture = config["fixture"]
              text = replace_once(
                  text,
                  fixture,
                  brand_helper + fixture,
                  label=f"{name}: helper insertion",
              )

              helper = config["helper"]
              if not config["has_runtime"]:
                  if helper == "_seed_import":
                      text = text.replace(
                          "def _seed_import(client: TestClient) -> None:",
                          "def _seed_import(client: TestClient, runtime) -> None:  # type: ignore[no-untyped-def]",
                      )
                      text = text.replace(
                          "def _seed_import(client: TestClient, *, text_suffix: str = \"\") -> str:",
                          "def _seed_import(\n"
                          "    client: TestClient, runtime, *, text_suffix: str = \"\"\n"
                          ") -> str:  # type: ignore[no-untyped-def]",
                      )
                      text = text.replace(
                          "def _seed_import(\n"
                          "    client: TestClient, *, text_suffix: str = \"\", workbook: bytes | None = None\n"
                          ") -> str:",
                          "def _seed_import(\n"
                          "    client: TestClient,\n"
                          "    runtime,\n"
                          "    *,\n"
                          "    text_suffix: str = \"\",\n"
                          "    workbook: bytes | None = None,\n"
                          ") -> str:  # type: ignore[no-untyped-def]",
                      )
                  elif helper == "_import_workbook":
                      text = replace_once(
                          text,
                          "def _import_workbook(client: TestClient) -> None:",
                          "def _import_workbook(\n"
                          "    client: TestClient, runtime\n"
                          ") -> None:  # type: ignore[no-untyped-def]",
                          label=f"{name}: helper signature",
                      )
                  elif helper == "_seed_contents":
                      text = replace_once(
                          text,
                          "def _seed_contents(client: TestClient) -> None:",
                          "def _seed_contents(\n"
                          "    client: TestClient, runtime\n"
                          ") -> None:  # type: ignore[no-untyped-def]",
                          label=f"{name}: helper signature",
                      )

              if not config["keep_pack"]:
                  pattern = re.compile(
                      r"(?ms)^    pack = client\.post\(.*?^    assert keyword\.status_code == 201\n"
                  )
                  text, removed = pattern.subn("", text, count=1)
                  if removed != 1:
                      raise RuntimeError(f"{name}: keyword-pack seed removal count={removed}")

              alias = config["alias"]
              if config["keep_pack"]:
                  text = replace_once(
                      text,
                      "    assert configured.status_code == 200\n    uploaded = client.post(\n",
                      "    assert configured.status_code == 200\n"
                      f"    brand_id = _stage3_filter_brand_id(runtime, alias={alias!r})\n"
                      "    uploaded = client.post(\n",
                      label=f"{name}: brand seed",
                  )
              else:
                  text = replace_once(
                      text,
                      "    uploaded = client.post(\n",
                      f"    brand_id = _stage3_filter_brand_id(runtime, alias={alias!r})\n"
                      "    uploaded = client.post(\n",
                      label=f"{name}: brand seed",
                  )

              old_field = re.compile(
                  r'^            \("keyword_pack_ids", \(None, pack\.json\(\)\["id"\]\)\),$',
                  flags=re.MULTILINE,
              )
              text, changed = old_field.subn(
                  '            ("brand_ids", (None, brand_id)),',
                  text,
                  count=1,
              )
              if changed != 1:
                  raise RuntimeError(f"{name}: multipart field migration count={changed}")

              if helper == "_seed_import" and not config["has_runtime"]:
                  text = text.replace("_seed_import(import_client)", "_seed_import(import_client, runtime)")
                  text = text.replace(
                      "_seed_import(import_client, text_suffix=",
                      "_seed_import(import_client, runtime, text_suffix=",
                  )
                  text = text.replace("_seed_import(client)", "_seed_import(client, runtime)")
                  text = text.replace(
                      "_seed_import(client, workbook=",
                      "_seed_import(client, runtime, workbook=",
                  )
              elif helper == "_seed_contents" and not config["has_runtime"]:
                  text = text.replace("_seed_contents(client)", "_seed_contents(client, runtime)")
              elif helper == "_import_workbook":
                  text = text.replace("_import_workbook(client)", "_import_workbook(client, runtime)")

              if name.endswith("test_excel_follower_count_voice_plaza.py"):
                  text = text.replace(
                      "通过正式 HTTP Import 与冻结词包配置提交测试 Excel。",
                      "通过正式 HTTP Import 与冻结品牌过滤范围提交测试 Excel。",
                  )

              if '"keyword_pack_ids"' in text:
                  raise RuntimeError(f"{name}: stale keyword_pack_ids remains")
              path.write_text(text, encoding="utf-8")

          print("Migrated", len(targets), "Content integration seed files")
          PY

      - name: Format and statically verify migrated tests
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=(
            tests/integration/content/test_analysis_provider_concurrency.py
            tests/integration/content/test_bidirectional_relevance_review.py
            tests/integration/content/test_chg314_review_regressions.py
            tests/integration/content/test_excel_follower_count_voice_plaza.py
            tests/integration/content/test_manual_relevance_review.py
            tests/integration/content/test_stage12_analysis_runs.py
            tests/integration/content/test_stage8d_voice_plaza_runtime.py
          )
          uv run ruff check --fix "${TARGETS[@]}"
          uv run ruff format "${TARGETS[@]}"
          uv run ruff check "${TARGETS[@]}"
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -ne "${#TARGETS[@]}" ]]; then
            printf 'Unexpected changed file count: %s\n' "${#changed[@]}"
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
          for target in "${TARGETS[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "${target}"
          done

      - name: Run complete Content PostgreSQL integration suite
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/content -q

      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AIMA Stage 3 Test Migrator"
          git config user.email "aima-stage3-test-migrator@users.noreply.github.com"
          git add -- tests/integration/content
          test -n "$(git diff --cached --name-only)"
          git commit -m "测试：迁移 Content 集成导入种子到品牌过滤"
          git push origin HEAD:feature/stage3-excel-brand-vehicle-filter
