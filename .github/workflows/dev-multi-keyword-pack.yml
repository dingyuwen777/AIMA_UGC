name: Dev Multi Keyword Pack

on:
  push:
    branches:
      - feature/multi-keyword-pack-entrypoints
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: dev-multi-pack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/dev-multi-pack/data
      AIMA_LOG_DIR: .runtime/dev-multi-pack/logs
      AIMA_SECRET_DIR: .runtime/dev-multi-pack/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/multi-keyword-pack-entrypoints
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Install uv and dependencies
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
          npm ci --prefix frontend
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'dev-multi-pack' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"

      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/dev/apply_multi_keyword_pack_change.py
          uv run python scripts/dev/fix_multi_keyword_pack_patch.py

      - name: Generate contracts and frontend client
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          uv run python scripts/contracts/generate.py --check

      - name: Run targeted static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format backend/src/aima_ugc/bootstrap/import_http.py backend/src/aima_ugc/bootstrap/import_worker.py backend/src/aima_ugc/bootstrap/api.py backend/src/aima_ugc/bootstrap/collection_http.py backend/src/aima_ugc/contracts/http.py backend/src/aima_ugc/modules/ingestion/http.py backend/src/aima_ugc/modules/ingestion/import_job.py tests/api/test_stage8b_imports.py tests/api/test_stage8e_collection_runs.py tests/integration/ingestion/test_stage8b_import_http_worker.py
          uv run ruff check backend/src/aima_ugc/bootstrap/import_http.py backend/src/aima_ugc/bootstrap/import_worker.py backend/src/aima_ugc/bootstrap/api.py backend/src/aima_ugc/bootstrap/collection_http.py backend/src/aima_ugc/contracts/http.py backend/src/aima_ugc/modules/ingestion/http.py backend/src/aima_ugc/modules/ingestion/import_job.py tests/api/test_stage8b_imports.py tests/api/test_stage8e_collection_runs.py tests/integration/ingestion/test_stage8b_import_http_worker.py
          uv run mypy backend/src
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck

      - name: Upgrade database
        run: uv run alembic upgrade head

      - name: Run target tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/api/test_stage8b_imports.py tests/api/test_stage8e_collection_runs.py -q
          uv run pytest tests/integration/ingestion -q
          npm --prefix frontend run test -- --run

      - name: Commit generated and implementation changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend contracts tests docs
          git commit -m "统一 Excel 与手工采集多词包选择"
          git push origin HEAD:feature/multi-keyword-pack-entrypoints
