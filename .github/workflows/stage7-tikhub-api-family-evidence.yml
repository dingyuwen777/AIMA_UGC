name: Stage 7 TikHub API Family Evidence

on:
  push:
    branches:
      - feature/stage7-completion
    paths:
      - ".github/workflows/stage7-tikhub-api-family-evidence.yml"
      - "scripts/dev/probe_tikhub_api_family_evidence_once.py"

permissions:
  contents: write
  pull-requests: read

jobs:
  evidence:
    name: TikHub bounded API family evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage7-completion
          fetch-depth: 0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Validate locked evidence probe
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
          uv run ruff format scripts/dev/probe_tikhub_api_family_evidence_once.py
          uv run ruff check --fix scripts/dev/probe_tikhub_api_family_evidence_once.py
          uv run ruff format --check scripts/dev/probe_tikhub_api_family_evidence_once.py
          uv run ruff check scripts/dev/probe_tikhub_api_family_evidence_once.py
          uv run python -m py_compile scripts/dev/probe_tikhub_api_family_evidence_once.py
          uv run pytest \
            tests/unit/collection/test_tikhub_api_family_candidates.py \
            tests/unit/collection/test_tikhub_api_family_compare.py \
            -q

      - name: Verify api.tikhub.io connectivity
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 https://api.tikhub.io/openapi.json)"
          test "${status}" = "200"
          echo "TikHub connectivity verified: HTTP ${status}"

      - name: Generate one-time RSA public key
        shell: bash
        run: |
          set -euo pipefail
          secure_dir="${RUNNER_TEMP}/tikhub-api-family-evidence-secret"
          mkdir -p "${secure_dir}"
          chmod 700 "${secure_dir}"
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "${secure_dir}/private.pem"
          chmod 600 "${secure_dir}/private.pem"
          openssl pkey -in "${secure_dir}/private.pem" -pubout \
            -out "${secure_dir}/public.pem"
          public_key_b64="$(base64 -w 0 "${secure_dir}/public.pem")"
          echo "::warning file=.github/workflows/stage7-tikhub-api-family-evidence.yml,line=1,title=TikHub API family evidence one-time public key::tikhub-api-family-evidence-public-key:${GITHUB_RUN_ID}:${public_key_b64}"

      - name: Receive encrypted TikHub credential from PR body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          secure_dir="${RUNNER_TEMP}/tikhub-api-family-evidence-secret"
          marker="<!-- tikhub-api-family-evidence-ciphertext:${GITHUB_RUN_ID} -->"
          ciphertext=""
          for _ in $(seq 1 120); do
            pr_body="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/55" | jq -r '.body // ""')"
            ciphertext="$(printf '%s' "${pr_body}" | jq -Rrs --arg marker "${marker}" \
              'split($marker) | if length > 1 then .[1] | split("\n") | map(select(length > 0))[0] // "" else "" end')"
            if [ -n "${ciphertext}" ]; then
              break
            fi
            sleep 5
          done
          test -n "${ciphertext}"
          printf '%s' "${ciphertext}" | base64 --decode > "${secure_dir}/ciphertext.bin"
          openssl pkeyutl -decrypt \
            -inkey "${secure_dir}/private.pem" \
            -in "${secure_dir}/ciphertext.bin" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out "${secure_dir}/token"
          chmod 600 "${secure_dir}/token"
          token="$(cat "${secure_dir}/token")"
          test "${#token}" -ge 16
          echo "::add-mask::${token}"
          rm -f "${secure_dir}/ciphertext.bin"

      - name: Preflight all possible endpoint prices
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "${RUNNER_TEMP}/tikhub-api-family-evidence-secret/token")"
          echo "::add-mask::${token}"
          export AIMA_TIKHUB_PROBE_TOKEN="${token}"
          uv run python - <<'PY'
          from decimal import Decimal
          import os
          import httpx

          paths = (
              "/api/v1/douyin/search/fetch_video_search_v2",
              "/api/v1/douyin/search/fetch_video_search_v1",
              "/api/v1/weibo/web/fetch_search",
              "/api/v1/weibo/app/fetch_search_all",
              "/api/v1/bilibili/app/fetch_search_by_type",
              "/api/v1/bilibili/web/fetch_general_search",
              "/api/v1/kuaishou/app/search_video_v2",
              "/api/v1/kuaishou/app/search_comprehensive",
              "/api/v1/weibo/app/fetch_status_comments",
              "/api/v1/weibo/web_v2/fetch_post_comments",
              "/api/v1/bilibili/app/fetch_video_comments",
              "/api/v1/bilibili/web/fetch_video_comments",
              "/api/v1/bilibili/app/fetch_reply_detail",
              "/api/v1/bilibili/web/fetch_comment_reply",
          )
          token = os.environ["AIMA_TIKHUB_PROBE_TOKEN"]
          total = Decimal("0")
          with httpx.Client(
              base_url="https://api.tikhub.io",
              headers={"Authorization": f"Bearer {token}"},
              timeout=30.0,
              trust_env=False,
          ) as client:
              for path in paths:
                  response = client.get(
                      "/api/v1/tikhub/user/get_endpoint_info",
                      params={"endpoint": path},
                  )
                  response.raise_for_status()
                  body = response.json()
                  data = body.get("data", {}) if isinstance(body, dict) else {}
                  raw = data.get("endpoint_cost") if isinstance(data, dict) else None
                  if raw is None:
                      raise RuntimeError(f"endpoint_info missing endpoint_cost: {path}")
                  cost = Decimal(str(raw))
                  if cost <= 0:
                      raise RuntimeError(f"invalid endpoint_cost: {path}")
                  total += cost
                  print(f"verified endpoint cost: {path} = {cost} USD")
          limit = Decimal("0.120000")
          print(f"worst-case business request cost: {total} USD; cap={limit} USD")
          if total > limit:
              raise SystemExit("estimated business cost exceeds hard cap")
          PY
          unset AIMA_TIKHUB_PROBE_TOKEN

      - name: Run bounded real API family evidence
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "${RUNNER_TEMP}/tikhub-api-family-evidence-secret/token")"
          echo "::add-mask::${token}"
          export AIMA_TIKHUB_PROBE_TOKEN="${token}"
          export AIMA_TIKHUB_API_FAMILY_EVIDENCE_APPROVED=yes
          export AIMA_TIKHUB_PROBE_OUTPUT_DIR="${RUNNER_TEMP}/tikhub-api-family-evidence"
          uv run python scripts/dev/probe_tikhub_api_family_evidence_once.py
          unset AIMA_TIKHUB_PROBE_TOKEN

      - name: Stage and validate sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          target="tests/fixtures/providers/tikhub/api_family/2026-08-16"
          test ! -e "${target}"
          mkdir -p "$(dirname "${target}")"
          cp -R "${RUNNER_TEMP}/tikhub-api-family-evidence" "${target}"
          uv run python scripts/quality/scan_secrets.py
          git add "${target}"
          git diff --cached --check

      - name: Publish sanitized summary annotation
        shell: bash
        run: |
          set -euo pipefail
          summary_b64="$(base64 -w 0 "${RUNNER_TEMP}/tikhub-api-family-evidence/summary.json")"
          echo "::warning file=.github/workflows/stage7-tikhub-api-family-evidence.yml,line=1,title=TikHub API family evidence result::tikhub-api-family-evidence-result:${GITHUB_RUN_ID}:${summary_b64}"

      - name: Commit evidence and remove one-time probe
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/stage7-completion
          test "$(git rev-parse origin/feature/stage7-completion)" = "${GITHUB_SHA}"
          git rm \
            .github/workflows/stage7-tikhub-api-family-evidence.yml \
            scripts/dev/probe_tikhub_api_family_evidence_once.py
          git add tests/fixtures/providers/tikhub/api_family/2026-08-16
          git diff --cached --check
          git config user.name "AIMA Stage 7 Runner"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "保存 TikHub API family 真实对照证据"
          git push origin HEAD:feature/stage7-completion

      - name: Remove ephemeral credential material
        if: always()
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/tikhub-api-family-evidence-secret"
