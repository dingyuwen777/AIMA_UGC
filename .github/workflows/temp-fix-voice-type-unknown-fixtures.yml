name: Temporary Fix Voice Type Unknown Fixtures

on:
  push:
    branches:
      - feature/voice-type-chinese-values

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Replace remaining current unknown voice_type fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          files = [
              'tests/integration/collection/test_collection_supplement_target_eligibility.py',
              'tests/unit/analysis/test_content_labeling.py',
              'tests/unit/analysis/test_content_labeling_validation.py',
              'tests/unit/analysis/test_multilabel_analysis_v2.py',
          ]
          total = 0
          for filename in files:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              before = text
              text = text.replace('voice_type="unknown"', 'voice_type="无法判断"')
              text = text.replace('"voice_type": "unknown"', '"voice_type": "无法判断"')
              total += before.count('voice_type="unknown"')
              total += before.count('"voice_type": "unknown"')
              path.write_text(text, encoding='utf-8')
          if total != 10:
              raise SystemExit(f'预期修正 10 处 voice_type unknown，实际 {total}')
          PY
      - name: Commit fixture fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-fix-voice-type-unknown-fixtures.yml
          git add tests/integration/collection/test_collection_supplement_target_eligibility.py tests/unit/analysis/test_content_labeling.py tests/unit/analysis/test_content_labeling_validation.py tests/unit/analysis/test_multilabel_analysis_v2.py
          git commit -m "测试：同步无法判断发声类型夹具"
          git push origin HEAD:feature/voice-type-chinese-values
