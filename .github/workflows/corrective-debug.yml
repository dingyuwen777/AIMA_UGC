name: Corrective Focused Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/corrective-debug.yml"

permissions:
  contents: read

jobs:
  provider-persistence-first-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: debug-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/debug/data
      AIMA_LOG_DIR: .runtime/debug/logs
      AIMA_SECRET_DIR: .runtime/debug/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: "5432"
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: "3"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q "uv==$(tr -d '\r\n' < .uv-version)"
          uv sync --locked --quiet
          mkdir -p "$AIMA_DATA_DIR" "$AIMA_LOG_DIR" "$AIMA_SECRET_DIR"
          printf '%s\n' 'debug-ci' > "$AIMA_SECRET_DIR/postgres_password"
          chmod 600 "$AIMA_SECRET_DIR/postgres_password"
          uv run alembic upgrade head >/dev/null
      - name: First collection integration failure
        shell: bash
        run: uv run pytest tests/integration/collection -x -q --tb=short

  downgrade-ghost:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: debug-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/debug/data
      AIMA_LOG_DIR: .runtime/debug/logs
      AIMA_SECRET_DIR: .runtime/debug/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: "5432"
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: "3"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q "uv==$(tr -d '\r\n' < .uv-version)"
          uv sync --locked --quiet
          mkdir -p "$AIMA_DATA_DIR" "$AIMA_LOG_DIR" "$AIMA_SECRET_DIR"
          printf '%s\n' 'debug-ci' > "$AIMA_SECRET_DIR/postgres_password"
          chmod 600 "$AIMA_SECRET_DIR/postgres_password"
      - name: Trace downgrade state
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic upgrade head >/dev/null
          uv run alembic downgrade base
          uv run alembic current
          uv run python - <<'PY'
          from sqlalchemy import inspect
          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.database import DatabaseRuntime
          runtime = DatabaseRuntime(load_settings())
          try:
              print("TABLES_AFTER_BASE=", sorted(inspect(runtime.engine).get_table_names()))
          finally:
              runtime.dispose()
          PY
