name: Benchmark Analysis throughput once

on:
  push:
    branches:
      - feature/335-analysis-provider-concurrency
    paths:
      - .github/workflows/benchmark-analysis-throughput-once.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: analysis-benchmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/analysis-throughput/data
      AIMA_LOG_DIR: .runtime/analysis-throughput/logs
      AIMA_SECRET_DIR: .runtime/analysis-throughput/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/335-analysis-provider-concurrency
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked

      - name: Prepare isolated PostgreSQL runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'analysis-benchmark' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"
          uv run alembic upgrade head

      - name: Compare Formal Worker with Offline Python chain
        shell: bash
        run: |
          set -euo pipefail
          uv run python .github/scripts/benchmark-analysis-throughput-once.py
