name: Temporary fast-uri lock refresh

on:
  push:
    branches:
      - fix/310-frontend-fullstack-audit

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: fix/310-frontend-fullstack-audit
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh only fast-uri in lockfile
        working-directory: frontend
        run: npm update fast-uri --package-lock-only --ignore-scripts

      - name: Verify scoped lockfile change
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "frontend/package-lock.json"
          node - <<'NODE'
          const lock = require('./frontend/package-lock.json')
          const pkg = lock.packages['node_modules/fast-uri']
          if (!pkg || pkg.version !== '3.1.6') {
            throw new Error(`expected fast-uri 3.1.6, got ${pkg?.version}`)
          }
          NODE
          git diff -- frontend/package-lock.json

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: patch fast-uri transitive dependency to 3.1.6" -m "Requirement-Source: #310"
          git push origin HEAD:fix/310-frontend-fullstack-audit
