name: Stage 7 Apply Reply Normalization Fixes

on:
  push:
    branches:
      - feature/stage7-completion
    paths:
      - ".github/workflows/stage7-apply-reply-normalization-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage7-completion
          fetch-depth: 0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Apply three real-response normalization fixes
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path

          ks = Path("backend/src/aima_ugc/adapters/providers/tikhub/operations/kuaishou.py")
          text = ks.read_text(encoding="utf-8")
          anchor = '''        if normalized == previous_cursor:\n            return cls(normalized, False, "pagination_not_advanced")\n        return cls(normalized, True)\n\n\n@dataclass(frozen=True, slots=True)\nclass KuaishouSearchPagination:\n'''
          replacement = '''        if normalized == previous_cursor:\n            return cls(normalized, False, "pagination_not_advanced")\n        return cls(normalized, True)\n\n    @classmethod\n    def from_response(\n        cls,\n        *,\n        previous_cursor: str,\n        body: dict[str, Any],\n        item_key: str,\n    ) -> KuaishouCursorPagination:\n        """按真实 Web 评论响应的 data.<items>/pcursor 判断下一页。"""\n        data = body.get("data")\n        if not isinstance(data, dict):\n            return cls(previous_cursor, False, "response_data_unavailable")\n        items = data.get(item_key)\n        if not isinstance(items, list) or not items:\n            return cls(previous_cursor, False, "empty_page")\n        returned = data.get("pcursor")\n        if returned is None:\n            return cls(previous_cursor, False, "cursor_unavailable")\n        normalized = str(returned).strip()\n        if normalized == "":\n            return cls("", False, "provider_exhausted")\n        if normalized == previous_cursor:\n            return cls(normalized, False, "pagination_not_advanced")\n        return cls(normalized, True)\n\n\n@dataclass(frozen=True, slots=True)\nclass KuaishouSearchPagination:\n'''
          if anchor not in text:
              raise SystemExit("kuaishou cursor anchor not found")
          text = text.replace(anchor, replacement, 1)
          anchor = '''def _required_text(value: str, field_name: str) -> str:\n'''
          replacement = '''def extract_sub_comment_items(body: dict[str, Any]) -> tuple[dict[str, Any], ...]:\n    """从真实 Web 二级评论响应提取 data.subComments；空页保持空 tuple。"""\n    data = body.get("data")\n    if not isinstance(data, dict):\n        return ()\n    items = data.get("subComments")\n    if not isinstance(items, list):\n        return ()\n    return tuple(item for item in items if isinstance(item, dict))\n\n\n''' + anchor
          if anchor not in text:
              raise SystemExit("kuaishou extractor anchor not found")
          text = text.replace(anchor, replacement, 1)
          anchor = '''    "extract_search_items",\n]\n'''
          replacement = '''    "extract_search_items",\n    "extract_sub_comment_items",\n]\n'''
          if anchor not in text:
              raise SystemExit("kuaishou __all__ anchor not found")
          ks.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")

          dy = Path("backend/src/aima_ugc/adapters/providers/tikhub/mappers/douyin.py")
          text = dy.read_text(encoding="utf-8")
          old = '''        root_comment_id = context.root_comment_id\n        parent_comment_id = _douyin_parent_comment_id(raw)\n'''
          new = '''        root_comment_id = context.root_comment_id or optional_string(raw, "root_comment_id")\n        parent_comment_id = _douyin_parent_comment_id(raw)\n'''
          if old not in text:
              raise SystemExit("douyin reply root anchor not found")
          dy.write_text(text.replace(old, new, 1), encoding="utf-8")

          wb = Path("backend/src/aima_ugc/adapters/providers/tikhub/mappers/weibo.py")
          text = wb.read_text(encoding="utf-8")
          old = '''def _weibo_parent_comment_id(raw: dict[str, Any], root_comment_id: str | None) -> str | None:\n    for key in ("reply_id", "replyid", "rid"):\n'''
          new = '''def _weibo_parent_comment_id(raw: dict[str, Any], root_comment_id: str | None) -> str | None:\n    reply_comment = first_dict(raw, "reply_comment")\n    explicit_parent = optional_string(reply_comment, "idstr", "mid", "id")\n    if explicit_parent not in {None, "0"}:\n        return explicit_parent\n    for key in ("reply_id", "replyid", "rid"):\n'''
          if old not in text:
              raise SystemExit("weibo direct parent anchor not found")
          wb.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Format and verify reply normalization
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            backend/src/aima_ugc/adapters/providers/tikhub/operations/kuaishou.py \
            backend/src/aima_ugc/adapters/providers/tikhub/mappers/douyin.py \
            backend/src/aima_ugc/adapters/providers/tikhub/mappers/weibo.py \
            tests/unit/collection/test_tikhub_real_reply_mappers.py
          uv run ruff check \
            backend/src/aima_ugc/adapters/providers/tikhub/operations/kuaishou.py \
            backend/src/aima_ugc/adapters/providers/tikhub/mappers/douyin.py \
            backend/src/aima_ugc/adapters/providers/tikhub/mappers/weibo.py \
            tests/unit/collection/test_tikhub_real_reply_mappers.py
          uv run pytest tests/unit/collection/test_tikhub_real_reply_mappers.py -q

      - name: Commit verified fixes and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/stage7-apply-reply-normalization-fixes.yml
          git config user.name "AIMA Stage 7 Runner"
          git config user.email "actions@users.noreply.github.com"
          git add \
            backend/src/aima_ugc/adapters/providers/tikhub/operations/kuaishou.py \
            backend/src/aima_ugc/adapters/providers/tikhub/mappers/douyin.py \
            backend/src/aima_ugc/adapters/providers/tikhub/mappers/weibo.py \
            tests/unit/collection/test_tikhub_real_reply_mappers.py
          git commit -m "按真实回复结构修正归一化"
          git push origin HEAD:feature/stage7-completion
