name: Dev Provider Lookup Validation

on:
  push:
    branches:
      - feature/provider-lookup-supplement-eligibility
    paths:
      - ".github/workflows/dev-provider-lookup-validation.yml"
      - "scripts/dev/probe_excel_tikhub_supplement.py"
      - "backend/src/aima_ugc/adapters/providers/imports/**"
      - "backend/src/aima_ugc/adapters/providers/tikhub/**"
      - "backend/src/aima_ugc/adapters/persistence/postgres/collection_targets.py"
      - "backend/src/aima_ugc/bootstrap/collection_http.py"
      - "backend/src/aima_ugc/bootstrap/content_http.py"
      - "backend/src/aima_ugc/contracts/http.py"
      - "frontend/src/features/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-contracts:
    if: github.actor != 'github-actions[bot]'
    name: Generate contracts and verify identity tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14.7"

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24.19.0"

      - name: Install frozen environments
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv==$(tr -d '\r\n' < .uv-version)"
          uv sync --locked
          npm ci --prefix frontend

      - name: Align manual Excel columns and identity expectations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          columns_path = Path("backend/src/aima_ugc/adapters/providers/imports_test/test.py")
          text = columns_path.read_text(encoding="utf-8")
          replacements = {
              'EXCEL_CONTENT_COLUMNS = (\n    "平台",\n': 'EXCEL_CONTENT_COLUMNS = (\n    "平台",\n    "内容ID",\n',
              'EXCEL_LABEL_DETAIL_COLUMNS = (\n    "平台",\n': 'EXCEL_LABEL_DETAIL_COLUMNS = (\n    "内容ID",\n    "平台",\n',
              'EXCEL_COMMENT_COLUMNS = (\n    "平台",\n': 'EXCEL_COMMENT_COLUMNS = (\n    "平台",\n    "内容ID",\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  if new in text:
                      continue
                  raise SystemExit(f"expected imports_test column block not found: {old!r}")
              text = text.replace(old, new, 1)
          columns_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/unit/collection/test_imports_excel.py")
          test_text = test_path.read_text(encoding="utf-8")
          old = 'assert source_fallback.alternate_ids == {}'
          new = 'assert source_fallback.alternate_ids == {"source_article_id": "SOURCE-002"}'
          if old in test_text:
              test_text = test_text.replace(old, new, 1)
          elif new not in test_text:
              raise SystemExit("expected source_article_id fallback assertion not found")
          test_path.write_text(test_text, encoding="utf-8")
          PY

      - name: Generate OpenAPI and frontend client
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          uv run ruff format \
            backend/src/aima_ugc/adapters/providers/imports_test/test.py \
            tests/unit/collection/test_imports_excel.py \
            scripts/dev/probe_excel_tikhub_supplement.py

      - name: Verify generated result and target tests
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py --check
          uv run ruff check \
            backend/src/aima_ugc/adapters/providers/imports_test/test.py \
            tests/unit/collection/test_imports_excel.py \
            tests/unit/collection/test_provider_lookup_identity.py \
            scripts/dev/probe_excel_tikhub_supplement.py
          uv run pytest \
            tests/unit/collection/test_imports_excel.py \
            tests/unit/collection/test_provider_lookup_identity.py -q
          npm --prefix frontend run typecheck

      - name: Commit generated and normalized files to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add \
            backend/src/aima_ugc/adapters/providers/imports_test/test.py \
            tests/unit/collection/test_imports_excel.py \
            scripts/dev/probe_excel_tikhub_supplement.py \
            contracts/openapi/openapi.json \
            frontend/src/generated/api
          if git diff --cached --quiet; then
            echo "No generated or normalized changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "生成补采契约并修正身份测试"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  real-tikhub-probe:
    if: github.actor != 'github-actions[bot]'
    needs: generate-contracts
    name: Real TikHub Excel supplement probe
    runs-on: ubuntu-24.04
    env:
      TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
      TIKHUB_BASE_URL: https://api.tikhub.io
    steps:
      - name: Checkout latest feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/provider-lookup-supplement-eligibility
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14.7"

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv==$(tr -d '\r\n' < .uv-version)"
          uv sync --locked

      - name: Require protected TikHub secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TIKHUB_API_KEY}" ]]; then
            echo "Repository Actions Secret TIKHUB_API_KEY is not configured."
            exit 2
          fi
          echo "::add-mask::${TIKHUB_API_KEY}"

      - name: Verify five-platform Excel URL to Detail and Comments
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/dev/probe_excel_tikhub_supplement.py \
            --keyword "爱玛" \
            --max-candidates-per-platform 3 \
            --output /tmp/tikhub-excel-supplement-probe.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/tikhub-excel-supplement-probe.json").read_text(encoding="utf-8"))
          platforms = payload.get("platforms", [])
          if len(platforms) != 5:
              raise SystemExit("expected five verified platform results")
          for item in platforms:
              if item.get("detail") != "ok" or item.get("comments") != "ok":
                  raise SystemExit(f"platform probe incomplete: {item.get('platform')}")
          print("Five-platform Excel URL → TikHub Detail + Comments probe passed.")
          PY

      - name: Record non-secret real probe evidence in Change
        shell: bash
        env:
          PROBE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path("/tmp/tikhub-excel-supplement-probe.json")
          payload = json.loads(result_path.read_text(encoding="utf-8"))
          change_path = Path("changes/active/CHG-20260822-provider-lookup-supplement-eligibility/CHANGE.md")
          text = change_path.read_text(encoding="utf-8")
          marker = "## 五平台真实 Excel → TikHub 补采验证"
          if marker in text:
              raise SystemExit("real probe evidence section already exists")
          lines = [
              "",
              marker,
              "",
              f"GitHub Actions Run：`{os.environ['PROBE_RUN_ID']}`。",
              f"验证时间：`{payload['verified_at']}`；关键词：`{payload['keyword']}`；真实请求数：`{payload['request_count']}`；预计费用上限内累计：`{payload['cumulative_planned_cost_usd']} USD`。",
              "",
              "| 平台 | Excel 链接解析 | Detail | 一级评论 | 失效候选跳过数 |",
              "| --- | --- | --- | --- | ---: |",
          ]
          for item in payload["platforms"]:
              lookup = ", ".join(item["lookup_types"])
              lines.append(
                  f"| {item['platform']} | `{lookup}` | {item['detail']} | {item['comments']} | {item['failed_candidates_before_success']} |"
              )
          lines.extend(
              [
                  "",
                  "验证链：生产 TikHub Search 选取当前仍有评论的真实内容 → 构造标准平台 URL → 临时 Excel → 生产 Excel Parser → typed lookup identity → 生产 Detail Operation/Transport/Extractor/Mapper → 生产 Comments Operation/Transport/Extractor/Mapper。失效、删除或私密候选只作为跳过样本，不计为平台能力失败。API Key 未写入仓库、PR、Change 或日志。",
                  "",
              ]
          )
          change_path.write_text(text.rstrip() + "\n" + "\n".join(lines), encoding="utf-8")
          PY
          git add changes/active/CHG-20260822-provider-lookup-supplement-eligibility/CHANGE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "记录五平台真实补采验证证据"
          git push origin "HEAD:feature/provider-lookup-supplement-eligibility"
