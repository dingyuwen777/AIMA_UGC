name: Dev Provider Lookup Validation

on:
  push:
    branches:
      - feature/provider-lookup-supplement-eligibility
    paths:
      - ".github/workflows/dev-provider-lookup-validation.yml"
      - "scripts/dev/probe_excel_tikhub_supplement.py"
      - "tests/fixtures/imports/excel_provider_lookup_samples.json"
      - "backend/src/aima_ugc/adapters/providers/imports/**"
      - "backend/src/aima_ugc/adapters/providers/tikhub/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  real-tikhub-probe:
    name: Real TikHub Excel supplement probe
    runs-on: ubuntu-24.04
    env:
      TIKHUB_BASE_URL: https://api.tikhub.io
      PROBE_BRANCH: feature/provider-lookup-supplement-eligibility
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/provider-lookup-supplement-eligibility
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14.7"

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv==$(tr -d '\r\n' < .uv-version)"
          uv sync --locked

      - name: Publish one-time public key and receive encrypted credential
        id: credential
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_KEY=/tmp/aima-tikhub-probe-private.pem
          PUBLIC_KEY_B64=/tmp/aima-tikhub-probe-public.b64
          CIPHER_B64=/tmp/aima-tikhub-probe-key.b64
          CIPHER_BIN=/tmp/aima-tikhub-probe-key.bin
          PLAIN_KEY=/tmp/aima-tikhub-probe-key.txt
          CIPHER_PATH=".github/probe-input/tikhub-key-${GITHUB_RUN_ID}.b64"

          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "${PRIVATE_KEY}"
          openssl pkey -in "${PRIVATE_KEY}" -pubout -outform DER | base64 -w0 > "${PUBLIC_KEY_B64}"
          PUBLIC_KEY="$(cat "${PUBLIC_KEY_B64}")"
          gh pr comment 151 --repo "${GITHUB_REPOSITORY}" --body "[dev-provider-lookup-key] run=${GITHUB_RUN_ID} public_key_spki_base64=${PUBLIC_KEY}"

          found=0
          for _ in $(seq 1 120); do
            git fetch --quiet origin "${PROBE_BRANCH}"
            if git show "origin/${PROBE_BRANCH}:${CIPHER_PATH}" > "${CIPHER_B64}" 2>/dev/null; then
              found=1
              break
            fi
            sleep 5
          done
          if [[ "${found}" != "1" ]]; then
            echo "Encrypted TikHub probe credential was not supplied for this run."
            exit 2
          fi

          base64 -d < "${CIPHER_B64}" > "${CIPHER_BIN}"
          openssl pkeyutl -decrypt \
            -inkey "${PRIVATE_KEY}" \
            -in "${CIPHER_BIN}" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            > "${PLAIN_KEY}"
          TIKHUB_API_KEY="$(cat "${PLAIN_KEY}")"
          if [[ -z "${TIKHUB_API_KEY}" ]]; then
            echo "Decrypted TikHub probe credential is empty."
            exit 2
          fi
          echo "::add-mask::${TIKHUB_API_KEY}"
          printf 'TIKHUB_API_KEY=%s\n' "${TIKHUB_API_KEY}" >> "${GITHUB_ENV}"
          printf 'cipher_path=%s\n' "${CIPHER_PATH}" >> "${GITHUB_OUTPUT}"
          rm -f "${PRIVATE_KEY}" "${PUBLIC_KEY_B64}" "${CIPHER_B64}" "${CIPHER_BIN}" "${PLAIN_KEY}"

      - name: Verify five-platform uploaded Excel URL to Detail and Comments
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/dev/probe_excel_tikhub_supplement.py \
            --samples tests/fixtures/imports/excel_provider_lookup_samples.json \
            --max-candidates-per-platform 6 \
            --output /tmp/tikhub-excel-supplement-probe.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/tikhub-excel-supplement-probe.json").read_text(encoding="utf-8"))
          platforms = payload.get("platforms", [])
          if len(platforms) != 5:
              raise SystemExit("expected five verified platform results")
          for item in platforms:
              if item.get("detail") != "ok" or item.get("comments") != "ok":
                  raise SystemExit(f"platform probe incomplete: {item.get('platform')}")
          print("Five-platform uploaded Excel URL → TikHub Detail + Comments probe passed.")
          PY

      - name: Report non-secret real probe summary to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          CREDENTIAL_OUTCOME: ${{ steps.credential.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/tikhub-excel-supplement-probe.json ]]; then
            python - <<'PY' > /tmp/probe-summary.md
          import json
          from pathlib import Path

          p = json.loads(Path("/tmp/tikhub-excel-supplement-probe.json").read_text(encoding="utf-8"))
          print(f"[dev-provider-lookup-real-probe] source_sha256={p['source_sha256']} requests={p['request_count']} planned_cost_usd={p['cumulative_planned_cost_usd']}")
          print("")
          print("| platform | source row | Detail | Comments | invalid/deleted candidates skipped |")
          print("| --- | ---: | --- | --- | ---: |")
          for item in p["platforms"]:
              print(f"| {item['platform']} | {item['source_row']} | {item['detail']} | {item['comments']} | {item['failed_candidates_before_success']} |")
          PY
            gh pr comment 151 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/probe-summary.md
          else
            gh pr comment 151 --repo "${GITHUB_REPOSITORY}" --body "[dev-provider-lookup-real-probe] run=${GITHUB_RUN_ID} credential=${CREDENTIAL_OUTCOME}; probe=${PROBE_OUTCOME}. No secret/raw data included."
          fi

      - name: Remove credential from runner environment
        if: always()
        shell: bash
        run: |
          set +e
          unset TIKHUB_API_KEY
          rm -f /tmp/aima-tikhub-probe-* /tmp/tikhub-excel-supplement-probe.json
