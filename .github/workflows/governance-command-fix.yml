name: Governance Command Fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'ci/370-test-impact-optimization'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply governance command compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/fix_governance_python_command_once.py
          git diff --check
          if git diff --quiet -- scripts/quality/check_agent_governance.py tests/unit/test_agent_governance.py; then
            exit 0
          fi
          git config user.name "AIMA Governance Fix"
          git config user.email "aima-governance-fix@users.noreply.github.com"
          git add scripts/quality/check_agent_governance.py tests/unit/test_agent_governance.py
          git commit -m "允许治理门禁使用显式 python3 入口"
          git push origin HEAD:${GITHUB_HEAD_REF}
