name: Stage 7 Apply Verified Normalization Artifact

on:
  push:
    branches:
      - feature/stage7-completion
    paths:
      - ".github/workflows/stage7-apply-normalization-artifact.yml"

permissions:
  actions: read
  contents: write

jobs:
  apply:
    name: Apply already-verified real normalization patch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: stage7-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/ci-stage7-apply/data
      AIMA_LOG_DIR: .runtime/ci-stage7-apply/logs
      AIMA_SECRET_DIR: .runtime/ci-stage7-apply/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage7-completion
          fetch-depth: 2

      - name: Verify apply workflow is directly based on verified preview head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f30159f2c66df82c61351bc039beee3702743617"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "${changed}" = ".github/workflows/stage7-apply-normalization-artifact.yml"

      - name: Download exact verified patch artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/verified-patch"
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9250615996/zip" \
            --output "${RUNNER_TEMP}/verified-patch.zip"
          echo "fe842f8e50a9f05c35871e88d17029f524767352a137993723612f7ecd0c7a63  ${RUNNER_TEMP}/verified-patch.zip" | sha256sum --check
          unzip -q "${RUNNER_TEMP}/verified-patch.zip" -d "${RUNNER_TEMP}/verified-patch"

      - name: Validate artifact file allowlist and apply
        shell: bash
        run: |
          set -euo pipefail
          expected="${RUNNER_TEMP}/expected-files.txt"
          cat > "${expected}" <<'EOF'
          backend/src/aima_ugc/adapters/providers/registry.py
          backend/src/aima_ugc/adapters/providers/tikhub/mappers/bilibili.py
          backend/src/aima_ugc/adapters/providers/tikhub/mappers/common.py
          backend/src/aima_ugc/adapters/providers/tikhub/mappers/douyin.py
          backend/src/aima_ugc/adapters/providers/tikhub/mappers/kuaishou.py
          backend/src/aima_ugc/adapters/providers/tikhub/mappers/weibo.py
          backend/src/aima_ugc/adapters/providers/tikhub/mappers/xiaohongshu.py
          backend/src/aima_ugc/adapters/providers/tikhub/operations/bilibili.py
          backend/src/aima_ugc/adapters/providers/tikhub/operations/douyin.py
          backend/src/aima_ugc/adapters/providers/tikhub/operations/kuaishou.py
          backend/src/aima_ugc/adapters/providers/tikhub/transport.py
          tests/integration/content/test_tikhub_real_normalized_ingestion.py
          tests/unit/collection/test_collection_run_job.py
          tests/unit/collection/test_provider_routing.py
          tests/unit/collection/test_tikhub_probe.py
          tests/unit/collection/test_tikhub_real_comment_mappers.py
          tests/unit/collection/test_tikhub_real_detail_mappers.py
          tests/unit/collection/test_tikhub_real_reply_mappers.py
          tests/unit/collection/test_tikhub_real_search_mappers.py
          tests/unit/collection/test_tikhub_transport.py
          EOF
          diff -u "${expected}" "${RUNNER_TEMP}/verified-patch/files.txt"
          while IFS= read -r file; do
            test -f "${RUNNER_TEMP}/verified-patch/${file}"
            cp "${RUNNER_TEMP}/verified-patch/${file}" "${file}"
          done < "${expected}"
          git diff --check

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'stage7-ci' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"

      - name: Re-run full verified normalization gates
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check backend tests scripts
          uv run ruff check backend tests scripts
          uv run mypy backend/src
          uv run alembic upgrade head
          uv run alembic check
          uv run pytest \
            tests/unit/collection/test_tikhub_real_search_operations.py \
            tests/unit/collection/test_tikhub_real_search_mappers.py \
            tests/unit/collection/test_tikhub_real_detail_mappers.py \
            tests/unit/collection/test_tikhub_real_comment_mappers.py \
            tests/unit/collection/test_tikhub_real_reply_mappers.py \
            tests/unit/collection/test_tikhub_real_capabilities.py \
            tests/unit/collection/test_tikhub_transport.py \
            tests/unit/collection/test_provider_routing.py \
            tests/integration/content/test_tikhub_real_normalized_ingestion.py \
            tests/integration/content/test_xhs_raw_replay_job.py \
            -q
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py
          uv run python scripts/quality/scan_secrets.py
          git diff --check

      - name: Commit verified source patch to task branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/stage7-completion
          test "$(git rev-parse origin/feature/stage7-completion)" = "${GITHUB_SHA}"
          while IFS= read -r file; do
            git add -- "${file}"
          done < "${RUNNER_TEMP}/expected-files.txt"
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "固化真实 TikHub 归一化验证补丁"
          git push origin HEAD:feature/stage7-completion
