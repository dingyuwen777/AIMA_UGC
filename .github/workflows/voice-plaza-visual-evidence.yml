name: Voice Plaza Visual Evidence

on:
  push:
    branches:
      - feature/voice-plaza-figma-sync

permissions:
  contents: read

jobs:
  capture:
    name: Capture 1440x900 screenshots
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Install Noto CJK font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install locked frontend environment
        run: npm ci --prefix frontend

      - name: Capture Voice Plaza visual states
        env:
          CI: '1'
          AIMA_CAPTURE_VISUAL: '1'
        run: npm --prefix frontend run test:e2e -- e2e/voice-plaza-design.spec.ts

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: voice-plaza-visual-evidence
          path: frontend/test-results/voice-plaza-figma-*.png
          if-no-files-found: error
          retention-days: 1
