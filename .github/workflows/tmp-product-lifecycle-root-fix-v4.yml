name: Temporary Product Lifecycle Root Fix V4

on:
  push:
    branches:
      - feature/product-resource-lifecycle

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/root-fix-v4/data
      AIMA_LOG_DIR: .runtime/root-fix-v4/logs
      AIMA_SECRET_DIR: .runtime/root-fix-v4/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: '5432'
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: '3'
      EXPECTED_PARENT: bd0fa6f03eae9b8656f88872ce9db12eb4a0637c
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify workflow parent revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
          check-latest: false

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          test "$(uv --version | awk '{print $2}')" = "${UV_VERSION}"
          test "$(python --version)" = "Python 3.14.7"
          uv lock --check
          uv sync --locked
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'ci-postgres' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"

      - name: Apply exact semantic and typing repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one anchor, got {count}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'backend/src/aima_ugc/adapters/persistence/postgres/content_contributions.py',
              '    if after.content_id != content_id or after.version_no is None:\n',
              '    if after is None or after.content_id != content_id or after.version_no is None:\n',
          )

          for path in (
              'backend/src/aima_ugc/adapters/persistence/postgres/provider_lifecycle.py',
              'backend/src/aima_ugc/adapters/persistence/postgres/keyword_lifecycle.py',
          ):
              replace_once(
                  path,
                  'from sqlalchemy.orm import Session\n',
                  'from sqlalchemy.engine import RowMapping\nfrom sqlalchemy.orm import Session\n',
              )
          replace_once(
              'backend/src/aima_ugc/adapters/persistence/postgres/provider_lifecycle.py',
              'def _provider(row) -> ProviderConfig:\n',
              'def _provider(row: RowMapping) -> ProviderConfig:\n',
          )
          replace_once(
              'backend/src/aima_ugc/adapters/persistence/postgres/keyword_lifecycle.py',
              'def _pack(row) -> KeywordPack:\n',
              'def _pack(row: RowMapping) -> KeywordPack:\n',
          )

          replace_once(
              'backend/src/aima_ugc/adapters/persistence/postgres/historical_content.py',
              '''        contribution_drafts = {\n            item.source_row_ordinal: prepare_content_contribution(\n                self._session,\n                cast(CanonicalContentV1, item.content),\n            )\n            for item in winners\n        }\n''',
              '''        contribution_drafts = {\n            item.row.source_row_ordinal: prepare_content_contribution(\n                self._session,\n                cast(CanonicalContentV1, item.row.content),\n            )\n            for item in winners\n        }\n''',
          )

          replace_once(
              'backend/src/aima_ugc/bootstrap/import_revocation_http.py',
              'from aima_ugc.platform.storage import ArtifactService\n',
              'from aima_ugc.platform.storage import ArtifactRecord, ArtifactService\n',
          )
          replace_once(
              'backend/src/aima_ugc/bootstrap/import_revocation_http.py',
              '    def _store_revocation_artifact(self, campaign_id: UUID):\n',
              '    def _store_revocation_artifact(self, campaign_id: UUID) -> ArtifactRecord:\n',
          )

          replace_once(
              'backend/src/aima_ugc/bootstrap/resource_lifecycle_http.py',
              'from sqlalchemy.exc import IntegrityError\n',
              'from sqlalchemy.exc import IntegrityError\nfrom sqlalchemy.orm import Session\n',
          )
          replace_once(
              'backend/src/aima_ugc/bootstrap/resource_lifecycle_http.py',
              'def _audit(\n    session,\n',
              'def _audit(\n    session: Session,\n',
          )

          replacements = {
              'backend/src/aima_ugc/modules/ingestion/revocation_tables.py': {
                  'name="impact_counts_consistent"': 'name="impact_balanced"',
                  'name="unreversible_within_affected"': 'name="unrev_le_affected"',
                  'name="committed_revocation_fully_reversible"': 'name="fully_reversible"',
                  'name="version_no_positive"': 'name="version_ge_1"',
              },
              'migrations/versions/20260907_0041_import_campaign_revocation.py': {
                  'ck_historical_import_campaign_revocations_impact_counts_consistent': 'ck_historical_import_campaign_revocations_impact_balanced',
                  'ck_historical_import_campaign_revocations_unreversible_within_affected': 'ck_historical_import_campaign_revocations_unrev_le_affected',
                  'ck_historical_import_campaign_revocations_committed_revocation_fully_reversible': 'ck_historical_import_campaign_revocations_fully_reversible',
                  'ck_historical_import_revocation_content_versions_version_no_positive': 'ck_historical_import_revocation_content_versions_version_ge_1',
              },
          }
          for path, mapping in replacements.items():
              for old, new in mapping.items():
                  replace_once(path, old, new)

          for name in (
              'ck_historical_import_campaign_revocations_impact_balanced',
              'ck_historical_import_campaign_revocations_unrev_le_affected',
              'ck_historical_import_campaign_revocations_fully_reversible',
              'ck_historical_import_revocation_content_versions_version_ge_1',
          ):
              if len(name.encode('utf-8')) >= 64:
                  raise RuntimeError(f'constraint name too long: {name}')
          PY

      - name: Format and static gates
        id: static
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TASK_PY_FILES < <(git diff --name-only origin/main...HEAD | grep -E '\.py$' || true)
          test "${#TASK_PY_FILES[@]}" -gt 0
          uv run ruff check --fix --select I001,F401 "${TASK_PY_FILES[@]}"
          uv run ruff format "${TASK_PY_FILES[@]}"
          uv run ruff format --check backend tests scripts migrations/versions/20260907_0041_import_campaign_revocation.py migrations/versions/20260907_0042_product_resource_lifecycle.py
          uv run ruff check backend tests scripts migrations/versions/20260907_0041_import_campaign_revocation.py migrations/versions/20260907_0042_product_resource_lifecycle.py
          uv run mypy backend/src

      - name: Unit API and architecture gates
        id: unit
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/ingestion/test_import_campaign_revocation.py tests/unit/system/test_provider_connectivity.py tests/unit/system/test_runtime_provider_config.py tests/api -q
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py

      - name: Migration head and drift evidence
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
          uv run python tests/integration/database/verify_migration_compatibility.py
          uv run alembic upgrade head
          uv run alembic check

      - name: Stage12 and lifecycle PostgreSQL regressions
        id: postgres
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/ingestion/test_stage12_historical_campaign_worker.py::test_historical_campaign_preflights_before_fill_only_import -q
          uv run pytest tests/integration/database/test_product_resource_lifecycle.py tests/integration/database/test_archived_keyword_snapshot.py tests/integration/database/test_keyword_pack_item_lifecycle.py tests/integration/ingestion/test_import_campaign_revocation_postgres.py -q

      - name: Verify repair scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          pr_python = {
              path for path in subprocess.check_output(
                  ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
              ).splitlines() if path.endswith('.py')
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          allowed = pr_python | {
              'migrations/versions/20260907_0041_import_campaign_revocation.py',
          }
          unexpected = changed - allowed
          if unexpected:
              raise RuntimeError(f'unexpected changed files: {sorted(unexpected)}')
          required = {
              'backend/src/aima_ugc/adapters/persistence/postgres/content_contributions.py',
              'backend/src/aima_ugc/adapters/persistence/postgres/historical_content.py',
              'backend/src/aima_ugc/modules/ingestion/revocation_tables.py',
              'migrations/versions/20260907_0041_import_campaign_revocation.py',
          }
          missing = required - changed
          if missing:
              raise RuntimeError(f'required repair files not changed: {sorted(missing)}')
          print('validated repair scope:', *sorted(changed), sep='\n- ')
          PY

      - name: Commit green repair or clean failed workflow
        if: always()
        env:
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
          POSTGRES_OUTCOME: ${{ steps.postgres.outcome }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          SUCCESS=false
          if [[ "${STATIC_OUTCOME}" == "success" && "${UNIT_OUTCOME}" == "success" && "${MIGRATION_OUTCOME}" == "success" && "${POSTGRES_OUTCOME}" == "success" && "${SCOPE_OUTCOME}" == "success" ]]; then
            SUCCESS=true
          fi
          if [[ "${SUCCESS}" != "true" ]]; then
            git reset --hard HEAD
          fi
          git rm .github/workflows/tmp-product-lifecycle-root-fix-v4.yml
          git config user.name "AIMA Temporary Validator"
          git config user.email "aima-validator@users.noreply.github.com"
          if [[ "${SUCCESS}" == "true" ]]; then
            git add -u
            git commit -m "修复生命周期根因并统一代码质量"
          else
            git commit -m "清理失败的临时生命周期根因 V4"
          fi
          git push origin HEAD:feature/product-resource-lifecycle
          test "${SUCCESS}" = "true"
