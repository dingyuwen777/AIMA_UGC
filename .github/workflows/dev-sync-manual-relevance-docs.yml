name: Dev Sync Manual Relevance Docs

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply exact documentation updates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"未找到待替换原文: {path}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "docs/blueprint/03_数据库与文件存储.md",
              """analysis_content_results
          analysis_content_requests
          analysis_content_request_items
          analysis_content_label_pairs
          """,
              """analysis_content_results
          analysis_content_requests
          analysis_content_request_items
          analysis_content_label_pairs
          analysis_content_relevance_reviews
          """,
          )
          replace(
              "docs/blueprint/03_数据库与文件存储.md",
              """backend/src/aima_ugc/modules/analysis/tables.py
          """,
              """backend/src/aima_ugc/modules/analysis/tables.py
          backend/src/aima_ugc/modules/analysis/relevance_review_tables.py
          """,
          )
          replace(
              "docs/blueprint/03_数据库与文件存储.md",
              """backend/src/aima_ugc/adapters/persistence/postgres/analysis.py
          """,
              """backend/src/aima_ugc/adapters/persistence/postgres/analysis.py
          backend/src/aima_ugc/adapters/persistence/postgres/relevance_reviews.py
          """,
          )
          replace(
              "docs/blueprint/03_数据库与文件存储.md",
              """AI 业务事实不塞进 `contents`：当前 `contents` 没有 `is_relevant`、`voice_type`、`sentiment` 或标签列。
          """,
              """AI 业务事实不塞进 `contents`：当前 `contents` 没有 `is_relevant`、`voice_type`、`sentiment` 或标签列。

          人工复核同样属于 Analysis Domain。`analysis_content_results.relevance` 始终保留模型原始判断；当用户把当前 Content Version 的 AI `irrelevant` 人工纳入相关业务数据时，系统只新增 `analysis_content_relevance_reviews` 记录，不改写模型结果。人工决定绑定 `content_id + content_version`，内容产生新版本后旧决定继续留作审计，但不自动套用到新版本。
          """,
          )

          replace(
              "docs/blueprint/04_后端任务API与前端.md",
              """GET  /api/v1/content-analysis-capabilities
          POST /api/v1/content-analysis-requests
          GET  /api/v1/content-analysis-jobs/{job_id}
          """,
              """GET  /api/v1/content-analysis-capabilities
          POST /api/v1/content-analysis-requests
          GET  /api/v1/content-analysis-jobs/{job_id}
          POST /api/v1/content-relevance-reviews
          """,
          )
          replace(
              "docs/blueprint/04_后端任务API与前端.md",
              """backend/src/aima_ugc/adapters/persistence/postgres/analysis.py
          """,
              """backend/src/aima_ugc/adapters/persistence/postgres/analysis.py
          backend/src/aima_ugc/adapters/persistence/postgres/relevance_reviews.py
          """,
          )
          replace(
              "docs/blueprint/04_后端任务API与前端.md",
              """`POST /content-analysis-requests` 会先冻结 Content ID + `current_version`，再创建 `analysis.content-label.v1` Job。Worker 分析的不是“未来可能变化的查询结果”，而是请求创建时冻结的目标版本。
          """,
              """`POST /content-analysis-requests` 会先冻结 Content ID + `current_version`，再创建 `analysis.content-label.v1` Job。Worker 分析的不是“未来可能变化的查询结果”，而是请求创建时冻结的目标版本。

          `POST /content-relevance-reviews` 是同步短事务：接收 1—1000 个不重复 Content ID，只允许把**当前版本、当前 AI 原判为 `irrelevant`** 的内容人工纳入相关业务数据。批量请求先锁定并校验全部目标，任一目标不可复核则整批返回 409；同一当前版本重复提交幂等。模型原始 `analysis_content_results` 不会被更新或删除。
          """,
          )
          replace(
              "docs/blueprint/04_后端任务API与前端.md",
              """- `/voice-plaza`：内容查询、筛选、详情、Analysis 交互；Analysis 按钮资格由后端 `content-analysis-capabilities` 驱动；
          """,
              """- `/voice-plaza`：内容查询、筛选、详情、Analysis 交互；Analysis 按钮资格由后端 `content-analysis-capabilities` 驱动；“AI 相关性”可显式查看待复核 `irrelevant`，并支持单条/批量人工标记为相关；
          """,
          )
          replace(
              "docs/blueprint/04_后端任务API与前端.md",
              """- 如果未显式筛 `relevance`，排除当前 Analysis 明确为 `irrelevant` 的内容；
          - 没有当前 Analysis 的内容仍可显示；
          - 当前版本没有匹配 Analysis，但历史版本分析过时，会表现为 `stale`；
          - 完全没分析过为 `pending`；
          - 单条详情 `get_content()` 使用审计友好的读取，可读取 irrelevant 内容。
          """,
              """- 如果未显式筛 `relevance`，按**有效相关性**排除仍为 `irrelevant` 的内容；
          - 有效相关性只在查询层计算：同一 `content_id + current_version` 存在人工 `relevant` 复核时优先采用人工决定，否则采用当前 AI relevance；
          - `ContentAnalysisResponse.relevance` 继续返回模型原始判断，不被人工复核改写；
          - 显式 `relevance=irrelevant` 只返回尚未人工纳入的当前不相关内容；`relevance=relevant` 同时包含 AI relevant 和当前版本人工纳入内容；
          - 没有当前 Analysis 的内容仍可显示；
          - 当前版本没有匹配 Analysis，但历史版本分析过时，会表现为 `stale`；
          - 完全没分析过为 `pending`；
          - 单条详情 `get_content()` 使用审计友好的读取，可读取 raw irrelevant Analysis 事实。
          """,
          )

          replace(
              "docs/blueprint/07_技术决策与实施门禁.md",
              """analysis_content_results
          analysis_content_label_pairs
          """,
              """analysis_content_results
          analysis_content_label_pairs
          analysis_content_relevance_reviews
          """,
          )
          replace(
              "docs/blueprint/07_技术决策与实施门禁.md",
              """改变这一边界是跨域 Schema/Contract 决策，不能为页面查询方便直接加列。
          """,
              """改变这一边界是跨域 Schema/Contract 决策，不能为页面查询方便直接加列。

          人工对 AI 相关性的纠正也属于 Analysis Domain：不得为了“人工改成相关”去 UPDATE/DELETE `analysis_content_results.relevance`，也不得向 `contents` 加平行布尔列。当前只允许把当前 Content Version 的 AI `irrelevant` 人工纳入 `relevant`，独立保存到 `analysis_content_relevance_reviews`；查询层据此计算业务有效相关性。人工决定绑定 Content Version，新版本不会继承旧人工判断。
          """,
          )

          replace(
              "backend/src/aima_ugc/modules/analysis/README.md",
              """analysis_content_results
          analysis_content_requests
          analysis_content_request_items
          analysis_content_label_pairs
          """,
              """analysis_content_results
          analysis_content_requests
          analysis_content_request_items
          analysis_content_label_pairs
          analysis_content_relevance_reviews
          """,
          )
          replace(
              "backend/src/aima_ugc/modules/analysis/README.md",
              """当前 `contents` 没有 `is_relevant` AI 投影列。

          数据库默认业务列表/查询型 Analysis target/查询型 Export 会按当前 Analysis relevance 语义处理已经判定 irrelevant 的内容；显式审计查询仍可读取 Analysis 事实。
          """,
              """当前 `contents` 没有 `is_relevant` AI 投影列。

          模型原始 `analysis_content_results.relevance` 是不可被人工复核覆盖的审计事实。当前允许用户把同一 Content Version 的 AI `irrelevant` 人工纳入相关业务集合，决定保存到 `analysis_content_relevance_reviews`。默认业务列表、`relevance` 筛选、查询型 Analysis target 和查询型 Export 都复用 `PostgresContentQueryRepository` 的有效相关性：当前版本有人工作为 `relevant` 时优先采用人工决定，否则采用 AI relevance。Content 新版本不会继承旧人工决定。
          """,
          )

          replace(
              "docs/appendix/07_AI舆情打标与分析实现.md",
              """analysis_content_results
          analysis_content_requests
          analysis_content_request_items
          analysis_content_label_pairs
          """,
              """analysis_content_results
          analysis_content_requests
          analysis_content_request_items
          analysis_content_label_pairs
          analysis_content_relevance_reviews
          """,
          )
          replace(
              "docs/appendix/07_AI舆情打标与分析实现.md",
              """因此正式数据库语义是：

          ```text
          Content Raw/Current/History 保留
          → Analysis 标记 irrelevant
          → 默认业务列表/查询型目标/导出排除
          ```

          不是：

          ```text
          DELETE FROM contents
          ```
          """,
              """因此正式数据库语义是：

          ```text
          Content Raw/Current/History 保留
          → Analysis 原始结果标记 irrelevant
          → 默认业务列表/查询型目标/导出排除
          → 用户可在声音广场显式筛出待复核 irrelevant
          → 人工把当前版本纳入 relevant 后进入默认业务集合
          ```

          不是：

          ```text
          DELETE FROM contents
          ```

          人工复核不会修改 `analysis_content_results.relevance`。它写入 `analysis_content_relevance_reviews(content_id, content_version, decision=relevant, request_id, reviewed_at)`；同一版本重复复核幂等，批量请求全量校验后同事务提交。查询层把当前版本人工 `relevant` 作为业务有效相关性，但 Content 详情中的 Analysis 仍可看到 AI 原始 `irrelevant`。当 Content 产生新版本时，旧人工记录继续保留为历史审计，不自动影响新版本。
          """,
          )
          PY

      - name: Commit documentation updates
        shell: bash
        run: |
          set -euo pipefail
          git add docs/blueprint/03_数据库与文件存储.md \
            docs/blueprint/04_后端任务API与前端.md \
            docs/blueprint/07_技术决策与实施门禁.md \
            docs/appendix/07_AI舆情打标与分析实现.md \
            backend/src/aima_ugc/modules/analysis/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "同步 AI 人工相关性复核文档"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
