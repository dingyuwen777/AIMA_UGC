name: Generate contract artifacts once

on:
  push:
    branches:
      - feature/335-analysis-provider-concurrency
    paths:
      - .github/workflows/generate-contracts-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/335-analysis-provider-concurrency
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Install locked environments
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
          npm ci --prefix frontend

      - name: Generate tracked contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          git diff -- contracts/openapi/openapi.json frontend/src/generated/api/client.ts

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/openapi/openapi.json frontend/src/generated/api/client.ts
          if git diff --cached --quiet; then
            echo "Generated artifacts already synchronized."
            exit 0
          fi
          git commit -m "同步生成的 Provider 并发契约"
          git fetch origin feature/335-analysis-provider-concurrency
          git rebase origin/feature/335-analysis-provider-concurrency
          git push origin HEAD:feature/335-analysis-provider-concurrency
