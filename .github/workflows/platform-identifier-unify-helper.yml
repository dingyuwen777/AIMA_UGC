name: Platform Identifier Unify Helper

on:
  push:
    branches:
      - refactor/unify-platform-identifiers

permissions:
  contents: write

jobs:
  apply-once:
    if: github.event.head_commit.message == '执行平台标识统一批处理'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked environments
        shell: bash
        run: |
          python -m pip install 'uv==0.12.3'
          uv sync --locked
          npm --prefix frontend ci

      - name: Apply one-time platform identifier refactor
        shell: bash
        run: |
          python scripts/dev/_unify_platform_identifiers_once.py
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          uv run ruff format backend tests scripts migrations

      - name: Commit generated refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '统一五平台机器标识与数据语义'
          git push origin HEAD:refactor/unify-platform-identifiers
