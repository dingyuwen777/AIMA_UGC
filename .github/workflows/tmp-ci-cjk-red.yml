name: Temporary CI CJK Red

on:
  push:
    branches:
      - fix/ci-backend-cjk-font

permissions:
  contents: read

jobs:
  structural-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Run targeted structural Red
        run: uv run pytest tests/unit/test_ci_workflow_structure.py -q
