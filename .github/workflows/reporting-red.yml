name: Reporting Red

on:
  push:
    branches:
      - feature/executive-editable-report

jobs:
  reporting-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version-file: .uv-version
          enable-cache: true
      - name: Setup Python
        run: uv python install "$(cat .python-version)"
      - name: Install locked environment
        run: uv sync --locked
      - name: Run reporting Red tests
        run: >-
          uv run pytest
          tests/unit/platform/test_reporting_default_template.py
          tests/unit/platform/test_docx_package_structure.py
          -q
