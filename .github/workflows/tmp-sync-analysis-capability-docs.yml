name: Temporary Sync Analysis Capability Docs

# Temporary PR-only workflow; delete after the two formal docs are synchronized.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  sync-docs:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/analysis-runtime-capability

      - name: Update Blueprint and local runtime docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          blueprint = Path('docs/blueprint/04-后端任务API与前端.md')
          text = blueprint.read_text(encoding='utf-8')
          old = '''### 5.3 Content / 声音广场 / Analysis

```text
GET  /api/v1/contents
GET  /api/v1/contents/{content_id}
POST /api/v1/content-analysis-requests
GET  /api/v1/content-analysis-jobs/{job_id}
```

代码：

```text
backend/src/aima_ugc/bootstrap/content_http.py
backend/src/aima_ugc/adapters/persistence/postgres/content_queries.py
backend/src/aima_ugc/adapters/persistence/postgres/analysis.py
```

`POST /content-analysis-requests` 会先冻结 Content ID + `current_version`，再创建 `analysis.content-label.v1` Job。Worker 分析的不是“未来可能变化的查询结果”，而是请求创建时冻结的目标版本。
'''
          new = '''### 5.3 Content / 声音广场 / Analysis

```text
GET  /api/v1/contents
GET  /api/v1/contents/{content_id}
GET  /api/v1/content-analysis-capabilities
POST /api/v1/content-analysis-requests
GET  /api/v1/content-analysis-jobs/{job_id}
```

代码：

```text
backend/src/aima_ugc/contracts/runtime.py
backend/src/aima_ugc/bootstrap/analysis_capability_http.py
backend/src/aima_ugc/bootstrap/content_http.py
backend/src/aima_ugc/adapters/persistence/postgres/content_queries.py
backend/src/aima_ugc/adapters/persistence/postgres/analysis.py
```

`GET /content-analysis-capabilities` 是安全只读运行能力投影，只返回 `configured`。它用于让声音广场在 LLM Base URL / Model / Secret 未形成可执行配置时明确提示并禁用 AI 打标；前端不得读取 `env.local`、Secret 文件或复制后端配置判断。该接口不返回 Base URL、Model、Provider、Secret 路径或 API Key，也不证明外部 LLM 此刻在线；Worker 的执行时配置守卫仍是最终防线。

`POST /content-analysis-requests` 会先冻结 Content ID + `current_version`，再创建 `analysis.content-label.v1` Job。Worker 分析的不是“未来可能变化的查询结果”，而是请求创建时冻结的目标版本。
'''
          if old not in text:
              raise SystemExit('Blueprint target block not found')
          blueprint.write_text(text.replace(old, new, 1), encoding='utf-8')

          runtime = Path('docs/环境运行与部署.md')
          text = runtime.read_text(encoding='utf-8')
          old = '''如果只填了一部分 LLM 配置，Backend 会显示 Warning，并把 AI 视为未配置；不会让一组半完成配置污染正式 Worker Runtime。

Import 和普通 TikHub Collection 不会因为 LLM 配置存在就自动发起 AI 付费调用。只有用户在声音广场显式创建 AI Analysis Job 才调用模型。
'''
          new = '''如果只填了一部分 LLM 配置，Backend 会显示 Warning，并把 AI 视为未配置；不会让一组半完成配置污染正式 Worker Runtime。

声音广场同时通过正式 `GET /api/v1/content-analysis-capabilities` 读取安全布尔能力：

```text
configured=false
→ 页面提示当前环境未配置可用 LLM Runtime
→ AI 打标按钮 disabled
→ 不创建注定失败的 Analysis Job

configured=true
→ 保持现有 selected/query Analysis Job 流程
```

这个 HTTP 能力只返回 `configured`，不会把 `env.local`、Base URL、Model、Secret 路径或 API Key 发给浏览器；它也不替代 Worker 对运行配置的最终校验。

Import 和普通 TikHub Collection 不会因为 LLM 配置存在就自动发起 AI 付费调用。只有用户在声音广场显式创建 AI Analysis Job 才调用模型。
'''
          if old not in text:
              raise SystemExit('Runtime target block not found')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git add docs/blueprint/04-后端任务API与前端.md docs/环境运行与部署.md
          if git diff --cached --quiet; then
            echo 'Docs already synchronized.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "同步 AI Runtime Capability 架构与运行文档"
          git push origin HEAD:feature/analysis-runtime-capability
