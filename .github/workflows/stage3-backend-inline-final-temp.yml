name: Stage 3 Temporary Backend Inline Final

on:
  push:
    branches:
      - feature/stage3-excel-brand-vehicle-filter

permissions:
  contents: write

jobs:
  inline-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage3-excel-brand-vehicle-filter
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - name: Execute reviewed inline transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('.github/workflows/stage3-backend-refactor-temp.yml')
          workflow = path.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, str(path), 'exec'), {})
          PY
      - name: Verify static gates and generated contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv==$(tr -d '\r\n' < .uv-version)"
          uv sync --locked
          uv run ruff format backend/src/aima_ugc/bootstrap backend/src/aima_ugc/modules/ingestion backend/src/aima_ugc/contracts/stage3_import.py
          uv run ruff check --fix backend/src tests/contracts/test_stage3_excel_brand_vehicle_filter_contract.py
          uv run ruff format backend/src/aima_ugc/bootstrap backend/src/aima_ugc/modules/ingestion backend/src/aima_ugc/contracts/stage3_import.py
          uv run ruff check backend/src tests/contracts/test_stage3_excel_brand_vehicle_filter_contract.py
          uv run mypy backend/src
          cp contracts/openapi/openapi.json /tmp/openapi.before.json
          uv run python scripts/contracts/generate.py
          diff -u /tmp/openapi.before.json contracts/openapi/openapi.json
          uv run pytest -q tests/contracts/test_stage3_excel_brand_vehicle_filter_contract.py
      - name: Commit verified inline implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage3-backend-inline-final-temp.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "重构：内联 Stage 3 导入兼容实现"
          git push origin HEAD:feature/stage3-excel-brand-vehicle-filter
