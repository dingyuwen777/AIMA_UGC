name: CI Optimization Patcher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'ci/370-test-impact-optimization'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply deterministic one-time workflow edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          release = Path('.github/workflows/release.yml')
          text = release.read_text(encoding='utf-8')
          for line in (
              '      - docs/02_环境运行与部署.md\n',
              '      - docs/roadmap/02_生产上线实施路线.md\n',
              '      - docs/appendix/11_生产部署与离线Release方案.md\n',
          ):
              if line not in text:
                  raise SystemExit(f'release trigger baseline missing: {line.strip()}')
              text = text.replace(line, '', 1)
          old = '  cancel-in-progress: false\n'
          new = "  cancel-in-progress: ${{ github.event_name == 'pull_request' }}\n"
          if old not in text:
              raise SystemExit('release concurrency baseline missing')
          text = text.replace(old, new, 1)
          release.write_text(text, encoding='utf-8')

          runtime = Path('.github/workflows/runtime.yml')
          text = runtime.read_text(encoding='utf-8')
          marker = '  compose-golden-path:\n    name: Compose Golden Path\n    runs-on: ubuntu-24.04\n'
          replacement = (
              '  compose-golden-path:\n'
              '    name: Compose Golden Path\n'
              "    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false\n"
              '    runs-on: ubuntu-24.04\n'
          )
          if marker not in text:
              raise SystemExit('runtime job baseline missing')
          text = text.replace(marker, replacement, 1)
          draft_block = '''      - name: Defer Runtime Acceptance while PR is Draft
                if: github.event_name == 'pull_request' && github.event.pull_request.draft
                shell: bash
                run: |
                  echo "Draft PR does not run the expensive Compose acceptance. Mark it Ready for review to obtain fresh Runtime evidence." >&2
                  exit 1

          '''.replace('        ', '')
          if draft_block not in text:
              raise SystemExit('runtime draft baseline missing')
          text = text.replace(draft_block, '', 1)
          runtime.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- .github/workflows/release.yml .github/workflows/runtime.yml

      - name: Commit deterministic edits to task branch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- .github/workflows/release.yml .github/workflows/runtime.yml)"
          git config user.name "AIMA CI Optimizer"
          git config user.email "aima-ci-optimizer@users.noreply.github.com"
          git add .github/workflows/release.yml .github/workflows/runtime.yml
          git commit -m "收敛 Release 与 Runtime 重复触发"
          git push origin HEAD:${GITHUB_HEAD_REF}
