name: Bootstrap Stage 1

on:
  push:
    branches:
      - build/repository-bootstrap

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Verify runtime versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(python --version)" = "Python 3.14.7"
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Install uv
        run: python -m pip install "uv==0.12.3"

      - name: Resolve Python lock and sync
        run: |
          uv lock
          uv sync --locked

      - name: Verify Red or Green health behavior
        run: uv run pytest tests/api/test_health.py -q

      - name: Generate OpenAPI
        run: uv run python scripts/contracts/generate.py

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Audit production frontend dependencies
        run: npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Report full frontend dependency audit
        continue-on-error: true
        run: npm --prefix frontend audit --audit-level=high

      - name: Generate TypeScript SDK
        run: npm --prefix frontend run generate:api

      - name: Backend and contract checks
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run python -c "import aima_ugc"
          uv run ruff format --check backend tests scripts
          uv run ruff check backend tests scripts
          uv run mypy backend/src
          uv run pytest tests/unit -q
          uv run pytest tests/contracts -q
          uv run pytest tests/api -q
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py

      - name: Build and verify Wheel
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -c "import aima_ugc; print(aima_ugc.__version__)"

      - name: Frontend checks
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run test -- --run
          npm --prefix frontend run build
          npm --prefix frontend exec -- playwright --version

      - name: Commit generated machine facts
        shell: bash
        run: |
          set -euo pipefail
          git add uv.lock frontend/package-lock.json contracts/openapi/openapi.json frontend/src/generated/api
          if git diff --cached --quiet; then
            echo "生成物无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "生成锁文件和接口客户端"
          git push
