name: Temporary Restore Migration Time Test

on:
  push:
    branches:
      - refactor/coding-skill-beijing-time
    paths:
      - .github/workflows/temp-restore-migration-time-test.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: refactor/coding-skill-beijing-time
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.2

      - name: Restore migration coverage and apply timezone-neutral assertion
        shell: bash
        run: |
          set -euo pipefail
          git show b0b4eae7e314fd49624f126baba563248c69db63:tests/integration/database/test_migration_data_lifecycle.py > tests/integration/database/test_migration_data_lifecycle.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/integration/database/test_migration_data_lifecycle.py")
          text = path.read_text(encoding="utf-8")

          old_imports = '''import pytest
          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.security import read_secret_file
          from alembic import command
          from alembic.config import Config
          from sqlalchemy import URL, create_engine, inspect, text
          from sqlalchemy.engine import Engine
          from sqlalchemy.exc import IntegrityError
          '''
          new_imports = '''import pytest
          from alembic import command
          from alembic.config import Config
          from sqlalchemy import URL, create_engine, inspect, text
          from sqlalchemy.engine import Engine
          from sqlalchemy.exc import IntegrityError

          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.security import read_secret_file
          '''
          if old_imports not in text:
              raise SystemExit("未找到预期 import 块")
          text = text.replace(old_imports, new_imports, 1)

          marker = '''    finally:
              engine.dispose()


          def test_0014_to_0015_accepts_settled_historical_budget_rows(
          '''
          helper = '''    finally:
              engine.dispose()


          def _observed_at(value: object) -> datetime:
              """解析 Migration 写入 JSONB 的带时区时间，并按绝对时刻参与断言。"""
              if not isinstance(value, str):
                  raise AssertionError(
                      f"field_observed_at 时间必须是字符串，实际为 {type(value).__name__}"
                  )
              parsed = datetime.fromisoformat(value)
              if parsed.tzinfo is None or parsed.utcoffset() is None:
                  raise AssertionError("field_observed_at 时间必须包含时区")
              return parsed


          def test_0014_to_0015_accepts_settled_historical_budget_rows(
          '''
          if marker not in text:
              raise SystemExit("未找到 helper 插入点")
          text = text.replace(marker, helper, 1)

          signature = '''def test_0016_to_0017_backfills_only_existing_current_fields(
              migration_database: str,
          ) -> None:
              _upgrade(migration_database, "20260817_0016")
          '''
          replacement = '''def test_0016_to_0017_backfills_only_existing_current_fields(
              migration_database: str,
          ) -> None:
              """0017 回填只覆盖已有字段，并按绝对时刻而非旧 UTC 文本格式比较时间。"""
              _upgrade(migration_database, "20260817_0016")
          '''
          if signature not in text:
              raise SystemExit("未找到 0016→0017 测试入口")
          text = text.replace(signature, replacement, 1)

          replacements = {
              '"SELECT field_observed_at, last_seen_at::text AS seen "': '"SELECT field_observed_at, last_seen_at AS seen "',
              'assert account_fields["author.handle"] == account["seen"]': 'assert _observed_at(account_fields["author.handle"]) == account["seen"]',
              'assert content_fields[field] == content["seen"]': 'assert _observed_at(content_fields[field]) == content["seen"]',
              'assert comment_fields[field] == comment["seen"]': 'assert _observed_at(comment_fields[field]) == comment["seen"]',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"未找到预期替换内容: {old}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")

          docx = Path("backend/src/aima_ugc/platform/reporting/docx_package.py")
          docx_text = docx.read_text(encoding="utf-8")
          old = '''def _core_props_xml() -> str:
              now = beijing_now().astimezone(UTC).strftime("%Y-%m-%dT%H:%M:%SZ")
          '''
          new = '''def _core_props_xml() -> str:
              """按 OOXML W3CDTF 约定把北京时间绝对时刻转换为 UTC `Z`。"""
              now = beijing_now().astimezone(UTC).strftime("%Y-%m-%dT%H:%M:%SZ")
          '''
          if old not in docx_text:
              raise SystemExit("未找到 OOXML core properties 时间实现")
          docx.write_text(docx_text.replace(old, new, 1), encoding="utf-8")
          PY
          ruff check --fix tests/integration/database/test_migration_data_lifecycle.py backend/src/aima_ugc/platform/reporting/docx_package.py
          ruff format tests/integration/database/test_migration_data_lifecycle.py backend/src/aima_ugc/platform/reporting/docx_package.py
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AIMA Coding Repair"
          git config user.email "actions@users.noreply.github.com"
          git add tests/integration/database/test_migration_data_lifecycle.py backend/src/aima_ugc/platform/reporting/docx_package.py
          git commit -m "修复 Migration 时间断言并恢复回归覆盖"
          git push origin HEAD:refactor/coding-skill-beijing-time
