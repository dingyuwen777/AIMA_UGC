name: Report visual tune helper

on:
  push:
    branches:
      - fix/report-visual-fidelity

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/report-visual-fidelity
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - name: Apply final visual tuning and Blueprint sync
        run: |
          python - <<'PY'
          from pathlib import Path

          visual = Path('backend/src/aima_ugc/platform/reporting/visual_docx.py')
          visual_text = visual.read_text(encoding='utf-8')
          visual_updated = visual_text.replace('width_emu=5_000_000', 'width_emu=4_650_000')
          if visual_updated == visual_text:
              print('visual_docx.py: no chart-width change required')
          else:
              visual.write_text(visual_updated, encoding='utf-8')

          blueprint = Path('docs/blueprint/13-统一数据Excel导出与调试复用.md')
          text = blueprint.read_text(encoding='utf-8')
          old = '''Word 的展示层固定为 A4 横向、约 15 mm 页边距和克制的研究报告主题。普通数据表使用
Editorial Table（浅表头、轻横向分隔、无重外框/竖线）；Top 统计在 Markdown 中通过最小
`<!-- aima:table-style=ranking -->` 元数据转换为 Word 原生 Ranking，文字、数量和占比保持
可编辑。Office bar/line 显示数据标签，长分类优先横向 bar；情感每日趋势在 Word 展示为
正面+中性主趋势和负面+混合低量级趋势，两张图仍各自保留内嵌 XLSX，不使用双 Y 轴。
饼图仍为可编辑 Office Chart，百分比保留两位小数。

一级议题和热点关键词词云是唯一允许图片化的统计视觉：由 Pillow 直接消费同一份报告
Counter，以 sqrt 频次权重、确定性全水平布局和蓝/蓝灰色阶生成约 300 DPI PNG，Markdown
使用标准图片语法，DOCX 打包到 `word/media/` 并校验 Relationship、Content Type 和图片
可打开性。运行环境必须提供 CJK 字体，缺失时 fail closed；仓库不提交字体文件。当前仍不
引入 Pandoc、LibreOffice、Matplotlib、pandas、`wordcloud` 库、在线服务或 `python-docx`；
内嵌图表数据继续复用 openpyxl。LibreOffice/Office 只作为开发或交付视觉验证工具。
以上展示规则不得改变 Markdown 表格/图表数据、平台映射或报告统计口径。'''
          new = '''Word 的展示层固定为 A4 横向、约 15 mm 页边距和克制的研究报告主题。普通数据表使用
Editorial Table（浅表头、轻横向分隔、无重外框/竖线）；面向领导扫读的 Top 统计在 Word 中
采用“Top 重点 Ranking + 对应图表/词云 + 其余完整紧凑明细”的两层表达，排名、标签、数量、
占比和细比例条保持 Word 原生可编辑，剩余条目以双列紧凑明细保留，不因视觉裁剪丢失数据。
一级议题进一步使用组合视图：上方为标签对总量、一级议题数和 Top1 占比，左侧为完整一级
议题 Ranking，右侧为词云；该视图不加入图标、奖牌、星标或逐行小饼图/圆环图。平台分布和
情感结构等窄表允许与图表并排，平台 × 情感等宽矩阵保持完整横向表格，避免多列数据被硬塞进
半页宽度。

Office bar/line 继续显示数据标签，长分类优先横向 bar；情感每日趋势仍拆为正面+中性主趋势和
负面+混合低量级趋势。平台、一级议题和二级议题等系列较多的每日趋势把最高声量主序列单独
展示，其余每组最多四个系列，所有分层图仍各自保留内嵌 XLSX、使用绝对数量且不使用双 Y 轴。
`report.md` 中完整的日期/维度/数量长表继续保留；Word 展示层利用横向 A4 宽度按日期为行、
维度为列透视为紧凑矩阵，维度过多时每组最多五列分块，只有展示形态变化，数据语义不变。
饼图仍为可编辑 Office Chart，百分比保留两位小数。

一级议题和热点关键词词云是唯一允许图片化的统计视觉：由 Pillow 直接消费同一份报告 Counter，
最多展示 36 个词，以 sqrt 频次权重并进一步温和压缩字号差异；全部水平排布，第一名可使用系统
CJK 粗体，主体采用海军蓝、主蓝、青绿、柔紫和蓝灰，仅少量次级词使用低饱和赭色点缀。布局
从视觉中心寻找最近空位，完成后按实际字形边界裁切并受限放大回固定 1600×900 画布，因此少词
样例不会缩成中央小团，多词样例仍保留必要呼吸感。布局确定性，不使用随机旋转、图形 mask、
阴影、图标或彩虹配色。PNG 以约 300 DPI 输出，Markdown 使用标准图片语法，DOCX 打包到
`word/media/` 并校验 Relationship、Content Type 和图片可打开性。运行环境必须提供 CJK 字体，
缺失时 fail closed；仓库不提交字体文件。当前仍不引入 Pandoc、LibreOffice、Matplotlib、
pandas、`wordcloud` 库、在线服务或 `python-docx`；内嵌图表数据继续复用 openpyxl。
LibreOffice/Office 只作为开发或交付视觉验证工具。以上展示规则不得改变 Markdown 表格/图表
数据、平台映射或报告统计口径。'''
          if old not in text:
              raise SystemExit('Blueprint target block not found; refusing silent replacement')
          blueprint.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit changes when needed
        run: |
          if git diff --quiet -- backend/src/aima_ugc/platform/reporting/visual_docx.py docs/blueprint/13-统一数据Excel导出与调试复用.md; then
            echo "No tuning changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/aima_ugc/platform/reporting/visual_docx.py docs/blueprint/13-统一数据Excel导出与调试复用.md
          git commit -m "收敛报告组合视觉并同步蓝图"
          git push origin HEAD:fix/report-visual-fidelity
