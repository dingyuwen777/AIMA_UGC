name: Offline Reporting Mypy Fix

on:
  push:
    branches:
      - feature/offline-reporting

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
      - name: Apply minimal ElementTree typing fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/aima_ugc/platform/reporting/docx_package.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from typing import Final\n', 'from typing import Final, cast\n', 1)
          text = text.replace(
              '    return ET.tostring(element, encoding="utf-8", xml_declaration=True)\n',
              '    return cast(bytes, ET.tostring(element, encoding="utf-8", xml_declaration=True))\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          uv run ruff format backend/src/aima_ugc/platform/reporting/docx_package.py
          uv run ruff check backend/src/aima_ugc/platform/reporting/docx_package.py
          uv run mypy backend/src/aima_ugc/platform/reporting/docx_package.py
      - name: Commit type fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/src/aima_ugc/platform/reporting/docx_package.py
          git commit -m '修复：明确DOCX XML序列化返回类型 [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
