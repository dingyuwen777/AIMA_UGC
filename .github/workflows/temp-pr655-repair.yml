name: Temporary PR655 Repair Validation

on:
  push:
    branches:
      - feature/652-hierarchical-label-multiselect

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
          npm ci --prefix frontend
      - name: Backend cursor and API regression
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check             backend/src/aima_ugc/bootstrap/content_http.py             tests/unit/content/test_content_cursor.py
          uv run ruff check             backend/src/aima_ugc/bootstrap/content_http.py             tests/unit/content/test_content_cursor.py
          uv run pytest             tests/unit/content/test_content_cursor.py             tests/api/test_stage8d_contents.py -q
      - name: Contract generated drift and compatibility
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          git diff --exit-code -- contracts frontend/src/generated/api
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py
      - name: Frontend repair regression
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend run lint
          npm --prefix frontend run test -- --run tests/voice-plaza.spec.ts
          npm --prefix frontend run build
          npm --prefix frontend run test:e2e -- e2e/voice-plaza.spec.ts
