name: Temporary Fix Integration Voice Type

on:
  push:
    branches:
      - feature/voice-type-classification-tables
    paths:
      - .tmp_fix_integration_voice_type.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/voice-type-classification-tables
          fetch-depth: 0
      - name: Apply integration fixture migration
        run: python .tmp_fix_integration_voice_type.py
      - name: Commit fixes and remove temporary files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp_fix_integration_voice_type.yml .tmp_fix_integration_voice_type.py
          git add tests/integration/content
          git commit -m "测试：迁移集成测试发声类型动态夹具"
          git push origin HEAD:feature/voice-type-classification-tables
