name: Docs Numbering Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'docs/numbered-document-filenames' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: docs/numbered-document-filenames
          fetch-depth: 0

      - name: 同步最终编号路径引用
        shell: bash
        run: |
          if [ -f scripts/docs_numbering_reorder_temp.py ]; then
            python scripts/docs_numbering_reorder_temp.py
          else
            echo "Appendix 编号引用已同步"
          fi
          python - <<'PY'
          from pathlib import Path

          old = "Windows%20Docker%20Desktop%20Compose运行.md"
          new = "03_Windows%20Docker%20Desktop%20Compose运行.md"
          for path in Path("docs").rglob("*.md"):
              text = path.read_text(encoding="utf-8")
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="")
                  print(path)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "同步最终文档编号路径引用"
            git push origin HEAD:docs/numbered-document-filenames
          fi

      - name: 刷新项目事实源索引
        run: python .agents/skills/reliable-vibe-coding/scripts/rvc.py discover --root . --json

      - name: 修正一次性校验器的 URL 编码旧名判定
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/docs_numbering_validate_temp.py")
          text = path.read_text(encoding="utf-8")
          old = '''        for old in ENCODED_REPLACEMENTS:\n            if old in text:\n                stale.append(f"{rel}: {old}")'''
          new = '''        for old in ENCODED_REPLACEMENTS:\n            encoded_pattern = re.compile(r"(?<!\\d{2}_)" + re.escape(old))\n            if encoded_pattern.search(text):\n                stale.append(f"{rel}: {old}")'''
          if old not in text:
              raise SystemExit("未找到一次性校验器修正锚点")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")
          PY

      - name: 校验编号、引用、正文与本地链接
        run: python scripts/docs_numbering_validate_temp.py

      - name: 运行现有文档质量门禁
        run: python scripts/quality/check_docs.py

      - name: 提交刷新后的项目事实源索引
        shell: bash
        run: |
          git add .reliable-vibe-coding/project-context.json
          if git diff --cached --quiet; then
            echo "project-context 无需刷新"
            exit 0
          fi
          git commit -m "刷新文档重命名后的项目事实源索引"
          git push origin HEAD:docs/numbered-document-filenames
