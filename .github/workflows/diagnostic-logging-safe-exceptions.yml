name: Diagnostic logging safe exception helper

on:
  push:
    branches:
      - fix/diagnostic-logging

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/diagnostic-logging
      - name: Apply safe exception logging patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'target not found: {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # API：保留调用栈定位，但不把异常原始 message/source line 放进 LogRecord。
          replace_once(
              'backend/src/aima_ugc/bootstrap/api.py',
              'from aima_ugc.platform.health import ReadinessReport\n',
              'from aima_ugc.platform.health import ReadinessReport\nfrom aima_ugc.platform.logging import log_exception_event\n',
          )
          replace_once(
              'backend/src/aima_ugc/bootstrap/api.py',
              '''        _LOGGER.error(\n            "API 请求处理失败",\n            extra={\n                "event": "api.request_failed",\n                "request_id": request_id,\n                "method": request.method,\n                "path": request.url.path,\n                "error_type": type(exc).__name__,\n            },\n            exc_info=(type(exc), exc, exc.__traceback__),\n        )''',
              '''        log_exception_event(\n            _LOGGER,\n            logging.ERROR,\n            "api.request_failed",\n            "API 请求处理失败",\n            exc,\n            request_id=request_id,\n            method=request.method,\n            path=request.url.path,\n        )''',
          )

          # Worker：Heartbeat/Handler 未预期异常统一走安全 traceback helper。
          replace_once(
              'backend/src/aima_ugc/platform/jobs/worker.py',
              'from aima_ugc.platform.logging import log_event\n',
              'from aima_ugc.platform.logging import log_event, log_exception_event\n',
          )
          replace_once(
              'backend/src/aima_ugc/platform/jobs/worker.py',
              '''                logger.warning(\n                    "Job Heartbeat 执行失败。",\n                    extra={\n                        "event": "job.heartbeat_failed",\n                        "job_id": str(self._context._job_id),\n                        "error_type": type(exc).__name__,\n                    },\n                    exc_info=(type(exc), exc, exc.__traceback__),\n                )''',
              '''                log_exception_event(\n                    logger,\n                    logging.WARNING,\n                    "job.heartbeat_failed",\n                    "Job Heartbeat 执行失败。",\n                    exc,\n                    job_id=str(self._context._job_id),\n                )''',
          )
          replace_once(
              'backend/src/aima_ugc/platform/jobs/worker.py',
              '''                logger.error(\n                    "Job Handler 执行出现未预期异常。",\n                    extra={\n                        "event": "job.execution_failed",\n                        "job_id": str(job.id),\n                        "job_type": job.job_type,\n                        "worker_id": self._worker_id,\n                        "attempt": job.attempt,\n                        "duration_ms": _elapsed_ms(started),\n                        "error_type": type(exc).__name__,\n                    },\n                    exc_info=(type(exc), exc, exc.__traceback__),\n                )''',
              '''                log_exception_event(\n                    logger,\n                    logging.ERROR,\n                    "job.execution_failed",\n                    "Job Handler 执行出现未预期异常。",\n                    exc,\n                    job_id=str(job.id),\n                    job_type=job.job_type,\n                    worker_id=self._worker_id,\n                    attempt=job.attempt,\n                    duration_ms=_elapsed_ms(started),\n                )''',
          )

          # Collection：隔离失败仍记录安全调用栈与所有稳定关联 ID。
          replace_once(
              'backend/src/aima_ugc/modules/collection/collection_run_executor.py',
              'from aima_ugc.platform.logging import log_event\n',
              'from aima_ugc.platform.logging import log_event, log_exception_event\n',
          )
          replace_once(
              'backend/src/aima_ugc/modules/collection/collection_run_executor.py',
              '''    if error is not None:\n        fields["error_type"] = type(error).__name__\n        logger.error(\n            "Collection Scope 执行出现未预期异常，已隔离为失败终态。",\n            extra=fields,\n            exc_info=(type(error), error, error.__traceback__),\n            stacklevel=2,\n        )\n        return''',
              '''    if error is not None:\n        fields.pop("event")\n        log_exception_event(\n            logger,\n            logging.ERROR,\n            "collection.scope.completed",\n            "Collection Scope 执行出现未预期异常，已隔离为失败终态。",\n            error,\n            **fields,\n        )\n        return''',
          )

          # Runtime resource closer 同样不能使用 raw logger.exception。
          replace_once(
              'backend/src/aima_ugc/bootstrap/runtime.py',
              '''    configure_service_logging,\n    log_event,\n    shutdown_service_logging,''',
              '''    configure_service_logging,\n    log_event,\n    log_exception_event,\n    shutdown_service_logging,''',
          )
          replace_once(
              'backend/src/aima_ugc/bootstrap/runtime.py',
              '''            except Exception:\n                self.logger.exception(\n                    "runtime resource close failed",\n                    extra={"event": "service.resource_close_failed"},\n                )''',
              '''            except Exception as exc:\n                log_exception_event(\n                    self.logger,\n                    logging.ERROR,\n                    "service.resource_close_failed",\n                    "runtime resource close failed",\n                    exc,\n                )''',
          )

          # 新安全 helper 的最小单测：LogRecord 本身也不能含 raw exc_info/secret。
          test_logging = Path('tests/unit/platform/test_logging.py')
          text = test_logging.read_text(encoding='utf-8')
          text = text.replace(
              '''    log_event,\n    shutdown_service_logging,''',
              '''    log_event,\n    log_exception_event,\n    shutdown_service_logging,''',
          )
          marker = '\n\ndef test_logging_redacts_escapes_and_rotates_to_gzip(tmp_path) -> None:\n'
          addition = '''\n\ndef test_exception_event_keeps_safe_stack_without_raw_exception_message(\n    caplog: pytest.LogCaptureFixture,\n) -> None:\n    logger = logging.getLogger("aima_ugc.test.logging.exception")\n    try:\n        raise RuntimeError("postgresql://secret@host/internal")\n    except RuntimeError as exc:\n        with caplog.at_level(logging.ERROR, logger=logger.name):\n            log_exception_event(\n                logger,\n                logging.ERROR,\n                "test.exception",\n                "安全异常",\n                exc,\n                request_id="req-1",\n            )\n\n    record = next(record for record in caplog.records if record.event == "test.exception")\n    assert record.exc_info is None\n    assert record.error_type == "RuntimeError"\n    assert "test_logging.py" in record.exception\n    assert "RuntimeError" in record.exception\n    assert "secret" not in record.exception\n    assert "postgresql://" not in record.exception\n    assert "secret" not in caplog.text\n'''
          if marker not in text:
              raise SystemExit('test logging marker not found')
          test_logging.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')

          # Collection test 改为验证安全 exception 字段，而不是 raw exc_info。
          replace_once(
              'tests/unit/collection/test_collection_logging_failure_isolation.py',
              '''    assert scope_record.error_type == "RuntimeError"\n    assert scope_record.exc_info is not None\n    assert scope_record.run_id == str(execution.run.id)''',
              '''    assert scope_record.error_type == "RuntimeError"\n    assert scope_record.exc_info is None\n    assert "collection_run_executor.py" in scope_record.exception\n    assert "RuntimeError" in scope_record.exception\n    assert "scope failed before producing a terminal result" not in scope_record.exception\n    assert scope_record.run_id == str(execution.run.id)''',
          )

          # Blueprint 明确 traceback 是先安全化再进入 LogRecord，而不是依赖某个 Handler 事后脱敏。
          for path in [
              'docs/blueprint/05-日志安全部署与运维.md',
              'docs/blueprint/09-Scheduler运行与恢复策略.md',
          ]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if path.endswith('05-日志安全部署与运维.md'):
                  old = '异常堆栈仅用于未预期异常且继续经过 Formatter 脱敏/截断。'
                  new = '未预期异常只记录安全调用栈：保留文件名、行号、函数和异常类型，不复制异常原始 message 与源代码行；安全调用栈在进入 LogRecord 前生成，再由 Formatter 执行长度限制。'
                  if old not in text:
                      raise SystemExit('blueprint 05 traceback sentence not found')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - name: Format changed Python files
        run: |
          python -m pip install uv==0.12.3
          uv sync --locked
          uv run ruff format \
            backend/src/aima_ugc/bootstrap/api.py \
            backend/src/aima_ugc/bootstrap/runtime.py \
            backend/src/aima_ugc/platform/jobs/worker.py \
            backend/src/aima_ugc/modules/collection/collection_run_executor.py \
            tests/unit/platform/test_logging.py \
            tests/unit/collection/test_collection_logging_failure_isolation.py
      - name: Commit safe exception changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/aima_ugc/bootstrap/api.py \
            backend/src/aima_ugc/bootstrap/runtime.py \
            backend/src/aima_ugc/platform/jobs/worker.py \
            backend/src/aima_ugc/modules/collection/collection_run_executor.py \
            tests/unit/platform/test_logging.py \
            tests/unit/collection/test_collection_logging_failure_isolation.py \
            docs/blueprint/05-日志安全部署与运维.md
          git commit -m "统一未预期异常的安全调用栈日志"
          git push origin HEAD:fix/diagnostic-logging
