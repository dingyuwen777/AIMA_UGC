name: Stage 7 Fix API Family Evidence Bilibili

on:
  push:
    branches:
      - feature/stage7-completion
    paths:
      - ".github/workflows/stage7-fix-api-family-evidence-bilibili.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage7-completion
          fetch-depth: 0

      - name: Patch Bilibili identity compare and sanitization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          base_path = Path("scripts/dev/probe_tikhub_api_families.py")
          base_text = base_path.read_text(encoding="utf-8")
          old = '''def _bilibili_ids(value: object) -> list[str]:
              ids: list[str] = []
              if isinstance(value, dict):
                  av = value.get("av")
                  if isinstance(av, dict):
                      identifier = av.get("bvid") or av.get("aid")
                      if identifier is not None:
                          ids.append(str(identifier))
                          return ids
                  identifier = value.get("bvid")
                  if identifier is not None and (
                      "title" in value or "author" in value or "play" in value or "arcurl" in value
                  ):
                      ids.append(str(identifier))
                      return ids
                  for child in value.values():
                      ids.extend(_bilibili_ids(child))
              elif isinstance(value, list):
                  for child in value:
                      ids.extend(_bilibili_ids(child))
              return ids
          '''.replace("          ", "")
          new = '''def _bilibili_ids(value: object) -> list[str]:
              ids: list[str] = []
              if isinstance(value, dict):
                  av = value.get("av")
                  if isinstance(av, dict):
                      identifier = av.get("aid") or value.get("param") or av.get("bvid")
                      if identifier is not None:
                          ids.append(str(identifier))
                          return ids
                  identifier = value.get("aid") or value.get("bvid")
                  if identifier is not None and (
                      "title" in value or "author" in value or "play" in value or "arcurl" in value
                  ):
                      ids.append(str(identifier))
                      return ids
                  for child in value.values():
                      ids.extend(_bilibili_ids(child))
              elif isinstance(value, list):
                  for child in value:
                      ids.extend(_bilibili_ids(child))
              return ids
          '''.replace("          ", "")
          if old not in base_text:
              raise SystemExit("expected _bilibili_ids block not found")
          base_path.write_text(base_text.replace(old, new, 1), encoding="utf-8")

          evidence_path = Path("scripts/dev/probe_tikhub_api_family_evidence_once.py")
          text = evidence_path.read_text(encoding="utf-8")

          text = text.replace(
              '    "photo_id",\n    "request_id",',
              '    "photo_id",\n    "param",\n    "request_id",\n    "seid",\n    "trackid",',
              1,
          )
          text = text.replace(
              '        if value.startswith(("http://", "https://")):',
              '        if value.startswith(("http://", "https://", "//")):',
              1,
          )
          text = text.replace(
              '        search_primary_bodies: dict[str, dict[str, Any]] = {}\n'
              '        for case in search_cases:\n'
              '            summary, primary_body, _ = _record_pair(',
              '        search_primary_bodies: dict[str, dict[str, Any]] = {}\n'
              '        search_candidate_bodies: dict[str, dict[str, Any]] = {}\n'
              '        for case in search_cases:\n'
              '            summary, primary_body, candidate_body = _record_pair(',
              1,
          )
          text = text.replace(
              '            search_primary_bodies[case.platform] = primary_body\n',
              '            search_primary_bodies[case.platform] = primary_body\n'
              '            search_candidate_bodies[case.platform] = candidate_body\n',
              1,
          )

          helper_anchor = 'def _pick_bilibili_root(body: dict[str, Any]) -> str | None:\n'
          helper = '''def _bilibili_web_bvid_by_aid(body: dict[str, Any], aid: str) -> str | None:
              """从 Web Search 结果中按共享 AID 找到同一视频的 BVID。"""
              if isinstance(body, dict):
                  raw_aid = body.get("aid")
                  bvid = body.get("bvid")
                  if raw_aid is not None and bvid is not None and str(raw_aid) == aid:
                      return str(bvid)
                  for child in body.values():
                      found = _bilibili_web_bvid_by_aid(child, aid)
                      if found is not None:
                          return found
              elif isinstance(body, list):
                  for child in body:
                      found = _bilibili_web_bvid_by_aid(child, aid)
                      if found is not None:
                          return found
              return None


          '''.replace("          ", "")
          if helper_anchor not in text:
              raise SystemExit("Bilibili helper anchor not found")
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          start_marker = '        bilibili_ids = base._extract_ids("bilibili", search_primary_bodies["bilibili"])\n'
          end_marker = '        estimated_business_cost = sum(\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Bilibili evidence block boundaries not found")
          block = '''        bilibili_aids = base._extract_ids(
              "bilibili", search_primary_bodies["bilibili"]
          )
          shared_identity: tuple[str, str] | None = None
          for aid in bilibili_aids:
              bvid = _bilibili_web_bvid_by_aid(
                  search_candidate_bodies["bilibili"], aid
              )
              if bvid is not None:
                  shared_identity = (aid, bvid)
                  break

          if shared_identity is not None:
              av_id, bv_id = shared_identity
              bili_primary_comments = _request_from(
                  build_bilibili_comments_request(av_id=av_id, sort_mode="latest")
              )
              bili_candidate_comments = _request_from(
                  build_bilibili_web_comments_request(bv_id=bv_id, page=1)
              )
              for request in (bili_primary_comments, bili_candidate_comments):
                  prices.setdefault(request.path, _endpoint_cost(client, request.path))
              primary_status, primary_comments_body = _request_json(
                  client, bili_primary_comments
              )
              candidate_status, candidate_comments_body = _request_json(
                  client, bili_candidate_comments
              )
              primary_comment_ids = _bilibili_comment_ids(primary_comments_body)
              candidate_comment_ids = _bilibili_comment_ids(candidate_comments_body)
              case_name = "bilibili_app_comments_vs_web_comments"
              case_dir = output / case_name
              pseudo = platform_pseudonyms["bilibili"]
              _write_json(
                  case_dir / "primary.request.sanitized.json",
                  _sanitized_request(bili_primary_comments, pseudo),
              )
              _write_json(
                  case_dir / "primary.response.sanitized.json",
                  sanitize_json(primary_comments_body, pseudonyms=pseudo),
              )
              _write_json(
                  case_dir / "candidate.request.sanitized.json",
                  _sanitized_request(bili_candidate_comments, pseudo),
              )
              _write_json(
                  case_dir / "candidate.response.sanitized.json",
                  sanitize_json(candidate_comments_body, pseudonyms=pseudo),
              )
              comparison = asdict(
                  compare_stable_ids(
                      primary_ids=primary_comment_ids,
                      candidate_ids=candidate_comment_ids,
                  )
              )
              for key in ("shared_ids", "primary_only_ids", "candidate_only_ids"):
                  comparison.pop(key, None)
              results.append(
                  {
                      "name": case_name,
                      "platform": "bilibili",
                      "semantic_relation": "same_business",
                      "primary_endpoint": bili_primary_comments.path,
                      "candidate_endpoint": bili_candidate_comments.path,
                      "primary_price_usd": str(prices[bili_primary_comments.path]),
                      "candidate_price_usd": str(prices[bili_candidate_comments.path]),
                      "primary_http_status": primary_status,
                      "candidate_http_status": candidate_status,
                      "primary_provider_code": primary_comments_body.get("code"),
                      "candidate_provider_code": candidate_comments_body.get("code"),
                      "id_comparison": comparison,
                      "shape_comparison": base._shape_summary(
                          primary_comments_body, candidate_comments_body
                      ),
                      "evidence_files": {
                          "primary_request": f"{case_name}/primary.request.sanitized.json",
                          "primary_response": f"{case_name}/primary.response.sanitized.json",
                          "candidate_request": f"{case_name}/candidate.request.sanitized.json",
                          "candidate_response": f"{case_name}/candidate.response.sanitized.json",
                      },
                  }
              )

              root = _pick_bilibili_root(primary_comments_body)
              if root is not None:
                  bili_primary_reply = _request_from(
                      build_bilibili_reply_request(root=root, av_id=av_id)
                  )
                  bili_candidate_reply = _request_from(
                      build_bilibili_web_reply_request(
                          bv_id=bv_id, root=root, page=1
                      )
                  )
                  for request in (bili_primary_reply, bili_candidate_reply):
                      prices.setdefault(request.path, _endpoint_cost(client, request.path))
                  reply_primary_status, reply_primary_body = _request_json(
                      client, bili_primary_reply
                  )
                  reply_candidate_status, reply_candidate_body = _request_json(
                      client, bili_candidate_reply
                  )
                  reply_primary_ids = _bilibili_comment_ids(reply_primary_body)
                  reply_candidate_ids = _bilibili_comment_ids(reply_candidate_body)
                  reply_case_name = "bilibili_app_replies_vs_web_replies"
                  reply_dir = output / reply_case_name
                  _write_json(
                      reply_dir / "primary.request.sanitized.json",
                      _sanitized_request(bili_primary_reply, pseudo),
                  )
                  _write_json(
                      reply_dir / "primary.response.sanitized.json",
                      sanitize_json(reply_primary_body, pseudonyms=pseudo),
                  )
                  _write_json(
                      reply_dir / "candidate.request.sanitized.json",
                      _sanitized_request(bili_candidate_reply, pseudo),
                  )
                  _write_json(
                      reply_dir / "candidate.response.sanitized.json",
                      sanitize_json(reply_candidate_body, pseudonyms=pseudo),
                  )
                  reply_comparison = asdict(
                      compare_stable_ids(
                          primary_ids=reply_primary_ids,
                          candidate_ids=reply_candidate_ids,
                      )
                  )
                  for key in (
                      "shared_ids",
                      "primary_only_ids",
                      "candidate_only_ids",
                  ):
                      reply_comparison.pop(key, None)
                  results.append(
                      {
                          "name": reply_case_name,
                          "platform": "bilibili",
                          "semantic_relation": "same_business",
                          "primary_endpoint": bili_primary_reply.path,
                          "candidate_endpoint": bili_candidate_reply.path,
                          "primary_price_usd": str(prices[bili_primary_reply.path]),
                          "candidate_price_usd": str(prices[bili_candidate_reply.path]),
                          "primary_http_status": reply_primary_status,
                          "candidate_http_status": reply_candidate_status,
                          "primary_provider_code": reply_primary_body.get("code"),
                          "candidate_provider_code": reply_candidate_body.get("code"),
                          "id_comparison": reply_comparison,
                          "shape_comparison": base._shape_summary(
                              reply_primary_body, reply_candidate_body
                          ),
                          "evidence_files": {
                              "primary_request": (
                                  f"{reply_case_name}/primary.request.sanitized.json"
                              ),
                              "primary_response": (
                                  f"{reply_case_name}/primary.response.sanitized.json"
                              ),
                              "candidate_request": (
                                  f"{reply_case_name}/candidate.request.sanitized.json"
                              ),
                              "candidate_response": (
                                  f"{reply_case_name}/candidate.response.sanitized.json"
                              ),
                          },
                      }
                  )

          '''.replace("          ", "")
          evidence_path.write_text(text[:start] + block + text[end:], encoding="utf-8")
          PY
          git diff --check

      - name: Commit focused fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/stage7-completion
          test "$(git rev-parse origin/feature/stage7-completion)" = "${GITHUB_SHA}"
          git rm .github/workflows/stage7-fix-api-family-evidence-bilibili.yml
          git add \
            scripts/dev/probe_tikhub_api_families.py \
            scripts/dev/probe_tikhub_api_family_evidence_once.py
          git diff --cached --check
          git config user.name "AIMA Stage 7 Runner"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "修正 B站 API family 对照与 Evidence 脱敏"
          git push origin HEAD:feature/stage7-completion
