name: Temporary Contract Generation

on:
  push:
    branches:
      - feature/652-hierarchical-label-multiselect

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frozen environments
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
          npm ci --prefix frontend

      - name: Generate contracts and client
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          git status --short -- contracts frontend/src/generated/api
          git add contracts frontend/src/generated/api
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "AIMA Contract Generator"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "同步层级标签多选生成契约"
          git push origin "HEAD:${GITHUB_REF_NAME}"
