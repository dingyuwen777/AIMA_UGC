name: Temporary Offline Reporting Verify

on:
  push:
    branches:
      - feature/offline-reporting

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install locked uv
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          test "$(uv --version | awk '{print $2}')" = "${UV_VERSION}"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Target tests
        run: >-
          uv run pytest
          tests/unit/platform/test_offline_reporting.py
          tests/unit/platform/test_imports_test_reporting.py
          tests/unit/collection/test_p1g_imports_run_all.py
          -q

      - name: Target Ruff format
        run: >-
          uv run ruff format --check
          backend/src/aima_ugc/platform/reporting
          backend/src/aima_ugc/adapters/providers/imports_test/test.py
          tests/unit/platform/test_offline_reporting.py
          tests/unit/platform/test_imports_test_reporting.py
          tests/unit/collection/test_p1g_imports_run_all.py

      - name: Target Ruff lint
        run: >-
          uv run ruff check
          backend/src/aima_ugc/platform/reporting
          backend/src/aima_ugc/adapters/providers/imports_test/test.py
          tests/unit/platform/test_offline_reporting.py
          tests/unit/platform/test_imports_test_reporting.py
          tests/unit/collection/test_p1g_imports_run_all.py

      - name: Target Mypy
        run: >-
          uv run mypy
          backend/src/aima_ugc/platform/reporting
          backend/src/aima_ugc/adapters/providers/imports_test/test.py

      - name: Repository quality checks
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_docs.py
          uv run python scripts/quality/scan_secrets.py

      - name: Build wheel and verify report template packaging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --wheel
          uv run python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              name = "aima_ugc/adapters/providers/imports_test/report_template.md"
              assert name in archive.namelist(), name
          print("report template packaged in wheel")
          PY
