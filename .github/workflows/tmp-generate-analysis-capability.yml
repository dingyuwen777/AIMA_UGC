name: Temporary Generate Analysis Capability Contract

on:
  push:
    branches:
      - feature/analysis-runtime-capability

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '生成 Analysis Capability Contract') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/analysis-runtime-capability

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Install locked generators
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.12.3
          uv sync --locked
          npm ci --prefix frontend

      - name: Generate tracked contract artifacts
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          git add contracts/openapi/openapi.json frontend/src/generated/api
          if git diff --cached --quiet; then
            echo "Generated artifacts already synchronized."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "生成 Analysis Capability Contract"
          git push origin HEAD:feature/analysis-runtime-capability
