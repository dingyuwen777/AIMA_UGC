name: Temporary Product Lifecycle Root Fix V2

on:
  push:
    branches:
      - feature/product-resource-lifecycle
    paths:
      - .github/workflows/tmp-product-lifecycle-root-fix-v2.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: root-fix-v2-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/root-fix-v2/data
      AIMA_LOG_DIR: .runtime/root-fix-v2/logs
      AIMA_SECRET_DIR: .runtime/root-fix-v2/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
      EXPECTED_PARENT: 5d240a014622a0da4173e17d5be064990112853b
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify workflow parent revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('.uv-version', 'uv.lock') }}

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          test "$(uv --version | awk '{print $2}')" = "${UV_VERSION}"
          test "$(python --version)" = "Python 3.14.7"
          uv lock --check
          uv sync --locked
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'root-fix-v2-postgres' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"

      - name: Apply exact repair and validate
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('backend/src/aima_ugc/modules/ingestion/revocation_tables.py'): {
                  'name="impact_counts_consistent"': 'name="impact_balanced"',
                  'name="unreversible_within_affected"': 'name="unrev_le_affected"',
                  'name="committed_revocation_fully_reversible"': 'name="fully_reversible"',
                  'name="version_no_positive"': 'name="version_ge_1"',
              },
              Path('migrations/versions/20260907_0041_import_campaign_revocation.py'): {
                  'ck_historical_import_campaign_revocations_impact_counts_consistent': 'ck_historical_import_campaign_revocations_impact_balanced',
                  'ck_historical_import_campaign_revocations_unreversible_within_affected': 'ck_historical_import_campaign_revocations_unrev_le_affected',
                  'ck_historical_import_campaign_revocations_committed_revocation_fully_reversible': 'ck_historical_import_campaign_revocations_fully_reversible',
                  'ck_historical_import_revocation_content_versions_version_no_positive': 'ck_historical_import_revocation_content_versions_version_ge_1',
              },
          }
          physical_names = (
              'ck_historical_import_campaign_revocations_impact_balanced',
              'ck_historical_import_campaign_revocations_unrev_le_affected',
              'ck_historical_import_campaign_revocations_fully_reversible',
              'ck_historical_import_revocation_content_versions_version_ge_1',
          )
          for name in physical_names:
              length = len(name.encode('utf-8'))
              if length >= 64:
                  raise RuntimeError(f'constraint name too long: {name} ({length})')
          for path, mapping in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(f'{path}: expected exactly one {old!r}, got {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

          mapfile -t TASK_PY_FILES < <(git diff --name-only origin/main...HEAD | grep -E '\.py$' || true)
          if [[ "${#TASK_PY_FILES[@]}" -eq 0 ]]; then
            echo 'No task Python files found' >&2
            exit 1
          fi
          printf 'Task Python scope (%s files):\n' "${#TASK_PY_FILES[@]}"
          printf '%s\n' "${TASK_PY_FILES[@]}"

          uv run ruff check --fix --select I001,F401 "${TASK_PY_FILES[@]}"
          uv run ruff format "${TASK_PY_FILES[@]}"

          uv run ruff format --check \
            backend tests scripts \
            migrations/versions/20260907_0041_import_campaign_revocation.py \
            migrations/versions/20260907_0042_product_resource_lifecycle.py
          uv run ruff check \
            backend tests scripts \
            migrations/versions/20260907_0041_import_campaign_revocation.py \
            migrations/versions/20260907_0042_product_resource_lifecycle.py
          uv run mypy backend/src
          uv run pytest \
            tests/unit/ingestion/test_import_campaign_revocation.py \
            tests/unit/system/test_provider_connectivity.py \
            tests/unit/system/test_runtime_provider_config.py \
            tests/api \
            -q
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py

          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
          uv run python tests/integration/database/verify_migration_compatibility.py
          uv run pytest \
            tests/integration/database/test_product_resource_lifecycle.py \
            tests/integration/database/test_archived_keyword_snapshot.py \
            tests/integration/database/test_keyword_pack_item_lifecycle.py \
            tests/integration/ingestion/test_import_campaign_revocation_postgres.py \
            -q

          python - <<'PY'
          import subprocess

          pr_python = {
              path for path in subprocess.check_output(
                  ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
              ).splitlines() if path.endswith('.py')
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          allowed = pr_python | {
              'backend/src/aima_ugc/modules/ingestion/revocation_tables.py',
              'migrations/versions/20260907_0041_import_campaign_revocation.py',
          }
          unexpected = changed - allowed
          if unexpected:
              raise RuntimeError(f'unexpected changed files: {sorted(unexpected)}')
          required = {
              'backend/src/aima_ugc/modules/ingestion/revocation_tables.py',
              'migrations/versions/20260907_0041_import_campaign_revocation.py',
          }
          missing = required - changed
          if missing:
              raise RuntimeError(f'root-fix files not changed: {sorted(missing)}')
          print('validated changed files:', *sorted(changed), sep='\n- ')
          PY

      - name: Commit successful repair or clean failed temporary workflow
        if: always()
        shell: bash
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          if [[ "${VALIDATION_OUTCOME}" != "success" ]]; then
            git reset --hard HEAD
          fi
          git rm .github/workflows/tmp-product-lifecycle-root-fix-v2.yml
          git config user.name "AIMA Temporary Validator"
          git config user.email "aima-validator@users.noreply.github.com"
          if [[ "${VALIDATION_OUTCOME}" == "success" ]]; then
            git add -u
            git commit -m "修复生命周期约束命名并统一代码质量"
          else
            git commit -m "清理失败的临时生命周期根因复验"
          fi
          git push origin HEAD:feature/product-resource-lifecycle
