name: CHG314 Docs Cleanup

on:
  push:
    branches:
      - fix/314-frontend-fullstack-reliability
    paths:
      - .github/workflows/chg314-ai-green.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout change branch
        uses: actions/checkout@v7.0.1
        with:
          ref: fix/314-frontend-fullstack-reliability
          fetch-depth: 0

      - name: Sync long-lived docs and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dev/apply_chg314_ai_all.py
          git diff --check

      - name: Commit documentation cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: 同步 AI 全量打标并清理施工脚手架" -m "Requirement-Source: #314"
          git push origin HEAD:fix/314-frontend-fullstack-reliability
