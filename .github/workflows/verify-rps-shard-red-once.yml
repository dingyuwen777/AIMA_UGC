name: Finalize RPS shard re-review once

on:
  push:
    branches:
      - feature/335-analysis-provider-concurrency
    paths:
      - .github/workflows/verify-rps-shard-red-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/335-analysis-provider-concurrency
          fetch-depth: 1

      - name: Record re-review and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("changes/active/CHG-20260904-010706-analysis-provider-concurrency/CHANGE.md")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "当前 Verdict：`NO_FINDINGS_WITHIN_SCOPE`。Review 过程中暴露的 generated drift、Stage12 旧验收语义、Ruff/mypy 和过期 Unit Fake 均已修复并重新进入回归链；没有通过降低生产断言或跳过真实 PostgreSQL/Full-stack 边界换取绿色。":
              "当前 Verdict：`NO_FINDINGS_WITHIN_SCOPE`（re-review）。首次 Ready 后独立 Review 发现 HIGH：合法的高并发/低 RPS 配置可能生成理论必超 1,800 秒 Job timeout 的大 Shard。已先建立失败回归证明 `max_concurrency=1000, max_rps=1` 的原公式会得到 20,000 条 Shard，再以 `max_rps × 900 秒` 物理 Attempt 启动预算收紧并完成 targeted Ruff/mypy/pytest Green；修复后 `_analysis_shard_size()` 已把冻结 Provider `max_rps` 传入正式 Preview/Create。re-review 未发现新的 BLOCKER/HIGH/MEDIUM Finding。异常 Validation/Transport Retry 仍可能触发 Job timeout，已作为显式残余边界写入 README/Appendix，不冒充真实 Provider 容量保证。此前 generated drift、Stage12 旧验收语义、Ruff/mypy 和过期 Unit Fake 也均已修复，没有通过降低生产断言或跳过真实 PostgreSQL/Full-stack 边界换取绿色。",
              "- [x] unresolved_cleared: 当前独立 Review 无 BLOCKER/HIGH/MEDIUM Finding；真实 Provider 容量和合并后归档属于明确证据边界/后续门禁，不作为已验证事实隐藏。":
              "- [x] unresolved_cleared: 低 RPS Shard timeout HIGH Finding 已完成 Red → Green → re-review 并关闭；当前无未解决 BLOCKER/HIGH/MEDIUM Finding。真实 Provider 容量和合并后归档属于明确证据边界/后续门禁，不作为已验证事实隐藏。",
              "- [x] reverse_audit: 从最终 PR changed files 反查公开入口、Worker registry、Provider snapshot、DB writer、tests/docs/generated consumer；一次性生成/静态修复/吞吐 benchmark workflow 与脚本均已从最终 diff 清理。":
              "- [x] reverse_audit: 从最终 PR changed files 反查公开入口、Worker registry、Provider snapshot、DB writer、tests/docs/generated consumer；一次性生成/静态修复/吞吐 benchmark 及低 RPS Red-Green workflow/script 均在取证后清理，不进入最终 PR diff。",
              "- 功能实现、测试资产、文档和 generated artifacts 已完成；受控 Formal/Offline 吞吐比为 98.86%。":
              "- 功能实现、测试资产、文档和 generated artifacts 已完成；受控 Formal/Offline 吞吐比为 98.86%。\n- 独立 Review 曾发现并已修复低 RPS Shard timeout HIGH Finding；re-review 当前无未解决 BLOCKER/HIGH/MEDIUM Finding。",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Unexpected Change re-review shape: {old[:80]!r} -> {text.count(old)}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          git rm .github/workflows/verify-rps-shard-red-once.yml
          git diff --check
          python3 scripts/quality/check_docs.py
          python3 scripts/quality/check_docs_facts.py

      - name: Re-run targeted coding regression
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
          uv run ruff check backend/src/aima_ugc/modules/analysis/sharding.py backend/src/aima_ugc/bootstrap/content_http.py tests/unit/analysis/test_analysis_sharding.py tests/unit/content/test_stage12_analysis_planner.py
          uv run mypy backend/src/aima_ugc/modules/analysis/sharding.py backend/src/aima_ugc/bootstrap/content_http.py
          uv run pytest tests/unit/analysis/test_analysis_sharding.py tests/unit/content/test_stage12_analysis_planner.py -q

      - name: Commit final re-review cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changes/active/CHG-20260904-010706-analysis-provider-concurrency/CHANGE.md
          git add -u .github/workflows/verify-rps-shard-red-once.yml
          git commit -m "完成 Analysis RPS Shard re-review 并清理临时 workflow"
          git fetch origin feature/335-analysis-provider-concurrency
          git rebase origin/feature/335-analysis-provider-concurrency
          git push origin HEAD:feature/335-analysis-provider-concurrency
