name: Stage 5D Provider Dispatch

on:
  push:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/modules/collection/**"
      - "backend/src/aima_ugc/platform/jobs/**"
      - "backend/src/aima_ugc/adapters/persistence/postgres/**"
      - "migrations/versions/**"
      - "tests/unit/collection/**"
      - "tests/unit/jobs/**"
      - "tests/integration/collection/**"
      - "scripts/quality/check_architecture.py"
      - ".github/workflows/stage5d-provider-dispatch.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/modules/collection/**"
      - "backend/src/aima_ugc/platform/jobs/**"
      - "backend/src/aima_ugc/adapters/persistence/postgres/**"
      - "migrations/versions/**"
      - "tests/unit/collection/**"
      - "tests/unit/jobs/**"
      - "tests/integration/collection/**"
      - "scripts/quality/check_architecture.py"
      - ".github/workflows/stage5d-provider-dispatch.yml"

permissions:
  contents: write

jobs:
  stage5d-provider-dispatch:
    name: Stage 5D Provider Dispatch
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: stage5d-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/ci-stage5d/data
      AIMA_LOG_DIR: .runtime/ci-stage5d/logs
      AIMA_SECRET_DIR: .runtime/ci-stage5d/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Apply nonretryable 4xx recovery fix in worktree
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/stage1-stage7-correctness'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          provider_path = Path(
              "backend/src/aima_ugc/adapters/persistence/postgres/collection_provider_execution.py"
          )
          provider_lines = provider_path.read_text(encoding="utf-8").splitlines()
          if "    ProviderAttemptRecord," not in provider_lines:
              matches = [
                  index
                  for index, line in enumerate(provider_lines)
                  if line == "    PreparedProviderAttempt,"
              ]
              if len(matches) != 1:
                  raise SystemExit(f"PreparedProviderAttempt import matches={len(matches)}")
              provider_lines.insert(matches[0] + 1, "    ProviderAttemptRecord,")

          if not any("latest_attempt = max(attempts" in line for line in provider_lines):
              matches = [
                  index
                  for index, line in enumerate(provider_lines)
                  if line == "                reserved_attempts = ["
              ]
              if len(matches) != 1:
                  raise SystemExit(f"reserved_attempts matches={len(matches)}")
              block = [
                  "                if attempts:",
                  "                    latest_attempt = max(attempts, key=lambda item: item.attempt_no)",
                  "                    if latest_attempt.dispatch_status != \"reserved\" and not _attempt_allows_retry(",
                  "                        latest_attempt",
                  "                    ):",
                  "                        return PreparedProviderAttempt(",
                  "                            request=persisted_request,",
                  "                            attempt=latest_attempt,",
                  "                        )",
                  "",
              ]
              provider_lines[matches[0]:matches[0]] = block

          provider_text = "\n".join(provider_lines) + "\n"
          helper = '''\n_RETRYABLE_HTTP_STATUSES = {408, 425, 429}\n\n\ndef _attempt_allows_retry(attempt: ProviderAttemptRecord) -> bool:\n    if attempt.dispatch_status in {"not_sent", "unknown"}:\n        return True\n    if attempt.dispatch_status != "completed" or attempt.http_status is None:\n        return False\n    return attempt.http_status in _RETRYABLE_HTTP_STATUSES or attempt.http_status >= 500\n\n'''
          if "def _attempt_allows_retry(" not in provider_text:
              marker = "\n__all__ = [\n"
              if provider_text.count(marker) != 1:
                  raise SystemExit("provider execution __all__ marker is not unique")
              provider_text = provider_text.replace(marker, "\n" + helper + "__all__ = [\n")
          provider_path.write_text(provider_text, encoding="utf-8")

          scope_path = Path("backend/src/aima_ugc/bootstrap/collection_scope.py")
          scope_lines = scope_path.read_text(encoding="utf-8").splitlines()
          if not any("status_code = prepared.attempt.http_status" in line for line in scope_lines):
              starts = [
                  index
                  for index, line in enumerate(scope_lines)
                  if line == '        if prepared.attempt.dispatch_status == "completed":'
                  and index + 1 < len(scope_lines)
                  and scope_lines[index + 1]
                  == "            return self._replay_completed_call(request=request, prepared=prepared)"
              ]
              if len(starts) != 1:
                  raise SystemExit(f"completed replay branch matches={len(starts)}")
              replacement = [
                  '        if prepared.attempt.dispatch_status == "completed":',
                  "            if prepared.attempt.error_code is not None or (",
                  "                prepared.attempt.http_status is not None",
                  "                and prepared.attempt.http_status >= 400",
                  "            ):",
                  "                status_code = prepared.attempt.http_status",
                  "                raise _ProviderCallFailed(",
                  "                    error_code=(",
                  "                        prepared.attempt.error_code",
                  "                        or (",
                  '                            f"http_{status_code}"',
                  "                            if status_code is not None",
                  '                            else "provider_failed"',
                  "                        )",
                  "                    ),",
                  "                    retryable=(",
                  "                        _retryable_http_status(status_code)",
                  "                        if status_code is not None",
                  "                        else False",
                  "                    ),",
                  "                )",
                  "            return self._replay_completed_call(request=request, prepared=prepared)",
              ]
              scope_lines[starts[0] : starts[0] + 2] = replacement
          scope_path.write_text("\n".join(scope_lines) + "\n", encoding="utf-8")

          docs_path = Path("docs/测试与调试说明.md")
          docs_text = docs_path.read_text(encoding="utf-8")
          old = "平台 Operation/Mapper/Capability 的单元测试和 `Stage 7 Normalization CI V2` 共同防止字段映射漂移。"
          new = "平台 Operation/Mapper/Capability 的单元测试、Stage 6/7 正式 CI，以及保留的 `Stage 7 TikHub Real Shape` 手动入口共同防止字段映射漂移。"
          if new not in docs_text:
              if docs_text.count(old) != 1:
                  raise SystemExit(f"stale normalization doc matches={docs_text.count(old)}")
              docs_path.write_text(docs_text.replace(old, new), encoding="utf-8")
          PY
          uv run ruff format \
            backend/src/aima_ugc/adapters/persistence/postgres/collection_provider_execution.py \
            backend/src/aima_ugc/bootstrap/collection_scope.py \
            tests/integration/collection/test_collection_nonretryable_4xx_recovery.py
          git diff --check

      - name: Prepare Stage 5D runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'stage5d-ci' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"

      - name: Unit and Provider contract tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/collection tests/unit/jobs tests/contracts/test_provider_v1.py -q

      - name: Upgrade empty database to Stage 5D head
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
          uv run python - <<'PY'
          from sqlalchemy import inspect, text

          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.database import DatabaseRuntime

          runtime = DatabaseRuntime(load_settings())
          try:
              inspector = inspect(runtime.engine)
              request_checks = {
                  item["name"] for item in inspector.get_check_constraints("provider_requests")
              }
              with runtime.engine.connect() as connection:
                  function_body = connection.scalar(
                      text(
                          "SELECT pg_get_functiondef('guard_provider_attempt_lineage()'::regprocedure)"
                      )
                  )
          finally:
              runtime.dispose()
          assert "ck_provider_requests_status_allowed" in request_checks, request_checks
          assert "completed/unknown" in function_body, function_body
          assert "已绑定的 Raw 引用不可修改" in function_body, function_body
          PY

      - name: Nonretryable 4xx takeover regression
        shell: bash
        run: uv run pytest tests/integration/collection/test_collection_nonretryable_4xx_recovery.py -q

      - name: Coverage and detail re-decision PostgreSQL regression
        shell: bash
        run: uv run pytest tests/integration/collection/test_collection_comment_coverage_runtime.py -q

      - name: Scope takeover Raw replay PostgreSQL regression
        shell: bash
        run: uv run pytest tests/integration/collection/test_collection_scope_recovery_runtime.py -q

      - name: PostgreSQL and Artifact integration tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/collection -q

      - name: Ruff format
        shell: bash
        run: uv run ruff format --check backend tests scripts migrations/versions/20260814_0005_stage5d_provider_dispatch.py

      - name: Ruff lint
        shell: bash
        run: uv run ruff check backend tests scripts migrations/versions/20260814_0005_stage5d_provider_dispatch.py

      - name: Mypy
        shell: bash
        run: uv run mypy backend/src/aima_ugc

      - name: Architecture and ownership gates
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py

      - name: Secret and docs gates
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py

      - name: Contract gates
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py

      - name: Downgrade to base and re-upgrade
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      - name: Downgrade to Stage 5C and re-upgrade
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade 20260814_0004
          uv run python - <<'PY'
          from sqlalchemy import inspect

          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.database import DatabaseRuntime

          runtime = DatabaseRuntime(load_settings())
          try:
              checks = {
                  item["name"] for item in inspect(runtime.engine).get_check_constraints(
                      "provider_requests"
                  )
              }
          finally:
              runtime.dispose()
          assert "ck_provider_requests_status_allowed" not in checks, checks
          PY
          uv run alembic upgrade head
          uv run alembic check

      - name: Commit Green fix after all gates
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/stage1-stage7-correctness'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            backend/src/aima_ugc/adapters/persistence/postgres/collection_provider_execution.py \
            backend/src/aima_ugc/bootstrap/collection_scope.py \
            tests/integration/collection/test_collection_nonretryable_4xx_recovery.py \
            docs/测试与调试说明.md; then
            echo 'Green fix already committed.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/aima_ugc/adapters/persistence/postgres/collection_provider_execution.py \
            backend/src/aima_ugc/bootstrap/collection_scope.py \
            tests/integration/collection/test_collection_nonretryable_4xx_recovery.py \
            docs/测试与调试说明.md
          git commit -m "修复非重试 Provider 失败接管重复发送"
          git push origin HEAD:${GITHUB_HEAD_REF}
