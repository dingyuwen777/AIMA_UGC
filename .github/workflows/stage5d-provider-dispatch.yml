name: Stage 5D Provider Dispatch

on:
  push:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/modules/collection/**"
      - "backend/src/aima_ugc/platform/jobs/**"
      - "backend/src/aima_ugc/adapters/persistence/postgres/**"
      - "migrations/versions/**"
      - "tests/unit/collection/**"
      - "tests/unit/jobs/**"
      - "tests/integration/collection/**"
      - "scripts/quality/check_architecture.py"
      - ".github/workflows/stage5d-provider-dispatch.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/modules/collection/**"
      - "backend/src/aima_ugc/platform/jobs/**"
      - "backend/src/aima_ugc/adapters/persistence/postgres/**"
      - "migrations/versions/**"
      - "tests/unit/collection/**"
      - "tests/unit/jobs/**"
      - "tests/integration/collection/**"
      - "scripts/quality/check_architecture.py"
      - ".github/workflows/stage5d-provider-dispatch.yml"

permissions:
  contents: write

jobs:
  stage5d-provider-dispatch:
    name: Stage 5D Provider Dispatch
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: stage5d-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/ci-stage5d/data
      AIMA_LOG_DIR: .runtime/ci-stage5d/logs
      AIMA_SECRET_DIR: .runtime/ci-stage5d/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Prepare Stage 5D runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'stage5d-ci' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"

      - name: Unit and Provider contract tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/collection tests/unit/jobs tests/contracts/test_provider_v1.py -q

      - name: Upgrade empty database to Stage 5D head
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
          uv run python - <<'PY'
          from sqlalchemy import inspect, text

          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.database import DatabaseRuntime

          runtime = DatabaseRuntime(load_settings())
          try:
              inspector = inspect(runtime.engine)
              request_checks = {
                  item["name"] for item in inspector.get_check_constraints("provider_requests")
              }
              with runtime.engine.connect() as connection:
                  function_body = connection.scalar(
                      text(
                          "SELECT pg_get_functiondef('guard_provider_attempt_lineage()'::regprocedure)"
                      )
                  )
          finally:
              runtime.dispose()
          assert "ck_provider_requests_status_allowed" in request_checks, request_checks
          assert "completed/unknown" in function_body, function_body
          assert "已绑定的 Raw 引用不可修改" in function_body, function_body
          PY

      - name: Coverage and detail re-decision PostgreSQL regression
        shell: bash
        run: |
          set +e
          output="$(uv run pytest tests/integration/collection/test_collection_comment_coverage_runtime.py -vv --tb=short 2>&1)"
          status=$?
          printf '%s\n' "${output}"
          if [ "${status}" -ne 0 ]; then
            PYTEST_OUTPUT="${output}" uv run python - <<'PY'
          import os

          detail = os.environ.get("PYTEST_OUTPUT", "")[-12000:]
          escaped = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(
              "::error file=tests/integration/collection/"
              "test_collection_comment_coverage_runtime.py,title=Coverage regression::"
              + escaped
          )
          PY
            exit "${status}"
          fi

      - name: Scope takeover Raw replay PostgreSQL regression
        shell: bash
        run: |
          set +e
          output="$(uv run pytest tests/integration/collection/test_collection_scope_recovery_runtime.py -vv --tb=short 2>&1)"
          status=$?
          printf '%s\n' "${output}"
          if [ "${status}" -ne 0 ]; then
            PYTEST_OUTPUT="${output}" uv run python - <<'PY'
          import os

          detail = os.environ.get("PYTEST_OUTPUT", "")[-12000:]
          escaped = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(
              "::error file=tests/integration/collection/"
              "test_collection_scope_recovery_runtime.py,title=Scope recovery regression::"
              + escaped
          )
          PY
            exit "${status}"
          fi

      - name: PostgreSQL and Artifact integration tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/collection -q

      - name: Ruff format
        shell: bash
        run: uv run ruff format --check backend tests scripts migrations/versions/20260814_0005_stage5d_provider_dispatch.py

      - name: Ruff lint
        shell: bash
        run: uv run ruff check backend tests scripts migrations/versions/20260814_0005_stage5d_provider_dispatch.py

      - name: Mypy
        shell: bash
        run: uv run mypy backend/src/aima_ugc

      - name: Architecture and ownership gates
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py

      - name: Secret and docs gates
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py

      - name: Contract gates
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py

      - name: Downgrade to base and re-upgrade
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      - name: Downgrade to Stage 5C and re-upgrade
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade 20260814_0004
          uv run python - <<'PY'
          from sqlalchemy import inspect

          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.database import DatabaseRuntime

          runtime = DatabaseRuntime(load_settings())
          try:
              checks = {
                  item["name"] for item in inspect(runtime.engine).get_check_constraints(
                      "provider_requests"
                  )
              }
          finally:
              runtime.dispose()
          assert "ck_provider_requests_status_allowed" not in checks, checks
          PY
          uv run alembic upgrade head
          uv run alembic check

      - name: Apply reviewed documentation cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/stage1-stage7-correctness'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/corrective-doc-workflow-cleanup.yml")
          text = workflow.read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if text.count(marker) != 1:
              raise SystemExit("cleanup Python start marker is not unique")
          payload = text.split(marker, 1)[1].split(end_marker, 1)[0]
          payload = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in payload.splitlines()
          )
          exec(compile(payload, str(workflow), "exec"), {})
          PY
          uv run python scripts/quality/check_docs.py
          uv run python scripts/quality/scan_secrets.py
          if grep -R --line-number --fixed-string 'feature/stage7-completion' .github/workflows; then
            echo 'obsolete Stage 7 branch-bound workflow remains' >&2
            exit 1
          fi
          test -f .github/workflows/stage7-tikhub-real-shape.yml
          grep -q 'workflow_dispatch:' .github/workflows/stage7-tikhub-real-shape.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md docs .github/workflows
          git commit -m "同步 Stage 1-7 长期文档并清理旧探针任务"
          git push origin HEAD:${GITHUB_HEAD_REF}
