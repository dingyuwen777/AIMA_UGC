name: Temporary LLM Concurrency 90k

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark-90k:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Run 90000-row production-chain benchmark
        shell: bash
        run: |
          set -euo pipefail
          WORK_DIR="${RUNNER_TEMP}/aima-llm-concurrency-90k"
          rm -rf "${WORK_DIR}"
          uv run python scripts/performance/benchmark_p1_offline.py \
            --work-dir "${WORK_DIR}" \
            --rows 90000 \
            --label-concurrency 250 \
            > "${RUNNER_TEMP}/aima-llm-concurrency-90k-output.json"

          uv run python - "${WORK_DIR}/performance_report.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["row_count"] == 90000
          assert report["label_concurrency"] == 250
          analysis = report["stages"]["analysis_writeback"]
          assert analysis["rows"] == 90000
          assert 0 < analysis["peak_in_flight"] <= 250
          assert analysis["llm_attempts"] == 90000
          print(
              "90k benchmark passed: "
              f"elapsed={report['pipeline_elapsed_seconds']:.3f}s, "
              f"rows_per_second={report['pipeline_rows_per_second']:.2f}, "
              f"peak_rss_bytes={report['peak_rss_bytes']}, "
              f"analysis_peak_in_flight={analysis['peak_in_flight']}"
          )
          PY
