name: Windows Docker Desktop Compose Compatibility

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-compose-cli:
    name: Windows Compose CLI
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate Docker mirror setup script syntax
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $source = Get-Content scripts/dev/configure_docker_desktop_mirrors.ps1 -Raw
          [void][scriptblock]::Create($source)

      - name: Validate Docker mirror effective-state predicate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . .\scripts\dev\configure_docker_desktop_mirrors.ps1

          $withExtras = @(
              'https://legacy-before.example/',
              "$($Mirrors[0])/",
              'https://legacy-middle.example/',
              "$($Mirrors[1])/",
              "$($Mirrors[2])/",
              'https://legacy-after.example/'
          )
          if (-not (Test-ExpectedMirrorsPresent -ActualMirrors $withExtras)) {
              throw 'AIMA mirrors must be accepted when additional Docker Desktop mirrors are present.'
          }

          $missing = @($withExtras | Where-Object {
              (ConvertTo-MirrorIdentity -Mirror ([string]$_)) -ne
              (ConvertTo-MirrorIdentity -Mirror $Mirrors[1])
          })
          if (Test-ExpectedMirrorsPresent -ActualMirrors $missing) {
              throw 'Missing an AIMA mirror must fail effective-state validation.'
          }

          $outOfOrder = @($Mirrors[1], $Mirrors[0], $Mirrors[2])
          if (Test-ExpectedMirrorsPresent -ActualMirrors $outOfOrder) {
              throw 'AIMA mirror relative order must remain significant.'
          }

          $daemon = [pscustomobject]@{}
          $daemon | Add-Member -NotePropertyName 'registry-mirrors' -NotePropertyValue $Mirrors
          $daemon | Add-Member -NotePropertyName 'max-download-attempts' -NotePropertyValue 5
          if (-not (Test-AimaDaemonConfigMatches -Daemon $daemon)) {
              throw 'Exact AIMA daemon mirror configuration should match.'
          }
          $daemon.'registry-mirrors' = @('https://extra.example') + $Mirrors
          if (Test-AimaDaemonConfigMatches -Daemon $daemon) {
              throw 'daemon.json remains AIMA-managed and must not silently gain extra mirrors.'
          }

      - name: Validate production Docker mirror probe on Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          . .\scripts\dev\configure_docker_desktop_mirrors.ps1

          $expected = @(
              'https://legacy-one.example/',
              'https://legacy-two.example/',
              'https://legacy-three.example/'
          ) + @($Mirrors)
          $mirrorLiterals = ($expected | ForEach-Object { '"' + $_ + '"' }) -join ','
          $fakeDir = Join-Path $env:RUNNER_TEMP 'aima-fake-docker'
          New-Item -ItemType Directory -Path $fakeDir -Force | Out-Null
          $fakeDocker = Join-Path $fakeDir 'docker.exe'
          $source = @"
          using System;
          public static class Program
          {
              public static int Main(string[] args)
              {
                  var mirrors = new string[] { $mirrorLiterals };
                  if (args.Length < 3 || args[0] != "info" || args[1] != "--format")
                  {
                      Console.Error.WriteLine("unexpected docker arguments: " + string.Join("|", args));
                      return 20;
                  }
                  if (args[2] == "{{range .RegistryConfig.Mirrors}}{{println .}}{{end}}")
                  {
                      foreach (var mirror in mirrors)
                      {
                          Console.WriteLine(mirror);
                      }
                      return 0;
                  }
                  if (args[2] == "{{json .RegistryConfig.Mirrors}}")
                  {
                      Console.WriteLine("\"" + string.Join(" ", mirrors) + "\"");
                      return 0;
                  }
                  Console.Error.WriteLine("unexpected docker format: " + args[2]);
                  return 21;
              }
          }
          "@
          Add-Type -TypeDefinition $source -Language CSharp -OutputAssembly $fakeDocker -OutputType ConsoleApplication
          $env:PATH = "$fakeDir;$env:PATH"

          $probe = Get-DockerRegistryMirrorProbe -TimeoutSeconds 3
          if (-not $probe.Succeeded) {
              throw "Production probe failed: $($probe.Error)"
          }
          $actual = @($probe.Mirrors)
          if ($actual.Count -ne $expected.Count) {
              throw "Expected $($expected.Count) independent mirrors, got $($actual.Count): $($actual -join ' | ')"
          }
          for ($index = 0; $index -lt $expected.Count; $index++) {
              if ($actual[$index] -ne $expected[$index]) {
                  throw "Mirror[$index] mismatch: expected $($expected[$index]), got $($actual[$index])"
              }
          }
          if (-not (Test-ExpectedMirrorsPresent -ActualMirrors $actual)) {
              throw 'Production probe output must satisfy AIMA mirror effective-state validation.'
          }

      - name: Prepare production env
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item env.production.example env.production

      - name: Validate direct Compose command from CMD
        shell: cmd
        run: |
          docker compose version
          if errorlevel 1 exit /b %errorlevel%
          docker compose -f compose.yaml -f compose.windows.yaml --env-file env.production config --services > "%RUNNER_TEMP%\compose-cmd-services.txt"
          if errorlevel 1 exit /b %errorlevel%

      - name: Validate direct Compose command from PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $services = & docker compose -f compose.yaml -f compose.windows.yaml --env-file env.production config --services
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = @("bootstrap", "postgres", "migrate", "configure", "api", "worker", "scheduler", "frontend")
          foreach ($service in $expected) {
              if ($services -notcontains $service) {
                  throw "Missing Compose service: $service"
              }
          }

  named-volume-runtime:
    name: Windows Named-volume Runtime Model
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare isolated env
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="${RUNNER_TEMP}/aima-windows-compose.env"
          echo "AIMA_WINDOWS_ENV_FILE=${ENV_FILE}" >> "${GITHUB_ENV}"
          cat > "${ENV_FILE}" <<EOF
          AIMA_IMAGE_TAG=windows-ci-${GITHUB_RUN_ID}
          AIMA_HTTP_BIND_IP=127.0.0.1
          AIMA_HTTP_PORT=18082
          AIMA_HOST_ROOT=${RUNNER_TEMP}/must-not-be-used-by-windows-override
          AIMA_DB_NAME=aima_ugc
          AIMA_DB_USER=aima_ugc
          AIMA_DB_CONNECT_TIMEOUT_SECONDS=5
          AIMA_LOG_LEVEL=INFO
          AIMA_LOG_MAX_BYTES=1048576
          AIMA_LOG_BACKUP_COUNT=2
          AIMA_LOG_COMPRESS=true
          AIMA_TIKHUB_ENABLED=false
          AIMA_TIKHUB_BASE_URL=https://api.tikhub.io
          AIMA_TIKHUB_API_KEY=
          AIMA_LLM_API_KEY=
          # GitHub Hosted Runner 位于海外，构建期包下载显式使用官方上游；镜像身份仍由 Dockerfile/Compose 固定。
          AIMA_BUILD_DEBIAN_MIRROR=http://deb.debian.org/debian
          AIMA_BUILD_DEBIAN_SECURITY_MIRROR=http://deb.debian.org/debian-security
          AIMA_BUILD_PYPI_INDEX=https://pypi.org/simple
          AIMA_BUILD_NPM_REGISTRY=https://registry.npmjs.org
          EOF
          chmod 0600 "${ENV_FILE}"

      - name: Validate merged storage model
        shell: bash
        run: |
          set -euo pipefail
          docker compose version
          docker compose \
            -f compose.yaml \
            -f compose.windows.yaml \
            --env-file "${AIMA_WINDOWS_ENV_FILE}" \
            config --format json > "${RUNNER_TEMP}/compose.windows.json"

          python3 - "${RUNNER_TEMP}/compose.windows.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          model = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "bootstrap": {
                  "/host/runtime/data",
                  "/host/runtime/logs",
                  "/host/postgres",
                  "/host/shared/secrets",
              },
              "postgres": {"/var/lib/postgresql", "/run/secrets"},
              "migrate": {"/app/data", "/app/logs", "/run/internal-secrets"},
              "configure": {"/app/data", "/app/logs", "/run/internal-secrets"},
              "api": {"/app/data", "/app/logs", "/run/internal-secrets"},
              "worker": {"/app/data", "/app/logs", "/run/internal-secrets"},
              "scheduler": {"/app/data", "/app/logs", "/run/internal-secrets"},
          }
          for service, targets in expected.items():
              mounts = {
                  item["target"]: item
                  for item in model["services"][service].get("volumes", [])
              }
              assert set(mounts) == targets, (service, mounts)
              for target in targets:
                  assert mounts[target]["type"] == "volume", (service, target, mounts[target])

          assert {
              "windows_runtime_data",
              "windows_runtime_logs",
              "windows_postgres",
              "windows_internal_secrets",
          }.issubset(model["volumes"])
          PY

      - name: Startup, permissions, and restart persistence
        shell: bash
        run: |
          set -euo pipefail
          compose() {
            docker compose \
              -f compose.yaml \
              -f compose.windows.yaml \
              --env-file "${AIMA_WINDOWS_ENV_FILE}" "$@"
          }
          cleanup() {
            status=$?
            if [[ $status -ne 0 ]]; then
              compose ps -a || true
              compose logs --no-color || true
            fi
            compose down -v --remove-orphans || true
            exit $status
          }
          trap cleanup EXIT

          compose up -d --build --wait
          curl -fsS http://127.0.0.1:18082/health/ready >/dev/null

          API_CONTAINER="$(compose ps -q api)"
          POSTGRES_CONTAINER="$(compose ps -q postgres)"
          python3 - "${API_CONTAINER}" "${POSTGRES_CONTAINER}" <<'PY'
          import json
          import subprocess
          import sys

          api_id, postgres_id = sys.argv[1:]

          def mounts(container_id: str) -> dict[str, dict]:
              container = json.loads(
                  subprocess.check_output(["docker", "inspect", container_id], text=True)
              )[0]
              return {item["Destination"]: item for item in container["Mounts"]}

          expected = {
              api_id: {
                  "/app/data": True,
                  "/app/logs": True,
                  "/run/internal-secrets": False,
              },
              postgres_id: {
                  "/var/lib/postgresql": True,
                  "/run/secrets": False,
              },
          }
          for container_id, destinations in expected.items():
              actual = mounts(container_id)
              for destination, writable in destinations.items():
                  mount = actual[destination]
                  assert mount["Type"] == "volume", (destination, mount)
                  assert mount["RW"] is writable, (destination, mount)
          PY

          test "$(compose exec -T api stat -c '%u:%g:%a' /run/internal-secrets/postgres_password | tr -d '\r')" = "0:11001:440"
          compose exec -T api sh -ec 'printf windows-volume-persistence > /app/data/windows-volume-marker'
          PASSWORD_HASH_BEFORE="$(compose exec -T api sha256sum /run/internal-secrets/postgres_password | awk '{print $1}' | tr -d '\r')"
          compose exec -T postgres psql -U aima_ugc -d aima_ugc -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE ci_windows_volume_marker(value text PRIMARY KEY); INSERT INTO ci_windows_volume_marker VALUES ('persisted');"

          compose down --remove-orphans
          compose up -d --no-build --wait
          curl -fsS http://127.0.0.1:18082/health/ready >/dev/null
          compose exec -T api sh -ec 'test "$(cat /app/data/windows-volume-marker)" = windows-volume-persistence'
          PASSWORD_HASH_AFTER="$(compose exec -T api sha256sum /run/internal-secrets/postgres_password | awk '{print $1}' | tr -d '\r')"
          test "${PASSWORD_HASH_BEFORE}" = "${PASSWORD_HASH_AFTER}"
          DB_MARKER="$(compose exec -T postgres psql -U aima_ugc -d aima_ugc -Atc "SELECT value FROM ci_windows_volume_marker;" | tr -d '\r')"
          test "${DB_MARKER}" = "persisted"
          test ! -e "${RUNNER_TEMP}/must-not-be-used-by-windows-override"