name: Bootstrap Stage 3B null doc
on:
  push:
    branches: [feature/stage3b-canonical-v1]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage3b-canonical-v1
      - name: Patch DDL null semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/blueprint/03-数据库与文件存储.md')
          s=p.read_text(encoding='utf-8')
          a=s.index('### 5.12 `contents`'); b=s.index('### 5.13 内容指标 Observation')
          x=s[a:b]
          x=x.replace("title                   text not null default ''\ntext                    text not null default ''","title                   text\ntext                    text")
          x=x.replace("status                  text not null default 'active'","status                  text")
          s=s[:a]+x+s[b:]
          a=s.index('### 5.15 `comments`'); b=s.index('### 5.15A Ingestion')
          x=s[a:b]
          x=x.replace("text                  text not null","text                  text")
          x=x.replace("status                text not null default 'active'","status                text")
          s=s[:a]+x+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/blueprint/03-数据库与文件存储.md
          git diff --cached --exit-code && exit 1 || true
          git commit -m "修正 Stage 3B DDL 空值语义"
          git push origin HEAD:feature/stage3b-canonical-v1
