name: Temporary Analysis Scheme Product UI

on:
  push:
    branches:
      - feature/product-resource-lifecycle
    paths:
      - .github/workflows/tmp-analysis-scheme-product-ui.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Apply exact Admin Configuration patches
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/src/features/admin-configuration/pages/AdminConfigurationPage.vue')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '  KeywordPackSummaryResponse,\n  VehicleModelResponse,',
              '  KeywordPackSummaryResponse,\n  ResourceLifecycleResponse,\n  VehicleModelResponse,',
              'type import',
          )
          replace_once(
              '  activateScheme,\n  addSchemeDraft,\n  addVehicle,',
              '  activateScheme,\n  addSchemeDraft,\n  addVehicle,\n  archiveScheme,\n  copyScheme,\n  deleteArchivedScheme,',
              'api import head',
          )
          replace_once(
              '  fetchAuditEvents,\n  fetchKeywordPacksForAdmin,\n  fetchSchemes,\n  fetchVehicles,',
              '  fetchArchivedSchemes,\n  fetchAuditEvents,\n  fetchKeywordPacksForAdmin,\n  fetchSchemeDeleteEligibility,\n  fetchSchemes,\n  fetchVehicles,',
              'api import middle',
          )
          replace_once(
              '  removeVehicle,\n  restoreScheme,\n  saveKeywordPackVehicles,',
              '  removeVehicle,\n  restoreArchivedScheme,\n  restoreScheme,\n  saveKeywordPackVehicles,',
              'api import tail',
          )
          replace_once(
              "import ProviderConfigurationPanel from '../components/ProviderConfigurationPanel.vue'",
              "import AnalysisLabelsEditor from '../components/AnalysisLabelsEditor.vue'\nimport ProviderConfigurationPanel from '../components/ProviderConfigurationPanel.vue'",
              'component import',
          )
          replace_once(
              "const schemes = ref<AnalysisSchemeResponse[]>([])\nconst auditEvents = ref<AuditEventResponse[]>([])",
              "const schemes = ref<AnalysisSchemeResponse[]>([])\nconst archivedSchemes = ref<ResourceLifecycleResponse[]>([])\nconst auditEvents = ref<AuditEventResponse[]>([])",
              'archived scheme state',
          )
          replace_once(
              "const schemeLoading = ref(false)\nconst auditLoading = ref(false)",
              "const schemeLoading = ref(false)\nconst archivedSchemeLoading = ref(false)\nconst schemeLabelsValid = ref(true)\nconst schemeCopyName = ref('')\nconst auditLoading = ref(false)",
              'scheme ui state',
          )
          replace_once(
              "async function loadAudit(): Promise<void> {",
              """async function loadArchivedSchemes(): Promise<void> {
  archivedSchemeLoading.value = true
  schemeError.value = null
  try {
    archivedSchemes.value = (await fetchArchivedSchemes()).items
  } catch (reason) {
    schemeError.value = apiErrorMessage(reason)
  } finally {
    archivedSchemeLoading.value = false
  }
}

function onArchivedSchemesToggle(event: Event): void {
  if ((event.currentTarget as HTMLDetailsElement).open) void loadArchivedSchemes()
}

async function loadAudit(): Promise<void> {""",
              'archived scheme loader',
          )
          replace_once(
              "  if (!definition.prompt_template.includes('{{AIMA_TAXONOMY_JSON}}')) {",
              "  if (!schemeLabelsValid.value) throw new Error('请先修正结构化标签规则。')\n  if (!definition.prompt_template.includes('{{AIMA_TAXONOMY_JSON}}')) {",
              'structured labels validation',
          )
          replace_once(
              "async function publishVersion(version: AnalysisSchemeVersionResponse): Promise<void> {",
              """function startSchemeCopy(): void {
  const selected = selectedSchemeVersion.value
  if (!selected) return
  schemeCopyName.value = `${selected.scheme.name} 副本`
}

async function copySelectedScheme(): Promise<void> {
  const selected = selectedSchemeVersion.value
  if (!selected || !schemeCopyName.value.trim()) return
  saving.value = true
  error.value = null
  try {
    const copied = await copyScheme(selected.scheme.id, { name: schemeCopyName.value.trim() })
    schemeCopyName.value = ''
    await loadSchemes()
    const draft = copied.versions.find((item) => item.status === 'draft') ?? copied.versions[0]
    if (draft) selectSchemeVersion(draft.id)
    notice.value = 'AI 分析规则副本已创建为草稿。'
  } catch (reason) {
    error.value = apiErrorMessage(reason)
  } finally {
    saving.value = false
  }
}

async function archiveSelectedScheme(): Promise<void> {
  const selected = selectedSchemeVersion.value
  if (!selected) return
  if (!window.confirm(`确认归档 AI 分析规则“${selected.scheme.name}”吗？当前生效规则会被服务端阻止归档，历史版本和历史分析任务不会被删除。`)) return
  saving.value = true
  error.value = null
  try {
    await archiveScheme(selected.scheme.id)
    selectedSchemeVersionId.value = ''
    await Promise.all([loadSchemes(), loadArchivedSchemes()])
    notice.value = 'AI 分析规则已归档。'
  } catch (reason) {
    error.value = apiErrorMessage(reason)
  } finally {
    saving.value = false
  }
}

async function restoreArchivedAnalysisScheme(item: ResourceLifecycleResponse): Promise<void> {
  saving.value = true
  error.value = null
  try {
    await restoreArchivedScheme(item.id)
    await Promise.all([loadSchemes(), loadArchivedSchemes()])
    const restored = schemes.value.find((scheme) => scheme.id === item.id)
    const version = restored?.versions.find((entry) => entry.status === 'draft') ?? restored?.versions[0]
    if (version) selectSchemeVersion(version.id)
    notice.value = 'AI 分析规则已恢复；恢复后不会自动发布或生效。'
  } catch (reason) {
    error.value = apiErrorMessage(reason)
  } finally {
    saving.value = false
  }
}

async function deleteArchivedAnalysisScheme(item: ResourceLifecycleResponse): Promise<void> {
  saving.value = true
  error.value = null
  try {
    const eligibility = await fetchSchemeDeleteEligibility(item.id)
    if (!eligibility.eligible) {
      error.value = (eligibility.blocking_reasons ?? []).join('；') || '该分析规则已有发布或运行历史，只能保留归档记录。'
      return
    }
    if (!window.confirm(`确认永久删除已归档 AI 分析规则“${item.name}”吗？只有从未发布、从未被分析任务使用的纯草稿规则才允许删除。`)) return
    await deleteArchivedScheme(item.id)
    await loadArchivedSchemes()
    notice.value = '未发布且未使用的归档 AI 分析规则已永久删除。'
  } catch (reason) {
    error.value = apiErrorMessage(reason)
  } finally {
    saving.value = false
  }
}

async function publishVersion(version: AnalysisSchemeVersionResponse): Promise<void> {""",
              'scheme lifecycle functions',
          )
          replace_once(
              """          <template
            v-for="scheme in schemes"
            :key="scheme.id"
          >
            <h3>{{ scheme.name }}</h3>
            <button
              v-for="version in scheme.versions"
              :key="version.id"
              type="button"
              :class="{ active: selectedSchemeVersionId === version.id }"
              @click="selectSchemeVersion(version.id)"
            >
              <strong>版本 {{ version.version }} · {{ formatRuntimeStatus(version.status) }}</strong>
              <span>{{ formatDateTime(version.created_at) }}</span>
            </button>
          </template>
        </section>""",
              """          <template
            v-for="scheme in schemes"
            :key="scheme.id"
          >
            <h3>{{ scheme.name }}</h3>
            <button
              v-for="version in scheme.versions"
              :key="version.id"
              type="button"
              :class="{ active: selectedSchemeVersionId === version.id }"
              @click="selectSchemeVersion(version.id)"
            >
              <strong>版本 {{ version.version }} · {{ formatRuntimeStatus(version.status) }}</strong>
              <span>{{ formatDateTime(version.created_at) }}</span>
            </button>
          </template>
          <details class="archived-schemes" @toggle="onArchivedSchemesToggle">
            <summary>已归档规则</summary>
            <div v-if="archivedSchemeLoading" class="archived-scheme-state">正在读取…</div>
            <div v-else-if="archivedSchemes.length === 0" class="archived-scheme-state">暂无已归档规则。</div>
            <div v-for="item in archivedSchemes" v-else :key="item.id" class="archived-scheme-row">
              <span><strong>{{ item.name }}</strong><small>{{ formatDateTime(item.archived_at) }}</small></span>
              <AimaButton variant="text" size="small" :disabled="saving" @click="restoreArchivedAnalysisScheme(item)">恢复</AimaButton>
              <AimaButton variant="text" size="small" :disabled="saving" @click="deleteArchivedAnalysisScheme(item)">永久删除</AimaButton>
            </div>
          </details>
        </section>""",
              'archived scheme template',
          )
          replace_once(
              """              <h2>AI 分析规则</h2>
              <p>默认只维护业务含义；提示词与结构化标签作为高级规则按需展开。</p>""",
              """              <h2>AI 分析规则</h2>
              <p>发声类型、情感和标签结构直接按业务含义维护；提示词仅在需要时进入高级设置。</p>""",
              'scheme description',
          )
          replace_once(
              """          </header>
          <label>
            规则名称""",
              """          </header>
          <div v-if="selectedSchemeVersion" class="scheme-resource-actions">
            <AimaButton size="small" :disabled="saving" @click="startSchemeCopy">复制规则</AimaButton>
            <AimaButton size="small" :disabled="saving" @click="archiveSelectedScheme">归档规则</AimaButton>
          </div>
          <div v-if="schemeCopyName" class="scheme-copy-editor">
            <label>副本名称<input v-model="schemeCopyName" maxlength="200"></label>
            <small>复制的是该规则当前最新版本；副本只创建草稿，不会自动发布。</small>
            <div><AimaButton size="small" @click="schemeCopyName = ''">取消</AimaButton><AimaButton variant="primary" size="small" :disabled="saving || !schemeCopyName.trim()" @click="copySelectedScheme">创建副本</AimaButton></div>
          </div>
          <label>
            规则名称""",
              'scheme lifecycle controls',
          )
          replace_once(
              """          <label>
            情感（每行一个）
            <textarea
              v-model="schemeDraft.sentiments"
              rows="4"
            />
          </label>
          <details class="advanced-editor">""",
              """          <label>
            情感（每行一个）
            <textarea
              v-model="schemeDraft.sentiments"
              rows="4"
            />
          </label>
          <AnalysisLabelsEditor
            v-model="schemeDraft.labelsJson"
            @validity="schemeLabelsValid = $event"
          />
          <details class="advanced-editor">""",
              'structured labels component',
          )
          replace_once(
              """            <p>只有需要直接维护结构化标签或提示词时才展开。保存和发布仍会按同一个完整版本处理。</p>
            <div class="advanced-editor__fields">
              <label>
                标签规则（JSON）
                <textarea
                  v-model="schemeDraft.labelsJson"
                  rows="10"
                  spellcheck="false"
                />
              </label>
              <label>
                提示词模板""",
              """            <p>这里只维护提示词与查看机器结构；业务标签请在上方结构化编辑器修改。</p>
            <div class="advanced-editor__fields">
              <div class="technical-note taxonomy-preview">
                <strong>标签结构预览（只读）</strong>
                <pre>{{ schemeDraft.labelsJson }}</pre>
              </div>
              <label>
                提示词模板""",
              'advanced labels json removal',
          )
          replace_once(
              ':disabled="saving"\n              @click="saveSchemeDraft"',
              ':disabled="saving || !schemeLabelsValid"\n              @click="saveSchemeDraft"',
              'scheme save validity',
          )
          replace_once(
              ".scheme-editor > header > span { padding: 3px 8px; border-radius: 4px; color: var(--aima-primary); background: var(--aima-primary-soft); font-size: 10px; }",
              ".scheme-editor > header > span { padding: 3px 8px; border-radius: 4px; color: var(--aima-primary); background: var(--aima-primary-soft); font-size: 10px; }\n.scheme-resource-actions { display: flex; justify-content: flex-end; gap: 8px; }\n.scheme-copy-editor { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--aima-border); border-radius: 7px; background: #fafbfc; }.scheme-copy-editor small { color: var(--aima-text-muted); font-size: 10px; }.scheme-copy-editor > div { display: flex; justify-content: flex-end; gap: 8px; }\n.archived-schemes { margin-top: 10px; border: 1px solid var(--aima-border); border-radius: 7px; overflow: hidden; }.archived-schemes summary { padding: 9px 10px; cursor: pointer; color: var(--aima-text-secondary); font-size: 11px; font-weight: 600; }.archived-scheme-state { padding: 12px 10px; color: var(--aima-text-muted); font-size: 10px; }.archived-scheme-row { display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 5px; padding: 8px 9px; border-top: 1px solid var(--aima-border); }.archived-scheme-row span strong,.archived-scheme-row span small { display: block; }.archived-scheme-row span strong { color: var(--aima-text); font-size: 10px; }.archived-scheme-row span small { margin-top: 2px; color: var(--aima-text-disabled); font-size: 9px; }\n.taxonomy-preview pre { max-height: 180px; overflow: auto; margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--aima-text-secondary); font-size: 10px; line-height: 15px; }",
              'scheme lifecycle styles',
          )

          path.write_text(text, encoding='utf-8')

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend environment
        run: npm ci --prefix frontend

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Admin configuration tests
        run: npm --prefix frontend test -- --run tests/admin-configuration-design.spec.ts tests/admin-configuration-presentation.spec.ts tests/frontend-audit-regressions.spec.ts

      - name: Commit patch and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-analysis-scheme-product-ui.yml
          git add frontend/src/features/admin-configuration/pages/AdminConfigurationPage.vue
          git config user.name "AIMA Temporary Validator"
          git config user.email "aima-validator@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "产品化AI分析规则配置与生命周期 [skip ci]"
          git push origin HEAD:feature/product-resource-lifecycle
