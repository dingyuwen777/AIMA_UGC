name: DEV Remove Derived User Voice Runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.number == 128 && github.event.pull_request.head.ref == 'feature/remove-derived-user-voice-final2'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/remove-derived-user-voice-final2
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Install locked environments
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
          npm ci --prefix frontend

      - name: Apply implementation script from feature runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/dev-remove-derived-user-voice.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          body = workflow[start:end]
          lines = []
          for line in body.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          script = '\n'.join(lines) + '\n'

          # The feature script intentionally fails closed on exact repository facts.
          # Main currently has two stale README V2 mentions; normalize one so the
          # embedded migration can update the remaining occurrence and end with V3 in both places.
          analysis_readme = Path('backend/src/aima_ugc/modules/analysis/README.md')
          readme_text = analysis_readme.read_text(encoding='utf-8')
          readme_needle = 'ContentLabelAnalysisV2\n'
          if readme_text.count(readme_needle) != 2:
              raise SystemExit('Analysis README V2 occurrence count changed')
          readme_head, readme_tail = readme_text.rsplit(readme_needle, 1)
          analysis_readme.write_text(
              readme_head + 'ContentLabelAnalysisV3\n' + readme_tail,
              encoding='utf-8',
          )

          # The Change was already updated with the approved prompt-version decision
          # and Red evidence to trigger this run. Normalize only the temporary worktree
          # back to the embedded script's expected input; the script writes the same
          # approved final facts again before commit.
          change_path = Path('changes/active/CHG-20260821-remove-derived-user-voice/CHANGE.md')
          change_text = change_path.read_text(encoding='utf-8')
          current_prompt = '- Prompt：继续使用仓库已固定的 `content-labeling.v3` 路径/版本；判断标准与示例允许在该 Markdown 内迭代，精确 Prompt 内容由 `prompt_sha256` 区分并进入 Analysis 审计，因此本次不人为创建 V4。\n'
          legacy_prompt = '- Prompt：语义规则发生实质变化。若仓库现有 `prompt_version` 语义要求内容版本升级，则升级 Prompt 版本并保留旧 Prompt 供历史审计；若精确内容仅以 `prompt_sha256` 区分，则必须在实现中明确记录依据，不能静默混用。\n'
          current_red = 'Red 已确认：PR #128 head `614fa641484e3d9929fff9ffb9a5ef32a400153d` 的 CI Stage 1 在 Contract 阶段得到 56 passed / 3 failed；三个失败分别证明 HTTP completed Analysis 仍要求 `is_user_voice`、Excel Analysis 仍要求该派生字段、Prompt 仍包含该字段且缺少新的主体/表达目的联合证据规则。同期 546 个既有 unit tests、Stage 2 Platform、Stage 3A Database 均通过，失败原因与目标行为一致。Green 证据待本轮实现后补充。\n'
          legacy_red = '尚未完成。按 Red → Green 记录本轮真实 CI、命令、退出状态和失败数。\n'
          if current_prompt not in change_text or current_red not in change_text:
              raise SystemExit('Change trigger facts no longer match expected approved state')
          change_text = change_text.replace(current_prompt, legacy_prompt, 1)
          change_text = change_text.replace(current_red, legacy_red, 1)
          change_path.write_text(change_text, encoding='utf-8')

          Path('/tmp/apply_remove_user_voice.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_remove_user_voice.py

      - name: Format and generate contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format backend tests scripts
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api

      - name: Focused Green validation
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest \
            tests/contracts/test_user_voice_single_source_contract.py \
            tests/contracts/test_analysis_relevance_voice_http.py \
            tests/contracts/test_stage8d_http.py \
            tests/api/test_stage8d_contents.py \
            tests/unit/analysis/test_analysis_relevance_voice_v3.py \
            tests/unit/platform/test_excel_export.py \
            tests/unit/platform/test_p1g_labeled_excel.py \
            tests/unit/collection/test_imports_test_export.py \
            -q
          uv run ruff format --check backend tests scripts
          uv run ruff check backend tests scripts
          uv run mypy backend/src
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py
          uv run python scripts/quality/check_docs.py
          npm --prefix frontend run typecheck
          npm --prefix frontend run build

      - name: Commit verified feature changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/dev-remove-derived-user-voice.yml
          git add -- \
            backend/src/aima_ugc/contracts/analysis/content_label.py \
            backend/src/aima_ugc/contracts/http.py \
            backend/src/aima_ugc/contracts/export/models.py \
            backend/src/aima_ugc/bootstrap/content_http.py \
            backend/src/aima_ugc/adapters/persistence/postgres/reporting.py \
            backend/src/aima_ugc/platform/export/excel.py \
            backend/src/aima_ugc/adapters/providers/imports_test/test.py \
            backend/src/aima_ugc/modules/analysis/prompts/content_labeling_v3.md \
            backend/src/aima_ugc/modules/analysis/README.md \
            backend/src/aima_ugc/adapters/providers/imports_test/README.md \
            docs/blueprint/13-统一数据Excel导出与调试复用.md \
            docs/blueprint/15-舆情AI打标与统一分析契约.md \
            changes/active/CHG-20260821-remove-derived-user-voice/CHANGE.md \
            tests/contracts/test_user_voice_single_source_contract.py \
            tests/contracts/test_analysis_relevance_voice_http.py \
            tests/contracts/test_stage8d_http.py \
            tests/api/test_stage8d_contents.py \
            tests/unit/analysis/test_analysis_relevance_voice_v3.py \
            tests/integration/content/test_stage8d_voice_plaza_runtime.py \
            tests/unit/platform/test_excel_export.py \
            tests/unit/platform/test_p1g_labeled_excel.py \
            tests/unit/collection/test_imports_test_export.py \
            contracts/export/unified-data-excel.v1.schema.json \
            contracts/openapi/openapi.json \
            frontend/src/generated/api/client.ts
          git diff --cached --check
          git commit -m "收敛发声类型单一事实并优化AI判定"
          git push origin HEAD:feature/remove-derived-user-voice-final2
