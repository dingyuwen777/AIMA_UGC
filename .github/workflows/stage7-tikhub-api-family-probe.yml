# probe-revision: 5
name: Stage 7 TikHub API Family Probe

on:
  push:
    branches:
      - feature/stage7-completion
    paths:
      - ".github/workflows/stage7-tikhub-api-family-probe.yml"
      - "scripts/dev/probe_tikhub_api_families.py"
      - "backend/src/aima_ugc/adapters/providers/tikhub/api_family_compare.py"
      - "backend/src/aima_ugc/adapters/providers/tikhub/operations/**"
      - "tests/unit/collection/test_tikhub_api_family_*.py"

permissions:
  contents: read
  pull-requests: read

jobs:
  probe:
    name: TikHub bounded API family A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Validate locked probe code
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
          uv run ruff format \
            scripts/dev/probe_tikhub_api_families.py \
            backend/src/aima_ugc/adapters/providers/tikhub/api_family_compare.py \
            tests/unit/collection/test_tikhub_api_family_candidates.py \
            tests/unit/collection/test_tikhub_api_family_compare.py
          uv run ruff check --fix \
            scripts/dev/probe_tikhub_api_families.py \
            backend/src/aima_ugc/adapters/providers/tikhub/api_family_compare.py \
            tests/unit/collection/test_tikhub_api_family_candidates.py \
            tests/unit/collection/test_tikhub_api_family_compare.py
          uv run ruff format --check \
            scripts/dev/probe_tikhub_api_families.py \
            backend/src/aima_ugc/adapters/providers/tikhub/api_family_compare.py \
            tests/unit/collection/test_tikhub_api_family_candidates.py \
            tests/unit/collection/test_tikhub_api_family_compare.py
          uv run ruff check \
            scripts/dev/probe_tikhub_api_families.py \
            backend/src/aima_ugc/adapters/providers/tikhub/api_family_compare.py \
            tests/unit/collection/test_tikhub_api_family_candidates.py \
            tests/unit/collection/test_tikhub_api_family_compare.py
          uv run python -m py_compile scripts/dev/probe_tikhub_api_families.py
          uv run pytest \
            tests/unit/collection/test_tikhub_api_family_candidates.py \
            tests/unit/collection/test_tikhub_api_family_compare.py \
            -q

      - name: Verify api.tikhub.io connectivity
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 https://api.tikhub.io/openapi.json)"
          test "${status}" = "200"
          echo "TikHub connectivity verified: HTTP ${status}"

      - name: Generate and publish one-time RSA public key
        shell: bash
        run: |
          set -euo pipefail
          secure_dir="${RUNNER_TEMP}/tikhub-api-family-secret"
          mkdir -p "${secure_dir}"
          chmod 700 "${secure_dir}"
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "${secure_dir}/private.pem"
          chmod 600 "${secure_dir}/private.pem"
          openssl pkey -in "${secure_dir}/private.pem" -pubout \
            -out "${secure_dir}/public.pem"
          public_key_b64="$(base64 -w 0 "${secure_dir}/public.pem")"
          echo "::warning file=.github/workflows/stage7-tikhub-api-family-probe.yml,line=1,title=TikHub API family one-time public key::tikhub-api-family-public-key:${GITHUB_RUN_ID}:${public_key_b64}"

      - name: Receive encrypted TikHub credential from PR body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          secure_dir="${RUNNER_TEMP}/tikhub-api-family-secret"
          marker="<!-- tikhub-api-family-ciphertext:${GITHUB_RUN_ID} -->"
          ciphertext=""
          for _ in $(seq 1 120); do
            pr_body="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/55" | jq -r '.body // ""')"
            ciphertext="$(printf '%s' "${pr_body}" | jq -Rrs --arg marker "${marker}" \
              'split($marker) | if length > 1 then .[1] | split("\n") | map(select(length > 0))[0] // "" else "" end')"
            if [ -n "${ciphertext}" ]; then
              break
            fi
            sleep 5
          done
          test -n "${ciphertext}"
          printf '%s' "${ciphertext}" | base64 --decode > "${secure_dir}/ciphertext.bin"
          openssl pkeyutl -decrypt \
            -inkey "${secure_dir}/private.pem" \
            -in "${secure_dir}/ciphertext.bin" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out "${secure_dir}/token"
          chmod 600 "${secure_dir}/token"
          token="$(cat "${secure_dir}/token")"
          test "${#token}" -ge 16
          echo "::add-mask::${token}"
          rm -f "${secure_dir}/ciphertext.bin"

      - name: Run bounded real API family A/B
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "${RUNNER_TEMP}/tikhub-api-family-secret/token")"
          echo "::add-mask::${token}"
          export AIMA_TIKHUB_PROBE_TOKEN="${token}"
          export AIMA_TIKHUB_API_FAMILY_PROBE_APPROVED=yes
          export AIMA_TIKHUB_PROBE_OUTPUT_DIR="${RUNNER_TEMP}/tikhub-api-family"
          uv run python scripts/dev/probe_tikhub_api_families.py
          unset AIMA_TIKHUB_PROBE_TOKEN

      - name: Publish sanitized result annotation
        shell: bash
        run: |
          set -euo pipefail
          summary_b64="$(base64 -w 0 "${RUNNER_TEMP}/tikhub-api-family/summary.json")"
          echo "::warning file=.github/workflows/stage7-tikhub-api-family-probe.yml,line=1,title=TikHub API family sanitized result::tikhub-api-family-result:${GITHUB_RUN_ID}:${summary_b64}"

      - name: Upload sanitized result artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stage7-tikhub-api-family-${{ github.run_id }}
          path: ${{ runner.temp }}/tikhub-api-family/summary.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Remove ephemeral credential material
        if: always()
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/tikhub-api-family-secret"
