name: Bootstrap local dev lock

on:
  push:
    branches:
      - build/local-dev-startup

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: build/local-dev-startup

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install uv
        run: python -m pip install "uv==0.12.3"

      - name: Generate lock
        run: uv lock

      - name: Commit lock if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "更新本地启动依赖锁"
          git push origin HEAD:build/local-dev-startup
