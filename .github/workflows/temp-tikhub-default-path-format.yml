name: Temporary TikHub Default Path Format

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-tikhub-default-path-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/tikhub-test-default-paths
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - name: Install locked uv
        shell: bash
        run: python -m pip install "uv==$(tr -d '\r\n' < .uv-version)"
      - name: Format target files
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format backend/src/aima_ugc/adapters/providers/tikhub_test/operations/runner.py tests/unit/collection/test_tikhub_test_debug.py
          git diff --check
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/aima_ugc/adapters/providers/tikhub_test/operations/runner.py tests/unit/collection/test_tikhub_test_debug.py
          git commit -m "格式化 TikHub 调试默认路径修复"
          git push origin HEAD:fix/tikhub-test-default-paths
