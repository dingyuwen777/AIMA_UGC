name: TikHub Test Multi Keyword Patch

on:
  push:
    branches:
      - agent/tikhub-test-debug
    paths:
      - ".github/workflows/tikhub-test-multi-keyword-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/tikhub-test-debug
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
      - name: Apply multi-keyword implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {actual}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          runner = "backend/src/aima_ugc/adapters/providers/tikhub_test/runner.py"
          replace(
              runner,
              "from dataclasses import dataclass\n",
              "from collections.abc import Sequence\nfrom dataclasses import dataclass, replace\n",
          )
          replace(
              runner,
              "        platform: tikhub_runtime.TikHubPlatform,\n        keyword: str,\n        search_config: dict[str, object],\n",
              "        platform: tikhub_runtime.TikHubPlatform,\n        keywords: tuple[str, ...],\n        search_config: dict[str, object],\n",
          )
          replace(
              runner,
              "    ) -> None:\n        if not keyword.strip():\n            raise ValueError(\"keyword 不能为空\")\n        limits.validate()\n        self.platform = platform\n        self.keyword = keyword.strip()\n",
              "    ) -> None:\n        limits.validate()\n        self.platform = platform\n        self.keywords = keywords\n",
          )
          replace(
              runner,
              "        self._blocks: list[ReviewBlock] = []\n        self._seen_contents: set[str] = set()\n        self._seen_comments: set[tuple[str, str]] = set()\n        self._root_comment_count = 0\n        self._reply_count = 0\n        self._search_stop_reason: str | None = None\n",
              "        self._blocks: list[ReviewBlock] = []\n        self._matched_keywords: dict[str, list[str]] = {}\n        self._seen_contents: set[str] = set()\n        self._seen_comments: set[tuple[str, str]] = set()\n        self._root_comment_count = 0\n        self._reply_count = 0\n        self._search_stop_reasons: dict[str, str] = {}\n",
          )
          replace(
              runner,
              "            ) as transport:\n                self._run_search(transport)\n",
              "            ) as transport:\n                for keyword in self.keywords:\n                    if self._content_limit_reached():\n                        self._search_stop_reasons[keyword] = (\n                            \"not_started_content_target_reached\"\n                        )\n                        continue\n                    self._run_search(transport, keyword)\n",
          )
          replace(
              runner,
              "            workbook_path = write_review_workbook(\n                tuple(self._blocks),\n",
              "            workbook_path = write_review_workbook(\n                self._blocks_with_keywords(),\n",
          )
          old_search = '''    def _run_search(self, transport: TikHubHttpTransport) -> None:\n        pagination: dict[str, object] | None = None\n        for page_no in range(1, self.limits.max_search_pages + 1):\n            call = tikhub_runtime.build_search_call(\n                platform=self.platform,\n                keyword=self.keyword,\n                config=self.search_config,\n                state=pagination,\n            )\n            body, raw_record = self._send(transport, call)\n            items = tikhub_runtime.extract_search_items(self.platform, body)\n            for item_index, raw_item in enumerate(items):\n                content = tikhub_runtime.map_content(\n                    platform=self.platform,\n                    raw=raw_item,\n                    context=tikhub_runtime.mapping_context(\n                        provider_request_id=raw_record.request_id,\n                        provider_attempt_id=raw_record.attempt_id,\n                        raw_artifact_id=raw_record.artifact_id,\n                        operation=call.operation,\n                        source_type=\"keyword\",\n                        source_value=self.keyword,\n                        observed_at=raw_record.observed_at,\n                    ),\n                    item_locator=f\"search.page[{page_no}].items[{item_index}]\",\n                )\n                content_id = content.external_content_id\n                if content_id in self._seen_contents:\n                    continue\n                self._seen_contents.add(content_id)\n                self.store.append_canonical(\"contents\", content)\n                self._process_content(\n                    transport,\n                    search_content=content,\n                    search_raw_locator=(\n                        f\"{self.store.relative_path(raw_record.path)}\"\n                        f\"#search.page[{page_no}].items[{item_index}]\"\n                    ),\n                )\n                if self._content_limit_reached():\n                    self._search_stop_reason = \"content_target_reached\"\n                    return\n\n            advance = tikhub_runtime.advance_search(\n                platform=self.platform,\n                state=pagination,\n                body=body,\n            )\n            if not advance.should_continue:\n                self._search_stop_reason = advance.stop_reason or \"provider_exhausted\"\n                return\n            pagination = cast(dict[str, object], advance.next_state)\n        self._search_stop_reason = \"max_search_pages_reached\"\n'''
          new_search = '''    def _run_search(self, transport: TikHubHttpTransport, keyword: str) -> None:\n        pagination: dict[str, object] | None = None\n        for page_no in range(1, self.limits.max_search_pages + 1):\n            call = tikhub_runtime.build_search_call(\n                platform=self.platform,\n                keyword=keyword,\n                config=self.search_config,\n                state=pagination,\n            )\n            body, raw_record = self._send(transport, call)\n            self._requests[-1][\"keyword\"] = keyword\n            items = tikhub_runtime.extract_search_items(self.platform, body)\n            for item_index, raw_item in enumerate(items):\n                content = tikhub_runtime.map_content(\n                    platform=self.platform,\n                    raw=raw_item,\n                    context=tikhub_runtime.mapping_context(\n                        provider_request_id=raw_record.request_id,\n                        provider_attempt_id=raw_record.attempt_id,\n                        raw_artifact_id=raw_record.artifact_id,\n                        operation=call.operation,\n                        source_type=\"keyword\",\n                        source_value=keyword,\n                        observed_at=raw_record.observed_at,\n                    ),\n                    item_locator=f\"search.page[{page_no}].items[{item_index}]\",\n                )\n                content_id = content.external_content_id\n                self._remember_keyword(content_id, keyword)\n                if content_id in self._seen_contents:\n                    continue\n                self._seen_contents.add(content_id)\n                self.store.append_canonical(\"contents\", content)\n                self._process_content(\n                    transport,\n                    search_content=content,\n                    search_raw_locator=(\n                        f\"{self.store.relative_path(raw_record.path)}\"\n                        f\"#search.page[{page_no}].items[{item_index}]\"\n                    ),\n                )\n                if self._content_limit_reached():\n                    self._search_stop_reasons[keyword] = \"content_target_reached\"\n                    return\n\n            advance = tikhub_runtime.advance_search(\n                platform=self.platform,\n                state=pagination,\n                body=body,\n            )\n            if not advance.should_continue:\n                self._search_stop_reasons[keyword] = (\n                    advance.stop_reason or \"provider_exhausted\"\n                )\n                return\n            pagination = cast(dict[str, object], advance.next_state)\n        self._search_stop_reasons[keyword] = \"max_search_pages_reached\"\n'''
          replace(runner, old_search, new_search)
          replace(
              runner,
              "    def _content_limit_reached(self) -> bool:\n",
              "    def _remember_keyword(self, content_id: str, keyword: str) -> None:\n        matched = self._matched_keywords.setdefault(content_id, [])\n        if keyword not in matched:\n            matched.append(keyword)\n\n    def _blocks_with_keywords(self) -> tuple[ReviewBlock, ...]:\n        return tuple(\n            ReviewBlock(\n                content=replace(\n                    block.content,\n                    matched_keywords=tuple(\n                        self._matched_keywords.get(block.content.external_content_id, ())\n                    ),\n                ),\n                comments=block.comments,\n            )\n            for block in self._blocks\n        )\n\n    def _content_limit_reached(self) -> bool:\n",
          )
          replace(
              runner,
              "            \"platform\": self.platform,\n            \"keyword\": self.keyword,\n            \"status\": \"failed\" if error is not None else \"completed\",\n",
              "            \"platform\": self.platform,\n            \"keyword\": self.keywords[0] if len(self.keywords) == 1 else None,\n            \"keywords\": list(self.keywords),\n            \"matched_keywords\": self._matched_keywords,\n            \"status\": \"failed\" if error is not None else \"completed\",\n",
          )
          replace(
              runner,
              "            \"search_stop_reason\": self._search_stop_reason,\n",
              "            \"search_stop_reasons\": self._search_stop_reasons,\n",
          )
          replace(
              runner,
              "    platform: tikhub_runtime.TikHubPlatform,\n    keyword: str,\n    search_config: dict[str, object] | None = None,\n",
              "    platform: tikhub_runtime.TikHubPlatform,\n    keyword: str | None = None,\n    keywords: str | Sequence[str] | None = None,\n    search_config: dict[str, object] | None = None,\n",
          )
          replace(
              runner,
              "    config = TikHubTestConfig.load(env_file)\n    root = Path(output_root) if output_root is not None else _DEFAULT_OUTPUT_ROOT\n    return _TikHubDebugRunner(\n        platform=platform,\n        keyword=keyword,\n",
              "    normalized_keywords = _normalize_keywords(keyword=keyword, keywords=keywords)\n    config = TikHubTestConfig.load(env_file)\n    root = Path(output_root) if output_root is not None else _DEFAULT_OUTPUT_ROOT\n    return _TikHubDebugRunner(\n        platform=platform,\n        keywords=normalized_keywords,\n",
          )
          replace(
              runner,
              "\n\ndef _review_content(\n",
              '''\n\ndef _normalize_keywords(\n    *,\n    keyword: str | None,\n    keywords: str | Sequence[str] | None,\n) -> tuple[str, ...]:\n    if keyword is not None and keywords is not None:\n        raise ValueError(\"keyword 与 keywords 不能同时传入\")\n    if keyword is not None:\n        raw_values: tuple[str, ...] = (keyword,)\n    elif keywords is None:\n        raw_values = (\"爱玛\",)\n    elif isinstance(keywords, str):\n        raw_values = (keywords,)\n    else:\n        raw_values = tuple(keywords)\n\n    normalized: list[str] = []\n    for value in raw_values:\n        if not isinstance(value, str):\n            raise ValueError(\"keywords 只能包含字符串\")\n        stripped = value.strip()\n        if not stripped:\n            raise ValueError(\"keywords 不能包含空字符串\")\n        if stripped not in normalized:\n            normalized.append(stripped)\n    if not normalized:\n        raise ValueError(\"keywords 至少包含一个关键词\")\n    return tuple(normalized)\n\n\ndef _review_content(\n''',
          )

          excel = "backend/src/aima_ugc/adapters/providers/tikhub_test/excel.py"
          replace(excel, '    "Raw定位",\n)\n_COMMENT_HEADERS', '    "Raw定位",\n    "命中关键词",\n)\n_COMMENT_HEADERS')
          replace(excel, "_TEXT_ID_COLUMNS = {2, 16, 17, 18}\n", "_TEXT_ID_COLUMNS = {2, 17, 18, 19}\n")
          replace(excel, "_WRAP_COLUMNS = {4, 5, 13, 14, 19, 20, 24}\n", "_WRAP_COLUMNS = {4, 5, 13, 14, 15, 20, 21, 25}\n")
          replace(
              excel,
              "    15: 10,\n    16: 24,\n    17: 24,\n    18: 24,\n    19: 18,\n    20: 44,\n    21: 20,\n    22: 11,\n    23: 11,\n    24: 34,\n",
              "    15: 28,\n    16: 10,\n    17: 24,\n    18: 24,\n    19: 24,\n    20: 18,\n    21: 44,\n    22: 20,\n    23: 11,\n    24: 11,\n    25: 34,\n",
          )
          replace(excel, "    raw_locator: str\n\n\n@dataclass", "    raw_locator: str\n    matched_keywords: tuple[str, ...] = ()\n\n\n@dataclass")
          replace(
              excel,
              "        content.coverage,\n        content.raw_locator,\n    )\n",
              "        content.coverage,\n        content.raw_locator,\n        \"；\".join(content.matched_keywords),\n    )\n",
          )

          wrapper_paths = (
              "backend/src/aima_ugc/adapters/providers/tikhub_test/xiaohongshu.py",
              "backend/src/aima_ugc/adapters/providers/tikhub_test/douyin.py",
              "backend/src/aima_ugc/adapters/providers/tikhub_test/weibo.py",
              "backend/src/aima_ugc/adapters/providers/tikhub_test/bilibili.py",
              "backend/src/aima_ugc/adapters/providers/tikhub_test/kuaishou.py",
          )
          for path in wrapper_paths:
              replace(path, "from pathlib import Path\n", "from collections.abc import Sequence\nfrom pathlib import Path\n")
              replace(
                  path,
                  '    keyword: str = "爱玛",\n',
                  "    keyword: str | None = None,\n    keywords: str | Sequence[str] | None = None,\n",
              )
              replace(path, "        keyword=keyword,\n", "        keyword=keyword,\n        keywords=keywords,\n")

          behavior_test = "tests/unit/collection/test_tikhub_test_debug.py"
          text = Path(behavior_test).read_text(encoding="utf-8")
          text = text.replace('sheet["P2"]', 'sheet["Q2"]').replace('sheet["P3"]', 'sheet["Q3"]')
          text = text.replace('sheet["T2"]', 'sheet["U2"]').replace('sheet["T3"]', 'sheet["U3"]')
          Path(behavior_test).write_text(text, encoding="utf-8")

          runtime_test = "tests/unit/collection/test_tikhub_test_debug_runtime.py"
          replace(
              runtime_test,
              "def _fixture(name: str) -> dict[str, Any]:\n    return json.loads((_FIXTURE_ROOT / name).read_text(encoding=\"utf-8\"))\n\n\n",
              '''def _fixture(name: str) -> dict[str, Any]:\n    return json.loads((_FIXTURE_ROOT / name).read_text(encoding=\"utf-8\"))\n\n\ndef _single_item_search() -> dict[str, Any]:\n    body = _fixture(\"search_notes_page1.sanitized.json\")\n    items = body[\"data\"][\"data\"][\"items\"]\n    body[\"data\"][\"data\"][\"items\"] = items[:1]\n    return body\n\n\n''',
          )
          text = Path(runtime_test).read_text(encoding="utf-8")
          text = text.replace('sheet["P2"]', 'sheet["Q2"]').replace('sheet["P3"]', 'sheet["Q3"]')
          old_multi = '''    responses = [\n        _fixture(\"search_notes_page1.sanitized.json\"),\n        _matching_detail(),\n        _matching_comments(),\n        _matching_replies(),\n        _fixture(\"search_notes_page1.sanitized.json\"),\n    ]\n'''
          new_multi = '''    responses = [\n        _single_item_search(),\n        _matching_detail(),\n        _matching_comments(),\n        _matching_replies(),\n        _single_item_search(),\n    ]\n'''
          if old_multi not in text:
              raise SystemExit("multi-keyword test response block not found")
          text = text.replace(old_multi, new_multi, 1)
          Path(runtime_test).write_text(text, encoding="utf-8")
          PY

          uv run ruff format backend/src/aima_ugc/adapters/providers/tikhub_test tests/unit/collection/test_tikhub_test_debug.py tests/unit/collection/test_tikhub_test_debug_runtime.py
          uv run ruff check --fix backend/src/aima_ugc/adapters/providers/tikhub_test tests/unit/collection/test_tikhub_test_debug.py tests/unit/collection/test_tikhub_test_debug_runtime.py
          uv run mypy backend/src
          uv run pytest tests/unit/collection/test_tikhub_test_debug.py tests/unit/collection/test_tikhub_test_debug_runtime.py -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/aima_ugc/adapters/providers/tikhub_test tests/unit/collection/test_tikhub_test_debug.py tests/unit/collection/test_tikhub_test_debug_runtime.py
          git commit -m "支持 TikHub 调试多关键词去重"
          git push origin HEAD:agent/tikhub-test-debug
