## 3. 评论分页与真实形状兼容

一级评论可发送：

```text
sort_type=0  # hot
sort_type=1  # latest
```

生产 extractor 只接收具有稳定 `idstr/mid/id` 的真实评论数据；TikHub 响应中的展示卡片不会送入 Comment Mapper。分页优先消费 `data.moreInfo.params.max_id`；当当前真实形状缺少 `moreInfo` 时按 Provider 末页处理，而不是猜测另一个私有游标路径。

## 4. 为什么当前不开增量

虽然接口存在 `sort_type=1`，2026-08-18 当前真实 Probe 对 20 条有效评论计算得到：

```text
time_count = 20
time_nonincreasing = false
```

因此“参数叫 latest”不足以证明 comment ID 可以作为安全历史边界，Capability 保持：

```text
supports_incremental_comment_sort = false
```

`comment_count` 增加时继续 `refresh_controlled`；不变时默认跳过评论。只有未来重新取得稳定顺序证据，才能经新的机器事实修改 Capability。

