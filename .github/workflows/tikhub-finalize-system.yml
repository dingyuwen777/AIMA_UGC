name: TikHub Five Platform Finalize

on:
  push:
    branches: [agent/tikhub-test-debug]
    paths: [".github/workflows/tikhub-finalize-system.yml"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/tikhub-test-debug
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Apply system-level finalization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          def replace_all(path: str, replacements: tuple[tuple[str, str], ...]) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"{path}: missing replacement source: {old!r}")
                  text = text.replace(old, new)
              p.write_text(text, encoding="utf-8")

          # B站真实 mode=2 + next_offset=0 首屏已验证 20/20 唯一 ID 且时间严格非增。
          replace_once(
              "backend/src/aima_ugc/adapters/providers/tikhub/capabilities.py",
              '''        ProviderOperationCapabilityV1(\n            business_operation="comments",\n            provider_operations=("fetch_video_comments",),\n            comment_sort_modes=("latest", "hot"),\n            supports_reply_count=True,\n            supports_sub_comments=True,\n            supports_incremental_comment_sort=False,\n            provider_page_size_policy="provider_default",\n        ),''',
              '''        ProviderOperationCapabilityV1(\n            business_operation="comments",\n            provider_operations=("fetch_video_comments",),\n            comment_sort_modes=("latest", "hot"),\n            supports_reply_count=True,\n            supports_sub_comments=True,\n            supports_incremental_comment_sort=True,\n            provider_page_size_policy="provider_default",\n        ),''',
          )

          replace_once(
              "tests/unit/collection/test_tikhub_real_capabilities.py",
              '''    # XHS App V2 comments 固定 latest_v2，且官方说明为时间倒序/最新优先；\n    # 其余平台当前仍缺少同等级“可按历史 comment_id 安全截断”的证据。\n    assert _operation(XHS_TIKHUB_CAPABILITY, "comments").supports_incremental_comment_sort is True\n    for capability in (\n        DOUYIN_TIKHUB_CAPABILITY,\n        WEIBO_TIKHUB_CAPABILITY,\n        BILIBILI_TIKHUB_CAPABILITY,\n        KUAISHOU_TIKHUB_CAPABILITY,\n    ):\n        assert _operation(capability, "comments").supports_incremental_comment_sort is False''',
              '''    # XHS latest_v2 与 B站 mode=2/next_offset=0 都有当前真实“最新优先”证据；\n    # 抖音缺少可选择的最新评论排序，微博/快手真实页顺序不满足安全历史边界。\n    assert _operation(XHS_TIKHUB_CAPABILITY, "comments").supports_incremental_comment_sort is True\n    assert (\n        _operation(BILIBILI_TIKHUB_CAPABILITY, "comments").supports_incremental_comment_sort\n        is True\n    )\n    for capability in (\n        DOUYIN_TIKHUB_CAPABILITY,\n        WEIBO_TIKHUB_CAPABILITY,\n        KUAISHOU_TIKHUB_CAPABILITY,\n    ):\n        assert _operation(capability, "comments").supports_incremental_comment_sort is False''',
          )

          decision_path = Path("tests/unit/collection/test_stage7_decision.py")
          decision = decision_path.read_text(encoding="utf-8")
          decision = decision.replace(
              "from aima_ugc.adapters.providers.tikhub.capabilities import XHS_TIKHUB_CAPABILITY",
              "from aima_ugc.adapters.providers.tikhub.capabilities import (\n    BILIBILI_TIKHUB_CAPABILITY,\n    XHS_TIKHUB_CAPABILITY,\n)",
          )
          marker = "\ndef test_comment_count_decrease_never_guesses_specific_deletion() -> None:\n"
          if marker not in decision:
              raise SystemExit("decision insertion marker missing")
          bili_test = dedent('''
          \n
def test_bilibili_comment_count_increase_uses_verified_incremental_sort() -> None:
              request = _request(current_comment_count=80, previous_comment_count=35, existing=True)
              request = request.model_copy(update={"capability": BILIBILI_TIKHUB_CAPABILITY})

              decision = CollectionDecisionService().decide(request)

              assert decision.comment_action == "fetch_incremental"
              assert decision.comment_reason == "comment_count_increased_incremental"
          ''')
          decision_path.write_text(decision.replace(marker, bili_test + marker), encoding="utf-8")

          # 当前新包未对外发布，统一把“review”内部命名收敛成“原始数据”。
          replace_all(
              "backend/src/aima_ugc/adapters/providers/tikhub_test/excel.py",
              (
                  ("人工审阅 XLSX", "原始数据 XLSX"),
                  ("ReviewContent", "RawDataContent"),
                  ("ReviewCommentRow", "RawDataCommentRow"),
                  ("ReviewBlock", "RawDataBlock"),
                  ("write_review_workbook", "write_raw_data_workbook"),
                  ("纵向区块人工审阅 Workbook", "纵向区块原始数据 Workbook"),
              ),
          )
          replace_all(
              "backend/src/aima_ugc/adapters/providers/tikhub_test/runner.py",
              (
                  ("ReviewContent", "RawDataContent"),
                  ("ReviewCommentRow", "RawDataCommentRow"),
                  ("ReviewBlock", "RawDataBlock"),
                  ("write_review_workbook", "write_raw_data_workbook"),
                  ("review_dir", "raw_data_dir"),
                  ("_review_content", "_raw_data_content"),
                  ("_review_comment", "_raw_data_comment"),
                  ("_review.xlsx", "_raw_data.xlsx"),
                  ("_manifest", "_run_summary"),
              ),
          )
          replace_all(
              "backend/src/aima_ugc/adapters/providers/tikhub_test/core.py",
              (
                  ("review_dir", "raw_data_dir"),
                  ('run_dir / "review"', 'run_dir / "raw_data"'),
              ),
          )
          replace_all(
              "tests/unit/collection/test_tikhub_test_debug.py",
              (
                  ("ReviewContent", "RawDataContent"),
                  ("ReviewCommentRow", "RawDataCommentRow"),
                  ("ReviewBlock", "RawDataBlock"),
                  ("write_review_workbook", "write_raw_data_workbook"),
                  ("test_review_workbook_uses_approved_content_comment_layout", "test_raw_data_workbook_uses_approved_content_comment_layout"),
              ),
          )
          replace_all(
              "backend/src/aima_ugc/adapters/providers/tikhub_test/README.md",
              (
                  ("xhs_review.xlsx", "xhs_raw_data.xlsx"),
                  ("review/", "raw_data/"),
              ),
          )

          # Blueprint 13 只讨论原始数据 Excel，不把它叫报告或人工审阅 Renderer。
          replace_all(
              "docs/blueprint/13-统一数据Excel导出与调试复用.md",
              (
                  ("阶段性人工审阅 Excel 实现", "阶段性原始数据 Excel 实现"),
                  ("tikhub_test 临时 ReviewContent / ReviewCommentRow", "tikhub_test 临时 RawDataContent / RawDataCommentRow"),
                  ("内容与评论.xlsx", "<platform>_raw_data.xlsx"),
                  ("人工审阅格式不能反向成为 Canonical Schema", "原始数据 Excel 展示格式不能反向成为 Canonical Schema"),
                  ("唯一共享 Excel Exporter/Renderer", "唯一共享原始数据 Excel Exporter"),
                  ("`ReviewContent` / `ReviewCommentRow` / `ReviewBlock`", "`RawDataContent` / `RawDataCommentRow` / `RawDataBlock`"),
              ),
          )
          replace_all(
              "docs/blueprint/README.md",
              (
                  ("帖子/评论基础数据 Excel 导出、`.xlsx` 人工审阅", "帖子/评论原始数据 Excel 导出、`.xlsx` 原始数据查看"),
                  ("采集基础数据 Excel、Canonical/Aggregate 导出边界、`tikhub_test` 阶段性 Excel", "采集原始数据 Excel、Canonical/Aggregate 导出边界、`tikhub_test` 阶段性 Excel"),
                  ("基础数据导出、Excel、`.xlsx`、`openpyxl`、调试审阅文件", "原始数据导出、Excel、`.xlsx`、`openpyxl`、调试原始数据文件"),
              ),
          )

          # 07 固化系统级共享原始数据 Excel 与 tikhub_test 收敛门禁。
          p07 = Path("docs/blueprint/07-技术决策与实施门禁.md")
          text07 = p07.read_text(encoding="utf-8")
          text07 = text07.replace("> 蓝图版本：1.17", "> 蓝图版本：1.18")
          anchor = "| 数据库中间层 | 写入固定 Canonical → Ingestion Service → Owner Repository；读取固定 PostgreSQL → Query Repository/Read Model → Query Service；Aggregate 不作为数据库大 JSON 持久化 |\n"
          if anchor not in text07:
              raise SystemExit("07 decision table anchor missing")
          row = "| 原始数据 Excel | 系统级原始数据 Excel 只消费 Canonical/Aggregate 或经批准的 Provider-neutral Export Read Model；它不是分析报告。正式共享 Exporter 落地时，`tikhub_test` 必须删除平行 Excel 生成实现并复用共享导出，不能长期维护两套字段/样式/安全规则。 |\n"
          text07 = text07.replace(anchor, anchor + row)
          p07.write_text(text07, encoding="utf-8")

          # Blueprint 08：把设计、机器事实与本轮真实验证矩阵收敛到同一处。
          p08 = Path("docs/blueprint/08-采集策略与平台能力.md")
          text08 = p08.read_text(encoding="utf-8")
          old10 = '''如果 Provider 没有稳定时间排序或 Fixture 不能证明该停止条件可靠，则 Capability 不声明增量能力，改为受控部分刷新。\n\n`comment_count` 下降只表示平台总量发生变化，可能是删除、审核或统计校正。如果以前或当前 coverage 不是完整集合，不得把“这次没看到某条旧评论”解释成具体删除。'''
          new10 = '''如果 Provider 没有稳定时间排序或 Fixture/真实 Probe 不能证明该停止条件可靠，则 Capability 不声明增量能力，改为受控部分刷新。已付费返回的当前页必须完整保存、映射和摄取；历史边界只决定“是否继续付费请求下一页”。\n\n当前五平台正式 Capability：\n\n| 平台 | 评论排序事实 | `supports_incremental_comment_sort` | 原因 |\n| --- | --- | --- | --- |\n| 小红书 | App V2 固定 `latest_v2` | `true` | 官方最新优先语义 + 当前真实页时间严格非增 |\n| B站 | App `mode=2`，首屏显式 `next_offset=0` | `true` | 官方时间排序语义 + 当前真实首屏 20/20 唯一 ID、20 个时间戳严格非增 |\n| 抖音 | App V3 评论无已批准的最新评论排序参数 | `false` | 无法证明 comment ID 可作为安全时间边界 |\n| 微博 | App `sort_type=1` | `false` | 当前真实 20 条有效评论时间顺序并非严格非增 |\n| 快手 | App `pcursor`，无已批准的最新评论排序参数 | `false` | 当前真实 94 条一级评论时间顺序并非严格非增 |\n\n增量安全停止使用生产共享规则：某页出现已知历史评论后，只有从**第一个已知评论到该页末尾全部都是已知评论**，才记录 `known_comment_reached` 并停止下一页；如果旧评论后又出现新评论，则继续翻页，避免置顶/混排导致误停。\n\n`comment_count` 下降只表示平台总量发生变化，可能是删除、审核或统计校正。如果以前或当前 coverage 不是完整集合，不得把“这次没看到某条旧评论”解释成具体删除。'''
          if old10 not in text08:
              raise SystemExit("Blueprint08 incremental block missing")
          text08 = text08.replace(old10, new10)
          text08 = text08.replace("→ 人工 XLSX", "→ 原始数据 Excel")
          text08 = text08.replace("`decisions.jsonl` 和人工 XLSX", "运行摘要/决策证据和原始数据 Excel")
          start = text08.index("## 18. 五平台能力差异摘要")
          end = text08.index("## 19. Stage 7 当前实现与收尾门禁")
          section18 = dedent('''
          ## 18. 五平台能力差异摘要

          ### 18.1 小红书

          - Search App V2 支持排序、内容类型和发布时间筛选；评论 App V2 固定 `sort_strategy=latest_v2`；
          - 当前真实 Runner 观察到 6 条一级评论 ID 唯一且时间严格非增；Capability 已开启安全增量；
          - `comment_count` 增加时生产 Decision 可进入 `fetch_incremental`，正式 Scope 从 PostgreSQL 读取已知一级评论 ID，并使用共享 `known_comment_reached` 边界停止下一页。

          ### 18.2 抖音

          - Search V2、App V3 Detail/Comments/Replies、Mapper、真实 Fixture、Capability/Registry 和生产纵切均已建立；
          - 真实兼容验证确认生产 extractor 会过滤不含稳定 `aweme_id` 的混合搜索卡片；
          - App V3 评论当前没有已批准的“最新评论排序”业务参数，因此 `supports_incremental_comment_sort=false`；评论数增加走 `refresh_controlled`，不猜历史 ID 时间边界。

          ### 18.3 微博

          - Web Search、App Detail/一级评论、Web V2 二级评论、Mapper、真实 Fixture、Capability/Registry 均已建立；
          - App 一级评论可发送 `sort_type=1`，但当前真实样本的 20 条有效评论时间顺序不是严格非增；生产 extractor 同时会过滤没有稳定评论 ID 的展示卡片；
          - 因此 `supports_incremental_comment_sort=false`，不能因为参数名叫“latest”就提前停止分页。

          ### 18.4 B站

          - App Search/Detail/Comments/Reply、Mapper、真实 Fixture、Capability/Registry 均已建立；Search 当前没有 Provider 原生时间范围，`native_time_filter=false`；
          - 评论 `latest` 映射 `mode=2`；真实 Probe 证明首屏必须显式 `next_offset=0` 才能稳定返回 App 评论，因此生产 Runtime 已固定该首屏语义；
          - 2026-08-18 当前真实 Runner 选择一个 Provider 报告 105 条评论的视频，`mode=2 + next_offset=0` 返回 20 条，20/20 ID 唯一、20 个时间戳严格非增；结合官方“mode=2=time”语义，Capability 开启 `supports_incremental_comment_sort=true`。

          ### 18.5 快手

          - 正式主链仍为 App Search V2 / Detail / 一级评论 / 二级回复；Web 评论链只保留显式 `verified_backup`，不自动 fallback；
          - 当前正式 App 评论没有已批准的最新评论排序参数；真实 Probe 的 94 条一级评论时间顺序不是严格非增；
          - 因此 `supports_incremental_comment_sort=false`，评论数增加继续受控刷新。

          详细平台规则、官方链接和当前代码路径见 [`../collection/README.md`](../collection/README.md)。

          ''')
          text08 = text08[:start] + section18 + text08[end:]
          start19 = text08.index("## 19. Stage 7 当前实现与收尾门禁")
          end19 = text08.index("## 20. 文档同步规则")
          section19 = dedent('''
          ## 19. Stage 7 当前实现状态与一致性门禁

          Stage 7 的基础采集/调度闭环已合入 `main` 并归档；本节不再把历史 PR #55 的“待合并”步骤描述成当前工作。当前正式机器实现包括五平台 TikHub Operation/Mapper/Capability/Registry、Provider Config/Secret、Decision、Plan/Occurrence/Run Snapshot、Scheduler、`collection.run.v1` Worker、Raw/Canonical/Ingestion 与 Provider Billing 审计。

          2026-08-18 的系统一致性复核发现并修复了一个已批准 Blueprint 未完整落地的缺口：增量评论 Decision 已存在，但生产 Scope 最初没有历史 comment ID 边界，且 XHS Capability 保守关闭。当前规则已经收敛为：

          - 生产 `known_comment_reached` 规则由 Collection 模块统一拥有；
          - PostgreSQL 一次读取目标内容已有一级评论 ID，不逐评论查询；
          - XHS、B站按已验证最新排序开启增量；抖音、微博、快手保持受控刷新；
          - `tikhub_test` 只提供文件版 previous state，调用同一个生产 Decision/边界规则；
          - 当前没有请求/金额 Budget Runtime，也不以预算作为评论停止条件。

          后续任何平台若要从 `false` 改成 `true`，必须取得同等级“官方排序语义 + 当前真实多评论页顺序 + 稳定 comment ID”的证据，并同步 Capability、平台文档和回归测试；不能只依据参数名称或单条样本。

          ''')
          text08 = text08[:start19] + section19 + text08[end19:]
          p08.write_text(text08, encoding="utf-8")

          # 平台实现文档直接改写为当前事实，清除 Stage7 前的“尚未实现/Budget”遗留。
          docs = {
              "docs/collection/xiaohongshu.md": r'''# 小红书采集逻辑

## 1. 当前状态

小红书当前已具备完整 TikHub 生产链：App V2 Search、图文/视频 Detail、一级/二级评论 Operation，生产 Extractor/Mapper、合法脱敏真实 Fixture、Capability/Registry、Canonical/Ingestion、正式 Collection Worker 与独立 `tikhub_test` 调试入口均已建立。

## 2. 正式 Operation

| 业务动作 | Endpoint |
| --- | --- |
| 搜索 | `GET /api/v1/xiaohongshu/app_v2/search_notes` |
| 图文详情 | `GET /api/v1/xiaohongshu/app_v2/get_image_note_detail` |
| 视频详情 | `GET /api/v1/xiaohongshu/app_v2/get_video_note_detail` |
| 一级评论 | `GET /api/v1/xiaohongshu/app_v2/get_note_comments` |
| 二级评论 | `GET /api/v1/xiaohongshu/app_v2/get_note_sub_comments` |

第一版不做 App/Web 自动 fallback。搜索对上层暴露规范化排序、内容类型和发布时间范围；Provider 私有 `page/search_id/search_session_id/cursor/index/pageArea` 只由 Operation/Runtime 管理。

## 3. 评论与增量省钱

一级评论请求固定发送：

```text
sort_strategy=latest_v2
```

当前官方语义和真实 Runner 都证明该主链按最新优先工作：真实样本的一级评论 ID 唯一，发布时间严格非增。因此 Capability 为：

```text
comment_sort_modes = ("latest",)
supports_incremental_comment_sort = true
```

统一行为：

```text
comment_count 不变 → 默认不请求评论
comment_count 增加 → fetch_incremental
comment_count 减少 → refresh_controlled
```

增量时先完整保存、映射和摄取当前已付费页面。只有从本页第一个已知历史 `comment_id` 到页尾全部都是已知历史评论，才记录 `known_comment_reached` 并停止下一页；旧评论后又出现新评论时继续翻页。生产系统从 PostgreSQL 一次读取历史一级评论 ID，`tikhub_test` 用文件 state 适配，但两者调用同一个生产边界规则。

当前没有请求次数/金额 Budget Runtime，不能把技术页数上限或评论目标解释成预算门禁。

## 4. Pipeline

```text
search_notes → Raw → Mapper/Observation → identity/compare → Decision
→ 必要时 Detail → Comments/Replies → Raw → Mapper → Canonical → Ingestion
```

重复搜索窗口、分页和多关键词都按 `(platform, external_content_id)` 收敛后续付费动作。

## 5. 独立调试

无数据库调试入口：

```python
from aima_ugc.adapters.providers.tikhub_test.xiaohongshu import run_xiaohongshu

run_xiaohongshu(keyword="爱玛", sort_mode="latest", published_within="1d")
```

输出 Raw、Canonical、`run_summary.json`、跨运行 `state.json` 和原始数据 Excel。完整规则见 `backend/src/aima_ugc/adapters/providers/tikhub_test/README.md`。
''',
              "docs/collection/douyin.md": r'''# 抖音采集逻辑

## 1. 当前状态

抖音当前已建立 Search V2、App V3 Detail/一级评论/回复 Operation，生产 Extractor/Mapper、合法脱敏真实 Fixture、Capability/Registry、Canonical/Ingestion、正式 Collection Worker 与 `tikhub_test` 独立调试入口。

## 2. 正式 Operation

| 业务动作 | Endpoint |
| --- | --- |
| 搜索 | `POST /api/v1/douyin/search/fetch_video_search_v2` |
| 详情 | `GET /api/v1/douyin/app/v3/fetch_one_video_v3` |
| 一级评论 | `GET /api/v1/douyin/app/v3/fetch_video_comments` |
| 回复 | `GET /api/v1/douyin/app/v3/fetch_video_comment_replies` |

Search V2 规范化支持 `general/most_liked/latest`、`all/1d/7d/180d`、时长和内容类型。`cursor/search_id/backtrace` 是 Provider 技术状态，不进入普通业务配置。

真实兼容复核发现搜索响应可能混入不含 `aweme_info.aweme_id` 的展示卡片；生产 extractor 现在只把具有稳定视频 ID 的业务卡片送入 Mapper，避免第三方混合结果导致整个 Scope 失败。

## 3. 评论省钱与排序边界

当前 App V3 一级评论主 Operation 使用 `aweme_id + cursor`，正式接口没有已批准的“最新评论排序”业务参数。因此：

```text
supports_incremental_comment_sort = false
```

即使 `comment_count` 增加，也不能假定“遇到旧 comment_id 就代表进入历史区”。当前 Decision 使用 `refresh_controlled`；不变时默认跳过评论，减少重复费用。未来只有在官方排序语义和真实多评论页顺序都能证明安全边界时，才能开启增量。

## 4. Pipeline

```text
fetch_video_search_v2 → Raw → Douyin Mapper → aweme_id identity/compare
→ Decision → 必要时 fetch_one_video_v3
→ fetch_video_comments / replies → Raw → Mapper → Canonical → Ingestion
```

当前没有 Budget/Cost Guard；费用控制依赖去重、Decision、Provider 末页、目标和技术安全上限。

## 5. 独立调试

```python
from aima_ugc.adapters.providers.tikhub_test.douyin import run_douyin

run_douyin(keyword="爱玛", sort_mode="latest", published_within="1d")
```

调试入口复用生产 Runtime/Mapper，输出 Raw、Canonical、`run_summary.json`、state 和原始数据 Excel。
''',
              "docs/collection/weibo.md": r'''# 微博采集逻辑

