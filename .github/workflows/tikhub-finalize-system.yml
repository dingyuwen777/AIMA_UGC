name: TikHub Five Platform Finalize

on:
  push:
    branches:
      - agent/tikhub-test-debug
    paths:
      - ".github/workflows/tikhub-finalize-system.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/tikhub-test-debug
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Apply finalization scripts
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/dev/tikhub_finalize_code.py
          uv run python scripts/dev/tikhub_finalize_platform_docs.py
          uv run python scripts/dev/tikhub_finalize_blueprints.py
          uv run python scripts/dev/tikhub_finalize_meta.py
          uv run ruff format \
            backend/src/aima_ugc/adapters/providers/tikhub/capabilities.py \
            backend/src/aima_ugc/adapters/providers/tikhub_test \
            tests/unit/collection/test_stage7_decision.py \
            tests/unit/collection/test_tikhub_real_capabilities.py \
            tests/unit/collection/test_tikhub_test_debug.py \
            scripts/dev/tikhub_finalize_code.py \
            scripts/dev/tikhub_finalize_platform_docs.py \
            scripts/dev/tikhub_finalize_blueprints.py \
            scripts/dev/tikhub_finalize_meta.py
          uv run ruff check --fix \
            backend/src/aima_ugc/adapters/providers/tikhub/capabilities.py \
            backend/src/aima_ugc/adapters/providers/tikhub_test \
            tests/unit/collection/test_stage7_decision.py \
            tests/unit/collection/test_tikhub_real_capabilities.py \
            tests/unit/collection/test_tikhub_test_debug.py \
            scripts/dev/tikhub_finalize_code.py \
            scripts/dev/tikhub_finalize_platform_docs.py \
            scripts/dev/tikhub_finalize_blueprints.py \
            scripts/dev/tikhub_finalize_meta.py
      - name: Verify finalization
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run ruff format --check backend tests scripts
          uv run ruff check backend tests scripts
          uv run mypy backend/src
          uv run pytest \
            tests/unit/collection/test_stage7_decision.py \
            tests/unit/collection/test_tikhub_real_capabilities.py \
            tests/unit/collection/test_bilibili_tikhub_operation.py \
            tests/unit/collection/test_douyin_tikhub_operation.py \
            tests/unit/collection/test_weibo_tikhub_operation.py \
            tests/unit/collection/test_kuaishou_tikhub_operation.py \
            tests/unit/collection/test_xhs_tikhub_operation.py \
            tests/unit/collection/test_tikhub_test_debug.py \
            tests/unit/collection/test_tikhub_test_debug_runtime.py \
            -q
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py
          git diff --check
      - name: Remove task-only files and commit verified result
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/tikhub-bilibili-weibo-green.yml \
            .github/workflows/tikhub-five-platform-comment-order-probe.yml \
            .github/workflows/tikhub-system-green-patch.yml \
            .github/workflows/tikhub-system-green-patch-v2.yml \
            .github/workflows/tikhub-system-green-patch-v3.yml \
            .github/workflows/tikhub-system-green-patch-v4.yml \
            .github/workflows/tikhub-system-green-patch-v5.yml \
            .github/workflows/tikhub-test-lock-refresh.yml \
            .github/workflows/tikhub-finalize-system.yml \
            scripts/dev/tikhub_finalize_code.py \
            scripts/dev/tikhub_finalize_platform_docs.py \
            scripts/dev/tikhub_finalize_blueprints.py \
            scripts/dev/tikhub_finalize_meta.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "完成 TikHub 五平台评论增量一致性修复"
          git push origin HEAD:agent/tikhub-test-debug
