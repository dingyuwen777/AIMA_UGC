| 视频详情 | `GET /api/v1/bilibili/app/fetch_one_video` |
| 一级评论 | `GET /api/v1/bilibili/app/fetch_video_comments` |
| 二级回复 | `GET /api/v1/bilibili/app/fetch_reply_detail` |

搜索排序为 `general/latest/play_count/danmaku_count`。当前 Search 没有 Provider 原生发布时间筛选，所以 `native_time_filter=false`；本地时间边界不能伪装成服务端能力。

## 3. 一级评论的首屏与排序

正式业务排序：

```text
latest → mode=2
hot    → mode=3
```

当前真实验证确认 App 首屏必须显式发送：

```text
next_offset=0
```

省略 offset 或误从 1 开始会造成当前样本返回空页，因此生产 builder/Runtime 已固定首屏 `next_offset=0`，后续只消费已经由正式分页 extractor 证明的 offset。

## 4. 已验证增量能力

TikHub 官方当前把 `mode=2` 定义为时间排序。2026-08-18 GitHub-hosted Runner 使用生产 Runtime、关键词“爱玛”，从前五个候选中选择 Provider 报告评论数最高的样本后验证：

```text
reported_comment_count = 105
mode = 2
next_offset = 0
returned_root_comments = 20
unique_comment_ids = 20
time_count = 20
time_nonincreasing = true
```

因此当前 Capability 为：

```text
comment_sort_modes = ("latest", "hot")
supports_incremental_comment_sort = true
```

`comment_count` 增加时走统一 `fetch_incremental`。当前已付费页先完整 Raw/Mapper/Ingestion；只有从首个已知历史 comment ID 到页尾全部已知时才 `known_comment_reached`，否则继续下一页。

## 5. Pipeline 与调试

```text
fetch_search_by_type → Raw → Bilibili Mapper → content identity/compare → Decision
→ 必要时 fetch_one_video → fetch_video_comments / fetch_reply_detail
→ Raw → Mapper → Canonical → Ingestion
```

```python
from aima_ugc.adapters.providers.tikhub_test.bilibili import run_bilibili

run_bilibili(keyword="爱玛", sort_mode="latest")
```

弹幕仍是独立 enrichment，不等同评论。当前没有 Budget/Cost Guard。
''',
