name: One-off server generated catalog codes v3

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/server-generated-resource-codes'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frozen environments
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
          npm ci --prefix frontend

      - name: Apply v2 scoped patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/oneoff-server-generated-catalog-codes-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Regenerate OpenAPI and Orval client"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('Unable to locate the v2 scoped patch block exactly once')
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(script), '<v2-scoped-patch>', 'exec'))
          PY

      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          uv run pytest -q tests/contracts/test_server_generated_catalog_codes.py
          uv run ruff check --fix tests/contracts/test_server_generated_catalog_codes.py
          uv run ruff check backend/src/aima_ugc/contracts/brand_vehicle.py backend/src/aima_ugc/contracts/administration.py backend/src/aima_ugc/bootstrap/brand_vehicle_http.py backend/src/aima_ugc/bootstrap/administration_http.py tests/contracts/test_server_generated_catalog_codes.py
          npm --prefix frontend run typecheck
          git diff --check

      - name: Remove one-off workflows and commit generated change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/oneoff-server-generated-catalog-codes.yml
          rm .github/workflows/oneoff-server-generated-catalog-codes-v2.yml
          rm .github/workflows/oneoff-server-generated-catalog-codes-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m '实现服务端生成品牌车型内部编码 (#522)'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
