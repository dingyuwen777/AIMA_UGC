name: Report visual polish helper

on:
  push:
    branches:
      - fix/report-visual-fidelity

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/report-visual-fidelity
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - name: Apply visual density polish
        run: |
          python - <<'PY'
          from pathlib import Path

          visual = Path('backend/src/aima_ugc/platform/reporting/visual_docx.py')
          text = visual.read_text(encoding='utf-8')
          old_primary = 'self._append_ranking_table(left, rows, start_rank=1, show_progress=True)'
          if old_primary not in text:
              raise SystemExit('primary overview ranking call not found')
          text = text.replace(
              old_primary,
              'self._append_ranking_table(left, rows, start_rank=1, show_progress=False)',
              1,
          )
          old_chart = 'self._append_chart(right, chart, width_emu=4_650_000, height_emu=3_250_000)'
          if text.count(old_chart) < 2:
              raise SystemExit('expected ranking/table chart calls not found')
          text = text.replace(
              old_chart,
              'self._append_chart(\n                right, chart, width_emu=4_650_000, height_emu=_ranking_visual_height(limit)\n            )',
              1,
          )
          marker = '\n\ndef _parse_integer(value: str) -> int:\n'
          helper = '''\n\ndef _ranking_visual_height(item_count: int) -> int:\n    """少量条目使用更矮的图表，避免一条数据占满半页。"""\n\n    if item_count <= 2:\n        return 1_900_000\n    if item_count <= 4:\n        return 2_350_000\n    if item_count <= 6:\n        return 2_850_000\n    return 3_250_000\n'''
          if marker not in text:
              raise SystemExit('visual helper insertion marker not found')
          text = text.replace(marker, helper + marker, 1)
          visual.write_text(text, encoding='utf-8')

          test = Path('tests/unit/platform/test_reporting_visual_fidelity.py')
          test_text = test.read_text(encoding='utf-8')
          anchor = '    assert "AIMAPrimaryOverview" in captions\n'
          if anchor not in test_text:
              raise SystemExit('primary overview assertion anchor not found')
          test_text = test_text.replace(
              anchor,
              anchor + '    assert "AIMAProgress" not in captions\n',
              1,
          )
          test.write_text(test_text, encoding='utf-8')
          PY
      - name: Format and check touched files
        run: |
          python -m pip install uv==0.12.3
          uv sync --locked
          uv run ruff format backend/src/aima_ugc/platform/reporting/visual_docx.py tests/unit/platform/test_reporting_visual_fidelity.py
          uv run ruff check backend/src/aima_ugc/platform/reporting/visual_docx.py tests/unit/platform/test_reporting_visual_fidelity.py
      - name: Commit polish when needed
        run: |
          if git diff --quiet -- backend/src/aima_ugc/platform/reporting/visual_docx.py tests/unit/platform/test_reporting_visual_fidelity.py; then
            echo "No polish changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/aima_ugc/platform/reporting/visual_docx.py tests/unit/platform/test_reporting_visual_fidelity.py
          git commit -m "压缩少量数据与一级议题视觉高度"
          git push origin HEAD:fix/report-visual-fidelity
