name: Stage 7 Budget Removal Doc Sync

on:
  push:
    branches:
      - feature/stage7-completion
    paths:
      - .github/workflows/stage7-budget-removal-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage7-completion
          fetch-depth: 0

      - name: Synchronize approved budget-removal facts
        shell: python
        run: |
          from pathlib import Path
          import re

          def exact(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count}, found {actual}: {old[:100]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          def regex(path: str, pattern: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              updated, actual = re.subn(pattern, new, text, count=count, flags=re.S)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} regex match, found {actual}: {pattern}")
              p.write_text(updated, encoding="utf-8")

          # AGENTS: current Job rules must match runtime facts.
          exact(
              "AGENTS.md",
              "已校验 Raw 存在时禁止再次调用 Provider；网络结果未知时不能承诺零重复计费，必须按批准策略重试并记录计费未知/潜在重复费用。Run、单内容评论和全局预算使用数据库账户与 Reservation Ledger 原子预留/结算/释放，不能只用进程内计数或先查后扣。每个真实 HTTP Attempt 强制取得 global+run 预留，评论 Operation 再取得 content_comments；应有账户缺失时关闭失败。只有同一 Attempt 的预留事务重放可以依靠唯一键复用原预留，网络重试不得复用上一 Attempt 的预留。Dispatch CAS 必须验证当前 Job Fencing，Transport 禁止在一次调用中隐藏自动网络重试；Attempt 进入 `dispatching` 后同一 Attempt 不得再次发送，崩溃恢复按计费未知保守占用预算。",
              "已校验 Raw 存在时禁止再次调用 Provider；网络结果未知时不能承诺零重复计费，必须按批准策略重试并记录计费未知/潜在重复费用。当前版本**不实现请求/金额预算、Budget Account 或 Reservation Ledger**，也不得为了预留扩展点保留 dormant Budget Service/Repository。Provider Request/Attempt 仍可保存 Billing/成本快照与潜在重复计费事实用于执行审计。Dispatch CAS 必须验证当前 Job Fencing，Transport 禁止在一次调用中隐藏自动网络重试；Attempt 进入 `dispatching` 后同一 Attempt 不得再次发送。未来若业务需要 Budget/Cost Guard，必须通过新的 L3 Change 明确 Contract、Schema、配置、Migration 和验证后再接入发送前边界。",
          )

          # Blueprint README current status.
          exact(
              "docs/blueprint/README.md",
              "- Stage 7 `20260815_0012`、`provider_requests.provider_config_id`、`provider_budget_accounts/provider_budget_reservations`、稳定 Provider Config 隔离、`global/run/run_comments/content_comments` 四层两维预算、并发原子 Reservation、Dispatch/Recovery `settled/released/unknown` 终态与账本 drift 审计；",
              "- Stage 7 历史 Revision `20260815_0012` 曾建立 Provider Budget Ledger 并为 `provider_requests` 增加稳定 `provider_config_id`；2026-08-17 用户明确撤回当前预算功能，最新向前 Migration `20260817_0015` 删除预算账户/Reservation 和 Plan `request_budget`，但保留 `provider_config_id` 与 Provider Billing/成本审计事实；未来预算能力需新的 L3 Change 重新设计；",
          )

          # Blueprint 07 cross-document decision.
          regex(
              "docs/blueprint/07-技术决策与实施门禁.md",
              r"\| Provider 费用 \|[^\n]*\|",
              "| Provider 费用与预算 | 当前保留 Provider Request/Attempt 的 Billing、成本快照和潜在重复计费审计；**不实现请求/金额预算、Budget Account 或 Reservation 硬门禁**。历史 `0012/0013` 不改写，由 `20260817_0015` 向前删除预算表和 Plan `request_budget`。未来预算/限额能力必须作为新的 L3 Change 重新批准。 |",
          )

          # Blueprint 08 top-level / routing / operation matrix.
          exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "本文冻结 Stage 7 的**采集业务决策、Provider 配置实例/平台/Operation 关系、成本控制、前端可配置能力和五平台首版 TikHub Operation 选择**。",
              "本文冻结 Stage 7 的**采集业务决策、Provider 配置实例/平台/Operation 关系、Provider 成本事实、前端可配置能力和五平台首版 TikHub Operation 选择**。当前版本不实现预算/额度功能；未来扩展方向见第 16 节。",
          )
          exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "- `provider_config_id`：稳定 UUID，供 Plan、Run Snapshot、Budget、审计引用；",
              "- `provider_config_id`：稳定 UUID，供 Plan、Run Snapshot、Provider Request 与审计引用；",
          )
          exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "同一 Provider 类型允许多个 Config。需要换 Provider 类型时创建新 Config，再显式切换平台/Plan 引用，以保持历史 Run、预算和审计稳定。",
              "同一 Provider 类型允许多个 Config。需要换 Provider 类型时创建新 Config，再显式切换平台/Plan 引用，以保持历史 Run、Provider 来源和审计稳定。",
          )
          exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "若未来某个具体 Operation 需要 fallback，必须单独批准触发条件、费用、Attempt、Raw 和 Mapper/兼容语义；每次真实发送仍是新的 Attempt 和预算预留。",
              "若未来某个具体 Operation 需要 fallback，必须单独批准触发条件、费用、Attempt、Raw 和 Mapper/兼容语义；每次真实发送仍必须创建新的 Attempt，不能复用已经进入发送边界的 Attempt。",
          )
          exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "| 快手 | `GET /api/v1/kuaishou/app/search_video_v2` | `GET /api/v1/kuaishou/app/fetch_one_video` | `GET /api/v1/kuaishou/web/fetch_one_video_comment` | `GET /api/v1/kuaishou/web/fetch_one_video_sub_comment` | **Operation/保守 `pcursor` 已实现；Mapper/Fixture/Probe 待完成** |",
              "| 快手 | `GET /api/v1/kuaishou/app/search_video_v2` | `GET /api/v1/kuaishou/app/fetch_one_video` | App `fetch_video_comment` | App `fetch_video_sub_comments` | **App 评论为正式主链；Web 仅显式已验证备用，不自动 fallback** |",
          )
          exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "同一平台可以有多个 TikHub API family，但上表每一列是第一版批准的**固定职责**，不是失败回退顺序。例如微博使用 Web 搜索、App 详情/一级评论、Web V2 二级评论，是四个不同业务 Operation 的明确选型；快手使用 App 搜索/详情和 Web 评论同理。",
              "同一平台可以有多个 TikHub API family，但上表每一列是第一版批准的**固定职责**，不是失败回退顺序。例如微博使用 Web 搜索、App 详情/一级评论、Web V2 二级评论，是四个不同业务 Operation 的明确选型；快手当前搜索、详情、一级评论和二级回复均以 App 为正式主链，Web 评论只保留显式备用证据。",
          )

          # Blueprint 08 business pipeline: no current budget configuration/gate.
          exact("docs/blueprint/08-采集策略与平台能力.md", "- 请求/费用预算；\n", "")
          exact("docs/blueprint/08-采集策略与平台能力.md", "→ BUDGET RESERVATION\n", "")
          exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "| 评论数未知 | 按 Capability 决定是否用详情补足 | 不把未知当 0；必要时最多做受预算的评论首屏探测 |",
              "| 评论数未知 | 按 Capability 决定是否用详情补足 | 不把未知当 0；必要时最多做一次受控评论首屏探测 |",
          )
          exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "8. `comment_count` 未观察到/不可靠 → 按 Capability 决定详情补足或受预算首屏探测。",
              "8. `comment_count` 未观察到/不可靠 → 按 Capability 决定详情补足或受控首屏探测。",
          )
          exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "- 真正硬停止由 Provider 末页、请求预算、费用预算、技术安全页数、取消或错误等决定。",
              "- 真正停止由 Provider 末页、已批准的业务目标、技术安全页数、取消或错误等决定；当前版本不实现预算停止条件。",
          )
          exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "- 单线程回复预算不能突破 Run 评论预算和单内容评论预算。",
              "- 二级回复继续受目标数量、Provider 末页、技术安全页数、取消和错误等停止条件约束；当前版本没有独立评论预算。",
          )
          exact("docs/blueprint/08-采集策略与平台能力.md", "budget_limit\n", "")
          exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "解析到稳定外部 ID 后，同样走正式 Operation → Budget → Raw → Mapper → Canonical → Ingestion，不允许浏览器直接调用 TikHub。",
              "解析到稳定外部 ID 后，同样走正式 Operation → Raw → Mapper → Canonical → Ingestion，不允许浏览器直接调用 TikHub。",
          )
          exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "Deep Collection 仍必须受数据库硬预算限制。Stage 8 若需要向用户展示一次操作的**聚合预计成本**，该值由后端根据计划请求量和 Pricing 结果产生；不得把 TikHub endpoint 单价表、折扣阶梯或 Pricing 配置暴露/复制到前端，也不得允许前端修改 Provider 价格。",
              "Deep Collection 当前不附加预算/额度功能，但仍必须遵守正式 Job、Provider Routing、Fencing、一次 Attempt 一次发送、Raw 与 Ingestion 边界。若未来需要 Budget/Cost Guard 或聚合预计成本，必须通过新的 L3 Change 单独设计；不得把 Provider Pricing 配置复制到前端。",
          )

          # Replace old hard-budget sections with current Billing facts + future extension only.
          regex(
              "docs/blueprint/08-采集策略与平台能力.md",
              r"## 15\. 费用预测、Provider Pricing 与硬预算\n.*?\n## 17\. Business Pipeline Probe",
              """## 15. Provider Billing 与成本事实\n\n当前系统保留 Provider Request/Attempt 的 Billing 与成本字段，用于记录一次外部调用在发送前采用的价格快照、Provider 明确返回的实际费用（若存在），以及网络结果未知时的潜在重复计费风险。这些字段属于**执行与审计事实**，不是预算额度。\n\nTikHub Pricing 继续作为 Provider Adapter 的版本化成本事实来源。它可以产生可审计的 `estimated_cost / currency / unit_price_snapshot`，但不能把本地估算值伪装成 Provider 权威账单；Pricing 不保存 Secret，也不是普通业务前端配置。\n\n当前版本没有 Plan 请求次数上限、金额上限、评论预算、Budget Account 或 Reservation Ledger，也不根据这些额度阻断网络请求。Provider Billing 的完整性要求与“预算功能”是两件不同的事情。\n\n## 16. 未来 Budget / Cost Guard 扩展方向\n\n预算功能已于 2026-08-17 由用户明确撤回。当前生产代码、当前 SQLAlchemy Schema 和 Plan Contract **不得保留 Budget Service、Budget Repository、Budget Account、Reservation Ledger、`request_budget` 或空实现接口**。历史 Migration 保持不可变，由新的向前 Migration `20260817_0015` 删除已落地预算结构。\n\n以后如果业务确实需要限额能力，必须创建新的 L3 Change，从真实业务需求重新冻结限制对象、周期、维度、超限行为、对账、迁移和 UI。候选接入位置只作为架构方向保留：\n\n```text\n已准备 Provider Attempt\n→ 可选 Budget / Cost Guard（未来独立能力）\n→ Dispatch CAS\n→ Provider Transport\n```\n\n未来 Guard 可以读取 `provider_config_id`、Run/Content/Operation 身份和 Provider Billing estimate 等稳定事实，但在新 Change 批准前不定义 Contract、Schema、默认额度或前端配置，也不在生产代码中预留空接口。\n\n## 17. Business Pipeline Probe""",
          )
          exact("docs/blueprint/08-采集策略与平台能力.md", "→ Budget Limits\n", "")
          exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "真实 Probe 通过 `provider_config_id → secret_ref` 取得凭据，并继续受 Provider Base URL allowlist、请求上限和费用上限保护。Probe 不接受原始 Secret 作为持久配置或输出字段。",
              "真实 Probe 通过 `provider_config_id → secret_ref` 取得凭据，并继续受 Provider Base URL allowlist、显式 Probe 请求上限和 Secret 边界保护。Probe 不接受原始 Secret 作为持久配置或输出字段。",
          )
          exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "真实 billable Probe 还必须先通过当前 Provider Pricing 获得目标 endpoint 的 `verified` 价格；Pricing 未核验时应在网络发送前失败，不能用全局默认价绕过预算保护。",
              "真实 billable Probe 继续使用生产 Provider Billing/Pricing 路径记录成本事实；不得为了 Probe 猜测 endpoint 价格或伪造 `actual_cost`。这属于计费事实完整性，不表示当前存在预算额度功能。",
          )
          exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "- 最终多级预算账户/Reservation Migration 与并发测试；\n",
              "",
          )

          # Kuaishou detailed section.
          regex(
              "docs/blueprint/08-采集策略与平台能力.md",
              r"### 18\.5 快手\n\n.*?\n\n详细平台规则",
              """### 18.5 快手\n\n- 当前正式主链使用 App Search V2 / Detail / 一级评论 / 二级回复；评论分页继续使用有证据的 `pcursor` 状态，不猜响应字段；\n- Web 一级/二级评论保留为 2026-08-16 已验证的显式备用方案，但 Runtime/Capability 不得因 App 失败自动 fallback；\n- 当前批准的搜索 Operation 没有排序/发布时间参数，前端不能显示不存在的原生选项；\n- 真实 Fixture/Mapper/Capability 以当前代码、测试和 endpoint ledger 为机器事实，文档不得超越它们声称兼容。\n\n详细平台规则""",
          )

          # Blueprint 03 current Schema and migration facts.
          exact(
              "docs/blueprint/03-数据库与文件存储.md",
              "provider_budget_accounts\nprovider_budget_reservations\n",
              "",
          )
          exact("docs/blueprint/03-数据库与文件存储.md", "request_budget      integer not null\n", "")
          regex(
              "docs/blueprint/03-数据库与文件存储.md",
              r"### 5\.17 Provider 预算账户与预留账本\n.*?\n### 5\.18 `artifacts`",
              """### 5.17 预算功能当前状态\n\n当前版本**不保存 Provider Budget Account 或 Reservation Ledger**。历史 Revision `20260815_0012` 曾建立 `provider_budget_accounts/provider_budget_reservations`，后续 `20260817_0015` 按用户决定向前删除这两张表，并删除 `collection_plans.request_budget`；历史 Revision 不改写。\n\n`provider_requests.provider_config_id`、Provider Request/Attempt 的 Billing/成本快照和 `potential_duplicate_charge` 继续保留，因为它们表达来源与执行审计，而不是预算额度。未来若重新引入 Budget/Cost Guard，必须通过新的 L3 Change 建立新的 Contract/Schema/Migration/测试，不能复活已删除的 Runtime 代码。\n\n### 5.18 `artifacts`""",
          )
          exact("docs/blueprint/03-数据库与文件存储.md", "provider_budget_reservations(budget_account_id, status)\n", "")
          exact(
              "docs/blueprint/03-数据库与文件存储.md",
              "短事务创建 reserved Attempt 并原子取得必需预算\n→ CAS reserved → dispatching\n→ 调用 TikHub（同一 Attempt 最多一次）\n→ Raw 落盘\n→ 短事务把 Attempt/预算记为 completed/settled，或按边界记为 not_sent/released、unknown/unknown_amount",
              "短事务创建 reserved Attempt\n→ CAS reserved → dispatching\n→ 调用 Provider（同一 Attempt 最多一次）\n→ Raw 落盘\n→ 短事务把 Attempt 记为 completed、not_sent 或 unknown",
          )
          exact(
              "docs/blueprint/03-数据库与文件存储.md",
              "创建预留、Dispatch CAS、网络调用和结果事务是明确的四个边界，不能把外部等待包进数据库事务。恢复时看到超时 `dispatching` 必须保守转 `unknown`，不得复发同一 Attempt；只有确定仍为 `reserved` 且未进入 Dispatch CAS 才能 `not_sent` 并释放。",
              "创建 Attempt、Dispatch CAS、网络调用和结果事务是明确的四个边界，不能把外部等待包进数据库事务。恢复时看到遗留 `dispatching` 必须先检查已校验 Raw；无法确定结果时保守转 `unknown`，不得复发同一 Attempt。只有明确证明未进入发送边界时才能终结为 `not_sent`。",
          )
          regex(
              "docs/blueprint/03-数据库与文件存储.md",
              r"当前 Alembic 链从 `20260813_0001` 演进到 `20260815_0012`；`0012` 以 `20260815_0011` 为直接父 Revision，为 `provider_requests` 增加兼容可空的稳定 `provider_config_id` 外键并建立 `provider_budget_accounts/provider_budget_reservations` 最终多级预算 Ledger；历史 Revision 不改写。",
              "当前 Alembic 链继续保持历史 Revision 不改写：`20260815_0012` 曾为 `provider_requests` 增加稳定 `provider_config_id` 并建立 Budget Ledger，`0013/0014` 建立 Plan/Scheduler 事实，`20260817_0015` 按用户决定向前删除预算两表和 `collection_plans.request_budget`。`provider_config_id` 与 Provider Billing/成本审计字段保留。",
          )

          # Basic postconditions: no current-hard-budget wording in key long-term facts.
          required = {
              "AGENTS.md": ["当前版本**不实现请求/金额预算"],
              "docs/blueprint/03-数据库与文件存储.md": ["### 5.17 预算功能当前状态", "20260817_0015"],
              "docs/blueprint/07-技术决策与实施门禁.md": ["当前保留 Provider Request/Attempt 的 Billing"],
              "docs/blueprint/08-采集策略与平台能力.md": ["## 16. 未来 Budget / Cost Guard 扩展方向", "App `fetch_video_comment`"],
          }
          forbidden_current = {
              "AGENTS.md": ["每个真实 HTTP Attempt 强制取得 global+run"],
              "docs/blueprint/08-采集策略与平台能力.md": ["→ BUDGET RESERVATION", "## 16. Budget Ledger 的 Stage 7 最终语义"],
          }
          for path, needles in required.items():
              text = Path(path).read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"{path}: missing postcondition {needle!r}")
          for path, needles in forbidden_current.items():
              text = Path(path).read_text(encoding="utf-8")
              for needle in needles:
                  if needle in text:
                      raise SystemExit(f"{path}: stale current-budget rule remains {needle!r}")

      - name: Verify documentation and secrets
        run: |
          python scripts/quality/check_docs.py
          python scripts/quality/scan_secrets.py
          git diff --check

      - name: Commit facts and remove this one-shot workflow
        run: |
          set -euo pipefail
          git fetch origin feature/stage7-completion
          test "$(git rev-parse origin/feature/stage7-completion)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
