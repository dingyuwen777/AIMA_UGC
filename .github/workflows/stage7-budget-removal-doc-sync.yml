name: Stage 7 Budget Removal Doc Sync

on:
  push:
    branches:
      - feature/stage7-completion
    paths:
      - .github/workflows/stage7-budget-removal-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage7-completion
          fetch-depth: 0

      - name: Apply exact documentation updates
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          def replace_regex(path: str, pattern: str, replacement: str, *, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              updated, actual = re.subn(pattern, replacement, text, flags=re.S)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} regex replacement(s), found {actual}: {pattern}")
              p.write_text(updated, encoding="utf-8")

          # AGENTS.md：删除“当前必须预算预留”的硬规则，保留 Provider Billing/Fencing/一次发送事实。
          replace_exact(
              "AGENTS.md",
              "已校验 Raw 存在时禁止再次调用 Provider；网络结果未知时不能承诺零重复计费，必须按批准策略重试并记录计费未知/潜在重复费用。Run、单内容评论和全局预算使用数据库账户与 Reservation Ledger 原子预留/结算/释放，不能只用进程内计数或先查后扣。每个真实 HTTP Attempt 强制取得 global+run 预留，评论 Operation 再取得 content_comments；应有账户缺失时关闭失败。只有同一 Attempt 的预留事务重放可以依靠唯一键复用原预留，网络重试不得复用上一 Attempt 的预留。Dispatch CAS 必须验证当前 Job Fencing，Transport 禁止在一次调用中隐藏自动网络重试；Attempt 进入 `dispatching` 后同一 Attempt 不得再次发送，崩溃恢复按计费未知保守占用预算。",
              "已校验 Raw 存在时禁止再次调用 Provider；网络结果未知时不能承诺零重复计费，必须按批准策略重试并记录计费未知/潜在重复费用。当前版本**不实现请求/金额预算、额度账户或 Reservation Ledger**，也不得为了预留扩展点保留 dormant Budget Service/Repository。Provider Request/Attempt 仍可保存 Billing/成本快照和潜在重复计费事实用于执行审计。Dispatch CAS 必须验证当前 Job Fencing，Transport 禁止在一次调用中隐藏自动网络重试；Attempt 进入 `dispatching` 后同一 Attempt 不得再次发送。未来若业务需要 Budget/Cost Guard，必须通过新的 L3 Change 明确 Contract、Schema、配置、迁移和验证后再接入发送前边界。",
          )

          # Blueprint README：当前状态不再把 Budget Ledger 作为现行能力。
          replace_exact(
              "docs/blueprint/README.md",
              "Stage 7 `20260815_0012`、`provider_requests.provider_config_id`、`provider_budget_accounts/provider_budget_reservations`、稳定 Provider Config 隔离、`global/run/run_comments/content_comments` 四层两维预算、并发原子 Reservation、Dispatch/Recovery `settled/released/unknown` 终态与账本 drift 审计；",
              "Stage 7 历史 Revision `20260815_0012` 曾建立 Provider Budget Ledger 并为 `provider_requests` 增加稳定 `provider_config_id`；2026-08-17 用户明确撤回当前预算功能，最新向前 Migration 删除预算账户/Reservation 和 Plan `request_budget`，但保留 `provider_config_id` 与 Provider Billing/成本审计事实；未来预算能力需新的 L3 Change 重新设计；",
          )

          # Blueprint 07：跨文档唯一决定改为“当前无预算功能”。
          replace_regex(
              "docs/blueprint/07-技术决策与实施门禁.md",
              r"\| Provider 费用 \|.*?\|\n",
              "| Provider 费用与预算 | 当前保留 Provider Request/Attempt 的 Billing、成本快照和潜在重复计费审计；**不实现请求/金额预算、Budget Account 或 Reservation 硬门禁**。历史 `0012` 不改写，由最新向前 Migration 删除预算表和 Plan `request_budget`。未来预算/限额能力必须作为新的 L3 Change 重新批准并接入发送前边界。 |\n",
          )

          # Blueprint 08：当前业务语义不再出现预算配置/硬门禁；同时纠正快手 App 评论主链。
          replace_exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "本文冻结 Stage 7 的**采集业务决策、Provider 配置实例/平台/Operation 关系、成本控制、前端可配置能力和五平台首版 TikHub Operation 选择**。",
              "本文冻结 Stage 7 的**采集业务决策、Provider 配置实例/平台/Operation 关系、Provider 成本事实、前端可配置能力和五平台首版 TikHub Operation 选择**。当前版本不实现预算/额度功能；未来扩展边界见第 15—16 节。",
          )
          replace_regex(
              "docs/blueprint/08-采集策略与平台能力.md",
              r"\| 快手 \| `GET /api/v1/kuaishou/app/search_video_v2` \| `GET /api/v1/kuaishou/app/fetch_one_video` \|.*?\|.*?\| \*\*Operation/保守 `pcursor` 已实现；Mapper/Fixture/Probe 待完成\*\* \|",
              "| 快手 | `GET /api/v1/kuaishou/app/search_video_v2` | `GET /api/v1/kuaishou/app/fetch_one_video` | App `fetch_video_comment` | App `fetch_video_sub_comments` | **App 评论为正式主链；Web 仅显式已验证备用，不自动 fallback** |",
          )
          replace_exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "- 请求/费用预算；\n",
              "",
          )
          replace_exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "→ BUDGET RESERVATION\n",
              "",
          )
          replace_exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "- 真正硬停止由 Provider 末页、请求预算、费用预算、技术安全页数、取消或错误等决定。",
              "- 真正停止由 Provider 末页、已批准的业务目标、技术安全页数、取消或错误等决定；当前版本不实现预算停止条件。",
          )
          replace_exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "- 单线程回复预算不能突破 Run 评论预算和单内容评论预算。",
              "- 二级回复继续受已批准的目标数量、Provider 末页、技术安全页数、取消和错误等停止条件约束；当前版本没有独立评论预算。",
          )
          replace_exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "Deep Collection 仍必须受数据库硬预算限制。Stage 8 若需要向用户展示一次操作的**聚合预计成本**，该值由后端根据计划请求量和 Pricing 结果产生；不得把 TikHub endpoint 单价表、折扣阶梯或 Pricing 配置暴露/复制到前端，也不得允许前端修改 Provider 价格。",
              "Deep Collection 当前不附加预算/额度功能，但仍必须遵守正式 Job、Provider Routing、Fencing、一次 Attempt 一次发送、Raw 和 Ingestion 边界。若未来需要成本 Guard 或聚合预计成本，必须通过新的 L3 Change 单独设计；不得把 Provider Pricing 配置复制到前端。",
          )
          replace_regex(
              "docs/blueprint/08-采集策略与平台能力.md",
              r"## 15\. 费用预测、Provider Pricing 与硬预算\n.*?## 17\. Business Pipeline Probe",
              """## 15. Provider Billing 与成本事实\n\n当前系统保留 Provider Request/Attempt 的 Billing 与成本字段，用于记录一次外部调用在发送前采用的价格快照、Provider 明确返回的实际费用（若存在）以及网络结果未知时的潜在重复计费风险。这些字段属于**执行与审计事实**，不是预算额度。\n\nTikHub Pricing 继续作为 Provider Adapter 的版本化事实来源，用于需要时产生可审计的 `estimated_cost / currency / unit_price_snapshot`；不能把本地估算值伪装成 Provider 权威账单。Pricing 不保存 Secret，也不作为普通业务前端配置。\n\n当前版本不根据这些金额阻断请求，也没有 Plan 金额上限、请求次数上限或评论预算。\n\n## 16. 未来 Budget / Cost Guard 扩展方向\n\n预算功能已于 2026-08-17 由用户明确撤回。当前生产代码、当前 SQLAlchemy Schema 和 Plan Contract **不得保留 Budget Service、Budget Repository、Budget Account、Reservation Ledger、`request_budget` 或空实现接口**。历史 Migration 保持不可变，由新的向前 Migration 删除已落地预算结构。\n\n以后如果业务确实需要限额能力，应创建新的 L3 Change，并从业务需求重新冻结“限制对象、周期、维度、超限行为、对账、迁移和 UI”。候选接入位置仅作为架构方向保留：\n\n```text\n已准备 Provider Attempt\n→ 可选 Budget / Cost Guard（未来独立能力）\n→ Dispatch CAS\n→ Provider Transport\n```\n\n未来 Guard 可以消费 `provider_config_id`、Run/Content/Operation 身份和 Provider Billing estimate 等稳定事实，但在新 Change 批准前不定义 Contract、Schema、默认额度或前端配置。\n\n## 17. Business Pipeline Probe""",
          )
          replace_exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "→ Budget Limits\n",
              "",
          )
          replace_exact(
              "docs/blueprint/08-采集策略与平台能力.md",
              "- 最终多级预算账户/Reservation Migration 与并发测试；\n",
              "",
          )
          replace_regex(
              "docs/blueprint/08-采集策略与平台能力.md",
              r"### 18\.5 快手\n\n- 当前 `main` 已完成 `aima_ugc\.adapters\.providers\.tikhub\.operations\.kuaishou` 的 App Search V2 / Detail \+ Web 一级/二级评论请求构造与保守 `pcursor` 状态；.*?\n- Mapper、合法脱敏非空真实 Fixture、Real Probe、Capability/Registry 仍未闭环，不能因为 Operation 已进入 `main` 就宣称快手平台兼容完成。",
              """### 18.5 快手\n\n- 当前正式主链使用 App Search V2 / Detail / 一级评论 / 二级回复；评论分页继续使用有证据的 `pcursor` 状态，不猜响应字段；\n- Web 一级/二级评论保留为 2026-08-16 已验证的显式备用方案，但 Runtime/Capability 不得因 App 失败自动 fallback；\n- 当前批准的搜索 Operation 没有排序/发布时间参数，前端不能显示不存在的原生选项；\n- 真实 Fixture/Mapper/Capability 以当前代码、测试和 endpoint ledger 为机器事实，文档不得超越它们声称兼容。""",
          )

          # Blueprint 03：当前 Schema 去掉 request_budget/Budget Ledger，历史迁移仍可追溯。
          replace_exact(
              "docs/blueprint/03-数据库与文件存储.md",
              "provider_budget_accounts\nprovider_budget_reservations\n",
              "",
          )
          replace_exact(
              "docs/blueprint/03-数据库与文件存储.md",
              "request_budget      integer not null\n",
              "",
          )
          replace_regex(
              "docs/blueprint/03-数据库与文件存储.md",
              r"### 5\.17 `provider_budget_accounts` 与预留账本\n.*?### 5\.18 `artifacts`",
              """### 5.17 预算功能当前状态\n\n当前版本**不保存 Provider Budget Account 或 Reservation Ledger**。历史 Revision `20260815_0012` 曾建立 `provider_budget_accounts/provider_budget_reservations`，后续 `20260817_0015` 按用户决定向前删除这两张表，并删除 `collection_plans.request_budget`；历史 Revision 不改写。\n\n`provider_requests.provider_config_id`、Provider Request/Attempt 的 Billing/成本快照和 `potential_duplicate_charge` 继续保留，因为它们表达来源与执行审计，而不是预算额度。未来若重新引入 Budget/Cost Guard，必须通过新的 L3 Change 建立新的 Contract/Schema/Migration/测试，不能复活已删除的 Runtime 代码。\n\n### 5.18 `artifacts`""",
          )
          replace_exact(
              "docs/blueprint/03-数据库与文件存储.md",
              "provider_budget_reservations(budget_account_id, status)\n",
              "",
          )
          replace_exact(
              "docs/blueprint/03-数据库与文件存储.md",
              "短事务创建 reserved Attempt 并原子取得必需预算\n→ CAS reserved → dispatching\n→ 调用 TikHub（同一 Attempt 最多一次）\n→ Raw 落盘\n→ 短事务把 Attempt/预算记为 completed/settled，或按边界记为 not_sent/released、unknown/unknown_amount",
              "短事务创建 reserved Attempt\n→ CAS reserved → dispatching\n→ 调用 Provider（同一 Attempt 最多一次）\n→ Raw 落盘\n→ 短事务把 Attempt 记为 completed、not_sent 或 unknown",
          )
          replace_regex(
              "docs/blueprint/03-数据库与文件存储.md",
              r"创建预留、Dispatch CAS、网络调用和结果事务是明确的四个边界，不能把外部等待包进数据库事务。恢复时看到超时 `dispatching` 必须保守转 `unknown`，不得复发同一 Attempt；只有确定仍为 `reserved` 且未进入 Dispatch CAS 才能 `not_sent` 并释放。",
              "创建 Attempt、Dispatch CAS、网络调用和结果事务是明确的四个边界，不能把外部等待包进数据库事务。恢复时看到遗留 `dispatching` 必须先检查已校验 Raw；无法确定结果时保守转 `unknown`，不得复发同一 Attempt。只有明确证明未进入发送边界时才能终结为 `not_sent`。",
          )
          replace_regex(
              "docs/blueprint/03-数据库与文件存储.md",
              r"当前 Alembic 链从 `20260813_0001` 演进到 `20260815_0012`；`0012` 以 `20260815_0011` 为直接父 Revision，为 `provider_requests` 增加兼容可空的稳定 `provider_config_id` 外键并建立 `provider_budget_accounts/provider_budget_reservations` 最终多级预算 Ledger；历史 Revision 不改写。",
              "当前 Alembic 链继续保持历史 Revision 不改写：`20260815_0012` 曾为 `provider_requests` 增加稳定 `provider_config_id` 并建立 Budget Ledger，`0013/0014` 建立 Plan/Scheduler 事实，`20260817_0015` 按用户决定向前删除预算两表和 `collection_plans.request_budget`。`provider_config_id` 与 Provider Billing/成本审计字段保留。",
          )

          # Collection README 的通用描述不能再把预算当当前链路硬门禁。
          for path in ["docs/collection/README.md", "backend/src/aima_ugc/modules/collection/README.md"]:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              text = text.replace("Pricing/Budget", "Pricing/Cost facts")
              text = text.replace("Pricing / Budget", "Pricing / Cost facts")
              text = text.replace("Budget → ", "")
              text = text.replace("→ Budget", "")
              text = text.replace("预算硬门禁", "未来可选 Budget/Cost Guard（当前未实现）")
              p.write_text(text, encoding="utf-8")

          # 历史 Migration 文件不修改；当前文档不得引用已删除 runtime module 作为现行入口。
          checks = {
              "AGENTS.md": ["当前版本**不实现请求/金额预算"],
              "docs/blueprint/08-采集策略与平台能力.md": ["预算功能已于 2026-08-17 由用户明确撤回", "App `fetch_video_comment`"],
              "docs/blueprint/03-数据库与文件存储.md": ["当前版本**不保存 Provider Budget Account", "20260817_0015"],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"{path}: missing expected postcondition: {needle}")

      - name: Verify docs
        run: |
          python scripts/quality/check_docs.py
          python scripts/quality/scan_secrets.py

      - name: Commit synchronized facts and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage7-budget-removal-doc-sync.yml
          git add AGENTS.md docs/blueprint/README.md docs/blueprint/03-数据库与文件存储.md docs/blueprint/07-技术决策与实施门禁.md docs/blueprint/08-采集策略与平台能力.md docs/collection/README.md backend/src/aima_ugc/modules/collection/README.md
          git diff --cached --check
          git commit -m "同步预算功能回撤长期设计事实"
          git push origin HEAD:feature/stage7-completion
