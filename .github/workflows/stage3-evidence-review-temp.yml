name: Stage 3 Temporary Evidence Review

on:
  push:
    branches:
      - feature/stage3-excel-brand-vehicle-filter
    paths:
      - .github/workflows/stage3-evidence-review-temp.yml
      - .github/stage3_evidence_review_patch.py

permissions:
  contents: write

jobs:
  add-and-verify-evidence-regressions:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/stage3-evidence-review/data
      AIMA_LOG_DIR: .runtime/stage3-evidence-review/logs
      AIMA_SECRET_DIR: .runtime/stage3-evidence-review/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage3-excel-brand-vehicle-filter
          fetch-depth: 0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Prepare isolated PostgreSQL runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'ci-postgres' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check

      - name: Add Stage 3 persistence evidence regressions
        shell: bash
        run: |
          set -euo pipefail
          python .github/stage3_evidence_review_patch.py

      - name: Format and statically verify focused tests
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=(
            tests/integration/ingestion/test_stage8b_import_http_worker.py
            tests/integration/ingestion/test_stage12_historical_campaign_worker.py
          )
          uv run ruff check --fix "${TARGETS[@]}"
          uv run ruff format "${TARGETS[@]}"
          uv run ruff check "${TARGETS[@]}"
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          for target in "${TARGETS[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "${target}"
          done

      - name: Run focused Stage 3 PostgreSQL integration modules
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest \
            tests/integration/ingestion/test_stage8b_import_http_worker.py \
            tests/integration/ingestion/test_stage12_historical_campaign_worker.py \
            -q

      - name: Commit only after green verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AIMA Stage 3 Review"
          git config user.email "aima-stage3-review@users.noreply.github.com"
          git add -- \
            tests/integration/ingestion/test_stage8b_import_http_worker.py \
            tests/integration/ingestion/test_stage12_historical_campaign_worker.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "测试：补齐 Stage 3 冻结目录与人工证据回归"
          git push origin HEAD:feature/stage3-excel-brand-vehicle-filter
