name: Runtime Config Finalize (Temporary)

on:
  push:
    branches:
      - feat/runtime-config-control-plane
    paths:
      - scripts/dev/runtime_config_finalize.py
      - scripts/dev/runtime_config_finalize_fix.py
      - .github/workflows/runtime-config-finalize.yml

permissions:
  contents: write

concurrency:
  group: runtime-config-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feat/runtime-config-control-plane
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frozen environments
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'uv==0.12.3'
          uv sync --frozen
          npm ci --prefix frontend

      - name: Finalize implementation and generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dev/runtime_config_finalize_fix.py
          uv run python scripts/dev/runtime_config_finalize.py
          uv run python scripts/contracts/generate.py --check
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
          npm --prefix frontend run build
          uv run pytest tests/unit/system/test_runtime_provider_config.py -q
          docker compose config >/dev/null
          docker compose -f compose.yaml -f compose.windows.yaml config >/dev/null

      - name: Commit final implementation and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/dev/runtime_config_finalize.py scripts/dev/runtime_config_finalize_fix.py .github/workflows/runtime-config-finalize.yml
          git config user.name 'aima-runtime-finalizer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(runtime): complete provider configuration control plane'
          git push origin HEAD:feat/runtime-config-control-plane
