name: Platform Contract Regenerate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'refactor/unify-platform-identifiers'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refactor/unify-platform-identifiers
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.12.3'
          uv lock --check
          uv sync --locked
      - name: Generate contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          git diff --check
      - name: Commit generated contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Generated contracts already synchronized.'
          else
            git commit -m '同步五平台统一 Contract 生成物'
            git push origin HEAD:refactor/unify-platform-identifiers
          fi
