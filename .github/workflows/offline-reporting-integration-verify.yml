name: Offline Reporting Integration Verify
# 显式触发模板迁移后的完整主分支集成验证。

on:
  push:
    branches:
      - feature/offline-reporting
    paths-ignore:
      - changes/active/CHG-20260820-offline-reporting/verification_evidence.json

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install locked uv
        id: install_uv
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          test "$(uv --version | awk '{print $2}')" = "${UV_VERSION}"

      - name: Verify locked environment
        id: locked_env
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked
          uv run python -c "import aima_ugc"

      - name: Target reporting and preserved imports tests
        id: target
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest \
            tests/unit/platform/test_reporting_default_template.py \
            tests/unit/platform/test_offline_reporting.py \
            tests/unit/platform/test_imports_test_reporting.py \
            tests/unit/platform/test_docx_package_structure.py \
            tests/unit/collection/test_p1g_imports_run_all.py \
            tests/unit/collection/test_imports_test_run_directory.py -q \
            2>&1 | tee /tmp/target-tests.txt

      - name: Repository static and quality gates
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/static.txt
          uv run ruff format --check backend tests scripts 2>&1 | tee -a /tmp/static.txt
          uv run ruff check backend tests scripts 2>&1 | tee -a /tmp/static.txt
          uv run mypy backend/src 2>&1 | tee -a /tmp/static.txt
          uv run python scripts/quality/check_architecture.py 2>&1 | tee -a /tmp/static.txt
          uv run python scripts/quality/check_table_ownership.py 2>&1 | tee -a /tmp/static.txt
          uv run python scripts/quality/check_docs.py 2>&1 | tee -a /tmp/static.txt
          uv run python scripts/quality/scan_secrets.py 2>&1 | tee -a /tmp/static.txt

      - name: Full unit tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/unit -q 2>&1 | tee /tmp/unit-tests.txt

      - name: Build and verify installed Wheel template
        id: wheel
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/wheel.txt
          rm -rf dist /tmp/aima-report-wheel-venv
          uv build --wheel 2>&1 | tee -a /tmp/wheel.txt
          python -m venv /tmp/aima-report-wheel-venv
          /tmp/aima-report-wheel-venv/bin/python -m pip install dist/*.whl 2>&1 | tee -a /tmp/wheel.txt
          /tmp/aima-report-wheel-venv/bin/python - <<'PY' 2>&1 | tee -a /tmp/wheel.txt
          from aima_ugc.platform.reporting import DEFAULT_REPORT_TEMPLATE_PATH

          print(f"installed_template={DEFAULT_REPORT_TEMPLATE_PATH}")
          if DEFAULT_REPORT_TEMPLATE_PATH.name != "report_template.md":
              raise SystemExit("默认报告模板文件名错误")
          if not DEFAULT_REPORT_TEMPLATE_PATH.is_file():
              raise SystemExit("Wheel 安装后缺少共享 report_template.md")
          text = DEFAULT_REPORT_TEMPLATE_PATH.read_text(encoding="utf-8")
          if "{{OVERVIEW_TABLE}}" not in text or "{{PLATFORM_PIE_CHART}}" not in text:
              raise SystemExit("Wheel 中共享报告模板内容不完整")
          PY

      - name: Verify latest main capabilities remain in imports entry
        id: compatibility
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run python - <<'PY' 2>&1 | tee /tmp/compatibility.txt
          import inspect
          from aima_ugc.adapters.providers.imports_test import test as entry

          required = (
              "convert",
              "filter_keywords",
              "deduplicate",
              "ingest_database",
              "label_sentiment",
              "recalculate_cost",
              "export_labeled_excel",
              "generate_report",
              "run_all",
          )
          missing = [name for name in required if not hasattr(entry, name)]
          if missing:
              raise SystemExit(f"imports_test 丢失已有/新增入口: {missing}")
          if "report_excel_path" not in inspect.signature(entry.run_all).parameters:
              raise SystemExit("run_all 缺少报告输入覆盖参数")
          if not hasattr(entry, "INPUT_XLSX_FILES"):
              raise SystemExit("INPUT_XLSX_FILES 被错误裁剪")
          source = inspect.getsource(entry)
          required_markers = (
              "ExcelBatchConversionSummary",
              "convert_excel_files_to_canonical_jsonl",
              "LLMRequestAuditWriter",
              "load_llm_pricing",
              "recalculate_llm_request_costs",
              "ingest_excel_files_run_to_postgres",
              "label_sentiment(run_dir=run_dir)",
              "export_labeled_excel(run_dir=run_dir)",
              "generate_report(",
          )
          missing_markers = [marker for marker in required_markers if marker not in source]
          if missing_markers:
              raise SystemExit(f"最新 main 能力标记被错误裁剪: {missing_markers}")
          print("imports_test 最新 main 能力与报告接线并存检查通过")
          PY

      - name: Render generated DOCX with LibreOffice
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/render.txt
          sudo apt-get update -qq 2>&1 | tee -a /tmp/render.txt
          sudo apt-get install -y --no-install-recommends libreoffice-writer 2>&1 | tee -a /tmp/render.txt >/dev/null
          rm -rf /tmp/aima-report-final
          mkdir -p /tmp/aima-report-final
          uv run python - <<'PY' 2>&1 | tee -a /tmp/render.txt
          from pathlib import Path
          from openpyxl import Workbook
          from aima_ugc.platform.reporting import DEFAULT_REPORT_TEMPLATE_PATH, generate_excel_report

          root = Path('/tmp/aima-report-final')
          excel = root / 'labeled_data.xlsx'
          wb = Workbook()
          content = wb.active
          content.title = '内容'
          content.append(['平台','标题','正文','作者','发布时间','内容链接','命中关键词','情感标签','一级标签','二级标签'])
          content.append(['抖音','样例1','正文','作者A','2026-08-20 10:00:00','https://example.com/1','爱玛','正面','品牌评价','口碑与信任'])
          content.append(['小红书','样例2','正文','作者B','2026-08-19 11:00:00','https://example.com/2','爱玛；马赫','负面','售后服务','客服与服务态度'])
          labels = wb.create_sheet('标签明细')
          labels.append(['内容ID','平台','标题','情感标签','一级标签','二级标签','内容链接'])
          labels.append(['1','抖音','样例1','正面','品牌评价','口碑与信任','https://example.com/1'])
          labels.append(['2','小红书','样例2','负面','售后服务','客服与服务态度','https://example.com/2'])
          comments = wb.create_sheet('评论')
          comments.append(['平台','内容ID','评论层级','评论ID','根评论ID','父评论ID','作者','评论内容','评论时间','评论点赞','回复数','来源Provider','Raw/来源定位'])
          wb.save(excel)
          wb.close()
          summary = generate_excel_report(input_path=excel, output_dir=root / 'reports')
          print(f"template={DEFAULT_REPORT_TEMPLATE_PATH}")
          print(f"markdown={summary.markdown_path}")
          print(f"word={summary.word_path}")
          print(f"charts={summary.word_chart_count}")
          if summary.template_path != DEFAULT_REPORT_TEMPLATE_PATH:
              raise SystemExit("报告未使用共享默认模板")
          if summary.word_chart_count != 9:
              raise SystemExit(f"预期 9 张图表，实际 {summary.word_chart_count}")
          PY
          test -s /tmp/aima-report-final/reports/report.md
          test -s /tmp/aima-report-final/reports/report.docx
          mkdir -p /tmp/aima-report-final/rendered
          libreoffice --headless --convert-to pdf --outdir /tmp/aima-report-final/rendered /tmp/aima-report-final/reports/report.docx 2>&1 | tee -a /tmp/render.txt
          test -s /tmp/aima-report-final/rendered/report.pdf
          stat --printf='%s\n' /tmp/aima-report-final/rendered/report.pdf > /tmp/report-pdf-size.txt

      - name: Record integration verification evidence
        if: always()
        shell: bash
        env:
          INSTALL_UV: ${{ steps.install_uv.outcome }}
          LOCKED_ENV: ${{ steps.locked_env.outcome }}
          TARGET: ${{ steps.target.outcome }}
          STATIC: ${{ steps.static.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          WHEEL: ${{ steps.wheel.outcome }}
          COMPATIBILITY: ${{ steps.compatibility.outcome }}
          RENDER: ${{ steps.render.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          def tail(path: str, count: int) -> list[str]:
              item = Path(path)
              if not item.is_file():
                  return []
              return item.read_text(encoding='utf-8', errors='replace').splitlines()[-count:]

          checks = {
              'install_uv': os.environ['INSTALL_UV'],
              'locked_environment': os.environ['LOCKED_ENV'],
              'target_reporting_tests': os.environ['TARGET'],
              'repository_static_checks': os.environ['STATIC'],
              'full_unit_tests': os.environ['UNIT'],
              'wheel_and_shared_template': os.environ['WHEEL'],
              'preserved_main_capabilities': os.environ['COMPATIBILITY'],
              'libreoffice_docx_render': os.environ['RENDER'],
          }
          result = 'success' if all(value == 'success' for value in checks.values()) else 'failure'
          pdf_size_file = Path('/tmp/report-pdf-size.txt')
          payload = {
              'schema_version': 'offline-reporting-verification.v2',
              'tested_sha': os.environ['GITHUB_SHA'],
              'runner_os': os.environ.get('RUNNER_OS'),
              'verified_at': datetime.now(UTC).isoformat(),
              'result': result,
              'checks': checks,
              'target_tests_tail': tail('/tmp/target-tests.txt', 12),
              'static_checks_tail': tail('/tmp/static.txt', 24),
              'unit_tests_tail': tail('/tmp/unit-tests.txt', 10),
              'wheel_tail': tail('/tmp/wheel.txt', 12),
              'compatibility_tail': tail('/tmp/compatibility.txt', 8),
              'render_tail': tail('/tmp/render.txt', 16),
              'rendered_pdf_bytes': int(pdf_size_file.read_text().strip()) if pdf_size_file.is_file() else None,
          }
          path = Path('changes/active/CHG-20260820-offline-reporting/verification_evidence.json')
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- changes/active/CHG-20260820-offline-reporting/verification_evidence.json
          git commit -m '验证：记录离线报告主分支集成门禁结果 [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          test "$INSTALL_UV" = "success"
          test "$LOCKED_ENV" = "success"
          test "$TARGET" = "success"
          test "$STATIC" = "success"
          test "$UNIT" = "success"
          test "$WHEEL" = "success"
          test "$COMPATIBILITY" = "success"
          test "$RENDER" = "success"
