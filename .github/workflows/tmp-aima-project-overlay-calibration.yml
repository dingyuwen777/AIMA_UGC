name: Temporary AIMA Project Overlay Calibration

on:
  push:
    branches:
      - chore/agent-skills-runtime-alignment

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/agent-skills-runtime-alignment
          fetch-depth: 0
      - name: Calibrate project-owned Overlay
        run: python changes/active/CHG-20260901-agent-skills-runtime-alignment/patch_project_overlay.py
      - name: Verify project governance
        run: |
          git diff --check
          python scripts/quality/check_agent_governance.py
          uv run pytest tests/unit/test_agent_governance.py -q
      - name: Commit project-owned governance text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md
          git commit -m "校准AIMA项目自有治理Overlay"
          git push origin HEAD:chore/agent-skills-runtime-alignment
