name: Temporary review fix comments v2

on:
  push:
    branches:
      - fix/310-frontend-fullstack-audit

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/310-frontend-fullstack-audit
          fetch-depth: 0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply and verify review fixes
        run: |
          set -euo pipefail
          python scripts/tmp_review_fix_comments.py
          git diff --check
          npm ci --prefix frontend
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run test -- --run
      - name: Commit review fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/identity/store.ts frontend/src/features/import-batches/store.ts frontend/src/features/voice-plaza/store.ts
          git commit -m "fix: 补齐审计修复函数说明" -m "Requirement-Source: #310"
          git push origin HEAD:fix/310-frontend-fullstack-audit
