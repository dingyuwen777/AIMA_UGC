name: Bootstrap Stage 3A review cleanup

on:
  push:
    branches:
      - migration/stage3a-database-foundation

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Remove one-time review workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/bootstrap-stage3a-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "移除 Stage 3A Review 临时工作流"
          git push origin "HEAD:${GITHUB_REF_NAME}"
