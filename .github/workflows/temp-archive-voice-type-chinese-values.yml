name: Temporary Archive Voice Type Chinese Values Change

on:
  push:
    branches:
      - docs/archive-voice-type-chinese-values-change

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Archive completed Change with final delivery evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('changes/active/CHG-20260828-voice-type-chinese-values/CHANGE.md')
          target = Path('changes/archive/2026-08/CHG-20260828-voice-type-chinese-values/CHANGE.md')
          text = source.read_text(encoding='utf-8')

          if 'status: ready_for_review' not in text:
              raise SystemExit('Active Change 不是 ready_for_review')
          text = text.replace('status: ready_for_review', 'status: done', 1)

          old_r5 = '| R5 | 正常推送并合并 `main`，不绕过仓库门禁 | user:2026-08-28-推送主分支 | explicitly_deferred | Draft PR #263 已建立；实际 Ready、squash merge、main push CI 必须在本 Change Ready Gate 与同一 Ready HEAD 全部永久 CI 成功后执行，并在独立归档 PR 中补最终证据 |'
          new_r5 = '| R5 | 正常推送并合并 `main`，不绕过仓库门禁 | user:2026-08-28-推送主分支 | satisfied | PR #263 在 Ready HEAD `666d5b04a52a75e32096b43d816fa2ee05947899` 五个永久门禁全绿后转 Ready 并 squash merge；merge/main SHA `605c5fc88eec1e9706fcf73061dac82611d31cde`；合并后 main 的 Change Gate/CI/Runtime/Full-stack/Tooling 全部 success |'
          if old_r5 not in text:
              raise SystemExit('R5 延期行未找到')
          text = text.replace(old_r5, new_r5, 1)

          old_unresolved = 'R1-R4 `satisfied`，实现范围 `not_satisfied` 清零；R5 的延期仅用于遵守 Ready→merge→main 验证顺序。'
          new_unresolved = 'R1-R5 均已取得实现、Ready、merge 与 main push CI 证据并处于 `satisfied`；`not_satisfied` 与 `explicitly_deferred` 均已清零。'
          if old_unresolved not in text:
              raise SystemExit('Completion Audit 旧延期说明未找到')
          text = text.replace(old_unresolved, new_unresolved, 1)

          text = text.replace(
              '- [ ] 当前 Ready HEAD 的 Change Gate / CI / Runtime / Full-stack / Tooling 全绿。',
              '- [x] 最终 Ready HEAD `666d5b04a52a75e32096b43d816fa2ee05947899` 的 Change Gate / CI / Runtime / Full-stack / Tooling 全绿。',
              1,
          )
          text = text.replace(
              '- [ ] PR #263 转 Ready 后使用 expected HEAD 正常 squash merge `main`，验证 main push CI。',
              '- [x] PR #263 使用 expected HEAD 正常 squash merge `main`，并完成 main push CI 验证。',
              1,
          )
          text = text.replace(
              '- [ ] 独立 docs-only PR 归档 Change。',
              '- [x] 使用独立 docs-only PR 归档 Change。',
              1,
          )

          text += '''\n\n# 最终合并与主分支证据\n\n- 实现 PR：#263 `调整：发声类型直接使用中文业务机器值`。\n- 最终 Ready HEAD：`666d5b04a52a75e32096b43d816fa2ee05947899`。\n- Ready HEAD 永久门禁：Change Completion Gate `33161031608`、CI `33161031614`、Runtime Acceptance `33161031652`、Full-stack Acceptance `33161031617`、Developer Tooling Compatibility `33161031647`，全部 completed/success。\n- squash merge / main SHA：`605c5fc88eec1e9706fcf73061dac82611d31cde`。\n- merge 后 main push：Change Completion Gate `33161408025`、CI `33161408063`、Runtime Acceptance `33161408039`、Full-stack Acceptance `33161408076`、Developer Tooling Compatibility `33161408070`，全部 success。\n- 本任务未执行生产部署、历史数据库值迁移/backfill 或历史 AI 批量重打标。\n'''

          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(text, encoding='utf-8')
          source.unlink()
          PY
      - name: Commit archive and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-archive-voice-type-chinese-values.yml
          git add changes/active changes/archive
          git commit -m "文档：归档发声类型中文机器值 Change"
          git push origin HEAD:docs/archive-voice-type-chinese-values-change
