name: Export Corrective Change

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/export-corrective-change.yml"

permissions:
  contents: read

jobs:
  export:
    name: Export current Change
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Upload Change
        uses: actions/upload-artifact@v4.6.2
        with:
          name: corrective-change
          path: changes/active/CHG-20260818-stage1-stage7-comprehensive-corrective/CHANGE.md
          if-no-files-found: error
          retention-days: 1
