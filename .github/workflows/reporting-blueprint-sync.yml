name: Reporting Blueprint Sync

on:
  push:
    branches:
      - feature/executive-editable-report
    paths:
      - changes/active/CHG-20260820-executive-editable-report/patch_blueprint13.py

permissions:
  contents: write

jobs:
  sync-blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/executive-editable-report
      - name: Apply Blueprint 13 decision
        run: python changes/active/CHG-20260820-executive-editable-report/patch_blueprint13.py
      - name: Commit Blueprint 13
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/blueprint/13-统一数据Excel导出与调试复用.md
          git diff --cached --quiet && exit 0
          git commit -m "同步管理层报告与可编辑图表蓝图"
          git push origin HEAD:feature/executive-editable-report
