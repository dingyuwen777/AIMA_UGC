name: Stage 7 Plan Occurrence Run Snapshot

on:
  push:
    branches:
      - main
      - feature/stage7-plan-occurrence-run-snapshot
  pull_request:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/modules/collection/**"
      - "backend/src/aima_ugc/adapters/persistence/postgres/**"
      - "backend/src/aima_ugc/modules/system/**"
      - "backend/src/aima_ugc/platform/jobs/**"
      - "backend/src/aima_ugc/database_schema.py"
      - "migrations/versions/20260815_0013_stage7_plan_occurrence_run_snapshot.py"
      - "tests/unit/collection/test_collection_planning.py"
      - "tests/unit/collection/test_collection_execution.py"
      - "tests/integration/collection/test_collection_planning_repository.py"
      - "tests/integration/collection/test_collection_repository.py"
      - "docs/blueprint/03-数据库与文件存储.md"
      - "docs/blueprint/06-开发约束与分阶段实施.md"
      - "docs/blueprint/README.md"
      - "docs/collection/README.md"
      - "backend/src/aima_ugc/modules/collection/README.md"
      - "changes/**"
      - ".github/workflows/stage7-plan-occurrence-run-snapshot.yml"

permissions:
  contents: read

jobs:
  unit:
    name: Stage 7 Plan Unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Run Plan domain tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest \
            tests/unit/collection/test_collection_planning.py \
            tests/unit/collection/test_collection_execution.py \
            -q

  postgres:
    name: Stage 7 Plan PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: stage7-plan-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/ci-stage7-plan/data
      AIMA_LOG_DIR: .runtime/ci-stage7-plan/logs
      AIMA_SECRET_DIR: .runtime/ci-stage7-plan/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Prepare PostgreSQL Secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'stage7-plan-ci' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"
      - name: Upgrade database and verify Plan parent facts
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
          uv run pytest \
            tests/integration/collection/test_collection_planning_repository.py \
            tests/integration/collection/test_collection_repository.py \
            -q
      - name: Verify previous formal revision to head
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade 20260815_0012
          uv run alembic upgrade head
          uv run alembic check
      - name: Verify base round trip
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

  quality:
    name: Stage 7 Plan Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Run quality gates
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check backend tests scripts
          uv run ruff format --check migrations/versions/20260815_0013_stage7_plan_occurrence_run_snapshot.py
          uv run ruff check backend tests scripts
          uv run ruff check migrations/versions/20260815_0013_stage7_plan_occurrence_run_snapshot.py
          uv run mypy backend/src
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py
