name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: CI Scope
    runs-on: ubuntu-24.04
    outputs:
      profile: ${{ steps.classify.outputs.profile }}
      repository_required: ${{ steps.classify.outputs.repository_required }}
      backend_required: ${{ steps.classify.outputs.backend_required }}
      frontend_required: ${{ steps.classify.outputs.frontend_required }}
      contract_required: ${{ steps.classify.outputs.contract_required }}
      postgres_required: ${{ steps.classify.outputs.postgres_required }}
      fullstack_required: ${{ steps.classify.outputs.fullstack_required }}
      stack_smoke_required: ${{ steps.classify.outputs.stack_smoke_required }}
      fullstack_specs: ${{ steps.classify.outputs.fullstack_specs }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed scope
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${GITHUB_SHA}"
          fi
          python3 scripts/quality/classify_ci_scope.py \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

  docs-governance:
    name: Docs and Governance
    needs: scope
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Secret and docs gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/scan_secrets.py
          python3 scripts/quality/check_docs.py
          python3 scripts/quality/check_docs_facts.py

  repository-quality:
    name: Repository Quality
    needs: scope
    if: needs.scope.outputs.repository_required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        if: needs.scope.outputs.backend_required == 'true'
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        if: needs.scope.outputs.frontend_required == 'true'
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Install report validation CJK font
        if: needs.scope.outputs.backend_required == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Verify required runtime versions
        shell: bash
        env:
          BACKEND_REQUIRED: ${{ needs.scope.outputs.backend_required }}
          FRONTEND_REQUIRED: ${{ needs.scope.outputs.frontend_required }}
        run: |
          set -euo pipefail
          if [[ "${BACKEND_REQUIRED}" == "true" ]]; then
            test "$(python --version)" = "Python 3.14.7"
          fi
          if [[ "${FRONTEND_REQUIRED}" == "true" ]]; then
            test "$(node --version)" = "v24.19.0"
            test "$(npm --version)" = "11.17.0"
          fi

      - name: Install frozen Python environment
        if: needs.scope.outputs.backend_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          test "$(uv --version | awk '{print $2}')" = "${UV_VERSION}"
          uv lock --check
          uv sync --locked
          uv run python -c "import aima_ugc"

      - name: Install locked frontend environment
        if: needs.scope.outputs.frontend_required == 'true'
        run: npm ci --prefix frontend

      - name: Audit frontend dependencies
        if: needs.scope.outputs.frontend_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend audit --omit=dev --audit-level=high
          npm --prefix frontend audit --audit-level=high

      - name: Source API and frontend startup smoke
        if: needs.scope.outputs.stack_smoke_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          API_LOG=/tmp/aima-api.log
          FRONTEND_LOG=/tmp/aima-frontend.log

          cleanup() {
            if [[ -n "${FRONTEND_PID:-}" ]]; then kill "${FRONTEND_PID}" 2>/dev/null || true; fi
            if [[ -n "${API_PID:-}" ]]; then kill "${API_PID}" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          uv run uvicorn aima_ugc.entrypoints.api_main:app --host 127.0.0.1 --port 8090 --reload --reload-dir backend/src >"${API_LOG}" 2>&1 &
          API_PID=$!
          npm --prefix frontend run dev >"${FRONTEND_LOG}" 2>&1 &
          FRONTEND_PID=$!

          sleep 1
          if ! kill -0 "${API_PID}" 2>/dev/null; then
            cat "${API_LOG}"
            exit 1
          fi
          if ! kill -0 "${FRONTEND_PID}" 2>/dev/null; then
            cat "${FRONTEND_LOG}"
            exit 1
          fi

          if ! uv run python scripts/dev/check_local_stack.py; then
            echo "--- api log ---"
            cat "${API_LOG}"
            echo "--- frontend log ---"
            cat "${FRONTEND_LOG}"
            exit 1
          fi

      - name: Verify generated contracts and client
        if: needs.scope.outputs.contract_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          git diff --exit-code -- contracts frontend/src/generated/api
          UNTRACKED="$(git ls-files --others --exclude-standard -- contracts frontend/src/generated/api)"
          if [[ -n "${UNTRACKED}" ]]; then
            echo "CONTRACT_UNTRACKED: ${UNTRACKED}"
            exit 1
          fi
          test -f contracts/export/unified-data-excel.v1.schema.json
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py

      - name: Python format, lint and type gates
        if: needs.scope.outputs.backend_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check \
            backend tests scripts \
            migrations/versions/20260814_0005_stage5d_provider_dispatch.py \
            migrations/versions/20260815_0013_stage7_plan_occurrence_run_snapshot.py \
            migrations/versions/20260815_0014_stage7_latest_only_scheduler_policy.py
          uv run ruff check \
            backend tests scripts \
            migrations/versions/20260814_0005_stage5d_provider_dispatch.py \
            migrations/versions/20260815_0013_stage7_plan_occurrence_run_snapshot.py \
            migrations/versions/20260815_0014_stage7_latest_only_scheduler_policy.py
          uv run mypy backend/src

      - name: Unit, Contract and API tests
        if: needs.scope.outputs.backend_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit -q
          uv run pytest tests/contracts -q
          uv run pytest tests/api -q

      - name: Architecture and ownership gates
        if: needs.scope.outputs.backend_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py

      - name: Build and verify Wheel
        if: needs.scope.outputs.backend_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -c "import aima_ugc; print(aima_ugc.__version__)"

      - name: Frontend unit, build and Browser Mock Acceptance
        if: needs.scope.outputs.frontend_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run test -- --run
          npm --prefix frontend run build
          npm --prefix frontend exec -- playwright --version
          npm --prefix frontend run test:e2e

  postgres-integration:
    name: PostgreSQL Integration
    needs: scope
    if: needs.scope.outputs.postgres_required == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/ci-postgres/data
      AIMA_LOG_DIR: .runtime/ci-postgres/logs
      AIMA_SECRET_DIR: .runtime/ci-postgres/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install report validation CJK font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Prepare isolated runtime and PostgreSQL Secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'ci-postgres' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"

      - name: Upgrade empty database to current head
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check

      - name: Historical Migration compatibility
        shell: bash
        run: |
          set -euo pipefail
          uv run python tests/integration/database/verify_migration_compatibility.py

      - name: Platform PostgreSQL integration
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/platform -q

      - name: Real readiness HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          API_STDOUT="${RUNNER_TEMP}/aima-postgres-integration-api.stdout"
          cleanup() {
            if [[ -n "${API_PID:-}" ]]; then kill "${API_PID}" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          uv run uvicorn aima_ugc.entrypoints.api_main:app --host 127.0.0.1 --port 8091 >"${API_STDOUT}" 2>&1 &
          API_PID=$!

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8091/health/ready > "${RUNNER_TEMP}/aima-ready.json"; then
              break
            fi
            if ! kill -0 "${API_PID}" 2>/dev/null; then
              cat "${API_STDOUT}"
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8091/health/ready > "${RUNNER_TEMP}/aima-ready.json"
          uv run python - "${RUNNER_TEMP}/aima-ready.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload == {
              "status": "ok",
              "checks": {
                  "database": "ok",
                  "artifact_store": "ok",
                  "log_directory": "ok",
              },
          }
          PY

          test -f "${AIMA_LOG_DIR}/api.log"
          if grep -Fq 'ci-postgres' "${AIMA_LOG_DIR}/api.log"; then
            echo "Database test password leaked into api.log"
            exit 1
          fi

      - name: Database PostgreSQL integration
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/database -q

      - name: Job Runtime PostgreSQL integration
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/jobs -q

      - name: Collection PostgreSQL integration
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/collection -q

      - name: Content PostgreSQL integration
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/content -q

      - name: Ingestion PostgreSQL integration
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/ingestion -q

  real-fullstack:
    name: Real Full-stack Golden Path
    needs: scope
    if: needs.scope.outputs.fullstack_required == 'true'
    uses: ./.github/workflows/fullstack.yml
    with:
      specs: ${{ needs.scope.outputs.fullstack_specs }}

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - scope
      - docs-governance
      - repository-quality
      - postgres-integration
      - real-fullstack
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required CI layers
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DOCS_GOVERNANCE_RESULT: ${{ needs.docs-governance.result }}
          REPOSITORY_REQUIRED: ${{ needs.scope.outputs.repository_required }}
          REPOSITORY_QUALITY_RESULT: ${{ needs.repository-quality.result }}
          POSTGRES_REQUIRED: ${{ needs.scope.outputs.postgres_required }}
          POSTGRES_INTEGRATION_RESULT: ${{ needs.postgres-integration.result }}
          FULLSTACK_REQUIRED: ${{ needs.scope.outputs.fullstack_required }}
          FULLSTACK_RESULT: ${{ needs.real-fullstack.result }}
        run: |
          set -euo pipefail
          test "${SCOPE_RESULT}" = "success"
          test "${DOCS_GOVERNANCE_RESULT}" = "success"

          require_or_skip() {
            local required="$1"
            local result="$2"
            local label="$3"
            if [[ "${required}" == "true" ]]; then
              if [[ "${result}" != "success" ]]; then
                echo "${label} required but result=${result}" >&2
                exit 1
              fi
            elif [[ "${result}" != "skipped" ]]; then
              echo "${label} not required but result=${result}" >&2
              exit 1
            fi
          }

          require_or_skip "${REPOSITORY_REQUIRED}" "${REPOSITORY_QUALITY_RESULT}" "Repository Quality"
          require_or_skip "${POSTGRES_REQUIRED}" "${POSTGRES_INTEGRATION_RESULT}" "PostgreSQL Integration"
          require_or_skip "${FULLSTACK_REQUIRED}" "${FULLSTACK_RESULT}" "Real Full-stack Golden Path"

  tikhub-account-probe:
    name: TikHub Account Probe (temporary)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Bounded real TikHub account probe
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TIKHUB_API_KEY:-}" ]]; then
            echo "PROBE_SKIPPED: Actions Secret TIKHUB_API_KEY is not configured"
            exit 0
          fi
          uv run python - <<'PY'
          import os
          from datetime import UTC, datetime

          from pydantic import SecretStr

          from aima_ugc.adapters.providers.tikhub import account_runtime
          from aima_ugc.adapters.providers.tikhub import runtime as tikhub_runtime
          from aima_ugc.adapters.providers.tikhub.transport import TikHubHttpTransport
          from aima_ugc.adapters.providers.tikhub_test import XiaohongshuAccountTarget
          from aima_ugc.adapters.providers.tikhub_test.operations.xiaohongshu_accounts import (
              XiaohongshuAccountResolutionError,
              resolve_account_candidate,
          )

          credential = SecretStr(os.environ["TIKHUB_API_KEY"])
          target = XiaohongshuAccountTarget(nickname="爱玛电动车", red_id="49328786266")

          def send(transport: TikHubHttpTransport, call: object) -> dict[str, object]:
              request = call.transport_request(credential)
              response = transport.send(request)
              if response.status_code is not None and response.status_code >= 400:
                  raise RuntimeError(f"TikHub probe HTTP {response.status_code}")
              if not isinstance(response.body, dict):
                  raise RuntimeError("TikHub probe response top-level is not object")
              return response.body

          with TikHubHttpTransport(base_url="https://api.tikhub.io", timeout_seconds=60) as transport:
              resolved = None
              candidate_count = 0
              for query in (target.red_id, target.nickname):
                  if query is None:
                      continue
                  search_body = send(transport, account_runtime.build_user_search_call(keyword=query))
                  candidates = account_runtime.extract_user_search_items(search_body)
                  candidate_count += len(candidates)
                  try:
                      resolved = resolve_account_candidate(target, candidates)
                      break
                  except XiaohongshuAccountResolutionError as exc:
                      if exc.reason != "not_found":
                          raise
              if resolved is None:
                  raise RuntimeError("TikHub probe could not resolve configured account by exact red_id")

              info_body = send(
                  transport,
                  account_runtime.build_user_info_call(user_id=resolved.user_id),
              )
              user_info = account_runtime.extract_user_info_item(info_body)
              if user_info is None:
                  raise RuntimeError("TikHub probe user info extractor returned empty")
              validated = resolve_account_candidate(
                  XiaohongshuAccountTarget(
                      nickname=target.nickname,
                      red_id=target.red_id,
                      user_id=resolved.user_id,
                  ),
                  (user_info,),
              )
              if validated.user_id != resolved.user_id:
                  raise RuntimeError("TikHub probe user info identity mismatch")

              notes_body = send(
                  transport,
                  account_runtime.build_user_notes_call(user_id=resolved.user_id),
              )
              notes = account_runtime.extract_user_note_items(notes_body)
              account_runtime.advance_user_notes(state=None, body=notes_body)
              if not notes:
                  raise RuntimeError("TikHub probe returned no posted notes; mapper shape not verified")
              mapped = tikhub_runtime.map_content(
                  platform="xiaohongshu",
                  raw=notes[0],
                  context=tikhub_runtime.mapping_context(
                      provider_request_id="probe",
                      provider_attempt_id="probe",
                      raw_artifact_id="probe",
                      operation="get_user_posted_notes",
                      source_type="account",
                      source_value="probe",
                      observed_at=datetime.now(UTC),
                  ),
                  item_locator="probe.notes[0]",
              )
              if not mapped.external_content_id:
                  raise RuntimeError("TikHub probe mapper did not produce content identity")

          print(
              "PROBE_OK "
              f"search_candidates={candidate_count} "
              f"notes={len(notes)} user_info=true pagination=true mapper=true"
          )
          PY
