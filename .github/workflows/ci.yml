name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  stage1:
    name: Stage 1
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Install report validation CJK font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Verify runtime versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(python --version)" = "Python 3.14.7"
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          UV_ACTUAL="$(uv --version | awk '{print $2}')"
          test "${UV_ACTUAL}" = "${UV_VERSION}"

      - name: Verify locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked
          uv run python -c "import aima_ugc"

      - name: Install locked frontend environment
        run: npm ci --prefix frontend

      - name: Audit frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend audit --omit=dev --audit-level=high
          npm --prefix frontend audit --audit-level=high

      - name: Local development startup smoke
        shell: bash
        run: |
          set -euo pipefail
          API_LOG=/tmp/aima-api.log
          FRONTEND_LOG=/tmp/aima-frontend.log

          cleanup() {
            if [[ -n "${FRONTEND_PID:-}" ]]; then kill "${FRONTEND_PID}" 2>/dev/null || true; fi
            if [[ -n "${API_PID:-}" ]]; then kill "${API_PID}" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          uv run uvicorn aima_ugc.entrypoints.api_main:app --host 127.0.0.1 --port 8090 --reload --reload-dir backend/src >"${API_LOG}" 2>&1 &
          API_PID=$!
          npm --prefix frontend run dev >"${FRONTEND_LOG}" 2>&1 &
          FRONTEND_PID=$!

          sleep 1
          if ! kill -0 "${API_PID}" 2>/dev/null; then
            cat "${API_LOG}"
            exit 1
          fi
          if ! kill -0 "${FRONTEND_PID}" 2>/dev/null; then
            cat "${FRONTEND_LOG}"
            exit 1
          fi

          if ! uv run python scripts/dev/check_local_stack.py; then
            echo "--- api log ---"
            cat "${API_LOG}"
            echo "--- frontend log ---"
            cat "${FRONTEND_LOG}"
            exit 1
          fi

      - name: Verify generated contracts and client
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          git diff --exit-code -- contracts/openapi/openapi.json frontend/src/generated/api
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py

      - name: Backend and repository checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check backend tests scripts
          uv run ruff check backend tests scripts
          uv run mypy backend/src
          uv run pytest tests/unit -q
          uv run pytest tests/contracts -q
          uv run pytest tests/api -q
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py

      - name: Build and verify Wheel
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -c "import aima_ugc; print(aima_ugc.__version__)"

      - name: Frontend checks
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run test -- --run
          npm --prefix frontend run build
          npm --prefix frontend exec -- playwright --version
          npm --prefix frontend run test:e2e

  stage2-platform:
    name: Stage 2 Platform
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: stage2-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/ci-stage2/data
      AIMA_LOG_DIR: .runtime/ci-stage2/logs
      AIMA_SECRET_DIR: .runtime/ci-stage2/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install report validation CJK font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Prepare isolated runtime directories and Secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'stage2-ci' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"

      - name: Platform unit and PostgreSQL integration tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/platform -q
          uv run pytest tests/integration/platform -q

      - name: Real readiness HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          API_STDOUT="${RUNNER_TEMP}/aima-stage2-api.stdout"
          cleanup() {
            if [[ -n "${API_PID:-}" ]]; then kill "${API_PID}" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          uv run uvicorn aima_ugc.entrypoints.api_main:app --host 127.0.0.1 --port 8091 >"${API_STDOUT}" 2>&1 &
          API_PID=$!

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8091/health/ready > "${RUNNER_TEMP}/aima-ready.json"; then
              break
            fi
            if ! kill -0 "${API_PID}" 2>/dev/null; then
              cat "${API_STDOUT}"
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8091/health/ready > "${RUNNER_TEMP}/aima-ready.json"
          uv run python - "${RUNNER_TEMP}/aima-ready.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload == {
              "status": "ok",
              "checks": {
                  "database": "ok",
                  "artifact_store": "ok",
                  "log_directory": "ok",
              },
          }
          PY

          test -f "${AIMA_LOG_DIR}/api.log"
          if grep -Fq 'stage2-ci' "${AIMA_LOG_DIR}/api.log"; then
            echo "Database test password leaked into api.log"
            exit 1
          fi

  stage3a-database:
    name: Stage 3A Database
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: stage3a-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/ci-stage3a/data
      AIMA_LOG_DIR: .runtime/ci-stage3a/logs
      AIMA_SECRET_DIR: .runtime/ci-stage3a/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Prepare Stage 3A Secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'stage3a-ci' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"

      - name: Verify schema and table owners
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/database -q
          uv run python scripts/quality/check_table_ownership.py

      - name: Upgrade empty database and verify no drift
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check

      - name: PostgreSQL repository integration tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/database -q

      - name: Stage 8B import HTTP and Worker integration tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/ingestion -q

      - name: Stage 8E previous revision downgrade and re-upgrade
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade 20260821_0021
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check

      - name: Downgrade and re-upgrade from base
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade base
          uv run python - <<'PY'
          from sqlalchemy import inspect

          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.database import DatabaseRuntime

          runtime = DatabaseRuntime(load_settings())
          try:
              existing = set(inspect(runtime.engine).get_table_names())
          finally:
              runtime.dispose()
          forbidden = {"artifacts", "system_settings", "audit_events"}
          assert not (existing & forbidden), existing
          PY
          uv run alembic upgrade head
          uv run alembic check

  windows-bootstrap:
    name: Windows bootstrap
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup target Python for non-destructive validation
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Validate Windows PowerShell bootstrap
        shell: powershell
        run: |
          $scriptPath = (Resolve-Path 'scripts/setup_dev_environment.ps1').Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell parser errors found.'
          }

          . $scriptPath
          $repoRoot = (Resolve-Path '.').Path
          $targets = Get-AimaTargetVersions -RepoRoot $repoRoot
          if ($targets.Python -ne '3.14.7') { throw "Unexpected Python target: $($targets.Python)" }
          if ($targets.Node -ne '24.19.0') { throw "Unexpected Node target: $($targets.Node)" }
          if ($targets.Npm -ne '11.17.0') { throw "Unexpected npm target: $($targets.Npm)" }
          if ($targets.Uv -ne '0.12.3') { throw "Unexpected uv target: $($targets.Uv)" }

          if ((ConvertTo-AimaVersion -Text 'Python 3.14.7') -ne '3.14.7') {
            throw 'Python version parser failed.'
          }
          if ((ConvertTo-AimaVersion -Text 'v24.19.0') -ne '24.19.0') {
            throw 'Node version parser failed.'
          }
          if ((Get-AimaPythonMajorMinor -Version $targets.Python) -ne '3.14') {
            throw 'Python launcher selector parser failed.'
          }
          if ((Get-AimaNpmInstallPrefix -NpmPath 'D:\nodejs\npm.cmd') -ne 'D:\nodejs') {
            throw 'npm replacement prefix did not follow the resolved npm command.'
          }

          function Get-ItemProperty {
            param([string]$Path, [object]$ErrorAction)

            @(
              [pscustomobject]@{
                DisplayVersion = 'nameless-fixture'
                PSChildName = 'nameless-fixture'
              },
              [pscustomobject]@{
                DisplayName = 'Node.js'
                DisplayVersion = '24.18.1'
                PSChildName = '{00000000-0000-0000-0000-000000000001}'
              }
            )
          }
          try {
            $registeredPrograms = @(Get-AimaRegisteredPrograms)
          }
          finally {
            Remove-Item -LiteralPath Function:\Get-ItemProperty -Force
          }
          if ($registeredPrograms.Count -ne 1) {
            throw "Registry entries without DisplayName were not ignored: $($registeredPrograms.Count)"
          }
          if ($registeredPrograms[0].DisplayName -ne 'Node.js') {
            throw 'Valid Node.js registry entry was not preserved.'
          }
          if (Confirm-AimaUninstall -Label 'Node.js' -Programs @()) {
            throw 'Empty old-version collection must not request an uninstall.'
          }

          $targetPython = Get-AimaPythonTargetExecutable -TargetVersion $targets.Python
          if ([string]::IsNullOrWhiteSpace($targetPython)) {
            throw 'Target Python discovery failed.'
          }
          $scriptsDir = (& $targetPython -c "import sysconfig; print(sysconfig.get_path('scripts'))" 2>&1 | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($scriptsDir)) {
            throw 'Target Python scripts path discovery failed.'
          }

          if ((Get-AimaPythonInstallerUri -Version $targets.Python) -ne 'https://mirrors.tuna.tsinghua.edu.cn/python/3.14.7/python-3.14.7-amd64.exe') {
            throw 'Python China mirror URL is not exact.'
          }
          if ((Get-AimaNodeInstallerUri -Version $targets.Node) -ne 'https://npmmirror.com/mirrors/node/v24.19.0/node-v24.19.0-x64.msi') {
            throw 'Node China mirror URL is not exact.'
          }
          if ((Get-AimaNodeChecksumUri -Version $targets.Node) -ne 'https://npmmirror.com/mirrors/node/v24.19.0/SHASUMS256.txt') {
            throw 'Node checksum China mirror URL is not exact.'
          }
          if ((Get-AimaPypiIndexUri) -ne 'https://pypi.tuna.tsinghua.edu.cn/simple') {
            throw 'PyPI China mirror is not exact.'
          }
          if ((Get-AimaNpmRegistryUri) -ne 'https://registry.npmmirror.com') {
            throw 'npm China registry is not exact.'
          }

          $scriptContent = Get-Content -LiteralPath $scriptPath -Raw
          foreach ($forbiddenHost in @(
            'www.python.org/ftp/python',
            'nodejs.org/dist',
            'astral.sh/uv/'
          )) {
            if ($scriptContent -match [regex]::Escape($forbiddenHost)) {
              throw "Bootstrap contains overseas runtime source: $forbiddenHost"
            }
          }
          if ($scriptContent -match 'Win32_Product') {
            throw 'Bootstrap must not query Win32_Product.'
          }
          if ($scriptContent -match '(?im)^\s*Set-ExecutionPolicy\b') {
            throw 'Bootstrap must not permanently change PowerShell ExecutionPolicy.'
          }
          foreach ($requiredPattern in @(
            'lock\s+--check\s+--offline',
            'export\s+--locked\s+--offline',
            'pip\s+sync\s+--python\s+\$projectPythonPath\s+--require-hashes',
            'pip\s+install\s+--python\s+\$projectPythonPath\s+--no-deps\s+--editable'
          )) {
            if ($scriptContent -notmatch $requiredPattern) {
              throw "Bootstrap is missing locked China-mirror dependency stage: $requiredPattern"
            }
          }

          $cmdContent = Get-Content -LiteralPath 'scripts/setup_dev_environment.cmd' -Raw
          if ($cmdContent -notmatch 'setup_dev_environment\.ps1') {
            throw 'CMD entry does not invoke the PowerShell bootstrap.'
          }

          function Get-AimaNodeRegistrations {
            param([string]$TargetVersion)

            [pscustomobject]@{
              DisplayName = 'Node.js'
              DisplayVersion = '24.18.1'
              PSChildName = '{00000000-0000-0000-0000-000000000001}'
            }
          }
          function Confirm-AimaUninstall {
            param([string]$Label, [object[]]$Programs)

            if ($Programs.Count -ne 1) {
              throw "Expected one old Node.js registration, got $($Programs.Count)."
            }
            throw 'AIMA_NODE_UNINSTALL_PROMPT_REACHED'
          }
          try {
            Install-AimaNode -TargetVersion $targets.Node -TempDir ([IO.Path]::GetTempPath())
            throw 'Node.js uninstall prompt regression did not reach the expected boundary.'
          }
          catch {
            if ($_.Exception.Message -ne 'AIMA_NODE_UNINSTALL_PROMPT_REACHED') {
              throw
            }
          }

          $script:AimaFlowVersionStep = 0
          $script:AimaNodeInstallCalled = $false
          $script:AimaNpmUpdateCalled = $false
          $script:AimaDependenciesInstallCalled = $false
          function Refresh-AimaProcessPath {}
          function Get-AimaPythonTargetExecutable {
            param([string]$TargetVersion)
            'C:\fixture\python.exe'
          }
          function Get-AimaCurrentVersions {
            $script:AimaFlowVersionStep++
            switch ($script:AimaFlowVersionStep) {
              1 { [pscustomobject]@{ Python = '3.14.7'; Node = '24.18.1'; Npm = '11.16.0'; Uv = '0.12.3' } }
              2 { [pscustomobject]@{ Python = '3.14.7'; Node = '24.18.1'; Npm = '11.16.0'; Uv = '0.12.3' } }
              3 { [pscustomobject]@{ Python = '3.14.7'; Node = '24.19.0'; Npm = '11.16.0'; Uv = '0.12.3' } }
              default { [pscustomobject]@{ Python = '3.14.7'; Node = '24.19.0'; Npm = '11.17.0'; Uv = '0.12.3' } }
            }
          }
          function Install-AimaPython { throw 'Python installation should not be called in the flow fixture.' }
          function Install-AimaNode { $script:AimaNodeInstallCalled = $true }
          function Update-AimaNpm { $script:AimaNpmUpdateCalled = $true }
          function Install-AimaUv { throw 'uv installation should not be called in the flow fixture.' }
          function Get-AimaCommandPath {
            param([string]$Name)
            "C:\fixture\$Name"
          }
          function Install-AimaProjectDependencies { $script:AimaDependenciesInstallCalled = $true }

          Invoke-AimaDevEnvironmentSetup
          if (-not $script:AimaNodeInstallCalled) { throw 'Node installation stage was not reached.' }
          if (-not $script:AimaNpmUpdateCalled) { throw 'npm update stage was not reached.' }
          if (-not $script:AimaDependenciesInstallCalled) { throw 'Project dependency installation stage was not reached.' }

          Write-Host 'Windows bootstrap China mirror, static, and pure-function checks passed.'
