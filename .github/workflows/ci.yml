name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  stage1:
    name: Stage 1
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Verify runtime versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(python --version)" = "Python 3.14.7"
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          UV_ACTUAL="$(uv --version | awk '{print $2}')"
          test "${UV_ACTUAL}" = "${UV_VERSION}"

      - name: Verify locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked
          uv run python -c "import aima_ugc"

      - name: Install locked frontend environment
        run: npm ci --prefix frontend

      - name: Audit frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend audit --omit=dev --audit-level=high
          npm --prefix frontend audit --audit-level=high

      - name: Local development startup smoke
        shell: bash
        run: |
          set -euo pipefail
          API_LOG=/tmp/aima-api.log
          FRONTEND_LOG=/tmp/aima-frontend.log

          cleanup() {
            if [[ -n "${FRONTEND_PID:-}" ]]; then kill "${FRONTEND_PID}" 2>/dev/null || true; fi
            if [[ -n "${API_PID:-}" ]]; then kill "${API_PID}" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          uv run uvicorn aima_ugc.entrypoints.api_main:app --host 127.0.0.1 --port 8090 --reload --reload-dir backend/src >"${API_LOG}" 2>&1 &
          API_PID=$!
          npm --prefix frontend run dev >"${FRONTEND_LOG}" 2>&1 &
          FRONTEND_PID=$!

          sleep 1
          if ! kill -0 "${API_PID}" 2>/dev/null; then
            cat "${API_LOG}"
            exit 1
          fi
          if ! kill -0 "${FRONTEND_PID}" 2>/dev/null; then
            cat "${FRONTEND_LOG}"
            exit 1
          fi

          if ! uv run python scripts/dev/check_local_stack.py; then
            echo "--- api log ---"
            cat "${API_LOG}"
            echo "--- frontend log ---"
            cat "${FRONTEND_LOG}"
            exit 1
          fi

      - name: Verify generated contracts and client
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          git diff --exit-code -- contracts/openapi/openapi.json frontend/src/generated/api
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py

      - name: Backend and repository checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check backend tests scripts
          uv run ruff check backend tests scripts
          uv run mypy backend/src
          uv run pytest tests/unit -q
          uv run pytest tests/contracts -q
          uv run pytest tests/api -q
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py

      - name: Build and verify Wheel
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -c "import aima_ugc; print(aima_ugc.__version__)"

      - name: Frontend checks
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run test -- --run
          npm --prefix frontend run build
          npm --prefix frontend exec -- playwright --version

  stage2-platform:
    name: Stage 2 Platform
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: stage2-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: ${{ runner.temp }}/aima-stage2/data
      AIMA_LOG_DIR: ${{ runner.temp }}/aima-stage2/logs
      AIMA_SECRET_DIR: ${{ runner.temp }}/aima-stage2/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Prepare isolated runtime directories and Secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'stage2-ci' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"

      - name: Platform unit and PostgreSQL integration tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/platform -q
          uv run pytest tests/integration/platform -q

      - name: Real readiness HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          API_STDOUT="${RUNNER_TEMP}/aima-stage2-api.stdout"
          cleanup() {
            if [[ -n "${API_PID:-}" ]]; then kill "${API_PID}" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          uv run uvicorn aima_ugc.entrypoints.api_main:app --host 127.0.0.1 --port 8091 >"${API_STDOUT}" 2>&1 &
          API_PID=$!

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8091/health/ready > "${RUNNER_TEMP}/aima-ready.json"; then
              break
            fi
            if ! kill -0 "${API_PID}" 2>/dev/null; then
              cat "${API_STDOUT}"
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8091/health/ready > "${RUNNER_TEMP}/aima-ready.json"
          uv run python - "${RUNNER_TEMP}/aima-ready.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload == {
              "status": "ok",
              "checks": {
                  "database": "ok",
                  "artifact_store": "ok",
                  "log_directory": "ok",
              },
          }
          PY

          test -f "${AIMA_LOG_DIR}/api.log"
          if grep -Fq 'stage2-ci' "${AIMA_LOG_DIR}/api.log"; then
            echo "Database test password leaked into api.log"
            exit 1
          fi

  windows-bootstrap:
    name: Windows bootstrap
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup target Python for non-destructive validation
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Validate Windows PowerShell bootstrap
        shell: powershell
        run: |
          $scriptPath = (Resolve-Path 'scripts/setup_dev_environment.ps1').Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell parser errors found.'
          }

          . $scriptPath
          $repoRoot = (Resolve-Path '.').Path
          $targets = Get-AimaTargetVersions -RepoRoot $repoRoot
          if ($targets.Python -ne '3.14.7') { throw "Unexpected Python target: $($targets.Python)" }
          if ($targets.Node -ne '24.19.0') { throw "Unexpected Node target: $($targets.Node)" }
          if ($targets.Npm -ne '11.17.0') { throw "Unexpected npm target: $($targets.Npm)" }
          if ($targets.Uv -ne '0.12.3') { throw "Unexpected uv target: $($targets.Uv)" }

          if ((ConvertTo-AimaVersion -Text 'Python 3.14.7') -ne '3.14.7') {
            throw 'Python version parser failed.'
          }
          if ((ConvertTo-AimaVersion -Text 'v24.19.0') -ne '24.19.0') {
            throw 'Node version parser failed.'
          }
          if ((Get-AimaPythonMajorMinor -Version $targets.Python) -ne '3.14') {
            throw 'Python launcher selector parser failed.'
          }

          $targetPython = Get-AimaPythonTargetExecutable -TargetVersion $targets.Python
          if ([string]::IsNullOrWhiteSpace($targetPython)) {
            throw 'Target Python discovery failed.'
          }
          $scriptsDir = (& $targetPython -c "import sysconfig; print(sysconfig.get_path('scripts'))" 2>&1 | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($scriptsDir)) {
            throw 'Target Python scripts path discovery failed.'
          }

          if ((Get-AimaPythonInstallerUri -Version $targets.Python) -ne 'https://mirrors.tuna.tsinghua.edu.cn/python/3.14.7/python-3.14.7-amd64.exe') {
            throw 'Python China mirror URL is not exact.'
          }
          if ((Get-AimaNodeInstallerUri -Version $targets.Node) -ne 'https://npmmirror.com/mirrors/node/v24.19.0/node-v24.19.0-x64.msi') {
            throw 'Node China mirror URL is not exact.'
          }
          if ((Get-AimaNodeChecksumUri -Version $targets.Node) -ne 'https://npmmirror.com/mirrors/node/v24.19.0/SHASUMS256.txt') {
            throw 'Node checksum China mirror URL is not exact.'
          }
          if ((Get-AimaPypiIndexUri) -ne 'https://pypi.tuna.tsinghua.edu.cn/simple') {
            throw 'PyPI China mirror is not exact.'
          }
          if ((Get-AimaNpmRegistryUri) -ne 'https://registry.npmmirror.com') {
            throw 'npm China registry is not exact.'
          }

          $scriptContent = Get-Content -LiteralPath $scriptPath -Raw
          foreach ($forbiddenHost in @(
            'www.python.org/ftp/python',
            'nodejs.org/dist',
            'astral.sh/uv/'
          )) {
            if ($scriptContent -match [regex]::Escape($forbiddenHost)) {
              throw "Bootstrap contains overseas runtime source: $forbiddenHost"
            }
          }
          if ($scriptContent -match 'Win32_Product') {
            throw 'Bootstrap must not query Win32_Product.'
          }
          if ($scriptContent -match '(?im)^\s*Set-ExecutionPolicy\b') {
            throw 'Bootstrap must not permanently change PowerShell ExecutionPolicy.'
          }

          $cmdContent = Get-Content -LiteralPath 'scripts/setup_dev_environment.cmd' -Raw
          if ($cmdContent -notmatch 'setup_dev_environment\.ps1') {
            throw 'CMD entry does not invoke the PowerShell bootstrap.'
          }

          Write-Host 'Windows bootstrap China mirror, static, and pure-function checks passed.'
