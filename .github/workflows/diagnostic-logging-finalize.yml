name: Diagnostic logging finalize helper

on:
  push:
    branches:
      - fix/diagnostic-logging

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/diagnostic-logging
      - name: Apply focused logging and Blueprint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'target block not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_section(path: str, heading: str, next_heading: str, body: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              start = text.find(heading)
              if start < 0:
                  raise SystemExit(f'heading not found in {path}: {heading}')
              end = text.find(next_heading, start)
              if end < 0:
                  raise SystemExit(f'next heading not found in {path}: {next_heading}')
              updated = text[:start] + body.rstrip() + '\n\n' + text[end:]
              p.write_text(updated, encoding='utf-8')

          # 直接 logging 调用本身就是实际故障点，不能再向上跳一层。
          worker = Path('backend/src/aima_ugc/platform/jobs/worker.py')
          text = worker.read_text(encoding='utf-8')
          text = text.replace(
              '                    exc_info=(type(exc), exc, exc.__traceback__),\n                    stacklevel=2,\n',
              '                    exc_info=(type(exc), exc, exc.__traceback__),\n',
          )
          worker.write_text(text, encoding='utf-8')

          # API 未预期 500 必须保留 traceback；正常请求不增加 INFO access log。
          replace_once(
              'backend/src/aima_ugc/bootstrap/api.py',
              '''        log_event(\n            _LOGGER,\n            logging.ERROR,\n            "api.request_failed",\n            "API 请求处理失败",\n            request_id=request_id,\n            method=request.method,\n            path=request.url.path,\n            error_type=type(exc).__name__,\n        )''',
              '''        _LOGGER.error(\n            "API 请求处理失败",\n            extra={\n                "event": "api.request_failed",\n                "request_id": request_id,\n                "method": request.method,\n                "path": request.url.path,\n                "error_type": type(exc).__name__,\n            },\n            exc_info=(type(exc), exc, exc.__traceback__),\n        )''',
          )

          # 单个坏 Plan 继续 fail closed，同时保留安全错误摘要，避免只有异常类型没有原因。
          replace_once(
              'backend/src/aima_ugc/bootstrap/scheduler.py',
              '''                    plan_id=str(plan_id),\n                    error_type=type(exc).__name__,\n                )''',
              '''                    plan_id=str(plan_id),\n                    error_type=type(exc).__name__,\n                    error_detail=str(exc),\n                )''',
          )

          # 清理测试中的临时 type-ignore/动态 import 写法。
          test_logging = Path('tests/unit/platform/test_logging.py')
          text = test_logging.read_text(encoding='utf-8')
          text = text.replace('import gzip\nimport logging\nimport re\n', 'import gzip\nimport inspect\nimport logging\nimport re\n')
          text = text.replace(
              '    expected_line = __import__("inspect").currentframe().f_lineno + 1  # type: ignore[union-attr]\n    log_event(logger, logging.INFO, "test.caller", "定位真实调用点")',
              '    frame = inspect.currentframe()\n    assert frame is not None\n    expected_line = frame.f_lineno + 1\n    log_event(logger, logging.INFO, "test.caller", "定位真实调用点")',
          )
          test_logging.write_text(text, encoding='utf-8')

          scheduler_test = Path('tests/unit/platform/test_scheduler_entrypoint_logging.py')
          text = scheduler_test.read_text(encoding='utf-8')
          text = text.replace('from types import SimpleNamespace\n', 'from types import SimpleNamespace\nfrom typing import cast\n')
          text = text.replace('from aima_ugc.bootstrap.scheduler import SchedulerTickResult\n', 'from aima_ugc.bootstrap.runtime import PlatformRuntime\nfrom aima_ugc.bootstrap.scheduler import SchedulerTickResult\n')
          text = text.replace('    runtime = SimpleNamespace(logger=logger)\n', '    runtime = cast(PlatformRuntime, SimpleNamespace(logger=logger))\n')
          text = text.replace('            scheduler_main.run_scheduler_loop(runtime, sleep=stop_after_first_tick)  # type: ignore[arg-type]\n', '            scheduler_main.run_scheduler_loop(runtime, sleep=stop_after_first_tick)\n')
          scheduler_test.write_text(text, encoding='utf-8')

          # Blueprint 05：日志显示格式、级别和事件策略以当前实现为长期事实源。
          replace_section(
              'docs/blueprint/05-日志安全部署与运维.md',
              '## 2. 应用日志格式',
              '## 3. 日志文件',
              '''## 2. 应用日志格式\n\nUTF-8，一行一个事件。面向人阅读的应用日志固定使用北京时间，前缀直接给出真实调用文件和源码行号：\n\n```text\n[2026-08-21 16:48:14.113 provider_dispatch.py L184] [WARNING] event=provider.request.failed provider_request_id=req_01 job_id=job_01 run_id=run_01 scope_id=scope_01 platform=xhs operation=keyword_search duration_ms=1323 error_code=tikhub_connect_failed message="Provider Request 状态已持久化。"\n```\n\n固定顺序：\n\n```text\n[北京时间 文件名 L行号]\n[级别]\nevent\n关联 ID\n业务诊断字段\nmessage\n```\n\n北京时间的**显示格式统一固定**为：\n\n```text\nYYYY-MM-DD HH:mm:ss.SSS\n```\n\n应用日志、运维页面或其他明确以北京时间面向人工阅读的时间均使用这一显示形式，不输出 `T`、`Z` 或 `+08:00`。这条规则只约束人工展示；数据库、API Contract、Job Payload、调度游标和其他机器交换时间仍必须使用带时区的时间类型/ISO 8601，不得为了显示统一而丢失时区信息。进程启动事件继续记录 `timezone=Asia/Shanghai`，说明无偏移显示值的时区语义。\n\n日志文件名已经区分 `api.log`、`worker.log`、`scheduler.log`，所以每行**不再重复输出** `service=api|worker|scheduler`。调用位置也不再额外输出 `source=foo.py:123`，而是直接进入第一段前缀。统一 `log_event()` 必须通过 `stacklevel` 让文件名和行号指向真实业务调用点，不能长期显示为 `setup.py` 等日志 helper。\n\n所有字段必须经过同一个结构化 Formatter：键名只允许约定字符；字符串用引号包裹，并转义 `\\r`、`\\n`、制表符、引号、反斜杠和其他控制字符；单字段、异常堆栈和整行都有长度上限，截断时增加 `truncated=true`。禁止直接拼接用户文本、Provider Raw 或 Secret。Formatter 必须有调用位置、CRLF/控制字符、超长文本和敏感字段测试。''',
          )

          replace_section(
              'docs/blueprint/05-日志安全部署与运维.md',
              '## 6. 事件命名',
              '## 7. 应该记录什么',
              '''## 6. 事件命名\n\n事件使用稳定的点分名称。当前关键运行事件至少包括：\n\n```text\nservice.started\nscheduler.tick.completed\nscheduler.plan.rejected\njob.started\njob.retry_scheduled\njob.completed\njob.failed\njob.cancelled\njob.execution_failed\njob.reaped\njob.lease_lost\njob.heartbeat_failed\ncollection.run.started\ncollection.run.completed\ncollection.scope.completed\ncollection.scope.retry_scheduled\nprovider.request.started\nprovider.request.completed\nprovider.request.failed\nraw.artifact.stored\nraw.artifact.write_failed\ncanonical.validation.failed\ncontent.ingestion.completed\nanalysis.completed\nreport.generated\nsecurity.access_denied\napi.request_failed\n```\n\n消息文字可以调整，`event` 名称和字段含义属于运维契约，改变时要同步文档和测试。不要为了“日志看起来更丰富”给同一事实在相邻层重复创建事件。''',
          )

          replace_section(
              'docs/blueprint/05-日志安全部署与运维.md',
              '## 7. 应该记录什么',
              '## 8. 日志字段',
              '''## 7. 应该记录什么\n\n日志的判断标准不是“代码执行到哪一步都打一行”，而是排障时能否回答：发生了什么、影响哪个稳定身份、结果如何、耗时多久、为什么失败、下一步能否重试。\n\n### 7.1 HTTP\n\n默认 INFO 不逐条打印正常 API access log，避免轮询页面把 `api.log` 刷满。健康检查同样不逐次记 INFO。未预期 500 必须记录 ERROR，并包含 `request_id`、method、path（不含完整敏感 Query）、`error_type` 和 traceback；业务可预期的 4xx 由统一 Error Contract 返回，不为每次客户端校验失败制造 ERROR 噪音。未来如果需要请求级性能采样，应放 DEBUG 或独立 access log。\n\n### 7.2 Scheduler\n\n每次 tick 只保留一条汇总事件：\n\n- 没有初始化、入队、跳过或失败的空 tick → DEBUG；\n- 初始化 cursor、实际入队或产生 misfire skip → INFO；\n- 存在 rejected Plan → tick 汇总 WARNING；\n- 单个非法 Plan 本身记录 `scheduler.plan.rejected` ERROR，包含 `plan_id`、`error_type` 和安全 `error_detail`。\n\n汇总字段至少包括 `scanned / initialized / enqueued / skipped / failed / duration_ms`。不得每 30 秒无条件写 INFO。\n\n### 7.3 Job / Worker\n\nJob 开始和终态是核心生命周期：记录 job ID/type、attempt/max attempts、worker ID、timeout、终态、`duration_ms` 和 `error_code`。成功/取消为 INFO，可重试为 WARNING，永久失败为 ERROR。Handler 未预期异常额外记录 `job.execution_failed` + traceback 后继续沿原控制流抛出，不能吞异常。\n\n正常 Heartbeat 不记 INFO；只有 Lease 丢失、Heartbeat 执行失败等异常才记 WARNING，并带 job_id/error_type；非 Lease 异常保留 traceback。Reaper 只有实际处理到超时/取消 Job 时才记录 `job.reaped`，空轮询不写 INFO。\n\n### 7.4 Collection Run / Scope\n\nRun 开始与终态属于管理级事实：开始 INFO；成功/取消 INFO；partial success WARNING；failed ERROR。记录 run/job ID、trigger、scope 数量、内容/评论/请求聚合计数和 error_code。\n\nScope 成功数量可能很大，因此成功终态只记 DEBUG；partial success 记 WARNING，failed 记 ERROR，cancelled 记 INFO。未预期 Scope 异常必须在隔离为失败终态的同时保存 traceback、`error_type`、run/job/scope ID、platform、operation_group 和安全计数。可重试 Scope 在 durable checkpoint 成功后记 `collection.scope.retry_scheduled` WARNING，包含 progress/error_code 和计数。\n\n### 7.5 Provider\n\nProvider Dispatch 是外部请求的唯一主要日志边界，不在 TikHub Transport 再重复打一套同义日志。请求开始和成功完成默认 DEBUG；失败为 WARNING。记录 provider request/attempt、run/scope、provider/platform/operation、attempt、status、duration、HTTP status、第三方 request ID、Raw Artifact ID、Billing/Cost 审计字段和安全 `error_code/error_detail`。\n\n禁止记录完整请求 Body、完整 Query 参数、响应 Body、Cookie、Authorization、Token、Secret 或用户原文。Raw 响应只进入受控 Artifact，不进入日志。\n\n### 7.6 Ingestion / Analysis / Export\n\n记录一次稳定任务的输入/输出计数、业务版本、关键阶段、事务或任务耗时、终态和安全错误分类；不逐条 INFO 打印每个帖子、评论或标签。逐条诊断仅在确有需要时放 DEBUG，并考虑采样。''',
          )

          replace_section(
              'docs/blueprint/05-日志安全部署与运维.md',
              '## 8. 日志字段',
              '## 9. 脱敏',
              '''## 8. 日志字段\n\n通用字段按事件需要选择，不要求每行全部出现：\n\n```text\nrequest_id\ntrace_id\nactor_id\njob_id\njob_type\nworker_id\nrun_id\nscope_id\nprovider_request_id\nprovider_attempt_id\nexternal_request_id\nartifact_id\nplatform\noperation\noperation_group\nstatus\nattempt\nmax_attempts\nprogress\nduration_ms\nhttp_status\nerror_type\nerror_code\nerror_detail\nrequested_count\nsucceeded_count\nfailed_count\ncontent_count\ncomment_count\n```\n\n同一链路沿用相同稳定 ID，不要每层重新生成无法关联的新 ID。`error_detail` 只能是经过业务层收敛的安全摘要；异常堆栈仅用于未预期异常且继续经过 Formatter 脱敏/截断。`service` 和 `source` 不属于行级业务字段：service 由日志文件名表达，source 由前缀中的 `filename + Lline` 表达。''',
          )

          # Scheduler 专项蓝图补充日志级别与降噪边界。
          replace_section(
              'docs/blueprint/09-Scheduler运行与恢复策略.md',
              '## 9. 日志与可观测性',
              '## 10. Stage 7 验收',
              '''## 9. 日志与可观测性\n\nScheduler 的日志必须优先回答“本次 tick 是否真的做了工作、哪个 Plan 为什么被拒绝”，而不是证明进程每 30 秒还活着。\n\n`scheduler.tick.completed` 固定携带：\n\n```text\nscanned\ninitialized\nenqueued\nskipped\nfailed\nduration_ms\n```\n\n级别规则：没有初始化、入队、skip 或失败的空 tick 只记 DEBUG；初始化 cursor、实际入队或产生 `misfire_superseded` skip 时记 INFO；只要存在失败 Plan，tick 汇总提升为 WARNING。单个非法策略、非法 Cron、异常 backlog、缺 Provider/词包/Scope/Capability 的 Plan 继续 fail closed，并单独记录 `scheduler.plan.rejected` ERROR，包含 `plan_id`、`error_type` 与安全 `error_detail`，但不得终止同一 tick 的其他 Plan。\n\n所有面向人阅读的北京时间日志遵循 Blueprint 05：`YYYY-MM-DD HH:mm:ss.SSS`，调用文件名和源码行号直接位于日志前缀；不重复输出 `service=scheduler`。持久化的 `scheduled_for / next_run_at / last_scheduled_at` 仍是带时区的机器时间，不受日志显示格式影响。\n\n日志不得包含 Provider Secret、Cookie、Authorization、完整第三方 Raw、完整请求参数或其他敏感数据。''',
          )
          PY
      - name: Commit focused fixes when needed
        run: |
          if git diff --quiet; then
            echo "No focused fixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/aima_ugc/platform/jobs/worker.py \
            backend/src/aima_ugc/bootstrap/api.py \
            backend/src/aima_ugc/bootstrap/scheduler.py \
            tests/unit/platform/test_logging.py \
            tests/unit/platform/test_scheduler_entrypoint_logging.py \
            docs/blueprint/05-日志安全部署与运维.md \
            docs/blueprint/09-Scheduler运行与恢复策略.md
          git commit -m "收敛诊断日志并同步蓝图"
          git push origin HEAD:fix/diagnostic-logging
