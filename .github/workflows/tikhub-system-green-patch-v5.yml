name: TikHub Bilibili Weibo Compatibility Green

on:
  push:
    branches: [agent/tikhub-test-debug]
    paths: [".github/workflows/tikhub-system-green-patch-v5.yml"]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/tikhub-test-debug
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Prepare locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Apply Bilibili and Weibo production fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def rep(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected fragment missing: {path}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          bilibili = "backend/src/aima_ugc/adapters/providers/tikhub/operations/bilibili.py"
          rep(
              bilibili,
              '    next_offset: int | None = None,\n) -> BilibiliRequest:\n    """构造 B站 App 一级评论请求；首屏不发送 next_offset。"""',
              '    next_offset: int | None = 0,\n) -> BilibiliRequest:\n    """构造 B站 App 一级评论请求；首屏明确发送 next_offset=0。"""',
          )

          runtime = "backend/src/aima_ugc/adapters/providers/tikhub/runtime.py"
          rep(
              runtime,
              '            next_offset=_optional_int_state(paging, "next_offset"),\n        )\n        return TikHubOperationCall(\n            "bilibili",\n            "comments",',
              '            next_offset=_int_state(paging, "next_offset", default=0),\n        )\n        return TikHubOperationCall(\n            "bilibili",\n            "comments",',
          )

          weibo = "backend/src/aima_ugc/adapters/providers/tikhub/operations/weibo.py"
          rep(
              weibo,
              '        card for card in cards if isinstance(card, dict) and _mblog_has_stable_id(card.get("mblog"))\n',
              '        card for card in cards if isinstance(card, dict) and _has_stable_id(card.get("mblog"))\n',
          )
          rep(
              weibo,
              '''    return tuple(\n        item["data"]\n        for item in items\n        if isinstance(item, dict) and isinstance(item.get("data"), dict)\n    )\n\n\ndef _mblog_has_stable_id(value: object) -> bool:\n''',
              '''    return tuple(\n        item["data"]\n        for item in items\n        if isinstance(item, dict) and _has_stable_id(item.get("data"))\n    )\n\n\ndef _has_stable_id(value: object) -> bool:\n''',
          )

          bilibili_test = Path("tests/unit/collection/test_bilibili_tikhub_operation.py")
          text = bilibili_test.read_text(encoding="utf-8")
          old = '    assert first.params == {"bv_id": "BV1example", "mode": 2}\n'
          new = '    assert first.params == {"bv_id": "BV1example", "mode": 2, "next_offset": 0}\n'
          if old not in text:
              raise SystemExit("Bilibili first-page regression expectation missing")
          text = text.replace(old, new, 1)
          text += '''\n\ndef test_runtime_bilibili_first_comment_page_explicitly_sends_zero_offset() -> None:\n    from aima_ugc.adapters.providers.tikhub.runtime import build_comments_call\n\n    call = build_comments_call(\n        platform="bilibili",\n        external_content_id="123456",\n        state=None,\n    )\n\n    assert call.params["mode"] == 2\n    assert call.params["next_offset"] == 0\n'''
          bilibili_test.write_text(text, encoding="utf-8")

          weibo_test = Path("tests/unit/collection/test_weibo_tikhub_operation.py")
          text = weibo_test.read_text(encoding="utf-8")
          text += '''\n\ndef test_comment_extractor_ignores_non_comment_cards_without_stable_comment_id() -> None:\n    from aima_ugc.adapters.providers.tikhub.operations.weibo import extract_comment_items\n\n    body = {\n        "data": {\n            "items": [\n                {"data": {"idstr": "comment-1", "text": "valid"}},\n                {\n                    "data": {\n                        "card_type": 11,\n                        "display": "non-comment-card",\n                        "itemid": "display-card",\n                    }\n                },\n                {"data": {"mid": "comment-2", "text": "valid-2"}},\n            ]\n        }\n    }\n\n    items = extract_comment_items(body)\n\n    assert [item.get("idstr") or item.get("mid") for item in items] == [\n        "comment-1",\n        "comment-2",\n    ]\n'''
          weibo_test.write_text(text, encoding="utf-8")
          PY
          uv run ruff format \
            backend/src/aima_ugc/adapters/providers/tikhub/operations/bilibili.py \
            backend/src/aima_ugc/adapters/providers/tikhub/operations/weibo.py \
            backend/src/aima_ugc/adapters/providers/tikhub/runtime.py \
            tests/unit/collection/test_bilibili_tikhub_operation.py \
            tests/unit/collection/test_weibo_tikhub_operation.py
          uv run ruff check --fix \
            backend/src/aima_ugc/adapters/providers/tikhub/operations/bilibili.py \
            backend/src/aima_ugc/adapters/providers/tikhub/operations/weibo.py \
            backend/src/aima_ugc/adapters/providers/tikhub/runtime.py \
            tests/unit/collection/test_bilibili_tikhub_operation.py \
            tests/unit/collection/test_weibo_tikhub_operation.py
      - name: Verify Green
        shell: bash
        run: |
          set -euo pipefail
          uv run mypy backend/src
          uv run pytest \
            tests/unit/collection/test_bilibili_tikhub_operation.py \
            tests/unit/collection/test_weibo_tikhub_operation.py \
            tests/unit/collection/test_tikhub_test_debug_runtime.py \
            -q
          uv run python scripts/quality/scan_secrets.py
      - name: Commit verified Green
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/aima_ugc/adapters/providers/tikhub/operations/bilibili.py \
            backend/src/aima_ugc/adapters/providers/tikhub/operations/weibo.py \
            backend/src/aima_ugc/adapters/providers/tikhub/runtime.py \
            tests/unit/collection/test_bilibili_tikhub_operation.py \
            tests/unit/collection/test_weibo_tikhub_operation.py
          git commit -m "修复 B站评论首屏与微博评论卡片兼容"
          git push origin HEAD:agent/tikhub-test-debug
