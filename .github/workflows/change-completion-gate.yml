name: Change Completion Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ready-check:
    name: Requirement Traceability and Completion Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Run RVC completion-gate tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover .agents/skills/reliable-vibe-coding/tests -v

      - name: Enforce changed PR Change readiness
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python .agents/skills/reliable-vibe-coding/scripts/ready_check.py \
            --root . \
            --changed-since "${{ github.event.pull_request.base.sha }}"

      - name: Enforce main Active Change readiness
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python .agents/skills/reliable-vibe-coding/scripts/ready_check.py \
            --root . \
            --require-active-ready

  legacy-actions-cleanup-plan:
    name: Legacy Actions history cleanup plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate cleanup safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/maintenance/cleanup_legacy_actions_history.py --self-test

      - name: Build read-only cleanup plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/maintenance/cleanup_legacy_actions_history.py --plan

  legacy-actions-cleanup-apply:
    name: Legacy Actions history cleanup apply
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[actions-history-cleanup]')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate cleanup safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/maintenance/cleanup_legacy_actions_history.py --self-test

      - name: Delete one bounded batch of legacy workflow runs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/maintenance/cleanup_legacy_actions_history.py \
            --apply \
            --max-deletes 500
