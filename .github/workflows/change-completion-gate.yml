name: Change Completion Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ready-check:
    name: Requirement Traceability and Completion Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Run RVC completion-gate tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover .agents/skills/reliable-vibe-coding/tests -v

      - name: Enforce ready Change completion gate
        shell: bash
        run: |
          set -euo pipefail
          python .agents/skills/reliable-vibe-coding/scripts/ready_check.py \
            --root . \
            --require-active-ready
