name: Change Completion Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read

jobs:
  ready-check:
    name: Requirement Traceability and Completion Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Verify AIMA project governance wiring
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quality/check_agent_governance.py

      - name: Verify PR Requirement Source
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quality/check_pr_requirement_source.py \
            --event "${GITHUB_EVENT_PATH}" \
            --root .

      - name: Enforce changed PR Change readiness
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python .agents/skills/coding/scripts/ready_check.py \
            --root . \
            --changed-since "${{ github.event.pull_request.base.sha }}"

      - name: Enforce main Active Change readiness
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python .agents/skills/coding/scripts/ready_check.py \
            --root . \
            --require-active-ready
