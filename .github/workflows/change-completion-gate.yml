name: PR Requirement Source Revalidation

on:
  pull_request:
    branches:
      - main
    types:
      - edited

permissions:
  contents: read
  issues: read

concurrency:
  group: requirement-source-edited-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ready-check:
    name: Requirement Traceability and Completion Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Verify AIMA project governance wiring
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quality/check_agent_governance.py

      - name: Verify PR Requirement Source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quality/check_pr_requirement_source.py \
            --event "${GITHUB_EVENT_PATH}" \
            --root .

      - name: Enforce changed PR Change readiness
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quality/check_change_completion.py \
            --root . \
            --changed-since "${{ github.event.pull_request.base.sha }}"

      - name: Verify main Core still owns active Change readiness
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- "--require-active-ready" .github/workflows/ci.yml
