name: Change Completion Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-skill-guidance:
    name: Apply Skill guidance migration once
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: chore/skill-comments-observability
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Apply deterministic guidance migration and remove temporary hook
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quality/apply_skill_comments_observability.py
          git rm scripts/quality/apply_skill_comments_observability.py
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/change-completion-gate.yml
          git add \
            .agents/skills/reliable-vibe-coding/SKILL.md \
            .agents/skills/reliable-vibe-coding/references/development-workflows.md \
            .agents/skills/reliable-vibe-coding/references/verification-review.md \
            .agents/skills/reliable-vibe-coding/tests/test_development_guidance.py \
            docs/blueprint/05-日志安全部署与运维.md \
            docs/blueprint/06-开发约束与分阶段实施.md \
            .github/workflows/change-completion-gate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m '固化内部注释与关键日志开发规则'
          git push origin HEAD:chore/skill-comments-observability

  ready-check:
    name: Requirement Traceability and Completion Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Run RVC completion-gate tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover .agents/skills/reliable-vibe-coding/tests -v

      - name: Enforce changed PR Change readiness
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python .agents/skills/reliable-vibe-coding/scripts/ready_check.py \
            --root . \
            --changed-since "${{ github.event.pull_request.base.sha }}"

      - name: Enforce main Active Change readiness
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python .agents/skills/reliable-vibe-coding/scripts/ready_check.py \
            --root . \
            --require-active-ready
