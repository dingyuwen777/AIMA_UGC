name: CHG314 Green Implementation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout change branch
        uses: actions/checkout@v7.0.1
        with:
          ref: fix/314-frontend-fullstack-reliability
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Install locked environments
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm --version)" = "11.17.0"
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
          npm ci --prefix frontend

      - name: Apply approved Green patches
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dev/apply_chg314_ui.py
          python scripts/dev/apply_chg314_fullstack.py
          python scripts/dev/apply_chg314_ui_fix.py
          python scripts/dev/apply_chg314_analysis_all.py
          uv run ruff format \
            backend/src/aima_ugc/contracts/http.py \
            backend/src/aima_ugc/bootstrap/content_http.py \
            tests/api/test_analysis_all_scope.py \
            tests/integration/content/test_stage12_analysis_runs.py

      - name: Regenerate canonical contracts and frontend client
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          uv run python scripts/contracts/generate.py --check

      - name: Run targeted Green checks
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest \
            tests/api/test_analysis_all_scope.py \
            tests/api/test_frontend_reliability_contracts.py \
            tests/api/test_stage8b_imports.py \
            tests/api/test_u1_u5_identity_product.py \
            -q
          npm --prefix frontend run test -- --run \
            tests/analysis-all-scope.spec.ts \
            tests/identity-store.spec.ts \
            tests/frontend-audit-regressions.spec.ts
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck

      - name: Remove branch-only construction tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/chg314-apply.yml \
            .github/workflows/chg314-ui.yml \
            .github/workflows/chg314-analysis-all-red.yml \
            .github/workflows/chg314-green.yml \
            scripts/dev/apply_chg314.py \
            scripts/dev/run_chg314_patch.py \
            scripts/dev/apply_chg314_fullstack.py \
            scripts/dev/apply_chg314_ui.py \
            scripts/dev/apply_chg314_ui_fix.py \
            scripts/dev/apply_chg314_analysis_all.py

      - name: Commit Green implementation
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Green implementation changes found" >&2
            exit 1
          fi
          git commit -m "fix: 完成前端全栈可靠性闭环" -m "Requirement-Source: #314"
          git push origin HEAD:fix/314-frontend-fullstack-reliability
