name: Dev Sync Review Contract Doc

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Update exact Contract navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/blueprint/04_后端任务API与前端.md")
          text = path.read_text(encoding="utf-8")
          old = """backend/src/aima_ugc/contracts/http.py
          backend/src/aima_ugc/contracts/runtime.py
          """
          new = """backend/src/aima_ugc/contracts/http.py
          backend/src/aima_ugc/contracts/runtime.py
          backend/src/aima_ugc/contracts/relevance_review.py
          """
          if old not in text:
              raise SystemExit("未找到 Blueprint 04 Contract 导航原文")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit documentation update
        shell: bash
        run: |
          set -euo pipefail
          git add docs/blueprint/04_后端任务API与前端.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "同步人工复核 HTTP Contract 导航"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
