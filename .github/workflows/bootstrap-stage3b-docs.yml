name: Bootstrap Stage 3B docs

on:
  push:
    branches:
      - feature/stage3b-canonical-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage3b-canonical-v1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Apply strict Stage 3B documentation migration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dev/patch_stage3b_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md docs/blueprint
          git commit -m "同步 Stage 3B Canonical 与 Provider 架构"
          git push origin HEAD:feature/stage3b-canonical-v1
