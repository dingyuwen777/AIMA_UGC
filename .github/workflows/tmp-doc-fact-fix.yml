name: Temporary Docs Fact Fix

on:
  push:
    branches:
      - chore/agent-skills-project-governance

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: chore/agent-skills-project-governance
          fetch-depth: 0

      - name: Apply confirmed fact fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/fix_docs_fact_drift.py
          git diff --check
          python3 scripts/quality/check_docs.py
          python3 scripts/quality/audit_docs_api_paths.py | tee /tmp/api-audit.log
          grep -Fx 'API_SHORTHAND_COUNT 0' /tmp/api-audit.log

      - name: Commit documentation fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No documentation fact fixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs backend/src/aima_ugc/modules/reporting/README.md
          git commit -m "校准文档事实与仓库导航"
          git push origin HEAD:chore/agent-skills-project-governance
