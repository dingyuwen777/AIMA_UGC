name: Temporary Product Lifecycle Contract Generation

on:
  push:
    branches:
      - feature/product-resource-lifecycle
    paths:
      - .github/workflows/tmp-product-lifecycle-generate.yml

permissions:
  contents: write

jobs:
  generate-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current feature branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend environment
        run: npm ci --prefix frontend

      - name: Generate OpenAPI and Orval client
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api

      - name: Commit generated outputs and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-product-lifecycle-generate.yml
          git add contracts frontend/src/generated/api
          git config user.name "AIMA Contract Generator"
          git config user.email "aima-contract-generator@users.noreply.github.com"
          git commit -m "同步产品生命周期生成契约 [skip ci]"
          git push origin HEAD:feature/product-resource-lifecycle
