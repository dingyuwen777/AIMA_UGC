name: Dev Kuaishou Identity TDD

on:
  push:
    branches:
      - feature/excel-tikhub-identity-alignment
    paths:
      - .github/workflows/dev-apply-identity-alignment.yml
      - backend/src/aima_ugc/adapters/providers/tikhub/mappers/kuaishou.py
      - tests/unit/collection/test_kuaishou_tikhub_identity_convergence.py

permissions:
  contents: read

jobs:
  targeted-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Kuaishou identity regression
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/collection/test_kuaishou_tikhub_identity_convergence.py -q
          uv run ruff format --check \
            backend/src/aima_ugc/adapters/providers/tikhub/mappers/kuaishou.py \
            tests/unit/collection/test_kuaishou_tikhub_identity_convergence.py
          uv run ruff check \
            backend/src/aima_ugc/adapters/providers/tikhub/mappers/kuaishou.py \
            tests/unit/collection/test_kuaishou_tikhub_identity_convergence.py
