name: Corrective Zero Count Patch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/corrective-zero-count-patch.yml"
      - "backend/src/aima_ugc/bootstrap/collection_scope.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply exact zero-count fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/src/aima_ugc/bootstrap/collection_scope.py")
          text = path.read_text(encoding="utf-8")
          old = '''        return _nonnegative_int(page.get("comment_count_l1")) or _nonnegative_int(
              page.get("comment_count")
          )'''.replace("              page", "            page").replace("          )", "        )")
          new = '''        root_total = _nonnegative_int(page.get("comment_count_l1"))
          if root_total is not None:
              return root_total
          return _nonnegative_int(page.get("comment_count"))'''.replace("          if", "        if").replace("              return", "            return").replace("          return", "        return")
          if text.count(old) != 1:
              raise SystemExit(f"expected zero-count fragment exactly once, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/aima_ugc/bootstrap/collection_scope.py
          git commit -m "修复小红书评论总数归零解析"
          git push origin HEAD:${GITHUB_HEAD_REF}
