name: Stage 7 Commit Endpoint Ledger Evidence

on:
  push:
    branches:
      - feature/stage7-completion
    paths:
      - ".github/workflows/stage7-commit-endpoint-ledger-evidence.yml"

permissions:
  contents: write

jobs:
  commit-evidence:
    name: Commit verified endpoint ledger evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_ARTIFACT_ID: "9265588134"
      SOURCE_ARTIFACT_SHA256: "72841a94ca2fd193689aa87cb420e7a2d02574d1504e7070ca9a7b2d4bcef696"
      SOURCE_RUN_ID: "31954514173"
      TARGET_DIR: "tests/fixtures/providers/tikhub/endpoint_ledger/2026-08-16"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage7-completion
          fetch-depth: 0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Download exact successful endpoint ledger artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            --output "${RUNNER_TEMP}/endpoint-ledger.zip"
          actual="$(sha256sum "${RUNNER_TEMP}/endpoint-ledger.zip" | awk '{print $1}')"
          test "${actual}" = "${SOURCE_ARTIFACT_SHA256}"
          mkdir -p "${RUNNER_TEMP}/endpoint-ledger"
          unzip -q "${RUNNER_TEMP}/endpoint-ledger.zip" -d "${RUNNER_TEMP}/endpoint-ledger"
          test -s "${RUNNER_TEMP}/endpoint-ledger/manifest.json"

      - name: Revalidate strict de-identification
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="${RUNNER_TEMP}/endpoint-ledger" uv run python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_DIR"])
          bad_domains = (
              "douyinpic.com",
              "douyinvod.com",
              "hdslb.com",
              "kuaishou.com",
              "weibo.cn",
              "weibo.com",
              "xhscdn.com",
              "xhslink.com",
          )
          long_digits = re.compile(r"(?<![A-Za-z0-9_-])\d{11,}(?![A-Za-z0-9_-])")
          for path in root.rglob("*.json"):
              text = path.read_text(encoding="utf-8")
              lower = text.lower()
              if any(domain in lower for domain in bad_domains):
                  raise SystemExit(f"de-identification domain leak: {path}")
              if "tos-cn-" in lower or "p3-sign.douyinpic" in lower:
                  raise SystemExit(f"de-identification media resource leak: {path}")
              if path.name == "response.sanitized.json":
                  if "http://" in lower or "https://" in lower or '"//' in text:
                      raise SystemExit(f"response resource URL leak: {path}")
                  if long_digits.search(text):
                      raise SystemExit(f"response long numeric identifier leak: {path}")
              json.loads(text)
          print("endpoint ledger evidence revalidated")
          PY

      - name: Consolidate by platform for long-term audit
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "${TARGET_DIR}"
          mkdir -p "${TARGET_DIR}"
          SOURCE_DIR="${RUNNER_TEMP}/endpoint-ledger" TARGET_DIR="${TARGET_DIR}" uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["SOURCE_DIR"])
          target = Path(os.environ["TARGET_DIR"])
          manifest = json.loads((source / "manifest.json").read_text(encoding="utf-8"))
          by_platform: dict[str, list[dict[str, object]]] = {}

          for row in manifest["records"]:
              evidence_dir = source / row["evidence_dir"]
              record = {
                  "request_no": row["request_no"],
                  "label": row["label"],
                  "method": row["method"],
                  "endpoint": row["endpoint"],
                  "http_status": row["http_status"],
                  "planned_cost_usd": row["planned_cost_usd"],
                  "request": json.loads(
                      (evidence_dir / "request.sanitized.json").read_text(encoding="utf-8")
                  ),
                  "response": json.loads(
                      (evidence_dir / "response.sanitized.json").read_text(encoding="utf-8")
                  ),
              }
              by_platform.setdefault(row["platform"], []).append(record)

          common = {
              "github_run_id": manifest["github_run_id"],
              "captured_at": manifest["captured_at"],
              "base_url": manifest["base_url"],
              "keyword": manifest["keyword"],
              "hidden_retries": manifest["hidden_retries"],
          }
          for platform, records in sorted(by_platform.items()):
              payload = {
                  "schema_version": "tikhub-endpoint-ledger-platform.v1",
                  "source_manifest": common,
                  "platform": platform,
                  "records": records,
              }
              (target / f"{platform}.sanitized.json").write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          (target / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat > "${TARGET_DIR}/README.md" <<EOF
          # TikHub 五平台主链真实 Endpoint Ledger

          本目录来自 GitHub-hosted Runner 的受限真实 Probe，源 Run：\`${SOURCE_RUN_ID}\`。

          - Provider Base URL：\`https://api.tikhub.io\`
          - 关键词：\`爱玛\`
          - 真实请求数：22
          - 隐藏重试：0
          - 所有业务 endpoint：HTTP 200
          - 原始真实响应只在 Runner 内存/临时盘存在；提交内容已经严格去标识化。
          - 每个平台一个 \`*.sanitized.json\`，其中按 endpoint 保存实际 Request 与 Response。
          - 该目录是人工核查事实源；生产 Mapper 回归仍可继续使用平台目录下更小的结构 Fixture。

          任何新 Provider 版本或 endpoint 变更都必须重新执行受限真实 Probe，不得手工猜响应字段。
          EOF

      - name: Validate staged evidence
        shell: bash
        run: |
          set -euo pipefail
          find "${TARGET_DIR}" -type f -name '*.json' -print0 | while IFS= read -r -d '' file; do
            python -m json.tool "${file}" >/dev/null
          done
          uv run python scripts/quality/scan_secrets.py
          git add "${TARGET_DIR}"
          git diff --cached --check

      - name: Commit evidence and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/stage7-completion
          test "$(git rev-parse origin/feature/stage7-completion)" = "${GITHUB_SHA}"
          git rm .github/workflows/stage7-commit-endpoint-ledger-evidence.yml
          git add "${TARGET_DIR}"
          git diff --cached --check
          git config user.name "AIMA Stage 7 Runner"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "保存 TikHub 五平台主链真实请求响应证据"
          git push origin HEAD:feature/stage7-completion
