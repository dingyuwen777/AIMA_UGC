name: TikHub Test Development Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  targeted:
    if: github.head_ref == 'agent/tikhub-test-debug' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Apply multi-keyword implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ROOT = Path("backend/src/aima_ugc/adapters/providers/tikhub_test")

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"{path}: expected snippet not found: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          runner = ROOT / "runner.py"
          runner_text = runner.read_text(encoding="utf-8")
          if "def _normalize_keywords(" not in runner_text:
              replace_once(
                  runner,
                  "from __future__ import annotations\n\nfrom dataclasses import dataclass\n",
                  "from __future__ import annotations\n\nfrom collections.abc import Sequence\nfrom dataclasses import dataclass\n",
              )
              replace_once(
                  runner,
                  "        platform: tikhub_runtime.TikHubPlatform,\n        keyword: str,\n        search_config: dict[str, object],\n",
                  "        platform: tikhub_runtime.TikHubPlatform,\n        keywords: tuple[str, ...],\n        search_config: dict[str, object],\n",
              )
              replace_once(
                  runner,
                  "        if not keyword.strip():\n            raise ValueError(\"keyword 不能为空\")\n        limits.validate()\n        self.platform = platform\n        self.keyword = keyword.strip()\n",
                  "        limits.validate()\n        self.platform = platform\n        self.keywords = keywords\n",
              )
              replace_once(
                  runner,
                  "        self._root_comment_count = 0\n        self._reply_count = 0\n        self._search_stop_reason: str | None = None\n",
                  "        self._root_comment_count = 0\n        self._reply_count = 0\n        self._search_stop_reasons: dict[str, str] = {}\n        self._matched_keywords: dict[str, list[str]] = {}\n",
              )
              replace_once(
                  runner,
                  "                self._run_search(transport)\n",
                  "                for keyword in self.keywords:\n                    if self._content_limit_reached():\n                        break\n                    self._run_search(transport, keyword)\n",
              )
              replace_once(
                  runner,
                  "            workbook_path = write_review_workbook(\n                tuple(self._blocks),\n                self.store.review_dir / f\"{self.platform}_review.xlsx\",\n            )\n",
                  "            workbook_path = write_review_workbook(\n                tuple(self._blocks),\n                self.store.review_dir / f\"{self.platform}_raw_data.xlsx\",\n                matched_keywords={\n                    content_id: tuple(values)\n                    for content_id, values in self._matched_keywords.items()\n                },\n            )\n",
              )
              replace_once(
                  runner,
                  "    def _run_search(self, transport: TikHubHttpTransport) -> None:\n",
                  "    def _run_search(self, transport: TikHubHttpTransport, keyword: str) -> None:\n",
              )
              replace_once(runner, "                keyword=self.keyword,\n", "                keyword=keyword,\n")
              replace_once(runner, "                        source_value=self.keyword,\n", "                        source_value=keyword,\n")
              replace_once(
                  runner,
                  "                content_id = content.external_content_id\n                if content_id in self._seen_contents:\n                    continue\n",
                  "                content_id = content.external_content_id\n                matches = self._matched_keywords.setdefault(content_id, [])\n                if keyword not in matches:\n                    matches.append(keyword)\n                if content_id in self._seen_contents:\n                    continue\n",
              )
              runner_text = runner.read_text(encoding="utf-8")
              runner_text = runner_text.replace(
                  "self._search_stop_reason = \"content_target_reached\"",
                  "self._search_stop_reasons[keyword] = \"content_target_reached\"",
              )
              runner_text = runner_text.replace(
                  "self._search_stop_reason = advance.stop_reason or \"provider_exhausted\"",
                  "self._search_stop_reasons[keyword] = advance.stop_reason or \"provider_exhausted\"",
              )
              runner_text = runner_text.replace(
                  "self._search_stop_reason = \"max_search_pages_reached\"",
                  "self._search_stop_reasons[keyword] = \"max_search_pages_reached\"",
              )
              runner.write_text(runner_text, encoding="utf-8")
              replace_once(
                  runner,
                  "            \"keyword\": self.keyword,\n",
                  "            \"keyword\": self.keywords[0] if len(self.keywords) == 1 else None,\n            \"keywords\": list(self.keywords),\n            \"matched_keywords\": {\n                content_id: list(values)\n                for content_id, values in self._matched_keywords.items()\n            },\n",
              )
              replace_once(
                  runner,
                  "            \"search_stop_reason\": self._search_stop_reason,\n",
                  "            \"search_stop_reason\": (\n                self._search_stop_reasons.get(self.keywords[0])\n                if len(self.keywords) == 1\n                else None\n            ),\n            \"search_stop_reasons\": dict(self._search_stop_reasons),\n",
              )
              replace_once(
                  runner,
                  "    platform: tikhub_runtime.TikHubPlatform,\n    keyword: str,\n    search_config: dict[str, object] | None = None,\n",
                  "    platform: tikhub_runtime.TikHubPlatform,\n    keyword: str | None = None,\n    keywords: Sequence[str] | None = None,\n    search_config: dict[str, object] | None = None,\n",
              )
              replace_once(
                  runner,
                  "    config = TikHubTestConfig.load(env_file)\n    root = Path(output_root) if output_root is not None else _DEFAULT_OUTPUT_ROOT\n    return _TikHubDebugRunner(\n        platform=platform,\n        keyword=keyword,\n",
                  "    config = TikHubTestConfig.load(env_file)\n    normalized_keywords = _normalize_keywords(keyword=keyword, keywords=keywords)\n    root = Path(output_root) if output_root is not None else _DEFAULT_OUTPUT_ROOT\n    return _TikHubDebugRunner(\n        platform=platform,\n        keywords=normalized_keywords,\n",
              )
              replace_once(
                  runner,
                  "\n\ndef _review_content(\n",
                  "\n\ndef _normalize_keywords(\n    *,\n    keyword: str | None,\n    keywords: Sequence[str] | None,\n) -> tuple[str, ...]:\n    if keyword is not None and keywords is not None:\n        raise ValueError(\"keyword 与 keywords 不能同时设置\")\n    candidates: Sequence[str]\n    if keywords is not None:\n        candidates = keywords\n    elif keyword is not None:\n        candidates = (keyword,)\n    else:\n        candidates = (\"爱玛\",)\n\n    normalized: list[str] = []\n    for item in candidates:\n        if not isinstance(item, str):\n            raise TypeError(\"keywords 中的每一项都必须是字符串\")\n        value = item.strip()\n        if not value:\n            raise ValueError(\"keywords 不能包含空关键词\")\n        if value not in normalized:\n            normalized.append(value)\n    if not normalized:\n        raise ValueError(\"keywords 不能为空\")\n    return tuple(normalized)\n\n\ndef _review_content(\n",
              )

          excel = ROOT / "excel.py"
          excel_text = excel.read_text(encoding="utf-8")
          if '"命中关键词"' not in excel_text:
              replace_once(
                  excel,
                  '    "Raw定位",\n)\n_COMMENT_HEADERS = (\n    "评论层级",\n',
                  '    "Raw定位",\n    "命中关键词",\n)\n_COMMENT_HEADERS = (\n',
              )
              replace_once(
                  excel,
                  "_WRAP_COLUMNS = {4, 5, 13, 14, 19, 20, 24}\n",
                  "_WRAP_COLUMNS = {4, 5, 13, 14, 15, 19, 20, 24}\n",
              )
              replace_once(excel, "    15: 10,\n", "    15: 24,\n")
              replace_once(
                  excel,
                  "def write_review_workbook(blocks: tuple[ReviewBlock, ...], path: str | Path) -> Path:\n",
                  "def write_review_workbook(\n    blocks: tuple[ReviewBlock, ...],\n    path: str | Path,\n    *,\n    matched_keywords: dict[str, tuple[str, ...]] | None = None,\n) -> Path:\n",
              )
              replace_once(
                  excel,
                  "            _write_content_row(sheet, row, block.content)\n",
                  "            _write_content_row(\n                sheet,\n                row,\n                block.content,\n                matched_keywords=(matched_keywords or {}).get(\n                    block.content.external_content_id, ()\n                ),\n            )\n",
              )
              replace_once(
                  excel,
                  "def _write_content_row(sheet: Worksheet, row: int, content: ReviewContent) -> None:\n",
                  "def _write_content_row(\n    sheet: Worksheet,\n    row: int,\n    content: ReviewContent,\n    *,\n    matched_keywords: tuple[str, ...],\n) -> None:\n",
              )
              replace_once(
                  excel,
                  "        content.raw_locator,\n    )\n",
                  "        content.raw_locator,\n        \"；\".join(matched_keywords),\n    )\n",
              )
              replace_once(
                  excel,
                  "    values: tuple[_CellValue, ...] = (\n        comment.level,\n        comment.comment_id,\n",
                  "    values: tuple[_CellValue, ...] = (\n        comment.comment_id,\n",
              )

          for name in ("xiaohongshu.py", "douyin.py", "weibo.py", "bilibili.py", "kuaishou.py"):
              path = ROOT / name
              text = path.read_text(encoding="utf-8")
              if "keywords: Sequence[str] | None" in text:
                  continue
              replace_once(
                  path,
                  "from pathlib import Path\n",
                  "from collections.abc import Sequence\nfrom pathlib import Path\n",
              )
              replace_once(
                  path,
                  '    keyword: str = "爱玛",\n',
                  "    keyword: str | None = None,\n    keywords: Sequence[str] | None = None,\n",
              )
              replace_once(
                  path,
                  "        keyword=keyword,\n",
                  "        keyword=keyword,\n        keywords=keywords,\n",
              )
          PY

          uv run ruff format backend/src/aima_ugc/adapters/providers/tikhub_test tests/unit/collection/test_tikhub_test_debug_runtime.py
          uv run ruff check --fix backend/src/aima_ugc/adapters/providers/tikhub_test tests/unit/collection/test_tikhub_test_debug_runtime.py
          uv run ruff format --check backend/src/aima_ugc/adapters/providers/tikhub_test tests/unit/collection/test_tikhub_test_debug_runtime.py
          uv run ruff check backend/src/aima_ugc/adapters/providers/tikhub_test tests/unit/collection/test_tikhub_test_debug_runtime.py
          uv run mypy backend/src
          uv run pytest \
            tests/unit/collection/test_tikhub_test_debug.py \
            tests/unit/collection/test_tikhub_test_debug_runtime.py \
            tests/unit/collection/test_xhs_tikhub_operation.py \
            tests/unit/collection/test_xhs_tikhub_mapper.py \
            tests/unit/collection/test_tikhub_real_search_mappers.py \
            tests/unit/collection/test_tikhub_real_comment_mappers.py \
            tests/unit/collection/test_tikhub_real_reply_mappers.py \
            -q
          uv run python scripts/quality/scan_secrets.py

          if git diff --quiet -- backend/src/aima_ugc/adapters/providers/tikhub_test tests/unit/collection/test_tikhub_test_debug_runtime.py; then
            echo "multi-keyword implementation already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/aima_ugc/adapters/providers/tikhub_test tests/unit/collection/test_tikhub_test_debug_runtime.py
          git commit -m "实现 TikHub 多关键词去重调试"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Run targeted quality and tests
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check \
            backend/src/aima_ugc/adapters/providers/tikhub_test \
            tests/unit/collection/test_tikhub_test_debug.py \
            tests/unit/collection/test_tikhub_test_debug_runtime.py
          uv run ruff check \
            backend/src/aima_ugc/adapters/providers/tikhub_test \
            tests/unit/collection/test_tikhub_test_debug.py \
            tests/unit/collection/test_tikhub_test_debug_runtime.py
          uv run mypy backend/src
          uv run pytest \
            tests/unit/collection/test_tikhub_test_debug.py \
            tests/unit/collection/test_tikhub_test_debug_runtime.py \
            tests/unit/collection/test_xhs_tikhub_operation.py \
            tests/unit/collection/test_xhs_tikhub_mapper.py \
            tests/unit/collection/test_tikhub_real_search_mappers.py \
            tests/unit/collection/test_tikhub_real_comment_mappers.py \
            tests/unit/collection/test_tikhub_real_reply_mappers.py \
            -q
          uv run python scripts/quality/scan_secrets.py
