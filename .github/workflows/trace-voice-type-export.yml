name: Trace Voice Type Export Usage

on:
  push:
    branches:
      - feature/voice-type-taxonomy

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/voice-type-taxonomy

      - name: Trace export voice type usages
        shell: bash
        run: |
          set -euo pipefail
          echo '=== UnifiedDataExcelAnalysisV1 ==='
          rg -n --hidden --glob '!.git/**' 'UnifiedDataExcelAnalysisV1' . || true
          echo '=== concrete voice_type defaults/usages ==='
          rg -n --hidden --glob '!.git/**' 'voice_type\s*[:=].*["'"']unknown["'"']|voice_type.*unknown|unknown.*voice_type' backend tests scripts docs frontend || true
          echo '=== not_analyzed constructors/paths ==='
          rg -n --hidden --glob '!.git/**' 'not_analyzed|analysis_status' backend/src/aima_ugc tests | head -n 400 || true
