name: Temporary Validation 652

on:
  push:
    branches:
      - feature/652-hierarchical-label-multiselect

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Backend targeted validation
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check             backend/src/aima_ugc/contracts/http.py             backend/src/aima_ugc/adapters/persistence/postgres/content_queries.py             tests/api/test_stage8d_contents.py             tests/integration/content/test_stage8d_voice_plaza_runtime.py
          uv run ruff check             backend/src/aima_ugc/contracts/http.py             backend/src/aima_ugc/adapters/persistence/postgres/content_queries.py             tests/api/test_stage8d_contents.py             tests/integration/content/test_stage8d_voice_plaza_runtime.py
          uv run mypy backend/src
          uv run pytest tests/api/test_stage8d_contents.py -q

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
          npm ci --prefix frontend
      - name: Contract generation is clean
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          git diff --exit-code -- contracts frontend/src/generated/api
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py
      - name: Frontend targeted validation
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend run lint
          npm --prefix frontend run test -- --run tests/voice-plaza.spec.ts tests/workbench.spec.ts
          npm --prefix frontend run build
          npm --prefix frontend run test:e2e -- e2e/voice-plaza.spec.ts e2e/workbench.spec.ts

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/ci-postgres/data
      AIMA_LOG_DIR: .runtime/ci-postgres/logs
      AIMA_SECRET_DIR: .runtime/ci-postgres/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'ci-postgres' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"
          uv run alembic upgrade head
          uv run alembic check
      - name: PostgreSQL label-filter integration
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/content/test_stage8d_voice_plaza_runtime.py             -k "voice_plaza_analysis_idempotency_and_export_artifact" -q
