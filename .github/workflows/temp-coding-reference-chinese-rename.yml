name: Temporary Coding Reference Chinese Rename

on:
  push:
    branches:
      - refactor/coding-reference-chinese-filenames

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Rename references and migrate live links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path


          MAPPING = {
              "01_project-discovery.md": "01_项目发现与可失效缓存.md",
              "02_task-routing.md": "02_跨项目研发任务路由.md",
              "03_language-and-toolchain-profiles.md": "03_编程语言与工具链适配规则.md",
              "04_change-management.md": "04_轻量变更管理.md",
              "05_development-workflows.md": "05_设计实施与根因调试.md",
              "06_repository-constraints.md": "06_仓库边界数据交换与条件式约束.md",
              "07_validation-strategy.md": "07_通用验证与证据策略.md",
              "08_testing-strategy.md": "08_分层测试与验收策略.md",
              "09_collaboration.md": "09_多人和多智能体并行协作.md",
              "10_completion-gate.md": "10_完成定义追溯门禁.md",
              "11_verification-review.md": "11_两阶段复核与完成前验证.md",
              "12_rule-preservation-map.md": "12_规则保留映射.md",
          }
          REFERENCE_ROOT = Path(".agents/skills/coding/references")
          WORKFLOW = Path(".github/workflows/temp-coding-reference-chinese-rename.yml")


          def read_utf8(path: Path) -> str | None:
              """读取受 Git 跟踪的 UTF-8 文本；二进制或其他编码文件跳过。"""
              try:
                  return path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  return None


          def replace_live_references() -> None:
              """迁移非归档文件中的 canonical reference 文件名引用。"""
              tracked = subprocess.check_output(["git", "ls-files", "-z"])
              for raw in tracked.decode("utf-8").split("\0"):
                  if not raw or raw.startswith("changes/archive/"):
                      continue
                  path = Path(raw)
                  if not path.is_file():
                      continue
                  content = read_utf8(path)
                  if content is None:
                      continue
                  updated = content
                  for old_name, new_name in MAPPING.items():
                      updated = updated.replace(old_name, new_name)
                  if updated != content:
                      path.write_text(updated, encoding="utf-8")


          def replace_archive_requirement_sources() -> None:
              """只迁移历史 Change Traceability 的实时 Source，不改历史叙事和 Evidence。"""
              archive_root = Path("changes/archive")
              if not archive_root.is_dir():
                  return
              for path in archive_root.rglob("CHANGE.md"):
                  content = path.read_text(encoding="utf-8")
                  lines = content.splitlines(keepends=True)
                  in_traceability = False
                  changed = False
                  for index, line in enumerate(lines):
                      stripped = line.strip()
                      if stripped.startswith("# Requirement Traceability"):
                          in_traceability = True
                          continue
                      if in_traceability and stripped.startswith("#"):
                          in_traceability = False
                      if not in_traceability or not stripped.startswith("|"):
                          continue
                      parts = line.split("|")
                      if len(parts) < 6:
                          continue
                      row_id = parts[1].strip()
                      if not row_id or row_id == "ID" or set(row_id) <= {"-", ":"}:
                          continue
                      source = parts[3]
                      updated_source = source
                      for old_name, new_name in MAPPING.items():
                          updated_source = updated_source.replace(old_name, new_name)
                      if updated_source != source:
                          parts[3] = updated_source
                          lines[index] = "|".join(parts)
                          changed = True
                  if changed:
                      path.write_text("".join(lines), encoding="utf-8")


          def rename_reference_files() -> None:
              """保持 01—12 编号与顺序，仅把英文文件名主体改为中文。"""
              for old_name, new_name in MAPPING.items():
                  old_path = REFERENCE_ROOT / old_name
                  new_path = REFERENCE_ROOT / new_name
                  if not old_path.is_file():
                      raise RuntimeError(f"缺少待迁移 reference：{old_path}")
                  if new_path.exists():
                      raise RuntimeError(f"目标 reference 已存在：{new_path}")
                  old_path.rename(new_path)


          def validate_result() -> None:
              """确认编号顺序、中文目标名和 live 引用迁移完整。"""
              expected = tuple(MAPPING.values())
              actual = tuple(sorted(path.name for path in REFERENCE_ROOT.glob("*.md")))
              if actual != expected:
                  raise RuntimeError(f"reference 顺序或名称不符合预期：{actual!r}")

              tracked = subprocess.check_output(["git", "ls-files", "-z"])
              violations: list[str] = []
              for raw in tracked.decode("utf-8").split("\0"):
                  if not raw or raw.startswith("changes/archive/"):
                      continue
                  path = Path(raw)
                  if not path.is_file():
                      continue
                  content = read_utf8(path)
                  if content is None:
                      continue
                  for old_name in MAPPING:
                      if old_name in content:
                          violations.append(f"{raw}: {old_name}")
              if violations:
                  raise RuntimeError("仍存在 live 旧 reference 文件名：\n" + "\n".join(violations))

          replace_live_references()
          replace_archive_requirement_sources()
          rename_reference_files()
          validate_result()
          WORKFLOW.unlink()
          PY

          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "将 Coding reference 文件名改为中文"
          git push origin HEAD
