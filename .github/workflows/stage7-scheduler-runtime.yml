name: Stage 7 Scheduler Runtime

on:
  push:
    branches:
      - main
      - feature/stage7-completion
  pull_request:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/modules/collection/collection_run_job.py"
      - "backend/src/aima_ugc/modules/collection/planning.py"
      - "backend/src/aima_ugc/modules/collection/scheduler.py"
      - "backend/src/aima_ugc/adapters/persistence/postgres/collection_planning.py"
      - "backend/src/aima_ugc/bootstrap/scheduler.py"
      - "backend/src/aima_ugc/entrypoints/scheduler_main.py"
      - "backend/src/aima_ugc/database_schema.py"
      - "migrations/versions/20260815_0014_stage7_latest_only_scheduler_policy.py"
      - "tests/unit/collection/test_collection_run_job.py"
      - "tests/unit/collection/test_collection_planning.py"
      - "tests/unit/collection/test_scheduler.py"
      - "tests/integration/collection/test_collection_planning_repository.py"
      - "tests/integration/collection/test_stage7_scheduler_runtime_postgres.py"
      - "docs/blueprint/**"
      - "docs/collection/**"
      - "backend/src/aima_ugc/modules/collection/README.md"
      - "changes/**"
      - ".github/workflows/stage7-scheduler-runtime.yml"

permissions:
  contents: read

jobs:
  unit:
    name: Stage 7 Scheduler Unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Run Scheduler domain tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest \
            tests/unit/collection/test_collection_run_job.py \
            tests/unit/collection/test_collection_planning.py \
            tests/unit/collection/test_scheduler.py \
            -q

  postgres:
    name: Stage 7 Scheduler PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: stage7-scheduler-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/ci-stage7-scheduler/data
      AIMA_LOG_DIR: .runtime/ci-stage7-scheduler/logs
      AIMA_SECRET_DIR: .runtime/ci-stage7-scheduler/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Prepare PostgreSQL Secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'stage7-scheduler-ci' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"
      - name: Upgrade database and verify Scheduler runtime
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
          uv run pytest \
            tests/integration/collection/test_collection_planning_repository.py \
            tests/integration/collection/test_stage7_scheduler_runtime_postgres.py \
            -q
      - name: Verify previous formal revision to head
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade 20260815_0013
          uv run alembic upgrade head
          uv run alembic check
      - name: Verify base round trip
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

  quality:
    name: Stage 7 Scheduler Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Run quality gates
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check backend tests scripts
          uv run ruff format --check migrations/versions/20260815_0014_stage7_latest_only_scheduler_policy.py
          uv run ruff check backend tests scripts
          uv run ruff check migrations/versions/20260815_0014_stage7_latest_only_scheduler_policy.py
          uv run mypy backend/src
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py
