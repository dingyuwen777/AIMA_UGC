name: Stage 7 Apply TikHub API Family Evidence

on:
  push:
    branches:
      - feature/stage7-completion
    paths:
      - ".github/workflows/stage7-apply-api-family-evidence.yml"

permissions:
  actions: read
  contents: write

jobs:
  apply:
    name: Apply sanitized TikHub API family evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage7-completion
          fetch-depth: 0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Download validated sanitized artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="9261334049"
          archive="${RUNNER_TEMP}/api-family-evidence.zip"
          target="${RUNNER_TEMP}/api-family-evidence"
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output "${archive}"
          mkdir -p "${target}"
          unzip -q "${archive}" -d "${target}"
          test -s "${target}/summary.json"
          python -m json.tool "${target}/summary.json" >/dev/null

      - name: Apply evidence on latest branch state
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin feature/stage7-completion
          target="tests/fixtures/providers/tikhub/api_family/2026-08-16"
          test ! -e "${target}"
          mkdir -p "$(dirname "${target}")"
          cp -R "${RUNNER_TEMP}/api-family-evidence" "${target}"
          python scripts/quality/scan_secrets.py
          git add "${target}"
          git diff --cached --check

      - name: Commit sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/stage7-apply-api-family-evidence.yml \
            .github/workflows/stage7-tikhub-api-family-evidence.yml \
            scripts/dev/probe_tikhub_api_family_evidence_once.py
          git add tests/fixtures/providers/tikhub/api_family/2026-08-16
          git diff --cached --check
          git config user.name "AIMA Stage 7 Runner"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "保存 TikHub API family 真实对照证据"
          git push origin HEAD:feature/stage7-completion
