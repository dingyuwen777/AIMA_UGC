name: Offline Reporting DOCX Format

on:
  push:
    branches:
      - feature/offline-reporting

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
      - name: Format DOCX package
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format backend/src/aima_ugc/platform/reporting/docx_package.py
          if git diff --quiet -- backend/src/aima_ugc/platform/reporting/docx_package.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/src/aima_ugc/platform/reporting/docx_package.py
          git commit -m '格式化：整理DOCX报告实现 [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
