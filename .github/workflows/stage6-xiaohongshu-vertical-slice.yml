name: Stage 6 Xiaohongshu Vertical Slice

on:
  push:
    branches:
      - main
      - feature/stage6-xiaohongshu-vertical-slice
  pull_request:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/adapters/providers/tikhub/**"
      - "backend/src/aima_ugc/modules/content/**"
      - "backend/src/aima_ugc/modules/collection/**"
      - "backend/src/aima_ugc/adapters/persistence/postgres/**"
      - "backend/src/aima_ugc/database_schema.py"
      - "migrations/**"
      - "tests/unit/collection/**"
      - "tests/unit/content/**"
      - "tests/integration/collection/**"
      - "tests/integration/content/**"
      - "tests/contracts/test_provider_v1.py"
      - "tests/fixtures/providers/tikhub/xiaohongshu/**"
      - ".github/workflows/stage6-xiaohongshu-vertical-slice.yml"
      - "docs/blueprint/**"
      - "docs/04_测试与调试说明.md"
      - "changes/**"

permissions:
  contents: read

jobs:
  unit:
    name: Stage 6 Xiaohongshu Unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Run Stage 6 unit and contract tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/collection tests/unit/content tests/contracts/test_provider_v1.py -q

  postgres:
    name: Stage 6 Xiaohongshu PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: stage6-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/ci-stage6/data
      AIMA_LOG_DIR: .runtime/ci-stage6/logs
      AIMA_SECRET_DIR: .runtime/ci-stage6/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Prepare PostgreSQL Secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'stage6-ci' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"
      - name: Upgrade database
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
      - name: Run Collection and Stage 6 PostgreSQL integration
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/collection tests/integration/content -q
      - name: Verify Stage 5D revision to head
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade 20260814_0005
          uv run alembic upgrade head
          uv run alembic check
      - name: Verify first Stage 6 revision to head
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade 20260814_0006
          uv run alembic upgrade head
          uv run alembic check
      - name: Verify previous Stage 6 revision to head
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade 20260814_0008
          uv run alembic upgrade head
          uv run alembic check
      - name: Verify pre-Coverage head to current head
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade 20260817_0015
          uv run python - <<'PY'
          from sqlalchemy import inspect

          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.database import DatabaseRuntime

          runtime = DatabaseRuntime(load_settings())
          try:
              columns = {
                  item["name"]
                  for item in inspect(runtime.engine).get_columns(
                      "comment_coverage_observations"
                  )
              }
          finally:
              runtime.dispose()
          assert "sample_mode" not in columns, columns
          assert "sort_mode" not in columns, columns
          assert "target_count" not in columns, columns
          assert "stop_reason" not in columns, columns
          PY
          uv run alembic upgrade head
          uv run alembic check
      - name: Verify base round trip
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

  quality:
    name: Stage 6 Xiaohongshu Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Run quality gates
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check backend tests scripts
          uv run ruff check backend tests scripts
          uv run mypy backend/src
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py
