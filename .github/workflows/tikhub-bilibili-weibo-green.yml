name: TikHub Debug Run Summary Green

on:
  push:
    branches: [agent/tikhub-test-debug]
    paths: [".github/workflows/tikhub-bilibili-weibo-green.yml"]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/tikhub-test-debug
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Prepare locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Replace forbidden standalone manifest name
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path("backend/src/aima_ugc/adapters/providers/tikhub_test/core.py"),
              Path("backend/src/aima_ugc/adapters/providers/tikhub_test/runner.py"),
              Path("backend/src/aima_ugc/adapters/providers/tikhub_test/README.md"),
              Path("tests/unit/collection/test_tikhub_test_debug.py"),
              Path("tests/unit/collection/test_tikhub_test_debug_runtime.py"),
              Path("changes/active/CHG-20260817-tikhub-debug-harness/CHANGE.md"),
          ]
          replacements = (
              ("manifest.json", "run_summary.json"),
              ("manifest_path", "run_summary_path"),
              ("write_manifest", "write_run_summary"),
              ("tikhub_test.manifest", "tikhub_test.run_summary"),
          )
          changed = []
          for path in targets:
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))
          if not changed:
              raise SystemExit("no run-summary replacements were applied")
          print("updated", len(changed), "files")
          PY
          uv run ruff format backend/src/aima_ugc/adapters/providers/tikhub_test tests/unit/collection/test_tikhub_test_debug.py tests/unit/collection/test_tikhub_test_debug_runtime.py
          uv run ruff check --fix backend/src/aima_ugc/adapters/providers/tikhub_test tests/unit/collection/test_tikhub_test_debug.py tests/unit/collection/test_tikhub_test_debug_runtime.py
      - name: Verify Green
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check backend tests scripts
          uv run ruff check backend tests scripts
          uv run mypy backend/src
          uv run pytest \
            tests/unit/collection/test_tikhub_test_debug.py \
            tests/unit/collection/test_tikhub_test_debug_runtime.py \
            -q
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py
      - name: Commit verified run summary rename
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/aima_ugc/adapters/providers/tikhub_test/core.py \
            backend/src/aima_ugc/adapters/providers/tikhub_test/runner.py \
            backend/src/aima_ugc/adapters/providers/tikhub_test/README.md \
            tests/unit/collection/test_tikhub_test_debug.py \
            tests/unit/collection/test_tikhub_test_debug_runtime.py \
            changes/active/CHG-20260817-tikhub-debug-harness/CHANGE.md
          git commit -m "统一 TikHub 调试运行清单命名"
          git push origin HEAD:agent/tikhub-test-debug
