name: TikHub Debug README Format Green

on:
  push:
    branches: [agent/tikhub-test-debug]
    paths: [".github/workflows/tikhub-bilibili-weibo-green.yml"]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/tikhub-test-debug
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Prepare locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Format and verify TikHub debug README
        shell: bash
        run: |
          set -euo pipefail
          target="backend/src/aima_ugc/adapters/providers/tikhub_test/README.md"
          uv run ruff format "${target}"
          uv run ruff format --check backend tests scripts
          uv run ruff check backend tests scripts
          uv run mypy backend/src
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py
      - name: Commit verified formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/src/aima_ugc/adapters/providers/tikhub_test/README.md; then
            echo "README already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/aima_ugc/adapters/providers/tikhub_test/README.md
          git commit -m "修正 TikHub 调试说明格式"
          git push origin HEAD:agent/tikhub-test-debug
