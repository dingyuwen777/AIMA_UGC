name: Platform Unification Green Fix

on:
  push:
    branches:
      - refactor/unify-platform-identifiers

permissions:
  contents: write

jobs:
  apply-once:
    if: github.event.head_commit.message == '执行平台统一 Green 修复'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v6.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install locked environments
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.12.3'
          uv sync --locked
          npm --prefix frontend ci
      - name: Apply targeted source renames and fixes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dev/_fix_platform_unification_green.py
          uv run ruff check --fix backend tests scripts migrations/versions/20260822_0024_unify_platform_identifiers.py
          uv run ruff format backend tests scripts migrations/versions/20260822_0024_unify_platform_identifiers.py
      - name: Regenerate contracts and frontend client
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          git diff --check
      - name: Commit generated fixes to development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '修复平台统一完整名称残留'
          git push origin HEAD:refactor/unify-platform-identifiers
      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest \
            tests/contracts/test_platform_identifier_consistency.py \
            tests/unit/collection/test_scheduled_scope_snapshot.py \
            tests/unit/collection/test_provider_persistence.py \
            tests/unit/collection/test_imports_test_export.py \
            -q
