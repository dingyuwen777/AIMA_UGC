name: Platform Unification Green Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'refactor/unify-platform-identifiers'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refactor/unify-platform-identifiers
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24.19.0'
      - name: Install locked environments
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'uv==0.12.3'
          uv lock --check
          uv sync --locked
          npm --prefix frontend ci
      - name: Apply mechanical platform-name cleanup
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dev/_fix_platform_unification_green.py
          uv run ruff format backend tests scripts migrations/versions/20260822_0024_unify_platform_identifiers.py
      - name: Regenerate contracts and frontend client
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          git diff --check
      - name: Commit mechanical fixes to development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No mechanical fixes to commit.'
          else
            git commit -m '收口五平台完整名称与生成物'
            git push origin HEAD:refactor/unify-platform-identifiers
          fi
      - name: Run focused quality and regression tests
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check backend tests scripts migrations/versions/20260822_0024_unify_platform_identifiers.py
          uv run pytest \
            tests/contracts/test_platform_identifier_consistency.py \
            tests/unit/collection/test_scheduled_scope_snapshot.py \
            tests/unit/collection/test_provider_persistence.py \
            tests/unit/collection/test_imports_test_export.py \
            tests/unit/platform/test_excel_export.py \
            -q
