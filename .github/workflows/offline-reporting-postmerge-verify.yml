name: Offline Reporting Post-Merge Verify
# 显式触发对已合并 main@46a077c 的新鲜验证。

on:
  push:
    branches:
      - verify/offline-reporting-postmerge
    paths-ignore:
      - postmerge_verification_evidence.json

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN_SHA: 46a077c26bab5981767003121934a7d45e8d8bf0
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify branch is based on merged main
        id: ancestry
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${EXPECTED_MAIN_SHA}^{commit}"
          test "$(git merge-base HEAD "${EXPECTED_MAIN_SHA}")" = "${EXPECTED_MAIN_SHA}"
          git diff --name-only "${EXPECTED_MAIN_SHA}"..HEAD | tee /tmp/postmerge-diff.txt
          test "$(wc -l < /tmp/postmerge-diff.txt)" -eq 1
          grep -Fx '.github/workflows/offline-reporting-postmerge-verify.yml' /tmp/postmerge-diff.txt

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install locked uv
        id: install_uv
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          test "$(uv --version | awk '{print $2}')" = "${UV_VERSION}"

      - name: Verify locked environment
        id: locked_env
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked
          uv run python -c "import aima_ugc"

      - name: Target report and preserved-main tests
        id: target
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest \
            tests/unit/platform/test_reporting_default_template.py \
            tests/unit/platform/test_offline_reporting.py \
            tests/unit/platform/test_imports_test_reporting.py \
            tests/unit/platform/test_docx_package_structure.py \
            tests/unit/collection/test_p1g_imports_run_all.py \
            tests/unit/collection/test_imports_test_run_directory.py -q \
            2>&1 | tee /tmp/target.txt

      - name: Repository static and quality gates
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/static.txt
          uv run ruff format --check backend tests scripts 2>&1 | tee -a /tmp/static.txt
          uv run ruff check backend tests scripts 2>&1 | tee -a /tmp/static.txt
          uv run mypy backend/src 2>&1 | tee -a /tmp/static.txt
          uv run python scripts/quality/check_architecture.py 2>&1 | tee -a /tmp/static.txt
          uv run python scripts/quality/check_table_ownership.py 2>&1 | tee -a /tmp/static.txt
          uv run python scripts/quality/check_docs.py 2>&1 | tee -a /tmp/static.txt
          uv run python scripts/quality/scan_secrets.py 2>&1 | tee -a /tmp/static.txt

      - name: Full unit tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/unit -q 2>&1 | tee /tmp/unit.txt

      - name: Verify shared template in Wheel
        id: wheel
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/wheel.txt
          rm -rf dist /tmp/aima-postmerge-wheel
          uv build --wheel 2>&1 | tee -a /tmp/wheel.txt
          python -m venv /tmp/aima-postmerge-wheel
          /tmp/aima-postmerge-wheel/bin/python -m pip install dist/*.whl 2>&1 | tee -a /tmp/wheel.txt
          /tmp/aima-postmerge-wheel/bin/python - <<'PY' 2>&1 | tee -a /tmp/wheel.txt
          from aima_ugc.platform.reporting import DEFAULT_REPORT_TEMPLATE_PATH
          print(DEFAULT_REPORT_TEMPLATE_PATH)
          if not DEFAULT_REPORT_TEMPLATE_PATH.is_file():
              raise SystemExit('installed wheel missing report_template.md')
          if DEFAULT_REPORT_TEMPLATE_PATH.parent.name != 'reporting':
              raise SystemExit('shared template is not owned by reporting package')
          PY

      - name: Verify merged imports capabilities coexist
        id: compatibility
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run python - <<'PY' 2>&1 | tee /tmp/compatibility.txt
          import inspect
          from aima_ugc.adapters.providers.imports_test import test as entry
          from aima_ugc.platform.reporting import DEFAULT_REPORT_TEMPLATE_PATH

          required_functions = (
              'convert', 'filter_keywords', 'deduplicate', 'ingest_database',
              'label_sentiment', 'recalculate_cost', 'export_labeled_excel',
              'generate_report', 'run_all',
          )
          missing = [name for name in required_functions if not hasattr(entry, name)]
          if missing:
              raise SystemExit(f'missing imports_test functions: {missing}')
          source = inspect.getsource(entry)
          markers = (
              'INPUT_XLSX_FILES', 'ExcelBatchConversionSummary',
              'convert_excel_files_to_canonical_jsonl',
              'ingest_excel_files_run_to_postgres', 'LLMRequestAuditWriter',
              'load_llm_pricing', 'recalculate_llm_request_costs',
              'label_sentiment(run_dir=run_dir)',
              'export_labeled_excel(run_dir=run_dir)', 'generate_report(',
          )
          missing_markers = [item for item in markers if item not in source]
          if missing_markers:
              raise SystemExit(f'merged main lost capabilities: {missing_markers}')
          if not DEFAULT_REPORT_TEMPLATE_PATH.is_file():
              raise SystemExit('shared default report template missing')
          print('merged main imports/report capabilities coexist')
          PY

      - name: Render Word from shared default template
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/render.txt
          sudo apt-get update -qq 2>&1 | tee -a /tmp/render.txt
          sudo apt-get install -y --no-install-recommends libreoffice-writer 2>&1 | tee -a /tmp/render.txt >/dev/null
          rm -rf /tmp/aima-postmerge-report
          mkdir -p /tmp/aima-postmerge-report
          uv run python - <<'PY' 2>&1 | tee -a /tmp/render.txt
          from pathlib import Path
          from openpyxl import Workbook
          from aima_ugc.platform.reporting import DEFAULT_REPORT_TEMPLATE_PATH, generate_excel_report

          root = Path('/tmp/aima-postmerge-report')
          excel = root / 'labeled_data.xlsx'
          wb = Workbook()
          content = wb.active
          content.title = '内容'
          content.append(['平台','标题','正文','作者','发布时间','内容链接','命中关键词','情感标签','一级标签','二级标签'])
          content.append(['抖音','样例1','正文','作者A','2026-08-20 10:00:00','https://example.com/1','爱玛','正面','品牌评价','口碑与信任'])
          content.append(['小红书','样例2','正文','作者B','2026-08-19 11:00:00','https://example.com/2','爱玛；马赫','负面','售后服务','客服与服务态度'])
          labels = wb.create_sheet('标签明细')
          labels.append(['内容ID','平台','标题','情感标签','一级标签','二级标签','内容链接'])
          labels.append(['1','抖音','样例1','正面','品牌评价','口碑与信任','https://example.com/1'])
          labels.append(['2','小红书','样例2','负面','售后服务','客服与服务态度','https://example.com/2'])
          comments = wb.create_sheet('评论')
          comments.append(['平台','内容ID','评论层级','评论ID','根评论ID','父评论ID','作者','评论内容','评论时间','评论点赞','回复数','来源Provider','Raw/来源定位'])
          wb.save(excel)
          wb.close()
          summary = generate_excel_report(input_path=excel, output_dir=root / 'reports')
          print(f'template={summary.template_path}')
          print(f'charts={summary.word_chart_count}')
          if summary.template_path != DEFAULT_REPORT_TEMPLATE_PATH:
              raise SystemExit('report did not use shared default template')
          if summary.word_chart_count != 9:
              raise SystemExit(f'expected 9 charts, got {summary.word_chart_count}')
          PY
          test -s /tmp/aima-postmerge-report/reports/report.md
          test -s /tmp/aima-postmerge-report/reports/report.docx
          mkdir -p /tmp/aima-postmerge-report/rendered
          libreoffice --headless --convert-to pdf --outdir /tmp/aima-postmerge-report/rendered /tmp/aima-postmerge-report/reports/report.docx 2>&1 | tee -a /tmp/render.txt
          test -s /tmp/aima-postmerge-report/rendered/report.pdf
          stat --printf='%s\n' /tmp/aima-postmerge-report/rendered/report.pdf > /tmp/pdf-size.txt

      - name: Record post-merge evidence
        if: always()
        env:
          ANCESTRY: ${{ steps.ancestry.outcome }}
          INSTALL_UV: ${{ steps.install_uv.outcome }}
          LOCKED_ENV: ${{ steps.locked_env.outcome }}
          TARGET: ${{ steps.target.outcome }}
          STATIC: ${{ steps.static.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          WHEEL: ${{ steps.wheel.outcome }}
          COMPATIBILITY: ${{ steps.compatibility.outcome }}
          RENDER: ${{ steps.render.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          def tail(path: str, n: int) -> list[str]:
              p = Path(path)
              return p.read_text(encoding='utf-8', errors='replace').splitlines()[-n:] if p.is_file() else []

          checks = {
              'main_ancestry': os.environ['ANCESTRY'],
              'install_uv': os.environ['INSTALL_UV'],
              'locked_environment': os.environ['LOCKED_ENV'],
              'target_tests': os.environ['TARGET'],
              'static_quality': os.environ['STATIC'],
              'full_unit_tests': os.environ['UNIT'],
              'wheel_shared_template': os.environ['WHEEL'],
              'merged_capabilities': os.environ['COMPATIBILITY'],
              'libreoffice_render': os.environ['RENDER'],
          }
          result = 'success' if all(v == 'success' for v in checks.values()) else 'failure'
          pdf = Path('/tmp/pdf-size.txt')
          payload = {
              'schema_version': 'offline-reporting-postmerge-verification.v1',
              'tested_main_sha': os.environ['EXPECTED_MAIN_SHA'],
              'verification_branch_head': os.environ['GITHUB_SHA'],
              'verified_at': datetime.now(UTC).isoformat(),
              'result': result,
              'checks': checks,
              'target_tail': tail('/tmp/target.txt', 10),
              'static_tail': tail('/tmp/static.txt', 20),
              'unit_tail': tail('/tmp/unit.txt', 10),
              'wheel_tail': tail('/tmp/wheel.txt', 10),
              'compatibility_tail': tail('/tmp/compatibility.txt', 8),
              'render_tail': tail('/tmp/render.txt', 14),
              'rendered_pdf_bytes': int(pdf.read_text().strip()) if pdf.is_file() else None,
          }
          Path('postmerge_verification_evidence.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add postmerge_verification_evidence.json
          git commit -m '验证：记录离线报告合并后 main 门禁结果 [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          test "$ANCESTRY" = success
          test "$INSTALL_UV" = success
          test "$LOCKED_ENV" = success
          test "$TARGET" = success
          test "$STATIC" = success
          test "$UNIT" = success
          test "$WHEEL" = success
          test "$COMPATIBILITY" = success
          test "$RENDER" = success
