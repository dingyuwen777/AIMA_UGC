name: TikHub System Green Patch V2

on:
  push:
    branches: [agent/tikhub-test-debug]
    paths: [".github/workflows/tikhub-system-green-patch-v2.yml"]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: tikhub-green-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/ci-tikhub-green/data
      AIMA_LOG_DIR: .runtime/ci-tikhub-green/logs
      AIMA_SECRET_DIR: .runtime/ci-tikhub-green/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/tikhub-test-debug
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Prepare locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'tikhub-green-ci' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"
          uv run alembic upgrade head
      - name: Apply verified design fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def rep(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected source fragment missing: {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Shared Collection rule.
          p = "backend/src/aima_ugc/modules/collection/decision.py"
          rep(p, "from __future__ import annotations\n\nfrom aima_ugc.contracts.collection import (", "from __future__ import annotations\n\nfrom collections.abc import AbstractSet, Sequence\n\nfrom aima_ugc.contracts.collection import (")
          rep(p, "\n\nclass CollectionDecisionService:\n", '''\n\ndef known_comment_boundary_reached(\n    page_comment_ids: Sequence[str],\n    known_comment_ids: AbstractSet[str],\n) -> bool:\n    \"\"\"最新排序页进入连续历史尾部时，允许调用方停止请求下一页。\"\"\"\n    if not page_comment_ids or not known_comment_ids:\n        return False\n    first_known = next(\n        (index for index, comment_id in enumerate(page_comment_ids) if comment_id in known_comment_ids),\n        None,\n    )\n    if first_known is None:\n        return False\n    return all(comment_id in known_comment_ids for comment_id in page_comment_ids[first_known:])\n\n\nclass CollectionDecisionService:\n''')

          # XHS verified incremental capability.
          p = "backend/src/aima_ugc/adapters/providers/tikhub/capabilities.py"
          old = '''        ProviderOperationCapabilityV1(\n            business_operation="comments",\n            provider_operations=("get_note_comments",),\n            comment_sort_modes=("latest",),\n            supports_reply_count=True,\n            supports_sub_comments=True,\n            supports_incremental_comment_sort=False,\n            provider_page_size_policy="provider_default",\n        ),\n'''
          rep(p, old, old.replace("supports_incremental_comment_sort=False", "supports_incremental_comment_sort=True"))

          # PostgreSQL known root IDs.
          p = "backend/src/aima_ugc/adapters/persistence/postgres/collection_content.py"
          rep(p, "from aima_ugc.modules.content.tables import accounts_table, contents_table\n", "from aima_ugc.modules.content.tables import accounts_table, comments_table, contents_table\n")
          rep(p, "\n\nclass PostgresFencedCollectionIngestionWriter:\n", '''\n\n    def known_root_comment_ids(self, content_id: UUID) -> frozenset[str]:\n        \"\"\"一次读取目标内容当前已知一级评论 ID。\"\"\"\n        session = self._session_factory()\n        try:\n            with session.begin():\n                values = session.scalars(\n                    select(comments_table.c.external_comment_id).where(\n                        comments_table.c.content_id == content_id,\n                        comments_table.c.parent_comment_id.is_(None),\n                    )\n                ).all()\n                return frozenset(str(value) for value in values if value)\n        finally:\n            session.close()\n\n\nclass PostgresFencedCollectionIngestionWriter:\n''')

          # Formal Scope execution.
          p = "backend/src/aima_ugc/bootstrap/collection_scope.py"
          rep(p, "from aima_ugc.modules.collection.decision import CollectionDecisionService\n", "from aima_ugc.modules.collection.decision import (\n    CollectionDecisionService,\n    known_comment_boundary_reached,\n)\n")
          rep(p, "        last_executed: _ExecutedCall | None = None\n\n        for _page_no in range(1, _MAX_COMMENT_PAGES + 1):", "        last_executed: _ExecutedCall | None = None\n        known_comment_ids = (\n            self._content_state.known_root_comment_ids(content_id)\n            if comment_action == \"fetch_incremental\"\n            else frozenset()\n        )\n\n        for _page_no in range(1, _MAX_COMMENT_PAGES + 1):")
          rep(p, "            raw_items = extract_comment_items(platform, executed.body)\n            for index, raw_item in enumerate(raw_items):", "            raw_items = extract_comment_items(platform, executed.body)\n            page_comment_ids: list[str] = []\n            for index, raw_item in enumerate(raw_items):")
          rep(p, "                if comment.external_content_id != content.external_content_id:\n                    raise ValueError(\"TikHub Comment 与 Content 身份不一致\")\n                self._content_writer.ingest_comment(canonical=comment, fence=context.fence)", "                if comment.external_content_id != content.external_content_id:\n                    raise ValueError(\"TikHub Comment 与 Content 身份不一致\")\n                page_comment_ids.append(comment.external_comment_id)\n                self._content_writer.ingest_comment(canonical=comment, fence=context.fence)")
          rep(p, "            if comment_action == \"probe_first_page\":\n", '''            if (\n                comment_action == "fetch_incremental"\n                and known_comment_boundary_reached(page_comment_ids, known_comment_ids)\n            ):\n                self._record_comment_coverage(\n                    content_id=content_id, platform=platform, executed=executed, context=context,\n                    coverage="partial", reported_total=reported_total, collected_count=fetched,\n                    sample_mode=sample_mode, sort_mode=sort_mode, target_count=comment_target,\n                    stop_reason="known_comment_reached",\n                )\n                return\n            if comment_action == "probe_first_page":\n''')

          # Douyin Search mixed-card filtering.
          p = "backend/src/aima_ugc/adapters/providers/tikhub/operations/douyin.py"
          rep(p, "    return tuple(item for item in items if isinstance(item, dict))\n", "    return tuple(\n        item for item in items if isinstance(item, dict) and _search_item_id(item)\n    )\n")

          # Weibo stable-ID filtering and no-cursor end-of-data.
          p = "backend/src/aima_ugc/adapters/providers/tikhub/operations/weibo.py"
          rep(p, '''    return tuple(\n        card for card in cards if isinstance(card, dict) and isinstance(card.get("mblog"), dict)\n    )\n''', '''    return tuple(\n        card\n        for card in cards\n        if isinstance(card, dict) and _mblog_has_stable_id(card.get("mblog"))\n    )\n''')
          rep(p, "\n\ndef _first_level_comment_max_id(body: dict[str, Any]) -> str:\n", '''\n\ndef _mblog_has_stable_id(value: object) -> bool:\n    if not isinstance(value, dict):\n        return False\n    return any(_string(value.get(key)) for key in ("idstr", "mid", "id"))\n\n\ndef _first_level_comment_max_id(body: dict[str, Any]) -> str:\n''')
          rep(p, '''    more_info = data.get("moreInfo")\n    if not isinstance(more_info, dict):\n        raise ValueError("微博一级评论响应缺少 data.moreInfo")\n''', '''    more_info = data.get("moreInfo")\n    if more_info is None:\n        return ""\n    if not isinstance(more_info, dict):\n        raise ValueError("微博一级评论响应 data.moreInfo 类型非法")\n''')

          # File-state debug runner uses shared boundary.
          p = "backend/src/aima_ugc/adapters/providers/tikhub_test/core.py"
          rep(p, "    def is_known_comment(\n", '''    def known_comment_ids(\n        self, platform: str, external_content_id: str\n    ) -> frozenset[str]:\n        entry = self._entry(platform, external_content_id, create=False)\n        if entry is None:\n            return frozenset()\n        values = entry.get("comment_ids", [])\n        return frozenset(item for item in values if isinstance(item, str) and item)\n\n    def is_known_comment(\n''')
          p = "backend/src/aima_ugc/adapters/providers/tikhub_test/runner.py"
          rep(p, "from aima_ugc.modules.collection.decision import CollectionDecisionService\n", "from aima_ugc.modules.collection.decision import (\n    CollectionDecisionService,\n    known_comment_boundary_reached,\n)\n")
          rep(p, "                content=content,\n                target=decision.comment_target or self.limits.max_comments_per_content,", "                content=content,\n                action=decision.comment_action,\n                target=decision.comment_target or self.limits.max_comments_per_content,")
          rep(p, "        content: CanonicalContentV1,\n        target: int,\n    ) -> tuple[list[ReviewCommentRow], str]:", "        content: CanonicalContentV1,\n        action: str,\n        target: int,\n    ) -> tuple[list[ReviewCommentRow], str]:")
          rep(p, "        provider_exhausted = False\n        for page_no in range(1, self.limits.max_comment_pages_per_content + 1):", "        provider_exhausted = False\n        known_comment_ids = (\n            self.state.known_comment_ids(self.platform, content_id)\n            if action == \"fetch_incremental\"\n            else frozenset()\n        )\n        for page_no in range(1, self.limits.max_comment_pages_per_content + 1):")
          rep(p, "            mapped_roots: list[CanonicalCommentV1] = []\n            for item_index, raw_item in enumerate(items):", "            mapped_roots: list[CanonicalCommentV1] = []\n            page_comment_ids: list[str] = []\n            for item_index, raw_item in enumerate(items):")
          rep(p, "                key = (content_id, comment.external_comment_id)\n", "                page_comment_ids.append(comment.external_comment_id)\n                key = (content_id, comment.external_comment_id)\n")
          rep(p, "            if root_total >= target:\n                break", '''            if (\n                action == "fetch_incremental"\n                and known_comment_boundary_reached(page_comment_ids, known_comment_ids)\n            ):\n                expected = (\n                    str(content.metrics.comment_count)\n                    if content.metrics.comment_count is not None\n                    else "unknown"\n                )\n                return mapped_rows, f"partial {root_total}/{expected} (known_comment_reached)"\n            if root_total >= target:\n                break''')

          # New unit regressions.
          p = Path("tests/unit/collection/test_douyin_tikhub_operation.py")
          p.write_text(p.read_text(encoding="utf-8") + '''\n\ndef test_search_extractor_ignores_non_video_business_cards_without_aweme_id() -> None:\n    body = {"data": {"business_data": [\n        {"type": 1, "data": {"aweme_info": {"aweme_id": "aweme-1"}}},\n        {"type": 66668, "data": {"display": "non-content-card"}},\n        {"type": 1, "data": {"aweme_info": {"aweme_id": "aweme-2"}}},\n    ], "cursor": 20, "has_more": 1}}\n    items = extract_search_items(body)\n    pagination = DouyinSearchPagination.from_response(current_cursor=0, body=body)\n    assert len(items) == 2\n    assert pagination.item_ids == ("aweme-1", "aweme-2")\n''', encoding="utf-8")

          p = Path("tests/unit/collection/test_weibo_tikhub_operation.py")
          text = p.read_text(encoding="utf-8").replace("    build_status_sub_comments_request,\n)", "    build_status_sub_comments_request,\n    extract_search_items,\n)", 1)
          text += '''\n\ndef test_search_extractor_ignores_mblog_cards_without_stable_post_id() -> None:\n    body = {"data": {"cards": [\n        {"mblog": {"idstr": "post-1", "text": "valid"}},\n        {"mblog": {"text": "incomplete"}},\n        {"card_type": 11},\n    ]}}\n    items = extract_search_items(body)\n    assert len(items) == 1\n    assert items[0]["mblog"]["idstr"] == "post-1"\n\n\ndef test_first_level_comment_pagination_treats_missing_official_cursor_as_provider_exhausted() -> None:\n    result = WeiboCommentPagination.from_response(\n        previous_max_id=None, body={"data": {"items": [{"data": {"id": "comment-1"}}]}}\n    )\n    assert result.should_continue is False\n    assert result.stop_reason == "provider_exhausted"\n'''
          p.write_text(text, encoding="utf-8")
          PY
          sed -i -E 's/^(max_[a-z_]+|include_comments|include_replies|force_refresh)=/\1 = /' backend/src/aima_ugc/adapters/providers/tikhub_test/README.md
          uv run ruff format backend tests scripts
          uv run ruff check --fix backend tests scripts
      - name: Verify Green
        shell: bash
        run: |
          set -euo pipefail
          uv run mypy backend/src
          uv run pytest tests/unit/collection/test_tikhub_capabilities.py tests/unit/collection/test_tikhub_real_capabilities.py tests/unit/collection/test_stage7_decision.py tests/unit/collection/test_douyin_tikhub_operation.py tests/unit/collection/test_weibo_tikhub_operation.py tests/unit/collection/test_tikhub_test_debug.py tests/unit/collection/test_tikhub_test_debug_runtime.py -q
          uv run pytest tests/integration/collection/test_xhs_incremental_comments_runtime.py tests/integration/collection/test_collection_content_runtime.py tests/integration/collection/test_collection_scope_comments_runtime.py -q
          uv run python scripts/quality/scan_secrets.py
      - name: Commit Green
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/aima_ugc tests/unit/collection/test_douyin_tikhub_operation.py tests/unit/collection/test_weibo_tikhub_operation.py
          git commit -m "修复 TikHub 增量评论与真实响应兼容"
          git push origin HEAD:agent/tikhub-test-debug
