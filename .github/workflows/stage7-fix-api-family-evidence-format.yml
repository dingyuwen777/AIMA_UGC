name: Stage 7 Fix API Family Evidence Format

on:
  push:
    branches:
      - feature/stage7-completion
    paths:
      - ".github/workflows/stage7-fix-api-family-evidence-format.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage7-completion
          fetch-depth: 0

      - name: Split three overlong evidence paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/dev/probe_tikhub_api_family_evidence_once.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '                            "primary_response": f"{reply_case_name}/primary.response.sanitized.json",':
              '                            "primary_response": (\n'
              '                                f"{reply_case_name}/primary.response.sanitized.json"\n'
              '                            ),',
              '                            "candidate_request": f"{reply_case_name}/candidate.request.sanitized.json",':
              '                            "candidate_request": (\n'
              '                                f"{reply_case_name}/candidate.request.sanitized.json"\n'
              '                            ),',
              '                            "candidate_response": f"{reply_case_name}/candidate.response.sanitized.json",':
              '                            "candidate_response": (\n'
              '                                f"{reply_case_name}/candidate.response.sanitized.json"\n'
              '                            ),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected source line missing: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Commit focused format fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/stage7-completion
          test "$(git rev-parse origin/feature/stage7-completion)" = "${GITHUB_SHA}"
          git rm .github/workflows/stage7-fix-api-family-evidence-format.yml
          git add scripts/dev/probe_tikhub_api_family_evidence_once.py
          git diff --cached --check
          git config user.name "AIMA Stage 7 Runner"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "修正 TikHub API family Evidence 探针格式"
          git push origin HEAD:feature/stage7-completion
