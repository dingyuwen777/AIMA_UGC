name: Report visual lint helper

on:
  push:
    branches:
      - fix/report-visual-fidelity

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/report-visual-fidelity
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - name: Install uv
        run: python -m pip install uv==0.12.3
      - name: Install locked environment
        run: uv sync --locked
      - name: Fix lint and format report visual files
        run: |
          uv run ruff check --fix \
            backend/src/aima_ugc/platform/reporting/visual_docx.py \
            backend/src/aima_ugc/platform/reporting/markdown_word.py \
            tests/unit/platform/test_reporting_visual_fidelity.py \
            tests/unit/platform/test_reporting_visuals.py
          uv run ruff format \
            backend/src/aima_ugc/platform/reporting/visual_docx.py \
            backend/src/aima_ugc/platform/reporting/markdown_word.py \
            tests/unit/platform/test_reporting_visual_fidelity.py \
            tests/unit/platform/test_reporting_visuals.py
      - name: Commit lint fixes when needed
        run: |
          if git diff --quiet -- \
            backend/src/aima_ugc/platform/reporting/visual_docx.py \
            backend/src/aima_ugc/platform/reporting/markdown_word.py \
            tests/unit/platform/test_reporting_visual_fidelity.py \
            tests/unit/platform/test_reporting_visuals.py; then
            echo "No lint changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/aima_ugc/platform/reporting/visual_docx.py \
            backend/src/aima_ugc/platform/reporting/markdown_word.py \
            tests/unit/platform/test_reporting_visual_fidelity.py \
            tests/unit/platform/test_reporting_visuals.py
          git commit -m "修正报告视觉代码格式"
          git push origin HEAD:fix/report-visual-fidelity
