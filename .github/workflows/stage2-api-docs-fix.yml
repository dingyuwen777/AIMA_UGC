name: Stage2 API Docs Fix

on:
  push:
    branches:
      - feature/stage2-brand-vehicle-management-resolver

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Sync current Brand/Vehicle API facts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from base64 import b64decode
          from pathlib import Path

          path = Path("docs/03_API接口说明.md")
          text = path.read_text(encoding="utf-8")
          marker = "\n---\n\n# 4. Collection Runtime API\n"
          section = b64decode("").decode("utf-8")
          if "/api/v1/vehicle-catalog/snapshot" not in text:
              if marker not in text:
                  raise SystemExit("API docs insertion marker drifted")
              text = text.replace(marker, "\n" + section + "\n# 4. Collection Runtime API\n", 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit only permanent docs change
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/stage2-api-docs-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/03_API接口说明.md
          git diff --cached --check
          git commit -m "文档：同步 Stage 2 品牌车型 API 事实"
          git push origin HEAD:${GITHUB_REF_NAME}
