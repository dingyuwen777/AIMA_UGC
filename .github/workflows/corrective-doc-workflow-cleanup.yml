              "Job Runtime、Collection 父事实、Provider 持久化、Dispatch/恢复、Content/Ingestion、五平台规范化与 Scheduler 的完整回归分别由 Stage 4/5/6/7 正式 Workflow 维护；Collection 恢复、Coverage、Provider retry 和 Content 并发/乱序回归也包含在对应 PostgreSQL Integration 中。统一测试入口见 [`docs/测试与调试说明.md`](docs/测试与调试说明.md)。",
          )

          replace_once(
              "docs/环境运行与部署.md",
              """- **Windows x64 一键开发环境初始化：Go**；
- **本地前后端开发启动：Go**；
