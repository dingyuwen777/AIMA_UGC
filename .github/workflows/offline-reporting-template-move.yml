name: Offline Reporting Template Move

on:
  push:
    branches:
      - feature/offline-reporting

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
      - name: Move shared template ownership and adapt callers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(path: str, old: str, new: str, count: int = 1) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrences, found {actual}: {old!r}")
              text = text.replace(old, new, count)
              file_path.write_text(text, encoding="utf-8")

          excel_report = "backend/src/aima_ugc/platform/reporting/excel_report.py"
          replace_required(
              excel_report,
              'from .markdown_word import WordConversionSummary, convert_markdown_to_docx\n\n_BEIJING = ZoneInfo("Asia/Shanghai")\n',
              'from .markdown_word import WordConversionSummary, convert_markdown_to_docx\n\nDEFAULT_REPORT_TEMPLATE_PATH = Path(__file__).with_name("report_template.md")\n\n_BEIJING = ZoneInfo("Asia/Shanghai")\n',
          )
          replace_required(excel_report, "    template_path: Path,\n", "    template_path: Path | None = None,\n")
          replace_required(
              excel_report,
              "    template = Path(template_path)\n",
              "    template = DEFAULT_REPORT_TEMPLATE_PATH if template_path is None else Path(template_path)\n",
          )

          init_path = "backend/src/aima_ugc/platform/reporting/__init__.py"
          replace_required(
              init_path,
              "from .excel_report import ReportGenerationSummary, generate_excel_report\n",
              "from .excel_report import (\n    DEFAULT_REPORT_TEMPLATE_PATH,\n    ReportGenerationSummary,\n    generate_excel_report,\n)\n",
          )
          replace_required(
              init_path,
              '__all__ = [\n    "ReportGenerationSummary",\n',
              '__all__ = [\n    "DEFAULT_REPORT_TEMPLATE_PATH",\n    "ReportGenerationSummary",\n',
          )

          imports_entry = "backend/src/aima_ugc/adapters/providers/imports_test/test.py"
          replace_required(
              imports_entry,
              'REPORT_TEMPLATE_FILE = Path(__file__).with_name("report_template.md")\n',
              "",
          )
          replace_required(
              imports_entry,
              "    return generate_excel_report(\n        input_path=source_path,\n        output_dir=target_dir,\n        template_path=REPORT_TEMPLATE_FILE,\n    )\n",
              "    return generate_excel_report(\n        input_path=source_path,\n        output_dir=target_dir,\n    )\n",
          )

          test_path = "tests/unit/platform/test_imports_test_reporting.py"
          replace_required(
              test_path,
              "from aima_ugc.platform.reporting import ReportGenerationSummary\n",
              "from aima_ugc.platform.reporting import (\n    DEFAULT_REPORT_TEMPLATE_PATH,\n    ReportGenerationSummary,\n)\n",
          )
          replace_required(
              test_path,
              "        template_path=imports_entry.REPORT_TEMPLATE_FILE,\n",
              "        template_path=DEFAULT_REPORT_TEMPLATE_PATH,\n",
          )
          replace_required(
              test_path,
              "        template_path: Path,\n",
              "        template_path: Path | None = None,\n",
          )
          replace_required(
              test_path,
              '        captured["template_path"] = template_path\n',
              "        assert template_path is None\n",
          )
          replace_required(
              test_path,
              '        "output_dir": output_dir,\n        "template_path": imports_entry.REPORT_TEMPLATE_FILE,\n',
              '        "output_dir": output_dir,\n',
          )

          imports_readme = "backend/src/aima_ugc/adapters/providers/imports_test/README.md"
          replace_required(
              imports_readme,
              'REPORT_TEMPLATE_FILE = Path(__file__).with_name("report_template.md")\n',
              "",
          )
          replace_required(
              imports_readme,
              "Excel 输入只有 `INPUT_XLSX_FILES` 一个配置入口。它接受一个 `Path` 或非空的\n",
              "报告默认模板由 `aima_ugc.platform.reporting` 统一维护在\n`backend/src/aima_ugc/platform/reporting/report_template.md`，人工入口不再维护第二份模板路径。\n\nExcel 输入只有 `INPUT_XLSX_FILES` 一个配置入口。它接受一个 `Path` 或非空的\n",
          )

          reporting_readme = "backend/src/aima_ugc/platform/reporting/README.md"
          replace_required(
              reporting_readme,
              '    template_path=Path("report_template.md"),\n',
              "",
          )
          replace_required(
              reporting_readme,
              "`generate_excel_report()` 只读输入 Workbook，不调用 LLM、不写 PostgreSQL，也不保存或二次格式化输入 Excel。\n",
              "`generate_excel_report()` 默认使用本目录的 `report_template.md`；调用方也可显式传入 `template_path=` 覆盖模板。函数只读输入 Workbook，不调用 LLM、不写 PostgreSQL，也不保存或二次格式化输入 Excel。\n",
          )
          replace_required(
              reporting_readme,
              "`imports_test/report_template.md` 是当前人工入口的默认报告模板，不属于数据库或 HTTP Contract。\n",
              "默认报告模板固定由本模块维护在 `backend/src/aima_ugc/platform/reporting/report_template.md`；`imports_test` 只复用该默认模板，不拥有第二份模板事实源。\n",
          )

          blueprint = "docs/blueprint/13-统一数据Excel导出与调试复用.md"
          replace_required(
              blueprint,
              "它不是 `imports_test` 私有统计脚本。`imports_test` 只提供默认 Markdown 模板和人工调用入口；统计、Markdown 渲染、Word 转换和图表嵌入属于 Provider-neutral 平台能力。\n",
              "它不是 `imports_test` 私有统计脚本。默认 Markdown 模板、统计、Markdown 渲染、Word 转换和图表嵌入都属于 Provider-neutral 平台能力；`imports_test` 只提供人工调用入口。\n",
          )
          replace_required(
              blueprint,
              "具体人工入口模板当前为：\n\n```text\nbackend/src/aima_ugc/adapters/providers/imports_test/report_template.md\n```\n",
              "默认共享模板当前为：\n\n```text\nbackend/src/aima_ugc/platform/reporting/report_template.md\n```\n\n`generate_excel_report()` 默认使用该模板；需要特定展示时允许调用方显式传入 `template_path=`，但不能复制一套平台私有 Report Renderer。\n",
          )
          replace_required(
              blueprint,
              "不得把 `imports_test` 的路径、run 目录或本地模板位置提升为正式 HTTP/数据库 Contract。\n",
              "不得把 `imports_test` 的路径或 run 目录提升为正式 HTTP/数据库 Contract；共享默认模板属于 Report Renderer 自身资源。\n",
          )

          change = "changes/active/CHG-20260820-offline-reporting/CHANGE.md"
          replace_required(change, "status: ready_for_review\n", "status: in_progress\n")
          replace_required(
              change,
              "- `imports_test/report_template.md`：当前人工入口唯一报告正文模板；\n",
              "- `platform/reporting/report_template.md`：全平台共享默认报告正文模板；\n",
          )
          replace_required(
              change,
              "- 不合并到 `main`。\n",
              "- 不通过覆盖旧 feature 历史或裁剪 `main` 已有能力来完成集成；必须以最新 `main` 为基线保留现有合法行为。\n",
          )
          replace_required(
              change,
              "8. `xml.etree.ElementTree.tostring(..., encoding=\"utf-8\")` 的标准库类型存根返回值通过 `typing.cast(bytes, ...)` 明确给 mypy；不改变运行时字节序列化行为。\n",
              "8. `xml.etree.ElementTree.tostring(..., encoding=\"utf-8\")` 的标准库类型存根返回值通过 `typing.cast(bytes, ...)` 明确给 mypy；不改变运行时字节序列化行为。\n9. 默认 Markdown 模板归 `platform.reporting` 所有，`generate_excel_report()` 默认使用模块内模板；`imports_test` 不再维护模板路径。\n",
          )
          replace_required(
              change,
              "- [x] 执行最终验证门禁并记录机器证据。\n",
              "- [x] 执行上一版最终验证门禁并记录机器证据。\n- [x] 新增共享模板位置 Red 测试，并确认因默认模板 API 尚不存在而失败。\n- [ ] 迁移模板到 `platform/reporting/` 并更新共享默认 API、调用方、测试与文档。\n- [ ] 基于最新 `main` 重新执行完整验证并按授权合并。\n",
          )
          PY

          git rm -- backend/src/aima_ugc/adapters/providers/imports_test/report_template.md
          git rm -- changes/active/CHG-20260820-offline-reporting/template_red_evidence.json

          uv run ruff format \
            backend/src/aima_ugc/platform/reporting/excel_report.py \
            backend/src/aima_ugc/platform/reporting/__init__.py \
            backend/src/aima_ugc/adapters/providers/imports_test/test.py \
            tests/unit/platform/test_imports_test_reporting.py \
            tests/unit/platform/test_reporting_default_template.py
          uv run ruff check \
            backend/src/aima_ugc/platform/reporting \
            backend/src/aima_ugc/adapters/providers/imports_test/test.py \
            tests/unit/platform/test_imports_test_reporting.py \
            tests/unit/platform/test_reporting_default_template.py
          uv run pytest \
            tests/unit/platform/test_reporting_default_template.py \
            tests/unit/platform/test_offline_reporting.py \
            tests/unit/platform/test_imports_test_reporting.py \
            tests/unit/platform/test_docx_package_structure.py \
            tests/unit/collection/test_p1g_imports_run_all.py \
            tests/unit/collection/test_imports_test_run_directory.py -q
          if grep -R --line-number --fixed-strings 'imports_test/report_template.md' \
              backend/src/aima_ugc docs tests changes/active/CHG-20260820-offline-reporting; then
            echo '旧模板路径仍有引用' >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings 'REPORT_TEMPLATE_FILE' \
              backend/src/aima_ugc tests; then
            echo 'imports_test 私有模板常量仍有引用' >&2
            exit 1
          fi
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            backend/src/aima_ugc/platform/reporting \
            backend/src/aima_ugc/adapters/providers/imports_test \
            tests/unit/platform/test_imports_test_reporting.py \
            tests/unit/platform/test_reporting_default_template.py \
            docs/blueprint/13-统一数据Excel导出与调试复用.md \
            changes/active/CHG-20260820-offline-reporting/CHANGE.md
          git commit -m '实现：统一报告模板归属到 reporting 模块'
          git push origin "HEAD:${GITHUB_REF_NAME}"
