name: Dev Stage8E Seed Migration

on:
  push:
    branches:
      - feature/provider-lookup-supplement-eligibility
    paths:
      - ".github/workflows/dev-stage8e-seed-migration.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/provider-lookup-supplement-eligibility
          fetch-depth: 0

      - name: Fix Stage 8E typed lookup seed indentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/integration/collection/test_stage8e_collection_http_runtime.py")
          text = path.read_text(encoding="utf-8")
          broken = "        connection.execute(\n    insert(content_external_ids_table).values(\n        content_id=content_id,\n        id_type=\"note_id\",\n        external_id=external_content_id,\n        provider_attempt_id=attempt_id,\n        raw_artifact_id=artifact_id,\n        observed_at=now,\n    )\n)"
          fixed = "        connection.execute(\n            insert(content_external_ids_table).values(\n                content_id=content_id,\n                id_type=\"note_id\",\n                external_id=external_content_id,\n                provider_attempt_id=attempt_id,\n                raw_artifact_id=artifact_id,\n                observed_at=now,\n            )\n        )"
          if text.count(broken) != 1:
              raise SystemExit(f"Stage8E broken seed anchor count={text.count(broken)}")
          path.write_text(text.replace(broken, fixed, 1), encoding="utf-8")
          PY

          python -m py_compile tests/integration/collection/test_stage8e_collection_http_runtime.py
          git diff --check

      - name: Commit migrated test seed
        shell: bash
        run: |
          set -euo pipefail
          git add tests/integration/collection/test_stage8e_collection_http_runtime.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "修正Stage8E补采测试种子格式"
          git push origin HEAD:feature/provider-lookup-supplement-eligibility
