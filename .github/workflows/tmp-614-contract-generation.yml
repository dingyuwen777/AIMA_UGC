name: Temporary 614 Contract Generation

on:
  push:
    branches:
      - fix/614-admin-replay-latency

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v7.0.1
        with:
          ref: fix/614-admin-replay-latency
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked environments
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
          npm ci --prefix frontend
      - name: Generate official contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py
      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add contracts frontend/src/generated/api
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "AIMA Contract Generator"
          git config user.email "aima-contract-generator@users.noreply.github.com"
          git commit -m "生成：同步管理员保存与重筛契约"
          git push origin HEAD:fix/614-admin-replay-latency
