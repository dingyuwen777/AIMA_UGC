name: TikHub Five Platform Final Real Validation

on:
  push:
    branches:
      - agent/tikhub-test-debug
    paths:
      - ".github/workflows/tikhub-final-real-validation.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/tikhub-test-debug
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Generate one-time RSA handoff key
        shell: bash
        run: |
          set -euo pipefail
          secure_dir="${RUNNER_TEMP}/tikhub-final-real-secret"
          mkdir -p "${secure_dir}"
          chmod 700 "${secure_dir}"
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "${secure_dir}/private.pem"
          chmod 600 "${secure_dir}/private.pem"
          openssl pkey -in "${secure_dir}/private.pem" -pubout \
            -out "${secure_dir}/public.pem"
      - name: Upload one-time public key
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tikhub-final-real-public-key-${{ github.run_id }}
          path: ${{ runner.temp }}/tikhub-final-real-secret/public.pem
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
      - name: Receive encrypted TikHub credential
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          secure_dir="${RUNNER_TEMP}/tikhub-final-real-secret"
          marker="<!-- tikhub-final-real-ciphertext:${GITHUB_RUN_ID} -->"
          ciphertext=""
          for _ in $(seq 1 120); do
            pr_body="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/63" | jq -r '.body // ""')"
            ciphertext="$(printf '%s' "${pr_body}" | jq -Rrs --arg marker "${marker}" \
              'split($marker) | if length > 1 then .[1] | split("\n") | map(select(length > 0))[0] // "" else "" end')"
            if [ -n "${ciphertext}" ]; then
              break
            fi
            sleep 5
          done
          test -n "${ciphertext}"
          printf '%s' "${ciphertext}" | base64 --decode > "${secure_dir}/cipher.bin"
          openssl pkeyutl -decrypt \
            -inkey "${secure_dir}/private.pem" \
            -in "${secure_dir}/cipher.bin" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out "${secure_dir}/token"
          token="$(cat "${secure_dir}/token")"
          test "${#token}" -ge 16
          echo "::add-mask::${token}"
          rm -f "${secure_dir}/cipher.bin"
      - name: Run current five-platform tikhub_test end-to-end
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "${RUNNER_TEMP}/tikhub-final-real-secret/token")"
          echo "::add-mask::${token}"
          env_file="backend/src/aima_ugc/adapters/providers/tikhub_test/.env"
          output_root="${RUNNER_TEMP}/tikhub-final-real"
          summary_path="${RUNNER_TEMP}/tikhub-final-real-summary.json"
          umask 077
          printf 'TIKHUB_BASE_URL=https://api.tikhub.io\nTIKHUB_API_KEY=%s\nTIKHUB_TIMEOUT_SECONDS=30\n' \
            "${token}" > "${env_file}"
          export AIMA_TIKHUB_REAL_ENV="${env_file}"
          export AIMA_TIKHUB_REAL_OUTPUT="${output_root}"
          export AIMA_TIKHUB_REAL_SUMMARY="${summary_path}"
          uv run python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          from openpyxl import load_workbook

          from aima_ugc.adapters.providers.tikhub_test.bilibili import run_bilibili
          from aima_ugc.adapters.providers.tikhub_test.douyin import run_douyin
          from aima_ugc.adapters.providers.tikhub_test.kuaishou import run_kuaishou
          from aima_ugc.adapters.providers.tikhub_test.weibo import run_weibo
          from aima_ugc.adapters.providers.tikhub_test.xiaohongshu import run_xiaohongshu

          env_file = Path(os.environ["AIMA_TIKHUB_REAL_ENV"])
          output_root = Path(os.environ["AIMA_TIKHUB_REAL_OUTPUT"])
          summary_path = Path(os.environ["AIMA_TIKHUB_REAL_SUMMARY"])
          runs = (
              (
                  "xhs",
                  run_xiaohongshu,
                  {"sort_mode": "most_commented", "published_within": "7d", "content_type": "all"},
              ),
              (
                  "douyin",
                  run_douyin,
                  {"sort_mode": "most_liked", "published_within": "7d", "duration": "all", "content_type": "all"},
              ),
              ("weibo", run_weibo, {"sort_mode": "hot", "published_within": "week"}),
              ("bilibili", run_bilibili, {"sort_mode": "play_count", "content_type": "video"}),
              ("kuaishou", run_kuaishou, {}),
          )
          summary: dict[str, object] = {"keyword": "爱玛", "platforms": {}}
          platforms = summary["platforms"]
          assert isinstance(platforms, dict)
          failures: list[str] = []

          for platform, function, kwargs in runs:
              try:
                  result = function(
                      keyword="爱玛",
                      env_file=env_file,
                      output_root=output_root,
                      run_id=f"final-real-{platform}",
                      max_search_pages=2,
                      max_contents=2,
                      max_comments_per_content=5,
                      max_comment_pages_per_content=1,
                      max_replies_per_root=1,
                      max_reply_pages_per_root=1,
                      include_comments=True,
                      include_replies=True,
                      force_refresh=True,
                      **kwargs,
                  )
                  raw_files = list((result.run_dir / "raw").glob("*.json"))
                  canonical_contents = result.run_dir / "canonical" / "contents.jsonl"
                  canonical_comments = result.run_dir / "canonical" / "comments.jsonl"
                  run_summary = json.loads(result.run_summary_path.read_text(encoding="utf-8"))
                  workbook = load_workbook(result.workbook_path, read_only=False, data_only=False)
                  sheet_names = workbook.sheetnames
                  workbook.close()
                  checks = {
                      "content_nonempty": result.content_count > 0,
                      "root_comment_nonempty": result.root_comment_count > 0,
                      "raw_nonempty": bool(raw_files),
                      "canonical_contents_exists": canonical_contents.exists(),
                      "canonical_comments_exists": canonical_comments.exists(),
                      "run_summary_exists": result.run_summary_path.exists(),
                      "workbook_exists": result.workbook_path.exists(),
                      "workbook_sheet_ok": "内容与评论" in sheet_names,
                  }
                  if not all(checks.values()):
                      failures.append(platform)
                  platforms[platform] = {
                      "status": "completed" if all(checks.values()) else "failed_checks",
                      "content_count": result.content_count,
                      "root_comment_count": result.root_comment_count,
                      "reply_count": result.reply_count,
                      "request_count": result.request_count,
                      "raw_file_count": len(raw_files),
                      "run_status": run_summary.get("status"),
                      "checks": checks,
                  }
              except Exception as exc:
                  failures.append(platform)
                  platforms[platform] = {
                      "status": "failed",
                      "error_type": type(exc).__name__,
                      "error_summary": str(exc)[:300],
                  }

          summary["failed_platforms"] = failures
          summary_path.write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(summary_path.read_text(encoding="utf-8"))
          if failures:
              raise SystemExit(f"real validation failed: {failures}")
          PY
          rm -f "${env_file}"
          rm -rf "${output_root}"
      - name: Upload sanitized summary only
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tikhub-final-real-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/tikhub-final-real-summary.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
      - name: Remove ephemeral credential material
        if: always()
        shell: bash
        run: |
          rm -f backend/src/aima_ugc/adapters/providers/tikhub_test/.env
          rm -rf "${RUNNER_TEMP}/tikhub-final-real-secret" \
                 "${RUNNER_TEMP}/tikhub-final-real"
