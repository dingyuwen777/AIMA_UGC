name: Report visual format helper

on:
  push:
    branches:
      - fix/report-visual-fidelity

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - name: Install uv
        run: python -m pip install uv==0.12.3
      - name: Install locked environment
        run: uv sync --locked
      - name: Format report visual files
        run: |
          uv run ruff format \
            backend/src/aima_ugc/platform/reporting/markdown_word.py \
            backend/src/aima_ugc/platform/reporting/visual_docx.py \
            tests/unit/platform/test_reporting_visual_fidelity.py
          tar -czf report-visual-formatted.tar.gz \
            backend/src/aima_ugc/platform/reporting/markdown_word.py \
            backend/src/aima_ugc/platform/reporting/visual_docx.py \
            tests/unit/platform/test_reporting_visual_fidelity.py
      - uses: actions/upload-artifact@v4
        with:
          name: report-visual-formatted
          path: report-visual-formatted.tar.gz
          if-no-files-found: error
