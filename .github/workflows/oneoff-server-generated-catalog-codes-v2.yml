name: One-off server generated catalog codes v2

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/server-generated-resource-codes'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frozen environments
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
          npm ci --prefix frontend

      - name: Apply scoped source changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:120]!r}')
              target.write_text(text.replace(old, new, count), encoding='utf-8')

          def sub(path: str, pattern: str, repl: str, *, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              updated, actual = re.subn(pattern, repl, text, count=count, flags=re.MULTILINE)
              if actual != count:
                  raise SystemExit(f'{path}: expected regex {count} occurrence(s), found {actual}: {pattern[:120]!r}')
              target.write_text(updated, encoding='utf-8')

          # HTTP create contracts no longer expose client-controlled code.
          replace('backend/src/aima_ugc/contracts/brand_vehicle.py', '    code: str = Field(min_length=1, max_length=100, pattern=r"^[A-Za-z0-9][A-Za-z0-9._-]*$")\n', '')
          replace('backend/src/aima_ugc/contracts/brand_vehicle.py', '    @field_validator("code", mode="before")\n    @classmethod\n    def normalize_code(cls, value: object) -> object:\n        return value.strip().upper() if isinstance(value, str) else value\n\n', '')
          replace('backend/src/aima_ugc/contracts/administration.py', '    code: str = Field(min_length=1, max_length=100, pattern=r"^[A-Za-z0-9][A-Za-z0-9._-]*$")\n', '')
          replace('backend/src/aima_ugc/contracts/administration.py', '    @field_validator("code", mode="before")\n    @classmethod\n    def normalize_code(cls, value: object) -> object:\n        """车型 code 使用去空白后的大写稳定身份。"""\n\n        value = _trimmed(value)\n        return value.upper() if isinstance(value, str) else value\n\n', '')

          # Application bootstrap generates internal code; persistence schema/signature stays unchanged.
          replace('backend/src/aima_ugc/bootstrap/brand_vehicle_http.py', '        code=body.code,\n', '        code=f"BR_{uuid4().hex.upper()}",\n')
          replace('backend/src/aima_ugc/bootstrap/administration_http.py', '        code=body.code,\n', '        code=f"VEH_{uuid4().hex.upper()}",\n')

          catalog = 'frontend/src/features/admin-configuration/pages/AdminConfigurationPage/components/CatalogConfigurationPanel.vue'
          replace(catalog, "  code: '',\n", '', count=2)
          replace(catalog, 'const brandFormValid = computed(() => Boolean(brandDraft.code.trim() && brandDraft.displayName.trim()))', 'const brandFormValid = computed(() => Boolean(brandDraft.displayName.trim()))')
          replace(catalog, "  vehicleDraft.code.trim()\n    && vehicleDraft.displayName.trim()", '  vehicleDraft.displayName.trim()')
          replace(catalog, "    id: '', code: '', displayName: '', role: 'owned', aliases: '', status: 'active',\n", "    id: '', displayName: '', role: 'owned', aliases: '', status: 'active',\n", count=2)
          replace(catalog, '    code: item.code,\n', '', count=2)
          replace(catalog, '        code: brandDraft.code.trim(),\n', '')
          replace(catalog, "    id: '', code: '', displayName: '', brandId, seriesName: '', categoryName: '', aliases: '', status: 'active',\n", "    id: '', displayName: '', brandId, seriesName: '', categoryName: '', aliases: '', status: 'active',\n")
          replace(catalog, '        code: vehicleDraft.code.trim(),\n', '')
          replace(catalog, '/** 新车型默认继承当前品牌；创建后编码不可修改。 */', '/** 新车型默认继承当前品牌；内部编码由服务端生成。 */')
          replace(catalog, '            <p>品牌编码创建后不可修改；品牌识别词用于统一匹配，旗下车型通过唯一品牌归属自动纳入过滤。</p>', '            <p>品牌识别词用于统一匹配，旗下车型通过唯一品牌归属自动纳入过滤。</p>')

          sub(catalog, r'            <div>\n              <dt>品牌编码</dt>\n              <dd>\{\{ selectedBrand\.code \}\}</dd>\n            </div>\n', '')
          sub(catalog, r'        <label>\n          品牌编码\n          <input\n            v-model="brandDraft\.code"\n            maxlength="100"\n            placeholder="例如 AIMA"\n          >\n          <small>稳定机器身份，创建后不可修改。</small>\n        </label>\n', '')
          sub(catalog, r'        <label>\n          车型编码\n          <input\n            v-model="vehicleDraft\.code"\n            :disabled="Boolean\(vehicleDraft\.id\)"\n            placeholder="例如 AIMA-Q7"\n          >\n          <small>稳定机器身份，创建后不可修改。</small>\n        </label>\n', '')

          guide = 'docs/guides/02_管理员配置Figma开发基线.md'
          replace(guide, '- Brand Code、Vehicle Code 创建后保持稳定机器身份；', '- Brand/Vehicle 内部 `code` 由服务端生成，创建后保持稳定且不可修改；')
          replace(guide, '- 正常业务层可以下沉机器 Code，但创建时仍按当前 Contract 收集必填 Code，已创建 Code 在技术信息按需查看。', '- 业务创建/编辑表单不收集、不允许人工修改或展示内部 `code`；数据库列、唯一约束与响应 Contract 继续保留该字段，既有记录不迁移。')

          e2e = 'frontend/e2e/admin-configuration-release2.spec.ts'
          replace(e2e, "test('vehicle create and edit use product dialogs while preserving immutable identity and real fields', async ({ page }) => {", "test('vehicle create and edit use product dialogs without exposing internal code', async ({ page }) => {")
          replace(e2e, "  await expect(createDialog.getByPlaceholder('例如 AIMA-Q7')).toBeEnabled()\n", "  await expect(createDialog.getByText('车型编码', { exact: true })).toHaveCount(0)\n")
          replace(e2e, "  await expect(editDialog.getByPlaceholder('例如 AIMA-Q7')).toBeDisabled()\n", "  await expect(editDialog.getByText('车型编码', { exact: true })).toHaveCount(0)\n")
          old_brand = '''test('brand creation preserves required immutable code while normal detail keeps it technical', async ({ page }) => {\n  await page.setViewportSize({ width: 1440, height: 900 })\n  await mockAdmin(page)\n  await page.goto('/admin/configuration')\n\n  await page.getByRole('button', { name: '新增品牌', exact: true }).click()\n  const dialog = page.getByRole('dialog', { name: '新增品牌' })\n  await expect(dialog).toBeVisible()\n  await expect(dialog.getByPlaceholder('例如 AIMA')).toBeVisible()\n  await expect(dialog.getByText('稳定机器身份，创建后不可修改。', { exact: true })).toBeVisible()\n  await dialog.getByRole('button', { name: '取消', exact: true }).click()\n\n  await expect(page.getByText('品牌编码', { exact: true })).not.toBeVisible()\n  await page.getByText('技术信息', { exact: true }).click()\n  await expect(page.getByText('品牌编码', { exact: true })).toBeVisible()\n})\n'''
          new_brand = '''test('brand creation never asks administrators for internal code', async ({ page }) => {\n  await page.setViewportSize({ width: 1440, height: 900 })\n  await mockAdmin(page)\n  await page.goto('/admin/configuration')\n\n  await page.getByRole('button', { name: '新增品牌', exact: true }).click()\n  const dialog = page.getByRole('dialog', { name: '新增品牌' })\n  await expect(dialog).toBeVisible()\n  await expect(dialog.getByText('品牌编码', { exact: true })).toHaveCount(0)\n  await expect(dialog.getByPlaceholder('请输入品牌名称')).toBeVisible()\n  await dialog.getByRole('button', { name: '取消', exact: true }).click()\n\n  await expect(page.getByText('品牌编码', { exact: true })).toHaveCount(0)\n  await page.getByText('技术信息', { exact: true }).click()\n  await expect(page.getByText('品牌编码', { exact: true })).toHaveCount(0)\n})\n'''
          replace(e2e, old_brand, new_brand)

          contract_test = Path('tests/contracts/test_server_generated_catalog_codes.py')
          if contract_test.exists():
              raise SystemExit(f'{contract_test}: already exists')
          contract_test.write_text('''"""品牌与车型内部 code 的 HTTP Contract 回归。"""\n\nimport pytest\nfrom pydantic import ValidationError\n\nfrom aima_ugc.contracts.administration import VehicleModelCreateRequest\nfrom aima_ugc.contracts.brand_vehicle import BrandCreateRequest\nfrom aima_ugc.entrypoints.api_main import create_app\n\n\ndef test_catalog_create_requests_do_not_expose_internal_code() -> None:\n    """创建请求不接收 code，但响应仍保留内部稳定身份。"""\n\n    schemas = create_app().openapi()["components"]["schemas"]\n    for name in ("BrandCreateRequest", "VehicleModelCreateRequest"):\n        schema = schemas[name]\n        assert "code" not in schema.get("properties", {})\n        assert "code" not in schema.get("required", [])\n\n    for name in ("BrandResponse", "VehicleModelResponse"):\n        assert "code" in schemas[name]["properties"]\n\n\ndef test_catalog_create_requests_reject_client_controlled_code() -> None:\n    """extra=forbid 防止客户端继续注入内部 code。"""\n\n    with pytest.raises(ValidationError):\n        BrandCreateRequest.model_validate({"code": "AIMA", "display_name": "爱玛", "role": "owned"})\n    with pytest.raises(ValidationError):\n        VehicleModelCreateRequest.model_validate({"code": "AIMA-PONY", "display_name": "Pony"})\n\n\ndef test_catalog_create_requests_accept_human_fields_without_code() -> None:\n    """管理员只提供人类可理解的业务字段即可创建请求。"""\n\n    brand = BrandCreateRequest(display_name=" 爱玛 ", role="owned", aliases=("AIMA",))\n    vehicle = VehicleModelCreateRequest(display_name=" Pony ", aliases=("小爱",))\n    assert brand.display_name == "爱玛"\n    assert vehicle.display_name == "Pony"\n''', encoding='utf-8')
          PY

      - name: Regenerate OpenAPI and Orval client
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api

      - name: Targeted validation
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/contracts/test_server_generated_catalog_codes.py
          uv run ruff check backend/src/aima_ugc/contracts/brand_vehicle.py backend/src/aima_ugc/contracts/administration.py backend/src/aima_ugc/bootstrap/brand_vehicle_http.py backend/src/aima_ugc/bootstrap/administration_http.py tests/contracts/test_server_generated_catalog_codes.py
          npm --prefix frontend run typecheck
          git diff --check

      - name: Remove one-off workflows and commit generated change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/oneoff-server-generated-catalog-codes.yml
          rm .github/workflows/oneoff-server-generated-catalog-codes-v2.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '实现服务端生成品牌车型内部编码 (#522)'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
