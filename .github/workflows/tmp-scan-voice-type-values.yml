name: Temporary Voice Type Value Scan

on:
  push:
    branches:
      - feature/voice-type-taxonomy

permissions:
  contents: write

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/voice-type-taxonomy
          fetch-depth: 0

      - name: Scan concrete voice type values
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          {
            echo '# concrete voice_type values scan'
            echo
            rg -n --hidden --glob '!.git/**' --glob '!.tmp/**' \
              '(user_voice|media_editorial|kol_creator|brand_campaign|government_authority|event_exhibition)' \
              backend frontend tests docs contracts changes scripts || true
          } > .tmp/voice-type-values-scan.txt
          git rm .github/workflows/tmp-scan-voice-type-values.yml
          git add .tmp/voice-type-values-scan.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "调试：记录发声类型全仓扫描结果"
          git push origin HEAD:feature/voice-type-taxonomy
