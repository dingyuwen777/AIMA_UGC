name: DEV Analysis V3 PR Runner

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-diagnose:
    if: github.head_ref == 'feature/analysis-relevance-voice-type' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/analysis-relevance-voice-type
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Apply, verify and publish diagnostics
        shell: bash
        run: |
          set +e
          LOG=changes/active/CHG-20260821-analysis-relevance-voice-type/runner-diagnostic.log
          : > "$LOG"
          exec_step() {
            echo "\n===== $1 =====" | tee -a "$LOG"
            shift
            "$@" 2>&1 | tee -a "$LOG"
            return ${PIPESTATUS[0]}
          }

          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          exec_step "install uv" python -m pip install "uv==${UV_VERSION}"
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then exec_step "lock check" uv lock --check; STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then exec_step "uv sync" uv sync --locked; STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then exec_step "npm ci" npm ci --prefix frontend; STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then exec_step "apply migration" uv run python scripts/dev/apply_analysis_relevance_voice_v3.py; STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then
            python - <<'PY' 2>&1 | tee -a "$LOG"
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: 期望唯一替换片段，实际 {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          excel_path = Path("backend/src/aima_ugc/platform/export/excel.py")
          text = excel_path.read_text(encoding="utf-8")
          for name in ("primary_label", "secondary_label"):
              broken = f'{name} = "' + "\n" + '".join'
              fixed = f'{name} = "\\n".join'
              if broken not in text:
                  raise SystemExit(f"未找到预期的生成字符串错误: {name}")
              text = text.replace(broken, fixed, 1)
          excel_path.write_text(text, encoding="utf-8")

          labeling_path = Path("backend/src/aima_ugc/modules/analysis/content_labeling.py")
          replace_once(
              labeling_path,
              "from typing import Any, Literal, Protocol",
              "from typing import Any, Literal, Protocol, cast",
          )
          replace_once(
              labeling_path,
              """                        sentiment=sentiment,\n                        labels=label_pairs,\n""",
              """                        sentiment=cast(str, sentiment),\n                        labels=label_pairs,\n""",
          )
          replace_once(
              labeling_path,
              """                relevance=relevance,\n                voice_type=voice_type,\n""",
              """                relevance=cast(Literal[\"relevant\", \"irrelevant\"], relevance),\n                voice_type=voice_type,\n""",
          )

          http_path = Path("backend/src/aima_ugc/bootstrap/content_http.py")
          replace_once(
              http_path,
              "from aima_ugc.adapters.persistence.postgres.jobs import PostgresJobRepository\nfrom aima_ugc.contracts.http import (",
              "from aima_ugc.adapters.persistence.postgres.jobs import PostgresJobRepository\nfrom aima_ugc.contracts.analysis import ContentRelevance, ContentVoiceType\nfrom aima_ugc.contracts.http import (",
          )
          replace_once(
              http_path,
              """            relevance=record.analysis.relevance,\n            voice_type=record.analysis.voice_type,\n""",
              """            relevance=cast(ContentRelevance, record.analysis.relevance),\n            voice_type=cast(ContentVoiceType, record.analysis.voice_type),\n""",
          )
          print("已修复一次性生成代码的换行字面量与 Mypy 类型收窄。")
          PY
            STATUS=${PIPESTATUS[0]}
          fi
          if [ "$STATUS" -eq 0 ]; then exec_step "generate contracts" uv run python scripts/contracts/generate.py; STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then exec_step "generate frontend client" npm --prefix frontend run generate:api; STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then
            exec_step "format" uv run ruff format \
              backend/src/aima_ugc/contracts/analysis \
              backend/src/aima_ugc/modules/analysis/content_labeling.py \
              backend/src/aima_ugc/modules/analysis/offline_labeling.py \
              backend/src/aima_ugc/modules/analysis/persistence.py \
              backend/src/aima_ugc/modules/analysis/tables.py \
              backend/src/aima_ugc/adapters/persistence/postgres/analysis.py \
              backend/src/aima_ugc/adapters/persistence/postgres/content_queries.py \
              backend/src/aima_ugc/bootstrap/analysis_worker.py \
              backend/src/aima_ugc/bootstrap/content_http.py \
              backend/src/aima_ugc/contracts/http.py \
              backend/src/aima_ugc/contracts/export/models.py \
              backend/src/aima_ugc/platform/export/excel.py \
              migrations/versions/20260821_0023_analysis_relevance_voice_type.py \
              scripts/contracts/generate.py \
              tests/unit/analysis/test_analysis_relevance_voice_v3.py \
              tests/unit/analysis/test_multilabel_analysis_v2.py \
              tests/unit/analysis/test_content_labeling.py
            STATUS=$?
          fi
          if [ "$STATUS" -eq 0 ]; then
            exec_step "ruff autofix" uv run ruff check --fix \
              backend/src/aima_ugc/contracts/analysis/content_label.py \
              backend/src/aima_ugc/contracts/export/models.py \
              backend/src/aima_ugc/adapters/persistence/postgres/analysis.py \
              tests/unit/analysis/test_analysis_relevance_voice_v3.py
            STATUS=$?
          fi
          if [ "$STATUS" -eq 0 ]; then
            exec_step "green target tests" uv run pytest \
              tests/unit/analysis/test_analysis_relevance_voice_v3.py \
              tests/unit/analysis/test_content_labeling.py \
              tests/unit/analysis/test_multilabel_analysis_v2.py -q
            STATUS=$?
          fi
          if [ "$STATUS" -eq 0 ]; then exec_step "ruff" uv run ruff check backend/src/aima_ugc tests/unit/analysis; STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then exec_step "mypy" uv run mypy backend/src/aima_ugc; STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then exec_step "contract check" uv run python scripts/contracts/generate.py --check; STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then exec_step "frontend typecheck" npm --prefix frontend run typecheck; STATUS=$?; fi

          echo "\nFINAL_STATUS=$STATUS" | tee -a "$LOG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$STATUS" -eq 0 ]; then
            git add -- \
              backend/src/aima_ugc/contracts/analysis/content_label.py \
              backend/src/aima_ugc/contracts/analysis/content_record.py \
              backend/src/aima_ugc/contracts/analysis/__init__.py \
              backend/src/aima_ugc/modules/analysis/prompt_taxonomy.py \
              backend/src/aima_ugc/modules/analysis/prompts/content_labeling_v3.md \
              backend/src/aima_ugc/modules/analysis/content_labeling.py \
              backend/src/aima_ugc/modules/analysis/offline_labeling.py \
              backend/src/aima_ugc/modules/analysis/persistence.py \
              backend/src/aima_ugc/modules/analysis/tables.py \
              backend/src/aima_ugc/adapters/persistence/postgres/analysis.py \
              backend/src/aima_ugc/adapters/persistence/postgres/content_queries.py \
              backend/src/aima_ugc/bootstrap/analysis_worker.py \
              backend/src/aima_ugc/bootstrap/content_http.py \
              backend/src/aima_ugc/modules/content/query.py \
              backend/src/aima_ugc/contracts/http.py \
              backend/src/aima_ugc/contracts/export/models.py \
              backend/src/aima_ugc/platform/export/excel.py \
              backend/src/aima_ugc/adapters/providers/imports_test/test.py \
              migrations/versions/20260821_0023_analysis_relevance_voice_type.py \
              scripts/contracts/generate.py \
              contracts/analysis/content-label-analysis.v3.schema.json \
              contracts/analysis/content-record.v1.schema.json \
              contracts/export/unified-data-excel.v1.schema.json \
              contracts/openapi/openapi.json \
              frontend/src/generated/api/client.ts \
              tests/unit/analysis/test_analysis_relevance_voice_v3.py \
              tests/unit/analysis/test_multilabel_analysis_v2.py \
              tests/unit/analysis/test_content_labeling.py
          fi
          if ! git diff --cached --quiet; then
            git commit -m "增加AI语义相关性与发声类型分类"
            git push origin HEAD:feature/analysis-relevance-voice-type
          fi
          exit "$STATUS"
