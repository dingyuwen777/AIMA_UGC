name: Temporary Fullstack Product Lifecycle Patch V2

on:
  push:
    branches:
      - feature/product-resource-lifecycle
    paths:
      - .github/workflows/tmp-fullstack-product-lifecycle-patch-v2.yml

permissions:
  contents: write

jobs:
  patch-and-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Recover and correct exact patch script
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          script = subprocess.check_output(
              ['git', 'show', 'a89e553826559129dd83896f7375f0dd8c6a0b03:.github/tmp_fullstack_product_lifecycle_patch.py'],
              text=True,
          )
          old = """for old, new, label in replacements:\n    count = text.count(old)\n    if count != 1:\n        raise RuntimeError(f'{label}: expected one anchor, got {count}')\n    text = text.replace(old, new, 1)\n"""
          new = """for old, new, label in replacements:\n    if old not in text:\n        raise RuntimeError(f'{label}: target anchor missing')\n    text = text.replace(old, new, 1)\n"""
          if script.count(old) != 1:
              raise RuntimeError(f'patch-loop anchor count={script.count(old)}')
          Path('/tmp/product_lifecycle_fullstack_patch.py').write_text(
              script.replace(old, new, 1),
              encoding='utf-8',
          )

      - name: Apply full-stack spec patch
        run: python /tmp/product_lifecycle_fullstack_patch.py

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend environment
        run: npm ci --prefix frontend

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Commit specs and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" != "success" ]]; then
            git reset --hard HEAD
          fi
          git rm .github/workflows/tmp-fullstack-product-lifecycle-patch-v2.yml
          if [[ "${{ job.status }}" == "success" ]]; then
            git add \
              frontend/e2e-fullstack/stage12-historical-analysis.spec.ts \
              frontend/e2e-fullstack/admin-product-capabilities.spec.ts
          fi
          git config user.name "AIMA Temporary Validator"
          git config user.email "aima-validator@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "补齐资源生命周期真实用户验收 [skip ci]"
          git push origin HEAD:feature/product-resource-lifecycle
