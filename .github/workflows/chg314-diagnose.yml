name: CHG314 Remaining Failure Diagnostics

on:
  push:
    branches:
      - fix/314-frontend-fullstack-reliability
    paths:
      - .github/workflows/chg314-diagnose.yml

permissions:
  contents: write

jobs:
  browser-mock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
      - name: Run exact Browser Mock suite and capture failure
        shell: bash
        run: |
          set +e
          npm ci --prefix frontend
          cd frontend
          npm run test:e2e > ../browser-mock.log 2>&1
          status=$?
          cd ..
          printf 'exit_code=%s\n' "$status" > browser-mock.status
          exit 0
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: browser-mock-diagnostic
          path: |
            browser-mock.log
            browser-mock.status
          retention-days: 1

  postgres-ingestion:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/chg314-diag/data
      AIMA_LOG_DIR: .runtime/chg314-diag/logs
      AIMA_SECRET_DIR: .runtime/chg314-diag/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'ci-postgres' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"
          uv run alembic upgrade head
      - name: Run exact ingestion integration suite and capture failure
        shell: bash
        run: |
          set +e
          uv run pytest tests/integration/ingestion -q -vv --tb=short > postgres-ingestion.log 2>&1
          status=$?
          printf 'exit_code=%s\n' "$status" > postgres-ingestion.status
          exit 0
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: postgres-ingestion-diagnostic
          path: |
            postgres-ingestion.log
            postgres-ingestion.status
          retention-days: 1

  fullstack:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: stage8f-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/chg314-fullstack/data
      AIMA_LOG_DIR: .runtime/chg314-fullstack/logs
      AIMA_SECRET_DIR: .runtime/chg314-fullstack/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
      AIMA_HISTORICAL_IMPORT_ROOT: .runtime/chg314-fullstack/history
      AIMA_HISTORICAL_CHUNK_ROWS: 100
      AIMA_LLM_BASE_URL: http://127.0.0.1:8091/v1
      AIMA_LLM_PROVIDER_NAME: api.deepseek.com
      AIMA_LLM_MODEL: deepseek-v4-pro
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
      - name: Prepare real full-stack runtime
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
          npm ci --prefix frontend
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'stage8f-ci' > "${AIMA_SECRET_DIR}/postgres_password"
          printf '%s\n' 'stage8f-import-cursor-signing-key-000000000001' > "${AIMA_SECRET_DIR}/import_batch_cursor_signing_key"
          printf '%s\n' 'stage8f-content-cursor-signing-key-000000000001' > "${AIMA_SECRET_DIR}/content_cursor_signing_key"
          printf '%s\n' 'stage8f-runtime-cursor-signing-key-000000000001' > "${AIMA_SECRET_DIR}/collection_runtime_cursor_signing_key"
          printf '%s\n' 'stage8f-dummy-llm-key' > "${AIMA_SECRET_DIR}/llm_api_key"
          chmod 600 "${AIMA_SECRET_DIR}"/*
          uv run alembic upgrade head
          AIMA_FULLSTACK_SEED=1 uv run python tests/fullstack/seed_collection_plan_provider.py
          uv run python tests/fullstack/create_stage8f_excel_fixture.py "${RUNNER_TEMP}/stage8f-fullstack.xlsx" success
          uv run python tests/fullstack/create_stage8f_excel_fixture.py "${RUNNER_TEMP}/stage8f-worker-failure.xlsx" worker-failure
          uv run python tests/fullstack/create_stage8f_excel_fixture.py "${RUNNER_TEMP}/stage8f-manual-review.xlsx" manual-review
          uv run python tests/fullstack/create_stage8f_excel_fixture.py "${RUNNER_TEMP}/admin-product.xlsx" admin-product
          uv run python tests/fullstack/create_stage12_historical_fixture.py "${RUNNER_TEMP}/stage12-current.xlsx" "${AIMA_HISTORICAL_IMPORT_ROOT}"
          uv run python tests/fullstack/seed_stage8f_manual_relevance_review.py "${RUNNER_TEMP}/stage8f-manual-review.xlsx" > "${RUNNER_TEMP}/stage8f-manual-review-seed.txt"
          uv run python tests/fullstack/fake_openai_llm.py >"${RUNNER_TEMP}/stage12-llm.stdout.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/stage12-llm.pid"
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8091/health >/dev/null && break; sleep 1; done
          uv run uvicorn aima_ugc.entrypoints.api_main:app --host 127.0.0.1 --port 8090 >"${RUNNER_TEMP}/stage8f-api.stdout.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/stage8f-api.pid"
          uv run python -m aima_ugc.entrypoints.worker_main >"${RUNNER_TEMP}/stage8f-worker.stdout.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/stage8f-worker.pid"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/health/ready >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8090/health/ready >/dev/null
      - name: Run full-stack specs individually and capture failures
        shell: bash
        env:
          AIMA_STAGE8F_EXCEL_FIXTURE: ${{ runner.temp }}/stage8f-fullstack.xlsx
          AIMA_STAGE8F_FAILURE_EXCEL_FIXTURE: ${{ runner.temp }}/stage8f-worker-failure.xlsx
          AIMA_STAGE12_ORDINARY_FIXTURE: ${{ runner.temp }}/stage12-current.xlsx
          AIMA_ADMIN_PRODUCT_EXCEL_FIXTURE: ${{ runner.temp }}/admin-product.xlsx
          AIMA_FULLSTACK_SEED: 1
        run: |
          set +e
          : > fullstack-summary.txt
          for spec in \
            admin-product-capabilities.spec.ts \
            collection-plan-search-config.spec.ts \
            excel-import.spec.ts \
            manual-relevance-review.spec.ts \
            stage12-historical-analysis.spec.ts; do
            echo "===== ${spec} =====" | tee -a fullstack-summary.txt
            npm --prefix frontend run test:e2e:fullstack -- "${spec}" > "fullstack-${spec}.log" 2>&1
            status=$?
            echo "exit_code=${status}" | tee -a fullstack-summary.txt
            if [ "$status" -ne 0 ]; then
              tail -n 220 "fullstack-${spec}.log" >> fullstack-summary.txt
            fi
          done
          exit 0
      - name: Cleanup processes
        if: always()
        shell: bash
        run: |
          for pid_file in "${RUNNER_TEMP}/stage8f-worker.pid" "${RUNNER_TEMP}/stage8f-api.pid" "${RUNNER_TEMP}/stage12-llm.pid"; do
            if [[ -f "${pid_file}" ]]; then kill "$(cat "${pid_file}")" 2>/dev/null || true; fi
          done
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: fullstack-diagnostic
          path: fullstack-summary.txt
          retention-days: 1

  record:
    if: always()
    needs: [browser-mock, postgres-ingestion, fullstack]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/314-frontend-fullstack-reliability
          fetch-depth: 0
      - uses: actions/download-artifact@v7.0.0
        with:
          pattern: '*-diagnostic'
          path: diagnostic-artifacts
          merge-multiple: true
      - name: Record concise diagnostics and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          out='changes/active/CHG-20260903-frontend-fullstack-reliability/DIAGNOSTICS.md'
          {
            echo '# CHG-314 剩余失败诊断（临时）'
            echo
            echo '## Browser Mock'
            cat diagnostic-artifacts/browser-mock.status 2>/dev/null || true
            echo '```text'
            tail -n 320 diagnostic-artifacts/browser-mock.log 2>/dev/null || true
            echo '```'
            echo
            echo '## PostgreSQL Ingestion'
            cat diagnostic-artifacts/postgres-ingestion.status 2>/dev/null || true
            echo '```text'
            tail -n 320 diagnostic-artifacts/postgres-ingestion.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Real Full-stack'
            echo '```text'
            cat diagnostic-artifacts/fullstack-summary.txt 2>/dev/null || true
            echo '```'
          } > "$out"
          rm -f .github/workflows/chg314-diagnose.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: 记录 CHG-314 剩余失败诊断' -m 'Requirement-Source: #314'
          git push origin HEAD:fix/314-frontend-fullstack-reliability
