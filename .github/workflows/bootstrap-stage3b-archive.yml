name: Bootstrap Stage 3B archive
on:
  push:
    branches: [docs/archive-stage3b-canonical-v1]
permissions:
  contents: write
jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: docs/archive-stage3b-canonical-v1
      - name: Archive completed Change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('changes/active/CHG-20260813-stage3b-canonical-v1/CHANGE.md')
          target = Path('changes/archive/2026-08/CHG-20260813-stage3b-canonical-v1/CHANGE.md')
          text = source.read_text(encoding='utf-8')
          if text.count('status: ready_for_review') != 1:
              raise SystemExit('Stage 3B Change status is not uniquely ready_for_review')
          text = text.replace('status: ready_for_review', 'status: done')
          text += '''\n\n# 完成与合并证据\n\n- PR #11 `建立 Stage 3B Canonical 数据契约 V1` 已 squash merge。\n- 最终 PR head：`4d8d698dd2637e950cdbe5ed47c8d6e03eee2abd`。\n- 最终 PR CI：Run `31719983879`，Stage 1、Stage 2 Platform、Stage 3A Database、Windows bootstrap 全部 success。\n- `main` 合并提交：`25aa02cd9337f3ead9987945ac95565cc99864b6`。\n- 合并后 main CI：Run `31720259226`，四 Job 全部 success。\n- Stage 3B 未创建业务数据 Migration；下一正式工程阶段为 Stage 4 Job Runtime。\n'''
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(text, encoding='utf-8')
          source.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changes
          git commit -m "归档 Stage 3B Canonical 变更记录"
          git push origin HEAD:docs/archive-stage3b-canonical-v1
