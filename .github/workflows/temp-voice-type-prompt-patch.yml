name: Temporary Voice Type Prompt Patch

on:
  push:
    branches:
      - feature/voice-type-prompt-table
    paths:
      - .github/workflows/temp-voice-type-prompt-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/voice-type-prompt-table
          fetch-depth: 0
      - name: Patch Prompt and Excel display names
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          prompt_path = Path("backend/src/aima_ugc/modules/analysis/prompts/content_labeling_v3.md")
          text = prompt_path.read_text(encoding="utf-8")

          old_voice_types = '''  "voice_types": [
              "user_voice",
              "creator_marketing",
              "brand_official",
              "dealer_promotion",
              "media_information",
              "other_organization",
              "unknown"
            ],'''
          new_voice_types = '''  "voice_types": [
              "user_voice",
              "brand_official",
              "dealer_promotion",
              "creator_marketing",
              "industry_professional",
              "media_information",
              "unknown"
            ],'''
          if old_voice_types not in text:
              raise SystemExit("voice_types block not found")
          text = text.replace(old_voice_types, new_voice_types, 1)

          relevance = r'''## 语义相关性判断标准

          先判断 `relevance`，这是关键词粗筛之后的第二层语义复核。机器结构仍只允许 `relevant` / `irrelevant`，判断标准如下：

          | 判断结果 | 核心定义 | 判断说明 |
          | --- | --- | --- |
          | `relevant` | 内容主体与爱玛品牌、产品、购买使用、渠道服务、营销传播或相关事件存在可用于舆情分析的实质语义关联。 | 包括爱玛品牌/车型、价格购买、使用体验、质量故障、电池续航、智能功能、销售售后、渠道门店、营销/代言/活动，以及对爱玛的明确比较、评价、争议或事件关系。 |
          | `irrelevant` | 可见内容无法形成对爱玛有分析价值的实质语义。 | 包括关键词碰撞、同名实体、标签/热词堆砌、正文主体完全是其他品牌/话题且爱玛只是无实质信息的带过或模板尾巴。 |

          ### 语义相关性高混淆场景

          1. 竞品内容只有在明确比较/提及爱玛并形成对爱玛的判断时才算 `relevant`；只讨论竞品本身则是 `irrelevant`。
          2. “信息少但确实在问/说爱玛”仍是 `relevant`，不能因为文本短就删除。
          3. 转发、新闻、官方稿、营销稿只要主体确实与爱玛相关，仍是 `relevant`；相关性和发声类型是两个独立判断。
          4. 作者名里出现“爱玛”不能替代正文语义判断；反过来，标题已明确建立爱玛语境时，也不能因为正文没有重复品牌名就判无关。

          ### 语义相关性示例

          - “爱玛 Q7 冬天续航大概多少？” → `relevant`，虽然文本很短，但明确在询问爱玛产品。
          - “雅迪这款比爱玛同价位车型起步更快，但爱玛坐垫更舒服。” → `relevant`，因为对爱玛形成了明确比较和评价。
          - 正文讨论一个名叫“爱玛”的人物，与爱玛电动车品牌、产品、服务、渠道和营销均无关系 → `irrelevant`。
          - 正文主体完全讨论其他品牌，结尾只机械带一个“#爱玛”标签，没有任何爱玛信息 → `irrelevant`。
          '''

          voice = r'''## 内容发声类型判断标准

          `voice_type` 表示**当前内容的发声类型**，不是对账号真实法律身份、职业或商业合作关系作事实认定。合法机器值以机器 Taxonomy `voice_types` 为准；业务判断统一维护在下表，后续增加或调整类别时，同步修改机器 Taxonomy 和本表/示例即可。

          | 推荐名称 | 机器值 | 核心定义 | 说明 |
          | --- | --- | --- | --- |
          | **真实用户发声** | `user_voice` | 普通消费者基于真实购买、使用、咨询、投诉、推荐、提车等自然表达；没有明显品牌、行业、营销或组织化传播特征。 | 作者名称不包含明显品牌/电动车行业经营相关词；标题、正文不存在明显营销推广、活动任务、二手交易等内容。出现“爱玛骑遇团”“出二手车/转让车辆/收车”等组织化或交易性内容时，不判为真实用户。 |
          | **品牌官方发声** | `brand_official` | 爱玛品牌、子品牌、官方认证账号或明确以品牌第一方身份发布的产品、活动、声明等。 | 作者名称为以下业务明确主体时，是品牌官方的强证据：爱玛电动车、爱玛三轮电动车、爱玛精品周边、爱玛东二楼、我是玛小爱、元宇宙女孩的实验室、爱玛官方旗舰店、爱玛电动车生活服务旗舰店、爱玛本地直播间、爱玛马赫、爱玛电动三轮车、爱玛科学实验室、爱玛官方骑行装备、爱玛三轮官方团购直播间、爱玛服务、爱玛金标电池、AAA电动车批发王总、B爱玛马赫。命中名单仍要结合当前内容确认是第一方品牌传播，而不是据此推断账号法律身份。 |
          | **门店经销商发声** | `dealer_promotion` | 爱玛门店、经销商、销售、加盟商等渠道主体发布的车型展示、报价、优惠、到店、成交、上牌等内容。 | 作者名称出现“爱玛+车行/门店/专卖店/销售/经销/当地地名”等渠道特征，或正文具有明显卖车、报价、优惠、现车、到店等获客目的。 |
          | **营销推广发声** | `creator_marketing` | 非官方、非门店主体发布的品牌活动、达人/KOC 种草、合作推广、任务打卡、爱玛骑遇团等组织化营销内容。 | 作者名称看起来不是爱玛官方或门店，但标题/正文出现“爱玛骑遇团”、品牌活动、合作体验、统一种草、导购、活动打卡等明显营销传播特征。 |
          | **行业从业发声** | `industry_professional` | 修车、电动车行业、二手车、车行、竞品从业者等行业相关主体，以维修、行业讨论、交易或专业视角发声。 | 作者名称出现“修车、维修、二手车、车业、车行、电动车、三轮车、雅迪”等行业属性，但不能确认属于爱玛官方或爱玛经销体系。 |
          | **媒体机构发声** | `media_information` | 新闻媒体、资讯号、政府、协会、学校、企业机构等以报道、资讯、公告、公共事务等形式发布。 | 内容主体主要是新闻报道、行业资讯、政策公告、合作通知等，而非个人体验、卖车或营销种草。 |
          | **无法判断** | `unknown` | 可见信息不足，无法可靠确定属于哪一类。 | 综合标题、正文和作者公开信息后仍无法分类时使用；不要为了提高覆盖率硬猜。 |

          ### 先组合两层证据，再分类

          **主体证据**回答“谁在说”：综合作者展示名、公开简介、认证文案判断账号呈现出的主体属性。昵称、简介或认证中的任意一个单独信号都不能自动决定类型，更不能据此断言账号真实法律身份或存在商业合作。

          **表达目的证据**回答“这条内容为什么这样说”：综合标题和正文判断当前内容的主要目的，是个人体验/观点/求助、品牌第一方传播、门店获客、组织化营销、行业维修/交易/专业讨论，还是媒体机构报道/公告。

          必须同时阅读 `title`、`text`、`author.display_name`、`author.bio`、`author.verification_label` 中实际提供的内容。作者信息和标题/正文相互印证时可以加强判断；两者冲突时，以**当前内容的主要表达目的**为主，作者信息只作为辅助。不得因为某一个词、某一种口吻或某一个昵称机械分类。

          ### 发声类型高混淆场景

          1. **真实用户发声 vs 营销推广发声**
             - 第一人称真实购买、长期使用、故障投诉、个人比较、咨询求助、提车经历等，是 `user_voice` 的强证据。
             - “博主、达人、KOC、测评”等作者标签本身不是营销证据；没有合作、任务、导购或转化目的时，仍可判真实用户发声。
             - “爱玛骑遇团”、品牌活动任务、合作体验、统一卖点式种草、直播间/购物入口、领券、下单、到店转化、活动打卡等组织化营销信号出现时，优先判 `creator_marketing`。
             - 仅出现“推荐、好用、值得买”等普通个人评价，不能单独判营销。

          2. **真实用户发声 vs 行业从业发声**
             - 普通消费者谈自己的购买、使用、咨询、投诉或提车，判 `user_voice`。
             - 作者或正文出现持续性的修车、维修、二手车、收车、车业、电动车经营、竞品从业等行业属性，且内容以维修、交易或专业讨论为主时，判 `industry_professional`。
             - “出二手车/转让车辆/收车”等交易性表达不判真实用户；若可确认是行业/二手交易主体则判 `industry_professional`，仍无法确认主体时使用其他更有证据的类型或 `unknown`，不要硬塞回 `user_voice`。

          3. **品牌官方发声 vs 门店经销商发声**
             - 品牌第一方产品发布、品牌活动、代言官宣、官方声明和统一品牌传播判 `brand_official`。
             - 地方门店、经销商、销售围绕价格、库存、到店、成交、上牌和留资发布内容判 `dealer_promotion`；不能因为使用爱玛 Logo 或品牌名就自动判官方。
             - 作者昵称含“爱玛”但不在明确官方名单、也缺乏第一方/门店证据时，不得仅凭昵称定类。

          4. **门店经销商发声 vs 行业从业发声**
             - 能确认属于爱玛门店、经销商、销售或加盟体系，并以卖车/获客为目的时判 `dealer_promotion`。
             - 只有“车行、修车、电动车、二手车、雅迪”等行业属性，不能确认属于爱玛渠道体系时判 `industry_professional`。
             - “车行”一词本身不能直接判爱玛经销商，必须结合“爱玛+门店/专卖店/销售/当地地名”等渠道证据或正文获客语义。

          5. **营销推广发声 vs 行业从业发声**
             - 品牌活动、达人/KOC 种草、合作体验、任务打卡、爱玛骑遇团等以传播品牌/活动为主要目的时判 `creator_marketing`。
             - 修车教程、二手交易、行业观察、竞品从业观点、专业维修/技术讨论等不以品牌营销为主要目的时判 `industry_professional`。

          6. **媒体机构发声与其他类型**
             - 新闻媒体、资讯号、政府、协会、学校、企业机构以第三方报道、行业资讯、政策公告、合作通知、公共事务为主要内容时判 `media_information`。
             - 被报道对象是爱玛不等于品牌官方；发布合作通知的政府/学校/协会也属于媒体机构发声这一类，而不再使用独立“其他机构”当前分类。
             - 用户转发新闻后加入大量自己的真实体验、投诉或购买判断，且个人表达成为主体时，可判 `user_voice`。

          7. **无法判断的使用**
             - 作者资料缺失不等于必须 `unknown`：如果标题/正文已经清楚显示个人体验、门店获客、行业维修交易、营销任务或媒体公告，应按内容证据分类。
             - 极短、模板化，或主体和表达目的都含混且没有足够证据区分时，才使用 `unknown`。

          ### 发声类型示例

          - 作者“通勤小林”，简介“分享日常通勤和骑行体验”，正文“爱玛 Q7 骑了一年，冬天续航短一些但通勤够用” → `user_voice`。
          - 作者“骑行阿Ken”，简介显示出行博主，但正文只是自费使用后的个人优缺点体验，没有合作、任务、导购或转化信息 → `user_voice`。
          - 非官方账号正文写“爱玛骑遇团打卡第 3 天，完成指定路线并带活动话题” → `creator_marketing`。
          - 同一创作者正文明确写品牌合作、直播间下单、领券或购买引导 → `creator_marketing`。
          - 作者“爱玛XX旗舰店/销售小王”，正文强调现车、到店优惠、报价、上牌、私信咨询 → `dealer_promotion`。
          - 作者“老张修车”，正文讲爱玛某车型控制器故障排查和维修经验 → `industry_professional`。
          - 作者“二手电动车老王”，正文“收爱玛旧车/出二手车/支持置换” → `industry_professional`。
          - “爱玛科学实验室”发布品牌技术实验、新品信息或官方活动 → `brand_official`。
          - 作者“XX财经/电动车观察”等媒体资讯主体报道爱玛事件，或政府/协会/学校发布与爱玛有关的合作、公告 → `media_information`。
          - 作者和正文都极少，无法判断是个人、营销、门店、行业、官方还是媒体机构 → `unknown`。
          '''

          sentiment = r'''## 情感判断标准

          情感只判断**内容对爱玛本身的态度**。合法值以机器 Taxonomy `sentiments` 为准，当前判断标准如下：

          | 情感 | 核心定义 | 判断说明 |
          | --- | --- | --- |
          | **正面** | 对爱玛品牌、产品、服务、价格政策、渠道或使用体验有明确认可、满意、推荐、支持或表扬。 | 只要正向态度是内容的主要有效评价，且没有同等重要的负面评价，即判正面。 |
          | **中性** | 主要是客观信息、事实、新闻、配置、价格或政策说明，没有明确正负态度。 | 对相关内容确实缺少态度信息时使用中性；不能因为是新闻/官方/营销内容就自动中性，仍需看是否表达明显评价。 |
          | **负面** | 存在明确投诉、批评、质疑、不满、失望、风险指控或负面体验。 | 当负面评价是主要有效态度、且没有同等重要的正面评价时判负面。 |
          | **混合** | 对爱玛本身同时存在具有实质信息量的正面和负面评价，且任何一方都不能忽略。 | 必须是对爱玛本身的正负并存；对竞品负面、同时对爱玛正面，不等于对爱玛“混合”。 |

          ### 情感高混淆场景

          1. “外观很好看，就是价格有点贵”只有当两方面都具有实质评价、无法忽略时才判 `混合`；轻微转折不自动升级为混合。
          2. 对竞品进行负面评价、同时明确认可爱玛，只判断爱玛态度，通常是 `正面`，不是 `混合`。
          3. 客观报道负面事件，如果文本明确把问题归因于爱玛或表达质疑/风险，可判 `负面`；纯事实转述且无态度时可判 `中性`。
          4. 门店优惠、品牌活动或营销内容不是天然 `正面`；没有明确评价时仍可判 `中性`。
          5. 用户称赞产品但强烈投诉售后，且两部分都是主要内容时应判 `混合`。

          ### 情感判断示例

          - “这辆爱玛骑起来很稳，续航也够我通勤，挺满意” → `正面`。
          - “爱玛发布新车型，官方指导价 3999 元，本周开始上市” → `中性`。
          - “维修三次还没修好，客服一直推诿，太失望了” → `负面`。
          - “外观和骑行体验都很好，但反复断电且售后一直没解决” → `混合`。
          '''

          def replace_section(source: str, start: str, end: str, replacement: str) -> str:
              pattern = re.compile(re.escape(start) + r".*?(?=" + re.escape(end) + r")", re.S)
              updated, count = pattern.subn(replacement.strip() + "\n\n", source, count=1)
              if count != 1:
                  raise SystemExit(f"section replacement failed: {start}")
              return updated

          text = replace_section(text, "## 语义相关性判断标准", "## 内容发声类型判断标准", relevance)
          text = replace_section(text, "## 内容发声类型判断标准", "## 情感判断标准", voice)
          text = replace_section(text, "## 情感判断标准", "## 一级/二级标签判断标准", sentiment)

          if "## 多主题与边界冲突优先级" not in text:
              raise SystemExit("label boundary heading not found")
          text = text.replace(
              "## 多主题与边界冲突优先级",
              "### 一级/二级标签高混淆场景",
              1,
          )
          if "\n## 示例\n" not in text:
              raise SystemExit("label examples heading not found")
          text = text.replace("\n## 示例\n", "\n### 一级/二级标签示例\n", 1)
          prompt_path.write_text(text, encoding="utf-8")

          excel_path = Path("backend/src/aima_ugc/platform/export/excel.py")
          excel = excel_path.read_text(encoding="utf-8")
          old_mapping = '''_VOICE_TYPE_DISPLAY_NAMES = {
              "user_voice": "真实用户发声",
              "creator_marketing": "达人/创作者营销",
              "brand_official": "品牌官方传播",
              "dealer_promotion": "经销商/门店推广",
              "media_information": "媒体/资讯转载",
              "other_organization": "其他机构传播",
              "unknown": "无法判断",
          }'''
          new_mapping = '''_VOICE_TYPE_DISPLAY_NAMES = {
              "user_voice": "真实用户发声",
              "brand_official": "品牌官方发声",
              "dealer_promotion": "门店经销商发声",
              "creator_marketing": "营销推广发声",
              "industry_professional": "行业从业发声",
              "media_information": "媒体机构发声",
              "unknown": "无法判断",
              "other_organization": "其他机构传播",
          }'''
          if old_mapping not in excel:
              raise SystemExit("Excel voice type mapping not found")
          excel_path.write_text(excel.replace(old_mapping, new_mapping, 1), encoding="utf-8")
          PY

          rm .github/workflows/temp-voice-type-prompt-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/aima_ugc/modules/analysis/prompts/content_labeling_v3.md \
                  backend/src/aima_ugc/platform/export/excel.py \
                  .github/workflows/temp-voice-type-prompt-patch.yml
          git commit -m "调整：更新发声类型与 Prompt 判断表格"
          git push origin HEAD:feature/voice-type-prompt-table
