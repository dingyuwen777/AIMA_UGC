              text = text.replace(insertion_anchor, new_test + insertion_anchor, 1)
          path.write_text(text, encoding="utf-8")
          PY
          uv run ruff format tests/integration/collection/test_comprehensive_corrective_runtime.py tests/integration/collection/test_collection_scope_replies_runtime.py tests/unit/collection/test_comprehensive_corrective_invariants.py
          uv run ruff check --fix tests/integration/collection/test_comprehensive_corrective_runtime.py tests/integration/collection/test_collection_scope_replies_runtime.py tests/unit/collection/test_comprehensive_corrective_invariants.py
          uv run ruff format --check tests/integration/collection/test_comprehensive_corrective_runtime.py tests/integration/collection/test_collection_scope_replies_runtime.py tests/unit/collection/test_comprehensive_corrective_invariants.py
          uv run ruff check tests/integration/collection/test_comprehensive_corrective_runtime.py tests/integration/collection/test_collection_scope_replies_runtime.py tests/unit/collection/test_comprehensive_corrective_invariants.py

      - name: Confirm current implementation is Red
