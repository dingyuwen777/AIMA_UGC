          from pathlib import Path

          # 统一技术分页上限与 Deadline sizing，不作为发送次数/费用 Budget gate。
          Path("backend/src/aima_ugc/modules/collection/execution_limits.py").write_text(
              '''"""Collection 生产执行技术上限与 Job Deadline sizing。\n\n这些值只用于技术分页防护和 Deadline 容量下限，不是费用/请求 Budget，也不在发送前拦截请求。\n"""\n\nMAX_SEARCH_PAGES = 100\nMAX_COMMENT_PAGES = 100\nMAX_SUB_COMMENT_PAGES = 100\nDEADLINE_SAFETY_PERCENT = 20\nMIN_DEADLINE_SAFETY_SECONDS = 60\n\n\ndef provider_execution_window_floor_seconds(\n    *,\n    scope_count: int,\n    request_timeout_seconds: float,\n) -> int:\n    """按 Scope 数、技术分页深度和单请求 timeout 推导有限 Deadline 下限。"""\n    if scope_count < 1:\n        raise ValueError("scope_count 必须至少为 1")\n    if request_timeout_seconds <= 0:\n        raise ValueError("request_timeout_seconds 必须大于 0")\n    paginated_depth_per_scope = (\n        MAX_SEARCH_PAGES + MAX_COMMENT_PAGES + MAX_SUB_COMMENT_PAGES\n    )\n    base_seconds = int(\n        scope_count * paginated_depth_per_scope * request_timeout_seconds\n    )\n    if base_seconds < 1:\n        base_seconds = 1\n    percentage_margin = (\n        base_seconds * DEADLINE_SAFETY_PERCENT + 99\n    ) // 100\n    return base_seconds + max(\n        MIN_DEADLINE_SAFETY_SECONDS,\n        percentage_margin,\n    )\n\n\n__all__ = [\n    "DEADLINE_SAFETY_PERCENT",\n    "MAX_COMMENT_PAGES",\n    "MAX_SEARCH_PAGES",\n    "MAX_SUB_COMMENT_PAGES",\n    "MIN_DEADLINE_SAFETY_SECONDS",\n    "provider_execution_window_floor_seconds",\n]\n''',
