name: Stage 5B Collection Execution

on:
  push:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/modules/collection/**"
      - "backend/src/aima_ugc/adapters/persistence/postgres/collection.py"
      - "backend/src/aima_ugc/database_schema.py"
      - "migrations/versions/**"
      - "tests/unit/collection/**"
      - "tests/integration/collection/**"
      - "scripts/quality/check_architecture.py"
      - ".github/workflows/stage5b-collection-execution.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/modules/collection/**"
      - "backend/src/aima_ugc/adapters/persistence/postgres/collection.py"
      - "backend/src/aima_ugc/database_schema.py"
      - "migrations/versions/**"
      - "tests/unit/collection/**"
      - "tests/integration/collection/**"
      - "scripts/quality/check_architecture.py"
      - ".github/workflows/stage5b-collection-execution.yml"

permissions:
  contents: read

jobs:
  stage5b-collection-execution:
    name: Stage 5B Collection Execution
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: stage5b-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/ci-stage5b/data
      AIMA_LOG_DIR: .runtime/ci-stage5b/logs
      AIMA_SECRET_DIR: .runtime/ci-stage5b/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Prepare Stage 5B Secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'stage5b-ci' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"

      - name: Collection unit and Provider contract tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/collection tests/contracts/test_provider_v1.py -q

      - name: Upgrade empty database to Stage 5B head
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
          uv run python - <<'PY'
          from sqlalchemy import inspect

          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.database import DatabaseRuntime

          runtime = DatabaseRuntime(load_settings())
          try:
              inspector = inspect(runtime.engine)
              existing = set(inspector.get_table_names())
              run_foreign_keys = inspector.get_foreign_keys("collection_runs")
              run_uniques = {
                  tuple(item["column_names"])
                  for item in inspector.get_unique_constraints("collection_runs")
              }
              scope_uniques = {
                  tuple(item["column_names"])
                  for item in inspector.get_unique_constraints("collection_scopes")
              }
              run_indexes = {item["name"] for item in inspector.get_indexes("collection_runs")}
              scope_indexes = {item["name"] for item in inspector.get_indexes("collection_scopes")}
          finally:
              runtime.dispose()

          required = {
              "artifacts",
              "system_settings",
              "audit_events",
              "jobs",
              "job_attempt_events",
              "collection_runs",
              "collection_scopes",
          }
          assert required <= existing, existing
          assert any(
              item["constrained_columns"] == ["job_id"]
              and item["referred_table"] == "jobs"
              and item["referred_columns"] == ["id"]
              for item in run_foreign_keys
          ), run_foreign_keys
          assert ("job_id",) in run_uniques, run_uniques
          assert (
              "run_id",
              "platform",
              "source_type",
              "source_value",
              "operation_group",
          ) in scope_uniques, scope_uniques
          assert "ix_collection_runs_status_created_at" in run_indexes, run_indexes
          assert "ix_collection_scopes_run_id_status" in scope_indexes, scope_indexes
          PY

      - name: PostgreSQL Collection integration tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/collection -q

      - name: Stage 5B quality gates
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py

      - name: Downgrade to base and re-upgrade
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade base
          uv run python - <<'PY'
          from sqlalchemy import inspect

          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.database import DatabaseRuntime

          runtime = DatabaseRuntime(load_settings())
          try:
              existing = set(inspect(runtime.engine).get_table_names())
          finally:
              runtime.dispose()
          application_tables = {
              "artifacts",
              "system_settings",
              "audit_events",
              "jobs",
              "job_attempt_events",
              "collection_runs",
              "collection_scopes",
          }
          assert not (application_tables & existing), existing
          PY
          uv run alembic upgrade head
          uv run alembic check

      - name: Downgrade to previous revision and re-upgrade
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade 20260814_0002
          uv run python - <<'PY'
          from sqlalchemy import inspect

          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.database import DatabaseRuntime

          runtime = DatabaseRuntime(load_settings())
          try:
              existing = set(inspect(runtime.engine).get_table_names())
          finally:
              runtime.dispose()
          previous = {
              "artifacts",
              "system_settings",
              "audit_events",
              "jobs",
              "job_attempt_events",
          }
          assert previous <= existing, existing
          assert not ({"collection_runs", "collection_scopes"} & existing), existing
          PY
          uv run alembic upgrade head
          uv run alembic check
