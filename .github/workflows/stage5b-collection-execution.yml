name: Stage 5B Collection Execution

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/modules/collection/**"
      - "docs/**"
      - "changes/active/CHG-20260818-stage1-stage7-comprehensive-corrective/**"
      - "tests/unit/collection/**"
      - "scripts/quality/_final_docs_sync.py"
      - ".github/workflows/stage5b-collection-execution.yml"

permissions:
  contents: write

jobs:
  final-docs-sync:
    if: github.head_ref == 'fix/stage1-stage7-comprehensive-corrective'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/stage1-stage7-comprehensive-corrective
          fetch-depth: 0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install frozen environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q "uv==$(tr -d '\r\n' < .uv-version)"
          uv lock --check
          uv sync --locked --quiet

      - name: Synchronize long-term facts
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/quality/_final_docs_sync.py
          uv run ruff format tests/unit/collection/test_stage1_stage7_comprehensive_corrective.py
          uv run ruff check tests/unit/collection/test_stage1_stage7_comprehensive_corrective.py
          uv run pytest tests/unit/collection/test_stage1_stage7_comprehensive_corrective.py -q
          uv run python scripts/quality/check_docs.py
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py
          uv run python scripts/quality/scan_secrets.py
          git diff --check

      - name: Commit verified docs and remove temporary infrastructure
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/stage5b-collection-execution.yml
          git rm -f scripts/quality/_final_docs_sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/aima_ugc/modules/collection/README.md docs changes tests/unit/collection/test_stage1_stage7_comprehensive_corrective.py .github/workflows/stage5b-collection-execution.yml
          git diff --cached --check
          git commit -m "docs: synchronize Stage 1-7 corrective facts"
          git push origin HEAD:fix/stage1-stage7-comprehensive-corrective
