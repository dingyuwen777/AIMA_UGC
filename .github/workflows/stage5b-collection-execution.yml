name: Stage 5B Collection Execution

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/modules/collection/**"
      - "backend/src/aima_ugc/adapters/persistence/postgres/collection.py"
      - "backend/src/aima_ugc/database_schema.py"
      - "migrations/versions/**"
      - "tests/unit/collection/**"
      - "tests/integration/collection/**"
      - "scripts/quality/check_architecture.py"
      - "scripts/quality/_final_corrective_runner.py"
      - ".github/workflows/stage5b-collection-execution.yml"

permissions:
  contents: write

jobs:
  final-corrective-red-green:
    if: github.head_ref == 'fix/stage1-stage7-comprehensive-corrective'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: final-corrective-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/final-corrective/data
      AIMA_LOG_DIR: .runtime/final-corrective/logs
      AIMA_SECRET_DIR: .runtime/final-corrective/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/stage1-stage7-comprehensive-corrective
          fetch-depth: 0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install and migrate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q "uv==$(tr -d '\r\n' < .uv-version)"
          uv lock --check
          uv sync --locked --quiet
          mkdir -p "$AIMA_DATA_DIR" "$AIMA_LOG_DIR" "$AIMA_SECRET_DIR"
          printf '%s\n' 'final-corrective-ci' > "$AIMA_SECRET_DIR/postgres_password"
          chmod 600 "$AIMA_SECRET_DIR/postgres_password"
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check

      - name: Red regression evidence
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/quality/_final_corrective_runner.py write-tests
          uv run ruff format tests/integration/collection/test_comprehensive_corrective_runtime.py tests/integration/collection/test_collection_scope_replies_runtime.py tests/unit/collection/test_comprehensive_corrective_invariants.py
          uv run ruff check --fix tests/integration/collection/test_comprehensive_corrective_runtime.py tests/integration/collection/test_collection_scope_replies_runtime.py tests/unit/collection/test_comprehensive_corrective_invariants.py
          uv run ruff format --check tests/integration/collection/test_comprehensive_corrective_runtime.py tests/integration/collection/test_collection_scope_replies_runtime.py tests/unit/collection/test_comprehensive_corrective_invariants.py
          uv run ruff check tests/integration/collection/test_comprehensive_corrective_runtime.py tests/integration/collection/test_collection_scope_replies_runtime.py tests/unit/collection/test_comprehensive_corrective_invariants.py
          set +e
          uv run pytest \
            tests/unit/collection/test_comprehensive_corrective_invariants.py::test_scheduled_job_deadline_has_provider_execution_floor_for_short_cadence \
            tests/integration/collection/test_comprehensive_corrective_runtime.py::test_scope_persists_durable_actions_extensions_and_thread_coverage \
            tests/integration/collection/test_collection_scope_replies_runtime.py \
            -q --tb=short
          red_status=$?
          set -e
          if [ "$red_status" -eq 0 ]; then
            echo "Expected final-review regressions to be Red before production fix"
            exit 1
          fi
          echo "Red confirmed for final-review findings"

      - name: Apply production fixes and Green targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/quality/_final_corrective_runner.py apply-fixes
          uv run python - <<'PY'
          from pathlib import Path

          content_path = Path("backend/src/aima_ugc/adapters/persistence/postgres/content_complete.py")
          text = content_path.read_text(encoding="utf-8")
          if "comment_thread_coverage_observations_table," not in text:
              anchor = "from aima_ugc.modules.content.extended_tables import (\n"
              if anchor not in text:
                  raise SystemExit("content_complete extended_tables import anchor missing")
              text = text.replace(
                  anchor,
                  anchor + "    comment_thread_coverage_observations_table,\n",
                  1,
              )
          content_path.write_text(text, encoding="utf-8")

          for name in (
              "backend/src/aima_ugc/modules/content/extended_tables.py",
              "migrations/versions/20260818_0018_stage1_stage7_comprehensive_corrective.py",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  'name="complete_count_consistent"',
                  'name="complete_count"',
              )
              text = text.replace(
                  'name="nonfetch_count_zero"',
                  'name="nonfetch_zero"',
              )
              path.write_text(text, encoding="utf-8")
          PY
          changed=(
            backend/src/aima_ugc/modules/collection/execution_limits.py
            backend/src/aima_ugc/adapters/providers/tikhub/transport.py
            backend/src/aima_ugc/bootstrap/collection_scope.py
            backend/src/aima_ugc/bootstrap/scheduler.py
            backend/src/aima_ugc/adapters/persistence/postgres/collection_content.py
            backend/src/aima_ugc/adapters/persistence/postgres/content_complete.py
            backend/src/aima_ugc/modules/content/extended_tables.py
            migrations/versions/20260818_0018_stage1_stage7_comprehensive_corrective.py
            tests/integration/collection/test_comprehensive_corrective_runtime.py
            tests/integration/collection/test_collection_scope_replies_runtime.py
            tests/unit/collection/test_comprehensive_corrective_invariants.py
          )
          uv run ruff format "${changed[@]}"
          uv run ruff check --fix "${changed[@]}"
          uv run ruff format --check "${changed[@]}"
          uv run ruff check "${changed[@]}"
          uv run alembic downgrade 20260817_0017
          uv run alembic upgrade head
          uv run alembic check
          uv run pytest \
            tests/unit/collection/test_comprehensive_corrective_invariants.py::test_scheduled_job_deadline_has_provider_execution_floor_for_short_cadence \
            tests/integration/collection/test_comprehensive_corrective_runtime.py::test_scope_persists_durable_actions_extensions_and_thread_coverage \
            tests/integration/collection/test_collection_scope_replies_runtime.py \
            -q

      - name: Full corrective verification
        shell: bash
        run: |
          set -euo pipefail
          uv run mypy backend/src/aima_ugc
          uv run pytest tests/unit/collection tests/contracts/test_provider_v1.py -q
          uv run pytest tests/integration/collection -q
          uv run pytest tests/integration/content -q
          uv run pytest tests/integration/database -q
          uv run alembic check
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py

      - name: Migration round trip
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade 20260817_0017
          uv run alembic upgrade head
          uv run alembic check

      - name: Commit verified fixes and remove temporary infrastructure
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/quality/_final_corrective_runner.py cleanup-trigger
          git fetch origin main
          git checkout origin/main -- .github/workflows/stage5b-collection-execution.yml
          git rm -f scripts/quality/_final_corrective_runner.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/aima_ugc migrations tests .github/workflows/stage5b-collection-execution.yml
          git diff --cached --check
          git commit -m "fix: close final corrective review findings"
          git push origin HEAD:fix/stage1-stage7-comprehensive-corrective
