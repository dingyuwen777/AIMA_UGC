name: Archive issue 335 change once

on:
  push:
    branches:
      - chore/archive-issue-335-analysis-provider-concurrency
    paths:
      - .github/workflows/archive-issue-335-once.yml

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout archive branch
        uses: actions/checkout@v7.0.1
        with:
          ref: chore/archive-issue-335-analysis-provider-concurrency
          fetch-depth: 0

      - name: Finalize and move Change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          active = Path("changes/active/CHG-20260904-010706-analysis-provider-concurrency/CHANGE.md")
          archive = Path("changes/archive/2026-09/CHG-20260904-010706-analysis-provider-concurrency/CHANGE.md")
          text = active.read_text(encoding="utf-8")

          if text.count("status: ready_for_review") != 1:
              raise SystemExit("Unexpected Change status shape")
          text = text.replace("status: ready_for_review", "status: done", 1)

          rewritten: list[str] = []
          r9_seen = False
          coverage_seen = False
          for line in text.splitlines():
              if line.startswith("| R9 |"):
                  r9_seen = True
                  line = (
                      "| R9 | 不引入新中间件/Schema/依赖升级，文档/CI/Review/归档完整 | "
                      "https://github.com/dingyuwen777/AIMA_UGC/issues/335 | explicitly_deferred | "
                      "PR #336 已以最终 HEAD `b569c65427d1bed6d2b3456f221c606cd8415168` 通过永久门禁后 guarded squash merge 为 "
                      "`main@571049dda1a2bd1683fe01c14023cd417e62ec66`；implementation main-fresh CI #4027 / run `33828574894` "
                      "attempt 2、Runtime Acceptance #1148 / run `33828574738`、Developer Tooling #461 / run `33828574714`、"
                      "Change Completion Gate #1903 / run `33828574717` 均 success。CI #4027 attempt 1 的 Repository Quality 唯一失败为 "
                      "npm registry advisory endpoint 网络超时，同一 main SHA 的 attempt 2 已重新完成 npm audit 与 CI Gate。归档 PR 合并、archive-main fresh、"
                      "Issue #335 关闭和已合并任务分支清理仍按时序在本归档 PR 合并后完成。 |"
                  )
              elif line.startswith("- [x] change_coverage:"):
                  coverage_seen = True
                  line = (
                      "- [x] change_coverage: R1-R8 已映射到代码、Contract、Unit、真实 PostgreSQL/Full-stack 或受控基准证据；"
                      "R9 中 implementation merge 与 main-fresh 已完成并固化证据，归档 PR 合并、archive-main fresh、Issue #335 关闭与分支清理继续作为时序后置动作显式保留。"
                  )
              rewritten.append(line)
          if not r9_seen or not coverage_seen:
              raise SystemExit("Unexpected R9/completion audit shape")
          text = "\n".join(rewritten) + "\n"

          marker = "# 当前状态\n"
          before, sep, _old_current = text.partition(marker)
          if not sep:
              raise SystemExit("Missing current status section")

          evidence = (
              "# Implementation Main-Fresh 证据\n\n"
              "Implementation PR #336 在最终候选 HEAD `b569c65427d1bed6d2b3456f221c606cd8415168` 上完成 required CI、Runtime、Tooling、Release dry-run、Completion Gate 与独立 re-review 后，以 `expected_head_sha` guarded squash merge 进入 `main`，实际 merge SHA 为 `571049dda1a2bd1683fe01c14023cd417e62ec66`。\n\n"
              "同一 implementation main SHA 的 push 证据：\n\n"
              "- CI #4027 / run `33828574894`：attempt 2 `success`；Docs/Governance、PostgreSQL Integration、Real Full-stack、Repository Quality 与 CI Gate 全绿。attempt 1 的唯一失败是 `npm audit` 调用 npm registry advisory endpoint 发生网络 timeout；`npm ci` 当时已报告 0 vulnerabilities，同一 SHA 的 attempt 2 重新执行 advisory audit 及完整 Repository Quality 后成功，因此记录为基础设施重试而非代码/依赖漏洞修复。\n"
              "- Runtime Acceptance #1148 / run `33828574738`：`success`；canonical Compose、宿主目录、Windows overlay、权限与重启持久化全部通过。\n"
              "- Developer Tooling Compatibility #461 / run `33828574714`：`success`；Linux/Windows 本地开发、Compose、Secret 与 PostgreSQL bootstrap 全部通过。\n"
              "- Change Completion Gate #1903 / run `33828574717`：`success`。\n"
              "- implementation main-fresh 汇总：代码与文档 HEAD 保持 `571049dda1a2bd1683fe01c14023cd417e62ec66`，未通过新增提交规避失败；Issue #335 故意保持 open，等待独立归档 PR 合并并取得 archive-main fresh 后再关闭。\n\n"
          )
          current = (
              "# 当前状态\n\n"
              "- Issue #335 是唯一上游需求来源；Implementation PR #336 已 guarded squash merge 到 `main@571049dda1a2bd1683fe01c14023cd417e62ec66`。\n"
              "- implementation main-fresh CI、Runtime Acceptance、Developer Tooling 与 Change Completion Gate 已全部成功；首次 main CI 的 npm advisory 网络 timeout 已由同 SHA attempt 2 重试证明为外部基础设施瞬时故障。\n"
              "- 功能实现、测试资产、文档、generated artifacts 与受控 Formal/Offline 98.86% 吞吐证据均已固化；独立 re-review 当前无未解决 BLOCKER/HIGH/MEDIUM Finding。\n"
              "- Change 已完成实现阶段并进入独立归档；本文件随归档分支从 `changes/active/` 移入 `changes/archive/2026-09/`，状态更新为 `done`。\n"
              "- 真实 Provider 250/1000 容量 Probe 仍未执行，不能从 Fake/受控证据推断任意实际模型部署一定承受该并发。\n"
              "- 本归档 PR 合并后仍需验证 archive-main fresh、关闭 Issue #335，并清理已合并的 implementation/归档任务分支；这些后置动作不得在归档合并前伪造为已完成。\n"
          )
          text = before + evidence + current

          archive.parent.mkdir(parents=True, exist_ok=True)
          archive.write_text(text, encoding="utf-8")
          active.unlink()
          PY

          git rm .github/workflows/archive-issue-335-once.yml
          git add -A changes
          git diff --check
          python3 scripts/quality/check_change_completion.py --root . --changed-since 571049dda1a2bd1683fe01c14023cd417e62ec66
          python3 scripts/quality/check_docs.py
          python3 scripts/quality/check_docs_facts.py

      - name: Commit archive state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "归档 AI Analysis Provider 并发 Change"
          git fetch origin chore/archive-issue-335-analysis-provider-concurrency
          git rebase origin/chore/archive-issue-335-analysis-provider-concurrency
          git push origin HEAD:chore/archive-issue-335-analysis-provider-concurrency
