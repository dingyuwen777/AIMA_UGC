name: Dev Kuaishou Supplement Diagnostic

on:
  push:
    branches:
      - feature/provider-lookup-supplement-eligibility
    paths:
      - ".github/workflows/dev-kuaishou-supplement-diagnostic.yml"
      - "scripts/dev/probe_kuaishou_supplement_diagnostic.py"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    env:
      PROBE_BRANCH: feature/provider-lookup-supplement-eligibility
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/provider-lookup-supplement-eligibility
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14.7"
      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv==$(tr -d '\r\n' < .uv-version)"
          uv sync --locked
      - name: Receive encrypted one-time credential
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE=/tmp/private.pem
          PUB=/tmp/public.b64
          CIPHER_PATH=".github/probe-input/tikhub-key-${GITHUB_RUN_ID}.b64"
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "${PRIVATE}"
          openssl pkey -in "${PRIVATE}" -pubout -outform DER | base64 -w0 > "${PUB}"
          gh pr comment 151 --repo "${GITHUB_REPOSITORY}" --body "[dev-kuaishou-diagnostic-key] run=${GITHUB_RUN_ID} public_key_spki_base64=$(cat "${PUB}")"
          found=0
          for _ in $(seq 1 120); do
            git fetch --quiet origin "${PROBE_BRANCH}"
            if git show "origin/${PROBE_BRANCH}:${CIPHER_PATH}" > /tmp/cipher.b64 2>/dev/null; then found=1; break; fi
            sleep 5
          done
          [[ "${found}" == "1" ]]
          base64 -d < /tmp/cipher.b64 > /tmp/cipher.bin
          openssl pkeyutl -decrypt -inkey "${PRIVATE}" -in /tmp/cipher.bin \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 > /tmp/key.txt
          TIKHUB_API_KEY="$(cat /tmp/key.txt)"
          echo "::add-mask::${TIKHUB_API_KEY}"
          printf 'TIKHUB_API_KEY=%s\n' "${TIKHUB_API_KEY}" >> "${GITHUB_ENV}"
          rm -f "${PRIVATE}" "${PUB}" /tmp/cipher.b64 /tmp/cipher.bin /tmp/key.txt
      - name: Diagnose current Kuaishou production operations
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/dev/probe_kuaishou_supplement_diagnostic.py
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          unset TIKHUB_API_KEY
          rm -f /tmp/key.txt /tmp/private.pem /tmp/cipher.*
