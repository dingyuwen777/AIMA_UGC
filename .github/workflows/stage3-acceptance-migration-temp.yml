name: Stage 3 Temporary Acceptance Migration

on:
  push:
    branches:
      - feature/stage3-excel-brand-vehicle-filter

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.event.head_commit.message == '工具：迁移 Stage 3 完整验收资产'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/stage3-acceptance/data
      AIMA_LOG_DIR: .runtime/stage3-acceptance/logs
      AIMA_SECRET_DIR: .runtime/stage3-acceptance/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage3-excel-brand-vehicle-filter
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Migrate stale Stage 3 acceptance assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrences, got {actual}: {old[:80]!r}')
              target.write_text(text.replace(old, new, count), encoding='utf-8')

          collection = 'frontend/e2e/collection-runtime.spec.ts'
          replace(
              collection,
              "test('creates imports and discoveries using only selected vehicles', async ({ page }) => {",
              "test('creates an all-active-brand Excel import and a vehicle-scoped discovery', async ({ page }) => {",
          )
          replace(
              collection,
              '''  await dialog.locator('input[type="file"]').first().setInputFiles({ name: 'stage8e.xlsx', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', buffer: Buffer.from('stage8e') })\n  await dialog.getByLabel(/爱玛 Q7/).check()\n  const create = page.waitForRequest((request) => request.url().endsWith('/data-import-campaigns/local') && request.method() === 'POST')\n  await dialog.getByRole('button', { name: '创建并预检', exact: true }).click()\n  expect((await create).postDataJSON()).toMatchObject({ keyword_pack_ids: [], vehicle_model_ids: [vehicleId] })''',
              '''  await dialog.locator('input[type="file"]').first().setInputFiles({ name: 'stage8e.xlsx', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', buffer: Buffer.from('stage8e') })\n  await expect(dialog).toContainText('Excel/Data Import 不再使用关键词包或单车型作为入库过滤条件')\n  const create = page.waitForRequest((request) => request.url().endsWith('/data-import-campaigns/local') && request.method() === 'POST')\n  await dialog.getByRole('button', { name: '创建并预检', exact: true }).click()\n  const importBody = (await create).postDataJSON()\n  expect(importBody).toMatchObject({ brand_ids: [], ingestion_policy: 'standard_observation' })\n  expect(importBody).not.toHaveProperty('keyword_pack_ids')\n  expect(importBody).not.toHaveProperty('vehicle_model_ids')''',
          )
          replace(
              collection,
              "test('centralizes runtime facts, opens Batch detail, and creates a local Campaign with selected packs', async ({ page }) => {",
              "test('centralizes runtime facts, opens Batch detail, and creates a local Campaign with all-active brands', async ({ page }) => {",
          )
          replace(
              collection,
              '''  await dialog.locator('input[type="file"]').first().setInputFiles({ name: 'stage8e.xlsx', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', buffer: Buffer.from('stage8e') })\n  await dialog.getByLabel(/爱玛品牌词包/).check()\n  await dialog.getByLabel(/产品车型词包/).check()\n  const requestPromise = page.waitForRequest((request) => new URL(request.url()).pathname === '/api/v1/data-import-campaigns/local' && request.method() === 'POST')\n  await dialog.getByRole('button', { name: '创建并预检' }).click()\n  expect((await requestPromise).postDataJSON()).toMatchObject({\n    keyword_pack_ids: [brandPackId, modelPackId],\n    ingestion_policy: 'standard_observation',\n    files: [{ relative_path: 'stage8e.xlsx', byte_size: 7 }],\n  })''',
              '''  await dialog.locator('input[type="file"]').first().setInputFiles({ name: 'stage8e.xlsx', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', buffer: Buffer.from('stage8e') })\n  await expect(dialog).toContainText('当前按创建时全部已启用品牌冻结过滤范围')\n  const requestPromise = page.waitForRequest((request) => new URL(request.url()).pathname === '/api/v1/data-import-campaigns/local' && request.method() === 'POST')\n  await dialog.getByRole('button', { name: '创建并预检' }).click()\n  const importBody = (await requestPromise).postDataJSON()\n  expect(importBody).toMatchObject({\n    brand_ids: [],\n    ingestion_policy: 'standard_observation',\n    files: [{ relative_path: 'stage8e.xlsx', byte_size: 7 }],\n  })\n  expect(importBody).not.toHaveProperty('keyword_pack_ids')\n  expect(importBody).not.toHaveProperty('vehicle_model_ids')''',
          )

          submit = 'frontend/e2e/excel-import-submit-state.spec.ts'
          replace(
              submit,
              "test('does not present an incomplete local Campaign form as a busy operation', async ({ page }) => {",
              "test('requires a source file but not a legacy keyword or vehicle filter', async ({ page }) => {",
          )
          replace(
              submit,
              '''  await dialog.locator('input[type="file"]').first().setInputFiles({\n    name: 'aima.xlsx',\n    mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',\n    buffer: Buffer.from('aima'),\n  })\n  await expect(submitButton).toBeDisabled()\n\n  await dialog.getByLabel(/爱玛品牌词包/).check()\n  await expect(submitButton).toBeEnabled()''',
              '''  await dialog.locator('input[type="file"]').first().setInputFiles({\n    name: 'aima.xlsx',\n    mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',\n    buffer: Buffer.from('aima'),\n  })\n  await expect(dialog).toContainText('Excel/Data Import 不再使用关键词包或单车型作为入库过滤条件')\n  await expect(submitButton).toBeEnabled()''',
          )
          replace(
              submit,
              "  await dialog.getByLabel(/爱玛品牌词包/).check()\n  await dialog.locator('.create-button').click()\n\n  await expect(dialog.getByText('文件上传完成，服务器正在准备并预检数据。')).toBeVisible()\n  expect(createRequestBody?.client_idempotency_key).toMatch(",
              "  await dialog.locator('.create-button').click()\n\n  await expect(dialog.getByText('文件上传完成，服务器正在准备并预检数据。')).toBeVisible()\n  expect(createRequestBody?.brand_ids).toEqual([])\n  expect(createRequestBody).not.toHaveProperty('keyword_pack_ids')\n  expect(createRequestBody).not.toHaveProperty('vehicle_model_ids')\n  expect(createRequestBody?.client_idempotency_key).toMatch(",
          )
          replace(
              submit,
              "  await dialog.getByLabel(/爱玛品牌词包/).check()\n  const submitButton = dialog.locator('.create-button')\n",
              "  const submitButton = dialog.locator('.create-button')\n",
          )

          historical = 'frontend/e2e/historical-migration.spec.ts'
          replace(
              historical,
              "  await dialog.getByLabel(/爱玛品牌词包/).check()\n\n  const createRequest",
              "  await expect(dialog).toContainText('当前按创建时全部已启用品牌冻结过滤范围')\n\n  const createRequest",
          )
          replace(
              historical,
              '''  expect((await createRequest).postDataJSON()).toMatchObject({\n    relative_paths: ['2025-archive/part-001.xlsx'],\n    keyword_pack_ids: [keywordPackId],\n    recursive: false,\n  })''',
              '''  const createBody = (await createRequest).postDataJSON()\n  expect(createBody).toMatchObject({\n    relative_paths: ['2025-archive/part-001.xlsx'],\n    brand_ids: [],\n    recursive: false,\n  })\n  expect(createBody).not.toHaveProperty('keyword_pack_ids')\n  expect(createBody).not.toHaveProperty('vehicle_model_ids')''',
          )
          replace(
              historical,
              "  await dialog.getByLabel(/选择目录时递归发现/).check()\n  await dialog.getByLabel(/爱玛品牌词包/).check()\n",
              "  await dialog.getByLabel(/选择目录时递归发现/).check()\n",
          )
          replace(
              historical,
              '''  expect((await createRequest).postDataJSON()).toMatchObject({\n    relative_paths: ['2025-archive'],\n    recursive: true,\n  })''',
              '''  expect((await createRequest).postDataJSON()).toMatchObject({\n    relative_paths: ['2025-archive'],\n    brand_ids: [],\n    recursive: true,\n  })''',
          )
          replace(
              historical,
              "  await dialog.getByLabel('选择 part-001.xlsx').check()\n  await dialog.getByLabel(/爱玛品牌词包/).check()\n  await dialog.getByRole('button', { name: '创建并预检' }).click()",
              "  await dialog.getByLabel('选择 part-001.xlsx').check()\n  await dialog.getByRole('button', { name: '创建并预检' }).click()",
          )

          backend = 'tests/integration/ingestion/test_stage12_historical_campaign_worker.py'
          replace(
              backend,
              'from aima_ugc.bootstrap.api import create_app\n',
              'from aima_ugc.bootstrap.api import create_app\nfrom aima_ugc.bootstrap.brand_vehicle_http import PostgresBrandVehicleHttpService\n',
          )
          replace(
              backend,
              'from aima_ugc.contracts.http import ContentFilterSnapshot\n',
              'from aima_ugc.contracts.brand_vehicle import BrandCreateRequest\nfrom aima_ugc.contracts.http import ContentFilterSnapshot\n',
          )
          replace(
              backend,
              'from aima_ugc.modules.ingestion.historical_jobs import HISTORICAL_IMPORT_CHUNK_JOB_TYPE\n',
              'from aima_ugc.modules.identity import Principal\nfrom aima_ugc.modules.ingestion.historical_jobs import HISTORICAL_IMPORT_CHUNK_JOB_TYPE\n',
          )
          old_helper = '''def _keyword_pack(client: TestClient) -> str:\n    created = client.post(\n        "/api/v1/keyword-packs",\n        json={"name": f"Stage12 历史迁移 {uuid4()}"},\n    )\n    assert created.status_code == 201\n    pack_id = created.json()["id"]\n    added = client.post(\n        f"/api/v1/keyword-packs/{pack_id}/keywords",\n        json={"text": "爱玛", "priority": 10},\n    )\n    assert added.status_code == 201\n    return pack_id\n'''
          new_helper = '''def _principal() -> Principal:\n    return Principal(\n        principal_id="stage3-historical-admin",\n        display_name="Stage3 Historical 管理员",\n        role="administrator",\n        source="development",\n    )\n\n\ndef _brand(runtime) -> str:  # type: ignore[no-untyped-def]\n    brand = PostgresBrandVehicleHttpService(runtime).create_brand(\n        BrandCreateRequest(\n            code=f"AIMA-STAGE3-{uuid4()}",\n            display_name="爱玛",\n            role="owned",\n            aliases=("爱玛",),\n        ),\n        principal=_principal(),\n        request_id="stage3-historical-brand",\n    )\n    return str(brand.id)\n'''
          replace(backend, old_helper, new_helper)
          target = Path(backend)
          text = target.read_text(encoding='utf-8')
          text = text.replace('pack_id = _keyword_pack(client)', 'brand_id = _brand(runtime)')
          text = text.replace('"keyword_pack_ids": [pack_id]', '"brand_ids": [brand_id]')
          text = text.replace('(\"keyword_pack_ids\", (None, pack_id))', '(\"brand_ids\", (None, brand_id))')
          text = text.replace(
              'TRUNCATE TABLE jobs, artifacts, keyword_packs, accounts RESTART IDENTITY CASCADE',
              'TRUNCATE TABLE jobs, artifacts, keyword_packs, vehicle_brands, accounts RESTART IDENTITY CASCADE',
          )
          target.write_text(text, encoding='utf-8')
          if '_keyword_pack' in text or 'keyword_pack_ids' in text or 'pack_id' in text:
              raise SystemExit('Historical Stage 3 Golden Path still contains legacy pack selection')
          PY
      - name: Install frozen environments and prepare PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv==$(tr -d '\r\n' < .uv-version)"
          uv sync --locked
          npm ci --prefix frontend
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'ci-postgres' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
      - name: Verify migrated acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format tests/integration/ingestion/test_stage12_historical_campaign_worker.py
          uv run ruff check tests/integration/ingestion/test_stage12_historical_campaign_worker.py
          uv run pytest tests/unit/test_brand_vehicle_resolver.py -q
          uv run pytest tests/integration/ingestion/test_stage12_historical_campaign_worker.py -q
          npm --prefix frontend run lint
          npm --prefix frontend run test:e2e -- e2e/collection-runtime.spec.ts e2e/excel-import-submit-state.spec.ts e2e/historical-migration.spec.ts
      - name: Commit verified acceptance migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            frontend/e2e/collection-runtime.spec.ts \
            frontend/e2e/excel-import-submit-state.spec.ts \
            frontend/e2e/historical-migration.spec.ts \
            tests/integration/ingestion/test_stage12_historical_campaign_worker.py
          git diff --cached --quiet && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "测试：迁移 Stage 3 完整验收资产"
          git push origin HEAD:feature/stage3-excel-brand-vehicle-filter
