name: Stage 7 Green Endpoint Ledger Float

on:
  push:
    branches:
      - feature/stage7-completion
    paths:
      - ".github/workflows/stage7-green-endpoint-ledger-float.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage7-completion
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Bound high-precision float evidence
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin feature/stage7-completion
          python -c 'from pathlib import Path; p=Path("scripts/dev/probe_tikhub_endpoint_ledger.py"); t=p.read_text(encoding="utf-8"); old="    if (\n        isinstance(value, (int, float))\n        and not isinstance(value, bool)\n        and abs(value) >= 10_000_000_000\n    ):\n        return pseudonyms.identifier(value)\n    if isinstance(value, str):\n"; new="    if isinstance(value, float):\n        return round(value, 6)\n    if (\n        isinstance(value, int)\n        and not isinstance(value, bool)\n        and abs(value) >= 10_000_000_000\n    ):\n        return pseudonyms.identifier(value)\n    if isinstance(value, str):\n"; assert t.count(old)==1, "numeric sanitizer anchor missing or ambiguous"; p.write_text(t.replace(old,new), encoding="utf-8")'
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
          uv run ruff format scripts/dev/probe_tikhub_endpoint_ledger.py tests/unit/collection/test_tikhub_endpoint_ledger_sanitizer.py
          uv run ruff check --fix scripts/dev/probe_tikhub_endpoint_ledger.py tests/unit/collection/test_tikhub_endpoint_ledger_sanitizer.py
          uv run ruff format --check scripts/dev/probe_tikhub_endpoint_ledger.py tests/unit/collection/test_tikhub_endpoint_ledger_sanitizer.py
          uv run ruff check scripts/dev/probe_tikhub_endpoint_ledger.py tests/unit/collection/test_tikhub_endpoint_ledger_sanitizer.py
          uv run pytest tests/unit/collection/test_tikhub_endpoint_ledger_sanitizer.py -q
          git diff --check
      - name: Commit verified Green
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/stage7-green-endpoint-ledger-float.yml
          git add scripts/dev/probe_tikhub_endpoint_ledger.py tests/unit/collection/test_tikhub_endpoint_ledger_sanitizer.py
          git diff --cached --check
          git config user.name "AIMA Stage 7 Runner"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "限制 Endpoint Ledger 高精度浮点证据"
          git push origin HEAD:feature/stage7-completion
