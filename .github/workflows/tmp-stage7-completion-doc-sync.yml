name: Temporary Stage 7 completion doc sync

on:
  push:
    branches:
      - docs/archive-stage7-completion

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: docs/archive-stage7-completion
          fetch-depth: 0

      - name: Apply exact documentation sync
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, got {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          p = Path("docs/blueprint/07-技术决策与实施门禁.md")
          replace_once(
              p,
              "当前剩余是最终质量门禁、Review、PR 合并、合并后 main 验证与 Change 归档。",
              "最终质量门禁、两阶段 Review、PR #55 正常合并与合并后 main 新鲜 CI 均已完成；Completion Change 由当前归档 PR #56 完成生命周期收尾。",
          )
          replace_once(
              p,
              "当前 Stage 7 分支已建立五平台 Operation/Mapper/Capability/Registry 和合法脱敏真实 Fixture",
              "当前仓库已建立五平台 Operation/Mapper/Capability/Registry 和合法脱敏真实 Fixture",
          )
          replace_once(
              p,
              "五平台首版 TikHub 主 Operation 已批准并在当前 Stage 7 分支实现；",
              "五平台首版 TikHub 主 Operation 已批准并实现；",
          )
          replace_once(
              p,
              "Stage 7 当前只剩最终质量/Review/PR/main/Change 收尾门禁；预算功能已撤回，不是 Stage 7 待实现项。",
              "Stage 7 的实现、最终质量门禁、两阶段 Review、PR #55 合并和合并后 main 验证均已完成；Completion Change 由当前归档 PR #56 完成生命周期收尾。预算功能已撤回，不是 Stage 7 待实现项。",
          )
          replace_once(p, "**功能实现已完成，进入收尾验收**", "**已完成**")
          replace_once(
              p,
              "最终完成仍要求 PR head 全门禁、两阶段 Review、正常合并、合并后 main CI 和 Change 归档",
              "PR head 全门禁、两阶段 Review、PR #55 正常合并和合并后 main CI 已完成，Completion Change 由归档 PR #56 收尾",
          )

          p = Path("docs/collection/README.md")
          replace_once(
              p,
              "本文描述当前任务分支已经落地的采集主链、Stage 7 运行事实以及仍受门禁约束的能力。",
              "本文描述当前仓库已经落地的采集主链、Stage 7 已完成运行事实以及后续阶段仍受门禁约束的能力。",
          )
          old = "\n".join([
              "## 6. 当前仍未闭环的 Stage 7 能力",
              "",
              "Stage 7 的 live Worker 已经接通，当前剩余的是收尾门禁，而不是新的采集架构开发：",
              "",
              "1. **最终质量门禁**：Ruff、mypy、Architecture、Table Ownership、Secret、Docs、Contract、Migration 和相关 PostgreSQL 集成测试必须在最终 PR head 上取得新鲜成功证据；",
              "2. **两阶段 Review**：完成需求符合性 Review，再完成代码质量、安全、兼容性 Review，并处理严重/重要问题；",
              "3. **PR / main 闭环**：PR #55 按仓库规则从 Draft 进入正常 Review/合并流程，合入 `main` 后再次取得新鲜 CI；",
              "4. **Change 生命周期**：上述事实成立后，把 `CHG-20260815-stage7-completion` 更新为 `done` 并按规则归档。",
              "",
              "Stage 7 收尾期间必须继续保持：快手 App 评论/二级评论主链、不自动 Provider/App/Web fallback、Secret 只走 `secret_ref`、预算功能保持回撤。",
          ])
          new = "\n".join([
              "## 6. Stage 7 闭环状态",
              "",
              "Stage 7 已完成正式采集与调度闭环：",
              "",
              "- `collection.run.v1` live Worker 已接通 Scheduler / Job / Run / Scope / Provider / Raw / Mapper / Canonical / Ingestion 正式链；",
              "- PR #55 最终 head 已通过完整相关 CI 和两阶段 Review，并正常合入 `main`；",
              "- 合并后 `main` 已重新取得新鲜 CI；",
              "- `CHG-20260815-stage7-completion` 由当前归档 PR #56 更新为 `done` 并移入 `changes/archive/2026-08/`；",
              "- 快手 App 评论/二级评论主链、无自动 Provider/App/Web fallback、`secret_ref` Secret 边界和预算功能回撤均保持不变。",
              "",
              "下一正式阶段是 Stage 8，但本归档 PR #56 不开始 Stage 8。Stage 8 必须重新按当前 `main`、HTTP Contract、OpenAPI、生成 Client 与前端实际结构建立自己的需求和验收门禁。",
          ])
          replace_once(p, old, new)

          p = Path("backend/src/aima_ugc/modules/collection/README.md")
          replace_once(
              p,
              "默认 Secret 只通过 `secret_ref` 在 `AIMA_SECRET_DIR` 下解析；默认 TikHub Transport 每次发送后关闭其自持 HTTP Client，不遗留无人管理的连接生命周期；",
              "默认 Secret 只通过 `secret_ref` 在 `AIMA_SECRET_DIR` 下解析；默认 TikHub Transport 只允许批准的 `https://api.tikhub.io` Origin 接收 Bearer Secret，并在每次发送后关闭其自持 HTTP Client，不遗留无人管理的连接生命周期；",
          )
          old = "\n".join([
              "## 5. Stage 7 当前闭环状态",
              "",
              "Scheduler → Occurrence → `collection.run.v1` Job → scheduled Run / Scope → 正式 Worker Registry / JobWorker → `CollectionRunJobHandler` → `CollectionRunExecutor` → `TikHubCollectionScopeExecutor` → Provider / Raw / Mapper / Canonical / Ingestion 的生产链已经在当前 Stage 7 分支通过 PostgreSQL/Fake Transport 纵切验证。",
              "",
              "当前 Stage 7 剩余工作不再是补第二套 Worker 或 Provider 实现，而是：",
              "",
              "- 保持五平台 Operation / Mapper / Capability、快手 App 评论主链、无自动 fallback 和预算回撤不漂移；",
              "- 清理代码/文档质量门禁并完成需求符合性与代码质量/安全/兼容性 Review；",
              "- 在最终 PR head 上取得新鲜完整 CI；",
              "- 按仓库流程把 PR #55 正常合入 `main`，再验证合并后 `main`；",
              "- 最后将当前 L3 Change 标记完成并按规则归档。",
              "",
              "在这些收尾门禁全部完成前，可以说“Stage 7 live Worker 已闭环、Stage 7 正在收尾验收”，不能提前宣称整个 Stage 7 已完成。",
          ])
          new = "\n".join([
              "## 5. Stage 7 闭环状态",
              "",
              "Scheduler → Occurrence → `collection.run.v1` Job → scheduled Run / Scope → 正式 Worker Registry / JobWorker → `CollectionRunJobHandler` → `CollectionRunExecutor` → `TikHubCollectionScopeExecutor` → Provider / Raw / Mapper / Canonical / Ingestion 的生产链已经通过 PostgreSQL/Fake Transport 纵切验证，并随 PR #55 正常合入 `main`。",
              "",
              "Stage 7 的最终质量门禁、需求符合性 Review、代码质量/安全/兼容性 Review、PR #55 合并和合并后 `main` 新鲜 CI 均已完成；`CHG-20260815-stage7-completion` 由当前归档 PR #56 完成 `done` / archive 生命周期收尾。",
              "",
              "当前必须继续保持：",
              "",
              "- 五平台 Operation / Mapper / Capability 的已验证边界；",
              "- 快手 App comments/sub-comments 正式主链；",
              "- 不建立自动 Provider/App/Web fallback；",
              "- Provider Secret 只走 `secret_ref`，TikHub Bearer Secret 只发送到批准的 `https://api.tikhub.io` Origin；",
              "- 当前不恢复请求/金额预算、Budget Account、Reservation Ledger 或 dormant Budget 接口。",
              "",
              "下一正式阶段是 Stage 8；本模块文档只记录 Stage 7 已完成的 Collection 机器边界，不提前定义 Stage 8 HTTP API 或前端行为。",
          ])
          replace_once(p, old, new)
          PY

          git diff --check
          git diff -- docs/blueprint/07-技术决策与实施门禁.md docs/collection/README.md backend/src/aima_ugc/modules/collection/README.md

      - name: Commit synced docs and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-stage7-completion-doc-sync.yml
          git add docs/blueprint/07-技术决策与实施门禁.md docs/collection/README.md backend/src/aima_ugc/modules/collection/README.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "同步 Stage 7 完成文档"
          git push origin HEAD:docs/archive-stage7-completion
