name: Temporary Product Detail Validation

on:
  push:
    branches:
      - feature/product-resource-lifecycle
    paths:
      - .github/workflows/tmp-product-detail-validation.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Apply exact product projection patch
        run: python .github/tmp_product_detail_patch.py

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend environment
        run: npm ci --prefix frontend

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Run affected frontend tests
        run: npm --prefix frontend test -- --run tests/frontend-audit-regressions.spec.ts tests/collection-runtime-design.spec.ts tests/voice-plaza-design.spec.ts

      - name: Commit patch and remove temporary files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-product-detail-validation.yml .github/tmp_product_detail_patch.py
          git add \
            frontend/src/features/voice-plaza/pages/VoicePlazaPage/components/ContentDetailDrawer.vue \
            frontend/tests/frontend-audit-regressions.spec.ts \
            frontend/tests/collection-runtime-design.spec.ts
          git config user.name "AIMA Temporary Validator"
          git config user.email "aima-validator@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "下沉声音详情工程信息并验证恢复深链 [skip ci]"
          git push origin HEAD:feature/product-resource-lifecycle
