name: Temporary Audit Voice Type Chinese Green

on:
  push:
    branches:
      - feature/voice-type-chinese-values

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Audit live repository references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          legacy = (
              'user_voice',
              'brand_official',
              'dealer_promotion',
              'creator_marketing',
              'industry_professional',
              'media_information',
              'other_organization',
          )
          excluded_prefixes = ('changes/archive/', 'migrations/')
          excluded_files = {
              'changes/active/CHG-20260828-voice-type-chinese-values/CHANGE.md',
              'tests/unit/analysis/test_voice_type_taxonomy.py',
              'tests/unit/platform/test_excel_voice_type_taxonomy.py',
              '.github/workflows/temp-audit-voice-type-chinese-green.yml',
          }
          findings = []
          unknown_findings = []
          for path in sorted(Path('.').rglob('*')):
              if not path.is_file():
                  continue
              rel = path.as_posix().removeprefix('./')
              if rel in excluded_files or any(rel.startswith(p) for p in excluded_prefixes):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  scrubbed = line.replace('is_real_user_voice', '').replace('is_user_voice', '').replace('unknown_voice_type', '')
                  hits = [value for value in legacy if value in scrubbed]
                  if hits:
                      findings.append((rel, lineno, hits, line))
                  if 'voice_type' in scrubbed and re.search(r'["\']unknown["\']', scrubbed):
                      unknown_findings.append((rel, lineno, line))
          print('=== LEGACY MACHINE VALUE FINDINGS ===')
          for item in findings:
              print(f'{item[0]}:{item[1]}: {item[2]} :: {item[3]}')
          print('=== VOICE_TYPE UNKNOWN FINDINGS ===')
          for item in unknown_findings:
              print(f'{item[0]}:{item[1]} :: {item[2]}')
          print(f'legacy_count={len(findings)} unknown_count={len(unknown_findings)}')
          PY
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-audit-voice-type-chinese-green.yml
          git commit -m "工具：删除一次性发声类型中文值收口扫描"
          git push origin HEAD:feature/voice-type-chinese-values
