name: Temporary Docs Link Label Migration

on:
  push:
    branches:
      - chore/agent-skills-project-governance

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: chore/agent-skills-project-governance
          fetch-depth: 0

      - name: Normalize repository file navigation links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import runpy
          from pathlib import Path
          from urllib.parse import unquote

          root = Path.cwd().resolve()
          checker = runpy.run_path(str(root / "scripts/quality/check_docs.py"))
          repository_files = checker["_repository_files"](root)
          documents = checker["_iter_current_docs"](root, repository_files)
          inline_code_re = checker["INLINE_CODE_RE"]
          path_link_re = checker["PATH_LINK_RE"]
          fence_re = checker["FENCE_RE"]
          resolve = checker["_resolve_file_reference"]
          is_linked = checker["_is_inline_code_linked"]

          def link_for(doc: Path, target: Path, description: str | None = None) -> str:
              label = target.relative_to(root).as_posix()
              href = os.path.relpath(target, start=doc.parent).replace(os.sep, "/")
              suffix = f"：{description}" if description else ""
              return f"- [`{label}`]({href}){suffix}\n"

          def convert_fence(doc: Path, block: list[str]) -> list[str] | None:
              entries = [line.strip() for line in block[1:-1] if line.strip()]
              if not entries:
                  return None

              pure_targets: list[Path] = []
              for value in entries:
                  target = resolve(root, doc, value, repository_files)
                  if target is None:
                      pure_targets = []
                      break
                  pure_targets.append(target)
              if pure_targets:
                  return [link_for(doc, target) for target in pure_targets] + ["\n"]

              if len(entries) >= 2 and len(entries) % 2 == 0:
                  pairs: list[tuple[Path, str]] = []
                  for index in range(0, len(entries), 2):
                      value = entries[index]
                      description = entries[index + 1]
                      target = resolve(root, doc, value, repository_files)
                      if target is None or not description.startswith("→"):
                          pairs = []
                          break
                      pairs.append((target, description.removeprefix("→").strip()))
                  if pairs:
                      return [link_for(doc, target, description) for target, description in pairs] + ["\n"]
              return None

          def link_unlinked_inline(doc: Path, line: str) -> str:
              pieces: list[str] = []
              cursor = 0
              for match in inline_code_re.finditer(line):
                  if is_linked(line, match.start(), match.end()):
                      continue
                  target = resolve(root, doc, match.group(1), repository_files)
                  if target is None:
                      continue
                  label = target.relative_to(root).as_posix()
                  href = os.path.relpath(target, start=doc.parent).replace(os.sep, "/")
                  pieces.append(line[cursor : match.start()])
                  pieces.append(f"[`{label}`]({href})")
                  cursor = match.end()
              if not pieces:
                  return line
              pieces.append(line[cursor:])
              return "".join(pieces)

          def normalize_link_labels(doc: Path, line: str) -> str:
              def replace(match):
                  label, target = match.groups()
                  if target.startswith(("http://", "https://", "#", "mailto:")):
                      return match.group(0)
                  target_path = target.split("#", 1)[0]
                  if not target_path:
                      return match.group(0)
                  resolved = (doc.parent / unquote(target_path)).resolve()
                  try:
                      expected = resolved.relative_to(root).as_posix()
                  except ValueError:
                      return match.group(0)
                  if not resolved.is_file() or label.replace("\\", "/") == expected:
                      return match.group(0)
                  return f"[`{expected}`]({target})"

              return path_link_re.sub(replace, line)

          changed: list[str] = []
          for doc in documents:
              original_lines = doc.read_text(encoding="utf-8").splitlines(keepends=True)
              output: list[str] = []
              index = 0
              while index < len(original_lines):
                  line = original_lines[index]
                  if not fence_re.match(line):
                      updated = link_unlinked_inline(doc, line)
                      output.append(normalize_link_labels(doc, updated))
                      index += 1
                      continue

                  end = index + 1
                  while end < len(original_lines) and not fence_re.match(original_lines[end]):
                      end += 1
                  if end >= len(original_lines):
                      output.extend(original_lines[index:])
                      break

                  block = original_lines[index : end + 1]
                  converted = convert_fence(doc, block)
                  if converted is None:
                      output.extend(block)
                  else:
                      if output and output[-1].strip():
                          output.append("\n")
                      output.extend(converted)
                  index = end + 1

              updated_text = "".join(output)
              original_text = "".join(original_lines)
              if updated_text != original_text:
                  doc.write_text(updated_text, encoding="utf-8")
                  changed.append(doc.relative_to(root).as_posix())

          print(f"NORMALIZED_DOCS {len(changed)}")
          for path in changed:
              print(path)
          PY

          python3 scripts/quality/check_docs.py
          python3 scripts/quality/check_docs_facts.py
          git diff --check

          if [[ -n "$(git status --porcelain -- '*.md')" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.md'
            git commit -m "补齐仓库文件导航链接"
            git push origin HEAD:chore/agent-skills-project-governance
          fi
