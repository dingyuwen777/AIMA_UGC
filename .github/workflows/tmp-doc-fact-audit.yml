name: Temporary Docs Fact Audit

on:
  push:
    branches:
      - chore/agent-skills-project-governance

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: chore/agent-skills-project-governance
          fetch-depth: 0

      - name: Synchronize test documentation gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/04_测试与调试说明.md")
          text = path.read_text(encoding="utf-8")
          old = "\n".join([
              "这些分别防：",
              "",
              "```text",
              "Ruff",
              "→ 格式/静态问题",
              "",
              "mypy",
              "→ 类型边界漂移",
              "",
              "check_architecture.py",
              "→ 违反仓库模块依赖/结构约束",
              "",
              "check_table_ownership.py",
              "→ 多模块写同一业务表",
              "",
              "scan_secrets.py",
              "→ Secret/敏感内容误提交",
              "",
              "check_docs.py",
              "→ 文档链接/要求的文档一致性",
              "```",
              "",
          ])
          new = "\n".join([
              "这些检查承担不同的证明责任：",
              "",
              "| 检查 | 主要防止 |",
              "| --- | --- |",
              "| `Ruff` | Python 格式与静态问题 |",
              "| `mypy` | Python 类型边界漂移 |",
              "| [`scripts/quality/check_architecture.py`](../scripts/quality/check_architecture.py) | 违反仓库模块依赖或结构约束 |",
              "| [`scripts/quality/check_table_ownership.py`](../scripts/quality/check_table_ownership.py) | 多模块写同一业务表 |",
              "| [`scripts/quality/scan_secrets.py`](../scripts/quality/scan_secrets.py) | Secret 或敏感内容误提交 |",
              "| [`scripts/quality/check_docs.py`](../scripts/quality/check_docs.py) | 当前文档入口、相对链接、仓库文件导航和项目文档治理边界漂移 |",
              "| [`scripts/quality/check_docs_facts.py`](../scripts/quality/check_docs_facts.py) | 当前权威文档与 OpenAPI、Schema、生产 Worker Job、永久 Workflow、前端 Route、Provider、版本、Analysis 和 Release 机器事实漂移 |",
              "| [`scripts/quality/check_agent_governance.py`](../scripts/quality/check_agent_governance.py) | AIMA 项目 Overlay、Completion Gate 和 Agent_Skills 项目接线漂移 |",
              "",
          ])
          if text.count(old) != 1:
              raise SystemExit("expected test-gate block not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          python3 scripts/quality/check_docs.py
          python3 scripts/quality/check_docs_facts.py
          git diff --check

          if [[ -n "$(git status --porcelain -- docs/04_测试与调试说明.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/04_测试与调试说明.md
            git commit -m "同步文档质量门禁说明"
            git push origin HEAD:chore/agent-skills-project-governance
          fi

      - name: Verify current documentation facts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/check_docs.py
          python3 scripts/quality/check_docs_facts.py
          python3 scripts/quality/audit_docs_api_paths.py
          python3 scripts/quality/audit_docs_coverage.py
          python3 scripts/quality/audit_docs_commands.py
          python3 scripts/quality/audit_docs_provider_capabilities.py
          git diff --check
