name: Temporary Docs Link Migration

on:
  push:
    branches:
      - chore/agent-skills-project-governance

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: chore/agent-skills-project-governance
          fetch-depth: 0

      - name: Migrate repository file navigation
        run: python3 scripts/quality/fix_docs_navigation.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/quality/check_docs.py || true

      - name: Commit migrated documentation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No documentation migration needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md docs frontend/README.md backend tests/fixtures
          git commit -m "批量迁移文档仓库文件链接"
          git push origin HEAD:chore/agent-skills-project-governance
