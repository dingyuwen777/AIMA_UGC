name: Stage 5C Provider Persistence

on:
  push:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/modules/collection/**"
      - "backend/src/aima_ugc/adapters/persistence/postgres/provider.py"
      - "backend/src/aima_ugc/database_schema.py"
      - "migrations/versions/**"
      - "tests/unit/collection/**"
      - "tests/integration/collection/**"
      - "scripts/quality/check_architecture.py"
      - ".github/workflows/stage5c-provider-persistence.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/modules/collection/**"
      - "backend/src/aima_ugc/adapters/persistence/postgres/provider.py"
      - "backend/src/aima_ugc/database_schema.py"
      - "migrations/versions/**"
      - "tests/unit/collection/**"
      - "tests/integration/collection/**"
      - "scripts/quality/check_architecture.py"
      - ".github/workflows/stage5c-provider-persistence.yml"

permissions:
  contents: read

jobs:
  stage5c-provider-persistence:
    name: Stage 5C Provider Persistence
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: stage5c-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/ci-stage5c/data
      AIMA_LOG_DIR: .runtime/ci-stage5c/logs
      AIMA_SECRET_DIR: .runtime/ci-stage5c/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Prepare Stage 5C Secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'stage5c-ci' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"

      - name: Collection unit and Provider contract tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/collection tests/contracts/test_provider_v1.py -q

      - name: Upgrade empty database to Stage 5C head
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
          uv run python - <<'PY'
          from sqlalchemy import inspect, text

          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.database import DatabaseRuntime

          runtime = DatabaseRuntime(load_settings())
          try:
              inspector = inspect(runtime.engine)
              existing = set(inspector.get_table_names())
              request_foreign_keys = inspector.get_foreign_keys("provider_requests")
              attempt_foreign_keys = inspector.get_foreign_keys("provider_request_attempts")
              request_uniques = {
                  tuple(item["column_names"])
                  for item in inspector.get_unique_constraints("provider_requests")
              }
              attempt_uniques = {
                  tuple(item["column_names"])
                  for item in inspector.get_unique_constraints("provider_request_attempts")
              }
              request_checks = {
                  item["name"] for item in inspector.get_check_constraints("provider_requests")
              }
              attempt_checks = {
                  item["name"]
                  for item in inspector.get_check_constraints("provider_request_attempts")
              }
              request_indexes = {item["name"] for item in inspector.get_indexes("provider_requests")}
              attempt_indexes = {
                  item["name"] for item in inspector.get_indexes("provider_request_attempts")
              }
              with runtime.engine.connect() as connection:
                  triggers = set(
                      connection.execute(
                          text(
                              "SELECT tgname FROM pg_trigger "
                              "WHERE NOT tgisinternal AND tgrelid IN "
                              "('collection_scopes'::regclass, 'provider_requests'::regclass, "
                              "'provider_request_attempts'::regclass)"
                          )
                      ).scalars()
                  )
          finally:
              runtime.dispose()

          required = {
              "artifacts",
              "jobs",
              "collection_runs",
              "collection_scopes",
              "provider_requests",
              "provider_request_attempts",
          }
          assert required <= existing, existing
          assert any(
              item["constrained_columns"] == ["scope_id"]
              and item["referred_table"] == "collection_scopes"
              and item["referred_columns"] == ["id"]
              for item in request_foreign_keys
          ), request_foreign_keys
          assert any(
              item["constrained_columns"] == ["provider_request_id"]
              and item["referred_table"] == "provider_requests"
              for item in attempt_foreign_keys
          ), attempt_foreign_keys
          assert any(
              item["constrained_columns"] == ["raw_artifact_id"]
              and item["referred_table"] == "artifacts"
              for item in attempt_foreign_keys
          ), attempt_foreign_keys
          assert ("scope_id", "request_fingerprint") in request_uniques, request_uniques
          assert ("provider_request_id", "attempt_no") in attempt_uniques, attempt_uniques
          assert ("id", "provider_request_id") in attempt_uniques, attempt_uniques
          assert "ck_provider_requests_request_fingerprint_sha256" in request_checks, request_checks
          assert "ck_provider_request_attempts_dispatch_times_consistent" in attempt_checks, attempt_checks
          assert "ck_provider_request_attempts_billing_status_allowed" in attempt_checks, attempt_checks
          assert "ix_provider_requests_scope_id_created_at" in request_indexes, request_indexes
          assert (
              "ix_provider_attempts_dispatch_status_started_at" in attempt_indexes
          ), attempt_indexes
          assert "ix_provider_request_attempts_completed_at" in attempt_indexes, attempt_indexes
          assert triggers == {
              "trg_collection_scope_provider_identity_immutable",
              "trg_provider_request_lineage_immutable",
              "trg_provider_attempt_lineage_immutable",
          }, triggers
          PY

      - name: PostgreSQL Collection integration tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/collection -q

      - name: Stage 5C quality gates
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py

      - name: Downgrade to base and re-upgrade
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade base
          uv run python - <<'PY'
          from sqlalchemy import inspect

          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.database import DatabaseRuntime

          runtime = DatabaseRuntime(load_settings())
          try:
              existing = set(inspect(runtime.engine).get_table_names())
          finally:
              runtime.dispose()
          application_tables = {
              "artifacts",
              "system_settings",
              "audit_events",
              "jobs",
              "job_attempt_events",
              "collection_runs",
              "collection_scopes",
              "provider_requests",
              "provider_request_attempts",
          }
          assert not (application_tables & existing), existing
          PY
          uv run alembic upgrade head
          uv run alembic check

      - name: Downgrade to previous revision and re-upgrade
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic downgrade 20260814_0003
          uv run python - <<'PY'
          from sqlalchemy import inspect

          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.database import DatabaseRuntime

          runtime = DatabaseRuntime(load_settings())
          try:
              existing = set(inspect(runtime.engine).get_table_names())
          finally:
              runtime.dispose()
          previous = {
              "artifacts",
              "system_settings",
              "audit_events",
              "jobs",
              "job_attempt_events",
              "collection_runs",
              "collection_scopes",
          }
          assert previous <= existing, existing
          assert not ({"provider_requests", "provider_request_attempts"} & existing), existing
          PY
          uv run alembic upgrade head
          uv run alembic check
