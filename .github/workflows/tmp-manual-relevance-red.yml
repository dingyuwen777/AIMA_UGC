name: Temporary Manual Relevance Review Red

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Install locked frontend environment
        run: npm ci --prefix frontend

      - name: Run manual relevance review browser tests
        run: npm --prefix frontend run test:e2e -- e2e/manual-relevance-review.spec.ts
