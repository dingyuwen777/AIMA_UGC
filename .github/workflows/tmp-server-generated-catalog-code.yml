name: Temporary Contract Generation

on:
  push:
    branches:
      - feature/server-generated-catalog-code

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/server-generated-catalog-code
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.0'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Generate OpenAPI and client
        run: |
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api

      - name: Commit generated artifacts
        run: |
          git add contracts frontend/src/generated/api
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "重新生成 OpenAPI 与前端客户端"
          git push origin HEAD:feature/server-generated-catalog-code
