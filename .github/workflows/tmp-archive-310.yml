name: Temporary archive Issue 310 Change

on:
  push:
    branches:
      - chore/310-archive-frontend-fullstack-audit-fixes

permissions:
  contents: write

jobs:
  archive-change:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: chore/310-archive-frontend-fullstack-audit-fixes
          fetch-depth: 0
      - name: Archive completed Change
        shell: bash
        run: |
          set -euo pipefail
          src='changes/active/CHG-20260903-002542-frontend-fullstack-audit-fixes/CHANGE.md'
          dst='changes/archive/2026-09/CHG-20260903-002542-frontend-fullstack-audit-fixes/CHANGE.md'
          mkdir -p "$(dirname "$dst")"
          git mv "$src" "$dst"
          python - <<'PY'
          from pathlib import Path

          path = Path('changes/archive/2026-09/CHG-20260903-002542-frontend-fullstack-audit-fixes/CHANGE.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once('status: ready_for_review', 'status: done')
          replace_once(
              '- [x] Targeted/全量 Vitest、Browser Mock、lint、typecheck、build、依赖安全审计和 Runtime Acceptance 均已取得新鲜通过证据；最终 Ready HEAD 继续由永久 PR CI/Runtime/Completion Gate 复核。',
              '- [x] Targeted/全量 Vitest、Browser Mock、lint、typecheck、build、依赖安全审计和 Runtime Acceptance 均取得新鲜通过证据；最终实现 HEAD 与 merge 后 main fresh CI/Runtime/Completion Gate 均已成功。',
          )
          replace_once(
              '- 当前 `ready_for_review` HEAD 仍需由永久 PR CI/Runtime/Completion Gate 取得 final-head fresh 结果；该结果属于 PR merge 门禁，不通过则不得合并。',
              '- 最终实现 HEAD `628cfd9817d757335a5e80b5efaaae9a47c8c969` 在 PR #312 上取得 CI #3734、Runtime Acceptance #855、Change Completion #1594 与 Tooling #255 success；guarded merge 后 `main@b4556cc3f3102a749c323a1053e3b7a9c5f6c3a6` 的 CI #3736、Runtime Acceptance #857、Change Completion #1596 与 Tooling #257 也全部 success。',
          )
          replace_once(
              '- 当前结论：NO_FINDINGS_WITHIN_SCOPE；等待最终 Ready HEAD 永久门禁确认。',
              '- 当前结论：NO_FINDINGS_WITHIN_SCOPE；最终实现 HEAD 与 merge 后 main fresh 门禁均已确认通过。',
          )

          start = text.index('# Post-Merge Finalization（合并后执行）')
          end = text.index('# 文档影响', start)
          replacement = '''# Post-Merge Finalization\n\n- implementation PR：#312 已 merge；原 Draft #311 因宿主 Draft→Ready GraphQL 包装器字段兼容错误关闭未合并，保留为过程证据。\n- merge revision：`b4556cc3f3102a749c323a1053e3b7a9c5f6c3a6`，已重新确认是 `main` 当前实现合入 revision。\n- main fresh：CI #3736、Runtime Acceptance #857、Change Completion #1596、Developer Tooling #257 全部 success。\n- archive：本文件由独立 governance-only 归档分支以同一 ID 从 `changes/active/` 移至 `changes/archive/2026-09/` 并设置 `status: done`。\n- Requirement Source：Issue #310 保持 open，待归档 PR 合入并取得最终 main 治理验证后执行 Closure Audit，再显式 close；没有使用 closing keyword 绕过 post-merge evidence。\n\n# 交付\n\n- 实现 HEAD：`628cfd9817d757335a5e80b5efaaae9a47c8c969`。\n- 实现拉取请求：#312 已合并；#311 关闭未合并，仅因宿主 Draft→Ready 连接器兼容错误被替代。\n- 合并：merge revision `b4556cc3f3102a749c323a1053e3b7a9c5f6c3a6`。\n- main fresh：CI #3736、Runtime #857、Change Completion #1596、Tooling #257 全绿。\n- 归档：独立治理 PR 承载本文件 active→archive 同 ID 移动；归档合并并验证后关闭 Issue #310。\n- 发布：不适用；本次没有 Release 或生产部署变更。\n\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/tmp-archive-310.yml
          git diff --check
      - name: Commit archive move
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: 归档前端全栈审计 Change' -m 'Requirement-Source: #310'
          git push origin HEAD:chore/310-archive-frontend-fullstack-audit-fixes
