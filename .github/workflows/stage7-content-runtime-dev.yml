name: Stage 7 Content Runtime Dev

on:
  push:
    branches:
      - agent/stage7-content-runtime

permissions:
  contents: read

jobs:
  verify:
    name: Content runtime Red Green
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: stage7-content-runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/stage7-content-runtime/data
      AIMA_LOG_DIR: .runtime/stage7-content-runtime/logs
      AIMA_SECRET_DIR: .runtime/stage7-content-runtime/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Prepare database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'stage7-content-runtime' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"
          uv run alembic upgrade head
      - name: Content runtime integration
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/collection/test_collection_content_runtime.py -q
      - name: Quality
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check \
            backend/src/aima_ugc/modules/collection \
            backend/src/aima_ugc/adapters/persistence/postgres \
            tests/integration/collection/test_collection_content_runtime.py
          uv run ruff check \
            backend/src/aima_ugc/modules/collection \
            backend/src/aima_ugc/adapters/persistence/postgres \
            tests/integration/collection/test_collection_content_runtime.py
          uv run mypy backend/src
