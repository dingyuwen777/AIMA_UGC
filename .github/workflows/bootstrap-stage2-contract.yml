name: Bootstrap Stage 2 contract

on:
  push:
    branches:
      - feature/stage2-platform-foundation

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Install frozen toolchain
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
          npm ci --prefix frontend

      - name: Generate committed contract artifacts
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          npm --prefix frontend run generate:api

          if git diff --quiet -- contracts/openapi/openapi.json frontend/src/generated/api; then
            echo "Contract artifacts are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/openapi/openapi.json frontend/src/generated/api
          git commit -m "生成 Stage 2 health Contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"
