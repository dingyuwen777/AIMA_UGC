name: Stage2 Docs Sync

on:
  push:
    branches:
      - feature/stage2-brand-vehicle-resolver

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
      - name: Apply Stage 2 docs patch
        run: uv run python scripts/dev/stage2_docs_patch.py
      - name: Format and lint latest Stage 2 Python
        shell: bash
        run: |
          set -euo pipefail
          FILES="backend/src/aima_ugc/adapters/persistence/postgres/brand_vehicle.py tests/integration/database/test_brand_vehicle_stage2.py"
          uv run ruff format ${FILES}
          uv run ruff check --fix ${FILES}
          uv run ruff format ${FILES}
          uv run ruff check ${FILES}
      - name: Targeted resolver test
        run: uv run pytest -q tests/unit/vehicles/test_brand_vehicle_resolver.py
      - name: Commit canonical updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/aima_ugc/adapters/persistence/postgres/brand_vehicle.py tests/integration/database/test_brand_vehicle_stage2.py docs/blueprint/03_数据库与文件存储.md
          if git diff --cached --quiet; then
            echo "No updates."
            exit 0
          fi
          git commit -m "同步 Stage 2 事实文档与定向格式"
          git push origin HEAD:${GITHUB_REF_NAME}
