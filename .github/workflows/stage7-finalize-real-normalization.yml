name: Stage 7 Finalize Real Normalization

on:
  push:
    branches:
      - feature/stage7-completion
    paths:
      - ".github/workflows/stage7-finalize-real-normalization.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage7-completion
          fetch-depth: 0

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Ensure reply normalization fixes are present
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path

          ks = Path("backend/src/aima_ugc/adapters/providers/tikhub/operations/kuaishou.py")
          text = ks.read_text(encoding="utf-8")
          if "def extract_sub_comment_items(" not in text:
              anchor = "def _required_text(value: str, field_name: str) -> str:\n"
              insert = '''def extract_sub_comment_items(body: dict[str, Any]) -> tuple[dict[str, Any], ...]:\n    """从真实 Web 二级评论响应提取 data.subComments；空页保持空 tuple。"""\n    data = body.get("data")\n    if not isinstance(data, dict):\n        return ()\n    items = data.get("subComments")\n    if not isinstance(items, list):\n        return ()\n    return tuple(item for item in items if isinstance(item, dict))\n\n\n'''
              if anchor not in text:
                  raise SystemExit("kuaishou extractor anchor not found")
              text = text.replace(anchor, insert + anchor, 1)
              text = text.replace(
                  '    "extract_search_items",\n]',
                  '    "extract_search_items",\n    "extract_sub_comment_items",\n]',
                  1,
              )
          if "def from_response(" not in text.split("class KuaishouSearchPagination", 1)[0]:
              anchor = '''        if normalized == previous_cursor:\n            return cls(normalized, False, "pagination_not_advanced")\n        return cls(normalized, True)\n\n\n@dataclass(frozen=True, slots=True)\nclass KuaishouSearchPagination:\n'''
              insert = '''        if normalized == previous_cursor:\n            return cls(normalized, False, "pagination_not_advanced")\n        return cls(normalized, True)\n\n    @classmethod\n    def from_response(\n        cls,\n        *,\n        previous_cursor: str,\n        body: dict[str, Any],\n        item_key: str,\n    ) -> KuaishouCursorPagination:\n        """按真实 Web 评论响应的 data.<items>/pcursor 判断下一页。"""\n        data = body.get("data")\n        if not isinstance(data, dict):\n            return cls(previous_cursor, False, "response_data_unavailable")\n        items = data.get(item_key)\n        if not isinstance(items, list) or not items:\n            return cls(previous_cursor, False, "empty_page")\n        returned = data.get("pcursor")\n        if returned is None:\n            return cls(previous_cursor, False, "cursor_unavailable")\n        normalized = str(returned).strip()\n        if normalized == "":\n            return cls("", False, "provider_exhausted")\n        if normalized == previous_cursor:\n            return cls(normalized, False, "pagination_not_advanced")\n        return cls(normalized, True)\n\n\n@dataclass(frozen=True, slots=True)\nclass KuaishouSearchPagination:\n'''
              if anchor not in text:
                  raise SystemExit("kuaishou cursor anchor not found")
              text = text.replace(anchor, insert, 1)
          ks.write_text(text, encoding="utf-8")

          dy = Path("backend/src/aima_ugc/adapters/providers/tikhub/mappers/douyin.py")
          text = dy.read_text(encoding="utf-8")
          old = "        root_comment_id = context.root_comment_id\n        parent_comment_id = _douyin_parent_comment_id(raw)\n"
          new = '        root_comment_id = context.root_comment_id or optional_string(raw, "root_comment_id")\n        parent_comment_id = _douyin_parent_comment_id(raw)\n'
          if old in text:
              text = text.replace(old, new, 1)
          if new not in text:
              raise SystemExit("douyin reply root behavior missing")
          dy.write_text(text, encoding="utf-8")

          wb = Path("backend/src/aima_ugc/adapters/providers/tikhub/mappers/weibo.py")
          text = wb.read_text(encoding="utf-8")
          if 'reply_comment = first_dict(raw, "reply_comment")' not in text:
              old = '''def _weibo_parent_comment_id(raw: dict[str, Any], root_comment_id: str | None) -> str | None:\n    for key in ("reply_id", "replyid", "rid"):\n'''
              new = '''def _weibo_parent_comment_id(raw: dict[str, Any], root_comment_id: str | None) -> str | None:\n    reply_comment = first_dict(raw, "reply_comment")\n    explicit_parent = optional_string(reply_comment, "idstr", "mid", "id")\n    if explicit_parent not in {None, "0"}:\n        return explicit_parent\n    for key in ("reply_id", "replyid", "rid"):\n'''
              if old not in text:
                  raise SystemExit("weibo direct parent anchor not found")
              text = text.replace(old, new, 1)
          wb.write_text(text, encoding="utf-8")
          PY

      - name: Format task-related implementation and tests
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            backend/src/aima_ugc/adapters/providers/tikhub \
            tests/unit/collection/test_*tikhub*.py

      - name: Run real response to Canonical regression
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest \
            tests/unit/collection/test_xhs_tikhub_operation.py \
            tests/unit/collection/test_xhs_tikhub_mapper.py \
            tests/unit/collection/test_douyin_tikhub_operation.py \
            tests/unit/collection/test_douyin_tikhub_real_shape.py \
            tests/unit/collection/test_weibo_tikhub_operation.py \
            tests/unit/collection/test_bilibili_tikhub_operation.py \
            tests/unit/collection/test_kuaishou_tikhub_operation.py \
            tests/unit/collection/test_tikhub_real_search_operations.py \
            tests/unit/collection/test_tikhub_real_search_mappers.py \
            tests/unit/collection/test_tikhub_real_detail_mappers.py \
            tests/unit/collection/test_tikhub_real_comment_mappers.py \
            tests/unit/collection/test_tikhub_real_reply_mappers.py \
            tests/unit/collection/test_tikhub_real_capabilities.py \
            tests/unit/collection/test_tikhub_pricing.py \
            tests/contracts/test_canonical_v1.py \
            -q

      - name: Run quality and safety gates
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check \
            backend/src/aima_ugc/adapters/providers/tikhub \
            tests/unit/collection/test_*tikhub*.py
          uv run ruff check \
            backend/src/aima_ugc/adapters/providers/tikhub \
            tests/unit/collection/test_*tikhub*.py
          uv run mypy backend/src
          uv run python scripts/quality/scan_secrets.py
          git diff --check

      - name: Commit verified normalization and remove validator
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/stage7-finalize-real-normalization.yml
          git config user.name "AIMA Stage 7 Runner"
          git config user.email "actions@users.noreply.github.com"
          git add \
            backend/src/aima_ugc/adapters/providers/tikhub \
            tests/unit/collection/test_*tikhub*.py
          if git diff --cached --quiet; then
            echo "No code changes required beyond validator removal"
          fi
          git commit -m "完成 TikHub 真实响应归一化闭环"
          git push origin HEAD:feature/stage7-completion
