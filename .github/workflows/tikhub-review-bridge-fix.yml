name: TikHub Review Bridge Fix

on:
  push:
    branches:
      - agent/tikhub-test-debug
    paths:
      - ".github/workflows/tikhub-review-bridge-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/tikhub-test-debug
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Patch production Decision bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/src/aima_ugc/bootstrap/collection_scope.py")
          text = path.read_text(encoding="utf-8")
          old = '''        decision = self._decision_service.decide(\n            CollectionDecisionRequestV1(\n                current=ContentObservationV1(\n                    comment_count=_observed_comment_count(content),\n                    business_changed=prior.business_changed if prior is not None else False,\n                ),'''
          new = '''        search_comment_count = _observed_comment_count(content)\n        decision = self._decision_service.decide(\n            CollectionDecisionRequestV1(\n                current=ContentObservationV1(\n                    comment_count=search_comment_count,\n                    search_missing_required_fields=search_comment_count is None,\n                    business_changed=prior.business_changed if prior is not None else False,\n                ),'''
          if text.count(old) != 1:
              raise SystemExit("expected production Decision bridge block was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          uv run ruff format backend/src/aima_ugc/bootstrap/collection_scope.py tests/unit/collection/test_collection_scope_decision_bridge.py
          uv run ruff check backend/src/aima_ugc/bootstrap/collection_scope.py tests/unit/collection/test_collection_scope_decision_bridge.py
      - name: Verify Green
        shell: bash
        run: |
          set -euo pipefail
          uv run mypy backend/src
          uv run pytest \
            tests/unit/collection/test_collection_scope_decision_bridge.py \
            tests/unit/collection/test_stage7_decision.py \
            tests/unit/collection/test_tikhub_real_capabilities.py \
            -q
          uv run python scripts/quality/scan_secrets.py
          git diff --check
      - name: Commit verified production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/aima_ugc/bootstrap/collection_scope.py
          git commit -m "修复评论计数缺失的生产 Decision 桥接"
          git push origin HEAD:agent/tikhub-test-debug
