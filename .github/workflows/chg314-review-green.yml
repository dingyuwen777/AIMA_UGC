              '''`AnalysisRunTargetSelection(scope="all")` 禁止提交 `content_ids`。Preview 直接统计 PostgreSQL `contents` 的全部 Current 行，因此不会继承声音广场默认隐藏 irrelevant 的展示规则；Create 只建立 Run Header 与 `analysis.content-run-plan.v1` Planner Job。数据库 `scope` 仍复用既有 `query` 值以避免 Schema/Migration，但新 `all` 使用 Analysis 内部专用 JSONB 标记；历史空筛选和带筛选的 query Run 不会被重新解释成 `all`。\n\nPlanner 对 `all` 不使用一次事务的全量 `INSERT ... SELECT`，而是按稳定 Content UUID keyset 分批读取并在独立短事务追加冻结目标；全部冻结、再次核对当前总数与 Preview 数量后，才按 `analysis_run_shard_size` 和 `analysis_run_max_in_flight_jobs` 创建有界 Shard。禁止通过前端分页收集全部 ID，也禁止创建一个承载全部目标的超大 Job Payload。分批冻结降低单事务规模，但在没有新增数据库快照边界字段的前提下，不宣称跨全部批次拥有单一 MVCC 时点；并发新增/修改仍由最终数量校验与每条冻结的 `current_version` 共同形成当前 fail-closed 边界。''',
