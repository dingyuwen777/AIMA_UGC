              '''                if isinstance(targets, AnalysisRunTargetSelection) and targets.scope == "all":\n                    target_count = PostgresContentQueryRepository(\n                        session,\n                        analysis_identity=None,\n                    ).count_all_analysis_targets()\n                else:\n                    target_statement = self._analysis_target_statement(\n                        session,\n                        targets,\n                        analysis_identity=identity,\n                    )\n                    target_count = PostgresAnalysisRepository(session).count_targets(\n                        target_statement\n                    )\n                if target_count == 0:''',
          )
          replace(
              "backend/src/aima_ugc/bootstrap/content_http.py",
              '''        if isinstance(targets, AnalysisRunTargetSelection) and targets.scope == "all":\n            return repository.freeze_target_statement(filters=ContentFilterSnapshot())''',
              '''        if isinstance(targets, AnalysisRunTargetSelection) and targets.scope == "all":\n            raise ValueError("all Scope 只能由 Planner 有界冻结")''',
          )
          replace(
              "backend/src/aima_ugc/bootstrap/content_http.py",
              '''def _analysis_filter_snapshot(targets: _AnalysisTargetSelection) -> dict[str, object]:\n    if isinstance(targets, AnalysisRunTargetSelection) and targets.scope == "all":\n        return ContentFilterSnapshot().model_dump(mode="json")\n    if isinstance(targets, ContentTargetSelection) and targets.scope == "query":\n        return (targets.filters or ContentFilterSnapshot()).model_dump(mode="json")\n    return {"content_ids": [str(item) for item in targets.content_ids]}\n\n\ndef _analysis_storage_scope(targets: _AnalysisTargetSelection) -> Literal["query", "selected"]:\n    """公开 all 复用数据库既有 query Scope，避免无意义 Schema Migration。"""\n\n    if isinstance(targets, AnalysisRunTargetSelection) and targets.scope == "all":\n        return "query"\n    return cast(Literal["query", "selected"], targets.scope)\n\n\ndef _analysis_response_scope(row: RowMapping) -> Literal["all", "query", "selected"]:\n    """空过滤 query 等价于全部当前 Content；历史有过滤 query 继续原样返回。"""\n\n    stored_scope = cast(Literal["query", "selected"], row["scope"])\n    if stored_scope == "query" and row["filter_snapshot"] == ContentFilterSnapshot().model_dump(\n        mode="json"\n    ):\n        return "all"\n    return stored_scope''',
              '''def _analysis_filter_snapshot(targets: _AnalysisTargetSelection) -> dict[str, object]:\n    if isinstance(targets, AnalysisRunTargetSelection) and targets.scope == "all":\n        return analysis_all_scope_filter_snapshot()\n    if isinstance(targets, ContentTargetSelection) and targets.scope == "query":\n        return (targets.filters or ContentFilterSnapshot()).model_dump(mode="json")\n    return {"content_ids": [str(item) for item in targets.content_ids]}\n\n\ndef _analysis_storage_scope(targets: _AnalysisTargetSelection) -> Literal["query", "selected"]:\n    """公开 all 复用数据库既有 query Scope；内部快照负责区分语义。"""\n\n    if isinstance(targets, AnalysisRunTargetSelection) and targets.scope == "all":\n        return "query"\n    return cast(Literal["query", "selected"], targets.scope)\n\n\ndef _analysis_response_scope(row: RowMapping) -> Literal["all", "query", "selected"]:\n    """只有新 all 专用内部标记投影为 all；历史空 query 保持 query。"""\n\n    stored_scope = cast(Literal["query", "selected"], row["scope"])\n    if stored_scope == "query" and is_analysis_all_scope_filter_snapshot(row["filter_snapshot"]):\n        return "all"\n    return stored_scope''',
          )

          replace(
              "backend/src/aima_ugc/bootstrap/analysis_worker.py",
              '''    ContentAnalysisJobPayload,\n    ContentAnalysisPlanJobPayload,\n)''',
              '''    ContentAnalysisJobPayload,\n    ContentAnalysisPlanJobPayload,\n    is_analysis_all_scope_filter_snapshot,\n)''',
          )
          replace(
              "backend/src/aima_ugc/bootstrap/analysis_worker.py",
              '''_LOGGER = logging.getLogger("aima_ugc")\n''',
              '''_LOGGER = logging.getLogger("aima_ugc")\n_ANALYSIS_ALL_FREEZE_BATCH_SIZE = 10_000\n''',
          )
          replace(
              "backend/src/aima_ugc/bootstrap/analysis_worker.py",
              '''class PostgresContentAnalysisPlanJobExecutor:\n    """在 Worker 中冻结 Run Target，并只调度允许的有界 Shard 窗口。"""\n\n    def __init__(self, runtime: PlatformRuntime) -> None:\n        self._runtime = runtime\n\n    def execute_plan(\n        self,\n        *,\n        payload: ContentAnalysisPlanJobPayload,\n        fence: JobExecutionFence,\n        context: JobExecutionContextProtocol,\n    ) -> JobHandlerResult:\n        del context\n        session = self._runtime.database.new_session()\n        try:\n            try:\n                with session.begin():\n                    PostgresJobRepository(session).lock_current_execution(fence)\n                    repository = PostgresAnalysisRepository(session)\n                    run = repository.get_run(payload.run_id, for_update=True)\n                    if run is None:\n                        return JobHandlerResult.failed("analysis_run_not_found")\n                    if run["cancel_requested_at"] is not None:\n                        return JobHandlerResult.cancelled()\n                    expected_target_count = cast(int, run["target_count"])\n                    frozen_count = repository.frozen_target_count(payload.run_id)\n                    if frozen_count == 0:\n                        frozen_count = repository.freeze_run_targets(\n                            run_id=payload.run_id,\n                            target_statement=_target_statement_from_run(session, run),\n                        )\n                    if frozen_count != expected_target_count:\n                        raise _AnalysisTargetSelectionChanged\n                    created = schedule_analysis_run_shards(\n                        session,\n                        run_id=payload.run_id,\n                        max_in_flight=self._runtime.settings.analysis_run_max_in_flight_jobs,\n                        request_id=None,\n                    )\n                    PostgresJobRepository(session).lock_current_execution(fence)\n                    return JobHandlerResult.succeeded(\n                        {\n                            "run_id": str(payload.run_id),\n                            "frozen_target_count": frozen_count,\n                            "scheduled_shards": created,\n                        }\n                    )\n            except _AnalysisTargetSelectionChanged:\n                return JobHandlerResult.failed("content_analysis_target_changed")\n        finally:\n            session.close()''',
              '''class PostgresContentAnalysisPlanJobExecutor:\n    """冻结 Run Target；公开 all 使用可续跑的短事务批次，再启动 Shard。"""\n\n    def __init__(\n        self,\n        runtime: PlatformRuntime,\n        *,\n        freeze_batch_size: int = _ANALYSIS_ALL_FREEZE_BATCH_SIZE,\n    ) -> None:\n        if freeze_batch_size <= 0:\n            raise ValueError("freeze_batch_size 必须大于 0")\n        self._runtime = runtime\n        self._freeze_batch_size = freeze_batch_size\n\n    def execute_plan(\n        self,\n        *,\n        payload: ContentAnalysisPlanJobPayload,\n        fence: JobExecutionFence,\n        context: JobExecutionContextProtocol,\n    ) -> JobHandlerResult:\n        while True:\n            progress: int | None = None\n            session = self._runtime.database.new_session()\n            try:\n                try:\n                    with session.begin():\n                        jobs = PostgresJobRepository(session)\n                        jobs.lock_current_execution(fence)\n                        repository = PostgresAnalysisRepository(session)\n                        run = repository.get_run(payload.run_id, for_update=True)\n                        if run is None:\n                            return JobHandlerResult.failed("analysis_run_not_found")\n                        all_scope = is_analysis_all_scope_filter_snapshot(run["filter_snapshot"])\n                        if run["cancel_requested_at"] is not None:\n                            if all_scope:\n                                repository.clear_run_targets(payload.run_id)\n                            return JobHandlerResult.cancelled()\n\n                        expected_target_count = cast(int, run["target_count"])\n                        frozen_count = repository.frozen_target_count(payload.run_id)\n                        if not all_scope:\n                            if frozen_count == 0:\n                                frozen_count = repository.freeze_run_targets(\n                                    run_id=payload.run_id,\n                                    target_statement=_target_statement_from_run(session, run),\n                                )\n                            if frozen_count != expected_target_count:\n                                raise _AnalysisTargetSelectionChanged\n                            created = schedule_analysis_run_shards(\n                                session,\n                                run_id=payload.run_id,\n                                max_in_flight=(\n                                    self._runtime.settings.analysis_run_max_in_flight_jobs\n                                ),\n                                request_id=None,\n                            )\n                            jobs.lock_current_execution(fence)\n                            return JobHandlerResult.succeeded(\n                                {\n                                    "run_id": str(payload.run_id),\n                                    "frozen_target_count": frozen_count,\n                                    "scheduled_shards": created,\n                                }\n                            )\n\n                        content_repository = PostgresContentQueryRepository(\n                            session,\n                            analysis_identity=None,\n                        )\n                        batch = content_repository.list_all_analysis_targets(\n                            after_content_id=repository.last_frozen_content_id(payload.run_id),\n                            limit=self._freeze_batch_size,\n                        )\n                        if not batch:\n                            current_target_count = (\n                                content_repository.count_all_analysis_targets()\n                            )\n                            if (\n                                frozen_count != expected_target_count\n                                or current_target_count != expected_target_count\n                            ):\n                                repository.clear_run_targets(payload.run_id)\n                                jobs.lock_current_execution(fence)\n                                return JobHandlerResult.failed(\n                                    "content_analysis_target_changed"\n                                )\n                            created = schedule_analysis_run_shards(\n                                session,\n                                run_id=payload.run_id,\n                                max_in_flight=(\n                                    self._runtime.settings.analysis_run_max_in_flight_jobs\n                                ),\n                                request_id=None,\n                            )\n                            jobs.lock_current_execution(fence)\n                            return JobHandlerResult.succeeded(\n                                {\n                                    "run_id": str(payload.run_id),\n                                    "frozen_target_count": frozen_count,\n                                    "scheduled_shards": created,\n                                }\n                            )\n\n                        next_count = frozen_count + len(batch)\n                        if next_count > expected_target_count:\n                            repository.clear_run_targets(payload.run_id)\n                            jobs.lock_current_execution(fence)\n                            return JobHandlerResult.failed("content_analysis_target_changed")\n                        repository.append_run_targets(\n                            run_id=payload.run_id,\n                            start_ordinal=frozen_count,\n                            targets=batch,\n                        )\n                        jobs.lock_current_execution(fence)\n                        progress = min(\n                            99,\n                            int(next_count * 100 / max(expected_target_count, 1)),\n                        )\n                except _AnalysisTargetSelectionChanged:\n                    return JobHandlerResult.failed("content_analysis_target_changed")\n            finally:\n                session.close()\n\n            if progress is not None:\n                context.heartbeat(progress=progress)''',
          )
          replace(
