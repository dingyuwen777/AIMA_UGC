name: CHG314 Review Green

on:
  push:
    branches:
      - fix/314-frontend-fullstack-reliability
    paths:
      - .github/workflows/chg314-review-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: chg314-green
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/chg314-green/data
      AIMA_LOG_DIR: .runtime/chg314-green/logs
      AIMA_SECRET_DIR: .runtime/chg314-green/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: fix/314-frontend-fullstack-reliability
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} replacement(s), found {actual}")
              target.write_text(text.replace(old, new, count), encoding="utf-8")

          replace(
              "backend/src/aima_ugc/modules/analysis/content_analysis_job.py",
              '''CONTENT_ANALYSIS_PLAN_JOB_MAX_ATTEMPTS = 3\n\n\nclass ContentAnalysisJobPayload''',
              '''CONTENT_ANALYSIS_PLAN_JOB_MAX_ATTEMPTS = 3\n\n_ANALYSIS_ALL_SCOPE_MARKER_KEY = "__analysis_scope"\n_ANALYSIS_ALL_SCOPE_MARKER_VALUE = "all"\n\n\ndef analysis_all_scope_filter_snapshot() -> dict[str, object]:\n    """返回只供 Analysis Run 持久化使用的公开 all Scope 内部标记。"""\n\n    return {_ANALYSIS_ALL_SCOPE_MARKER_KEY: _ANALYSIS_ALL_SCOPE_MARKER_VALUE}\n\n\ndef is_analysis_all_scope_filter_snapshot(value: object) -> bool:\n    """只识别新 all Run 的专用标记，不重解释历史空 query 快照。"""\n\n    return value == analysis_all_scope_filter_snapshot()\n\n\nclass ContentAnalysisJobPayload''',
          )
          replace(
              "backend/src/aima_ugc/modules/analysis/content_analysis_job.py",
              '''    "ContentAnalysisPlanJobPayload",\n    "register_content_analysis_job",''',
              '''    "ContentAnalysisPlanJobPayload",\n    "analysis_all_scope_filter_snapshot",\n    "is_analysis_all_scope_filter_snapshot",\n    "register_content_analysis_job",''',
          )

          replace(
              "backend/src/aima_ugc/adapters/persistence/postgres/content_queries.py",
              '''    def list_media(self, content_id: UUID) -> tuple[ContentMediaResponse, ...]:''',
              '''    def count_all_analysis_targets(self) -> int:\n        """统计全部 Content Current；不继承声音广场默认相关性可见性。"""\n\n        return cast(\n            int,\n            self._session.scalar(select(func.count()).select_from(contents_table)) or 0,\n        )\n\n    def list_all_analysis_targets(\n        self,\n        *,\n        after_content_id: UUID | None,\n        limit: int,\n    ) -> tuple[ContentTarget, ...]:\n        """按 Content UUID 稳定 keyset 顺序读取一批全量 Analysis Target。"""\n\n        if limit <= 0:\n            raise ValueError("limit 必须大于 0")\n        statement = select(contents_table.c.id, contents_table.c.current_version)\n        if after_content_id is not None:\n            statement = statement.where(contents_table.c.id > after_content_id)\n        rows = self._session.execute(\n            statement.order_by(contents_table.c.id).limit(limit)\n        ).all()\n        return tuple(\n            ContentTarget(content_id=cast(UUID, row.id), content_version=cast(int, row.current_version))\n            for row in rows\n        )\n\n    def list_media(self, content_id: UUID) -> tuple[ContentMediaResponse, ...]:''',
          )

          replace(
              "backend/src/aima_ugc/adapters/persistence/postgres/analysis.py",
              '''    func,\n    insert,''',
              '''    delete,\n    func,\n    insert,''',
          )
          replace(
              "backend/src/aima_ugc/adapters/persistence/postgres/analysis.py",
              '''    def frozen_target_count(self, run_id: UUID) -> int:\n        """返回已由 Planner 原子冻结的目标数，供 Lease 重试判定幂等状态。"""''',
              '''    def append_run_targets(\n        self,\n        *,\n        run_id: UUID,\n        start_ordinal: int,\n        targets: tuple[ContentTarget, ...],\n    ) -> int:\n        """在调用方短事务内追加一批连续 Run Target。"""\n\n        if start_ordinal < 0:\n            raise ValueError("start_ordinal 不能为负数")\n        if not targets:\n            return 0\n        self._session.execute(\n            insert(analysis_content_run_targets_table),\n            [\n                {\n                    "run_id": run_id,\n                    "target_ordinal": start_ordinal + offset,\n                    "content_id": target.content_id,\n                    "content_version": target.content_version,\n                }\n                for offset, target in enumerate(targets)\n            ],\n        )\n        return len(targets)\n\n    def last_frozen_content_id(self, run_id: UUID) -> UUID | None:\n        """返回已提交 Target 的最后一个 Content ID，供 keyset Planner 续跑。"""\n\n        return cast(\n            UUID | None,\n            self._session.scalar(\n                select(analysis_content_run_targets_table.c.content_id)\n                .where(analysis_content_run_targets_table.c.run_id == run_id)\n                .order_by(analysis_content_run_targets_table.c.target_ordinal.desc())\n                .limit(1)\n            ),\n        )\n\n    def clear_run_targets(self, run_id: UUID) -> None:\n        """清理未开始 Shard 的部分冻结目标，用于 all Scope fail-closed。"""\n\n        self._session.execute(\n            delete(analysis_content_run_targets_table).where(\n                analysis_content_run_targets_table.c.run_id == run_id\n            )\n        )\n\n    def frozen_target_count(self, run_id: UUID) -> int:\n        """返回已经提交的冻结目标数，供 Planner Lease 重试续跑。"""''',
          )

          replace(
              "backend/src/aima_ugc/bootstrap/import_http.py",
              '''                    repository.add_item_if_missing(\n                        KeywordPackItem(\n                            pack_id=pack.id,\n                            keyword_id=keyword.id,\n                            platform_scope="all",\n                            priority=keyword_request.priority,\n                            enabled=keyword_request.enabled,\n                            note=keyword_request.note.strip(),\n                        )\n                    )\n                _audit_configuration(''',
              '''                    repository.add_item_if_missing(\n                        KeywordPackItem(\n                            pack_id=pack.id,\n                            keyword_id=keyword.id,\n                            platform_scope="all",\n                            priority=keyword_request.priority,\n                            enabled=keyword_request.enabled,\n                            note=keyword_request.note.strip(),\n                        )\n                    )\n                committed_pack = repository.get_pack(pack.id)\n                if committed_pack is None:  # pragma: no cover - 同事务父记录不会消失\n                    raise RuntimeError("创建后的 Keyword Pack 无法重读")\n                _audit_configuration(''',
          )
          replace(
              "backend/src/aima_ugc/bootstrap/import_http.py",
              '''                        "version": pack.version,\n                        "enabled": pack.enabled,\n                        "initial_keyword_count": len(request.keywords),\n                    },\n                )\n                return _pack_response(repository, pack)''',
              '''                        "version": committed_pack.version,\n                        "enabled": committed_pack.enabled,\n                        "initial_keyword_count": len(request.keywords),\n                    },\n                )\n                return _pack_response(repository, committed_pack)''',
