name: P1H Real LLM Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/p1h-real-llm-probe.yml"

permissions:
  contents: read

jobs:
  p1h-real-llm-probe:
    name: P1H Real LLM Small Sample
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AIMA_LLM_BASE_URL: ${{ secrets.AIMA_LLM_BASE_URL || vars.AIMA_LLM_BASE_URL || 'https://api.openai.com/v1' }}
      AIMA_LLM_API_KEY: ${{ secrets.AIMA_LLM_API_KEY }}
      AIMA_LLM_MODEL: ${{ secrets.AIMA_LLM_MODEL || vars.AIMA_LLM_MODEL }}
      AIMA_LLM_PROVIDER: ${{ secrets.AIMA_LLM_PROVIDER || vars.AIMA_LLM_PROVIDER || 'openai-compatible' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Require real LLM configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in AIMA_LLM_API_KEY AIMA_LLM_MODEL; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'P1H_REAL_LLM_CONFIG_MISSING:'
            printf ' %s' "${missing[@]}"
            printf '\n'
            exit 2
          fi
          echo 'P1H real LLM configuration gate passed; secret values are not printed.'

      - name: Run real LLM small sample
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          from statistics import fmean

          from pydantic import SecretStr

          from aima_ugc.adapters.llm import OpenAICompatibleContentLabelingLLM
          from aima_ugc.contracts.analysis import UnifiedContentRecordV1
          from aima_ugc.contracts.canonical import (
              CanonicalAuthorV1,
              CanonicalContentV1,
              CanonicalSourceV1,
          )
          from aima_ugc.modules.analysis import (
              CONTENT_LABELING_PROMPT_PATH,
              ContentLabelingService,
              PromptTaxonomyLoader,
              label_unified_content_jsonl,
          )

          samples = (
              ("新品体验", "爱玛这款车骑起来很稳，外观也很喜欢。", "样本用户A"),
              ("质量反馈", "爱玛车辆刹车异响，连续几天都没有解决。", "样本用户B"),
              ("活动信息", "爱玛门店本周有新品体验和购车活动。", "样本用户C"),
              ("售后反馈", "联系爱玛售后后等待时间较长，希望尽快处理。", "样本用户D"),
              ("产品讨论", "看到爱玛发布的新车型信息，正在比较配置。", ""),
          )
          work_dir = Path(os.environ["RUNNER_TEMP"]) / "p1h-real-llm-probe"
          work_dir.mkdir(parents=True, exist_ok=False)
          business_path = work_dir / "deduplicated" / "contents.jsonl"
          analysis_dir = work_dir / "analysis"
          business_path.parent.mkdir(parents=True, exist_ok=True)
          observed_at = datetime.now(UTC)

          with business_path.open("w", encoding="utf-8", newline="\n") as output_file:
              for index, (title, text, author_name) in enumerate(samples, start=1):
                  source = CanonicalSourceV1(
                      provider_name="imports",
                      operation="p1h_real_llm_probe",
                      source_type="synthetic-validation-sample",
                      source_value="p1h-real-llm-probe",
                      item_locator=f"sample={index}",
                      observed_at=observed_at,
                  )
                  author = (
                      CanonicalAuthorV1(display_name=author_name)
                      if author_name
                      else None
                  )
                  content = CanonicalContentV1(
                      platform="offline_probe",
                      external_content_id=f"p1h-real-{index}",
                      content_type="text",
                      title=title,
                      text=text,
                      author=author,
                      observed_at=observed_at,
                      source=source,
                      observed_fields=[
                          "title",
                          "text",
                          *(["author.display_name"] if author is not None else []),
                      ],
                  )
                  output_file.write(
                      UnifiedContentRecordV1(
                          content=content,
                          matched_keywords=["爱玛"],
                      ).model_dump_json()
                  )
                  output_file.write("\n")

          prompt_loader = PromptTaxonomyLoader(CONTENT_LABELING_PROMPT_PATH)
          taxonomy = prompt_loader.load()
          with OpenAICompatibleContentLabelingLLM(
              base_url=os.environ["AIMA_LLM_BASE_URL"],
              api_key=SecretStr(os.environ["AIMA_LLM_API_KEY"]),
              model=os.environ["AIMA_LLM_MODEL"],
              provider_name=os.environ["AIMA_LLM_PROVIDER"],
              timeout_seconds=60.0,
              use_json_mode=True,
          ) as llm:
              service = ContentLabelingService(prompt_loader=prompt_loader, llm=llm)
              summary = label_unified_content_jsonl(
                  input_path=business_path,
                  analysis_dir=analysis_dir,
                  service=service,
                  max_validation_retries=2,
                  batch_size=len(samples),
                  recovery_taxonomy=taxonomy,
              )

          attempts = [
              json.loads(line)
              for line in (analysis_dir / "attempts.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          failed_path = analysis_dir / "failed.jsonl"
          failed = (
              [line for line in failed_path.read_text(encoding="utf-8").splitlines() if line.strip()]
              if failed_path.is_file()
              else []
          )
          first_attempt_items = len(attempts[0]["item_nos"]) if attempts else 0
          retry_cohort = len(attempts[1]["item_nos"]) if len(attempts) > 1 else 0
          final_failed = len(failed)
          initial_valid = first_attempt_items - retry_cohort
          retry_succeeded = retry_cohort - final_failed
          attempt_load = [len(attempt["item_nos"]) for attempt in attempts]
          input_tokens = sum(
              int(attempt["input_tokens"])
              for attempt in attempts
              if attempt.get("input_tokens") is not None
          )
          output_tokens = sum(
              int(attempt["output_tokens"])
              for attempt in attempts
              if attempt.get("output_tokens") is not None
          )
          report = {
              "schema_version": "p1-real-llm-probe.v1",
              "sample_count": len(samples),
              "rows_succeeded": summary.rows_succeeded,
              "rows_failed": summary.rows_failed,
              "llm_attempts": summary.llm_attempts,
              "initial_valid_rate": initial_valid / len(samples),
              "retry_cohort": retry_cohort,
              "retry_success_rate": (
                  retry_succeeded / retry_cohort if retry_cohort else None
              ),
              "final_failure_rate": final_failed / len(samples),
              "average_attempts_per_item": fmean(attempt_load) if attempt_load else 0.0,
              "input_tokens": input_tokens,
              "output_tokens": output_tokens,
              "cost_amount_available": any(
                  attempt.get("cost_amount") is not None for attempt in attempts
              ),
              "prompt_sha256": taxonomy.prompt_sha256,
              "taxonomy_sha256": taxonomy.taxonomy_sha256,
              "model_provider": os.environ["AIMA_LLM_PROVIDER"],
              "model": os.environ["AIMA_LLM_MODEL"],
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if summary.rows_seen != len(samples):
              raise SystemExit("P1H_REAL_LLM_ROW_COUNT_MISMATCH")
          if summary.rows_failed != 0 or summary.rows_succeeded != len(samples):
              raise SystemExit("P1H_REAL_LLM_VALIDATION_FAILED")
          PY
