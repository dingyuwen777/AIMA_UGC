name: Stage 3 Temporary Ruff Format

on:
  push:
    branches:
      - feature/stage3-excel-brand-vehicle-filter

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage3-excel-brand-vehicle-filter
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv==$(tr -d '\r\n' < .uv-version)"
          uv sync --locked
      - name: Format with repository Ruff
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format backend tests scripts migrations/versions/20260814_0005_stage5d_provider_dispatch.py migrations/versions/20260815_0013_stage7_plan_occurrence_run_snapshot.py migrations/versions/20260815_0014_stage7_latest_only_scheduler_policy.py
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git add backend tests scripts migrations
          if git diff --cached --quiet; then
            echo "No formatter changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "格式：应用 Stage 3 Ruff 规范"
          git push origin HEAD:feature/stage3-excel-brand-vehicle-filter
