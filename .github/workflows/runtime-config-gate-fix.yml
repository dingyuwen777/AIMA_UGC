name: Runtime Config Gate Fix (Temporary)

on:
  push:
    branches:
      - feat/runtime-config-control-plane
    paths:
      - .github/workflows/runtime-config-gate-fix.yml

permissions:
  contents: write

concurrency:
  group: runtime-config-gate-fix
  cancel-in-progress: false

jobs:
  fix-staged-workflow:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feat/runtime-config-control-plane
          fetch-depth: 0

      - name: Correct staged Runtime workflow quoting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('changes/CHG-20260903-runtime-config-control-plane/runtime-acceptance.final.yml')
          text = path.read_text(encoding='utf-8')
          old = '''            "test "\\$(cat /run/provider-secrets/${ROTATED_SECRET_REF})" = "ci-rotated-provider-secret-not-real""\n'''
          new = '''            "test \\\"\\$(cat /run/provider-secrets/${ROTATED_SECRET_REF})\\\" = \\\"ci-rotated-provider-secret-not-real\\\""\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one staged quoting defect, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -F '"test \"\$(cat /run/provider-secrets/${ROTATED_SECRET_REF})\" = \"ci-rotated-provider-secret-not-real\""' \
            changes/CHG-20260903-runtime-config-control-plane/runtime-acceptance.final.yml

      - name: Commit corrected staged workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aima-runtime-gate-fixer'
          git config user.email 'actions@users.noreply.github.com'
          git add changes/CHG-20260903-runtime-config-control-plane/runtime-acceptance.final.yml
          git diff --cached --check
          git commit -m 'fix(runtime): 修正验收脚本密钥读取引号'
          git push origin HEAD:feat/runtime-config-control-plane
