name: Temporary Product Lifecycle Validation

on:
  push:
    branches:
      - feature/product-resource-lifecycle

permissions:
  contents: write

jobs:
  frontend-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend environment
        run: npm ci --prefix frontend

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Run affected frontend tests
        run: npm --prefix frontend test -- --run tests/import-batches-api.spec.ts tests/collection-strategy.spec.ts tests/collection-strategy-design.spec.ts tests/collection-runtime.spec.ts tests/collection-runtime-design.spec.ts tests/frontend-audit-regressions.spec.ts tests/admin-configuration-design.spec.ts tests/admin-configuration-presentation.spec.ts

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-product-lifecycle-validation.yml
          git config user.name "AIMA Temporary Validator"
          git config user.email "aima-validator@users.noreply.github.com"
          git commit -m "清理临时产品生命周期前端验证 [skip ci]"
          git push origin HEAD:feature/product-resource-lifecycle
