name: Offline Reporting Verify

on:
  push:
    branches:
      - feature/offline-reporting
    paths-ignore:
      - changes/active/CHG-20260820-offline-reporting/verification_evidence.json

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install uv
        id: install_uv
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          test "$(uv --version | awk '{print $2}')" = "${UV_VERSION}"

      - name: Sync locked environment
        id: sync
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked
          uv run python -c "import aima_ugc"

      - name: Target reporting tests
        id: target
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest \
            tests/unit/platform/test_offline_reporting.py \
            tests/unit/platform/test_imports_test_reporting.py \
            tests/unit/platform/test_docx_package_structure.py \
            tests/unit/collection/test_p1g_imports_run_all.py -q | tee /tmp/target-tests.txt

      - name: Repository static checks
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/static-checks.txt
          uv run ruff format --check backend tests scripts | tee -a /tmp/static-checks.txt
          uv run ruff check backend tests scripts | tee -a /tmp/static-checks.txt
          uv run mypy backend/src | tee -a /tmp/static-checks.txt
          uv run python scripts/quality/check_architecture.py | tee -a /tmp/static-checks.txt
          uv run python scripts/quality/check_docs.py | tee -a /tmp/static-checks.txt
          uv run python scripts/quality/scan_secrets.py | tee -a /tmp/static-checks.txt

      - name: Full unit tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit -q | tee /tmp/unit-tests.txt

      - name: Render a generated DOCX with LibreOffice
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer >/dev/null
          mkdir -p /tmp/aima-report-verify
          uv run python - <<'PY'
          from pathlib import Path
          from openpyxl import Workbook
          from aima_ugc.platform.reporting import generate_excel_report

          root = Path('/tmp/aima-report-verify')
          excel = root / 'labeled_data.xlsx'
          template = Path('backend/src/aima_ugc/adapters/providers/imports_test/report_template.md')
          wb = Workbook()
          ws = wb.active
          ws.title = '内容'
          ws.append(['平台','标题','正文','作者','发布时间','内容链接','命中关键词','情感标签','一级标签','二级标签'])
          ws.append(['抖音','样例1','正文','作者A','2026-08-20 10:00:00','https://example.com/1','爱玛','正面','品牌评价','口碑与信任'])
          ws.append(['小红书','样例2','正文','作者B','2026-08-19 11:00:00','https://example.com/2','爱玛；马赫','负面','售后服务','客服与服务态度'])
          labels = wb.create_sheet('标签明细')
          labels.append(['内容ID','平台','标题','情感标签','一级标签','二级标签','内容链接'])
          labels.append(['1','抖音','样例1','正面','品牌评价','口碑与信任','https://example.com/1'])
          labels.append(['2','小红书','样例2','负面','售后服务','客服与服务态度','https://example.com/2'])
          comments = wb.create_sheet('评论')
          comments.append(['平台','内容ID','评论层级','评论ID','根评论ID','父评论ID','作者','评论内容','评论时间','评论点赞','回复数','来源Provider','Raw/来源定位'])
          wb.save(excel)
          wb.close()
          summary = generate_excel_report(
              excel_path=excel,
              template_path=template,
              output_dir=root / 'report',
          )
          print(summary.markdown_path)
          print(summary.word_path)
          PY
          test -s /tmp/aima-report-verify/report/report.md
          test -s /tmp/aima-report-verify/report/report.docx
          mkdir -p /tmp/aima-report-verify/rendered
          libreoffice --headless --convert-to pdf --outdir /tmp/aima-report-verify/rendered /tmp/aima-report-verify/report/report.docx
          test -s /tmp/aima-report-verify/rendered/report.pdf
          stat --printf='%s\n' /tmp/aima-report-verify/rendered/report.pdf > /tmp/report-pdf-size.txt

      - name: Record verification evidence on branch
        if: always()
        shell: bash
        env:
          EVIDENCE_PATH: changes/active/CHG-20260820-offline-reporting/verification_evidence.json
          INSTALL_UV_OUTCOME: ${{ steps.install_uv.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          TARGET_OUTCOME: ${{ steps.target.outcome }}
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          def tail(path: str, lines: int = 8) -> list[str]:
              file_path = Path(path)
              if not file_path.is_file():
                  return []
              text = file_path.read_text(encoding='utf-8', errors='replace').splitlines()
              return text[-lines:]

          checks = {
              'install_uv': os.environ['INSTALL_UV_OUTCOME'],
              'locked_environment': os.environ['SYNC_OUTCOME'],
              'target_reporting_tests': os.environ['TARGET_OUTCOME'],
              'repository_static_checks': os.environ['STATIC_OUTCOME'],
              'full_unit_tests': os.environ['UNIT_OUTCOME'],
              'libreoffice_docx_render': os.environ['RENDER_OUTCOME'],
          }
          payload = {
              'schema_version': 'offline-reporting-verification.v1',
              'tested_sha': os.environ['GITHUB_SHA'],
              'runner_os': os.environ.get('RUNNER_OS'),
              'verified_at': datetime.now(UTC).isoformat(),
              'result': 'success' if all(value == 'success' for value in checks.values()) else 'failure',
              'checks': checks,
              'target_tests_tail': tail('/tmp/target-tests.txt'),
              'static_checks_tail': tail('/tmp/static-checks.txt', 16),
              'unit_tests_tail': tail('/tmp/unit-tests.txt'),
              'rendered_pdf_bytes': int(Path('/tmp/report-pdf-size.txt').read_text().strip()) if Path('/tmp/report-pdf-size.txt').is_file() else None,
          }
          path = Path(os.environ['EVIDENCE_PATH'])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$EVIDENCE_PATH"
          git commit -m '验证：记录离线报告分支门禁结果 [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          if grep -q '"result": "failure"' "$EVIDENCE_PATH"; then
            exit 1
          fi
