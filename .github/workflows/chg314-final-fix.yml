name: CHG314 Final Regression Fix

on:
  push:
    branches:
      - fix/314-frontend-fullstack-reliability
    paths:
      - .github/workflows/chg314-final-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current change branch
        uses: actions/checkout@v7.0.1
        with:
          ref: fix/314-frontend-fullstack-reliability
          fetch-depth: 0

      - name: Apply minimal regression corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one anchor, got {count}: {old!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 新增身份错误态后，旧 Browser Mock 断言必须定位业务错误 alert，而不是匹配所有 alert。
          replace_once(
              'frontend/e2e/collection-runtime.spec.ts',
              "  await expect(page.getByRole('alert')).toContainText('req_stage8e_error')\n",
              "  await expect(page.getByRole('alert').filter({ hasText: 'req_stage8e_error' })).toContainText('req_stage8e_error')\n",
          )

          # 原子词包接口沿用既有 priority 升序语义；原子性测试不能把请求顺序误当响应顺序。
          replace_once(
              'tests/integration/ingestion/test_frontend_reliability_postgres.py',
              '''        assert [item["text"] for item in created.json()["keywords"]] == [\n            f"爱玛-{suffix}",\n            f"电动车-{suffix}",\n        ]\n''',
              '''        assert [item["text"] for item in created.json()["keywords"]] == [\n            f"电动车-{suffix}",\n            f"爱玛-{suffix}",\n        ]\n''',
          )

          # failed Campaign 的正式 UI 语义是不渲染不可执行动作，而不是保留 disabled 按钮。
          replace_once(
              'frontend/e2e-fullstack/excel-import.spec.ts',
              "  await expect(detail.getByRole('button', { name: '开始导入' })).toBeDisabled()\n",
              "  await expect(detail.getByRole('button', { name: '开始导入' })).toHaveCount(0)\n",
          )

          # AI 新增 selected/all 选择不应改变正式 Figma overlay 外框；Body 已允许滚动。
          replace_once(
              'frontend/src/features/voice-plaza/pages/VoicePlazaPage/components/AnalysisSubmitDialog.vue',
              '.modal { position: relative; display: grid; width: min(560px, calc(100vw - 32px)); height: min(500px, calc(100vh - 32px)); overflow: hidden;',
              '.modal { position: relative; display: grid; width: min(540px, calc(100vw - 32px)); height: min(446px, calc(100vh - 32px)); overflow: hidden;',
          )

          Path('changes/active/CHG-20260903-frontend-fullstack-reliability/DIAGNOSTICS.md').unlink()
          Path('.github/workflows/chg314-final-fix.yml').unlink()
          PY
          git diff --check

      - name: Commit final regression corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: 修正可靠性验收基线漂移" -m "Requirement-Source: #314"
          git push origin HEAD:fix/314-frontend-fullstack-reliability
