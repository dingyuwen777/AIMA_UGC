name: Bootstrap deferred auth docs

on:
  push:
    branches:
      - docs/defer-auth-third-party-identity

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Patch remaining validated decisions
        run: python scripts/dev/patch_deferred_auth_followup.py

      - name: Verify resolved auth wording
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '必须在对话中先给出明确推荐方案' AGENTS.md
          grep -Fq '当前第一版不设计或实现登录入口' docs/blueprint/04-后端任务API与前端.md
          grep -Fq '当前第一版不实现本地用户名/密码' docs/blueprint/05-日志安全部署与运维.md
          grep -Fq '### 5.3 必须由用户/业务 Owner 决定的事项' docs/blueprint/06-开发约束与分阶段实施.md
          grep -Fq '### 2.8 身份认证延期、第三方扩展边界与用户决策规则' docs/blueprint/07-技术决策与实施门禁.md
          if grep -Fq '第一版使用服务端 Session' docs/blueprint/*.md; then
            echo 'Found obsolete first-version Session requirement.'
            exit 1
          fi
          if grep -Fq '| `system` | 用户、角色/权限、Session、登录限流' docs/blueprint/01-总体架构与技术选型.md; then
            echo 'Found obsolete system module auth wording.'
            exit 1
          fi

      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs; then
            echo "No documentation changes produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "清理第三方身份延期后的旧认证假设"
          git push origin "HEAD:${GITHUB_REF_NAME}"
