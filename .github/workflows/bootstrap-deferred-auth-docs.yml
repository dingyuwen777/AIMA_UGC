name: Bootstrap deferred auth docs

on:
  push:
    branches:
      - docs/defer-auth-third-party-identity

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Patch validated decisions
        run: python scripts/dev/patch_deferred_auth_blueprint.py

      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- AGENTS.md README.md docs; then
            echo "No documentation changes produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md docs
          git commit -m "同步第三方身份与用户决策门禁"
          git push origin "HEAD:${GITHUB_REF_NAME}"
