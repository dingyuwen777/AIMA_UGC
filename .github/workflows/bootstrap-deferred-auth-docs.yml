name: Bootstrap deferred auth docs

on:
  push:
    branches:
      - docs/defer-auth-third-party-identity

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Fix validated migration marker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/dev/patch_deferred_auth_blueprint.py")
          text = path.read_text(encoding="utf-8")
          old = '### 5.19 `System/Auth` 与 API 幂等表\\n'
          new = '### 5.19 System/Auth 与 API 幂等表\\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected one old marker, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Patch validated decisions
        run: python scripts/dev/patch_deferred_auth_blueprint.py

      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- AGENTS.md README.md docs; then
            echo "No documentation changes produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md docs
          git commit -m "同步第三方身份与用户决策门禁"
          git push origin "HEAD:${GITHUB_REF_NAME}"
