name: Stage 1-7 Audit Correctness

on:
  push:
    branches:
      - fix/stage1-stage7-audit-correctness
  pull_request:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/modules/content/**"
      - "backend/src/aima_ugc/operations/storage/**"
      - "backend/src/aima_ugc/adapters/storage/**"
      - "backend/src/aima_ugc/adapters/persistence/postgres/**"
      - "backend/src/aima_ugc/modules/collection/**"
      - "migrations/versions/**"
      - "tests/integration/content/**"
      - "tests/integration/collection/**"
      - "tests/unit/operations/**"
      - "tests/unit/collection/**"
      - ".github/workflows/stage1-stage7-audit-correctness.yml"
      - "changes/active/CHG-20260817-stage1-stage7-audit-correctness/**"

permissions:
  contents: read

jobs:
  postgres-regression:
    name: Audit PostgreSQL Regression
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: audit-correctness-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/ci-audit-correctness/data
      AIMA_LOG_DIR: .runtime/ci-audit-correctness/logs
      AIMA_SECRET_DIR: .runtime/ci-audit-correctness/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Prepare PostgreSQL Secret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'audit-correctness-ci' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"
      - name: Upgrade database
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
      - name: Run audit regression tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest \
            tests/integration/content/test_content_audit_regressions.py \
            tests/integration/collection/test_provider_pending_raw_recovery.py \
            -q
