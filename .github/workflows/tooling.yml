name: Developer Tooling Compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/tooling.yml"
      - ".gitignore"
      - ".python-version"
      - ".node-version"
      - ".uv-version"
      - "pyproject.toml"
      - "uv.lock"
      - "env.local.example"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "scripts/setup_dev_environment.ps1"
      - "scripts/setup_dev_environment.cmd"
      - "scripts/dev/**"
      - "compose.yaml"
      - "compose.windows.yaml"
      - "env.production.example"
      - "migrations/**"
      - "backend/src/aima_ugc/platform/**"
      - "backend/src/aima_ugc/bootstrap/**"
      - "backend/src/aima_ugc/modules/system/**"
      - "backend/src/aima_ugc/adapters/persistence/postgres/system.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tooling.yml"
      - ".gitignore"
      - ".python-version"
      - ".node-version"
      - ".uv-version"
      - "pyproject.toml"
      - "uv.lock"
      - "env.local.example"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "scripts/setup_dev_environment.ps1"
      - "scripts/setup_dev_environment.cmd"
      - "scripts/dev/**"
      - "compose.yaml"
      - "compose.windows.yaml"
      - "env.production.example"
      - "migrations/**"
      - "backend/src/aima_ugc/platform/**"
      - "backend/src/aima_ugc/bootstrap/**"
      - "backend/src/aima_ugc/modules/system/**"
      - "backend/src/aima_ugc/adapters/persistence/postgres/system.py"

permissions:
  contents: read

concurrency:
  group: tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-tooling:
    name: Linux Local Development Tooling
    runs-on: ubuntu-24.04
    env:
      AIMA_DATA_DIR: .runtime/data
      AIMA_LOG_DIR: .runtime/logs
      AIMA_SECRET_DIR: .runtime/internal-secrets
      AIMA_EXTERNAL_SECRET_DIR: .runtime/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Validate canonical local launchers
        run: |
          python scripts/dev/backend.py --validate-only
          python scripts/dev/frontend.py --validate-only
          python -m py_compile scripts/dev/backend.py scripts/dev/frontend.py scripts/dev/local_runtime.py

      - name: Prepare frontend dependencies through canonical launcher
        run: python scripts/dev/frontend.py --prepare-only

      - name: Verify local config stays untracked
        run: >-
          python -c "import subprocess; out=subprocess.check_output(['git','status','--porcelain'], text=True).strip(); assert not out, out"

      - name: Install locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Prepare local config
        shell: bash
        run: |
          set -euo pipefail
          cat > env.local <<'EOF'
          AIMA_TIKHUB_BASE_URL=https://api.tikhub.io
          AIMA_TIKHUB_API_KEY=local-bootstrap-fixture-key
          AIMA_LLM_BASE_URL=
          AIMA_LLM_PROVIDER_NAME=
          AIMA_LLM_MODEL=
          AIMA_LLM_API_KEY=
          AIMA_DEV_ENABLE_SCHEDULER=false
          EOF

      - name: Run real PostgreSQL bootstrap and migration
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/dev/backend.py --prepare-only
          test -s .runtime/internal-secrets/postgres_password
          test -s .runtime/internal-secrets/import_batch_cursor_signing_key
          test -s .runtime/internal-secrets/content_cursor_signing_key
          test -s .runtime/internal-secrets/collection_runtime_cursor_signing_key
          test "$(cat .runtime/secrets/tikhub_api_key)" = "local-bootstrap-fixture-key"
          uv run alembic current
          uv run alembic check

      - name: Verify Provider Config stores only secret reference
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from aima_ugc.adapters.persistence.postgres.system import PostgresProviderConfigRepository
          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.database import DatabaseRuntime

          runtime = DatabaseRuntime(load_settings())
          try:
              session = runtime.new_session()
              try:
                  with session.begin():
                      configs = PostgresProviderConfigRepository(session).list_enabled()
              finally:
                  session.close()
          finally:
              runtime.dispose()

          matches = [item for item in configs if item.display_name == "TikHub Local Dev"]
          assert len(matches) == 1, matches
          config = matches[0]
          assert config.provider == "tikhub"
          assert config.base_url == "https://api.tikhub.io"
          assert config.secret_ref == "tikhub_api_key"
          assert "local-bootstrap-fixture-key" not in repr(config)
          PY

      - name: Verify legacy PostgreSQL password is no longer compatible
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f aima-ugc-postgres-dev >/dev/null
          mv .runtime/internal-secrets/postgres_password .runtime/secrets/postgres_password
          if uv run python scripts/dev/backend.py --prepare-only > /tmp/legacy-password.log 2>&1; then
            cat /tmp/legacy-password.log
            echo "legacy postgres password unexpectedly remained compatible"
            exit 1
          fi
          grep -F '已不再受支持' /tmp/legacy-password.log
          test ! -e .runtime/internal-secrets/postgres_password
          test -s .runtime/secrets/postgres_password

      - name: Verify explicit local database reset creates a new internal password
        shell: bash
        run: |
          set -euo pipefail
          LEGACY_PASSWORD="$(cat .runtime/secrets/postgres_password)"
          rm .runtime/secrets/postgres_password
          docker volume rm aima-ugc-postgres-dev-data >/dev/null
          uv run python scripts/dev/backend.py --prepare-only
          test -s .runtime/internal-secrets/postgres_password
          test "$(cat .runtime/internal-secrets/postgres_password)" != "${LEGACY_PASSWORD}"
          test ! -e .runtime/secrets/postgres_password
          uv run alembic current
          uv run alembic check

      - name: Verify Backend shutdown stops PostgreSQL and preserves data
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_LOG=/tmp/aima-local-backend-lifecycle.log
          CONTAINER_ID_BEFORE="$(docker inspect --format '{{.Id}}' aima-ugc-postgres-dev)"
          PASSWORD_HASH_BEFORE="$(sha256sum .runtime/internal-secrets/postgres_password | cut -d' ' -f1)"
          docker exec aima-ugc-postgres-dev \
            psql -U aima_ugc -d aima_ugc -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE IF NOT EXISTS ci_local_backend_lifecycle_marker(value text PRIMARY KEY); DELETE FROM ci_local_backend_lifecycle_marker; INSERT INTO ci_local_backend_lifecycle_marker VALUES ('persisted');"

          .venv/bin/python scripts/dev/backend.py >"${BACKEND_LOG}" 2>&1 &
          BACKEND_PID=$!
          cleanup_backend() {
            if kill -0 "${BACKEND_PID}" 2>/dev/null; then
              kill -TERM "${BACKEND_PID}" 2>/dev/null || true
              wait "${BACKEND_PID}" || true
            fi
          }
          trap cleanup_backend EXIT

          for _attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8090/health/ready >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "${BACKEND_PID}" 2>/dev/null; then
              cat "${BACKEND_LOG}"
              exit 1
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8090/health/ready >/dev/null

          kill -TERM "${BACKEND_PID}"
          wait "${BACKEND_PID}"
          trap - EXIT

          test "$(docker inspect --format '{{.State.Running}}' aima-ugc-postgres-dev)" = "false"
          docker volume inspect aima-ugc-postgres-dev-data >/dev/null
          grep -F '[STOP] PostgreSQL Docker container stopped: aima-ugc-postgres-dev' "${BACKEND_LOG}"

          .venv/bin/python scripts/dev/backend.py --prepare-only
          test "$(docker inspect --format '{{.State.Running}}' aima-ugc-postgres-dev)" = "true"
          test "$(docker inspect --format '{{.Id}}' aima-ugc-postgres-dev)" = "${CONTAINER_ID_BEFORE}"
          PASSWORD_HASH_AFTER="$(sha256sum .runtime/internal-secrets/postgres_password | cut -d' ' -f1)"
          test "${PASSWORD_HASH_BEFORE}" = "${PASSWORD_HASH_AFTER}"
          test "$(docker exec aima-ugc-postgres-dev psql -U aima_ugc -d aima_ugc -Atc 'SELECT value FROM ci_local_backend_lifecycle_marker;')" = "persisted"

      - name: Clean local bootstrap resources
        if: always()
        shell: bash
        run: |
          docker rm -f aima-ugc-postgres-dev >/dev/null 2>&1 || true
          docker volume rm aima-ugc-postgres-dev-data >/dev/null 2>&1 || true
          rm -rf .runtime env.local /tmp/legacy-password.log /tmp/aima-local-backend-lifecycle.log

  windows-tooling:
    name: Windows Development and Compose Tooling
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup target Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup target Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Validate canonical local launchers
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/dev/backend.py --validate-only
          python scripts/dev/frontend.py --validate-only
          python -m py_compile scripts/dev/backend.py scripts/dev/frontend.py scripts/dev/local_runtime.py
          python scripts/dev/frontend.py --prepare-only
          $status = (& git status --porcelain | Out-String).Trim()
          if ($status) { throw "Local launcher changed tracked files: $status" }

      - name: Validate Windows PowerShell bootstrap
        shell: powershell
        run: |
          $scriptPath = (Resolve-Path 'scripts/setup_dev_environment.ps1').Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell parser errors found.'
          }

          . $scriptPath
          $repoRoot = (Resolve-Path '.').Path
          $targets = Get-AimaTargetVersions -RepoRoot $repoRoot
          if ($targets.Python -ne '3.14.7') { throw "Unexpected Python target: $($targets.Python)" }
          if ($targets.Node -ne '24.19.0') { throw "Unexpected Node target: $($targets.Node)" }
          if ($targets.Npm -ne '11.17.0') { throw "Unexpected npm target: $($targets.Npm)" }
          if ($targets.Uv -ne '0.12.3') { throw "Unexpected uv target: $($targets.Uv)" }

          if ((ConvertTo-AimaVersion -Text 'Python 3.14.7') -ne '3.14.7') { throw 'Python version parser failed.' }
          if ((ConvertTo-AimaVersion -Text 'v24.19.0') -ne '24.19.0') { throw 'Node version parser failed.' }
          if ((Get-AimaPythonMajorMinor -Version $targets.Python) -ne '3.14') { throw 'Python launcher selector parser failed.' }
          if ((Get-AimaNpmInstallPrefix -NpmPath 'D:\nodejs\npm.cmd') -ne 'D:\nodejs') { throw 'npm replacement prefix did not follow the resolved npm command.' }

          function Get-ItemProperty {
            param([string]$Path, [object]$ErrorAction)
            @(
              [pscustomobject]@{ DisplayVersion = 'nameless-fixture'; PSChildName = 'nameless-fixture' },
              [pscustomobject]@{ DisplayName = 'Node.js'; DisplayVersion = '24.18.1'; PSChildName = '{00000000-0000-0000-0000-000000000001}' }
            )
          }
          try { $registeredPrograms = @(Get-AimaRegisteredPrograms) }
          finally { Remove-Item -LiteralPath Function:\Get-ItemProperty -Force }
          if ($registeredPrograms.Count -ne 1) { throw "Registry entries without DisplayName were not ignored: $($registeredPrograms.Count)" }
          if ($registeredPrograms[0].DisplayName -ne 'Node.js') { throw 'Valid Node.js registry entry was not preserved.' }
          if (Confirm-AimaUninstall -Label 'Node.js' -Programs @()) { throw 'Empty old-version collection must not request an uninstall.' }

          $targetPython = Get-AimaPythonTargetExecutable -TargetVersion $targets.Python
          if ([string]::IsNullOrWhiteSpace($targetPython)) { throw 'Target Python discovery failed.' }
          $scriptsDir = (& $targetPython -c "import sysconfig; print(sysconfig.get_path('scripts'))" 2>&1 | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($scriptsDir)) { throw 'Target Python scripts path discovery failed.' }

          if ((Get-AimaPythonInstallerUri -Version $targets.Python) -ne 'https://mirrors.tuna.tsinghua.edu.cn/python/3.14.7/python-3.14.7-amd64.exe') { throw 'Python China mirror URL is not exact.' }
          if ((Get-AimaNodeInstallerUri -Version $targets.Node) -ne 'https://npmmirror.com/mirrors/node/v24.19.0/node-v24.19.0-x64.msi') { throw 'Node China mirror URL is not exact.' }
          if ((Get-AimaNodeChecksumUri -Version $targets.Node) -ne 'https://npmmirror.com/mirrors/node/v24.19.0/SHASUMS256.txt') { throw 'Node checksum China mirror URL is not exact.' }
          if ((Get-AimaPypiIndexUri) -ne 'https://pypi.tuna.tsinghua.edu.cn/simple') { throw 'PyPI China mirror is not exact.' }
          if ((Get-AimaNpmRegistryUri) -ne 'https://registry.npmmirror.com') { throw 'npm China registry is not exact.' }

          $scriptContent = Get-Content -LiteralPath $scriptPath -Raw
          foreach ($forbiddenHost in @('www.python.org/ftp/python', 'nodejs.org/dist', 'astral.sh/uv/')) {
            if ($scriptContent -match [regex]::Escape($forbiddenHost)) { throw "Bootstrap contains overseas runtime source: $forbiddenHost" }
          }
          if ($scriptContent -match 'Win32_Product') { throw 'Bootstrap must not query Win32_Product.' }
          if ($scriptContent -match '(?im)^\s*Set-ExecutionPolicy\b') { throw 'Bootstrap must not permanently change PowerShell ExecutionPolicy.' }
          foreach ($requiredPattern in @(
            'lock\s+--check\s+--offline',
            'export\s+--locked\s+--offline',
            'pip\s+sync\s+--python\s+\$projectPythonPath\s+--require-hashes',
            'pip\s+install\s+--python\s+\$projectPythonPath\s+--no-deps\s+--editable'
          )) {
            if ($scriptContent -notmatch $requiredPattern) { throw "Bootstrap is missing locked China-mirror dependency stage: $requiredPattern" }
          }

          $cmdContent = Get-Content -LiteralPath 'scripts/setup_dev_environment.cmd' -Raw
          if ($cmdContent -notmatch 'setup_dev_environment\.ps1') { throw 'CMD entry does not invoke the PowerShell bootstrap.' }

          function Get-AimaNodeRegistrations {
            param([string]$TargetVersion)
            [pscustomobject]@{ DisplayName = 'Node.js'; DisplayVersion = '24.18.1'; PSChildName = '{00000000-0000-0000-0000-000000000001}' }
          }
          function Confirm-AimaUninstall {
            param([string]$Label, [object[]]$Programs)
            if ($Programs.Count -ne 1) { throw "Expected one old Node.js registration, got $($Programs.Count)." }
            throw 'AIMA_NODE_UNINSTALL_PROMPT_REACHED'
          }
          try {
            Install-AimaNode -TargetVersion $targets.Node -TempDir ([IO.Path]::GetTempPath())
            throw 'Node.js uninstall prompt regression did not reach the expected boundary.'
          }
          catch {
            if ($_.Exception.Message -ne 'AIMA_NODE_UNINSTALL_PROMPT_REACHED') { throw }
          }

          $script:AimaFlowVersionStep = 0
          $script:AimaNodeInstallCalled = $false
          $script:AimaNpmUpdateCalled = $false
          $script:AimaDependenciesInstallCalled = $false
          function Refresh-AimaProcessPath {}
          function Get-AimaPythonTargetExecutable { param([string]$TargetVersion); 'C:\fixture\python.exe' }
          function Get-AimaCurrentVersions {
            $script:AimaFlowVersionStep++
            switch ($script:AimaFlowVersionStep) {
              1 { [pscustomobject]@{ Python = '3.14.7'; Node = '24.18.1'; Npm = '11.16.0'; Uv = '0.12.3' } }
              2 { [pscustomobject]@{ Python = '3.14.7'; Node = '24.18.1'; Npm = '11.16.0'; Uv = '0.12.3' } }
              3 { [pscustomobject]@{ Python = '3.14.7'; Node = '24.19.0'; Npm = '11.16.0'; Uv = '0.12.3' } }
              default { [pscustomobject]@{ Python = '3.14.7'; Node = '24.19.0'; Npm = '11.17.0'; Uv = '0.12.3' } }
            }
          }
          function Install-AimaPython { throw 'Python installation should not be called in the flow fixture.' }
          function Install-AimaNode { $script:AimaNodeInstallCalled = $true }
          function Update-AimaNpm { $script:AimaNpmUpdateCalled = $true }
          function Install-AimaUv { throw 'uv installation should not be called in the flow fixture.' }
          function Get-AimaCommandPath { param([string]$Name); "C:\fixture\$Name" }
          function Install-AimaProjectDependencies { $script:AimaDependenciesInstallCalled = $true }

          Invoke-AimaDevEnvironmentSetup
          if (-not $script:AimaNodeInstallCalled) { throw 'Node installation stage was not reached.' }
          if (-not $script:AimaNpmUpdateCalled) { throw 'npm update stage was not reached.' }
          if (-not $script:AimaDependenciesInstallCalled) { throw 'Project dependency installation stage was not reached.' }

      - name: Validate Docker Desktop mirror helpers
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $source = Get-Content scripts/dev/configure_docker_desktop_mirrors.ps1 -Raw
          [void][scriptblock]::Create($source)
          . .\scripts\dev\configure_docker_desktop_mirrors.ps1

          $withExtras = @('https://legacy-before.example/')
          for ($index = 0; $index -lt $Mirrors.Count; $index++) {
              $withExtras += "$($Mirrors[$index])/"
              if ($index -eq 0) { $withExtras += 'https://legacy-middle.example/' }
          }
          $withExtras += 'https://legacy-after.example/'
          if (-not (Test-ExpectedMirrorsPresent -ActualMirrors $withExtras)) { throw 'AIMA mirrors must be accepted when additional Docker Desktop mirrors are present.' }

          $missingIdentity = ConvertTo-MirrorIdentity -Mirror $Mirrors[0]
          $missing = @($withExtras | Where-Object { (ConvertTo-MirrorIdentity -Mirror ([string]$_)) -ne $missingIdentity })
          if (Test-ExpectedMirrorsPresent -ActualMirrors $missing) { throw 'Missing an AIMA mirror must fail effective-state validation.' }

          if ($Mirrors.Count -ge 2) {
              $outOfOrder = @($Mirrors)
              $first = $outOfOrder[0]
              $outOfOrder[0] = $outOfOrder[1]
              $outOfOrder[1] = $first
              if (Test-ExpectedMirrorsPresent -ActualMirrors $outOfOrder) { throw 'AIMA mirror relative order must remain significant.' }
          }

          $daemon = [pscustomobject]@{}
          $daemon | Add-Member -NotePropertyName 'registry-mirrors' -NotePropertyValue $Mirrors
          $daemon | Add-Member -NotePropertyName 'max-download-attempts' -NotePropertyValue 5
          if (-not (Test-AimaDaemonConfigMatches -Daemon $daemon)) { throw 'Exact AIMA daemon mirror configuration should match.' }
          $daemon.'registry-mirrors' = @('https://extra.example') + $Mirrors
          if (Test-AimaDaemonConfigMatches -Daemon $daemon) { throw 'daemon.json remains AIMA-managed and must not silently gain extra mirrors.' }

          $expected = @('https://legacy-one.example/', 'https://legacy-two.example/', 'https://legacy-three.example/') + @($Mirrors)
          $mirrorLiterals = ($expected | ForEach-Object { '"' + $_ + '"' }) -join ','
          $fakeDir = Join-Path $env:RUNNER_TEMP 'aima-fake-docker'
          New-Item -ItemType Directory -Path $fakeDir -Force | Out-Null
          $fakeDocker = Join-Path $fakeDir 'docker.exe'
          $fakeSource = @"
          using System;
          public static class Program
          {
              public static int Main(string[] args)
              {
                  var mirrors = new string[] { $mirrorLiterals };
                  if (args.Length < 3 || args[0] != "info" || args[1] != "--format") return 20;
                  if (args[2] == "{{range .RegistryConfig.Mirrors}}{{println .}}{{end}}")
                  {
                      foreach (var mirror in mirrors) Console.WriteLine(mirror);
                      return 0;
                  }
                  if (args[2] == "{{json .RegistryConfig.Mirrors}}")
                  {
                      Console.WriteLine("\"" + string.Join(" ", mirrors) + "\"");
                      return 0;
                  }
                  return 21;
              }
          }
          "@
          Add-Type -TypeDefinition $fakeSource -Language CSharp -OutputAssembly $fakeDocker -OutputType ConsoleApplication
          $env:PATH = "$fakeDir;$env:PATH"
          $probe = Get-DockerRegistryMirrorProbe -TimeoutSeconds 3
          if (-not $probe.Succeeded) { throw "Production probe failed: $($probe.Error)" }
          $actual = @($probe.Mirrors)
          if ($actual.Count -ne $expected.Count) { throw "Expected $($expected.Count) independent mirrors, got $($actual.Count): $($actual -join ' | ')" }
          for ($index = 0; $index -lt $expected.Count; $index++) {
              if ($actual[$index] -ne $expected[$index]) { throw "Mirror[$index] mismatch: expected $($expected[$index]), got $($actual[$index])" }
          }
          if (-not (Test-ExpectedMirrorsPresent -ActualMirrors $actual)) { throw 'Production probe output must satisfy AIMA mirror effective-state validation.' }

      - name: Validate Windows Compose CLI contract
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item env.production.example env.production
          $services = & docker compose -f compose.yaml -f compose.windows.yaml --env-file env.production config --services
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = @("bootstrap", "postgres", "migrate", "configure", "api", "worker", "scheduler", "frontend")
          foreach ($service in $expected) {
              if ($services -notcontains $service) { throw "Missing Compose service: $service" }
          }
          cmd /c "docker compose -f compose.yaml -f compose.windows.yaml --env-file env.production config --services > %RUNNER_TEMP%\compose-cmd-services.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
