name: Runtime Config Mypy Fix (Temporary)

on:
  push:
    branches:
      - feat/runtime-config-control-plane
    paths:
      - scripts/dev/runtime_config_mypy_fix.py
      - .github/workflows/runtime-config-mypy-fix.yml

permissions:
  contents: write

concurrency:
  group: runtime-config-mypy-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feat/runtime-config-control-plane
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'uv==0.12.3'
          uv sync --locked

      - name: Apply and verify type fixes
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format scripts/dev/runtime_config_mypy_fix.py
          uv run python scripts/dev/runtime_config_mypy_fix.py
          uv run ruff format --check backend tests scripts \
            migrations/versions/20260814_0005_stage5d_provider_dispatch.py \
            migrations/versions/20260815_0013_stage7_plan_occurrence_run_snapshot.py \
            migrations/versions/20260815_0014_stage7_latest_only_scheduler_policy.py
          uv run ruff check backend tests scripts \
            migrations/versions/20260814_0005_stage5d_provider_dispatch.py \
            migrations/versions/20260815_0013_stage7_plan_occurrence_run_snapshot.py \
            migrations/versions/20260815_0014_stage7_latest_only_scheduler_policy.py

      - name: Commit fix and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/dev/runtime_config_mypy_fix.py .github/workflows/runtime-config-mypy-fix.yml
          git config user.name 'aima-runtime-finalizer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(runtime): satisfy frozen provider type contracts'
          git push origin HEAD:feat/runtime-config-control-plane
