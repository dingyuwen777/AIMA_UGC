name: Temporary RVC Discover TikHub Paths

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-rvc-discover-tikhub-paths.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/tikhub-test-default-paths
      - name: Refresh project context
        shell: bash
        run: |
          set -euo pipefail
          python .agents/skills/reliable-vibe-coding/scripts/rvc.py discover --root .
          git diff --check
      - name: Commit refreshed context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .reliable-vibe-coding/project-context.json
          if git diff --cached --quiet; then
            echo "RVC context already current."
          else
            git commit -m "刷新 RVC 项目导航索引"
            git push origin HEAD:fix/tikhub-test-default-paths
          fi
