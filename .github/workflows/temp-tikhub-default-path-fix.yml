name: Temporary TikHub Default Path Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-tikhub-default-path-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/tikhub-test-default-paths
      - name: Apply exact relocation fix
        shell: python
        run: |
          import re
          from pathlib import Path

          runner = Path("backend/src/aima_ugc/adapters/providers/tikhub_test/operations/runner.py")
          text = runner.read_text(encoding="utf-8")
          old_output = '_DEFAULT_OUTPUT_ROOT = Path(__file__).with_name("output")'
          new_output = '_DEFAULT_OUTPUT_ROOT = Path(__file__).resolve().parent.parent / "output"'
          old_load = "    if env_file is None:\n        env_file = find_env_file()\n    config = TikHubTestConfig.load(env_file)"
          new_load = "    config = TikHubTestConfig.load(env_file)"
          assert text.count(old_output) == 1
          assert text.count(old_load) == 1
          text = text.replace(old_output, new_output).replace(old_load, new_load)
          text, helper_count = re.subn(
              r"\ndef find_env_file\(start_path: Path \| None = None\) -> Path \| None:\n.*?\n\ndef run_platform\(",
              "\n\ndef run_platform(",
              text,
              count=1,
              flags=re.DOTALL,
          )
          assert helper_count == 1
          runner.write_text(text, encoding="utf-8")

          test_file = Path("tests/unit/collection/test_tikhub_test_debug.py")
          test_text = test_file.read_text(encoding="utf-8")
          old_guard = '        lambda *_args, **_kwargs: pytest.fail("run_platform 不应扫描 CWD/父目录 .env"),\n    )'
          new_guard = '        lambda *_args, **_kwargs: pytest.fail("run_platform 不应扫描 CWD/父目录 .env"),\n        raising=False,\n    )'
          assert test_text.count(old_guard) == 1
          test_file.write_text(test_text.replace(old_guard, new_guard), encoding="utf-8")
      - name: Commit exact fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/aima_ugc/adapters/providers/tikhub_test/operations/runner.py tests/unit/collection/test_tikhub_test_debug.py
          git diff --cached --check
          git commit -m "修复 TikHub 调试默认路径"
          git push origin HEAD:fix/tikhub-test-default-paths
