name: Temporary Fullstack Product Lifecycle Patch

on:
  push:
    branches:
      - feature/product-resource-lifecycle
    paths:
      - .github/workflows/tmp-fullstack-product-lifecycle-patch.yml

permissions:
  contents: write

jobs:
  patch-and-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Apply exact full-stack spec patch
        run: python .github/tmp_fullstack_product_lifecycle_patch.py

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend environment
        run: npm ci --prefix frontend

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Commit specs and remove temporary files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" != "success" ]]; then
            git reset --hard HEAD
          fi
          git rm .github/workflows/tmp-fullstack-product-lifecycle-patch.yml .github/tmp_fullstack_product_lifecycle_patch.py
          if [[ "${{ job.status }}" == "success" ]]; then
            git add \
              frontend/e2e-fullstack/stage12-historical-analysis.spec.ts \
              frontend/e2e-fullstack/admin-product-capabilities.spec.ts
          fi
          git config user.name "AIMA Temporary Validator"
          git config user.email "aima-validator@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "补齐资源生命周期真实用户验收 [skip ci]"
          git push origin HEAD:feature/product-resource-lifecycle
