name: Stage 5A Provider Raw

on:
  push:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/contracts/provider/**"
      - "backend/src/aima_ugc/contracts/analysis/**"
      - "backend/src/aima_ugc/contracts/export/**"
      - "backend/src/aima_ugc/modules/collection/**"
      - "backend/src/aima_ugc/modules/analysis/**"
      - "backend/src/aima_ugc/adapters/llm/**"
      - "backend/src/aima_ugc/adapters/providers/**"
      - "backend/src/aima_ugc/platform/export/**"
      - "backend/src/aima_ugc/operations/storage/**"
      - "backend/src/aima_ugc/adapters/storage/**"
      - "contracts/provider/**"
      - "contracts/analysis/**"
      - "contracts/export/**"
      - "scripts/contracts/**"
      - "scripts/quality/**"
      - "tests/unit/collection/**"
      - "tests/unit/analysis/**"
      - "tests/unit/platform/test_excel_export.py"
      - "tests/unit/platform/test_p1g_labeled_excel.py"
      - "tests/integration/collection/**"
      - "tests/contracts/test_provider_v1.py"
      - ".github/workflows/stage5a-provider-raw.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/contracts/provider/**"
      - "backend/src/aima_ugc/contracts/analysis/**"
      - "backend/src/aima_ugc/contracts/export/**"
      - "backend/src/aima_ugc/modules/collection/**"
      - "backend/src/aima_ugc/modules/analysis/**"
      - "backend/src/aima_ugc/adapters/llm/**"
      - "backend/src/aima_ugc/adapters/providers/**"
      - "backend/src/aima_ugc/platform/export/**"
      - "backend/src/aima_ugc/operations/storage/**"
      - "backend/src/aima_ugc/adapters/storage/**"
      - "contracts/provider/**"
      - "contracts/analysis/**"
      - "contracts/export/**"
      - "scripts/contracts/**"
      - "scripts/quality/**"
      - "tests/unit/collection/**"
      - "tests/unit/analysis/**"
      - "tests/unit/platform/test_excel_export.py"
      - "tests/unit/platform/test_p1g_labeled_excel.py"
      - "tests/integration/collection/**"
      - "tests/contracts/test_provider_v1.py"
      - ".github/workflows/stage5a-provider-raw.yml"

permissions:
  contents: read
  issues: write

jobs:
  stage5a-provider-raw:
    name: Stage 5A Provider Raw
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: P1 Excel import and processing tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest \
            tests/unit/collection/test_imports_excel.py \
            tests/unit/collection/test_imports_test_export.py \
            tests/unit/collection/test_p1g_imports_run_all.py \
            tests/unit/collection/test_tikhub_test_debug.py \
            tests/unit/analysis \
            tests/unit/platform/test_excel_export.py \
            tests/unit/platform/test_p1g_labeled_excel.py \
            -q

      - name: P1 lint and type gates
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check \
            backend/src/aima_ugc/contracts/analysis \
            backend/src/aima_ugc/contracts/export \
            backend/src/aima_ugc/modules/analysis \
            backend/src/aima_ugc/adapters/llm \
            backend/src/aima_ugc/adapters/providers/imports \
            backend/src/aima_ugc/adapters/providers/imports_test \
            backend/src/aima_ugc/adapters/providers/tikhub_test/operations/runner.py \
            backend/src/aima_ugc/platform/export \
            tests/unit/collection/test_imports_excel.py \
            tests/unit/collection/test_imports_test_export.py \
            tests/unit/collection/test_p1g_imports_run_all.py \
            tests/unit/collection/test_tikhub_test_debug.py \
            tests/unit/analysis \
            tests/unit/platform/test_excel_export.py \
            tests/unit/platform/test_p1g_labeled_excel.py
          uv run ruff check \
            backend/src/aima_ugc/contracts/analysis \
            backend/src/aima_ugc/contracts/export \
            backend/src/aima_ugc/modules/analysis \
            backend/src/aima_ugc/adapters/llm \
            backend/src/aima_ugc/adapters/providers/imports \
            backend/src/aima_ugc/adapters/providers/imports_test \
            backend/src/aima_ugc/adapters/providers/tikhub_test/operations/runner.py \
            backend/src/aima_ugc/platform/export \
            tests/unit/collection/test_imports_excel.py \
            tests/unit/collection/test_imports_test_export.py \
            tests/unit/collection/test_p1g_imports_run_all.py \
            tests/unit/collection/test_tikhub_test_debug.py \
            tests/unit/analysis \
            tests/unit/platform/test_excel_export.py \
            tests/unit/platform/test_p1g_labeled_excel.py
          uv run mypy \
            backend/src/aima_ugc/contracts/analysis \
            backend/src/aima_ugc/contracts/export \
            backend/src/aima_ugc/modules/analysis \
            backend/src/aima_ugc/adapters/llm \
            backend/src/aima_ugc/adapters/providers/imports \
            backend/src/aima_ugc/adapters/providers/imports_test \
            backend/src/aima_ugc/adapters/providers/tikhub_test/operations/runner.py \
            backend/src/aima_ugc/platform/export

      - name: P1 Analysis and Export Contract drift
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          git diff --exit-code -- contracts/analysis contracts/export
          UNTRACKED="$(git ls-files --others --exclude-standard -- contracts/analysis contracts/export)"
          if [[ -n "${UNTRACKED}" ]]; then
            echo "P1_CONTRACT_UNTRACKED: ${UNTRACKED}"
            exit 1
          fi
          test -f contracts/export/unified-data-excel.v1.schema.json
          uv run python scripts/contracts/generate.py --check

      - name: P1 architecture gate
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/quality/check_architecture.py

      - name: P1 Secret and Docs gates
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py

      - name: Provider and Raw tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/collection/test_provider_client.py tests/integration/collection/test_raw_artifact.py tests/integration/collection/test_raw_artifact_logging.py tests/contracts/test_provider_v1.py -q

      - name: Provider Contract drift
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/contracts/generate.py
          git diff --exit-code -- contracts/provider
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py

      - name: Stage 5A quality gates
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check backend tests scripts
          uv run ruff check backend tests scripts
          uv run mypy backend/src
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py

  p1h-ephemeral-real-llm:
    name: P1H Ephemeral Real LLM Small Sample
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate ephemeral key and receive encrypted configuration
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          KEY_DIR="${RUNNER_TEMP}/p1h-ephemeral"
          RUN_TOKEN="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PUBLIC_PREFIX="P1H_EPHEMERAL_PUBLIC_KEY:${RUN_TOKEN}:"
          PAYLOAD_PREFIX="P1H_EPHEMERAL_PAYLOAD:${RUN_TOKEN}:"
          mkdir -p "${KEY_DIR}"
          chmod 700 "${KEY_DIR}"

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:3072 \
            -out "${KEY_DIR}/private.pem" \
            >/dev/null 2>&1
          chmod 600 "${KEY_DIR}/private.pem"
          openssl pkey \
            -in "${KEY_DIR}/private.pem" \
            -pubout \
            -out "${KEY_DIR}/public.pem" \
            >/dev/null 2>&1

          PUBLIC_KEY_B64="$(base64 -w0 "${KEY_DIR}/public.pem")"
          comment_json="$(jq -n --arg body "${PUBLIC_PREFIX}${PUBLIC_KEY_B64}" '{body: $body}')"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data "${comment_json}" \
            >/dev/null
          echo "P1H_EPHEMERAL_PUBLIC_KEY_COMMENTED:${RUN_TOKEN}"

          payload_found=false
          for _ in $(seq 1 90); do
            comments_json="$(curl \
              --fail \
              --silent \
              --show-error \
              --location \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"
            payload="$(printf '%s' "${comments_json}" | jq -r --arg prefix "${PAYLOAD_PREFIX}" '[.[] | .body | select(startswith($prefix))][-1] // empty')"
            if [[ -n "${payload}" ]]; then
              printf '%s' "${payload#${PAYLOAD_PREFIX}}" > "${KEY_DIR}/payload.b64"
              payload_found=true
              break
            fi
            sleep 2
          done

          if [[ "${payload_found}" != "true" ]]; then
            echo "P1H_EPHEMERAL_PAYLOAD_TIMEOUT:${RUN_TOKEN}"
            exit 3
          fi

          base64 --decode "${KEY_DIR}/payload.b64" > "${KEY_DIR}/payload.bin"
          openssl pkeyutl \
            -decrypt \
            -inkey "${KEY_DIR}/private.pem" \
            -in "${KEY_DIR}/payload.bin" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out "${KEY_DIR}/config.json"
          chmod 600 "${KEY_DIR}/config.json"
          echo "P1H_EPHEMERAL_PAYLOAD_DECRYPTED:${RUN_TOKEN}"

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Run production adapter real LLM small sample
        shell: bash
        run: |
          set -euo pipefail
          P1H_CONFIG_PATH="${RUNNER_TEMP}/p1h-ephemeral/config.json" uv run python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          from pydantic import SecretStr

          from aima_ugc.adapters.llm import OpenAICompatibleContentLabelingLLM
          from aima_ugc.contracts.analysis import UnifiedContentRecordV1
          from aima_ugc.contracts.canonical import (
              CanonicalAuthorV1,
              CanonicalContentV1,
              CanonicalSourceV1,
          )
          from aima_ugc.modules.analysis import (
              CONTENT_LABELING_PROMPT_PATH,
              ContentLabelingService,
              PromptTaxonomyLoader,
              label_unified_content_jsonl,
          )

          config_path = Path(os.environ["P1H_CONFIG_PATH"])
          config = json.loads(config_path.read_text(encoding="utf-8"))
          required = ("base_url", "api_key", "model", "provider_name")
          missing = [name for name in required if not isinstance(config.get(name), str) or not config[name]]
          if missing:
              raise SystemExit("P1H_EPHEMERAL_CONFIG_INVALID")

          samples = (
              ("新品体验", "爱玛这款车骑起来很稳，外观也很喜欢。", "样本用户A"),
              ("质量反馈", "爱玛车辆刹车异响，连续几天都没有解决。", "样本用户B"),
              ("活动信息", "爱玛门店本周有新品体验和购车活动。", "样本用户C"),
              ("售后反馈", "联系爱玛售后后等待时间较长，希望尽快处理。", "样本用户D"),
              ("产品讨论", "看到爱玛发布的新车型信息，正在比较配置。", ""),
          )
          work_dir = Path(os.environ["RUNNER_TEMP"]) / "p1h-real-llm-probe"
          work_dir.mkdir(parents=True, exist_ok=False)
          business_path = work_dir / "deduplicated" / "contents.jsonl"
          analysis_dir = work_dir / "analysis"
          business_path.parent.mkdir(parents=True, exist_ok=True)
          observed_at = datetime.now(UTC)

          with business_path.open("w", encoding="utf-8", newline="\n") as output_file:
              for index, (title, text, author_name) in enumerate(samples, start=1):
                  source = CanonicalSourceV1(
                      provider_name="imports",
                      operation="p1h_real_llm_probe",
                      source_type="synthetic-validation-sample",
                      source_value="p1h-real-llm-probe",
                      item_locator=f"sample={index}",
                      observed_at=observed_at,
                  )
                  author = CanonicalAuthorV1(display_name=author_name) if author_name else None
                  content = CanonicalContentV1(
                      platform="offline_probe",
                      external_content_id=f"p1h-real-{index}",
                      content_type="text",
                      title=title,
                      text=text,
                      author=author,
                      observed_at=observed_at,
                      source=source,
                      observed_fields=[
                          "title",
                          "text",
                          *(["author.display_name"] if author is not None else []),
                      ],
                  )
                  output_file.write(
                      UnifiedContentRecordV1(
                          content=content,
                          matched_keywords=["爱玛"],
                      ).model_dump_json()
                  )
                  output_file.write("\n")

          prompt_loader = PromptTaxonomyLoader(CONTENT_LABELING_PROMPT_PATH)
          taxonomy = prompt_loader.load()
          with OpenAICompatibleContentLabelingLLM(
              base_url=config["base_url"],
              api_key=SecretStr(config["api_key"]),
              model=config["model"],
              provider_name=config["provider_name"],
              timeout_seconds=60.0,
              use_json_mode=True,
          ) as llm:
              service = ContentLabelingService(prompt_loader=prompt_loader, llm=llm)
              summary = label_unified_content_jsonl(
                  input_path=business_path,
                  analysis_dir=analysis_dir,
                  service=service,
                  max_validation_retries=2,
                  batch_size=len(samples),
                  recovery_taxonomy=taxonomy,
              )

          attempts = [
              json.loads(line)
              for line in (analysis_dir / "attempts.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          failed_path = analysis_dir / "failed.jsonl"
          failed_rows = (
              [line for line in failed_path.read_text(encoding="utf-8").splitlines() if line.strip()]
              if failed_path.is_file()
              else []
          )
          first_attempt_items = set(attempts[0]["item_nos"]) if attempts else set()
          retried_items = {
              item_no
              for attempt in attempts[1:]
              for item_no in attempt["item_nos"]
          }
          final_failed = len(failed_rows)
          initial_valid = len(first_attempt_items - retried_items)
          retry_succeeded = len(retried_items) - final_failed
          total_item_attempts = sum(len(attempt["item_nos"]) for attempt in attempts)
          input_tokens = sum(
              int(attempt["input_tokens"])
              for attempt in attempts
              if attempt.get("input_tokens") is not None
          )
          output_tokens = sum(
              int(attempt["output_tokens"])
              for attempt in attempts
              if attempt.get("output_tokens") is not None
          )
          cost_values = [
              float(attempt["cost_amount"])
              for attempt in attempts
              if attempt.get("cost_amount") is not None
          ]

          report = {
              "schema_version": "p1-real-llm-probe.v2",
              "sample_count": len(samples),
              "rows_succeeded": summary.rows_succeeded,
              "rows_failed": summary.rows_failed,
              "llm_http_attempts": summary.llm_attempts,
              "initial_valid_rate": initial_valid / len(samples),
              "retried_item_count": len(retried_items),
              "retry_success_rate": (
                  retry_succeeded / len(retried_items) if retried_items else None
              ),
              "final_failure_rate": final_failed / len(samples),
              "average_attempts_per_item": total_item_attempts / len(samples),
              "input_tokens": input_tokens,
              "output_tokens": output_tokens,
              "cost_amount": sum(cost_values) if cost_values else None,
              "prompt_sha256": taxonomy.prompt_sha256,
              "taxonomy_sha256": taxonomy.taxonomy_sha256,
              "model_provider": config["provider_name"],
              "model": config["model"],
          }
          print("P1H_REAL_LLM_REPORT=" + json.dumps(report, ensure_ascii=False, separators=(",", ":")))

          if summary.rows_seen != len(samples):
              raise SystemExit("P1H_REAL_LLM_ROW_COUNT_MISMATCH")
          if summary.rows_failed != 0 or summary.rows_succeeded != len(samples):
              raise SystemExit("P1H_REAL_LLM_VALIDATION_FAILED")
          PY

      - name: Remove decrypted configuration
        if: always()
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/p1h-ephemeral"
