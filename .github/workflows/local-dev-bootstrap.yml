name: Local Dev Bootstrap

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  launcher-cross-platform:
    name: Launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Validate cross-platform launchers
        run: |
          python scripts/dev/backend.py --validate-only
          python scripts/dev/frontend.py --validate-only
          python -m py_compile scripts/dev/backend.py scripts/dev/frontend.py scripts/dev/local_runtime.py

      - name: Verify local config stays untracked
        run: >-
          python -c "import subprocess; out=subprocess.check_output(['git','status','--porcelain'], text=True).strip(); assert not out, out"

  postgres-bootstrap-smoke:
    name: PostgreSQL bootstrap smoke
    runs-on: ubuntu-24.04
    env:
      AIMA_DATA_DIR: .runtime/data
      AIMA_LOG_DIR: .runtime/logs
      AIMA_SECRET_DIR: .runtime/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Prepare local config with non-production fixture key
        shell: bash
        run: |
          cat > env.local <<'EOF'
          AIMA_TIKHUB_BASE_URL=https://api.tikhub.io
          AIMA_TIKHUB_API_KEY=local-bootstrap-fixture-key
          AIMA_LLM_BASE_URL=
          AIMA_LLM_PROVIDER_NAME=
          AIMA_LLM_MODEL=
          AIMA_LLM_API_KEY=
          AIMA_DEV_ENABLE_SCHEDULER=false
          EOF

      - name: Run real PostgreSQL bootstrap and migration
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/dev/backend.py --prepare-only
          test -s .runtime/secrets/postgres_password
          test -s .runtime/secrets/import_batch_cursor_signing_key
          test -s .runtime/secrets/content_cursor_signing_key
          test -s .runtime/secrets/collection_runtime_cursor_signing_key
          test "$(cat .runtime/secrets/tikhub_api_key)" = "local-bootstrap-fixture-key"
          uv run alembic current
          uv run alembic check

      - name: Verify Provider Config stores only secret reference
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from aima_ugc.adapters.persistence.postgres.system import PostgresProviderConfigRepository
          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.database import DatabaseRuntime

          runtime = DatabaseRuntime(load_settings())
          try:
              session = runtime.new_session()
              try:
                  with session.begin():
                      configs = PostgresProviderConfigRepository(session).list_enabled()
              finally:
                  session.close()
          finally:
              runtime.dispose()

          matches = [item for item in configs if item.display_name == "TikHub Local Dev"]
          assert len(matches) == 1, matches
          config = matches[0]
          assert config.provider == "tikhub"
          assert config.base_url == "https://api.tikhub.io"
          assert config.secret_ref == "tikhub_api_key"
          assert "local-bootstrap-fixture-key" not in repr(config)
          PY

      - name: Clean local bootstrap resources
        if: always()
        shell: bash
        run: |
          docker rm -f aima-ugc-postgres-dev >/dev/null 2>&1 || true
          docker volume rm aima-ugc-postgres-dev-data >/dev/null 2>&1 || true
          rm -rf .runtime env.local
