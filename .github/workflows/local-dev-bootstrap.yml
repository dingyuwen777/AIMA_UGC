name: Local Dev Bootstrap

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-analysis-capability-docs:
    name: Temporary sync Analysis capability docs
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/analysis-runtime-capability' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/analysis-runtime-capability

      - name: Update formal Blueprint and runtime docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          bp = Path('docs/blueprint/04-后端任务API与前端.md')
          text = bp.read_text(encoding='utf-8')
          old = '''### 5.3 Content / 声音广场 / Analysis

```text
GET  /api/v1/contents
GET  /api/v1/contents/{content_id}
POST /api/v1/content-analysis-requests
GET  /api/v1/content-analysis-jobs/{job_id}
```

代码：

```text
backend/src/aima_ugc/bootstrap/content_http.py
backend/src/aima_ugc/adapters/persistence/postgres/content_queries.py
backend/src/aima_ugc/adapters/persistence/postgres/analysis.py
```

`POST /content-analysis-requests` 会先冻结 Content ID + `current_version`，再创建 `analysis.content-label.v1` Job。Worker 分析的不是“未来可能变化的查询结果”，而是请求创建时冻结的目标版本。
'''
          new = '''### 5.3 Content / 声音广场 / Analysis

```text
GET  /api/v1/contents
GET  /api/v1/contents/{content_id}
GET  /api/v1/content-analysis-capabilities
POST /api/v1/content-analysis-requests
GET  /api/v1/content-analysis-jobs/{job_id}
```

代码：

```text
backend/src/aima_ugc/contracts/runtime.py
backend/src/aima_ugc/bootstrap/analysis_capability_http.py
backend/src/aima_ugc/bootstrap/content_http.py
backend/src/aima_ugc/adapters/persistence/postgres/content_queries.py
backend/src/aima_ugc/adapters/persistence/postgres/analysis.py
```

`GET /content-analysis-capabilities` 是安全只读运行能力投影，只返回 `configured`。它用于让声音广场在 LLM Base URL / Model / Secret 未形成可执行配置时明确提示并禁用 AI 打标；前端不得读取 `env.local`、Secret 文件或复制后端配置判断。该接口不返回 Base URL、Model、Provider、Secret 路径或 API Key，也不证明外部 LLM 此刻在线；Worker 的执行时配置守卫仍是最终防线。

`POST /content-analysis-requests` 会先冻结 Content ID + `current_version`，再创建 `analysis.content-label.v1` Job。Worker 分析的不是“未来可能变化的查询结果”，而是请求创建时冻结的目标版本。
'''
          if old not in text:
              raise SystemExit('Blueprint target block not found')
          bp.write_text(text.replace(old, new, 1), encoding='utf-8')

          runtime = Path('docs/环境运行与部署.md')
          text = runtime.read_text(encoding='utf-8')
          old = '''如果只填了一部分 LLM 配置，Backend 会显示 Warning，并把 AI 视为未配置；不会让一组半完成配置污染正式 Worker Runtime。

Import 和普通 TikHub Collection 不会因为 LLM 配置存在就自动发起 AI 付费调用。只有用户在声音广场显式创建 AI Analysis Job 才调用模型。
'''
          new = '''如果只填了一部分 LLM 配置，Backend 会显示 Warning，并把 AI 视为未配置；不会让一组半完成配置污染正式 Worker Runtime。

声音广场同时通过正式 `GET /api/v1/content-analysis-capabilities` 读取安全布尔能力：

```text
configured=false
→ 页面提示当前环境未配置可用 LLM Runtime
→ AI 打标按钮 disabled
→ 不创建注定失败的 Analysis Job

configured=true
→ 保持现有 selected/query Analysis Job 流程
```

这个 HTTP 能力只返回 `configured`，不会把 `env.local`、Base URL、Model、Secret 路径或 API Key 发给浏览器；它也不替代 Worker 对运行配置的最终校验。

Import 和普通 TikHub Collection 不会因为 LLM 配置存在就自动发起 AI 付费调用。只有用户在声音广场显式创建 AI Analysis Job 才调用模型。
'''
          if old not in text:
              raise SystemExit('Runtime target block not found')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git add docs/blueprint/04-后端任务API与前端.md docs/环境运行与部署.md
          if git diff --cached --quiet; then
            echo 'Docs already synchronized.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m '同步 AI Runtime Capability 架构与运行文档'
          git push origin HEAD:feature/analysis-runtime-capability

  launcher-cross-platform:
    name: Launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0

      - name: Validate cross-platform launchers
        run: |
          python scripts/dev/backend.py --validate-only
          python scripts/dev/frontend.py --validate-only
          python -m py_compile scripts/dev/backend.py scripts/dev/frontend.py scripts/dev/local_runtime.py

      - name: Prepare frontend dependencies through canonical launcher
        run: python scripts/dev/frontend.py --prepare-only

      - name: Verify local config stays untracked
        run: >-
          python -c "import subprocess; out=subprocess.check_output(['git','status','--porcelain'], text=True).strip(); assert not out, out"

  postgres-bootstrap-smoke:
    name: PostgreSQL bootstrap smoke
    runs-on: ubuntu-24.04
    env:
      AIMA_DATA_DIR: .runtime/data
      AIMA_LOG_DIR: .runtime/logs
      AIMA_SECRET_DIR: .runtime/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Prepare local config with non-production fixture key
        shell: bash
        run: |
          cat > env.local <<'EOF'
          AIMA_TIKHUB_BASE_URL=https://api.tikhub.io
          AIMA_TIKHUB_API_KEY=local-bootstrap-fixture-key
          AIMA_LLM_BASE_URL=
          AIMA_LLM_PROVIDER_NAME=
          AIMA_LLM_MODEL=
          AIMA_LLM_API_KEY=
          AIMA_DEV_ENABLE_SCHEDULER=false
          EOF

      - name: Run real PostgreSQL bootstrap and migration
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/dev/backend.py --prepare-only
          test -s .runtime/secrets/postgres_password
          test -s .runtime/secrets/import_batch_cursor_signing_key
          test -s .runtime/secrets/content_cursor_signing_key
          test -s .runtime/secrets/collection_runtime_cursor_signing_key
          test "$(cat .runtime/secrets/tikhub_api_key)" = "local-bootstrap-fixture-key"
          uv run alembic current
          uv run alembic check

      - name: Verify Provider Config stores only secret reference
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from aima_ugc.adapters.persistence.postgres.system import PostgresProviderConfigRepository
          from aima_ugc.platform.config import load_settings
          from aima_ugc.platform.database import DatabaseRuntime

          runtime = DatabaseRuntime(load_settings())
          try:
              session = runtime.new_session()
              try:
                  with session.begin():
                      configs = PostgresProviderConfigRepository(session).list_enabled()
              finally:
                  session.close()
          finally:
              runtime.dispose()

          matches = [item for item in configs if item.display_name == "TikHub Local Dev"]
          assert len(matches) == 1, matches
          config = matches[0]
          assert config.provider == "tikhub"
          assert config.base_url == "https://api.tikhub.io"
          assert config.secret_ref == "tikhub_api_key"
          assert "local-bootstrap-fixture-key" not in repr(config)
          PY

      - name: Clean local bootstrap resources
        if: always()
        shell: bash
        run: |
          docker rm -f aima-ugc-postgres-dev >/dev/null 2>&1 || true
          docker volume rm aima-ugc-postgres-dev-data >/dev/null 2>&1 || true
          rm -rf .runtime env.local
