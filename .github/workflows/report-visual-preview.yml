name: Report visual preview

on:
  push:
    branches:
      - fix/report-visual-fidelity

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - name: Install report preview dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk libreoffice-writer poppler-utils
          python -m pip install uv==0.12.3
          uv sync --locked
      - name: Generate representative report
        run: |
          uv run python - <<'PY'
          from datetime import date, timedelta
          from pathlib import Path

          from openpyxl import Workbook
          from aima_ugc.platform.reporting import generate_excel_report

          target = Path('preview')
          target.mkdir(exist_ok=True)
          source = target / 'labeled_data.xlsx'
          workbook = Workbook()
          content = workbook.active
          content.title = '内容'
          content.append(('平台', '发布时间', '命中关键词', '情感标签', '一级标签', '二级标签'))
          labels = workbook.create_sheet('标签明细')
          labels.append(('平台', '情感标签', '一级标签', '二级标签'))
          comments = workbook.create_sheet('评论')
          comments.append(('平台',))

          platforms = ('douyin', 'xiaohongshu', 'kuaishou', 'weibo', 'bilibili')
          primary = (
              '品牌评价', '价格与价值', '外观设计', '销售与购买体验', '骑行性能',
              '电池、续航与充电', '智能化与电子功能', '售后服务', '耐用性与质量',
          )
          primary_bucket = (
              [primary[0]] * 58 + [primary[1]] * 11 + [primary[2]] * 9 + [primary[3]] * 6
              + [primary[4]] * 6 + [primary[5]] * 5 + [primary[6]] * 2
              + [primary[7]] * 2 + [primary[8]]
          )
          secondary = (
              '营销与传播', '购车优惠与促销政策', '整体造型与颜值', '实际续航表现',
              '口碑与信任', '门店与渠道便利性', '推荐与购买意愿', '形象与定位',
              '外观风格与适配人群', '颜色与配色', '舒适性', '操控与稳定性',
              '偏好与转换', '交付与提车体验', '动力与加速表现', '购车价格与配置价值',
              '配件供应与维修成本', '智能解锁与启动', '性价比与价格竞争力',
              '智能辅助功能', '制动与刹车表现', 'App 与智能互联', '下单与交易流程',
              '长期使用与寿命表现', '故障问题与稳定性', '售后网点与服务便利性',
              '做工与装配质量', '性价比与溢价', '仪表与信息显示', '电池寿命与衰减',
              '销售服务与购车咨询', '使用与养护成本', '维修处理效率与质量',
              '保修政策与执行', '充电体验', '电池安全', '客服与服务态度',
              '系统稳定性与功能体验', '投诉处理与用户权益',
          )
          secondary_bucket = (
              [secondary[0]] * 47 + [secondary[1]] * 9 + [secondary[2]] * 5
              + [secondary[3]] * 4 + [secondary[4]] * 4 + [secondary[5]] * 3
              + [secondary[6]] * 3 + [secondary[7]] * 3 + [secondary[8]] * 2
              + [secondary[9]] * 2 + list(secondary[10:28])
          )
          models = (
              '黑翼 S3 60', '元宇宙 Pony', '墩墩', 'A50', '元宇宙 Space L', '元宇宙 Play',
              '元宇宙 Oi', 'AIMA', '仰望 A5', '美乐', '领航官 A511', '小宝莉', '爱玛 A3',
              '罗兰 PRO', 'M 豆 Air', '喜爱 Pro', 'F30', '墩墩联名', '元宇宙 Mix2.0', '猎鹰',
              '风火轮', '马赫 V7', 'F20', '马赫 U5', '皓影 Pro', 'A5ProA580',
              'LumiAir 时尚版', '马赫 U3', '露娜 2024Air', '卫士 AB51', '领航官 2025',
              'F2Lite 碟刹', 'F30 微酷', '仰望 A5Z', '凌骏 FB52', '小金豆 B13',
              '小金豆 B22', '猎骑 FB56', '猎骑 S1z', '猎鲨 S18', '酷骑 S 碟刹', 'FX3Pro',
              'M 豆 AirTFT 版', '优悦 Q505', '元宇宙 Play 联名', '酷骑 Pro', '猎风',
              '罗兰 Air', '马赫 S1max', 'LumiPro 时尚版', '小宝莉时尚版', '酷迈 26 碟刹',
              '酷领 25Pro', '马赫 U7Pro',
          )
          start = date(2026, 8, 13)
          for index in range(1400):
              day = start + timedelta(days=index % 7)
              p = index % 100
              platform = (
                  platforms[0] if p < 69 else platforms[1] if p < 84 else
                  platforms[2] if p < 97 else platforms[3] if p < 99 else platforms[4]
              )
              s = (index * 7) % 100
              sentiment = '中性' if s < 65 else '正面' if s < 98 else '负面' if s < 99 else '混合'
              primary_label = primary_bucket[(index * 13) % len(primary_bucket)]
              secondary_label = secondary_bucket[(index * 17) % len(secondary_bucket)]
              model = models[(index * 19) % len(models)]
              keywords = f'爱玛；{model}'
              row = (
                  platform,
                  f'{day.isoformat()} 10:{index % 60:02d}:00',
                  keywords,
                  sentiment,
                  primary_label,
                  secondary_label,
              )
              content.append(row)
              labels.append((platform, sentiment, primary_label, secondary_label))
          workbook.save(source)
          workbook.close()

          generate_excel_report(input_path=source, output_dir=target / 'reports')
          PY
      - name: Render DOCX with LibreOffice
        run: |
          mkdir -p preview/rendered
          libreoffice --headless --convert-to pdf --outdir preview/rendered preview/reports/report.docx
          pdfinfo preview/rendered/report.pdf > preview/rendered/pdfinfo.txt
          pdftoppm -png -r 115 preview/rendered/report.pdf preview/rendered/page
      - name: Package preview
        run: |
          tar -czf report-visual-preview.tar.gz \
            preview/reports/report.md \
            preview/reports/report.docx \
            preview/reports/assets \
            preview/rendered
      - uses: actions/upload-artifact@v4
        with:
          name: report-visual-preview
          path: report-visual-preview.tar.gz
          if-no-files-found: error
