name: Runtime Acceptance
run-name: >-
  Runtime evidence head=${{ github.event.pull_request.head.sha || github.sha }} base=${{ github.event.pull_request.base.sha || github.event.before }} merge=${{ github.sha }} lane=${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'full' }}

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  push:
    branches:
      - main
  schedule:
    - cron: "0 19 * * 0"

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: runtime-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose-golden-path:
    name: Compose Golden Path
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify actual PR merge checkout
        if: github.event_name == 'pull_request'
        shell: bash
        run: >-
          python3 scripts/quality/verify_pr_baseline.py --verify-checkout
          --head "${{ github.event.pull_request.head.sha }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --merge "${GITHUB_SHA}"

      - name: Verify metadata Runtime baseline
        id: metadata
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.action == 'edited' && !github.event.changes.base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 360); do
            set +e
            python3 scripts/quality/verify_pr_baseline.py \
              --head "${{ github.event.pull_request.head.sha }}" \
              --base "${{ github.event.pull_request.base.sha }}" \
              --merge "${GITHUB_SHA}" \
              --require "Runtime Acceptance:Compose Golden Path"
            baseline_status=$?
            set -e
            case "${baseline_status}" in
              0) echo "reusable=true" >> "${GITHUB_OUTPUT}"; exit 0 ;;
              75) sleep 5 ;;
              *) exit "${baseline_status}" ;;
            esac
          done
          echo "Timed out waiting for current HEAD/base/merge Runtime evidence." >&2
          exit 1

      - name: Resolve reusable Runtime evidence on main
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          resolver_output="${RUNNER_TEMP}/runtime-main-evidence.outputs"
          : > "${resolver_output}"
          if python3 scripts/quality/resolve_main_evidence.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --required-check "Compose Golden Path" \
            --github-output "${resolver_output}"; then
            cat "${resolver_output}" >> "${GITHUB_OUTPUT}"
          else
            resolver_status=$?
            {
              echo "reusable=false"
              echo "reason=resolver_execution_failed"
              echo "source_pr="
              echo "source_head="
              echo "current_tree="
              echo "source_tree="
            } >> "${GITHUB_OUTPUT}"
            echo "::warning::Runtime evidence resolver failed; falling back to real Runtime validation (exit=${resolver_status})"
          fi

      - name: Classify shared Runtime responsibility
        id: scope
        if: steps.metadata.outputs.reusable != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_EVENT_NAME}" == "release" ]]; then
            python3 scripts/quality/classify_ci_scope.py --full --github-output "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            python3 scripts/quality/classify_ci_scope.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --github-output "${GITHUB_OUTPUT}"
          else
            python3 scripts/quality/classify_ci_scope.py --comparison direct --base "${{ github.event.before }}" --head "${GITHUB_SHA}" --github-output "${GITHUB_OUTPUT}"
          fi

      - name: Lightweight source and template preflight
        if: steps.metadata.outputs.reusable != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/check_docs.py
          python3 scripts/quality/check_docs_facts.py
          python3 scripts/quality/scan_secrets.py
          python3 scripts/quality/check_env_templates.py --static

      - name: Block Draft required evidence
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        shell: bash
        run: |
          echo "Draft PR does not produce merge-ready Runtime evidence. Mark it ready for review to run final Runtime acceptance." >&2
          exit 1

      - name: Verify PR requirement and readiness before expensive validation
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/check_pr_requirement_source.py --event "${GITHUB_EVENT_PATH}" --root .
          python3 scripts/quality/check_change_completion.py --root . --changed-since "${{ github.event.pull_request.base.sha }}"

      - name: Setup template validation Python
        if: steps.scope.outputs.configuration_required == 'true'
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Validate template configuration packaging and Compose
        if: steps.scope.outputs.configuration_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv==$(tr -d '\r\n' < .uv-version)"
          uv sync --locked
          uv run python scripts/quality/check_env_templates.py --compose

      - name: Reuse merged PR Runtime evidence
        if: steps.reuse.outputs.reusable == 'true'
        shell: bash
        run: echo "Compose Golden Path evidence is reused from the final merged PR because both revisions have the same Git tree."

      - name: Fast-path unchanged Runtime
        if: steps.metadata.outputs.reusable != 'true' && steps.reuse.outputs.reusable != 'true' && steps.scope.outputs.runtime_required != 'true'
        shell: bash
        run: echo "No Runtime-relevant changes detected; configuration/template evidence is validated before this fast path."

      - name: Prepare canonical Runtime env
        if: steps.metadata.outputs.reusable != 'true' && steps.reuse.outputs.reusable != 'true' && steps.scope.outputs.runtime_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/aima-runtime"
          ENV_FILE="${RUNNER_TEMP}/aima-runtime.env"
          mkdir -p "${ROOT}/historical-input"
          echo "AIMA_RUNTIME_ROOT=${ROOT}" >> "${GITHUB_ENV}"
          echo "AIMA_RUNTIME_ENV_FILE=${ENV_FILE}" >> "${GITHUB_ENV}"
          cat > "${ENV_FILE}" <<EOF
          AIMA_IDENTITY_MODE=development
          AIMA_IMAGE_TAG=runtime-ci-${GITHUB_RUN_ID}
          AIMA_HTTP_BIND_IP=127.0.0.1
          AIMA_HTTP_PORT=18080
          AIMA_HOST_ROOT=${ROOT}
          AIMA_HISTORICAL_IMPORT_HOST_ROOT=${ROOT}/historical-input
          AIMA_DB_NAME=aima_ugc
          AIMA_DB_USER=aima_ugc
          AIMA_DB_CONNECT_TIMEOUT_SECONDS=5
          AIMA_LOG_LEVEL=INFO
          AIMA_LOG_MAX_BYTES=1048576
          AIMA_LOG_BACKUP_COUNT=2
          AIMA_LOG_COMPRESS=true
          AIMA_TIKHUB_ENABLED=true
          AIMA_TIKHUB_BASE_URL=https://api.tikhub.io
          AIMA_TIKHUB_API_KEY=ci-placeholder-not-a-real-provider-secret
          AIMA_LLM_API_KEY=
          AIMA_BUILD_DEBIAN_MIRROR=http://deb.debian.org/debian
          AIMA_BUILD_DEBIAN_SECURITY_MIRROR=http://deb.debian.org/debian-security
          AIMA_BUILD_PYPI_INDEX=https://pypi.org/simple
          AIMA_BUILD_NPM_REGISTRY=https://registry.npmjs.org
          EOF
          chmod 0600 "${ENV_FILE}"

      - name: Validate canonical Compose topology
        if: steps.metadata.outputs.reusable != 'true' && steps.reuse.outputs.reusable != 'true' && steps.scope.outputs.runtime_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker compose version
          docker compose --env-file "${AIMA_RUNTIME_ENV_FILE}" config > "${RUNNER_TEMP}/compose.rendered.yaml"
          SERVICES="$(docker compose --env-file "${AIMA_RUNTIME_ENV_FILE}" config --services)"
          for service in bootstrap frontend api worker scheduler migrate postgres configure; do
            grep -Fxq "${service}" <<<"${SERVICES}"
          done
          if grep -Fq 'ci-placeholder-not-a-real-provider-secret' "${RUNNER_TEMP}/compose.rendered.yaml"; then
            echo "Compose config exposed the secret value"
            exit 1
          fi

      - name: Canonical Compose startup, security, persistence, and recovery
        if: steps.metadata.outputs.reusable != 'true' && steps.reuse.outputs.reusable != 'true' && steps.scope.outputs.runtime_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          compose() {
            docker compose --env-file "${AIMA_RUNTIME_ENV_FILE}" "$@"
          }
          cleanup() {
            status=$?
            if [[ $status -ne 0 ]]; then
              compose ps -a || true
              compose logs --no-color || true
            fi
            compose down --remove-orphans || true
            exit $status
          }
          trap cleanup EXIT

          # 首次真实运行保留正式管理员入口，构建镜像一次；后续生命周期与 Windows overlay 全部复用同一镜像。
          compose up -d --build --wait

          # 报告 Renderer 的 CJK 字体必须存在于正式 Backend 镜像，而不是依赖 Runner 宿主。
          compose exec -T worker python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from PIL import Image

          from aima_ugc.platform.reporting.visuals.wordcloud import (
              render_wordcloud_png,
              resolve_cjk_bold_font,
              resolve_cjk_font,
          )

          regular = resolve_cjk_font()
          bold = resolve_cjk_bold_font(regular)
          assert regular.is_file(), regular
          assert bold.is_file(), bold
          with TemporaryDirectory() as directory:
              output = Path(directory) / "cjk-smoke.png"
              render_wordcloud_png({"爱玛": 10, "续航": 6}, output)
              assert output.stat().st_size > 0
              with Image.open(output) as image:
                  image.verify()
          PY

          BOOTSTRAP_CONTAINER="$(compose ps -a -q bootstrap)"
          MIGRATE_CONTAINER="$(compose ps -a -q migrate)"
          CONFIGURE_CONTAINER="$(compose ps -a -q configure)"
          test "$(docker inspect -f '{{.State.Status}}' "${BOOTSTRAP_CONTAINER}")" = "exited"
          test "$(docker inspect -f '{{.State.ExitCode}}' "${BOOTSTRAP_CONTAINER}")" = "0"
          test "$(docker inspect -f '{{.State.ExitCode}}' "${MIGRATE_CONTAINER}")" = "0"
          test "$(docker inspect -f '{{.State.ExitCode}}' "${CONFIGURE_CONTAINER}")" = "0"

          curl -fsS http://127.0.0.1:18080/health/ready > "${RUNNER_TEMP}/ready.json"
          python3 - "${RUNNER_TEMP}/ready.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload == {
              "status": "ok",
              "checks": {
                  "database": "ok",
                  "artifact_store": "ok",
                  "log_directory": "ok",
              },
          }
          PY
          curl -fsS http://127.0.0.1:18080/ >/dev/null

          PROVIDER_ROW="$(compose exec -T postgres psql -U aima_ugc -d aima_ugc -Atc \
            "SELECT provider || '|' || secret_ref || '|' || enabled::text FROM provider_configs WHERE display_name = 'TikHub Internal V1';")"
          test "${PROVIDER_ROW}" = "tikhub|tikhub_api_key|true"
          PROVIDER_JSON="$(compose exec -T postgres psql -U aima_ugc -d aima_ugc -Atc \
            "SELECT row_to_json(p)::text FROM provider_configs p;")"
          if grep -Fq 'ci-placeholder-not-a-real-provider-secret' <<<"${PROVIDER_JSON}"; then
            echo "Provider Secret leaked into provider_configs"
            exit 1
          fi

          sudo test ! -e "${AIMA_RUNTIME_ROOT}/shared/secrets/tikhub_api_key"
          sudo test ! -e "${AIMA_RUNTIME_ROOT}/shared/secrets/llm_api_key"
          sudo test -s "${AIMA_RUNTIME_ROOT}/shared/provider-secrets/tikhub_api_key"
          test "$(sudo stat -c '%u:%g:%a' "${AIMA_RUNTIME_ROOT}/shared/provider-secrets/tikhub_api_key")" = "10001:10001:600"
          compose exec -T worker sh -ec \
            'test "$(cat /run/provider-secrets/tikhub_api_key)" = "ci-placeholder-not-a-real-provider-secret"'
          compose exec -T api sh -ec \
            'test "$(cat /run/provider-secrets/tikhub_api_key)" = "ci-placeholder-not-a-real-provider-secret"'
          compose exec -T worker test ! -e /run/secrets/tikhub_api_key
          compose exec -T api test ! -e /run/secrets/tikhub_api_key
          PROVIDER_SECRET_HASH_BEFORE="$(sudo sha256sum "${AIMA_RUNTIME_ROOT}/shared/provider-secrets/tikhub_api_key" | cut -d' ' -f1)"

          # 通过正式管理员 API 轮换 TikHub 配置；新配置必须无需重启立即写入 DB/Secret Store。
          PROVIDER_ID="$(compose exec -T postgres psql -U aima_ugc -d aima_ugc -Atc \
            "SELECT id FROM provider_configs WHERE display_name = 'TikHub Internal V1';")"
          cat > "${RUNNER_TEMP}/provider-update.json" <<'JSON'
          {
            "display_name": "TikHub Internal V1",
            "base_url": "https://api.tikhub.dev",
            "model": null,
            "api_key": "ci-rotated-provider-secret-not-real",
            "timeout_seconds": 52,
            "max_retries": 4,
            "max_concurrency": 6,
            "max_rps": 2,
            "enabled": true,
            "is_default": false
          }
          JSON
          curl -fsS \
            -X PUT \
            -H 'Content-Type: application/json' \
            --data-binary @"${RUNNER_TEMP}/provider-update.json" \
            "http://127.0.0.1:18080/api/v1/provider-configs/${PROVIDER_ID}" \
            > "${RUNNER_TEMP}/provider-update-response.json"
          python3 - "${RUNNER_TEMP}/provider-update-response.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["provider_kind"] == "collection"
          assert payload["provider"] == "tikhub"
          assert payload["base_url"] == "https://api.tikhub.dev"
          assert payload["timeout_seconds"] == 52
          assert payload["max_retries"] == 4
          assert payload["max_concurrency"] == 6
          assert payload["max_rps"] == 2
          assert payload["revision"] == 2
          assert payload["secret_configured"] is True
          assert "api_key" not in payload
          assert "secret_ref" not in payload
          PY
          PROVIDER_RUNTIME_ROW="$(compose exec -T postgres psql -U aima_ugc -d aima_ugc -Atc \
            "SELECT base_url || '|' || secret_ref || '|' || timeout_seconds || '|' || max_retries || '|' || max_concurrency || '|' || max_rps || '|' || revision FROM provider_configs WHERE id = '${PROVIDER_ID}';")"
          IFS='|' read -r ROTATED_BASE_URL ROTATED_SECRET_REF ROTATED_TIMEOUT ROTATED_RETRIES ROTATED_CONCURRENCY ROTATED_RPS ROTATED_REVISION <<<"${PROVIDER_RUNTIME_ROW}"
          test "${ROTATED_BASE_URL}" = "https://api.tikhub.dev"
          test "${ROTATED_TIMEOUT}" = "52"
          test "${ROTATED_RETRIES}" = "4"
          test "${ROTATED_CONCURRENCY}" = "6"
          test "${ROTATED_RPS}" = "2"
          test "${ROTATED_REVISION}" = "2"
          test "${ROTATED_SECRET_REF}" != "tikhub_api_key"
          sudo test -s "${AIMA_RUNTIME_ROOT}/shared/provider-secrets/${ROTATED_SECRET_REF}"
          test "$(sudo stat -c '%u:%g:%a' "${AIMA_RUNTIME_ROOT}/shared/provider-secrets/${ROTATED_SECRET_REF}")" = "10001:10001:600"
          test "$(sudo cat "${AIMA_RUNTIME_ROOT}/shared/provider-secrets/${ROTATED_SECRET_REF}")" = "ci-rotated-provider-secret-not-real"
          compose exec -T worker sh -ec \
            "test \"\$(cat /run/provider-secrets/${ROTATED_SECRET_REF})\" = \"ci-rotated-provider-secret-not-real\""
          PROVIDER_JSON_AFTER_ROTATION="$(compose exec -T postgres psql -U aima_ugc -d aima_ugc -Atc \
            "SELECT row_to_json(p)::text FROM provider_configs p WHERE id = '${PROVIDER_ID}';")"
          if grep -Fq 'ci-rotated-provider-secret-not-real' <<<"${PROVIDER_JSON_AFTER_ROTATION}"; then
            echo "Rotated Provider Secret leaked into provider_configs"
            exit 1
          fi
          if grep -Fq 'ci-rotated-provider-secret-not-real' "${RUNNER_TEMP}/provider-update-response.json"; then
            echo "Rotated Provider Secret leaked into API response"
            exit 1
          fi
          ROTATED_SECRET_HASH_BEFORE="$(sudo sha256sum "${AIMA_RUNTIME_ROOT}/shared/provider-secrets/${ROTATED_SECRET_REF}" | cut -d' ' -f1)"

          API_CONTAINER="$(compose ps -q api)"
          WORKER_CONTAINER="$(compose ps -q worker)"
          POSTGRES_CONTAINER="$(compose ps -q postgres)"
          FRONTEND_CONTAINER="$(compose ps -q frontend)"
          python3 - "${API_CONTAINER}" "${WORKER_CONTAINER}" "${POSTGRES_CONTAINER}" "${FRONTEND_CONTAINER}" "${AIMA_RUNTIME_ROOT}" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          api_id, worker_id, postgres_id, frontend_id, root = (
              sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], Path(sys.argv[5])
          )

          def inspect(container_id: str) -> dict:
              return json.loads(subprocess.check_output(["docker", "inspect", container_id], text=True))[0]

          api = inspect(api_id)
          worker = inspect(worker_id)
          for container in (api, worker):
              environment = container["Config"]["Env"] or []
              assert not any(item.startswith("AIMA_TIKHUB_API_KEY=") for item in environment)
              assert not any(item.startswith("AIMA_LLM_API_KEY=") for item in environment)
              assert not any("ci-placeholder-not-a-real-provider-secret" in item for item in environment)

          mounts = {item["Destination"]: item for item in api["Mounts"]}
          expected = {
              "/app/data": (root / "runtime/data", True),
              "/app/logs": (root / "runtime/logs", True),
              "/run/internal-secrets": (root / "shared/secrets", False),
              "/data/aima-historical-input": (root / "historical-input", False),
              "/run/provider-secrets": (root / "shared/provider-secrets", True),
          }
          for destination, (source, writable) in expected.items():
              actual = mounts[destination]
              assert actual["Type"] == "bind"
              assert Path(actual["Source"]).resolve() == source.resolve()
              assert actual["RW"] is writable

          worker_mounts = {item["Destination"]: item for item in worker["Mounts"]}
          worker_provider_secrets = worker_mounts["/run/provider-secrets"]
          assert worker_provider_secrets["Type"] == "bind"
          assert Path(worker_provider_secrets["Source"]).resolve() == (root / "shared/provider-secrets").resolve()
          assert worker_provider_secrets["RW"] is False

          postgres_mounts = {item["Destination"]: item for item in inspect(postgres_id)["Mounts"]}
          postgres_secrets = postgres_mounts["/run/secrets"]
          assert postgres_secrets["Type"] == "bind"
          assert Path(postgres_secrets["Source"]).resolve() == (root / "shared/secrets").resolve()
          assert postgres_secrets["RW"] is False

          api_bindings = api["HostConfig"]["PortBindings"] or {}
          postgres_bindings = inspect(postgres_id)["HostConfig"]["PortBindings"] or {}
          frontend_bindings = inspect(frontend_id)["HostConfig"]["PortBindings"] or {}
          assert postgres_bindings == {}
          assert api_bindings == {}
          assert frontend_bindings == {
              "8080/tcp": [{"HostIp": "127.0.0.1", "HostPort": "18080"}]
          }
          PY

          API_UID="$(compose exec -T api id -u | tr -d '\r')"
          FRONTEND_UID="$(compose exec -T frontend id -u | tr -d '\r')"
          test "${API_UID}" = "10001"
          test "${FRONTEND_UID}" != "0"
          compose exec -T api test -r /run/internal-secrets/postgres_password

          for name in postgres_password import_batch_cursor_signing_key content_cursor_signing_key collection_runtime_cursor_signing_key; do
            sudo test -s "${AIMA_RUNTIME_ROOT}/shared/secrets/${name}"
            test "$(sudo stat -c '%u:%g:%a' "${AIMA_RUNTIME_ROOT}/shared/secrets/${name}")" = "0:11001:440"
          done
          PASSWORD_HASH_BEFORE="$(sudo sha256sum "${AIMA_RUNTIME_ROOT}/shared/secrets/postgres_password" | cut -d' ' -f1)"
          IMPORT_KEY_HASH_BEFORE="$(sudo sha256sum "${AIMA_RUNTIME_ROOT}/shared/secrets/import_batch_cursor_signing_key" | cut -d' ' -f1)"

          compose exec -T api sh -c 'printf persistence > /app/data/compose-startup-marker'

          # 重复启动证明 Runtime 幂等与 Secret 稳定；镜像已在首次正式入口构建，无需再次 build。
          compose up -d --no-build --wait
          PASSWORD_HASH_AFTER="$(sudo sha256sum "${AIMA_RUNTIME_ROOT}/shared/secrets/postgres_password" | cut -d' ' -f1)"
          IMPORT_KEY_HASH_AFTER="$(sudo sha256sum "${AIMA_RUNTIME_ROOT}/shared/secrets/import_batch_cursor_signing_key" | cut -d' ' -f1)"
          test "${PASSWORD_HASH_BEFORE}" = "${PASSWORD_HASH_AFTER}"
          test "${IMPORT_KEY_HASH_BEFORE}" = "${IMPORT_KEY_HASH_AFTER}"
          PROVIDER_COUNT="$(compose exec -T postgres psql -U aima_ugc -d aima_ugc -Atc \
            "SELECT count(*) FROM provider_configs WHERE display_name = 'TikHub Internal V1';")"
          test "${PROVIDER_COUNT}" = "1"
          # configure 再次执行也不得用 `.env` 把管理员保存的 DB Provider 配置覆盖回去。
          PROVIDER_RUNTIME_ROW_AFTER_RESTART="$(compose exec -T postgres psql -U aima_ugc -d aima_ugc -Atc \
            "SELECT base_url || '|' || secret_ref || '|' || timeout_seconds || '|' || max_retries || '|' || max_concurrency || '|' || max_rps || '|' || revision FROM provider_configs WHERE id = '${PROVIDER_ID}';")"
          test "${PROVIDER_RUNTIME_ROW_AFTER_RESTART}" = "${PROVIDER_RUNTIME_ROW}"
          test "$(sudo sha256sum "${AIMA_RUNTIME_ROOT}/shared/provider-secrets/${ROTATED_SECRET_REF}" | cut -d' ' -f1)" = "${ROTATED_SECRET_HASH_BEFORE}"
          test "$(sudo sha256sum "${AIMA_RUNTIME_ROOT}/shared/provider-secrets/tikhub_api_key" | cut -d' ' -f1)" = "${PROVIDER_SECRET_HASH_BEFORE}"
          compose exec -T api sh -ec 'test "$(cat /app/data/compose-startup-marker)" = persistence'

          compose down --remove-orphans
          sudo mv "${AIMA_RUNTIME_ROOT}/shared/secrets/postgres_password" "${RUNNER_TEMP}/postgres_password.backup"
          set +e
          compose up -d --no-build --wait --wait-timeout 15 bootstrap
          LOST_SECRET_STATUS=$?
          set -e
          test "${LOST_SECRET_STATUS}" -ne 0
          compose logs --no-color bootstrap > "${RUNNER_TEMP}/bootstrap-missing-secret.log" || true
          grep -Fq '已有 PostgreSQL 18 数据' "${RUNNER_TEMP}/bootstrap-missing-secret.log"
          grep -Fq 'postgres_password' "${RUNNER_TEMP}/bootstrap-missing-secret.log"
          sudo test ! -e "${AIMA_RUNTIME_ROOT}/shared/secrets/postgres_password"
          compose down --remove-orphans || true

          sudo mv "${RUNNER_TEMP}/postgres_password.backup" "${AIMA_RUNTIME_ROOT}/shared/secrets/postgres_password"
          sudo chown 0:11001 "${AIMA_RUNTIME_ROOT}/shared/secrets/postgres_password"
          sudo chmod 0440 "${AIMA_RUNTIME_ROOT}/shared/secrets/postgres_password"

          compose up -d --no-build --wait
          curl -fsS http://127.0.0.1:18080/health/ready >/dev/null
          compose exec -T api sh -ec 'test "$(cat /app/data/compose-startup-marker)" = persistence'
          PROVIDER_COUNT="$(compose exec -T postgres psql -U aima_ugc -d aima_ugc -Atc \
            "SELECT count(*) FROM provider_configs WHERE display_name = 'TikHub Internal V1';")"
          test "${PROVIDER_COUNT}" = "1"
          PROVIDER_RUNTIME_ROW_AFTER_RECOVERY="$(compose exec -T postgres psql -U aima_ugc -d aima_ugc -Atc \
            "SELECT base_url || '|' || secret_ref || '|' || timeout_seconds || '|' || max_retries || '|' || max_concurrency || '|' || max_rps || '|' || revision FROM provider_configs WHERE id = '${PROVIDER_ID}';")"
          test "${PROVIDER_RUNTIME_ROW_AFTER_RECOVERY}" = "${PROVIDER_RUNTIME_ROW}"
          test "$(sudo sha256sum "${AIMA_RUNTIME_ROOT}/shared/provider-secrets/${ROTATED_SECRET_REF}" | cut -d' ' -f1)" = "${ROTATED_SECRET_HASH_BEFORE}"
          test "$(sudo sha256sum "${AIMA_RUNTIME_ROOT}/shared/secrets/postgres_password" | cut -d' ' -f1)" = "${PASSWORD_HASH_BEFORE}"
          sudo test -s "${AIMA_RUNTIME_ROOT}/runtime/logs/api.log"
          sudo test -d "${AIMA_RUNTIME_ROOT}/postgres/18/docker"

          compose down --remove-orphans
          trap - EXIT

      - name: Repository-relative host root smoke
        if: steps.metadata.outputs.reusable != 'true' && steps.reuse.outputs.reusable != 'true' && steps.scope.outputs.runtime_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_ROOT=".runtime/compose-ci-${GITHUB_RUN_ID}"
          LOCAL_ROOT_ABS="${GITHUB_WORKSPACE}/${LOCAL_ROOT#./}"
          LOCAL_ENV_FILE="${RUNNER_TEMP}/aima-local-compose.env"
          mkdir -p "${LOCAL_ROOT_ABS}/historical-input"
          cat > "${LOCAL_ENV_FILE}" <<EOF
          AIMA_IDENTITY_MODE=development
          AIMA_IMAGE_TAG=runtime-ci-${GITHUB_RUN_ID}
          AIMA_HTTP_BIND_IP=127.0.0.1
          AIMA_HTTP_PORT=18081
          AIMA_HOST_ROOT=./${LOCAL_ROOT}
          AIMA_HISTORICAL_IMPORT_HOST_ROOT=./${LOCAL_ROOT}/historical-input
          AIMA_DB_NAME=aima_ugc
          AIMA_DB_USER=aima_ugc
          AIMA_DB_CONNECT_TIMEOUT_SECONDS=5
          AIMA_LOG_LEVEL=INFO
          AIMA_LOG_MAX_BYTES=1048576
          AIMA_LOG_BACKUP_COUNT=2
          AIMA_LOG_COMPRESS=true
          AIMA_TIKHUB_ENABLED=false
          AIMA_TIKHUB_BASE_URL=https://api.tikhub.io
          AIMA_TIKHUB_API_KEY=
          AIMA_LLM_API_KEY=
          AIMA_BUILD_DEBIAN_MIRROR=http://deb.debian.org/debian
          AIMA_BUILD_DEBIAN_SECURITY_MIRROR=http://deb.debian.org/debian-security
          AIMA_BUILD_PYPI_INDEX=https://pypi.org/simple
          AIMA_BUILD_NPM_REGISTRY=https://registry.npmjs.org
          EOF
          chmod 0600 "${LOCAL_ENV_FILE}"

          cleanup_local() {
            status=$?
            if [[ $status -ne 0 ]]; then
              docker compose --env-file "${LOCAL_ENV_FILE}" ps -a || true
              docker compose --env-file "${LOCAL_ENV_FILE}" logs --no-color || true
            fi
            docker compose --env-file "${LOCAL_ENV_FILE}" down --remove-orphans || true
            sudo rm -rf "${LOCAL_ROOT_ABS}" || true
            exit $status
          }
          trap cleanup_local EXIT

          git check-ignore -q "${LOCAL_ROOT}/probe"
          docker compose --env-file "${LOCAL_ENV_FILE}" config --format json > "${RUNNER_TEMP}/compose.local.json"
          python3 - "${RUNNER_TEMP}/compose.local.json" "${LOCAL_ROOT_ABS}" <<'PY'
          import json
          import sys
          from pathlib import Path

          model = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          root = Path(sys.argv[2]).resolve()
          expected = {
              "api": {
                  "/app/data": root / "runtime/data",
                  "/app/logs": root / "runtime/logs",
                  "/run/internal-secrets": root / "shared/secrets",
                  "/data/aima-historical-input": root / "historical-input",
              },
              "postgres": {
                  "/var/lib/postgresql": root / "postgres",
                  "/run/secrets": root / "shared/secrets",
              },
          }
          for service, destinations in expected.items():
              mounts = {
                  item["target"]: Path(item["source"]).resolve()
                  for item in model["services"][service]["volumes"]
                  if item["type"] == "bind"
              }
              for destination, source in destinations.items():
                  assert mounts[destination] == source.resolve()
          PY

          docker compose --env-file "${LOCAL_ENV_FILE}" up -d --no-build --wait
          curl -fsS http://127.0.0.1:18081/health/ready >/dev/null
          docker compose --env-file "${LOCAL_ENV_FILE}" exec -T api sh -ec \
            'printf local-root-persistence > /app/data/local-root-marker'
          test "$(sudo cat "${LOCAL_ROOT_ABS}/runtime/data/local-root-marker")" = "local-root-persistence"
          sudo test -s "${LOCAL_ROOT_ABS}/shared/secrets/postgres_password"
          sudo test -d "${LOCAL_ROOT_ABS}/postgres/18/docker"

      - name: Prepare Windows overlay Runtime env
        if: steps.metadata.outputs.reusable != 'true' && steps.reuse.outputs.reusable != 'true' && steps.scope.outputs.runtime_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE="${RUNNER_TEMP}/aima-windows-compose.env"
          HOST_ROOT="${RUNNER_TEMP}/windows-host-root"
          mkdir -p "${HOST_ROOT}/historical-input"
          echo "AIMA_WINDOWS_ENV_FILE=${ENV_FILE}" >> "${GITHUB_ENV}"
          echo "AIMA_WINDOWS_HOST_ROOT=${HOST_ROOT}" >> "${GITHUB_ENV}"
          cat > "${ENV_FILE}" <<EOF
          AIMA_IDENTITY_MODE=development
          AIMA_IMAGE_TAG=runtime-ci-${GITHUB_RUN_ID}
          AIMA_HTTP_BIND_IP=127.0.0.1
          AIMA_HTTP_PORT=18082
          AIMA_HOST_ROOT=${HOST_ROOT}
          AIMA_HISTORICAL_IMPORT_HOST_ROOT=${HOST_ROOT}/historical-input
          AIMA_DB_NAME=aima_ugc
          AIMA_DB_USER=aima_ugc
          AIMA_DB_CONNECT_TIMEOUT_SECONDS=5
          AIMA_LOG_LEVEL=INFO
          AIMA_LOG_MAX_BYTES=1048576
          AIMA_LOG_BACKUP_COUNT=2
          AIMA_LOG_COMPRESS=true
          AIMA_TIKHUB_ENABLED=false
          AIMA_TIKHUB_BASE_URL=https://api.tikhub.io
          AIMA_TIKHUB_API_KEY=
          AIMA_LLM_API_KEY=
          AIMA_BUILD_DEBIAN_MIRROR=http://deb.debian.org/debian
          AIMA_BUILD_DEBIAN_SECURITY_MIRROR=http://deb.debian.org/debian-security
          AIMA_BUILD_PYPI_INDEX=https://pypi.org/simple
          AIMA_BUILD_NPM_REGISTRY=https://registry.npmjs.org
          EOF
          chmod 0600 "${ENV_FILE}"

      - name: Validate Windows overlay storage model
        if: steps.metadata.outputs.reusable != 'true' && steps.reuse.outputs.reusable != 'true' && steps.scope.outputs.runtime_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            -f compose.yaml \
            -f compose.windows.yaml \
            --env-file "${AIMA_WINDOWS_ENV_FILE}" \
            config --format json > "${RUNNER_TEMP}/compose.windows.json"

          python3 - "${RUNNER_TEMP}/compose.windows.json" "${AIMA_WINDOWS_HOST_ROOT}" <<'PY'
          import json
          import sys
          from pathlib import Path

          model = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          host_root = Path(sys.argv[2]).resolve()
          expected = {
              "bootstrap": {
                  "/host/runtime/wisersone-auth": "bind",
                  "/host/aima-historical-input/wisersone": "bind",
                  "/host/runtime/data": "bind",
                  "/host/runtime/logs": "bind",
                  "/host/postgres": "volume",
                  "/host/shared/secrets": "volume",
                  "/host/shared/provider-secrets": "volume",
              },
              "postgres": {
                  "/var/lib/postgresql": "volume",
                  "/run/secrets": "volume",
              },
              "migrate": {
                  "/run/wisersone-input": "bind",
                  "/app/data": "bind",
                  "/app/logs": "bind",
                  "/run/internal-secrets": "volume",
                  "/data/aima-historical-input": "bind",
              },
              "configure": {
                  "/app/data": "bind",
                  "/app/logs": "bind",
                  "/run/internal-secrets": "volume",
                  "/data/aima-historical-input": "bind",
                  "/run/provider-secrets": "volume",
              },
              "api": {
                  "/run/wisersone-auth": "bind",
                  "/run/wisersone-input": "bind",
                  "/app/data": "bind",
                  "/app/logs": "bind",
                  "/run/internal-secrets": "volume",
                  "/data/aima-historical-input": "bind",
                  "/run/provider-secrets": "volume",
              },
              "worker": {
                  "/run/wisersone-auth": "bind",
                  "/run/wisersone-input": "bind",
                  "/app/data": "bind",
                  "/app/logs": "bind",
                  "/run/internal-secrets": "volume",
                  "/data/aima-historical-input": "bind",
                  "/run/provider-secrets": "volume",
              },
              "scheduler": {
                  "/run/wisersone-input": "bind",
                  "/app/data": "bind",
                  "/app/logs": "bind",
                  "/run/internal-secrets": "volume",
                  "/data/aima-historical-input": "bind",
              },
          }
          for service, targets in expected.items():
              mounts = {item["target"]: item for item in model["services"][service].get("volumes", [])}
              assert set(mounts) == set(targets), (service, mounts)
              for target, mount_type in targets.items():
                  assert mounts[target]["type"] == mount_type, (service, target, mounts[target])

          expected_bind_sources = {
              "/run/wisersone-auth": str(host_root / "runtime/wisersone-auth"),
              "/run/wisersone-input": str(host_root / "aima-historical-input/wisersone"),
              "/app/data": str(host_root / "runtime/data"),
              "/app/logs": str(host_root / "runtime/logs"),
              "/data/aima-historical-input": str(host_root / "historical-input"),
          }
          api_mounts = {item["target"]: item for item in model["services"]["api"].get("volumes", [])}
          for target, source in expected_bind_sources.items():
              assert Path(api_mounts[target]["source"]).resolve() == Path(source), (target, api_mounts[target])
          assert api_mounts["/data/aima-historical-input"]["read_only"] is True
          assert api_mounts["/run/wisersone-auth"]["read_only"] is True
          assert api_mounts["/run/wisersone-input"]["read_only"] is True
          worker_mounts = {item["target"]: item for item in model["services"]["worker"].get("volumes", [])}
          for target in ("/run/wisersone-auth", "/run/wisersone-input"):
              assert worker_mounts[target]["type"] == "bind"
              assert worker_mounts[target]["source"] == api_mounts[target]["source"]
              assert worker_mounts[target].get("read_only", False) is False
          scheduler_mounts = {item["target"]: item for item in model["services"]["scheduler"].get("volumes", [])}
          assert scheduler_mounts["/run/wisersone-input"]["source"] == api_mounts["/run/wisersone-input"]["source"]
          assert scheduler_mounts["/run/wisersone-input"].get("read_only", False) is False

          bootstrap_command = model["services"]["bootstrap"]["command"]
          assert "--runtime-only" in bootstrap_command
          assert "--runtime-bind-compatible" in bootstrap_command
          assert {"windows_postgres", "windows_internal_secrets", "windows_provider_secrets"}.issubset(model["volumes"])
          assert "windows_runtime_data" not in model["volumes"]
          assert "windows_runtime_logs" not in model["volumes"]
          PY

      - name: Windows overlay startup, permissions, host visibility, and restart persistence
        if: steps.metadata.outputs.reusable != 'true' && steps.reuse.outputs.reusable != 'true' && steps.scope.outputs.runtime_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          compose() {
            docker compose \
              -f compose.yaml \
              -f compose.windows.yaml \
              --env-file "${AIMA_WINDOWS_ENV_FILE}" "$@"
          }
          cleanup() {
            status=$?
            if [[ $status -ne 0 ]]; then
              compose ps -a || true
              compose logs --no-color || true
            fi
            compose down -v --remove-orphans || true
            sudo rm -rf "${AIMA_WINDOWS_HOST_ROOT}" || true
            exit $status
          }
          trap cleanup EXIT

          # Windows overlay 复用 canonical Runtime 已构建镜像，只验证 storage/runtime 差异。
          compose up -d --no-build --wait
          curl -fsS http://127.0.0.1:18082/health/ready >/dev/null

          API_CONTAINER="$(compose ps -q api)"
          WORKER_CONTAINER="$(compose ps -q worker)"
          POSTGRES_CONTAINER="$(compose ps -q postgres)"
          python3 - "${API_CONTAINER}" "${WORKER_CONTAINER}" "${POSTGRES_CONTAINER}" "${AIMA_WINDOWS_HOST_ROOT}" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          api_id, worker_id, postgres_id, host_root_raw = sys.argv[1:]
          host_root = Path(host_root_raw).resolve()

          def mounts(container_id: str) -> dict[str, dict]:
              container = json.loads(subprocess.check_output(["docker", "inspect", container_id], text=True))[0]
              return {item["Destination"]: item for item in container["Mounts"]}

          api_mounts = mounts(api_id)
          assert api_mounts["/app/data"]["Type"] == "bind"
          assert api_mounts["/app/data"]["RW"] is True
          assert Path(api_mounts["/app/data"]["Source"]).resolve() == host_root / "runtime/data"
          assert api_mounts["/app/logs"]["Type"] == "bind"
          assert api_mounts["/app/logs"]["RW"] is True
          assert Path(api_mounts["/app/logs"]["Source"]).resolve() == host_root / "runtime/logs"
          assert api_mounts["/run/internal-secrets"]["Type"] == "volume"
          assert api_mounts["/run/internal-secrets"]["RW"] is False
          assert api_mounts["/run/provider-secrets"]["Type"] == "volume"
          assert api_mounts["/run/provider-secrets"]["RW"] is True
          worker_mounts = mounts(worker_id)
          assert worker_mounts["/run/provider-secrets"]["Type"] == "volume"
          assert worker_mounts["/run/provider-secrets"]["RW"] is False

          postgres_mounts = mounts(postgres_id)
          assert postgres_mounts["/var/lib/postgresql"]["Type"] == "volume"
          assert postgres_mounts["/var/lib/postgresql"]["RW"] is True
          assert postgres_mounts["/run/secrets"]["Type"] == "volume"
          assert postgres_mounts["/run/secrets"]["RW"] is False
          PY

          test "$(compose exec -T api stat -c '%u:%g:%a' /run/internal-secrets/postgres_password | tr -d '\r')" = "0:11001:440"
          sudo test -f "${AIMA_WINDOWS_HOST_ROOT}/runtime/logs/api.log"
          sudo find "${AIMA_WINDOWS_HOST_ROOT}/runtime/logs" -maxdepth 1 -type f -name 'worker-*.log' -print -quit | grep -q .
          sudo test -f "${AIMA_WINDOWS_HOST_ROOT}/runtime/logs/scheduler.log"

          compose exec -T api sh -ec 'printf windows-host-persistence > /app/data/windows-host-marker'
          test "$(sudo cat "${AIMA_WINDOWS_HOST_ROOT}/runtime/data/windows-host-marker")" = "windows-host-persistence"
          PASSWORD_HASH_BEFORE="$(compose exec -T api sha256sum /run/internal-secrets/postgres_password | awk '{print $1}' | tr -d '\r')"
          compose exec -T postgres psql -U aima_ugc -d aima_ugc -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE ci_windows_hybrid_marker(value text PRIMARY KEY); INSERT INTO ci_windows_hybrid_marker VALUES ('persisted');"

          compose down --remove-orphans
          test "$(sudo cat "${AIMA_WINDOWS_HOST_ROOT}/runtime/data/windows-host-marker")" = "windows-host-persistence"
          sudo test -f "${AIMA_WINDOWS_HOST_ROOT}/runtime/logs/api.log"

          compose up -d --no-build --wait
          curl -fsS http://127.0.0.1:18082/health/ready >/dev/null
          compose exec -T api sh -ec 'test "$(cat /app/data/windows-host-marker)" = windows-host-persistence'
          PASSWORD_HASH_AFTER="$(compose exec -T api sha256sum /run/internal-secrets/postgres_password | awk '{print $1}' | tr -d '\r')"
          test "${PASSWORD_HASH_BEFORE}" = "${PASSWORD_HASH_AFTER}"
          DB_MARKER="$(compose exec -T postgres psql -U aima_ugc -d aima_ugc -Atc "SELECT value FROM ci_windows_hybrid_marker;" | tr -d '\r')"
          test "${DB_MARKER}" = "persisted"

          compose down -v --remove-orphans
          test "$(sudo cat "${AIMA_WINDOWS_HOST_ROOT}/runtime/data/windows-host-marker")" = "windows-host-persistence"
          sudo test -f "${AIMA_WINDOWS_HOST_ROOT}/runtime/logs/api.log"
          trap - EXIT

      - name: Clean canonical Runtime data
        if: always() && env.AIMA_RUNTIME_ROOT != ''
        shell: bash
        run: |
          docker compose --env-file "${AIMA_RUNTIME_ENV_FILE}" down --remove-orphans >/dev/null 2>&1 || true
          sudo rm -rf "${AIMA_RUNTIME_ROOT}" || true
