name: Temporary Excel Follower Red

on:
  push:
    branches:
      - feature/excel-follower-count

permissions:
  contents: read

jobs:
  postgres-red:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/tmp-excel-follower/data
      AIMA_LOG_DIR: .runtime/tmp-excel-follower/logs
      AIMA_SECRET_DIR: .runtime/tmp-excel-follower/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Prepare PostgreSQL runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'ci-postgres' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"
          uv run alembic upgrade head
      - name: Run targeted Red
        run: uv run pytest tests/integration/content/test_excel_follower_count_voice_plaza.py -q
