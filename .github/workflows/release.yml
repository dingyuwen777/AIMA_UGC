name: Release

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Release {0} from latest main', inputs.version)
      || github.event_name == 'release'
      && format('Release {0} from published GitHub Release', github.event.release.tag_name)
      || format('Release dry-run for PR #{0}', github.event.pull_request.number) }}

# Release 只有两种正式模式，并保留 PR dry-run：
# 1. pull_request：只读 dry-run。验证构建、离线 Bundle 和真实 Compose 回放，不发布任何版本。
# 2. workflow_dispatch / GitHub Release published：用户手工正式发布。正式候选始终显式从发布时最新 main 构建；
#    Release Tag 必须精确指向该 main SHA，否则 fail closed，绝不移动历史版本 Tag。
#
# 本地与 GitHub Release 共用 scripts/release/release_bundle.py 的 Bundle 核心实现；
# GitHub Runner 显式使用 official build-source profile，本地 PowerShell 默认使用 china profile。
# build-verify 永远只有读权限；publish-release 才拥有最小发布写权限。
# publish-release 不 checkout 源码，只消费已经回放过的候选 Artifact 及随候选传递的同 revision Release 工具。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "正式版本号，例如 v2.0.0"
        required: true
        type: string
  release:
    types:
      - published
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - compose.yaml
      - compose.windows.yaml
      - env.production.example
      - scripts/release/release_bundle.py
      - scripts/deploy/start_compose.py
      - scripts/deploy/stop_compose.py
      - scripts/deploy/reset_keep_vehicle_catalog.sh
      - scripts/release/build_local_release.ps1
      - tests/unit/test_docker_build_sources.py
      - tests/unit/test_release_workflow.py
      - tests/unit/test_release_bundle.py
      - tests/unit/test_compose_auto_scripts.py

permissions:
  contents: read

concurrency:
  group: aima-ugc-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  POSTGRES_IMAGE: postgres:18.4
  BACKEND_IMAGE: ghcr.io/dingyuwen777/aima-ugc-backend
  FRONTEND_IMAGE: ghcr.io/dingyuwen777/aima-ugc-frontend
  PACKAGE_OWNER: dingyuwen777
  BACKEND_PACKAGE: aima-ugc-backend
  FRONTEND_PACKAGE: aima-ugc-frontend

jobs:
  build-verify:
    name: Build and replay offline candidate
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      checks: read
      packages: read
    env:
      GH_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.identity.outputs.version }}
      release_sha: ${{ steps.identity.outputs.release_sha }}
      candidate_artifact: ${{ steps.identity.outputs.candidate_artifact }}

    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Resolve release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="dryrun-pr-${{ github.event.pull_request.number }}-${RELEASE_SHA:0:12}"
          fi
          CANDIDATE_ARTIFACT="release-candidate-${VERSION}-${RELEASE_SHA:0:12}"
          {
            echo "RELEASE_SHA=${RELEASE_SHA}"
            echo "VERSION=${VERSION}"
          } >> "${GITHUB_ENV}"
          {
            echo "release_sha=${RELEASE_SHA}"
            echo "version=${VERSION}"
            echo "candidate_artifact=${CANDIDATE_ARTIFACT}"
          } >> "${GITHUB_OUTPUT}"
          echo "Release candidate: version=${VERSION}, sha=${RELEASE_SHA}"

      - name: Verify GitHub CLI explicit repository context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TEMP_DIR="${RUNNER_TEMP}/release-gh-context-${GITHUB_RUN_ID}"
          mkdir -p "${TEMP_DIR}"
          (
            cd "${TEMP_DIR}"
            resolved="$(gh repo view "${GH_REPO}" --json nameWithOwner --jq '.nameWithOwner')"
            if [[ "${resolved}" != "${GH_REPO}" ]]; then
              echo "GitHub CLI repository context mismatch: ${resolved}" >&2
              exit 1
            fi
          )
          echo "GitHub CLI repository context works without a local .git directory."

      - name: Validate formal release request
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "版本号必须使用 vMAJOR.MINOR.PATCH，例如 v2.0.0 或 v2.0.1。" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "Actions 手工发布只能从 main 分支触发；当前 ref=${GITHUB_REF}" >&2
              exit 1
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            if [[ "${GITHUB_REF}" != "refs/tags/${VERSION}" ]]; then
              echo "Release 发布事件与版本身份不一致：ref=${GITHUB_REF}, version=${VERSION}" >&2
              exit 1
            fi
          else
            echo "正式 Release 不支持当前事件：${GITHUB_EVENT_NAME}" >&2
            exit 1
          fi

          CURRENT_MAIN_SHA="$(gh api "/repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${CURRENT_MAIN_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "发布开始时 checkout 的候选已不是远端 main 最新 SHA，拒绝发布。" >&2
            exit 1
          fi

          TAG_REF_JSON="${RUNNER_TEMP}/release-tag-ref.json"
          TAG_REF_ERROR="${RUNNER_TEMP}/release-tag-ref.error"
          if gh api "/repos/${GH_REPO}/git/ref/tags/${VERSION}" >"${TAG_REF_JSON}" 2>"${TAG_REF_ERROR}"; then
            TAG_TARGET="$(gh api "/repos/${GH_REPO}/commits/${VERSION}" --jq '.sha')"
            if [[ "${TAG_TARGET}" != "${RELEASE_SHA}" ]]; then
              echo "Git Tag ${VERSION} 未指向发布时最新 main：${TAG_TARGET}；拒绝发布且不会移动 Tag。" >&2
              exit 1
            fi
            echo "复用已指向发布时最新 main 的 Git Tag ${VERSION}。"
          elif grep -Fq "HTTP 404" "${TAG_REF_ERROR}"; then
            if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
              echo "Release 发布事件要求 Git Tag ${VERSION} 已存在并指向发布时最新 main。" >&2
              exit 1
            fi
          else
            cat "${TAG_REF_ERROR}" >&2
            echo "无法确认 Git Tag ${VERSION} 是否存在，拒绝继续发布。" >&2
            exit 1
          fi

          RELEASE_EXISTS=false
          RELEASE_REF_JSON="${RUNNER_TEMP}/release-ref.json"
          RELEASE_REF_ERROR="${RUNNER_TEMP}/release-ref.error"
          if gh api "/repos/${GH_REPO}/releases/tags/${VERSION}" >"${RELEASE_REF_JSON}" 2>"${RELEASE_REF_ERROR}"; then
            RELEASE_EXISTS=true
          elif ! grep -Fq "HTTP 404" "${RELEASE_REF_ERROR}"; then
            cat "${RELEASE_REF_ERROR}" >&2
            echo "无法确认 GitHub Release ${VERSION} 是否存在，拒绝继续发布。" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "release" && "${RELEASE_EXISTS}" != "true" ]]; then
            echo "Release 发布事件要求 GitHub Release ${VERSION} 已存在。" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${RELEASE_EXISTS}" == "true" ]]; then
            echo "Actions 手工发布要求版本尚未存在 GitHub Release：${VERSION}" >&2
            exit 1
          fi

      - name: Verify GHCR packages are private
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for package_name in "${BACKEND_PACKAGE}" "${FRONTEND_PACKAGE}"; do
            visibility="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/users/${PACKAGE_OWNER}/packages/container/${package_name}" \
                --jq '.visibility'
            )"
            echo "GHCR ${PACKAGE_OWNER}/${package_name}: visibility=${visibility}"
            if [[ "${visibility}" != "private" ]]; then
              echo "Safety gate: refuse to publish a non-private GHCR package: ${package_name} visibility=${visibility}" >&2
              exit 1
            fi
          done

      - name: Resolve required main CI evidence
        if: github.event_name != 'pull_request'
        id: ci_evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GH_REPO}/commits/${RELEASE_SHA}/check-runs?per_page=100" \
            > "${RUNNER_TEMP}/release-check-runs.json"
          python3 scripts/quality/release_evidence.py resolve \
            --root . \
            --release-sha "${RELEASE_SHA}" \
            --check-runs-file "${RUNNER_TEMP}/release-check-runs.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Verify required main CI gates
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_SHA: ${{ steps.ci_evidence.outputs.evidence_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GH_REPO}/commits/${EVIDENCE_SHA}/check-runs?per_page=100" \
            > "${RUNNER_TEMP}/release-evidence-check-runs.json"
          python3 scripts/quality/release_evidence.py verify \
            --check-runs-file "${RUNNER_TEMP}/release-evidence-check-runs.json"
          echo "Release SHA ${RELEASE_SHA} uses required-check evidence from ${EVIDENCE_SHA}."

      - name: Build replay-tested Linux AMD64 release bundle
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_ARCHIVE="${RUNNER_TEMP}/AIMA_UGC-${VERSION}-deploy.tar.gz"
          # Canonical Compose smoke 会在宿主 bind 目录产生 PostgreSQL root/container-owned 文件；
          # Hosted Runner 用 root 执行共享 Builder，完成后立即把候选产物归还 runner 用户。
          sudo -E python3 scripts/release/release_bundle.py build \
            --root . \
            --version "${VERSION}" \
            --source-profile official \
            --builder-context github-actions \
            --git-sha "${RELEASE_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --bundle-dir release-bundle \
            --archive-path "${CANDIDATE_ARCHIVE}" \
            --verify \
            --strict-replay
          sudo chown -R "$(id -u):$(id -g)" release-bundle
          sudo chown "$(id -u):$(id -g)" "${CANDIDATE_ARCHIVE}"
          python3 scripts/release/release_bundle.py verify \
            --bundle-dir release-bundle \
            --expected-version "${VERSION}" \
            --expected-git-sha "${RELEASE_SHA}" \
            --expected-profile official \
            --require-offline-replay \
            --require-strict-replay

      - name: Prepare compressed release candidate transfer
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          TRANSFER_DIR="release-transfer"
          CANDIDATE_ARCHIVE="${RUNNER_TEMP}/AIMA_UGC-${VERSION}-deploy.tar.gz"
          mkdir -p "${TRANSFER_DIR}/scripts/release"
          cp "${CANDIDATE_ARCHIVE}" "${TRANSFER_DIR}/candidate.tar.gz"
          cp scripts/release/release_bundle.py "${TRANSFER_DIR}/scripts/release/release_bundle.py"
          gzip -t "${TRANSFER_DIR}/candidate.tar.gz"
          ls -lh "${TRANSFER_DIR}/candidate.tar.gz"

      - name: Upload replay-tested release candidate
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.candidate_artifact }}
          path: release-transfer/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Report dry-run result
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          echo "Release dry-run succeeded for ${VERSION}."
          echo "Verified: private GHCR packages, official-source build, offline Bundle and canonical Compose replay."
          echo "No GHCR push, Git Tag, GitHub Release or repository write token was used."

  publish-release:
    name: Publish replay-tested candidate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    needs: build-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build-verify.outputs.version }}
      RELEASE_SHA: ${{ needs.build-verify.outputs.release_sha }}

    steps:
      - name: Revalidate publication target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(gh repo view "${GH_REPO}" --json nameWithOwner --jq '.nameWithOwner')"
          if [[ "${resolved}" != "${GH_REPO}" ]]; then
            echo "GitHub CLI repository context mismatch: ${resolved}" >&2
            exit 1
          fi

          CURRENT_MAIN_SHA="$(gh api "/repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${CURRENT_MAIN_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "构建完成后 main 已前进；拒绝把旧候选发布为当前版本。" >&2
            exit 1
          fi

          TAG_REF_JSON="${RUNNER_TEMP}/publish-tag-ref.json"
          TAG_REF_ERROR="${RUNNER_TEMP}/publish-tag-ref.error"
          if gh api "/repos/${GH_REPO}/git/ref/tags/${VERSION}" >"${TAG_REF_JSON}" 2>"${TAG_REF_ERROR}"; then
            TAG_TARGET="$(gh api "/repos/${GH_REPO}/commits/${VERSION}" --jq '.sha')"
            if [[ "${TAG_TARGET}" != "${RELEASE_SHA}" ]]; then
              echo "Git Tag ${VERSION} 已存在但未指向已回放候选：${TAG_TARGET}" >&2
              exit 1
            fi
            echo "发布阶段复用已验证 Tag ${VERSION}。"
          elif grep -Fq "HTTP 404" "${TAG_REF_ERROR}"; then
            if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
              echo "Release 发布阶段要求 Git Tag ${VERSION} 仍存在并指向已回放候选。" >&2
              exit 1
            fi
          else
            cat "${TAG_REF_ERROR}" >&2
            echo "无法重新确认 Git Tag ${VERSION} 是否存在，拒绝发布。" >&2
            exit 1
          fi

          RELEASE_EXISTS=false
          RELEASE_REF_JSON="${RUNNER_TEMP}/publish-release-ref.json"
          RELEASE_REF_ERROR="${RUNNER_TEMP}/publish-release-ref.error"
          if gh api "/repos/${GH_REPO}/releases/tags/${VERSION}" >"${RELEASE_REF_JSON}" 2>"${RELEASE_REF_ERROR}"; then
            RELEASE_EXISTS=true
          elif ! grep -Fq "HTTP 404" "${RELEASE_REF_ERROR}"; then
            cat "${RELEASE_REF_ERROR}" >&2
            echo "无法重新确认 GitHub Release ${VERSION} 是否存在，拒绝发布。" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "release" && "${RELEASE_EXISTS}" != "true" ]]; then
            echo "Release 发布阶段要求 GitHub Release ${VERSION} 仍存在。" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${RELEASE_EXISTS}" == "true" ]]; then
            echo "Actions 手工发布阶段发现同名 GitHub Release 已存在：${VERSION}" >&2
            exit 1
          fi

      - name: Revalidate private GHCR packages before push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for package_name in "${BACKEND_PACKAGE}" "${FRONTEND_PACKAGE}"; do
            visibility="$(gh api "/users/${PACKAGE_OWNER}/packages/container/${package_name}" --jq '.visibility')"
            if [[ "${visibility}" != "private" ]]; then
              echo "Published GHCR package is no longer private: ${package_name} visibility=${visibility}" >&2
              exit 1
            fi
          done

      - name: Download replay-tested candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-verify.outputs.candidate_artifact }}
          path: release-candidate

      - name: Verify transferred candidate
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TOOL="release-candidate/scripts/release/release_bundle.py"
          TRANSFER_ARCHIVE="release-candidate/candidate.tar.gz"
          BUNDLE_DIR="release-candidate/release-bundle"
          test -s "${TRANSFER_ARCHIVE}"
          test -s "${RELEASE_TOOL}"
          gzip -t "${TRANSFER_ARCHIVE}"
          mkdir -p "${BUNDLE_DIR}"
          tar -xzf "${TRANSFER_ARCHIVE}" -C "${BUNDLE_DIR}"
          test -s "${BUNDLE_DIR}/images.tar"
          python3 "${RELEASE_TOOL}" verify \
            --bundle-dir "${BUNDLE_DIR}" \
            --expected-version "${VERSION}" \
            --expected-git-sha "${RELEASE_SHA}" \
            --expected-profile official \
            --require-offline-replay \
            --require-strict-replay

      - name: Load and tag exact replay-tested images
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="release-candidate/release-bundle"
          docker load -i "${BUNDLE_DIR}/images.tar"
          BACKEND_ID="$(docker image inspect -f '{{.Id}}' "aima-ugc-backend:${VERSION}")"
          FRONTEND_ID="$(docker image inspect -f '{{.Id}}' "aima-ugc-frontend:${VERSION}")"
          docker tag "aima-ugc-backend:${VERSION}" "${BACKEND_IMAGE}:${VERSION}"
          docker tag "aima-ugc-backend:${VERSION}" "${BACKEND_IMAGE}:sha-${RELEASE_SHA}"
          docker tag "aima-ugc-frontend:${VERSION}" "${FRONTEND_IMAGE}:${VERSION}"
          docker tag "aima-ugc-frontend:${VERSION}" "${FRONTEND_IMAGE}:sha-${RELEASE_SHA}"
          {
            echo "BACKEND_ID=${BACKEND_ID}"
            echo "FRONTEND_ID=${FRONTEND_ID}"
          } >> "${GITHUB_ENV}"

      - name: Publish private application images to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${BACKEND_IMAGE}:${VERSION}"
          docker push "${BACKEND_IMAGE}:sha-${RELEASE_SHA}"
          docker push "${FRONTEND_IMAGE}:${VERSION}"
          docker push "${FRONTEND_IMAGE}:sha-${RELEASE_SHA}"

          docker pull --platform linux/amd64 "${BACKEND_IMAGE}:${VERSION}"
          docker pull --platform linux/amd64 "${FRONTEND_IMAGE}:${VERSION}"
          test "$(docker image inspect -f '{{.Id}}' "${BACKEND_IMAGE}:${VERSION}")" = "${BACKEND_ID}"
          test "$(docker image inspect -f '{{.Id}}' "${FRONTEND_IMAGE}:${VERSION}")" = "${FRONTEND_ID}"

          BACKEND_REF="$(docker image inspect "${BACKEND_IMAGE}:${VERSION}" --format '{{json .RepoDigests}}' \
            | python3 -c 'import json,sys,os; values=json.load(sys.stdin); prefix=os.environ["BACKEND_IMAGE"]+"@sha256:"; print(next((v for v in values if v.startswith(prefix)), ""))')"
          FRONTEND_REF="$(docker image inspect "${FRONTEND_IMAGE}:${VERSION}" --format '{{json .RepoDigests}}' \
            | python3 -c 'import json,sys,os; values=json.load(sys.stdin); prefix=os.environ["FRONTEND_IMAGE"]+"@sha256:"; print(next((v for v in values if v.startswith(prefix)), ""))')"
          if [[ "${BACKEND_REF}" != "${BACKEND_IMAGE}@sha256:"* ]]; then
            echo "无法获得 Backend GHCR digest。" >&2
            exit 1
          fi
          if [[ "${FRONTEND_REF}" != "${FRONTEND_IMAGE}@sha256:"* ]]; then
            echo "无法获得 Frontend GHCR digest。" >&2
            exit 1
          fi
          {
            echo "BACKEND_REF=${BACKEND_REF}"
            echo "FRONTEND_REF=${FRONTEND_REF}"
          } >> "${GITHUB_ENV}"

      - name: Finalize published manifest and assets
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TOOL="release-candidate/scripts/release/release_bundle.py"
          BUNDLE_DIR="release-candidate/release-bundle"
          DEPLOY_ARCHIVE="AIMA_UGC-${VERSION}-deploy.tar.gz"
          python3 "${RELEASE_TOOL}" finalize \
            --bundle-dir "${BUNDLE_DIR}" \
            --archive-path "${DEPLOY_ARCHIVE}" \
            --backend-registry-ref "${BACKEND_REF}" \
            --frontend-registry-ref "${FRONTEND_REF}"

          cp "${BUNDLE_DIR}/release-manifest.json" release-manifest.json
          cp "${BUNDLE_DIR}/migration-manifest.json" migration-manifest.json
          sha256sum release-manifest.json migration-manifest.json "${DEPLOY_ARCHIVE}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          echo "DEPLOY_ARCHIVE=${DEPLOY_ARCHIVE}" >> "${GITHUB_ENV}"
          ls -lh "${DEPLOY_ARCHIVE}" release-manifest.json migration-manifest.json SHA256SUMS

      - name: Create Git tag and GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${VERSION}" \
            release-manifest.json \
            migration-manifest.json \
            SHA256SUMS \
            "${DEPLOY_ARCHIVE}" \
            --repo "${GH_REPO}" \
            --target "${RELEASE_SHA}" \
            --title "AIMA_UGC ${VERSION}" \
            --generate-notes

      - name: Upload assets to published GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${VERSION}" \
            release-manifest.json \
            migration-manifest.json \
            SHA256SUMS \
            "${DEPLOY_ARCHIVE}" \
            --repo "${GH_REPO}"

      - name: Verify published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$(gh release view "${VERSION}" --repo "${GH_REPO}" --json tagName --jq '.tagName')"
          if [[ "${release_tag}" != "${VERSION}" ]]; then
            echo "Published Release tag mismatch: ${release_tag}" >&2
            exit 1
          fi

          tag_target="$(gh api "/repos/${GH_REPO}/commits/${VERSION}" --jq '.sha')"
          if [[ "${tag_target}" != "${RELEASE_SHA}" ]]; then
            echo "Published Git tag target mismatch: ${tag_target}" >&2
            exit 1
          fi

          mapfile -t release_assets < <(
            gh release view "${VERSION}" --repo "${GH_REPO}" --json assets --jq '.assets[].name'
          )
          for expected_asset in \
            release-manifest.json \
            migration-manifest.json \
            SHA256SUMS \
            "${DEPLOY_ARCHIVE}"; do
            if ! printf '%s\n' "${release_assets[@]}" | grep -Fxq "${expected_asset}"; then
              echo "Published Release missing asset: ${expected_asset}" >&2
              exit 1
            fi
          done

          for package_name in "${BACKEND_PACKAGE}" "${FRONTEND_PACKAGE}"; do
            visibility="$(gh api "/users/${PACKAGE_OWNER}/packages/container/${package_name}" --jq '.visibility')"
            if [[ "${visibility}" != "private" ]]; then
              echo "Published GHCR package is no longer private: ${package_name} visibility=${visibility}" >&2
              exit 1
            fi
          done

          echo "Release ${VERSION} published and verified for ${RELEASE_SHA}."
