name: Temporary Ready Change

on:
  push:
    branches:
      - chore/agent-skills-project-governance

permissions:
  contents: write

jobs:
  ready:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: chore/agent-skills-project-governance
          fetch-depth: 0

      - name: Finalize active Change for Ready
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("changes/active/CHG-20260901-agent-skills-project-governance/CHANGE.md")
          text = path.read_text(encoding="utf-8")
          if text.count("status: in_progress") != 1:
              raise SystemExit("expected exactly one in_progress status")
          text = text.replace("status: in_progress", "status: ready_for_review", 1)

          if "  - scripts/quality/check_docs_facts.py\n" not in text:
              text = text.replace(
                  "  - scripts/quality/check_docs.py\n",
                  "  - scripts/quality/check_docs.py\n  - scripts/quality/check_docs_facts.py\n",
                  1,
              )
          if "  - tests/unit/test_docs_facts.py\n" not in text:
              text = text.replace(
                  "  - tests/unit/test_docs_navigation.py\n",
                  "  - tests/unit/test_docs_navigation.py\n  - tests/unit/test_docs_facts.py\n",
                  1,
              )

          success_start = text.index("# 成功标准")
          success_end = text.index("# 范围", success_start)
          success = text[success_start:success_end]
          success_lines = []
          for line in success.splitlines():
              if line.startswith("- [ ]") and "合并后 `main`" not in line and "Change 最终归档" not in line:
                  line = line.replace("- [ ]", "- [x]", 1)
              success_lines.append(line)
          text = text[:success_start] + "\n".join(success_lines) + "\n\n" + text[success_end:]

          evidence = {
              "R1": "PR #274 在 b9217cc8 的治理、文档与永久 CI 变更已落库；CI 33463204045、Completion Gate 33463204034、Full-stack 33463204036、Runtime 33463204099、Release dry-run 33463204038、Tooling 33463204060 全部 success。",
              "R2": "最终 AGENTS.md 保持项目事实优先；本轮重新读取目标项目规则与 Agent_Skills canonical Source Mode 入口后完成复核。",
              "R3": "AGENTS.md 只修改 managed block 外项目 Overlay；scripts/quality/check_agent_governance.py 与 tests/unit/test_agent_governance.py 固定 AIMA 自有接线，PR 不修改 installer-owned .agents 运行资产。",
              "R4": "docs/blueprint/01_总体架构与技术选型.md 已列当前八种生产 Job；check_docs_facts.py 从 bootstrap/worker.py 实际 register_* 装配动态发现 Job，CI 文档事实门禁 success。",
              "R5": ".github/workflows/change-completion-gate.yml 保留 ready_check.py 并用 AIMA 项目治理检查替代不存在的 supplier tests；final-shape run 33463204034 success。",
              "R6": "PR changed files 不包含 installer-owned .agents Runtime/manifest/managed asset；AGENTS managed block 未手工迁移，项目治理 gate success。",
              "R7": "本 PR 未修改产品实现、Contract、Schema/Migration、依赖或 Runtime 版本；generated contract drift、PostgreSQL Integration、Full-stack、Runtime 与 Release dry-run 均在 b9217cc8 成功。",
              "R8": "check_docs.py 已覆盖本地链接、未链接文件导航、纯文件/文件职责代码块和完整仓库相对路径标签；tests/unit/test_docs_navigation.py 回归存在，final CI 文档 gate success。",
              "R9": "check_docs_facts.py 对 OpenAPI、Schema、生产 Worker Job、永久 Workflow、前端 Route、TikHub Provider、版本、Analysis 与 Release 高置信事实持续校验；final CI 文档事实 gate success。",
          }
          trace_start = text.index("# Requirement Traceability")
          trace_end = text.index("# Validation Matrix", trace_start)
          trace = text[trace_start:trace_end]
          updated_trace = []
          for line in trace.splitlines():
              match = re.match(r"^\| (R\d+) \| (.*?) \| (.*?) \| (.*?) \| (.*?) \|$", line)
              if match and match.group(1) in evidence:
                  rid, requirement, source, _, _ = match.groups()
                  line = f"| {rid} | {requirement} | {source} | satisfied | {evidence[rid]} |"
              updated_trace.append(line)
          text = text[:trace_start] + "\n".join(updated_trace) + "\n\n" + text[trace_end:]

          audit_replacements = {
              "upstream_re_read": "已重新读取本轮用户确认的项目治理、全仓文件链接与文档事实一致性要求，并重新读取 AIMA AGENTS/Blueprint、当前机器 Owner、final-shape CI 与 Agent_Skills canonical Source Mode 规则。",
              "change_coverage": "A1 从上游要求反查 Change：项目 Overlay、Completion Gate 根因、supplier self-test Ownership、Runtime managed 边界、全当前文档链接和事实一致性均已进入 R1-R9，没有未批准遗漏或延期。",
              "reverse_audit": "A2 从实现反查证据：永久 Workflow 证明责任未收缩；check_docs/check_docs_facts/check_agent_governance 与 Unit 回归覆盖新增治理；Contract、PostgreSQL、Full-stack、Runtime、Release dry-run 交叉证明产品边界未被文档治理破坏。",
              "unresolved_cleared": "Ready 范围内 R1-R9 均为 satisfied，required 验证在 b9217cc8 有新鲜证据；仅合并后 main fresh CI 与 Change archive 保留为 post-merge 交付步骤，不冒充 Ready 前已完成。",
          }
          for item, description in audit_replacements.items():
              pattern = re.compile(rf"^- \[[ xX]\] {item}[：:].*$", re.MULTILINE)
              text, count = pattern.subn(f"- [x] {item}：{description}", text, count=1)
              if count != 1:
                  raise SystemExit(f"completion audit item not found exactly once: {item}")

          marker = "# 文档影响"
          final_evidence = (
              "- Ready 前 final-shape 证据：PR #274 `head@b9217cc8bd9f47f3d8a2d5fbf33431e8681397ad` 的 "
              "CI run `33463204045`、Change Completion Gate `33463204034`、Full-stack Acceptance `33463204036`、"
              "Runtime Acceptance `33463204099`、Release dry-run `33463204038`、Developer Tooling Compatibility `33463204060` "
              "均为 `success`；本次 Ready 元数据提交后仍需在新 HEAD 重新取得 fresh CI。\n\n"
              "## Ready 前独立复核摘要\n\n"
              "- Review A1：重新从用户要求和项目正式事实源构建完成定义，没有发现未进入当前 Change 的适用要求。\n"
              "- Review A2：实现、测试、文档与 Validation Matrix 对应；CI/Workflow 证明责任保持或增强，没有用文档/治理 gate 替代产品 Unit、Contract、PostgreSQL、Browser、Full-stack、Runtime 或 Release 证据。\n"
              "- 第二阶段质量复核：已修复生产 Job 事实源手写列表、仓库文件链接显示路径/同目录短文件解析等维护风险；当前没有剩余 BLOCKER/HIGH/MEDIUM Finding。\n"
              "- 未验证边界：真实生产服务器状态、Provider/LLM 当前额度、正式 Production Go-Live 不属于本 Change，继续按 Roadmap 维持未确认状态。\n\n"
          )
          if "Ready 前 final-shape 证据" not in text:
              text = text.replace(marker, final_evidence + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY

          python3 .agents/skills/coding/scripts/ready_check.py --root . --require-active-ready
          python3 scripts/quality/check_docs.py
          python3 scripts/quality/check_docs_facts.py
          python3 scripts/quality/check_agent_governance.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changes/active/CHG-20260901-agent-skills-project-governance/CHANGE.md
          git commit -m "完成治理Change Ready门禁"
          git push origin HEAD:chore/agent-skills-project-governance
