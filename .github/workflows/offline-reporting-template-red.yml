name: Offline Reporting Template Red

on:
  push:
    branches:
      - feature/offline-reporting
    paths-ignore:
      - changes/active/CHG-20260820-offline-reporting/template_red_evidence.json

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
      - name: Run expected-red test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          uv run pytest tests/unit/platform/test_reporting_default_template.py -q 2>&1 | tee /tmp/red.txt
      - name: Record red evidence
        if: always()
        env:
          OUTCOME: ${{ steps.test.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {
              "tested_sha": os.environ["GITHUB_SHA"],
              "outcome": os.environ["OUTCOME"],
              "tail": Path("/tmp/red.txt").read_text(encoding="utf-8", errors="replace").splitlines()[-16:],
          }
          path = Path("changes/active/CHG-20260820-offline-reporting/template_red_evidence.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- changes/active/CHG-20260820-offline-reporting/template_red_evidence.json
          git commit -m '测试：记录共享报告模板 Red 证据 [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          test "$OUTCOME" = "failure"
