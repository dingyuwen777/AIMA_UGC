name: Bootstrap Stage 3B schemas

on:
  push:
    branches:
      - feature/stage3b-canonical-v1

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage3b-canonical-v1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Generate committed Canonical schemas
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
          uv run python scripts/contracts/generate_canonical.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/canonical/*.schema.json
          git commit -m "生成 Canonical V1 JSON Schema"
          git push origin HEAD:feature/stage3b-canonical-v1
