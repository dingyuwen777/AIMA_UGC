name: Bootstrap Stage 3B schema cleanup

on:
  push:
    branches:
      - feature/stage3b-canonical-v1

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage3b-canonical-v1
      - name: Remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/bootstrap-stage3b-schemas.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "移除 Stage 3B 临时 Schema 工作流"
          git push origin HEAD:feature/stage3b-canonical-v1
