name: Stage 6 XHS Vertical Slice

on:
  push:
    branches:
      - feature/stage6-xhs-vertical-slice
  pull_request:
    branches:
      - main
    paths:
      - "backend/src/aima_ugc/adapters/providers/tikhub/**"
      - "backend/src/aima_ugc/modules/content/**"
      - "backend/src/aima_ugc/modules/collection/**"
      - "backend/src/aima_ugc/adapters/persistence/postgres/**"
      - "backend/src/aima_ugc/database_schema.py"
      - "migrations/**"
      - "tests/unit/collection/test_xhs_tikhub_*.py"
      - "tests/unit/content/**"
      - "tests/integration/content/**"
      - "tests/fixtures/providers/tikhub/xhs/**"
      - ".github/workflows/stage6-xhs-vertical-slice.yml"
      - "docs/blueprint/**"
      - "changes/**"

permissions:
  contents: read

jobs:
  unit:
    name: Stage 6 XHS Unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Run Stage 6 unit tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/collection/test_xhs_tikhub_operation.py tests/unit/collection/test_xhs_tikhub_mapper.py -q

  quality:
    name: Stage 6 XHS Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Run quality gates
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check backend tests scripts
          uv run ruff check backend tests scripts
          uv run mypy backend/src
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py
          uv run python scripts/quality/scan_secrets.py
          uv run python scripts/quality/check_docs.py
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/contracts/check_compatibility.py
