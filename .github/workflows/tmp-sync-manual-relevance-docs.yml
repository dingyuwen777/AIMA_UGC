name: Temporary Sync Manual Relevance Docs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/manual-relevance-review
          fetch-depth: 0

      - name: Sync approved semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "backend/src/aima_ugc/bootstrap/api.py",
              'detail="所选内容不是当前可复核的 AI 不相关状态，或内容版本已经变化。",',
              'detail="所选内容当前相关性状态不允许该人工操作，或内容版本已经变化。",',
          )
          replace_once(
              "backend/src/aima_ugc/contracts/http.py",
              '"""按模型重要性顺序返回的一个一级/二级标签父子对。"""',
              '"""按模型重要性顺序返回的一个一级/二级标签对。"""',
          )
          replace_once(
              "docs/blueprint/07_技术决策与实施门禁.md",
              "人工对 AI 相关性的纠正也属于 Analysis Domain：不得为了“人工改成相关”去 UPDATE/DELETE `analysis_content_results.relevance`，也不得向 `contents` 加平行布尔列。当前只允许把当前 Content Version 的 AI `irrelevant` 人工纳入 `relevant`，独立保存到 `analysis_content_relevance_reviews`；查询层据此计算业务有效相关性。人工决定绑定 Content Version，新版本不会继承旧人工判断。",
              "人工对 AI 相关性的纠正也属于 Analysis Domain：不得 UPDATE/DELETE `analysis_content_results.relevance`，也不得向 `contents` 加平行布尔列。`analysis_content_relevance_reviews` 是按 `content_id + content_version` 追加的人工决定账本，`review_no` 决定同一版本事件顺序，`decision` 只允许 `relevant / irrelevant / inherit_ai`。最新 `relevant/irrelevant` 会覆盖该版本的 AI 业务相关性，`inherit_ai` 表示撤销人工覆盖并回到当前 AI 基线；已有人工覆盖要改成相反人工结论时必须先撤销，不能一次请求隐式改写历史。模型原始结果始终保留，新 Content Version 不继承旧版本人工决定。`GET /contents` 返回的 `effective_relevance / relevance_source` 只是 Query Repository 从 AI 原判和最新人工事件计算出的只读投影，不是新的数据库写事实；即使当前 AI 因 Prompt/Model 身份变化进入 `stale`，活动人工覆盖仍可被识别和撤销。",
          )
          replace_once(
              "docs/blueprint/03_数据库与文件存储.md",
              "人工复核同样属于 Analysis Domain。`analysis_content_results.relevance` 始终保留模型原始判断；当用户把当前 Content Version 的 AI `irrelevant` 人工纳入相关业务数据时，系统只新增 `analysis_content_relevance_reviews` 记录，并用 `analysis_result_id` 精确关联被人工复核的模型结果，不改写模型结果。人工决定绑定 `content_id + content_version`，内容产生新版本后旧决定继续留作审计，但不自动套用到新版本。",
              "人工复核同样属于 Analysis Domain。`analysis_content_results.relevance` 始终保留模型原始判断；`analysis_content_relevance_reviews` 按 `content_id + content_version + review_no` 追加 `relevant / irrelevant / inherit_ai` 决定，并用 `analysis_result_id` 精确关联被人工操作的 AI Result。最新 `relevant/irrelevant` 是人工业务覆盖，`inherit_ai` 撤销覆盖并恢复当前 AI 基线；事件不 UPDATE/DELETE，因此反复复核仍保留完整审计历史。人工决定只作用于对应 Content Version，新版本不会继承旧决定。声音广场返回的 `effective_relevance / relevance_source` 由查询层实时派生，不是 `contents` 或 Analysis Result 上新增的第二套持久事实。",
          )
          replace_once(
              "docs/blueprint/04_后端任务API与前端.md",
              "`POST /content-relevance-reviews` 是同步短事务：接收 1—1000 个不重复 Content ID，只允许把**当前版本、当前 AI 原判为 `irrelevant`** 的内容人工纳入相关业务数据。批量请求先锁定并校验全部目标，任一目标不可复核则整批返回 409；同一当前版本重复提交幂等。模型原始 `analysis_content_results` 不会被更新或删除。",
              "`POST /content-relevance-reviews` 是同步短事务：接收 1—1000 个不重复 Content ID，并显式提交 `decision=relevant / irrelevant / inherit_ai`。`relevant/irrelevant` 分别把当前 Content Version 人工覆盖为业务相关/不相关；`inherit_ai` 撤销活动人工覆盖并恢复当前 AI 基线。批量请求先锁定并校验全部目标，任一目标不可操作则整批返回 409；重复提交当前已经生效的决定幂等。已有人工覆盖要切换到相反人工结论时必须先撤销。模型原始 `analysis_content_results` 不会被更新或删除。`GET /contents` 与 Detail 同时返回 AI 原判和查询层派生的 `effective_relevance / relevance_source`，前端据此显示人工覆盖与撤销入口，不能从筛选条件猜测人工状态；AI 变为 `stale` 时活动人工覆盖仍可撤销。",
          )
          replace_once(
              "backend/src/aima_ugc/modules/analysis/README.md",
              "模型原始 `analysis_content_results.relevance` 是不可被人工复核覆盖的审计事实。当前允许用户把同一 Content Version 的 AI `irrelevant` 人工纳入相关业务集合，决定保存到 `analysis_content_relevance_reviews`，并用 `analysis_result_id` 保留被复核 AI Result 的精确来源。默认业务列表、`relevance` 筛选、查询型 Analysis target 和查询型 Export 都复用 `PostgresContentQueryRepository` 的有效相关性：当前版本有人工作为 `relevant` 时优先采用人工决定，否则采用 AI relevance。Content 新版本不会继承旧人工决定。",
              "模型原始 `analysis_content_results.relevance` 是不可被人工复核覆盖的审计事实。人工相关性决定保存到 `analysis_content_relevance_reviews` 追加账本，同一 Content Version 以递增 `review_no` 记录 `relevant / irrelevant / inherit_ai`，并用 `analysis_result_id` 保留操作所针对 AI Result 的精确来源。最新 `relevant/irrelevant` 覆盖业务有效相关性，`inherit_ai` 撤销覆盖并回到当前 AI 基线；直接从一种人工覆盖切换到相反覆盖必须先撤销。默认业务列表、`relevance` 筛选、查询型 Analysis target 和查询型 Export 都复用 `PostgresContentQueryRepository` 的同一有效相关性表达式。API 的 `effective_relevance / relevance_source` 是只读派生投影，因此当前 AI 进入 `stale` 后活动人工覆盖仍能被识别和撤销。Content 新版本不会继承旧人工决定。",
          )
          replace_once(
              "docs/appendix/07_AI舆情打标与分析实现.md",
              "人工复核不会修改 `analysis_content_results.relevance`。它写入 `analysis_content_relevance_reviews(content_id, content_version, analysis_result_id, decision=relevant, request_id, reviewed_at)`；同一版本重复复核幂等，批量请求全量校验后同事务提交。查询层把当前版本人工 `relevant` 作为业务有效相关性，但 Content 详情中的 Analysis 仍可看到 AI 原始 `irrelevant`。当 Content 产生新版本时，旧人工记录继续保留为历史审计，不自动影响新版本。",
              "人工复核不会修改 `analysis_content_results.relevance`。它向 `analysis_content_relevance_reviews(content_id, content_version, review_no, analysis_result_id, decision, request_id, reviewed_at)` 追加事件；`decision` 只允许 `relevant / irrelevant / inherit_ai`。最新 `relevant/irrelevant` 分别把当前版本人工纳入/排除业务相关集合，`inherit_ai` 撤销覆盖并回到当前 AI 基线；相反人工覆盖必须先撤销。重复提交当前已生效状态幂等，批量请求全量校验后同事务提交。查询层统一计算业务有效相关性，Content API 同时保留 `analysis.relevance` AI 原判并返回派生 `effective_relevance / relevance_source`，所以 Prompt/Model 变化导致 AI `stale` 时，已有人工覆盖仍能显示和撤销。Content 产生新版本后，旧人工事件继续留作历史审计，不自动影响新版本。",
          )
          PY
          git diff --check

      - name: Ensure stale one-way wording is gone
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -F "当前只允许把当前 Content Version 的 AI `irrelevant`" docs backend/src/aima_ugc/modules/analysis/README.md
          ! grep -R -F "只允许把**当前版本、当前 AI 原判为 `irrelevant`**" docs/blueprint/04_后端任务API与前端.md
          ! grep -R -F "decision=relevant, request_id" docs/appendix/07_AI舆情打标与分析实现.md

      - name: Commit synchronized semantics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/aima_ugc/bootstrap/api.py backend/src/aima_ugc/contracts/http.py docs/blueprint/03_数据库与文件存储.md docs/blueprint/04_后端任务API与前端.md docs/blueprint/07_技术决策与实施门禁.md docs/appendix/07_AI舆情打标与分析实现.md backend/src/aima_ugc/modules/analysis/README.md
          git commit -m "同步双向人工相关性复核设计文档"
          git fetch origin feature/manual-relevance-review
          git rebase origin/feature/manual-relevance-review
          git push origin HEAD:feature/manual-relevance-review
