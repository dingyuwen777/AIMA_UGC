name: Stage 3 Temporary Acceptance Migration Retry

on:
  push:
    branches:
      - feature/stage3-excel-brand-vehicle-filter

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.event.head_commit.message == '工具：重跑 Stage 3 完整验收迁移'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/stage3-acceptance/data
      AIMA_LOG_DIR: .runtime/stage3-acceptance/logs
      AIMA_SECRET_DIR: .runtime/stage3-acceptance/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage3-excel-brand-vehicle-filter
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reuse reviewed migration and repair generated test style
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/stage3-acceptance-migration-temp.yml')
          workflow = source.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, str(source), 'exec'), {})

          backend = Path('tests/integration/ingestion/test_stage12_historical_campaign_worker.py')
          text = backend.read_text(encoding='utf-8')
          text = text.replace(
              'from aima_ugc.bootstrap.import_http import PostgresImportHttpService\n',
              'from aima_ugc.bootstrap.import_http import PostgresImportHttpService\n'
              'from aima_ugc.bootstrap.runtime import PlatformRuntime\n',
              1,
          )
          text = text.replace(
              'def _brand(runtime) -> str:  # type: ignore[no-untyped-def]',
              'def _brand(runtime: PlatformRuntime) -> str:',
              1,
          )
          text = text.replace(
              '"TRUNCATE TABLE jobs, artifacts, keyword_packs, vehicle_brands, accounts RESTART IDENTITY CASCADE"',
              '"TRUNCATE TABLE jobs, artifacts, keyword_packs, vehicle_brands, "\n'
              '                "accounts RESTART IDENTITY CASCADE"',
          )
          backend.write_text(text, encoding='utf-8')
          PY
      - name: Install frozen environments and prepare PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "uv==$(tr -d '\r\n' < .uv-version)"
          uv sync --locked
          npm ci --prefix frontend
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'ci-postgres' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
      - name: Verify migrated acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format tests/integration/ingestion/test_stage12_historical_campaign_worker.py
          uv run ruff check tests/integration/ingestion/test_stage12_historical_campaign_worker.py
          uv run pytest tests/unit/test_brand_vehicle_resolver.py -q
          uv run pytest tests/integration/ingestion/test_stage12_historical_campaign_worker.py -q
          npm --prefix frontend run lint
          npm --prefix frontend run test:e2e -- e2e/collection-runtime.spec.ts e2e/excel-import-submit-state.spec.ts e2e/historical-migration.spec.ts
      - name: Commit verified acceptance migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            frontend/e2e/collection-runtime.spec.ts \
            frontend/e2e/excel-import-submit-state.spec.ts \
            frontend/e2e/historical-migration.spec.ts \
            tests/integration/ingestion/test_stage12_historical_campaign_worker.py
          git diff --cached --quiet && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "测试：迁移 Stage 3 完整验收资产"
          git push origin HEAD:feature/stage3-excel-brand-vehicle-filter
