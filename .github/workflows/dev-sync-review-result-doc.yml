name: Dev Sync Review Result Docs

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Update exact audit wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "docs/appendix/07_AI舆情打标与分析实现.md": [
                  (
                      "analysis_content_relevance_reviews(content_id, content_version, decision=relevant, request_id, reviewed_at)",
                      "analysis_content_relevance_reviews(content_id, content_version, analysis_result_id, decision=relevant, request_id, reviewed_at)",
                  ),
              ],
              "docs/blueprint/03_数据库与文件存储.md": [
                  (
                      "系统只新增 `analysis_content_relevance_reviews` 记录，不改写模型结果。",
                      "系统只新增 `analysis_content_relevance_reviews` 记录，并用 `analysis_result_id` 精确关联被人工复核的模型结果，不改写模型结果。",
                  ),
              ],
              "backend/src/aima_ugc/modules/analysis/README.md": [
                  (
                      "决定保存到 `analysis_content_relevance_reviews`。",
                      "决定保存到 `analysis_content_relevance_reviews`，并用 `analysis_result_id` 保留被复核 AI Result 的精确来源。",
                  ),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"未找到待替换原文: {filename}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit documentation updates
        shell: bash
        run: |
          set -euo pipefail
          git add docs/appendix/07_AI舆情打标与分析实现.md \
            docs/blueprint/03_数据库与文件存储.md \
            backend/src/aima_ugc/modules/analysis/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "补充人工复核 AI 结果审计关联"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
