name: Temporary Public Create Contract Fixture Cleanup

on:
  push:
    branches:
      - feature/server-generated-catalog-code

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '清理公共创建请求旧编码测试夹具') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/server-generated-catalog-code
          fetch-depth: 0
      - name: Scan and remove stale public Create code fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          TARGETS = {"BrandCreateRequest", "VehicleModelCreateRequest"}
          SKIP_PARTS = {".git", ".venv", ".runtime", "node_modules", "dist"}

          def call_name(func: ast.expr) -> str | None:
              if isinstance(func, ast.Name):
                  return func.id
              if isinstance(func, ast.Attribute):
                  return func.attr
              return None

          def scan() -> list[tuple[Path, ast.keyword, str]]:
              found: list[tuple[Path, ast.keyword, str]] = []
              for path in sorted(Path(".").rglob("*.py")):
                  if any(part in SKIP_PARTS for part in path.parts):
                      continue
                  try:
                      source = path.read_text(encoding="utf-8")
                      tree = ast.parse(source, filename=str(path))
                  except (UnicodeDecodeError, SyntaxError):
                      continue
                  for node in ast.walk(tree):
                      if not isinstance(node, ast.Call) or call_name(node.func) not in TARGETS:
                          continue
                      for keyword in node.keywords:
                          if keyword.arg == "code":
                              found.append((path, keyword, source))
              return found

          matches = scan()
          print(f"PUBLIC_CREATE_CODE_MATCHES_BEFORE={len(matches)}")
          for path, keyword, _ in matches:
              print(f"MATCH {path}:{keyword.lineno} {call_name(next(n.func for n in ast.walk(ast.parse(path.read_text(encoding='utf-8'))) if isinstance(n, ast.Call) and any(k is not None and getattr(k, 'lineno', None) == keyword.lineno and k.arg == 'code' for k in n.keywords)))}")

          by_path: dict[Path, list[ast.keyword]] = {}
          for path, keyword, _ in matches:
              by_path.setdefault(path, []).append(keyword)

          changed: list[str] = []
          unsafe: list[str] = []
          for path, keywords in by_path.items():
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              delete_lines: set[int] = set()
              for keyword in keywords:
                  if keyword.lineno != keyword.end_lineno:
                      unsafe.append(f"{path}:{keyword.lineno}-{keyword.end_lineno} multiline code keyword")
                      continue
                  index = keyword.lineno - 1
                  line = lines[index]
                  before = line[: keyword.col_offset]
                  after = line[keyword.end_col_offset :]
                  if before.strip() or after.strip() not in {",", ""}:
                      unsafe.append(
                          f"{path}:{keyword.lineno} code keyword is not an isolated argument line: {line.rstrip()}"
                      )
                      continue
                  delete_lines.add(index)
              if unsafe:
                  continue
              if delete_lines:
                  path.write_text(
                      "".join(line for i, line in enumerate(lines) if i not in delete_lines),
                      encoding="utf-8",
                  )
                  changed.append(str(path))

          if unsafe:
              print("UNSAFE_PUBLIC_CREATE_CODE_MATCHES:")
              for item in unsafe:
                  print(item)
              raise SystemExit(2)

          remaining = scan()
          print(f"PUBLIC_CREATE_CODE_MATCHES_AFTER={len(remaining)}")
          if remaining:
              for path, keyword, _ in remaining:
                  print(f"REMAINING {path}:{keyword.lineno}")
              raise SystemExit(3)

          changed_path = Path("/tmp/public-create-changed.txt")
          changed_path.write_text("\n".join(changed) + ("\n" if changed else ""), encoding="utf-8")
          print("CHANGED_FILES:")
          for item in changed:
              print(item)

          change_path = Path("changes/active/CHG-20260917-server-generated-catalog-code/CHANGE.md")
          change = change_path.read_text(encoding="utf-8")
          if "  - tests/integration/ingestion/\n" not in change:
              change = change.replace(
                  "affected_paths:\n",
                  "affected_paths:\n  - tests/integration/ingestion/\n  - scripts/performance/benchmark_stage12_historical.py\n",
                  1,
              )
          bullet = (
              "- [x] 使用 AST 全仓扫描公共 Create Contract 调用点，清理所有 "
              "`BrandCreateRequest` / `VehicleModelCreateRequest` 中的客户端 `code`；"
              "Repository 层显式内部 code 调用保持不变。\n"
          )
          if bullet not in change:
              marker = "- [x] 用户可见品牌/车型顺序不再依赖内部 `code`：管理员目录按显示名稳定排序，内容品牌按业务角色（自有→竞品→其他）再按显示名排序，内容车型按有效显示名排序。\n"
              if marker not in change:
                  raise SystemExit("Change implementation marker not found")
              change = change.replace(marker, marker + bullet, 1)
          evidence = (
              "13. 正式 PostgreSQL Integration 在 ingestion 套件集中暴露历史公共 Create fixture 与 Stage12 性能 harness 仍传客户端 `code`；"
              "本轮改为 AST 全仓扫描并清零此类调用，仅保留 Repository 层合法内部显式 code。最终通过状态仍以当前 HEAD required CI 为准。\n"
          )
          if evidence not in change:
              change += "\n" + evidence
          change_path.write_text(change, encoding="utf-8")
          PY
      - name: Format and validate changed Python files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.16.2
          mapfile -t files < /tmp/public-create-changed.txt
          if (( ${#files[@]} > 0 )); then
            ruff check --fix "${files[@]}"
            ruff format "${files[@]}"
            ruff check "${files[@]}"
          fi
          python - <<'PY'
          import ast
          from pathlib import Path
          targets = {"BrandCreateRequest", "VehicleModelCreateRequest"}
          skip = {".git", ".venv", ".runtime", "node_modules", "dist"}
          remaining = []
          for path in sorted(Path(".").rglob("*.py")):
              if any(part in skip for part in path.parts):
                  continue
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except (UnicodeDecodeError, SyntaxError):
                  continue
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  name = node.func.id if isinstance(node.func, ast.Name) else node.func.attr if isinstance(node.func, ast.Attribute) else None
                  if name in targets:
                      for kw in node.keywords:
                          if kw.arg == "code":
                              remaining.append(f"{path}:{kw.lineno}:{name}")
          print(f"PUBLIC_CREATE_CODE_MATCHES_FINAL={len(remaining)}")
          if remaining:
              print("\n".join(remaining))
              raise SystemExit(1)
          PY
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No stale public Create code fixtures remain"
            exit 0
          fi
          git config user.name "yuwen.ding"
          git config user.email "dingyuwen777@gmail.com"
          git add tests scripts/performance/benchmark_stage12_historical.py changes/active/CHG-20260917-server-generated-catalog-code/CHANGE.md
          git commit -m "清理公共创建请求旧编码测试夹具"
          git push origin HEAD:feature/server-generated-catalog-code
