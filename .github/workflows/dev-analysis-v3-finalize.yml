name: DEV Analysis V3 Finalize

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feature/analysis-relevance-voice-type' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: analysis-v3-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/dev-analysis-v3/data
      AIMA_LOG_DIR: .runtime/dev-analysis-v3/logs
      AIMA_SECRET_DIR: .runtime/dev-analysis-v3/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: 5432
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: 3
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/analysis-relevance-voice-type
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'analysis-v3-ci' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"

      - name: Update acceptance tests first
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing expected block in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = "tests/unit/platform/test_excel_export.py"
          replace(
              path,
              '''            analysis=UnifiedDataExcelAnalysisV1(\n                sentiment="sentiment-test",''',
              '''            analysis=UnifiedDataExcelAnalysisV1(\n                voice_type="creator_marketing",\n                is_user_voice=False,\n                sentiment="sentiment-test",''',
          )
          replace(
              path,
              '''            "命中关键词",\n            "情感标签",''',
              '''            "命中关键词",\n            "发声类型",\n            "是否用户真实发声",\n            "情感标签",''',
          )
          replace(
              path,
              '''        assert all(content_row[index].value is None for index in range(24, 30))\n        assert content_row[30].value == "tikhub"\n        assert content_row[31].value == "raw/search.json#item[0]"\n        assert content_row[32].value == "partial 1/2"''',
              '''        assert all(content_row[index].value is None for index in range(24, 32))\n        assert content_row[32].value == "tikhub"\n        assert content_row[33].value == "raw/search.json#item[0]"\n        assert content_row[34].value == "partial 1/2"''',
          )
          replace(
              path,
              '''        assert raw_values[24:30] == [None] * 6\n        assert labeled_values[24:30] == [\n            "sentiment-test",\n            "primary-test",\n            "secondary-test",\n            "model-test",\n            "prompt-test",\n            "taxonomy-test",\n        ]\n        assert raw_values[30:] == labeled_values[30:]''',
              '''        assert raw_values[24:32] == [None] * 8\n        assert labeled_values[24:32] == [\n            "达人/创作者营销",\n            "否",\n            "sentiment-test",\n            "primary-test",\n            "secondary-test",\n            "model-test",\n            "prompt-test",\n            "taxonomy-test",\n        ]\n        assert raw_values[32:] == labeled_values[32:]''',
          )

          path = "tests/unit/platform/test_p1g_labeled_excel.py"
          p = Path(path)
          text = p.read_text(encoding="utf-8")
          old = '''        assert row[24:33] == (\n            "relevant",\n            "unknown",\n            "否",\n            "正面",\n            "一级测试",\n            "二级测试",\n            "test-model",\n            "content-labeling.v1",\n            "b" * 64,\n        )'''
          if old in text:
              text = text.replace(
                  old,
                  '''        assert row[24:32] == (\n            "无法判断",\n            "否",\n            "正面",\n            "一级测试",\n            "二级测试",\n            "test-model",\n            "content-labeling.v1",\n            "b" * 64,\n        )''',
                  1,
              )
              p.write_text(text, encoding="utf-8")

          path = "tests/integration/content/test_stage8d_voice_plaza_runtime.py"
          p = Path(path)
          text = p.read_text(encoding="utf-8")
          text = text.replace('''            relevance_index = headers.index("相关性")\n            voice_type_index = headers.index("发声类型")''', '''            assert "相关性" not in headers\n            voice_type_index = headers.index("发声类型")''')
          text = text.replace('''            assert data_rows[0][relevance_index] == "relevant"\n            assert data_rows[0][voice_type_index] == "user_voice"''', '''            assert data_rows[0][voice_type_index] == "真实用户发声"''')
          text = text.replace('''            assert data_rows[1][relevance_index] is None\n            assert data_rows[1][voice_type_index] is None''', '''            assert data_rows[1][voice_type_index] is None''')
          p.write_text(text, encoding="utf-8")
          PY
          uv run ruff format tests/unit/platform/test_excel_export.py tests/unit/platform/test_p1g_labeled_excel.py tests/integration/content/test_stage8d_voice_plaza_runtime.py

      - name: Verify Red
        shell: bash
        run: |
          set +e
          uv run pytest tests/unit/platform/test_excel_export.py tests/unit/platform/test_p1g_labeled_excel.py -q > /tmp/red.log 2>&1
          status=$?
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected updated Excel acceptance tests to fail before production patch."
            exit 1
          fi
          grep -Eq "相关性|creator_marketing|达人/创作者营销|无法判断|AssertionError" /tmp/red.log || exit 1
          exit 0

      - name: Apply minimal production and docs changes
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) < count:
                  raise SystemExit(f"missing expected block in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          path = "backend/src/aima_ugc/platform/export/excel.py"
          replace(path, '    "相关性",\n', '')
          replace(path, '    "相关性": 12,\n', '')
          replace(
              path,
              '        (analysis.relevance if analysis is not None else None, False, False),\n        (analysis.voice_type if analysis is not None else None, False, False),',
              '        (_voice_type_display_name(analysis.voice_type) if analysis is not None else None, False, False),',
          )
          insert_after = '_SECONDARY_LABEL_HEADER = "二级标签"\n'
          mapping = '''_VOICE_TYPE_DISPLAY_NAMES = {\n    "user_voice": "真实用户发声",\n    "creator_marketing": "达人/创作者营销",\n    "brand_official": "品牌官方传播",\n    "dealer_promotion": "经销商/门店推广",\n    "media_information": "媒体/资讯转载",\n    "other_organization": "其他机构传播",\n    "unknown": "无法判断",\n}\n'''
          replace(path, insert_after, insert_after + mapping)
          helper_anchor = '\ndef _content_cells(\n'
          helper = '''\ndef _voice_type_display_name(value: str) -> str:\n    try:\n        return _VOICE_TYPE_DISPLAY_NAMES[value]\n    except KeyError as exc:\n        raise ValueError(f"不支持的发声类型: {value}") from exc\n\n\n'''
          replace(path, helper_anchor, helper + 'def _content_cells(\n')

          path = "backend/src/aima_ugc/adapters/providers/imports_test/test.py"
          replace(path, '    "相关性",\n', '', count=2)

          path = "backend/src/aima_ugc/adapters/persistence/postgres/reporting.py"
          replace(
              path,
              '''            projected[cast(UUID, row["content_id"])] = UnifiedDataExcelAnalysisV1(\n                sentiment=cast(str, row["sentiment"]),''',
              '''            voice_type = cast(str, row["voice_type"])\n            projected[cast(UUID, row["content_id"])] = UnifiedDataExcelAnalysisV1(\n                relevance=cast(str, row["relevance"]),\n                voice_type=voice_type,\n                is_user_voice=voice_type == "user_voice",\n                sentiment=cast(str | None, row["sentiment"]),''',
          )

          path = "docs/blueprint/13-统一数据Excel导出与调试复用.md"
          p = Path(path)
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              '''命中关键词\n情感标签\n一级标签''',
              '''命中关键词\n发声类型\n是否用户真实发声\n情感标签\n一级标签''',
              1,
          )
          text = text.replace(
              '''共享内容视图支持以下 Analysis 列：\n\n```text\n情感标签''',
              '''共享内容视图支持以下 Analysis 列：\n\n```text\n发声类型\n是否用户真实发声\n情感标签''',
              1,
          )
          text = text.replace(
              '''其中：\n\n- 情感标签仍为单值；''',
              '''其中：\n\n- “相关性”不进入 Excel 展示列。离线打标已从最终 `deduplicated/contents.jsonl` 删除 `irrelevant` 内容；正式查询型导出同样默认排除当前分析判定的无关内容，因此导出表不重复展示恒为 relevant 的字段；\n- `voice_type` 在 Contract/数据库中保持稳定英文枚举，Excel 仅做中文展示映射：`user_voice → 真实用户发声`、`creator_marketing → 达人/创作者营销`、`brand_official → 品牌官方传播`、`dealer_promotion → 经销商/门店推广`、`media_information → 媒体/资讯转载`、`other_organization → 其他机构传播`、`unknown → 无法判断`；\n- “是否用户真实发声”不由模型重复输出，而由 `voice_type == user_voice` 唯一派生为“是/否”，避免双字段冲突；\n- 情感标签仍为单值；''',
              1,
          )
          text = text.replace(
              '''命中关键词\n情感标签\n一级标签\n二级标签\n```\n\n这是该人工入口的''',
              '''命中关键词\n发声类型\n是否用户真实发声\n情感标签\n一级标签\n二级标签\n```\n\n这是该人工入口的''',
              1,
          )
          text = text.replace(
              '''→ AI 打标\n→ 原子回写同一个 deduplicated/contents.jsonl（analysis 已填）''',
              '''→ AI 打标（同一次 LLM 调用完成 relevance + voice_type + sentiment + labels）\n→ 原子回写同一个 deduplicated/contents.jsonl（relevant 写回 Analysis；irrelevant 行删除）''',
              1,
          )
          p.write_text(text, encoding="utf-8")

          path = "docs/blueprint/15-舆情AI打标与统一分析契约.md"
          p = Path(path)
          text = p.read_text(encoding="utf-8")
          text = text.replace("→ ContentLabelAnalysisV2", "→ ContentLabelAnalysisV3", 1)
          text = text.replace(
              '''analysis: ContentLabelAnalysisV1 | ContentLabelAnalysisV2''',
              '''analysis: ContentLabelAnalysisV1 | ContentLabelAnalysisV2 | ContentLabelAnalysisV3''',
              1,
          )
          text = text.replace(
              '''backend/src/aima_ugc/modules/analysis/prompts/content_labeling_v2.md''',
              '''backend/src/aima_ugc/modules/analysis/prompts/content_labeling_v3.md''',
              1,
          )
          text = text.replace(
              '''只修改 `content_labeling_v2.md`''',
              '''只修改 `content_labeling_v3.md`''',
              1,
          )
          text = text.replace(
              '''历史 `ContentLabelAnalysisV1` 保留用于读取旧 JSONL/checkpoint；当前 Service 新生成的成功结果使用 `ContentLabelAnalysisV2`。''',
              '''历史 `ContentLabelAnalysisV1/V2` 保留用于读取旧 JSONL/checkpoint；当前 Service 新生成的成功结果使用 `ContentLabelAnalysisV3`。V3 在**同一次 LLM 调用**中完成 `relevance + voice_type + sentiment + labels`：先做语义相关性复核，再做内容发声类型判断，只有 relevant 内容继续输出情感和标签。`is_user_voice` 不要求模型重复输出，系统按 `voice_type == user_voice` 唯一派生。''',
              1,
          )
          section = '''\n### 3.2 V3 相关性、发声类型与离线删除语义\n\n当前 V3 固定规则：\n\n```text\n关键词确定性粗筛\n→ 去重\n→ 单次 LLM：relevance + voice_type + sentiment + labels\n→ 本地 Validator\n→ relevant：写回 Analysis\n→ irrelevant：从最终离线业务 JSONL 删除\n```\n\n`voice_type` 机器值固定为：`user_voice`、`creator_marketing`、`brand_official`、`dealer_promotion`、`media_information`、`other_organization`、`unknown`。判断的是当前内容发声属性，不声称认定账号真实法律身份。\n\n离线流程中的“删除”指：AI 成功判定 `irrelevant` 后，该完整内容记录不再进入最终 `deduplicated/contents.jsonl`、最终 Excel 和报告。为了崩溃恢复与费用幂等，`analysis/checkpoints.jsonl` 可以保留不含正文的最小成功决策与稳定身份；它不是下游业务数据源，也不能被 Excel/报告消费。Provider Raw、来源账本和正式 PostgreSQL 审计历史继续按各自数据保留规则管理。\n\nExcel 不展示“相关性”列，因为正常业务导出只消费 relevant 集合；发声类型在 Excel 中映射为中文，“是否用户真实发声”由 `voice_type == user_voice` 派生。\n'''
          anchor = "\n## 4. 同一个 Markdown 中必须包含机器可读 Taxonomy JSON\n"
          if "### 3.2 V3 相关性、发声类型与离线删除语义" not in text:
              text = text.replace(anchor, section + anchor, 1)
          p.write_text(text, encoding="utf-8")

          path = "backend/src/aima_ugc/adapters/providers/imports_test/README.md"
          p = Path(path)
          text = p.read_text(encoding="utf-8")
          if "## AI 语义相关性与发声类型" not in text:
              text += '''\n\n## AI 语义相关性与发声类型\n\n`label_sentiment()` 复用正式 `ContentLabelingService`，每条内容一次 LLM 请求同时完成相关性、发声类型、情感和多标签判断。判定为 `irrelevant` 的完整内容行会在最终原子回写时从 `deduplicated/contents.jsonl` 删除；checkpoint 仅保留最小恢复决策，不作为业务数据源。最终 Excel 不显示“相关性”列，只显示中文“发声类型”和派生的“是否用户真实发声”。\n'''
          p.write_text(text, encoding="utf-8")

          path = "changes/active/CHG-20260821-analysis-relevance-voice-type/CHANGE.md"
          p = Path(path)
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              '- [ ] Excel 在包含 Analysis 时增加“相关性 / 发声类型 / 是否用户真实发声”列；irrelevant 只有在显式审计数据源传入时才可能出现。',
              '- [ ] Excel 不展示“相关性”列；“发声类型”按稳定英文枚举映射为中文，“是否用户真实发声”由 `voice_type == user_voice` 派生为“是/否”；业务 Excel 不输出 irrelevant 行。',
          )
          decision = '''\n- 用户后续进一步确认：所有判断必须在同一次 AI 打标过程中完成；Excel 删除“相关性”列；发声类型显示中文；判定无关的完整业务记录从最终离线数据集删除。`is_user_voice` 继续作为同一打标结果中 `voice_type` 的确定性派生字段，不增加第二次模型调用或第二份可冲突事实。\n'''
          needle = '用户已明确：发声类型需要按“用户真实体验/个人表达、营销推广、官方传播、媒体转载等”合理分类，并授权按该目标细化类型。采用上面的 7 类，其中 `is_user_voice` 仅由 `voice_type == user_voice` 派生，避免数据库存两份可能不一致的事实。\n'
          if decision.strip() not in text:
              text = text.replace(needle, needle + decision, 1)
          p.write_text(text, encoding="utf-8")
          PY

          uv run ruff format \
            backend/src/aima_ugc/platform/export/excel.py \
            backend/src/aima_ugc/adapters/providers/imports_test/test.py \
            backend/src/aima_ugc/adapters/persistence/postgres/reporting.py \
            tests/unit/platform/test_excel_export.py \
            tests/unit/platform/test_p1g_labeled_excel.py \
            tests/integration/content/test_stage8d_voice_plaza_runtime.py

      - name: Verify Green and focused integration
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/platform/test_excel_export.py tests/unit/platform/test_p1g_labeled_excel.py -q
          uv run alembic upgrade head
          uv run pytest tests/integration/content/test_stage8d_voice_plaza_runtime.py -q
          uv run ruff format --check backend tests scripts
          uv run ruff check backend tests scripts
          uv run mypy backend/src
          uv run python scripts/contracts/generate.py --check
          uv run python scripts/quality/check_docs.py

      - name: Commit finalized changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            backend/src/aima_ugc/platform/export/excel.py \
            backend/src/aima_ugc/adapters/providers/imports_test/test.py \
            backend/src/aima_ugc/adapters/persistence/postgres/reporting.py \
            tests/unit/platform/test_excel_export.py \
            tests/unit/platform/test_p1g_labeled_excel.py \
            tests/integration/content/test_stage8d_voice_plaza_runtime.py \
            docs/blueprint/13-统一数据Excel导出与调试复用.md \
            docs/blueprint/15-舆情AI打标与统一分析契约.md \
            backend/src/aima_ugc/adapters/providers/imports_test/README.md \
            changes/active/CHG-20260821-analysis-relevance-voice-type/CHANGE.md
          if git diff --cached --quiet; then
            echo "No finalization changes."
            exit 0
          fi
          git commit -m "收口AI发声分类与Excel中文展示"
          git push origin HEAD:feature/analysis-relevance-voice-type
