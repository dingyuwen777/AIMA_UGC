name: Temporary Product Lifecycle Frontend Fix Check

on:
  push:
    branches:
      - feature/product-resource-lifecycle
    paths:
      - .github/workflows/tmp-product-lifecycle-frontend-fix-check.yml

permissions:
  contents: write

jobs:
  frontend-fix-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current feature branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Apply exact source fixes
        shell: python
        run: |
          from pathlib import Path

          store = Path('frontend/src/features/collection-strategy/store.ts')
          text = store.read_text(encoding='utf-8')
          old = "eligibility.blocking_reasons.join('；')"
          if text.count(old) != 2:
              raise SystemExit(f'expected two blocking_reasons occurrences, got {text.count(old)}')
          text = text.replace(old, "(eligibility.blocking_reasons ?? []).join('；')")
          store.write_text(text, encoding='utf-8')

          panel = Path('frontend/src/features/collection-strategy/pages/CollectionStrategyPage/components/KeywordPackPanel.vue')
          text = panel.read_text(encoding='utf-8')
          old_fn = "function toggleArchived(open: boolean): void {\n  archivedOpen.value = open\n  if (open) emit('loadArchived')\n}\n"
          new_fn = old_fn + "\nfunction onArchivedToggle(event: Event): void {\n  toggleArchived((event.currentTarget as HTMLDetailsElement).open)\n}\n"
          if text.count(old_fn) != 1:
              raise SystemExit('KeywordPackPanel toggleArchived anchor not found exactly once')
          text = text.replace(old_fn, new_fn)
          old_tpl = "@toggle=\"toggleArchived(($event.currentTarget as HTMLDetailsElement).open)\""
          if text.count(old_tpl) != 1:
              raise SystemExit('KeywordPackPanel template cast anchor not found exactly once')
          text = text.replace(old_tpl, '@toggle="onArchivedToggle"')
          panel.write_text(text, encoding='utf-8')

          drawer = Path('frontend/src/features/collection-strategy/pages/CollectionStrategyPage/components/PlanCreateDrawer.vue')
          text = drawer.read_text(encoding='utf-8')
          old_z = '.backdrop { position: fixed; z-index: 100; inset: 0;'
          if text.count(old_z) != 1:
              raise SystemExit('PlanCreateDrawer backdrop anchor not found exactly once')
          text = text.replace(old_z, '.backdrop { position: fixed; z-index: 110; inset: 0;')
          drawer.write_text(text, encoding='utf-8')

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend environment
        run: npm ci --prefix frontend

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Run affected frontend tests
        run: npm --prefix frontend test -- --run tests/import-batches-api.spec.ts tests/collection-strategy.spec.ts tests/collection-strategy-design.spec.ts tests/collection-runtime.spec.ts tests/collection-runtime-design.spec.ts tests/frontend-audit-regressions.spec.ts tests/admin-configuration-presentation.spec.ts

      - name: Commit source fixes and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-product-lifecycle-frontend-fix-check.yml
          git add frontend/src/features/collection-strategy/store.ts frontend/src/features/collection-strategy/pages/CollectionStrategyPage/components/KeywordPackPanel.vue frontend/src/features/collection-strategy/pages/CollectionStrategyPage/components/PlanCreateDrawer.vue
          git config user.name "AIMA Temporary Validator"
          git config user.email "aima-validator@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "修复生命周期前端类型与层级问题 [skip ci]"
          git push origin HEAD:feature/product-resource-lifecycle
