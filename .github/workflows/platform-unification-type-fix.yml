name: Platform Unification Type Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'refactor/unify-platform-identifiers'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refactor/unify-platform-identifiers
          fetch-depth: 0
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Apply exact type-boundary fixes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dev/_fix_platform_type_boundaries.py
          uv run ruff check --fix backend tests scripts
          uv run ruff format backend tests scripts
          git diff --check
      - name: Validate type boundaries and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check backend tests scripts
          uv run mypy backend/src
          uv run pytest \
            tests/unit/platform/test_logging.py \
            tests/unit/platform/test_platform_presentation.py \
            tests/unit/platform/test_offline_reporting.py \
            tests/contracts/test_provider_v1.py \
            tests/contracts/test_collection_stage7.py \
            -q
          uv run python - <<'PY'
          from uuid import UUID
          from aima_ugc.contracts.http import (
              CollectionPlanListQuery,
              CollectionPlanPlatformRequest,
              CollectionRunPlatformRequest,
              ContentFilterSnapshot,
          )

          config_id = UUID('00000000-0000-0000-0000-000000000001')
          assert CollectionRunPlatformRequest(
              platform='XIAOHONGSHU', provider_config_id=config_id
          ).platform == 'xiaohongshu'
          assert CollectionPlanPlatformRequest(
              platform='Douyin', provider_config_id=config_id
          ).platform == 'douyin'
          assert CollectionPlanListQuery(platform='WEIBO').platform == 'weibo'
          assert ContentFilterSnapshot(
              platforms=('BiliBili', ' KUAISHOU ')
          ).platforms == ('bilibili', 'kuaishou')
          PY
      - name: Commit source fixes to development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend tests
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source fixes to commit.'
          else
            git commit -m '收口平台类型与大小写输入边界'
            git push origin HEAD:refactor/unify-platform-identifiers
          fi
