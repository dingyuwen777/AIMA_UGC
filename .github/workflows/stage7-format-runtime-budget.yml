# runtime-budget-format-revision: 2
name: Stage 7 Format Runtime Budget

on:
  push:
    branches:
      - feature/stage7-completion
    paths:
      - ".github/workflows/stage7-format-runtime-budget.yml"

permissions:
  contents: write

jobs:
  format:
    name: Format and verify runtime budget sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage7-completion
          fetch-depth: 2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7

      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Format target sources and verify
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            backend/src/aima_ugc/adapters/persistence/postgres/provider_budget_envelope.py
            backend/src/aima_ugc/adapters/providers/tikhub/runtime.py
          )
          uv run ruff format "${targets[@]}"
          uv run ruff check "${targets[@]}"
          uv run mypy backend/src
          uv run pytest \
            tests/unit/collection/test_run_budget_envelope.py \
            tests/unit/collection/test_tikhub_real_search_operations.py \
            tests/unit/collection/test_tikhub_real_search_mappers.py \
            tests/unit/collection/test_tikhub_real_detail_mappers.py \
            tests/unit/collection/test_tikhub_real_comment_mappers.py \
            tests/unit/collection/test_tikhub_real_reply_mappers.py \
            -q
          git diff --check

      - name: Commit formatted sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/stage7-completion
          test "$(git rev-parse origin/feature/stage7-completion)" = "${GITHUB_SHA}"
          git add \
            backend/src/aima_ugc/adapters/persistence/postgres/provider_budget_envelope.py \
            backend/src/aima_ugc/adapters/providers/tikhub/runtime.py
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "格式化 Stage 7 Runtime 与预算包络"
          git push origin HEAD:feature/stage7-completion
