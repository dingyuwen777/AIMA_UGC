name: Temporary Voice Type Green Patch

on:
  push:
    branches:
      - feature/voice-type-taxonomy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/voice-type-taxonomy
          fetch-depth: 0

      - name: Apply Green implementation and aligned tests/docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_value: str, old: str, new: str) -> None:
              path = Path(path_value)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: replacement target count={count}, expected=1")
              path.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "backend/src/aima_ugc/platform/export/excel.py",
              '''def _voice_type_display_name(value: str | None) -> str | None:\n    if value is None:\n        return None\n    try:\n        return _VOICE_TYPE_DISPLAY_NAMES[value]\n    except KeyError as exc:\n        raise ValueError(f"不支持的发声类型: {value}") from exc\n''',
              '''def _voice_type_display_name(value: str | None) -> str | None:\n    if value is None:\n        return None\n    # 这里只提供既有中文展示别名，不定义合法 Taxonomy；新值必须可直接透传。\n    return _VOICE_TYPE_DISPLAY_NAMES.get(value, value)\n''',
          )

          replace_once(
              "tests/unit/analysis/test_analysis_relevance_voice_v3.py",
              '''    with pytest.raises(ValidationError):\n        ContentLabelAnalysisV3(\n            relevance="relevant",\n            voice_type="not-a-real-type",\n            sentiment="中性",\n            labels=(ContentLabelPairV2(primary_label="品牌评价", secondary_label="口碑与信任"),),\n            **_base_fields(),\n        )\n''',
              '''    dynamic_voice_type = ContentLabelAnalysisV3(\n        relevance="relevant",\n        voice_type="future_prompt_voice_type",\n        sentiment="中性",\n        labels=(ContentLabelPairV2(primary_label="品牌评价", secondary_label="口碑与信任"),),\n        **_base_fields(),\n    )\n    assert dynamic_voice_type.voice_type == "future_prompt_voice_type"\n\n    with pytest.raises(ValidationError):\n        ContentLabelAnalysisV3(\n            relevance="relevant",\n            voice_type="",\n            sentiment="中性",\n            labels=(ContentLabelPairV2(primary_label="品牌评价", secondary_label="口碑与信任"),),\n            **_base_fields(),\n        )\n''',
          )

          replace_once(
              "tests/unit/database/test_analysis_relevance_voice_schema.py",
              '''    assert any(\n        "voice_type in" in expression and "user_voice" in expression for expression in check_sql\n    )\n''',
              '''    assert "char_length(voice_type) > 0" in check_sql\n    assert not any("voice_type in" in expression for expression in check_sql)\n''',
          )

          replace_once(
              "tests/unit/analysis/test_content_labeling.py",
              '    assert "唯一完整标签事实" in docs\n',
              '    assert "唯一业务事实源" in docs\n',
          )

          replace_once(
              "tests/unit/analysis/test_voice_type_taxonomy.py",
              'import json\nimport re\n',
              'import ast\nimport json\nimport re\n',
          )
          replace_once(
              "tests/unit/analysis/test_voice_type_taxonomy.py",
              '''    for path in python_files:\n        source = path.read_text(encoding="utf-8")\n        copied = [voice_type for voice_type in taxonomy.voice_types if voice_type in source]\n        assert copied == [], f"{path} 不得硬编码具体 voice_type: {copied}"\n''',
              '''    for path in python_files:\n        tree = ast.parse(path.read_text(encoding="utf-8"))\n        string_literals = {\n            node.value\n            for node in ast.walk(tree)\n            if isinstance(node, ast.Constant) and isinstance(node.value, str)\n        }\n        copied = [voice_type for voice_type in taxonomy.voice_types if voice_type in string_literals]\n        assert copied == [], f"{path} 不得硬编码具体 voice_type: {copied}"\n''',
          )

          replace_once(
              "docs/blueprint/03_数据库与文件存储.md",
              '''## 12. Analysis 的当前 7 类 `voice_type`\n\n精确业务语义以当前 Prompt 为唯一事实源：\n\n```text\nbackend/src/aima_ugc/modules/analysis/prompts/content_labeling_v3.md\n```\n\n数据库合法机器值由 `analysis/tables.py` Check Constraint 保护：\n\n```text\nuser_voice\ncreator_marketing\nbrand_official\ndealer_promotion\nmedia_information\nother_organization\nunknown\n```\n\n真实用户发声的唯一业务条件：\n''',
              '''## 12. Analysis 的 `voice_type` Taxonomy 边界\n\n合法机器值与精确业务语义以当前 Prompt 为唯一事实源：\n\n```text\nbackend/src/aima_ugc/modules/analysis/prompts/content_labeling_v3.md\n```\n\n数据库不复制业务合法值列表。`analysis/tables.py` 只保存 `voice_type` 的非空结构约束，模型输出是否属于当前合法集合由运行时 `RuntimeTaxonomyValidator` 按 Prompt Taxonomy 校验。只要字段结构不变，后续增删 `voice_type` 不要求新的 Schema Migration。\n\n真实用户发声的唯一业务条件：\n''',
          )

          replace_once(
              "docs/blueprint/07_技术决策与实施门禁.md",
              '''`voice_type` 当前 7 类机器值：\n\n```text\nuser_voice\ncreator_marketing\nbrand_official\ndealer_promotion\nmedia_information\nother_organization\nunknown\n```\n\n真实用户发声唯一判断：\n''',
              '''`voice_type` 的合法机器值同样不得在 Blueprint 复制；当前集合、类型定义、边界与学习示例只以 `content_labeling_v3.md` 为业务事实源。Python Contract 和数据库只保留字段结构约束，运行时 Validator 负责 membership。\n\n真实用户发声唯一判断：\n''',
          )

          replace_once(
              "docs/appendix/06_Excel统一数据导出与离线调试.md",
              '''`voice_type` Excel 中文投影由 `_VOICE_TYPE_DISPLAY_NAMES` 唯一实现：\n\n```text\nuser_voice         → 真实用户发声\ncreator_marketing  → 达人/创作者营销\nbrand_official     → 品牌官方传播\ndealer_promotion   → 经销商/门店推广\nmedia_information → 媒体/资讯转载\nother_organization → 其他机构传播\nunknown            → 无法判断\n```\n\n这个中文映射只影响 Excel 展示。数据库/Contract 仍保存英文稳定机器值。\n''',
              '''`voice_type` Excel 中文投影可通过 `_VOICE_TYPE_DISPLAY_NAMES` 为既有机器值提供展示别名，但这张映射不是合法 Taxonomy 白名单。合法值只由当前 Prompt 的机器 Taxonomy 决定；已有值继续保持既有中文展示，Prompt 新增而尚未配置展示别名的机器值会在 Excel 中原样输出，不会因为导出层未认识该值而失败。数据库/Contract 继续保存稳定机器值。\n''',
          )
          PY

          git rm .github/workflows/tmp-voice-type-green.yml
          git add \
            backend/src/aima_ugc/platform/export/excel.py \
            tests/unit/analysis/test_analysis_relevance_voice_v3.py \
            tests/unit/database/test_analysis_relevance_voice_schema.py \
            tests/unit/analysis/test_content_labeling.py \
            tests/unit/analysis/test_voice_type_taxonomy.py \
            docs/blueprint/03_数据库与文件存储.md \
            docs/blueprint/07_技术决策与实施门禁.md \
            docs/appendix/06_Excel统一数据导出与离线调试.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "修复：打通动态 voice_type 全链路兼容"
          git push origin HEAD:feature/voice-type-taxonomy
