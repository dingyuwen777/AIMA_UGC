name: Diagnostic logging format helper

on:
  push:
    branches:
      - fix/diagnostic-logging

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/diagnostic-logging
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
      - name: Install locked formatter
        run: |
          python -m pip install uv==0.12.3
          uv sync --locked
      - name: Format changed Python files
        run: |
          uv run ruff format \
            backend/src/aima_ugc/platform/jobs/worker.py \
            tests/unit/platform/test_logging.py \
            tests/unit/platform/test_scheduler_entrypoint_logging.py \
            tests/unit/collection/test_provider_dispatch_logging.py
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/aima_ugc/platform/jobs/worker.py \
            tests/unit/platform/test_logging.py \
            tests/unit/platform/test_scheduler_entrypoint_logging.py \
            tests/unit/collection/test_provider_dispatch_logging.py
          git commit -m "格式化诊断日志代码"
          git push origin HEAD:fix/diagnostic-logging
