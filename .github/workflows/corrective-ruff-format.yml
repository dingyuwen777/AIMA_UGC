name: Corrective Ruff Format

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/corrective-ruff-format.yml"
      - "backend/src/aima_ugc/**"
      - "migrations/versions/20260817_0016_comment_coverage_observability.py"
      - "tests/**"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14.7
      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked
      - name: Format only corrective Python files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            backend/src/aima_ugc/adapters/persistence/postgres/collection_content.py
            backend/src/aima_ugc/adapters/persistence/postgres/collection_provider_execution.py
            backend/src/aima_ugc/adapters/persistence/postgres/collection_run_execution.py
            backend/src/aima_ugc/adapters/persistence/postgres/content.py
            backend/src/aima_ugc/bootstrap/collection_scope.py
            backend/src/aima_ugc/modules/collection/collection_run_executor.py
            backend/src/aima_ugc/modules/content/tables.py
            migrations/versions/20260817_0016_comment_coverage_observability.py
            tests/integration/collection/test_collection_comment_coverage_runtime.py
            tests/integration/collection/test_collection_scope_recovery_runtime.py
            tests/integration/collection/test_collection_worker_retry_runtime.py
            tests/integration/content/test_content_current_concurrency.py
            tests/unit/collection/test_collection_run_recovery.py
          )
          uv run ruff format "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            printf '%s\n' 'No Ruff formatting changes needed.'
            exit 0
          fi
          git diff --check
          changed="$(git diff --name-only -- "${files[@]}")"
          printf '%s\n' "${changed}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "应用本轮 Ruff 格式化"
          git push origin HEAD:${GITHUB_HEAD_REF}
