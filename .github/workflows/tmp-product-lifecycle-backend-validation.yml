name: Temporary Product Lifecycle Backend Validation

on:
  push:
    branches:
      - feature/product-resource-lifecycle

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: aima_ugc
          POSTGRES_USER: aima_ugc
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aima_ugc -d aima_ugc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIMA_DATA_DIR: .runtime/lifecycle-validation/data
      AIMA_LOG_DIR: .runtime/lifecycle-validation/logs
      AIMA_SECRET_DIR: .runtime/lifecycle-validation/secrets
      AIMA_DB_HOST: 127.0.0.1
      AIMA_DB_PORT: '5432'
      AIMA_DB_NAME: aima_ugc
      AIMA_DB_USER: aima_ugc
      AIMA_DB_CONNECT_TIMEOUT_SECONDS: '3'
      EXPECTED_PARENT: 42bc264ace112b4f98e6fb5fe6e76893859f956c
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify validation parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14.7'
          check-latest: false

      - name: Install frozen Python environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          test "$(uv --version | awk '{print $2}')" = "${UV_VERSION}"
          test "$(python --version)" = "Python 3.14.7"
          uv lock --check
          uv sync --locked
          mkdir -p "${AIMA_DATA_DIR}" "${AIMA_LOG_DIR}" "${AIMA_SECRET_DIR}"
          printf '%s\n' 'ci-postgres' > "${AIMA_SECRET_DIR}/postgres_password"
          chmod 600 "${AIMA_SECRET_DIR}/postgres_password"

      - name: Static and type gates
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check backend tests scripts migrations/versions/20260907_0041_import_campaign_revocation.py migrations/versions/20260907_0042_product_resource_lifecycle.py
          uv run ruff check backend tests scripts migrations/versions/20260907_0041_import_campaign_revocation.py migrations/versions/20260907_0042_product_resource_lifecycle.py
          uv run mypy backend/src

      - name: Unit API architecture gates
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/unit/ingestion/test_import_campaign_revocation.py tests/unit/system/test_provider_connectivity.py tests/unit/system/test_runtime_provider_config.py tests/api -q
          uv run python scripts/quality/check_architecture.py
          uv run python scripts/quality/check_table_ownership.py

      - name: Migration head and drift evidence
        shell: bash
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
          uv run python tests/integration/database/verify_migration_compatibility.py
          uv run alembic upgrade head
          uv run alembic check

      - name: Stage12 and lifecycle PostgreSQL regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/integration/ingestion/test_stage12_historical_campaign_worker.py::test_historical_campaign_preflights_before_fill_only_import -q
          uv run pytest tests/integration/database/test_product_resource_lifecycle.py tests/integration/database/test_archived_keyword_snapshot.py tests/integration/database/test_keyword_pack_item_lifecycle.py tests/integration/ingestion/test_import_campaign_revocation_postgres.py -q
