name: Stage 7 Remove Unsafe API Family Evidence

on:
  push:
    branches:
      - feature/stage7-completion
    paths:
      - ".github/workflows/stage7-remove-unsafe-api-family-evidence.yml"

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/stage7-completion
          fetch-depth: 0
      - name: Remove evidence that failed second-pass de-identification review
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin feature/stage7-completion
          test -d tests/fixtures/providers/tikhub/api_family/2026-08-16
          git rm -r tests/fixtures/providers/tikhub/api_family/2026-08-16
          git rm .github/workflows/stage7-remove-unsafe-api-family-evidence.yml
          git config user.name "AIMA Stage 7 Runner"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "撤回未充分脱敏的 TikHub API family 证据"
          git push origin HEAD:feature/stage7-completion
