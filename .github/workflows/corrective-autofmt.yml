name: Corrective Autofmt

on:
  push:
    branches:
      - fix/stage1-stage7-comprehensive-corrective

permissions:
  contents: write

jobs:
  autofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v7.0.1
        with:
          ref: fix/stage1-stage7-comprehensive-corrective
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: .python-version

      - name: Install locked environment
        shell: bash
        run: |
          set -euo pipefail
          UV_VERSION="$(tr -d '\r\n' < .uv-version)"
          python -m pip install "uv==${UV_VERSION}"
          uv lock --check
          uv sync --locked

      - name: Apply repository formatter
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format backend tests scripts
          uv run ruff format --check backend tests scripts
          uv run ruff check backend tests scripts

      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend tests scripts; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend tests scripts
          git commit -m "style(corrective): apply repository formatter"
          git push origin HEAD:fix/stage1-stage7-comprehensive-corrective
