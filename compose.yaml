name: aima-ugc

x-backend-environment: &backend-environment
  - AIMA_DATA_DIR=/app/data
  - AIMA_LOG_DIR=/app/logs
  - AIMA_SECRET_DIR=/run/internal-secrets
  - AIMA_EXTERNAL_SECRET_DIR=/run/secrets
  - AIMA_DB_HOST=postgres
  - AIMA_DB_PORT=5432
  - AIMA_DB_NAME=${AIMA_DB_NAME:-aima_ugc}
  - AIMA_DB_USER=${AIMA_DB_USER:-aima_ugc}
  - AIMA_DB_CONNECT_TIMEOUT_SECONDS=${AIMA_DB_CONNECT_TIMEOUT_SECONDS:-5}
  - AIMA_LOG_LEVEL=${AIMA_LOG_LEVEL:-INFO}
  - AIMA_LOG_MAX_BYTES=${AIMA_LOG_MAX_BYTES:-20971520}
  - AIMA_LOG_BACKUP_COUNT=${AIMA_LOG_BACKUP_COUNT:-10}
  - AIMA_LOG_COMPRESS=${AIMA_LOG_COMPRESS:-true}
  - AIMA_LLM_BASE_URL
  - AIMA_LLM_PROVIDER_NAME
  - AIMA_LLM_MODEL
  - AIMA_TIKHUB_ENABLED
  - AIMA_TIKHUB_BASE_URL
  - AIMA_TIKHUB_SECRET_REF

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile
  target: backend
  args:
    AIMA_BUILD_PYTHON_IMAGE: ${AIMA_BUILD_PYTHON_IMAGE:-docker.1ms.run/library/python:3.14.7-slim-trixie}
    AIMA_BUILD_UV_IMAGE: ${AIMA_BUILD_UV_IMAGE:-ghcr.1ms.run/astral-sh/uv:0.12.3}
    AIMA_BUILD_DEBIAN_MIRROR: ${AIMA_BUILD_DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
    AIMA_BUILD_DEBIAN_SECURITY_MIRROR: ${AIMA_BUILD_DEBIAN_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
    AIMA_BUILD_PYPI_INDEX: ${AIMA_BUILD_PYPI_INDEX:-https://mirrors.aliyun.com/pypi/simple}

x-backend-service: &backend-service
  image: aima-ugc-backend:${AIMA_IMAGE_TAG:-internal-v1a}
  build: *backend-build
  environment: *backend-environment
  group_add:
    - "11001"
  volumes:
    - type: bind
      source: ${AIMA_HOST_ROOT:-/data/AIMA_UGC}/runtime/data
      target: /app/data
    - type: bind
      source: ${AIMA_HOST_ROOT:-/data/AIMA_UGC}/runtime/logs
      target: /app/logs
    - type: bind
      source: ${AIMA_HOST_ROOT:-/data/AIMA_UGC}/shared/secrets
      target: /run/internal-secrets
      read_only: true
  networks:
    - app

services:
  bootstrap:
    image: aima-ugc-backend:${AIMA_IMAGE_TAG:-internal-v1a}
    build: *backend-build
    user: "0:0"
    command: ["python", "scripts/deploy/prepare_host.py", "--root", "/host", "--runtime-only"]
    volumes:
      - type: bind
        source: ${AIMA_HOST_ROOT:-/data/AIMA_UGC}/runtime/data
        target: /host/runtime/data
      - type: bind
        source: ${AIMA_HOST_ROOT:-/data/AIMA_UGC}/runtime/logs
        target: /host/runtime/logs
      - type: bind
        source: ${AIMA_HOST_ROOT:-/data/AIMA_UGC}/postgres
        target: /host/postgres
      - type: bind
        source: ${AIMA_HOST_ROOT:-/data/AIMA_UGC}/shared/secrets
        target: /host/shared/secrets
    restart: "no"
    network_mode: none

  postgres:
    image: ${AIMA_POSTGRES_IMAGE:-docker.1ms.run/library/postgres:18.4}
    environment:
      POSTGRES_DB: ${AIMA_DB_NAME:-aima_ugc}
      POSTGRES_USER: ${AIMA_DB_USER:-aima_ugc}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    group_add: ["11001"]
    volumes:
      - type: bind
        source: ${AIMA_HOST_ROOT:-/data/AIMA_UGC}/postgres
        target: /var/lib/postgresql
      - type: bind
        source: ${AIMA_HOST_ROOT:-/data/AIMA_UGC}/shared/secrets
        target: /run/secrets
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [app]

  migrate:
    <<: *backend-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  configure:
    <<: *backend-service
    command: ["python", "-m", "aima_ugc.entrypoints.internal_v1_configure_main"]
    secrets: [tikhub_api_key, llm_api_key]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *backend-service
    command: ["uvicorn", "aima_ugc.entrypoints.api_main:app", "--host", "0.0.0.0", "--port", "8090"]
    secrets: [llm_api_key]
    expose: ["8090"]
    depends_on:
      configure:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    init: true
    restart: unless-stopped

  worker:
    <<: *backend-service
    command: ["python", "-m", "aima_ugc.entrypoints.worker_main"]
    secrets: [tikhub_api_key, llm_api_key]
    depends_on:
      configure:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  scheduler:
    <<: *backend-service
    command: ["python", "-m", "aima_ugc.entrypoints.scheduler_main"]
    depends_on:
      configure:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  frontend:
    image: aima-ugc-frontend:${AIMA_IMAGE_TAG:-internal-v1a}
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        AIMA_BUILD_NODE_IMAGE: ${AIMA_BUILD_NODE_IMAGE:-docker.1ms.run/library/node:24.19.0-bookworm-slim}
        AIMA_BUILD_NGINX_IMAGE: ${AIMA_BUILD_NGINX_IMAGE:-docker.1ms.run/library/nginx:1.30.4-alpine3.24}
        AIMA_BUILD_NPM_REGISTRY: ${AIMA_BUILD_NPM_REGISTRY:-https://registry.npmmirror.com}
    ports:
      - "${AIMA_HTTP_BIND_IP:-127.0.0.1}:${AIMA_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    init: true
    restart: unless-stopped
    networks: [app]

secrets:
  tikhub_api_key:
    environment: AIMA_TIKHUB_API_KEY
  llm_api_key:
    environment: AIMA_LLM_API_KEY

networks:
  app:
    driver: bridge