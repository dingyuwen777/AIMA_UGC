[project]
name = "aima-ugc"
version = "0.1.0"
description = "AIMA_UGC 舆情监控系统"
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "psycopg==3.3.4",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.2",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
    "types-openpyxl==3.1.5.20260518",
]

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend/src"
module-name = "aima_ugc"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
