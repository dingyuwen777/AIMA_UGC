# Windows Docker Desktop 原生宿主存储覆盖。
#
# 仅与根 compose.yaml 叠加使用；不复制业务 Runtime 定义。
# Artifact 与应用日志保留 AIMA_HOST_ROOT bind mount，便于开发机直接查看；
# PostgreSQL / 内部 Secret 继续使用 Docker-managed named volumes，
# 避免 Windows 文件共享层承担严格 Linux owner/mode 语义。

x-windows-backend-volumes: &windows-backend-volumes
  - type: bind
    source: ${AIMA_HOST_ROOT:-/data/AIMA_UGC}/runtime/data
    target: /app/data
  - type: bind
    source: ${AIMA_HOST_ROOT:-/data/AIMA_UGC}/runtime/logs
    target: /app/logs
  - type: volume
    source: windows_internal_secrets
    target: /run/internal-secrets
    read_only: true

services:
  bootstrap:
    command:
      - python
      - scripts/deploy/prepare_host.py
      - --root
      - /host
      - --runtime-only
      - --runtime-bind-compatible
    volumes:
      - type: bind
        source: ${AIMA_HOST_ROOT:-/data/AIMA_UGC}/runtime/data
        target: /host/runtime/data
      - type: bind
        source: ${AIMA_HOST_ROOT:-/data/AIMA_UGC}/runtime/logs
        target: /host/runtime/logs
      - type: volume
        source: windows_postgres
        target: /host/postgres
      - type: volume
        source: windows_internal_secrets
        target: /host/shared/secrets

  postgres:
    volumes:
      - type: volume
        source: windows_postgres
        target: /var/lib/postgresql
      - type: volume
        source: windows_internal_secrets
        target: /run/secrets
        read_only: true

  migrate:
    volumes: *windows-backend-volumes

  configure:
    volumes: *windows-backend-volumes

  api:
    volumes: *windows-backend-volumes

  worker:
    volumes: *windows-backend-volumes

  scheduler:
    volumes: *windows-backend-volumes

volumes:
  windows_postgres:
  windows_internal_secrets:
