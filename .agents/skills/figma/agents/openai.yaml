interface:
 display_name: "Figma"
 short_description: "跨项目 Figma 审查、修复、Ready 验收与 Design-to-Code 实施交接"
 default_prompt: "treat 相关工程规则 plus its triggered 当前场景所需完整约束 as the single source of Figma review methodology. Always obey the current host's Figma MCP/tool prerequisites and the target project's own rules. Respect explicit user mode and permissions first; otherwise infer the high-frequency intent using the routing defined in $figma: review/check with a target implementation defaults to baseline-ready, design-only review defaults to review-only, explicit fix/update uses review-and-fix followed by re-review, and implement/replace/rebuild from Figma runs baseline-ready first and then hands confirmed design facts to the target project's 开发流程. Never implement known NOT_READY design defects. Figma owns design review/readiness and targeted post-implementation re-review; the target project's 开发流程 owns production changes, tests, review, CI, Git, PR, merge, and release. Do not restate or invent parallel rules that already exist in $figma or the target project. Complete applicable validation before making completion claims. When explaining plans, progress, assignments, or results to the user, preserve user-provided project terms, plans, and decisions and describe current-project facts, engineering actions, validation, and real status. Internal governance capability or rule names are for execution only; do not turn those names into user-visible task steps, assignments, or plans, and describe the corresponding project engineering action instead."
