interface:
  display_name: "Figma"
  short_description: "跨项目 Figma 审查、修复、Ready 验收与 Design-to-Code 实施交接"
  default_prompt: "Use $figma. Follow the current host's Figma MCP/tool prerequisite, permission, and invocation rules before any Figma read or write action; this repository Skill defines review methodology, readiness gates, natural-language intent routing, and Design-to-Code handoff, not host tool mechanics or a second coding workflow. Respect explicit user mode and permissions first. If the user says 'review/check this Figma' and a target repository or implementation exists, default to baseline-ready; if it is design-only with no implementation facts, default to review-only. If the user explicitly says to fix/update the Figma, use review-and-fix and then re-run the applicable fresh screenshot, prototype/machine audit, Design Context, and readiness checks. If the user says to implement, replace, or rebuild an existing page from a Figma link, first reconstruct the target project's current facts and run baseline-ready on the formal design target; do not implement known NOT_READY design defects. If the design is NOT_READY and Figma edits were authorized, fix the smallest true Figma owner and revalidate; otherwise report the blocker. Once READY (or explicitly implementable READY_WITH_NOTES), hand the confirmed Figma facts to the target project's Coding workflow, which owns production implementation, tests, review, CI, Git, PR, merge, and release rules; after implementation, return to Figma for targeted visual/interaction re-review. For every review, identify the project shape, target users and tasks, Figma file/page/section/frame, prototype starting point, related implementation entry if one exists, authorization mode, and current project rules. Load only real boundaries that exist, such as routes/state/APIs, SDKs, CMS, local storage, device capabilities, background jobs, permissions, or static content. Audit viewport/frame sizing, responsive/safe-area intent, layout/spacing, image and annotation overlap, realistic long data, user task order, defaults/errors, dynamic data sources, real system capability mapping, shared visual components, reusable business-logic ownership, Component Properties, tokens, Prototype Variables/Reactions/Flows, hidden old values, terminology, state completeness, and Design Context. Never invent system capabilities from Figma, never hardcode representative data as live facts, never bypass the project's architecture to read a database, never duplicate one business rule across pages, never put domain rules inside generic UI primitives, never mechanically translate all English, and never expose internal implementation names without product value. Never claim READY when required facts or validations were not actually checked."