interface:
  display_name: "Figma"
  short_description: "跨项目 Figma 审查、修复、Ready 验收与 Design-to-Code 实施交接"
  default_prompt: "Use $figma and treat SKILL.md plus its triggered references as the single source of Figma review methodology. Always obey the current host's Figma MCP/tool prerequisites and the target project's own rules. Respect explicit user mode and permissions first; otherwise infer the high-frequency intent using the routing defined in $figma: review/check with a target implementation defaults to baseline-ready, design-only review defaults to review-only, explicit fix/update uses review-and-fix followed by re-review, and implement/replace/rebuild from Figma runs baseline-ready first and then hands confirmed design facts to the target project's Coding workflow. Never implement known NOT_READY design defects. Figma owns design review/readiness and targeted post-implementation re-review; the target project's Coding workflow owns production changes, tests, review, CI, Git, PR, merge, and release. Do not restate or invent parallel rules that already exist in $figma or the target project."