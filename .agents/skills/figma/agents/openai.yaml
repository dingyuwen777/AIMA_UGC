interface:
  display_name: "Figma"
  short_description: "事实驱动的 Figma 原型审查、修复与 Design-to-Code 基线验收"
  default_prompt: "Use $figma. First identify the Figma file/page/section/frame, prototype starting point, related route/feature, authorization mode, and current repository rules. If .agents/skills/coding/SKILL.md exists, read it before repository-related work and treat Coding plus its triggered references as the single source of development workflow rules. Reconstruct current facts from the relevant frontend Page/Store/API, generated client, backend Contract/Capability/Scheduler/Provider/State Machine, and project Figma guide before judging the design. Distinguish design facts, business machine facts, server runtime facts, and representative Figma examples. Audit real component reuse, Component Properties, design tokens, Prototype Variables/Reactions/Flows, hidden old values, overlays/scroll/absolute positioning, user-visible terminology, backend capability mapping, state completeness, Target IA vs real routes, and Codex Design Context. Never invent backend capabilities from Figma, never hardcode example data as server facts, never mechanically translate all English when version/model/product terms have real user value, and never expose backend implementation names to ordinary users without product value. Default to review-only. In review-and-fix, fix the smallest true Figma owner, then re-run fresh screenshot, machine/prototype audit, and Design Context checks. In baseline-ready, return only READY, READY_WITH_NOTES, or NOT_READY with evidence; never claim READY if required facts or validations were not actually checked. If a production code issue is found, return to Coding rather than silently changing code under Figma rules; if docs need synchronization and a Docs Skill exists, route through Docs."