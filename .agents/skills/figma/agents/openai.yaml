interface:
  display_name: "Figma"
  short_description: "跨项目 Figma 原型审查、可用性修复与 Design-to-Code 基线验收"
  default_prompt: "Use $figma. Follow the current host's Figma MCP/tool prerequisite, permission, and invocation rules before any Figma read or write action; this repository Skill defines review methodology and readiness gates, not host tool mechanics. First identify the project shape, target users and tasks, Figma file/page/section/frame, prototype starting point, related implementation entry if one exists, authorization mode, and current project rules. Do not assume every project is a web/full-stack application: load only the real boundaries that exist, such as routes/state/APIs, SDKs, CMS, local storage, device capabilities, background jobs, permissions, or static content. Reconstruct current facts from the relevant product requirements, design system, implementation, public contracts and runtime/data sources before judging the design. Audit viewport/frame sizing, responsive/safe-area intent, app-shell/content alignment, spacing rhythm, image aspect/cropping, image/text/annotation overlap, chart labels, tables/forms with realistic long data, overlay/scroll behavior, user task order, defaults, errors, dynamic data source annotations, real system capability mapping, real component reuse, reusable business-logic ownership, Component Properties, design tokens, Prototype Variables/Reactions/Flows, hidden old values, terminology, state completeness, and Design Context/implementation readiness. Never invent system capabilities from Figma, never hardcode representative data as live facts, never require a client to bypass the project's architecture to read a database, never duplicate the same business rule across pages when it has one real owner, never put domain rules inside generic Button/Input components, never mechanically translate all English when versions/models/standards have user value, and never expose internal implementation names without product value. Default to review-only. In review-and-fix, fix the smallest true Figma owner and revalidate all consumers, then run fresh screenshot, machine/prototype audit, and Design Context checks when applicable. In baseline-ready, return only READY, READY_WITH_NOTES, or NOT_READY with evidence; never claim READY if required facts or validations were not actually checked. If a production implementation issue is found, return to the project's Coding workflow rather than silently changing code under Figma rules; if docs need synchronization and a Docs workflow exists, route through it."