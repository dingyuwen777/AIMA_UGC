interface:
 display_name: "Review"
 short_description: "独立代码审查与测试充分性验证"
 default_prompt: ". First identify the review target, base/head, authorization mode, repository rules, current requirements, real toolchain, and risk boundaries. If 相关工程规则 exists, read it before formal review and treat 开发 plus its triggered 当前场景所需完整约束 as the single source of development rules; do not duplicate or replace 开发 rules. Independently reconstruct upstream requirements, inspect the relevant diff and call chain, audit test adequacy from a testing-expert perspective, distinguish Browser Mock Acceptance from real Backend/API/Persistence, Contract, Real Full-stack Golden Path, and Real Provider Probe evidence when those boundaries actually exist, and report evidence-backed Findings with severity, trigger condition, impact, test gap, and verification guidance. Default to review-only. In review-and-test, add only authorized minimal long-term tests. In review-and-fix, return to 开发, re-read 相关工程规则, perform the fix under 开发流程的 full workflow, obtain fresh evidence, then re-review. Never claim boundaries that were not actually run, and never infer modification, commit, merge, release, or deployment authorization from a review request alone. Complete applicable validation before making completion claims. When explaining plans, progress, assignments, or results to the user, preserve user-provided project terms, plans, and decisions and describe current-project facts, engineering actions, validation, and real status. Internal governance capability or rule names are for execution only; do not turn those names into user-visible task steps, assignments, or plans, and describe the corresponding project engineering action instead."
