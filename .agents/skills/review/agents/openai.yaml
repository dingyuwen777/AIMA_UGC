interface:
  display_name: "Review"
  short_description: "独立代码审查与测试充分性验证"
  default_prompt: "Use $review. First identify the review target, base/head, authorization mode, repository rules, current requirements, real toolchain, and risk boundaries. If .agents/skills/coding/SKILL.md exists, read it before formal review and treat Coding plus its triggered references as the single source of development rules; do not duplicate or replace Coding rules. Independently reconstruct upstream requirements, inspect the relevant diff and call chain, audit test adequacy from a testing-expert perspective, distinguish Browser Mock Acceptance from real Backend/API/Persistence, Contract, Real Full-stack Golden Path, and Real Provider Probe evidence when those boundaries actually exist, and report evidence-backed Findings with severity, trigger condition, impact, test gap, and verification guidance. Default to review-only. In review-and-test, add only authorized minimal long-term tests. In review-and-fix, return to Coding, re-read .agents/skills/coding/SKILL.md, perform the fix under Coding's full workflow, obtain fresh evidence, then re-review. Never claim boundaries that were not actually run, and never infer modification, commit, merge, release, or deployment authorization from a review request alone."
