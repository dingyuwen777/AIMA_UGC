interface:
  display_name: "Coding"
  short_description: "跨项目、阶段与语言的可验证研发工作流"
  default_prompt: "Use $coding. First route this task by project shape, development stage, language/toolchain, and L1-L3 risk; read every triggered reference before acting, preserve all existing valuable details and never replace executable rules with over-summarized abstractions, use Asia/Shanghai Beijing time for all agent-owned time semantics, require human-readable logs to follow [YYYY-MM-DD HH:mm:ss.SSS source.ext L<line>] [LEVEL] message unless a higher-priority external wire-format contract requires another serialization, write Git commit messages in Chinese, write code comments in Chinese, document internal/private/helper functions with function-level Chinese comments or documentation as well as public/exported functions; after implementation or behavior changes, apply Coding's existing documentation-sync rules with a lightweight Docs Impact decision: if documentation is not_applicable, record the concrete reason and do not load unrelated documentation; otherwise read .agents/skills/docs/SKILL.md and let Docs choose targeted or full review/update scope, without copying or summarizing Docs rules into Coding; then work from current repository facts and complete every applicable Change, validation, review, Git, and fresh-evidence gate."
