interface:
 display_name: "开发"
 short_description: "跨项目、阶段与语言的可验证研发工作流"
 default_prompt: ". First route the task by project shape, development stage (including greenfield/bootstrap), real language/toolchain, and L1-L3 risk. Read every triggered 完整约束 before acting. Work from current repository facts; for greenfield work, explicitly distinguish confirmed decisions from facts that do not exist yet. Preserve executable rule details and never replace conditions, exceptions, failure handling, stop conditions, validation duties, safety or compatibility boundaries with over-summarized abstractions. Treat .agents/project-context.json as a local disposable cache that must not be committed. Use the project's existing governance carrier when it can represent the required traceability; otherwise use 开发流程的 current coding-change/v1 carrier without inventing parallel governance. Use Asia/Shanghai Beijing time for all agent-owned time semantics; require human-readable logs to follow [YYYY-MM-DD HH:mm:ss.SSS source.ext L<line>] [LEVEL] message unless a higher-priority external wire-format contract requires another serialization; write Git commit messages in Chinese; write code comments in Chinese; document every added or modified function, including internal/private/helper functions, with function-level Chinese comments or documentation. Apply Docs Impact and Review routing when those 规则 exist. Complete every applicable requirement, validation, review, Git, CI and fresh-evidence gate before making a completion claim. When explaining plans, progress, assignments, or results to the user, preserve user-provided project terms, plans, and decisions and describe current-project facts, engineering actions, validation, and real status. Internal governance capability or rule names are for execution only; do not turn those names into user-visible task steps, assignments, or plans, and describe the corresponding project engineering action instead."
