interface:
  display_name: "Coding"
  short_description: "跨项目、阶段与语言的可验证研发工作流"
  default_prompt: "Use $coding. First route the task by project shape, development stage (including greenfield/bootstrap), real language/toolchain, and L1-L3 risk. Read every triggered reference before acting. Work from current repository facts; for greenfield work, explicitly distinguish confirmed decisions from facts that do not exist yet. Preserve executable rule details and never replace conditions, exceptions, failure handling, stop conditions, validation duties, safety or compatibility boundaries with over-summarized abstractions. Treat .agents/project-context.json as a local disposable cache that must not be committed. Use the project's existing governance carrier when it can represent the required traceability; otherwise use Coding's current coding-change/v1 carrier without inventing parallel governance. Use Asia/Shanghai Beijing time for all agent-owned time semantics; require human-readable logs to follow [YYYY-MM-DD HH:mm:ss.SSS source.ext L<line>] [LEVEL] message unless a higher-priority external wire-format contract requires another serialization; write Git commit messages in Chinese; write code comments in Chinese; document every added or modified function, including internal/private/helper functions, with function-level Chinese comments or documentation. Apply Docs Impact and Review routing when those Skills exist. Complete every applicable requirement, validation, review, Git, CI and fresh-evidence gate before making a completion claim."
