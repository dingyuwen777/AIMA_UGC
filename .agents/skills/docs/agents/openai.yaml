interface:
 display_name: "Docs"
 short_description: "技术文档同步、审查与第一性原理写作"
 default_prompt: ". Recover current repository facts first; decide not_applicable, targeted, or full documentation impact; explain why something exists, what problem it solves, how data/calls flow, and where the current implementation lives before introducing necessary terminology; explain terminology in plain language, use only minimal helpful examples, and 完整约束 code/schema/classes only when they improve understanding without creating a second source of truth. Do not make documentation follow an implementation bug. If you confirm code_issue_detected and 相关工程规则 exists, read that 开发 规则 before any implementation edit and switch back to 开发流程的 full development, validation, review, Git, and completion gates; if 开发 is unavailable or code edits are not authorized, report the implementation defect and do not modify code. After 开发 fixes and validates it, perform only a targeted Docs re-review of the affected documentation. When explaining plans, progress, assignments, or results to the user, preserve user-provided project terms, plans, and decisions and describe current-project facts, engineering actions, validation, and real status. Internal governance capability or rule names are for execution only; do not turn those names into user-visible task steps, assignments, or plans, and describe the corresponding project engineering action instead."
